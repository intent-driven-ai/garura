schema: {name: stop-condition}
content:
  done:
    - id: D1
      says: "the drive's contract exists"
      check: {type: artifact_exists, path: "contract.json"}
    - id: D2
      says: "/intent proved its done check"
      check: {type: field_equals, file: "intent-done.json", field: done, equals: true}
    - id: D3
      says: "/vision proved its done check"
      check: {type: field_equals, file: "vision-done.json", field: done, equals: true}
    - id: D4
      says: "/understand proved its done check"
      check: {type: field_equals, file: "understand-done.json", field: done, equals: true}
    - id: D5
      says: "the checker passed"
      check: {type: field_equals, file: "check.yaml", field: verdict, equals: pass}
    - id: D6
      says: "the person decided every proposed intent, in their own words"
      check: {type: field_equals, file: "confirmation.yaml", field: by, equals: person}
    - id: D7
      says: "no question is left open when the drive ends"
      check: {type: field_equals, file: "rounds.json", field: open_left, equals: 0}
