schema: {name: stop-condition}
content:
  done:
    - id: D1
      says: "the drive's contract exists"
      check: {type: artifact_exists, path: "contract.json"}
    - id: D2
      says: "/intent proved its done check"
      check: {type: field_equals, file: "intent-done.json", field: done, equals: true}
    - id: D3
      says: "/vision proved its done check"
      check: {type: field_equals, file: "vision-done.json", field: done, equals: true}
    - id: D4
      says: "the checker passed"
      check: {type: field_equals, file: "check.yaml", field: verdict, equals: pass}
