# next stop condition — baked from reference/ice.md "### Done means" (#464/#466 Batch D;
# rebaked for the #533 simplification). Evaluated by scripts/check_stop_condition.py at
# Step C0 of the Standard Play Close — BEFORE the self-clean (C10) deletes the working
# folder; the verdict's durable copy is the evidence record. Paths are relative to the
# run's working folder (<working> = ${product_base}_status/next/).
schema: { name: stop-condition }
content:
  done:
    - id: D1
      says: "the ordered candidate set exists (ordered candidates + capped entries + inconsistency report)"
      check: { type: artifact_exists, path: "candidates.json" }
    - id: D2
      says: "the presented recommendation report exists"
      check: { type: artifact_exists, path: "recommendations.md" }
