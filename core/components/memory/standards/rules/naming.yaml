# naming.yaml — the machine half of the naming standard (standards/rules/naming.md, ADR 046, #736).
# lint-components reads this file; it holds no naming rule of its own.
industry_terms: [pr, mvp, nfr, rca, lld, kb, ice, ux, tech, ci, yaml, adr]
play:
  verbs:
    discover: Product -> Intent. Find what the product is.
    shape: Intent -> Design. Decide how a piece will be built.
    build: Design -> Code. Write the code.
    validate: Code -> Validation. Prove it works.
    release: Validation -> Run. Put it where people use it.
    learn: Run -> Product. Read what happened and correct the intent.
    start: Change. Open a unit of work.
    commit: Change. Commit the work.
    propose: Change. Raise it for review.
    check: Change. A person or a check looks at a change before it is accepted.
    merge: Change. Land it.
    fix: Change. Fix a defect.
    refactor: Change. Improve code without changing what it does.
    draft: Plan. Set out a new plan.
    show: Plan. Show one thing.
    update: Plan. Change a plan, in its file and the tracker together.
    list: Plan. Show many things.
    record: Record. Write a fact down for good.
    create: Harness. Make a new harness part.
    edit: Harness. Change a harness part.
    install: Harness. Put Garura into a project.
    uninstall: Harness. Take Garura out of a project.
  one_word: []
loop:
  verb: complete
  meaning: A loop runs its plays in rounds until its phase is complete. No play or skill starts with this verb.
skill:
  verbs:
    author: Write a document from inputs.
    infer: Read existing code and propose model pieces.
    derive: Compute a piece from the model or other pieces.
    scan: Read code mechanically and list what is there.
    check: Test against rules, pass or fail.
    judge: Give a verdict with reasons.
    assess: Rate risk or quality, with no verdict.
    find: Locate a thing in the model, memory or sources.
    link: Make links in the model.
    enrich: Add detail to a piece that exists.
    propose: Put forward something a person approves.
    research: Look outside, on the web.
    rank: Put options in order.
    recommend: Pick one option.
    collect: Gather many outputs into one.
    walk: Use a prototype the way its people would.
    deploy: Put a running increment on an environment.
    track: Read and change tracker issues.
    commit: Git — commit files.
    open: Git — open a pull request.
    merge: Git — merge a pull request.
    cut: Git — cut a branch.
  exceptions: [platform-adapter]
agent:
  roles: [keeper, reviewer, builder, operator, crafter, engineer, steward, resolver, checker, analyst, orchestrator, reader, auditor, scriber, architect, designer, manager, runner]
