# naming.yaml — the machine half of the naming standard (standards/rules/naming.md, ADR 046, #736;
# ADR 066, #1044). lint-components reads this file; it holds no naming rule of its own.
industry_terms: [pr, mvp, nfr, rca, lld, kb, ice, ux, tech, ci, yaml, adr, env, perf, uat]
play:
  # Five roles own the play verbs (ADR 066). A verb belongs to one role; a role can have several.
  roles:
    specifier: [specify, learn]
    designer: [design]
    builder: [build, fix, refactor]
    validator: [validate]
    orchestrator: [shape, reshape, view, list]
  # Verbs no role owns: the work plays, which anyone can run, the product plays, and release,
  # whose name and role are still open (ADR 066).
  no_role: [start, commit, review, merge, install, uninstall, release]
  verbs:
    specify: Specifier. Turn what a person gives into a spec — intents, domains, capabilities, the ontology.
    learn: Specifier. Read what happened in the run and correct the spec.
    design: Designer. Decide how a piece will be built.
    build: Builder. Make something new — code, a play, a loop.
    fix: Builder. Fix a defect, or change what a play or loop does.
    refactor: Builder. Improve code without changing what it does.
    validate: Validator. Prove a piece works.
    shape: Orchestrator. Make the plan that orders the work.
    reshape: Orchestrator. Change a plan, in its file and the tracker together.
    view: Orchestrator. Show one thing.
    list: Orchestrator. Show more than one thing.
    start: No role. Open a unit of work.
    commit: No role. Commit the work.
    review: No role. Raise the work for review.
    merge: No role. Land it.
    install: No role. Put Garura into a project.
    uninstall: No role. Take Garura out of a project.
    release: No role yet. Put it where people use it.
  one_word: []
loop:
  verb: loop
  phases: [product, spec, design, code, validation, run]
  meaning: A loop runs the plays of one transition between two phases in rounds until it is done, named loop-<from>-<to>. No play or skill starts with this verb.
skill:
  verbs:
    author: Write a document from inputs.
    infer: Read existing code and propose model pieces.
    derive: Compute a piece from the model or other pieces.
    scan: Read code mechanically and list what is there.
    check: Test against rules, pass or fail.
    judge: Give a verdict with reasons.
    assess: Rate risk or quality, with no verdict.
    find: Locate a thing in the model, memory or sources.
    link: Make links in the model.
    enrich: Add detail to a piece that exists.
    propose: Put forward something a person approves.
    research: Look outside, on the web.
    rank: Put options in order.
    recommend: Pick one option.
    collect: Gather many outputs into one.
    walk: Use a prototype the way its people would.
    deploy: Put a running increment on an environment.
    track: Read and change tracker issues.
    commit: Git — commit files.
    open: Git — open a pull request.
    merge: Git — merge a pull request.
    cut: Git — cut a branch.
    remove: Take a part out of the model or a plan out of the plans folder, and repoint what named it.
  exceptions: [platform-adapter]
agent:
  roles: [keeper, reviewer, builder, operator, crafter, engineer, steward, resolver, checker, analyst, orchestrator, reader, auditor, scriber, architect, designer, manager, runner]
