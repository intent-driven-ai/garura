# rename-map.yaml — old component name -> new name (harness standard, #734, ADR 046; ADR 066, #1044).
# Read by the old-name check (core/tools/naming/check_old_names.py) and by install-garura.
# A name mapped to `null` was removed with no successor: the check still reports it.
plays:
  intent: specify-intent
  vision: specify-domains
  understand: specify-capabilities
  grill: design-slice
  ux: design-surface
  arch: design-architecture
  quality: design-quality
  measure: shape-measure-lens
  run: design-env
  agentic: design-agentic
  marketing: shape-marketing-lens
  implement: build-work
  validate: validate-slice
  launch: validate-uat
  deploy: release-increment
  learn: learn-outcomes
  review-change: validate-work
  refactor: refactor-work
  # Removed with no successor (ADR 059, #920): the knowledge step is a step of the loop, not a play.
  # `null` keeps the old name caught by the old-name check; the install has no new name to lay.
  build-knowledge: null
  review-knowledge: null
  adr: design-adr
  play-creator: build-play
  play-editor: fix-play
  loop-creator: build-loop
  loop-editor: fix-loop
  focus: list-issues
  # #807: "feature" now means one thing a person can do (the old Functionality),
  # so the delivery plays take the epic and slice names.
  shape-features: design-slice
  build-feature: build-work
  validate-feature: validate-slice
  release-feature: validate-uat
  # ADR 066 (#1044): five roles own the play verbs — specifier, designer, builder, validator,
  # orchestrator; the work plays have no role. /shape-plan, /list-plans, /learn-outcomes,
  # /install-garura, /uninstall-garura and /release-increment keep their names.
  discover-intent: specify-intent
  discover-domains: specify-domains
  discover-capabilities: specify-capabilities
  edit-ontology: specify-ontology
  shape-slice: design-slice
  shape-eval: design-eval
  record-decision: design-adr
  shape-ux-lens: design-surface
  shape-run-lens: design-env
  shape-architecture-lens: design-architecture
  shape-quality-lens: design-quality
  shape-agentic-lens: design-agentic
  build-epic: build-work
  fix-bug: fix-work
  refactor-code: refactor-work
  create-play: build-play
  edit-play: fix-play
  create-loop: build-loop
  edit-loop: fix-loop
  check-change: validate-work
  validate-epic: validate-slice
  release-epic: validate-uat
  update-plan: reshape-plan
  show-plan: view-plan
  list-focus-issues: list-issues
  start-change: start-work
  commit-change: commit-work
  propose-change: review-work
  merge-change: merge-work
loops:
  discovery: loop-product-spec
  complete-discovery: loop-product-spec
skills:
  analyze-changes: assess-changes
  analyze-pr: assess-pr
  answer-from-source: find-answers-in-sources
  author-adr: author-decision
  author-hitl-scenarios: author-acceptance-scenarios
  author-intent-yaml: author-play-ice
  author-vision-seed: author-domains
  build-product-ontology: author-product-ontology
  close-model-gaps: link-model-gaps
  compute-blast-radius: derive-blast-radius
  create-commit: commit-files
  deploy-to-cloud-env: deploy-cloud-environment
  detect-test-harness: scan-test-harness
  draft-fix-design: author-fix-design
  draft-implementation-plan: author-implementation-plan
  draft-knowledge-page: author-knowledge-page
  draft-lld: author-lld
  draft-rca: author-rca
  draft-technical-approach: author-technical-approach
  draft-verification-scenarios: author-verification-scenarios
  generate-encrypted-evals: author-encrypted-evals
  kb-search: find-architecture-learnings
  manage-issue: track-issue
  manage-plan: author-plan-file
  map-test-surface: scan-test-surface
  plan-validation-checks: author-validation-checks
  quality-check: check-quality
  quality-check-scoped: check-pr-quality
  refine-quality-profile: enrich-quality-profile
  resolve-issues: find-matching-issues
  run-generated-tests-isolated: check-generated-tests
  run-quality-gates: check-quality-gates
  search-kb: find-work-placement
  setup-branch: cut-branch
  specify-baseline-tests: author-baseline-tests
  stand-up-launch-env: deploy-local-environment
  submit-pr: open-pr
  write-knowledge-brief: author-knowledge-brief
agents:
  env-operator: environment-operator
  loop-checker: result-checker
