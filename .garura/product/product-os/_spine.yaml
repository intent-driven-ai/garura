  slug: fn-design-chosen-work
  capability: cap-design-work
  intents:
  - bi-3
  status: proposed
  one_line: For the tree gathered under the item the technical lead names, designs
    each story, chore and spike in one design with a technical part, its components,
    classes, functions, data model, interfaces, libraries and patterns, drawn as diagrams
    a CTO can read, and a surface part, what a person sees and does there and how
    each screen will look, against the project's standards with the deployment design
    among them, and with no test in it.
  doc: software-delivery-planning/design-work/fn-design-chosen-work/feature.md
  depends_on: []
  identified_by: ''
  decisions: []
  metadata:
    created_by: 'product-os-keeper (reorganise business intents, #1021)'
    deepen: true
- id: fn-update-work-design
  slug: fn-update-work-design
  capability: cap-design-work
  intents:
  - bi-3
  status: proposed
  one_line: When the work, a project standard or what the build finds no longer matches
    the design, the technical lead confirms an update, and what held before stays
    readable with why it changed.
  doc: software-delivery-planning/design-work/fn-update-work-design/feature.md
  depends_on: []
  identified_by: ''
  decisions: []
  metadata:
    created_by: 'product-os-keeper (reorganise business intents, #1021)'
    deepen: true
- id: fn-write-failing-tests
  slug: fn-write-failing-tests
  capability: cap-build-work-test-first
  intents:
  - bi-3
  status: proposed
  one_line: Before any code, a test writer who is not the builder writes a code-level
    test for each expectation of each story under the chosen item, and the separate
    check shows each one fails because what it checks is not built yet.
  doc: software-delivery-planning/build-work-test-first/fn-write-failing-tests/feature.md
  depends_on: []
  identified_by: ''
  decisions: []
  metadata:
    created_by: 'product-os-keeper (reorganise business intents, #1021)'
    deepen: true
- id: fn-build-code-to-pass
  slug: fn-build-code-to-pass
  capability: cap-build-work-test-first
  intents:
  - bi-3
  status: proposed
  one_line: Once every test for the work has failed on the check's record, the builder
    writes all the code for the work under the chosen item from its own part, the
    collected context and the design, in the order it chooses, until a separate check,
    which runs the tests through a tool on the model or service the test model setting
    names, finds every test passing, then tidies the code where it needs it while
    every test stays passing, and never sees or changes a test.
  doc: software-delivery-planning/build-work-test-first/fn-build-code-to-pass/feature.md
  depends_on: []
  identified_by: ''
  decisions: []
  metadata:
    created_by: 'product-os-keeper (reorganise business intents, #1021)'
    deepen: true
- id: fn-write-usage-guide
  slug: fn-write-usage-guide
  capability: cap-build-work-test-first
  intents:
  - bi-3
  status: proposed
  one_line: With the build, the builder writes the slice's usage guide, what its surface
    is, how to reach it and the steps a person takes, in the plan's guides folder,
    without seeing the eval.
  doc: software-delivery-planning/build-work-test-first/fn-write-usage-guide/feature.md
  depends_on: []
  identified_by: ''
  decisions: []
  metadata:
    created_by: 'product-os-keeper (reorganise business intents, #1021)'
    deepen: true
- id: fn-update-tests-and-code
  slug: fn-update-tests-and-code
  capability: cap-build-work-test-first
  intents:
  - bi-3
  status: proposed
  one_line: When the design, a story or an eval's finding changes the work, the test
    writer updates the tests first and the check shows the new ones fail, then the
    builder changes the code until every test passes again.
  doc: software-delivery-planning/build-work-test-first/fn-update-tests-and-code/feature.md
  depends_on: []
  identified_by: ''
  decisions: []
  metadata:
    created_by: 'product-os-keeper (reorganise business intents, #1021)'
    deepen: true
- id: fn-understand-defect
  slug: fn-understand-defect
  capability: cap-fix-defects-test-first
  intents:
  - bi-3
  status: proposed
  one_line: From a defect reported anywhere, the developer who will write its tests
    finds the feature the defect breaks, the tests that already check that behaviour
    and why they pass, and the root cause, and writes only what the fix needs; a defect
    no feature covers is named as a new need and not fixed.
  doc: software-delivery-planning/fix-defects-test-first/fn-understand-defect/feature.md
  depends_on: []
  identified_by: ''
  decisions: []
  metadata:
    created_by: 'product-os-keeper (reorganise business intents, #1021)'
    deepen: true
- id: fn-write-defect-tests
  slug: fn-write-defect-tests
  capability: cap-fix-defects-test-first
  intents:
  - bi-3
  status: proposed
  one_line: Before any fix code, a test writer who is not the builder writes a code-level
    test for each wrong result the report names, and the separate check shows each
    one fails because the defect is there.
  doc: software-delivery-planning/fix-defects-test-first/fn-write-defect-tests/feature.md
  depends_on: []
  identified_by: ''
  decisions: []
  metadata:
    created_by: 'product-os-keeper (reorganise business intents, #1021)'
    deepen: true
- id: fn-fix-defect-code
  slug: fn-fix-defect-code
  capability: cap-fix-defects-test-first
  intents:
  - bi-3
  status: proposed
  one_line: The builder changes the code from the cause and what the fix changes until
    a separate check, which runs every test of the project through a tool on the model
    or service the test model setting names, finds them all passing, then tidies the
    code it changed while they stay passing; when a test still fails after the tries
    the project allows, the defect goes back to be understood again.
  doc: software-delivery-planning/fix-defects-test-first/fn-fix-defect-code/feature.md
  depends_on: []
  identified_by: ''
  decisions: []
  metadata:
    created_by: 'product-os-keeper (reorganise business intents, #1021)'
    deepen: true
- id: fn-run-slice-eval
  slug: fn-run-slice-eval
  capability: cap-test-product-with-evals
  intents:
  - bi-4
  status: proposed
  one_line: Once a slice's work is built, runs the slice's eval on it step by step
    with no agent, through the usage guide, in the testing environment, and gives
    every goal, expectation and failure condition it covers a pass or a fail, trusting
    a pass only when the build never saw the eval.
  doc: software-delivery-planning/test-product-with-evals/fn-run-slice-eval/feature.md
  depends_on: []
  identified_by: ''
  decisions: []
  metadata:
    created_by: 'product-os-keeper (reorganise business intents, #1021)'
    deepen: true
- id: fn-send-handoff-plan
  slug: fn-send-handoff-plan
  capability: cap-test-product-with-evals
  intents:
  - bi-4
  status: proposed
  one_line: For each failure the eval finds, writes what the product does wrong and
    the way back, from the recovery parts of the hidden file only, and sends it to
    the builder when the builder can fix it alone, or to a person when a person must
    decide.
  doc: software-delivery-planning/test-product-with-evals/fn-send-handoff-plan/feature.md
  depends_on: []
  identified_by: ''
  decisions: []
  metadata:
    created_by: 'product-os-keeper (reorganise business intents, #1021)'
    deepen: true
- id: fn-rerun-evals
  slug: fn-rerun-evals
  capability: cap-test-product-with-evals
  intents:
  - bi-4
  status: proposed
  one_line: When the built product changes, runs a slice's whole eval again after
    a fix and the evals of the slices that passed before, names each scenario that
    passed before and fails now, and hands a failure to a person once the rounds the
    project allows are used up.
  doc: software-delivery-planning/test-product-with-evals/fn-rerun-evals/feature.md
  depends_on: []
  identified_by: ''
  decisions: []
  metadata:
    created_by: 'product-os-keeper (reorganise business intents, #1021)'
    deepen: true
- id: fn-test-code-security
  slug: fn-test-code-security
  capability: cap-test-security
  intents:
  - bi-4
  status: proposed
  one_line: Once the work is built, tests the whole built code at rest, by a part
    that is not the builder, for weaknesses in how it is written, for libraries with
    known weaknesses and for any secret's value, and compares each result with the
    profile's pass bar and each capability's security need.
  doc: software-delivery-planning/test-security/fn-test-code-security/feature.md
  depends_on: []
  identified_by: ''
  decisions: []
  metadata:
    created_by: 'product-os-keeper (reorganise business intents, #1021)'
    deepen: true
- id: fn-test-running-security
  slug: fn-test-running-security
  capability: cap-test-security
  intents:
  - bi-4
  status: proposed
  one_line: Once the built work runs in the testing environment, tries on its declared
    surfaces what the pass bar and each capability's security need say to try, with
    the environment's made-up data and test accounts, and never touches anything outside
    that environment.
  doc: software-delivery-planning/test-security/fn-test-running-security/feature.md
  depends_on: []
  identified_by: ''
  decisions: []
  metadata:
    created_by: 'product-os-keeper (reorganise business intents, #1021)'
    deepen: true
- id: fn-send-security-findings
  slug: fn-send-security-findings
  capability: cap-test-security
  intents:
  - bi-4
  status: proposed
  one_line: Gives one verdict for the built work against the profile's security level,
    with a pass or a fail for every part of the pass bar and each capability's security
    need, and sends each finding back as a handoff plan to the developer when the
    builder can fix it alone, or to the product owner when a person must decide.
  doc: software-delivery-planning/test-security/fn-send-security-findings/feature.md
  depends_on: []
  identified_by: ''
  decisions: []
  metadata:
    created_by: 'product-os-keeper (reorganise business intents, #1021)'
    deepen: true
- id: fn-retest-security
  slug: fn-retest-security
  capability: cap-test-security
  intents:
  - bi-4
  status: proposed
  one_line: Runs the security tests again after a fix, when more work is built, and
    when an approved decision raises the security level, keeps each verdict, names
    what passed before and fails now, and sends a finding that keeps coming back to
    a person once the rounds the project allows are used up.
  doc: software-delivery-planning/test-security/fn-retest-security/feature.md
  depends_on: []
  identified_by: ''
  decisions: []
  metadata:
    created_by: 'product-os-keeper (reorganise business intents, #1021)'
    deepen: true
