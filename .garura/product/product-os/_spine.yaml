- id: cap-initialize
  slug: initialize
  domain: dom-software-delivery-planning
  intents: []
  status: proposed
  detail: detailed
  one_line: 'After the install, set a project up for Garura: its memory, its review
    rules, and its tracker''s work-item types.'
  doc: software-delivery-planning/initialize/capability.md
  nfr_needs:
    reliability:
      level: medium
      target: a second run with every answer unchanged and no Phoenix memory change
        changes 0 files in the project's memory, its rule-group record and its tracker;
        an install changes 0 files in any project's Garura memory
      gate: run initialize twice on a test project with the same answers and diff
        the memory folder, the rule-group record and the tracker's type list; install
        Garura and Phoenix again and diff the project's memory folder
    security:
      level: medium
      target: 0 writes to the tracker or the type mapping before the product owner's
        typed yes; 0 writes to Phoenix memory or another project's memory from initialize;
        every type made is named in the run's record
      gate: run initialize on a test GitHub organization with a missing type, answer
        no, and check the tracker's type list and the mapping are unchanged; answer
        yes and check the record names each type made; initialize two test projects
        and diff Phoenix memory and the other project's memory before and after
    maintainability:
      level: medium
      target: a new tracker (Jira, Linear) is added by one entry in the adapter with
        0 changes to any play; the plays read only the type mapping
      gate: 'review of the change that adds the second tracker: its diff touches the
        adapter and no play'
  compliance_needs: []
  decisions:
  - dec-cap-initialize-security-none-medium
