  slug: fn-test-under-load
  capability: cap-test-performance
  intents:
  - bi-4
  status: proposed
  one_line: When the pass bar or a capability's performance need names a load, puts
    that load on the running build with made-up users, in the environment the deployment
    design places the load tests in and at its declared size, measures what the bar
    names under it, and never sends load outside that environment.
  doc: software-delivery-planning/test-performance/fn-test-under-load/feature.md
  depends_on: []
