  slug: fn-keep-evals-from-builder
  capability: cap-write-work-evals
  intents:
  - bi-3
  status: proposed
  one_line: Checks that no part that builds the work is given the evals, and records
    in the build run's evidence each build session that read their folder.
  doc: software-delivery-planning/write-work-evals/fn-keep-evals-from-builder/feature.md
