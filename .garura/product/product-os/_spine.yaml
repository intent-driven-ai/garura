  slug: fn-test-running-speed
  capability: cap-test-performance
  intents:
  - bi-4
  status: proposed
  one_line: Once the built work runs in the testing environment, measures on each
    declared surface, by a part that is not the builder, what the pass bar and each
    capability's performance need name, as one person or one other system meets the
    product there, and records each figure with the conditions it was measured in.
