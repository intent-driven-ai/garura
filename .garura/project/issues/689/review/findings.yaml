- category: harness
  id: H1
  severity: P2
  file: core/components/skills/close-model-gaps/SKILL.md (with agents/product-os-keeper.md and drives/_shared/drive-run.md
    R5 step 7)
  summary: 'close-model-gaps, run through product-os-keeper by the drive, edits the shared spine, moves pages and deletes
    merged-duplicate nodes and pages. The keeper''s NEVER list (unchanged by this branch) still forbids writing a shared model
    file and removing a node. The skill declares no write scope, and the drive runs no scoped-write guard or clean-tree check
    around it; the round commit just adds the whole product-os folder (--also product-os). The agent definition and the new
    skill now contradict each other, and the live-model write has none of the containment direct-model-write requires.

    '
  basis: PR2 (direct-model-write.md rules 3,4,7; ADR 026) and PR3 (product-os-keeper Boundaries on main). Relies on ADR 043
    section 4 to justify the keeper doing this; ADR 043 does not amend the keeper boundary or the rule.
- category: harness
  id: H2
  severity: P3
  file: core/components/memory/standards/rules/direct-model-write.md (not changed; contradicted by drives/_shared/drive-run.md
    R5 and drive-contract.md)
  summary: 'Rule 7 on main says each model-writing play commits its own model delta so the next play sees a clean tree. The
    drive now commits once per round and plays no longer commit before the next starts. ADR 026 was edited in the diff, but
    the standard that expresses it was not, and is not named in ADR 043''s Affects list. Two standards now say opposite things.

    '
  basis: PR2, direct-model-write.md rule 7 on main.
- category: harness
  id: H3
  severity: P3
  file: core/components/plays/drive-creator/SKILL.md; core/components/plays/drive-editor/scripts/lint_drive.py
  summary: 'Both still define a drive as running plays "in a fixed order" and lint "N plays, in order". The Kickoff drive
    and drive-run.md now say no play waits for or takes another''s output, and the order is only the run order. ADR 043 lists
    the drive compiler and editor lint (and write_drive_contract.py) under Affects, but they are not in the diff. The compiler
    can regress this change on the next rebuild.

    '
  basis: 'PR5 (durability: compiler must reproduce what the compiled drive says; CLAUDE.md Play Pipeline Rules durability
    rule). Relies on ADR 043 Affects list.'
- category: harness
  id: H4
  severity: P3
  file: core/components/drives/_shared/drive-run.md (Documents first, R4b, R5 step 7)
  summary: 'The shared drive run now itself runs the capture script, takes the person''s write-up, and orchestrates prototype
    reading and model-gap closing, and borrows the intent play''s scripts by relative path (../intent/scripts/). That is rule
    content in the drive. ADR 043 amends ADR 029 sections 6 and the input, but not section 2 ("no rules of its own").

    '
