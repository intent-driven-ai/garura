ice_impact: >-
  Agent intents change for /intent, /vision, /understand, the Kickoff drive, and the prototype-reader agent.
  /intent drafts the business intents from the shared capture and the write-up. /vision writes the domains and
  capabilities from the screens and research, never from /intent's output. /understand writes the functionalities
  from the screens, whether or not their capability exists yet. Each links only what it can see. The Kickoff drive
  takes the write-up, runs its plays in no fixed order, runs the connect step after each round, gives the missing work
  to the play that does it, and loops until every node is connected and covered or the round limit. The connect step
  is a new member play with its own intent. The prototype-reader plans its walk from the walkthrough. ICE workability
  (check_ice_workable.py) also needs attribution. The ICE kind keeps its shape.

business_intent_check: none
business_intent_check_why: >-
  A framework decision on how the model is written and how a drive runs. No person's business intent changes, and
  the Business Intent kind's rules stand: only a person confirms or drops one (ADR 031), and work starts only from an
  ICE built from a confirmed intent. The readiness rule widens for the node kinds (capability, functionality) and ICE,
  not for the Business Intent kind.

