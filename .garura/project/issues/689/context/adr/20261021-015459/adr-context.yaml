amends:
  - adr: "029"
    part: >-
      §6 "The first drive: Kickoff" — "It runs /intent → /vision → /understand" and the table: /vision no longer
      "takes those intents as its business goal" and /understand no longer "runs once for every capability /vision
      seeded"; each reads the prototype's shared capture and the write-up itself, none from another play's output.
      And "The prototype is the input": the input is the prototype plus the person's short write-up (five parts).
    judged_from: "docs/adr/029-drives.md §6 (read in full)"
  - adr: "031"
    part: >-
      §3 "ICE is placed at once; the domain comes later" — widened: a functionality may also be written before its
      capability, in a holding folder functionalities/<id>/, as a capability may wait for its domain. And §2's
      "Drift is found and fixed by an Alignment drive" — inside a drive, the drive's connect step finds and connects
      what its plays wrote. Whether the Alignment drive is still needed for drift outside a drive is not decided here.
    judged_from: "docs/adr/031-business-intent-and-ice.md §2, §3 (read in full)"
  - adr: "033"
    part: >-
      §4 "Approval follows links" — widened: a node is not approved and not workable until it is attributed
      (functionality → capability → domain, its ICE → a confirmed business intent). This also widens ADR 031 §4 as
      ADR 033 already amended it (workable = ICE, node and intent approved; now also attributed).
    judged_from: "docs/adr/033-approval-in-the-product-model.md §4, §8 (read in full)"
  - adr: "041"
    part: >-
      §1 "A drive runs its plays in rounds until its job is done" — "A round runs every play of the drive, in order.
      The next round gives each play what the others found … It stops when its done check holds": the plays run with
      no order (side by side allowed); after each round the connect step connects the nodes and finds the missing work;
      the next round runs only the plays that work is given to, on exactly that work; the drive goes on until every
      node is connected and nothing on the screens is uncovered, or until its round limit, then briefs the person
      (ADR 042). And §4 "Member plays" (as amended by ADR 042): the connect step is a member play too.
    judged_from: "docs/adr/041-a-drive-runs-in-rounds-and-owns-its-questions.md §1, §4 (read in full)"
  - adr: "042"
    part: >-
      its line on ADR 041 §4 under "What this changes in older ADRs" — "the member plays that run only inside a drive
      are now the three knowledge plays": the connect step joins them. §1–§4 (the knowledge plays and the brief) stand.
    judged_from: "docs/adr/042-a-drive-finds-builds-and-reviews-the-knowledge-it-lacks.md (read in full)"
  - adr: "026"
    part: >-
      Decision, "Clean tree in, committed delta out" — inside a drive, plays may run side by side, their writes to the
      one shared spine file are made in turn, and the drive commits the round once, instead of each play committing its
      own model delta before the next play starts.
    judged_from: "docs/adr/026-direct-to-model-writes.md, Decision, consequent mechanics (read)"
    note: "Not named by the coordinator; found while checking part 4 against ADR 026 and drive-contract.md rule 3. The person accepting should check it."

