    title: 'Two moves into one folder are refused when the folder is spelled the same; a folder spelled with different letter case still loses a page on a case-insensitive file system'
    basis: >-
      pr.md severity bucket P1 ("data-loss") lowered one step to P2 by the preconditions below; playbook review/code
      Treatment ("review the data-safety ... paths hard") and Rubric ("safe handling of destructive/irreversible
      operations"); the script's own contract, link_part.py lines 73-74 ("Every check runs before the first write; any
      failure refuses the whole request") and the claim in the fix commit that plan_move refuses a move when another
      part already uses the new folder. No taxonomy row fires (garura-prose).
    evidence: >-
      FIXED part, run on scratch models against the pre-fix script and the fixed one. fn-a and fn-b both moved to
      capabilities/cap-1/shared/feature.md: pre-fix exit 0 and one page lost; fixed exit 2, tree unchanged, stderr
      "fn-b: capabilities/cap-1/shared is already the folder of fn-a; two parts never share a folder". The result does
      NOT depend on request order: order a,b and order b,a are both refused (the second-listed part is the one named);
      three parts where two share (a to x, b to y, c to x) refused; two parts each with an ice.md refused; one with and
      one without an ice.md refused; the path spelled with a leading slash or a trailing slash is refused (the slashes are
      stripped, so the same folder is seen); a spelling with a doubled slash or "./" is refused as "outside its folder"
      by allowed_docs, before and after the fix. A move into the folder of a NEW part written in the same request (its
      page is on disk) is refused in both orders, by the older "already holds a file" check at 273, in the pre-fix script
      too. In every refusal I saw, `sharing` was not empty (the message names a part, never "a page this request writes"), so
      the two extra clauses `new_full in pages` and `new_ice_full in pages` were never the only reason. By reading, they cannot
      be: a pending write is either an existing page (so its folder is not empty and the disk check at 273 refuses first) or an
      earlier move's target (whose part is then in `sharing`). Mutants agree: `sharing` alone and the `pages` clauses alone both
      pass the new test, and with neither it fails, so the test cannot tell the two halves apart.
      Cases that must still work behave as before the fix (identical exit and tree to the pre-fix script): one move; two
      moves to two folders; two moves to two folders each with an ice.md; a re-file (capability cap-2 with doc under cap-2).
      The fix is not a new over-refusal. A move into the folder another part vacates in the same request is refused,
      in either order, by the disk check at 273 and was refused by the pre-fix script too, so it is not a regression
      (the categories list it among the cases that must still work; it never did).
      RESIDUAL, reproduced on this machine (APFS, case-insensitive; a touch of CaseProbe is found as caseprobe): fn-a to
      capabilities/cap-1/shared/feature.md and fn-b to capabilities/cap-1/Shared/feature.md: fixed script exit 0, no
      warning; one page on disk, with fn-b's text ("FN-B content"); fn-a's text is on disk nowhere; the spine holds fn-a
      at .../shared/ and fn-b at .../Shared/. The cause: `sharing` compares the two folder strings for equality (276-277)
      and `pages` is keyed by realpath strings (os.path.realpath does not fold case for a path that is not there yet), so
      shared and Shared are two folders to the check and one folder to the file system when write_all writes the second
      page over the first. Run in one order only (shared then Shared); the compare is symmetric.
    precondition: >-
      Two parts in one request whose new folder names differ only in letter case, on a case-insensitive file system
      (macOS default, Windows). Callers derive the folder from a slug or an id, so a request like this is unlikely; the
      model is committed in git, so the lost page can be got back from history. The script still reports success.
      The same family (not run): names that differ only in Unicode normalisation (NFC and NFD), which APFS also folds.
    fix_hint: >-
      compare folders and page paths with `.casefold()` (and NFC-normalise) in the `sharing` test and for the `pages`
      keys, or refuse in write_all when two write paths are the same file once the first is written (os.path.samefile).
      Add the case-variant to test_two_moves_to_one_folder_in_one_request_are_refused (505-515).

