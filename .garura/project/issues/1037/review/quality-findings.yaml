  - id: R-1
    class: P1
    category: executable-code
    file: core/components/skills/link-model-part/scripts/link_part.py
    lines: '254-298 (cause at 296-297; the only collision check is on disk, 270)'
    title: 'Two moves to the same new path in one request silently destroy a page (exit 0)'
    basis: >-
      pr.md severity bucket P1 ("data-loss"); playbook review/code Treatment ("review the data-safety ...
      paths hard") and Rubric ("safe handling of destructive/irreversible operations"); the script's own
      contract, link_part.py lines 73-74 ("Every check runs before the first write; any failure refuses the
      whole request"). No taxonomy row fires (garura-prose).
    evidence: >-
      plan_move checks the new folder against the disk only (line 270), then does pages[n_full] = text
      (296) and deletes the old file (297). Two parts that name the same new doc both pass, the second
      write replaces the first in `pages`, and both old files are deleted. Reproduced in a scratch model
      (copy of the script): fn-a and fn-b both moved to capabilities/cap-1/shared/feature.md gave exit 0,
      no warning, one page on disk (fn-b's), fn-a's text ("AAA content") on disk nowhere, and both spine
      entries pointing at the same doc.
    precondition: >-
      The request must name the same target doc for two parts. That is a bad request, not the normal path,
      and the model is committed in git, so the lost page can be got back from history. The script still
      reports success. The caller may weigh the class with this in view.
    fix_hint: 'refuse when n_full is already a key of `pages` (or already a move target) before the second part is planned'

  - id: R-2
    class: P2
    category: executable-code
    file: core/components/skills/link-model-part/scripts/link_part.py
    lines: '510-524 (the undo); 550-552 (the message)'
    title: 'The undo is not best-effort: a failure while restoring skips the rest, hides the first error, and the run still says every file is back'
    basis: >-
      playbook review/code Rubric ("error handling", "safe handling of destructive/irreversible
      operations"); pr.md P2 bucket ("error-handling violations"); contract lines 73-75 ("every file
      already written is put back as it was").
    evidence: >-
      The except OSError block runs its restores in a row with no try around each. Reproduced: with the
      old folder read-only, os.remove of the old page fails; the undo then tries atomic_write of that
      page into the same read-only folder, which fails, and the remaining restores never run. Result: exit
      2, the spine rewritten to the new doc, the new pages left on disk, the old pages still there, and
      stderr "a write failed, every file is back as it was" followed by the undo's own temp-file error,
      not the delete error that started it. Credit: for a failure at the rmdir step (parent folder
      read-only), and for a second rmdir failing after a first succeeded, the undo DID return the tree
      to byte-identical (both reproduced), including recreating the removed folder.
    fix_hint: 'run each restore in its own try, collect what could not be restored, and say so (and name the first error) instead of the fixed sentence'

