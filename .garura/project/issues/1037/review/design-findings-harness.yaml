# design-findings-harness.yaml: Layer 2 (design-grounding + conformance) for the "harness" category
# of PR #1038 (issue #1037). SECOND review. Written by change-reviewer, Job 2, one category per
# dispatch; it overwrites the first review's file. Every principle below is read from outside the
# branch: the base ref (main), a decision record committed on another branch, or Phoenix memory
# read through the memory tool. Nothing is grounded in prose this branch adds, which includes the
# first review's own records: those were used only as the list of what to re-check.
# The base ref is main (1be69342). The branch head is 75c166ca; the fix commit is d4cb234f.
pr: 1038
issue: 1037
category: harness
review_round: 2
base: main
artifacts_in_scope:
  - core/components/skills/link-model-part/SKILL.md
  - core/components/agents/product-os-keeper.md
read_as_implementation_only:
  - core/components/skills/link-model-part/scripts/link_part.py   # its code quality is the executable-code category's
memory:
  memory_dir: .garura/project/issues/1037/context/memory/grounding-harness/
  manifest: .garura/project/issues/1037/context/memory/grounding-harness/manifest.json
  refreshed_through_the_memory_tool:
    - {path: standards/rules/direct-model-write.md, tier: phoenix, version: b2e40bff2131}
    - {path: standards/schemas/product-os/ontology.md, tier: phoenix, version: b2e40bff2131}
    - {path: standards/schemas/product-os/spine.yaml, tier: phoenix, version: b2e40bff2131}
    - {path: standards/rules/naming.md, tier: phoenix, version: b2e40bff2131}
    - {path: standards/rules/naming.yaml, tier: phoenix, version: b2e40bff2131}
  refresh_result: >-
    Each file was read again from the Phoenix tier and copied with copy_memory.py into the
    manifest above. The five fingerprints equal the first review's, so the copies are unchanged
    (git shows no change under the folder). The manifest names no home-folder path. The lines
    cited below were read again through the memory tool's read command.
  shared_copies_read: [".garura/project/issues/1037/context/memory/standards/rules/pr.md (severity definitions, through the memory tool's search)"]
severity_basis: >-
  pr.md definitions: P1 blocker (security, secrets, data loss, breaking API contract); P2 major
  (structural violations); P3 minor (missing docs, borderline, naming); P4 nit (suppressed by
  default, shown in evidence). A Layer 2 finding has no Standard ID row (the scan's table is not
  eligible on garura-prose), so each takes the bucket from those definitions.

# ---------------------------------------------------------------------------------------------
# The principles, each with its committed source
# ---------------------------------------------------------------------------------------------
principles:
  - id: G1
    principle: >-
      A skill is a contract: its Process and Output tell the caller what each exit means and what
      is reported; the mechanical work is a script the skill runs.
    sources:
      - {ref: "main:docs/standards/harness-standard.md", where: "principles 2 and 3"}
      - {ref: "main:core/components/skills/link-model-part/SKILL.md (base version)", where: "Process step 2 ('Exit 2: nothing was written') and Output ('Nothing is written when the script exits 2')"}
      - {ref: "main:core/components/skills/remove-model-part/SKILL.md", where: "Rules, 'All or nothing' (line 79: when a write or a delete fails every file is put back as it was)"}
  - id: G3
    principle: "An installed part reads, runs and names only installed files; no pointer to core/ or docs/; no note of origin."
    sources:
      - {ref: "main:docs/standards/harness-standard.md", where: "principle 11"}
      - {ref: "main:docs/adr/055-installed-parts-read-only-installed-files.md"}
  - id: G4
    principle: "One name, one meaning: each verb in a part's name holds one meaning."
    sources:
      - {ref: "main:docs/standards/harness-standard.md", where: "principle 10"}
      - {ref: "memory tool: phoenix standards/rules/naming.yaml (b2e40bff2131)", where: "line 42, verb `link`: 'Make links in the model.'"}
  - id: G5
    principle: >-
      Who may change the model's index (the spine). Base ref: only a play's keyed script, plus
      link-model-gaps inside a loop. Decided later (ADR 065, rule 1): link-model-part adds or
      changes a part; remove-model-part takes a part out, with the name of the person who
      approved it. Each changes only what its request names, and the links that would otherwise
      point at nothing; stays inside the model; lists every file it changed. The ADR gives the
      reason the two differ: taking a part out needs an approver's name and adding one does not.
    sources:
      - {ref: "main:docs/adr/026-direct-to-model-writes.md", where: "Decision, 'Containment split'"}
      - {ref: "memory tool: phoenix standards/rules/direct-model-write.md (b2e40bff2131)", where: "rule 3 and its 'Inside a loop (ADR 044)' paragraph"}
      - ref: "ADR 065, docs/adr/065-the-models-index-is-changed-through-two-skills-the-model-never-names-a-plan-and-only-tools-know-the-tracker.md, at commit d6ccf160 (2026-11-02)"
        where: "Decision, rule 1 (line 131); Alternatives, 'Two skills is the fewest that fits, because taking a part out needs an approver's name and adding one does not' (line 192)"
        status: >-
          Accepted, but committed on another branch, not on main and not on this branch. Checked:
          d6ccf160 is contained in the local branch feature/1021-reorganise-business-intents; it is
          not an ancestor of main or of HEAD. See grounding_caveats C1.
  - id: G6
    principle: >-
      A skill whose act waits for a person's approval takes the person's name in its request and
      refuses a request without it; or, where the ADR does not ask for a name (adding or changing
      a part), the text says plainly whose duty the approval is and that the skill does not check.
    sources:
      - {ref: "main:core/components/skills/remove-model-part/SKILL.md", where: "Input (`approved_by`) and Rules, 'Never without the person's name'"}
      - {ref: "main:core/components/skills/enrich-grounding/SKILL.md", where: "line 31, `approved_request`: `approved_by` and `source`"}
      - {ref: "main:core/components/skills/author-intent-page/SKILL.md", where: "line 25, `confirmed_by`"}
      - {ref: "ADR 065 at d6ccf160 (another branch)", where: "rule 1 and line 192"}
  - id: G7
    principle: >-
      A mechanical index skill writes no page words. Where a change would leave a line on a page
      naming something that no longer holds, it refuses and names the line, and the page skill
      changes the words FIRST; the caller's sequence puts the named-lines step before the
      mechanical skill.
    sources:
      - {ref: "main:core/components/skills/remove-model-part/SKILL.md", where: "Process step 1, 'Have the words fixed first' (line 39), and Rules, 'No page words'"}
      - {ref: "main:core/components/agents/product-os-keeper.md", where: "mapping row 'take this part out of the model' (line 107): `enrich-grounding` (named lines) 'then one `remove-model-part` run'"}
      - {ref: "main:core/components/skills/link-model-part/SKILL.md (base version)", where: "Rules, 'No page words'"}
  - id: G8
    principle: >-
      The product ontology: a feature has exactly one parent capability and its page lives under
      its capability's folder, or the holding folder `features/<id>/` UNTIL IT NAMES a capability;
      its business intents are the ones its parent capability serves; an ICE lives on its own page
      `ice.md` in its part's folder; the thin mark is kept in two places that agree; the rules say
      what holds once the product is aligned and never stop a write, and drift is fixed by the
      Alignment loop.
    sources:
      - {ref: "memory tool: phoenix standards/schemas/product-os/ontology.md (b2e40bff2131)", where: "line 25 ('Who writes, and what the rules mean'); Feature, line 385 (Lives at) and lines 407 and 410 (Rules)"}
      - {ref: "memory tool: phoenix standards/schemas/product-os/spine.yaml (b2e40bff2131)", where: "features block; `thin` comment"}
  - id: G9
    principle: >-
      The sibling that already re-parents a loose node moves its page under the new parent's
      folder and lets the spine `doc` follow, in one act; a node already under another parent is
      skipped there as alignment work.
    sources:
      - {ref: "main:core/components/skills/link-model-gaps/SKILL.md", where: "Process (lines 32 to 40: 'a page in a holding folder moves, byte for byte, under its parent's folder'; 'a node already under another parent - moving it is alignment work'), Rules lines 59 to 61"}
  - id: G10
    principle: >-
      When link-model-part gains a use, the keeper agent's statements of it move together and
      agree with the skill: its skill-table row (with its 'Used By' cell), its Intent-to-Skill
      mapping row, and its Boundaries bullets. This is the keeper's own committed practice.
    sources:
      - {ref: "main:core/components/agents/product-os-keeper.md", where: "the skill-table row (line 74), the mapping row 'write these pages as the person approved them' (line 108) and the Boundaries bullet 'Change the product model by hand'"}
      - {ref: "main git history of that file", where: "5497c9c3 (#1031, 2026-11-06) added the table row, its 'Used By' entry and the mapping row; aa3a5d2f (#1031) extended the Boundaries bullet"}
  - id: G11
    principle: "When no skill covers a change, say so and stop: the missing skill is built, never worked around."
    sources:
      - {ref: "main:core/components/agents/product-os-keeper.md", where: "Boundaries, NEVER, 'Change the product model by hand'"}
  - id: G12
    principle: "A SKILL.md `description` is a short summary for tooling discovery."
    sources:
      - {ref: "main:docs/components/skills.md", where: "line 206, SKILL.md Frontmatter table, `description`"}
  - id: G13
    principle: >-
      A mapping row names the order of its skills where a script enforces one: the keeper's own
      committed row for approved pages says what must come first, because the skill refuses
      otherwise ('Remove an old ICE section from a part's page first through named lines, or
      approve the whole page without it').
    sources:
      - {ref: "main:core/components/agents/product-os-keeper.md", where: "mapping row 'write these pages as the person approved them' (line 108), its last cell"}
      - {ref: "main:core/components/skills/enrich-grounding/SKILL.md", where: "step 6 (line 97: a refusal for 'a thin page on disk'); scripts/write_approved.py lines 28 to 29 and 134 to 135 (a page on disk that is thin is not replaced: 'its thin mark is link-model-part's'), and the docstring, 'Its folder holds its part's page, on disk or in the same request'"}

# ---------------------------------------------------------------------------------------------
# Where the change conforms (no finding)
# ---------------------------------------------------------------------------------------------
conforms:
  - {principle: G1, evidence: "SKILL.md Input takes only paths (`request`, `product_base`, `out`) and Output returns a report path; the report keys it names (written, updated, thin, unthin, moved, changed, layout_kept) are the keys the script writes. allowed-tools stays Read, Bash. The one gap in the exit contract is H-L2-11."}
  - {principle: G3, evidence: "The lines the PR adds to SKILL.md and product-os-keeper.md hold no core/, docs/ or .garura/ path and no note of origin (grep of the added lines). lint-components, source layout, run by the play: 37 violations, 36 errors and 1 warning, none in either changed file; the same count as the first review."}
  - {principle: G5, evidence: "The updates stay inside <product_base>product-os/ (`inside()` refuses a path that leaves it), run all or nothing, and list every file changed. That is rule 1 of ADR 065 for 'adds or changes a part'. The conformance holds only once ADR 065 lands (C1). A move deletes the old page after writing it anew, so nothing is taken out and no approver's name is due (ADR 065, line 192)."}
  - {principle: G7, evidence: "A move is still refused while any page or record names the old path (names_of); the script writes no page words, and the SKILL.md rule says 'the page skill changes those lines first'. The conformance is in the skill. The keeper's mapping row breaks the order; see H-L2-2."}
  - {principle: G8, evidence: "`capability` replaces the single parent (never appends) and only a feature takes it; `doc` moves the page and the ice.md beside it and the ICE entry's doc follows; `thin: false` removes both marks together. In the script a `doc` is checked against the parent AFTER the `capability` change, so 'capability with doc' files the page under the new capability's folder, as the new rule says."}
  - {principle: G11, evidence: "The change builds the missing step as a skill update rather than working around it."}
  - {principle: "harness-standard principle 4", evidence: "No play or loop is in changed_paths, so there is no ICE source to trace and no lint_play run; a skill has no ICE source."}

