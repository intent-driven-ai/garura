# ---------------------------------------------------------------------------------------------
# Findings of this round
# ---------------------------------------------------------------------------------------------
findings:
  - id: H-L2-2
    severity: P3
    carried_from: "first review H-L2-2, partly fixed"
    file: core/components/agents/product-os-keeper.md
    location: "Intent to Skill Mapping, the new row (line 109), 'Skill' cell against its last cell; skill-table row (line 74), 'Used By' cell"
    principle: "G7, G13, G10"
    committed_source: "main:core/components/skills/remove-model-part/SKILL.md Process step 1 (line 39, 'Have the words fixed first'); main:core/components/agents/product-os-keeper.md line 107 (named lines, then the removal); line 108 (the order a refusal enforces is named in the row); 5497c9c3 (the 'Used By' entry of a new use)"
    violated: >-
      The row does not order its steps so that a move is never run while a page still names the
      old path. Its Skill cell runs `link-model-part` (thin: false), then `enrich-grounding`
      approved, then ONE `link-model-part` run that moves the pages (`capability` with `doc`),
      and only then `enrich-grounding` named lines 'for each page that still names an old path or
      part'. The script refuses the move while any page or record names an old path, and the
      row's own last cell says so ('a move is refused while a page names the old path, so fix
      those lines first'). The Skill cell has no step before the move that does it. A reading of
      the last named-lines step as being for the merge (a page that names the merged capability,
      which remove-model-part refuses) leaves the same hole for the moved page. By the row as
      written, a keeper reaches the move with the lines unfixed, is refused (all or nothing,
      nothing written, the error names file:line), and learns the order only from the refusal. I
      ran it on a scratch model (outside the repository): a capability page that names the moved
      page's old path, the move in the third step, exit 2, 'fn-1: these still name its old page,
      so the move would break them: capabilities/cap-1/capability.md:2', tree unchanged. The first
      review had asked for the named lines first, and the row puts them last. Also still missing:
      the table row's 'Used By' cell has no entry for the #1037 use (a P4 part of this finding).
    basis: >-
      On main, both siblings put the page skill's named lines BEFORE the mechanical skill: the
      remove row (line 107) and remove-model-part's own Process step 1. The new SKILL.md rule
      says the same ('the page skill changes those lines first'). A keeper that follows the Skill
      cell in order meets the refusal the skill is built to give. The damage is one refused run,
      so P3, not P2.
    fix: "Put a named-lines step before the move (lines that name the old path of each page that moves), then `thin: false`, then the approved pages, then the one move-and-ICE run; keep the named-lines step for the merge after it. Add the #1037 use to the 'Used By' cell."

  - id: H-L2-10
    severity: P3
    new_in_this_round: true
    file: core/components/agents/product-os-keeper.md
    location: "Intent to Skill Mapping, the new row (line 109): 'then one `link-model-part` run (each feature's `capability` with its `doc`, each ICE `new`)' after 'enrich-grounding (mode `approved`, for the new pages and ICE pages)'"
    principle: "G13, G10"
    committed_source: "main:core/components/agents/product-os-keeper.md line 108 (a row names what must come first when a script refuses otherwise); main:core/components/skills/enrich-grounding/scripts/write_approved.py (an ICE page needs its part's page beside it, 'on disk or in the same request')"
    violated: >-
      The one `link-model-part` run is not order-neutral, and the row does not say where the
      approved pages go. I ran it on a scratch model (outside the repository), with the ICE page
      written beside the old page: (1) the feature's move listed first and the ICE `new` at the
      old path: exit 2, 'ice-1: its page must be capabilities/cap-2/fn-1/ice.md, beside its
      part's page'; (2) the move first and the ICE `new` at the new path: exit 2, 'its page
      capabilities/cap-2/fn-1/ice.md is not on disk; write the page first'; (3) the ICE `new`
      first (old path), then the move: exit 0, both pages and the ICE entry at the new folder.
      The row lists the features first. A second order trap: approved mode may write the part's
      page and its ice.md at the NEW folder (its docstring allows it), and then the move into that
      folder is refused ('capabilities/cap-2/fn-1 already holds a file'). Nothing is written in
      any refused case, and a two-run order also works (the move alone, which carries the ice.md,
      then the ICE `new` at the new path: both exit 0), but neither the row nor the SKILL.md says
      so, and the messages of (1) and (2) point the keeper at each other.
    basis: >-
      The keeper's committed row for approved pages names the order a script enforces. This row
      says 'one run' for a sequence whose result depends on the order of its parts and on the
      folder the approved pages were written to.
    fix: "In the row, say that the approved pages are written at the part's old folder (the move carries them), that each ICE `new` is listed BEFORE the feature's move in the request (or that the ICE entry is a second run after the move), and the same in one line of the SKILL.md rule 'A move breaks no link'."

  - id: H-L2-11
    severity: P3
    new_in_this_round: true
    file: core/components/skills/link-model-part/SKILL.md
    location: "Process step 2 (line 40, 'Exit 2: nothing was written') and Output (last sentence, 'Nothing is written when the script exits 2')"
    principle: G1
    committed_source: "main:core/components/skills/link-model-part/SKILL.md (base version of both sentences); main:core/components/skills/remove-model-part/SKILL.md line 79; main:docs/standards/harness-standard.md principles 2 and 3"
    violated: >-
      The fix made the script exit 2 for a second case that the contract does not name. When a
      write fails and the undo cannot finish too, main() now returns 2 with 'a write failed (...),
      and these are NOT back as they were: <paths>. Put them back from git before anything else
      runs.' (UndoFailed). So exit 2 no longer always means nothing was written. The SKILL.md
      says exactly that, in two places, and the fix commit changed the Rules only. The keeper
      reads the Process and Output, so it reads exit 2 as 'safe to retry'.
    basis: >-
      A skill's text is the contract its caller reads (G1). On main the sentence was written for
      a script that only refused or succeeded; the fix, which answers the first review's R-2, made
      the script honest and left the contract behind. P3 (a missing line of documentation on a
      rare path), not P2: the stderr names every path not back.
    fix: "Say in Process step 2 and in Output that exit 2 means either 'nothing was written' or 'a write failed and the error names the paths not put back, which are put back from git', and that the caller reports the second case to the person instead of retrying."

  - id: H-L2-12
    severity: P4
    new_in_this_round: true
    kind: grounding unavailable
    file: core/components/skills/link-model-part/SKILL.md
    location: "Rules, 'Re-file only what a person approved' (line 71 to 73): 'as the `/shape-slice` brief and a reviewed take-in do'"
    principle: G6
    committed_source: "none found: git grep on main for 'reviewed take-in', 'take-in' and 'take in an old' in core/, docs/ and core/grounding finds nothing about it (the hits are update-plan's 'Take instructions', ADR 058 and an unrelated feature page); ADR 065 at d6ccf160 has no such phrase"
    violated: >-
      The phrase names a caller that records a person's approval, and no committed source on the
      base ref, in memory or in ADR 065 describes a 'reviewed take-in'. A reader cannot find the
      record the rule points to. The other example in the same sentence is grounded: the
      /shape-slice one brief and its checkpoint (main shape-slice SKILL.md T11; record_approval.py).
    basis: "A rule that points to a record the repository does not hold. A nit: the sentence still says whose duty it is."
    fix: "Name the one thing that exists (the /shape-slice checkpoint), or the play that will record a take-in once it is built, or drop the phrase."

  - id: H-L2-13
    severity: P4
    new_in_this_round: true
    file: core/components/skills/link-model-part/SKILL.md
    location: "Rules, 'A re-file moves the page too' (line 74 to 77): '`capability` alone files the entry and leaves the page where it is, which suits only a page in the holding folder `features/<id>/`'"
    principle: "G8, G9"
    committed_source: "memory tool: phoenix standards/schemas/product-os/ontology.md (b2e40bff2131), Feature, line 385 ('under its capability's folder, or the holding folder `features/<id>/` until it names a capability') and line 407; main:core/components/skills/link-model-gaps/SKILL.md lines 34 to 35 (a holding-folder page moves under its parent's folder when its parent is set)"
    violated: >-
      The clause says that filing a feature under another capability and leaving its page in the
      holding folder 'suits' that case. By the ontology the holding folder is where a feature
      waits UNTIL it names a capability, and by link-model-gaps the holding-folder page moves
      under its parent's folder when the parent is set. So a feature that names a capability while
      its page stays in the holding folder is the disagreement the first review (H-L2-4) found,
      not a case that suits. The first part of the rule ('give `capability` with `doc`') is right.
    basis: "The ontology says rules never stop a write and drift goes to the Alignment loop (line 25), so a nit: the sentence calls a drift fine."
    fix: "Drop the 'which suits only ...' clause, or say 'the page then stays in the holding folder until `doc` moves it'."

  - id: H-L2-14
    severity: P4
    new_in_this_round: true
    file: core/components/agents/product-os-keeper.md
    location: "Boundaries, NEVER, 'Remove a node, or lose what an existing node holds' (lines 185 to 191): 'only when it moves them, word for word, to a new folder (#1037)'"
    principle: "G1, G9"
    committed_source: "main:core/components/skills/link-model-gaps/SKILL.md lines 35 and 59 ('byte for byte', 'A page moves unchanged'); main:core/components/skills/enrich-grounding/scripts/change_lines.py docstring ('every other line word for word, with its own line ending')"
    violated: >-
      Tested against the script, on a scratch model (outside the repository): a moved page keeps
      its words and, in a plain move, a missing last newline or two trailing newlines (bytes
      equal). A page with CRLF line endings comes out with LF (read in text mode, written as
      text; bytes differ). A moved page that also takes `thin: false` in the same request loses
      its Thin line and ends with exactly one newline. In this repository 'word for word' means
      the line with its own line ending (change_lines), so the claim is a little stronger than
      the script. The model in this repository holds no CRLF page and no .md page without a final
      newline (checked in .garura/product/product-os), so nothing is hit today. This is the
      first review's R-12 seen from the agent's text.
    basis: "The words survive and nothing is lost, so a nit."
    fix: "Say 'its words kept' instead of 'word for word', or make the script move the bytes (the executable-code category's R-12)."

  - id: H-L2-5
    severity: P4
    carried_from: "first review H-L2-5, open"
    file: core/components/skills/link-model-part/SKILL.md
    location: "Rules, 'Re-file only what a person approved' (line 68 to 73)"
    principle: G8
    committed_source: "memory tool: phoenix standards/schemas/product-os/ontology.md, Feature Rules, line 410 ('Its business intents are the ones its parent capability serves')"
    violated: "A re-filed feature keeps the `intents` it had, which are the old capability's. The skill can add an intent and never take one away, and the rule, which the fix lengthened, still does not say what the caller does about it."
    basis: "Drift is the Alignment loop's and no rule stops a write (line 25), so a nit."
    fix: "One sentence in the 'Re-file' rule: the feature's intents are not changed; add the new capability's with `add_intents` and repoint the old ones through remove-model-part."

  - id: H-L2-6
    severity: P4
    carried_from: "first review H-L2-6, open; grew"
    file: core/components/skills/link-model-part/SKILL.md
    location: "Rules, 'A move breaks no link' (line 78 to 81)"
    principle: "G5 (ADR 065 rule 1, 'the links that would otherwise point at nothing'), G1"
    committed_source: "ADR 065 at d6ccf160 (another branch), rule 1; main:core/components/skills/remove-model-part/SKILL.md, Rules"
    violated: >-
      The heading says a move breaks no link, with no condition. names_of still skips the moved
      files themselves (`rel in old_rels`), so a relative link inside the moved page or its ice.md
      that points at a neighbour would break. The text still leaves out the refusals about the
      NEW folder, now three: the folder must hold no file yet, it must be a folder a part of that
      kind may use, and (added by the fix) no other part or page of the request may share it.
      The live model has no instance of a link inside a moved page.
    basis: "A stated guarantee should hold for what the script does. No instance today, so a nit."
    fix: "Say 'no page or record that names an old path is left naming it', that links inside the moved page are not followed, and list the refusals about the new folder."

  - id: H-L2-7
    severity: P4
    carried_from: "first review H-L2-7, open"
    file: core/components/skills/link-model-part/SKILL.md
    location: "frontmatter `description` (line 3)"
    principle: G12
    committed_source: "main:docs/components/skills.md line 206 (`description`: 'Short summary for CLI/tooling discovery')"
    violated: "The description was not touched by the fix. It grew from 1,623 characters on main to 1,973, one sentence, where the standard calls for a short summary. Its last sentence ('Used ... by any play or run that finds a part the model lacks') now describes only part of the skill."
    basis: "The base already exceeded the standard, so the change widens an existing departure; a nit."
    fix: "Shorten the description to what the skill does and when it is used; the detail already sits in Input, Output and Rules."

  - id: H-L2-8
    severity: P4
    carried_from: "first review H-L2-8, open"
    file: core/components/skills/link-model-part/SKILL.md
    location: "Rules, 'The thin mark is two marks that agree' (line 60) and 'The thin mark comes off as it went on' (line 82); Process step 2 (line 40)"
    principle: G8
    committed_source: "memory tool: phoenix standards/schemas/product-os/ontology.md, ICE 'Thin mark' and the ready rule; spine.yaml, `thin` comment ('the play that deepens it removes it')"
    violated: "Two bullets answer 'who takes the thin mark off' in two ways: 'The play that deepens the part removes both' and 'thin: false takes both off'. Both are true, since the play would ask this skill, and the text does not say so. Process step 2 still describes only the mark being set."
    basis: "The ontology gives the removal to the play that deepens the part; a nit, because the new update serves that."
    fix: "Change the kept sentence to 'the play that deepens the part has it taken off through `thin: false`', and let step 2 mention a mark taken off."

  - id: H-L2-9
    severity: P4
    carried_from: "first review H-L2-9, open"
    file: core/components/skills/link-model-part/SKILL.md
    location: "the skill's name against its job (frontmatter `name`; Rules); and the keeper's third exception (line 190)"
    principle: G4
    committed_source: "memory tool: phoenix standards/rules/naming.yaml, line 42, verb `link` 'Make links in the model'; main:docs/standards/harness-standard.md principle 10"
    violated: "The verb `link` means making links in the model. Taking a thin mark off and moving and deleting a page are not links. The drift was there on the base ref (one-lines, thin marks); the keeper now says in its Boundaries that the skill deletes a page."
    basis: "One name, one meaning. A nit: the drift predates the PR and the name is not changed here."
    fix: "None needed in this PR. Leave it for the naming work; do not add more non-link jobs to the skill without deciding the name."

