    how_checked: >-
      Copied write_approved.py and its test to a temporary folder, deleted the folder-removal loop from the
      copy, and ran the repo's own test against it: 16 tests, OK.
    suggested_fix: >-
      Let the first write create the new folder and fail the second, and add a case with nested new folders
      (see Q1).

