rubric_findings:

  - id: Q1
    severity: P2
    category: executable-code
    file: core/components/skills/enrich-grounding/scripts/write_approved.py
    line: 177
    line_end: 179
    title: A failed write leaves empty folders behind when the new folders are nested
    basis:
      rule: "review/code rubric: safe handling of destructive/irreversible operations; the script's own promise (docstring lines 33-34) that every folder the run made is removed"
      source: .garura/project/issues/1031/context/memory/knowledge/review/code.md
    severity_reason: "pr.md Severity buckets, P2: error-handling violations"
    evidence: "for d in made: if os.path.isdir(d) and not os.listdir(d): os.rmdir(d)"
    what_is_wrong: >-
      `made` lists each page's new folders deepest first, but page after page, so a parent folder made for an
      earlier page is tried before the child folder made for a later page. The parent still holds the child,
      is not empty, and is skipped. The child is then removed and the parent stays.
    how_checked: >-
      Ran the committed write_all in a temporary folder with three new pages (care/new/capability.md,
      care/new/fresh/feature.md, care/new/fresh/ice.md) and a disk-full error on the third write. The
      files were removed, but the folders `care` and `care/new` were left behind.
    suggested_fix: remove the folders in one pass, longest path first (for example sorted(set(made), key=len, reverse=True)).

  - id: Q2
    severity: P2
    category: executable-code
    file: core/components/skills/enrich-grounding/scripts/write_approved.py
    line: 171
    line_end: 180
    also_at: ["core/components/skills/enrich-grounding/scripts/write_approved.py:200-202"]
    title: The undo can itself fail half way, and the script then says every page is back
    basis:
      rule: "review/code rubric: error handling; safe handling of irreversible operations"
      source: .garura/project/issues/1031/context/memory/knowledge/review/code.md
    severity_reason: "pr.md Severity buckets, P2: error-handling violations"
    evidence: "except OSError: for full, old in reversed(done): os.remove(full) / safe_write.atomic_write(full, old)"
    what_is_wrong: >-
      os.remove and atomic_write inside the undo can raise. The first such error leaves the rest of the pages
      unrestored, and main() then prints "a write failed, every page is back as it was" - which is untrue.
    how_checked: >-
      Ran write_all on three existing pages with the third write failing and the first restore failing too.
      Two pages stayed on the new text, and the error that reached main() was the same OSError that main()
      turns into the "every page is back" message.
    suggested_fix: >-
      Keep going through the whole undo, collect what could not be restored, and name those pages in the
      message instead of claiming all are back.
    same_pattern_not_raised: "link_part.py write_all (lines 353-371) has the same shape, but this diff does not change it."

  - id: Q3
    severity: P2
    category: executable-code
    file: core/components/skills/enrich-grounding/scripts/write_approved.py
    line: 203
    line_end: 207
    title: The report is written with no guard after the pages are already written
    basis:
      rule: "review/code rubric: error handling; the script's own contract (docstring line 36) of exit 0 written, 2 refused or bad input"
      source: .garura/project/issues/1031/context/memory/knowledge/review/code.md
    severity_reason: "pr.md Severity buckets, P2: error-handling violations"
    evidence: 'with open(a.out, "w", encoding="utf-8") as fh: json.dump(report, fh, indent=2)'
    what_is_wrong: >-
      If the --out folder is missing or not writable, the pages are on disk but the script ends with a
      traceback and exit 1, a result the contract does not have. The caller sees a failure for work that
      was done, with no report of which pages changed.
    how_checked: >-
      Ran the script against a temporary model with --out in a folder that does not exist. The page was
      written; the run ended with FileNotFoundError and exit 1.
    suggested_fix: >-
      Check the --out folder before the first page write (it is a check, so it belongs with the others),
      and catch OSError on the report write so the exit code is 0 or 2.

  - id: Q4
    severity: P2
    category: executable-code
    file: core/components/skills/link-model-part/scripts/link_part.py
    line: 150
    line_end: 159
    title: A wrongly typed field in a new ICE entry crashes with a traceback instead of a refusal
    basis:
      rule: "review/code rubric: error handling; the script's own contract (docstring line 65) of exit 0 written, 2 refused or bad input; the standard the suite already sets at test_link_part.py:284-296 (a bad request gives exit 2 and no Traceback)"
      source: .garura/project/issues/1031/context/memory/knowledge/review/code.md
    severity_reason: "pr.md Severity buckets, P2: error-handling violations"
    evidence: 'part = p.get("for") ... kind = next((k for k in ICE_KIND if part in index[k]), None) ... doc = (p.get("doc") or "").strip("/")'
    what_is_wrong: >-
      `part in index[k]` raises TypeError when `for` is a list, and `.strip` raises AttributeError when `doc`
      is a number or list. main() catches neither, so the run ends with a traceback and exit 1. Nothing is
      written (this happens before any write), so no data is at risk; the exit code and message are wrong.
    how_checked: 'Ran link_part.py on a temporary model with {"kind": "ice", "for": ["fn-1"]}: TypeError "cannot use list as a dict key", exit 1.'
    suggested_fix: check the types of `for` and `doc` (strings) at the top of the ICE branch and raise Refused.

  - id: Q5
    severity: P2
    category: executable-code
    file: core/components/skills/link-model-part/scripts/link_part.py
    line: 347
    line_end: 349
    also_at: ["core/components/skills/link-model-part/scripts/link_part.py:248-249"]
    title: Adding or marking an ICE silently drops entries of the spine's ices list that it does not recognise
    basis:
      rule: "review/code rubric: safe handling of destructive/irreversible operations (a rewrite must not lose what it did not mean to change)"
      source: .garura/project/issues/1031/context/memory/knowledge/review/code.md
    severity_reason: >-
      pr.md Severity buckets, P2: error-handling violations. The same text lists data-loss under P1; held at P2
      because only entries the model's own tools never write (not a mapping, or no id) are lost, and the spine
      is kept in git. The caller may raise it.
    evidence: 'old_ices = [e for e in (spine.get("ices") or []) if isinstance(e, dict)] ... new_spine["ices"] = [ices[e["id"]] for e in old_ices if e.get("id") in ices] + [...]'
    what_is_wrong: >-
      The list is rebuilt from only the entries that are mappings with an id. Any other entry is removed from the
      file and the run reports success. A malformed list should be refused, as the other checks refuse bad input.
    how_checked: >-
      Ran link_part.py on a temporary model whose ices list held one good entry, one mapping with no id and one
      plain string, and added a valid ICE. Exit 0; the written spine kept the good entry and the new one, and
      lost the other two.
    suggested_fix: refuse (exit 2) when the ices list is not a list of mappings that each have an id, before any write.

  - id: Q6
    severity: P2
    category: tests
    file: core/components/skills/enrich-grounding/scripts/test_write_approved.py
