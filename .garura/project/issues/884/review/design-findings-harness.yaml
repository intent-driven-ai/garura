grounding_sources_used:
- id: G1
  principle: Plays orchestrate, agents gather context, skills do the work; a play hands each agent a contract
    of file paths, and the record of what happened is on disk.
  source: plan/788/base:docs/standards/harness-standard.md principle 2
- id: G2
  principle: Mechanical work is a script; a model is used only where judgment is needed.
  source: plan/788/base:docs/standards/harness-standard.md principle 3
- id: G3
  principle: A change to what a part guarantees is made in its ICE and the part is compiled again; the compiled
    part records a fingerprint of its ICE; the Expectation holds the scenarios that prove the guarantee.
  source: plan/788/base:docs/standards/harness-standard.md principles 4 and 5; plan/788/base:CLAUDE.md
    Play Pipeline Rules
- id: G4
  principle: The judge prompt, rubric and verdict shape live in one place, the judge-grounding skill; the judge
    only scores and evidences, the deterministic gate decides, so a judge cannot wave a doc through with a
    self-declared result.
  source: plan/788/base:docs/adr/039-memory-writes-go-to-short-term-memory-plays-read-no-memory.md (section
    7); plan/788/base:core/components/plays/discover-capabilities/scripts/grounding_gate.py (docstring);
    plan/788/base:core/components/skills/judge-grounding/SKILL.md (Output, last paragraph)
- id: G5
  principle: The judge always runs as a clean-context sub-agent, handed only the kind's guidance, the doc and
    its parent, never the play's context, the brief or the author's reasoning; the skill states "and only these".
  source: 'memory: standards/rules/grounding-eval.md (Phoenix 44e1c4c4799a, section "How the judge runs");
    copy .garura/project/issues/884/context/memory/grounding-harness/standards/rules/grounding-eval.md;
    plan/788/base:core/components/skills/judge-grounding/SKILL.md (Input)'
- id: G6
  principle: The judge fan-out is concurrent and read-only. Each judge reads its own doc and writes only its own
    verdict, no judge depends on another, and the gate runs after the join.
  source: 'memory: standards/rules/concurrent-fanout.md (Phoenix 44e1c4c4799a); copy .garura/project/issues/884/context/memory/grounding-harness/standards/rules/concurrent-fanout.md'
- id: G7
  principle: Installed parts name only installed paths; a play reads no memory and names a rule, never reads it.
  source: plan/788/base:docs/standards/harness-standard.md principle 11; plan/788/base:CLAUDE.md Behavioral
    Rules 1
