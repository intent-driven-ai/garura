findings:
- id: F1
  class: P2
  file: core/components/memory/standards/rules/grounding-eval.md
  location: How the gate settles, The fix round
  finding: >
    In a fix round the rule has the gate trust the judge's word that a last failure was fixed. The gate
    clears the failure when the judge writes fixed: true, and turns a criterion that still scores fail
    on unchanged text into a note. So one wrong word from the judge lets a doc through with the very
    failure it was sent back for, although the gate holds the snapshot and could see the text did not
    change. Checked by running the changed gate (canonical copy) on a throwaway doc: round 1 fail on
    stranger_test, doc left unchanged, round 2 verdict stranger_test fail plus prior fixed: true gives
    ok: true, overall pass, the failure turned into a note. The rule should say a last failure whose
    criterion still scores fail, or whose cited text is still in the snapshot unchanged, is a fix not
    made, whatever the judge writes; the gate code should do the same.
  principle_violated: P-B (the gate decides, not the judge; the judge cannot wave a doc through with a self-declared pass)
  committed_source: plan/788/base:core/components/skills/judge-grounding/SKILL.md (Output, last paragraph);
    plan/788/base:core/components/memory/standards/rules/grounding-eval.md (The gate rule)
- id: F2
  class: P3
  file: core/components/memory/standards/rules/grounding-eval.md
  location: The gate rule, How the gate settles (notes)
  finding: >
    The rule now lets a doc pass with a rubric line at fail (a note on unchanged text, shown to the
    person at the checkpoint). The content standard it points to for the bar still says every rubric line
    must pass and a doc that fails any line is rejected by the eval. Two memory files now disagree on
    what rejects a doc. The rule is the later, deliberate decision (#884), so the fix is a sentence in
    the content standard (or the rule) that says a note on unchanged text is shown, not a rejection.
  principle_violated: P-C
  committed_source: plan/788/base:core/components/memory/standards/schemas/product-os/grounding/_content-standard.md
    (Eval rubric, all must pass; last paragraph)
- id: F3
  class: P3
  file: core/components/memory/standards/rules/grounding-eval.md
  location: How the judge runs - an isolated sub-agent (unchanged paragraph)
  finding: >
    The paragraph says the judge runs with only the guidance, the doc and the parent. The new fix-round
    section, and the skill (input prior_failures), also hand the judge the last verdict's failures. The
    rule contradicts itself on what the clean-context judge sees. One line in the isolation paragraph
    (plus the last failures, in a fix round) removes the drift.
  principle_violated: P-D
  committed_source: plan/788/base:core/components/memory/standards/rules/grounding-eval.md (How the judge
    runs); plan/788/base:docs/adr/039-memory-writes-go-to-short-term-memory-plays-read-no-memory.md (Decision 7)
- id: F4
  class: P3
  file: core/components/memory/standards/rules/grounding-eval.md
  location: How the gate settles (The kept pass), Calibration
  finding: >
    The kept pass is keyed on the doc, the parent and the guidance only. If the judge prompt or model
    changes, as Calibration asks when a thin doc passes (tighten and re-run), earlier kept passes of the
    same issue are not judged again by the tighter judge. The rule also does not say a calibration run uses
    no judge state, so a calibration run on a reused state folder could read a kept pass or a fix round
    instead of the known-answer first round. Calibration is not broken for the first round (untouched
    text), but the rule should say calibration runs state-free, and either name the judge skill version
    in the fingerprint or say a prompt change clears the judge state.
  principle_violated: P-E
  committed_source: plan/788/base:core/components/memory/standards/rules/grounding-eval.md (Calibration)
- id: F5
  class: P4
  file: core/components/memory/standards/rules/grounding-eval.md
  location: title line
  finding: >
    The title still reads Grounding Content-Quality Eval - v1 although the rule gained a new section
    (how the gate settles) that changes what passes. A reader cannot tell the v1 behaviour from the
    settled behaviour. Nit: bump the version or drop the number.
  principle_violated: P-A (one clear source for the gate rule)
  committed_source: plan/788/base:core/components/memory/standards/rules/grounding-eval.md (title)
