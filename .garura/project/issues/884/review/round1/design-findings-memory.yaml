principles:
- id: P-A
  principle: The rubric (five criteria), the judge prompt and the verdict shape have one source, the
    judge-grounding skill. The rule keeps only the gate rule, how the judge runs, and how the eval is
    trusted; a play restates none of the rubric.
  source: plan/788/base:docs/adr/039-memory-writes-go-to-short-term-memory-plays-read-no-memory.md (Decision 7,
    The judge prompt is part of judging); plan/788/base:core/components/memory/standards/rules/grounding-eval.md
    (intro paragraph)
- id: P-B
  principle: The gate decides pass or fail, not the judge. The judge only scores and evidences; a judge
    that drops a criterion is not trusted (fails closed).
  source: plan/788/base:core/components/memory/standards/rules/grounding-eval.md (The gate rule);
    plan/788/base:core/components/skills/judge-grounding/SKILL.md (Output, last paragraph)
- id: P-C
  principle: The content standard is the bar the judge scores against; every rubric line must pass and a
    doc that fails any rubric line is rejected by the eval.
  source: plan/788/base:core/components/memory/standards/schemas/product-os/grounding/_content-standard.md
    (Eval rubric, all must pass; last paragraph), memory tool, phoenix tier (version 44e1c4c4799a), copied
    to grounding-memory/
- id: P-D
  principle: The judge runs in an isolated sub-agent with a clean context; the inputs it may read are
    named in one place and the rule and the skill agree on them.
  source: plan/788/base:core/components/memory/standards/rules/grounding-eval.md (How the judge runs);
    plan/788/base:docs/adr/039-memory-writes-go-to-short-term-memory-plays-read-no-memory.md (Decision 2,
    a skill reads only what its agent puts in short-term memory)
- id: P-E
  principle: Calibration - the eval must separate known answers (gold docs pass, thin docs fail), and when
    it passes a thin doc the prompt is tightened and re-run.
  source: plan/788/base:core/components/memory/standards/rules/grounding-eval.md (Calibration)
- id: P-F
  principle: Every memory write goes to the issue's short-term memory; a play reads no memory; a lookup
    reads only the issue it works on.
  source: plan/788/base:docs/adr/039-memory-writes-go-to-short-term-memory-plays-read-no-memory.md (Decision 1,
    2, 11 - a play's own step-to-step files are read and written directly); plan/788/base:docs/adr/035-agents-work-only-from-memory.md
