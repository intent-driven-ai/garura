findings:
  - id: N4
    class: P4
    file: core/components/memory/standards/rules/grounding-eval.md
    location: How the gate settles, The notes (last sentence of the bullet)
    finding: >
      The rule ends the bullet with "A new point with no quote of content (only headings or short words), or with
      a quote not in the snapshot, is a failure." The gate counts only content fragments (not a heading, three
      words or more) and ignores a short fragment that is not in the snapshot. Run on a scratch folder: round 1
      all pass; the author replaces a section body with TBD; round 2 completeness fail with evidence
      Other holds "TBD" while the intro says "The service runs local only" -> ok: true, notes [completeness],
      failures []. By the rule's last sentence the "TBD" quote is a quote not in the snapshot, so the point is a
      failure; the gate makes it a note. Fix: make the last clause say "or with a content quote not in the
      snapshot", and say that a short quote does not turn a point on changed text into a note (or have the
      gate fail a point when any quote, short or long, is not in the snapshot).
    principle_violated: P-B
    committed_source: "plan/788/base:core/components/memory/standards/rules/grounding-eval.md (The gate rule: the gate prints each failing criterion; any fail rejects the doc); plan/788/base:core/components/skills/judge-grounding/SKILL.md (Output, last paragraph)"
