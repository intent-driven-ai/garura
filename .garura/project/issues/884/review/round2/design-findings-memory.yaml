findings:
  - id: N1
    class: P2
    file: core/components/memory/standards/rules/grounding-eval.md
    location: How the gate settles, The fix round (and gate_with_state in grounding_gate.py)
    finding: >
      Round-1 finding A is only partly fixed. The rule counts a last failure as fixed when the judge writes
      fixed: true, the doc changed somewhere, and the judge's quote is still on the page. In a real fix round
      the doc always changed (the author rewrote it), and a failure's cited text is usually still there, so
      the two checks add little: one wrong word still clears the failure. The judge may also score the same
      criterion fail again on that same unchanged text, and the gate turns it into a note. Run on a scratch
      folder with the canonical gate: round 1 stranger_test fail quoting "It is local only."; a one-word edit
      in another section; round 2 stranger_test fail again quoting the same text plus prior fixed: true with
      the same quote -> ok: true, round fix, failures [], notes [stranger_test]. The failure the doc was sent
      back for is shown as a note. Fix: a criterion that was a last failure and still scores fail is a failure,
      never a note; and a fix counts only when the failing text is gone or changed (the last failure's quotes
      are not all still in the page unchanged), not when the doc changed anywhere.
    principle_violated: P-B
    committed_source: "plan/788/base:core/components/skills/judge-grounding/SKILL.md (Output, last paragraph: the gate decides so the judge cannot wave a doc through); plan/788/base:core/components/memory/standards/rules/grounding-eval.md (The gate rule: any fail rejects the doc)"
  - id: N2
    class: P3
    file: core/components/memory/standards/rules/grounding-eval.md
    location: How the gate settles, The notes
    finding: >
      A new point is a note when every quote in its evidence is found in the snapshot, so it is the judge's
      choice of quote that tells changed text from unchanged text. A defect the rewrite just made can be
      quoted by an unchanged anchor (a heading) and so stop being a failure. Run on a scratch folder: round 1
      all pass; the author replaces a section body with "TBD"; round 2 completeness = fail with evidence
      "## Other" holds only a placeholder (quote is the unchanged heading) -> ok: true, notes [completeness],
      failures []. The rule is silent on a quote that is only a heading or a few words. Fix: say a point is a
      note only when the whole span it rests on is unchanged, for example the gate compares the section the
      quote sits in, or the quote must be a full line from the body, not a heading.
    principle_violated: P-B
    committed_source: "plan/788/base:core/components/memory/standards/rules/grounding-eval.md (The gate rule: any fail rejects the doc, the gate prints each failing criterion for the rewrite loop)"
  - id: N3
    class: P4
    file: core/components/memory/standards/rules/grounding-eval.md
    location: How the gate settles, The fix round
    finding: >
      The rule says a fix counts when "every quote in the judge's evidence is found on the page now". With no
      quote at all that is true by default, but the gate fails it (quotes_found needs at least one quote).
      One clause removes the doubt: the evidence must hold at least one quote.
    principle_violated: P-B
    committed_source: "plan/788/base:core/components/memory/standards/rules/grounding-eval.md (The gate rule)"
