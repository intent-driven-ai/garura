findings:
- id: N1
  severity: P2
  class: P2
  file:
  - core/components/plays/discover-capabilities/scripts/grounding_gate.py (gate_with_state, fix round; and its identical copies)
  - 'core/components/memory/standards/rules/grounding-eval.md (How the gate settles, "A missing criterion still fails closed in every round")'
  principle: G4 and G3 - a verdict that misses a criterion fails closed, and the gate (not the judge) decides; a criterion that was never judged must not pass as a mere note.
  principle_source: 'memory: standards/rules/grounding-eval.md line 25 (copy in grounding-harness); plan/788/base:core/components/plays/discover-capabilities/scripts/grounding_gate.py docstring line 8; plan/788/base:docs/adr/039-memory-writes-go-to-short-term-memory-plays-read-no-memory.md section 7'
  finding: 'The record keeps only the failures (a missing criterion is not stored as one). I ran it on a scratch folder: round 1, the judge drops stranger_test -> exit 1, "missing criterion: stranger_test", round first. Round 2, the same unchanged doc, the judge returns all five and fails completeness on a quote of the unchanged text -> "PASS - doc.md cleared all five criteria", "note (text did not change, does not block): completeness", ok: true, round fix. So a doc that was never fully judged, and was rejected for that, passes on its next round with a fail on a criterion the first round never scored. The same holds for the "first round failed and nothing was recorded" case in general: a fix round with an empty list of last failures treats every fail on unchanged text as a note.'
  suggested_fix: 'When a verdict fails with missing criteria (or any non-pass the record does not hold), keep the doc''s next round a first round (no record, or record the missing ids and treat a fail on one of them as a failure, not a note). Add a test: missing in round 1, fail on unchanged text in round 2 -> exit 1. Say it in the rule.'
- id: N2
  severity: P4
  class: P4
  file:
  - core/components/plays/discover-capabilities/reference/ice.md (C4)
  - core/components/plays/discover-domains/reference/ice.md (C2)
  principle: G2 - a guarantee is held in the ICE; the compiled play and the scenarios must not carry a guarantee the constraint does not.
  principle_source: plan/788/base:docs/standards/harness-standard.md principles 4 and 5; plan/788/base:CLAUDE.md Play Pipeline Rules
  finding: 'The constraint says a pass is kept "while the doc, its parent doc and the guidance are unchanged" (domains: "the doc and the guidance"). The scenarios (S10 / S9), the compiled SKILL.md, the rule and the gate all add a fourth input, the judge ("the doc, its parent, the guidance and the judge are unchanged"). The ICE constraint and its own scenario now state two different conditions.'
  suggested_fix: 'Add "and the judge" to C4 and C2 and recompile with /edit-play.'
- id: N3
  severity: P4
  class: P4
  file:
  - core/components/memory/standards/rules/grounding-eval.md (How the gate settles, the kept pass)
  principle: G3 - the rule describes what the gate does, no more.
  principle_source: 'plan/788/base:core/components/plays/discover-capabilities/scripts/grounding_gate.py docstring (the gate decides); memory: standards/rules/grounding-eval.md (the gate rule)'
  finding: 'The rule says "a stricter judge ends the old passes: a pass given by a looser judge is not kept". True for `kept`, but the re-judge cannot reject: I ran a passed doc, changed the judge file, and the stricter verdict failed stranger_test on unchanged text -> "PASS ... note (text did not change, does not block)". A stricter judge only adds notes to an unchanged doc; it rejects only changed text.'
  suggested_fix: 'Add one sentence: a stricter judge re-judges an unchanged doc, but its new points on unchanged text are notes.'
held:
- 'judge-grounding is a skill, a direct edit is allowed; no edit note; rubric, prompt and verdict shape stay in the one skill (ADR 039 section 7); the "prior" field is optional, so old verdicts still gate.'
