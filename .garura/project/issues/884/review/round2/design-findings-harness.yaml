- id: G5
  principle: The judge runs as a clean-context sub-agent; the play dispatches it, a script gates it; a play reads no memory and writes only to the issue's short-term memory.
  source: 'memory: standards/rules/grounding-eval.md "How the judge runs"; plan/788/base:docs/adr/039-memory-writes-go-to-short-term-memory-plays-read-no-memory.md sections 1 and 2; plan/788/base:docs/standards/harness-standard.md principle 11'
