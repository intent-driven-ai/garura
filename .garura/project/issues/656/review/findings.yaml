- id: MEM-10
  severity: P4
  layer: design-grounding (memory)
  category: memory
  file: core/components/memory/knowledge/_TEMPLATE.md
  line: 43-44
  basis: 'ADR 035 section 1 names three tiers and says the project tier holds what the project makes itself; it takes care
    that one word never means two things. The knowledge base is org-wide (garura-reference-implementation.md:241). _DESIGN.md
    names the template as part of the durable content and says changes to the design go through a decision record (:3-4, :20-26);
    round 1 offered a template line or an ADR amendment as the two homes, so the template line is accepted and a decision
    record is a follow-up, not a defect. The client half has a committed analogue for shared views (G9); the personal-name
    half has none on main.

    '
  finding: 'The no-personal-or-client-names rule now sits as two plain sentences at the end of the shelf template''s Provenance
    section (''... never a person or a client. Memory is shared across projects, so it carries no personal or client names.'').
    Three loose ends. (1) Scope: the rule says ''Memory'', but it lives in the template that governs only knowledge shelves,
    while this PR applied it to five standards files too (two rules, two schemas, the ADR template); the other knowledge-file
    standard, standards/templates/knowledge-file.md, still reads ''Provenance references an issue or work context'' and does
    not carry it. An author of a standards rule has no reason to open the shelf template. (2) Tier: ''Memory is shared across
    projects'' is true of Phoenix memory and the knowledge base, not of Garura memory, which holds what a project makes itself;
    and the same template names a product as a valid provenance source, which in a project''s own memory may be a client''s
    product. (3) Form: the two sentences are body prose where the template''s other guidance is a placeholder or a comment,
    so a new learning that copies the template carries them into its own Provenance.

    '
- id: MEM-11
  severity: P4
  layer: design-grounding (memory)
  category: memory
  file: core/components/memory/knowledge/domains/payments.md:12; knowledge/domains/experience.md:86 and :237; knowledge/domains/personalization.md:51
    and :159; knowledge/technology/delivery-triangle.md:15; knowledge/technology/delivery-industry-frames-derived.md:39
  line: null
  basis: 'One name, one meaning (ADR 035 section 1). ''Person'' is the framework''s word for who decides or confirms (ontology.md:84
    on main; ADR 035 section 10), but on main it comes with an antecedent (''the person who asked''). ''Team experience''
    already has a defined sense in delivery-industry-frames-derived.md:37 on main. These are the round-1 fixes taken literally,
    so this is wording left open, not a regression.

    '
  finding: 'Two leftovers from the name removal. (1) The same note is still worded two ways: experience.md:86 ''The intent
    list was drafted on delegation'' against personalization.md:51 ''The intent list was delegated to Claude''; and the closing
    note experience.md:237 ''pending confirmation'' against personalization.md:159 ''pending the person''s confirmation''.
    (2) Three holders have no antecedent: payments.md:12 opens a sentence ''The person asked me ...'' with no earlier mention
    of who; delivery-triangle.md:15 ''the team''s frame''; delivery-industry-frames-derived.md:39 ''The team''s position''.
    Read from another project''s memory, each points at the reader''s own person or team, and the same file already uses ''team
    experience'' for the human who directs the agents.

    '
- id: MEM-12
  severity: P4
  layer: design-grounding (memory)
  category: memory
  file: core/components/memory/standards/templates/adr.md
  line: 154
  basis: 'adr.md:145-146 on main says the example is ADR 031''s header as the template would write it; ADR 031 on main (line
    5) names the person who decided. A worked example is meant to be a real instance (product-ontology.md:60-62), but this
    one is a rendering of a real record, so a fictional name makes it a different record.

    '
  finding: 'The gold example is introduced as the header ADR 031 ''would read'' if written from the template. After the fix
    it names a fictional person (''Alex Example'') for a real record whose own text attributes the decision to a named person,
    so a reader who compares the two sees a different decider. (''Decided by: the owner'' in round 1 had the same fault in
    a different form.)

    '
