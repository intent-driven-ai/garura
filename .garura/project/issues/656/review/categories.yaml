      New in the diff in round 2: the committed output of round 1 of this same play (a reject
      verdict on one P1, the findings behind it, the comment posted to the PR, and the diff and
      context it was run on). Why a separate category from stm-run-records: these are the output
      of the very review now running, so they differ in how they must be treated. Never review them
      as work; never use a round-1 finding, principle or verdict as grounding or as the answer for
      round 2 (circular: it is the review reading itself); this run regenerates categories.yaml,
      context.yaml, pr.diff and the findings files, so what the diff holds is a round-1 snapshot.
      Two practical effects: (1) pr.diff inside the diff contains an earlier copy of the diff, so
      any word scan or standards scan that runs over the whole diff will hit its own text; scans
      should be limited to the product categories and the scanner's skipped-path list grows from
      13 to 23 paths (2 plans, 11 run records, 10 review records). (2) git diff --check over the
      whole diff flags pr.diff (blank context lines) and a blank line at the end of
      quality-findings.yaml; neither is a defect in the change.
