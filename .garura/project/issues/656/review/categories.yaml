playbook_sharpening:
  - id: review/memory
    note: "its Linter line asks that a file be 'listed in the shelf _index'; core/components/memory/knowledge/_index.md lists shelves, not files, so that clause cannot be checked as written. The dedicated memory-integrity linter is still a gap, so the id, frontmatter and cross-reference checks above were built ad hoc. It names _TEMPLATE.md as a committed grounding source but does not say what to do when the PR itself edits that source."
  - id: review/config-maps
    note: "its Linter line says no config-map linter exists; the path-existence check above was again done ad hoc. It also does not say what to do when a pointer aims at a gitignored folder that exists locally but not in a fresh clone (the PR rules target here), or when the working copy carries an uncommitted run-only edit."
