# categories.yaml — derived from the PR #671 diff content (base main). Not matched from a fixed list.
# Review shelf used: ~/.garura/phoenix-memory/knowledge/review/ (context.yaml's ./.garura/core/memory/knowledge/review/ has no copy; tier order short-term, then Garura memory, then Phoenix memory, per context.yaml review_shelf_note). That shelf is identical, file by file (diff -rq), to core/components/memory/knowledge/review/ in this checkout, and this branch changes nothing under that folder, so it is also main's copy. Files: _index, adrs, code, config-maps, docs, harness, memory, tests.
pr: 671
issue: 656
base: main
changed_path_count: 60   # 14 added + 46 modified (git diff main...HEAD --name-status); matches the 60 changed_paths in context.yaml. context.yaml and pr.diff themselves are untracked review inputs, not part of the change.
categories:
  - name: memory
    playbook: review/memory
    design_bearing: true   # playbook: "Design-grounding (Layer 2): yes" — reviewer human (design) + tool (conformance); Layers 1 and 2. The play should dispatch a grounding for this category.
    layers: [linters, design-grounding]
    evidence:
      # knowledge shelves under core/components/memory/knowledge/ (36 files: architecture 8, domains 9, technology 19)
      - core/components/memory/knowledge/architecture/agent-assistive.md
      - core/components/memory/knowledge/architecture/agent-derive-once-apply-many.md
      - core/components/memory/knowledge/architecture/agent-orchestration-patterns.md
