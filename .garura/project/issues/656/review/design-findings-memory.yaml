findings:
  - id: MEM-10
    severity: P4
    round: 2
    file: core/components/memory/knowledge/_TEMPLATE.md
    line: "43-44"
    what: >
      The no-personal-or-client-names rule now sits as two plain sentences at the end of the shelf template's Provenance section
      ('... never a person or a client. Memory is shared across projects, so it carries no personal or client names.').
      Three loose ends. (1) Scope: the rule says 'Memory', but it lives in the template that governs only knowledge shelves, while
      this PR applied it to five standards files too (two rules, two schemas, the ADR template); the other knowledge-file standard,
      standards/templates/knowledge-file.md, still reads 'Provenance references an issue or work context' and does not carry it.
      An author of a standards rule has no reason to open the shelf template. (2) Tier: 'Memory is shared across projects' is true
      of Phoenix memory and the knowledge base, not of Garura memory, which holds what a project makes itself; and the same template
      names a product as a valid provenance source, which in a project's own memory may be a client's product. (3) Form: the two
      sentences are body prose where the template's other guidance is a placeholder or a comment, so a new learning that copies the
      template carries them into its own Provenance.
    principle: G1, G5, G7, G8
    basis: >
      ADR 035 section 1 names three tiers and says the project tier holds what the project makes itself; it takes care that one
      word never means two things. The knowledge base is org-wide (garura-reference-implementation.md:241). _DESIGN.md names the
      template as part of the durable content and says changes to the design go through a decision record (:3-4, :20-26); round 1
      offered a template line or an ADR amendment as the two homes, so the template line is accepted and a decision record is a
      follow-up, not a defect. The client half has a committed analogue for shared views (G9); the personal-name half has none on main.
    fix: >
      Say 'Phoenix memory' (or 'the knowledge base') instead of 'Memory'; say in one line that the standards files follow the same
      rule, or move the rule to a standards rule file; put the two sentences in a comment line under the heading so copies do not
      carry them; consider one line in a decision record so the next review has a committed source.

  - id: MEM-11
    severity: P4
    round: 2
    file: "core/components/memory/knowledge/domains/payments.md:12; knowledge/domains/experience.md:86 and :237; knowledge/domains/personalization.md:51 and :159; knowledge/technology/delivery-triangle.md:15; knowledge/technology/delivery-industry-frames-derived.md:39"
    what: >
      Two leftovers from the name removal. (1) The same note is still worded two ways: experience.md:86 'The intent list was drafted
      on delegation' against personalization.md:51 'The intent list was delegated to Claude'; and the closing note experience.md:237
      'pending confirmation' against personalization.md:159 'pending the person's confirmation'. (2) Three holders have no antecedent:
      payments.md:12 opens a sentence 'The person asked me ...' with no earlier mention of who; delivery-triangle.md:15 'the team's
      frame'; delivery-industry-frames-derived.md:39 'The team's position'. Read from another project's memory, each points at the
      reader's own person or team, and the same file already uses 'team experience' for the human who directs the agents.
    principle: G5
    basis: >
      One name, one meaning (ADR 035 section 1). 'Person' is the framework's word for who decides or confirms (ontology.md:84 on main;
      ADR 035 section 10), but on main it comes with an antecedent ('the person who asked'). 'Team experience' already has a defined
      sense in delivery-industry-frames-derived.md:37 on main. These are the round-1 fixes taken literally, so this is wording left
      open, not a regression.
    fix: >
      Use one wording for each kind of note (suggest 'delegated to Claude' and 'pending the person's confirmation' in both files);
      for payments.md write 'A person asked me ...'; for the two delivery files either say 'the framework's frame/position' or
      drop the holder where the sentence stands without it.

  - id: MEM-12
    severity: P4
    round: 2
    file: core/components/memory/standards/templates/adr.md
    line: 154
    what: >
      The gold example is introduced as the header ADR 031 'would read' if written from the template. After the fix it names a
      fictional person ('Alex Example') for a real record whose own text attributes the decision to a named person, so a reader
      who compares the two sees a different decider. ('Decided by: the owner' in round 1 had the same fault in a different form.)
    principle: G10, G4
    basis: >
      adr.md:145-146 on main says the example is ADR 031's header as the template would write it; ADR 031 on main (line 5) names the
      person who decided. A worked example is meant to be a real instance (product-ontology.md:60-62), but this one is a rendering of
      a real record, so a fictional name makes it a different record.
    fix: >
      Add three words to the lead-in ('with the person's name changed') or call the example a made-up record rather than ADR 031's
      header. Either keeps the name out of memory and keeps the example honest.

conformance_checks_passed:
  - check: "Frontmatter facets unchanged in all 36 knowledge files (main vs HEAD, excluding provenance)"
    principle: G2
    result: "Re-run this round with a script: 36 files, frontmatter parses in all, id equals path in all, every evolve_when target exists, no facet other than provenance differs, and the set of ## headings in each file equals main's. 0 problems."
  - check: "Fix commit 218a2d54 touched Conditions, Recommendation or Rationale prose"
    principle: G2
    result: "Only one Recommendation line changed (delivery-industry-frames-derived.md:39, a holder word, MEM-08). The rest is provenance lines, short lead-in notes, the quote, two worked examples and one Log line."
  - check: "Provenance still references an issue or work context in all 36 files"
    principle: G1
    result: "Unchanged from round 1: no issue reference lost. The five ux-* shelves keep '#434'; payments, personalization and experience keep '#434'."
  - check: "Ontology still valid after the edits"
    principle: G6
    result: "check_ontology.py on the HEAD file: valid, no problems; its own tests: 27 passed, 0 failed."
  - check: "No personal, company, personal-vault or home-folder reference remains in core/components/memory"
    principle: G1
    result: "Scanned the whole folder (case-insensitive). One hit, standards/rules/pr.md line 153 (BE-08, a security regex for user-token URL paths, matched only because the scan ignores case), unchanged by this branch. Scanned the added lines of the memory diff: no hits. 'owner' remains only in its defined senses."
  - check: "The fictional names agree across files"
    principle: G4
    result: "'alex-example' (ontology Source example) and 'Alex Example' (ADR gold example) are one made-up person; neither matches a person named elsewhere in memory."
  - check: "No duplicate or contradicting learning introduced"
    principle: G2
    result: "No learning added or removed; cross-references untouched."

summary:
  principles_grounded: 10
  round_1: {resolved: 8, resolved_with_residual: 1, not_resolved: 0}
  findings: {P1: 0, P2: 0, P3: 0, P4: 3}
