# design-findings-memory.yaml -- Layer 2 design-grounding of the 'memory' category, PR #671 (issue #656), base main. ROUND 2.
# Playbook: review/memory, read from ~/.garura/phoenix-memory/knowledge/review/memory.md (Garura memory has no copy).
# Every principle below is read from the base ref (git show main:<path>) or a committed decision record.
# Not used as grounding: anything this branch adds or rewrites (the two sentences added to knowledge/_TEMPLATE.md, the 656 plan,
# the PR body, the self-review, the round-1 review records, the scrubbed text itself), and Phoenix memory's copies of the
# changed files (seeded from this branch). The template is read as it is on main.
# Reviewed head: f7221657. Round-1 findings: commit 07cbf992 (design-findings-memory.yaml). Answer to them: commit 218a2d54.
# This file overwrites the round-1 file; the round-1 findings are carried below with their round-2 status.
category: memory
pr: 671
issue: 656
base: main
round: 2
scope: 43 changed paths under core/components/memory/ (36 knowledge shelves, knowledge/_TEMPLATE.md, 5 standards files, and one script under knowledge/domains/.pageindex that is executable code and is judged in the code category). The memory-side lines of the supplied diff were compared to git diff main...HEAD and are identical (200 changed lines each way).
severity_basis: >
  Buckets from core/components/memory/standards/rules/pr.md on main (lines 8-11: P1 blocker; P2 major; P3 minor: missing docs,
  naming; P4 nit: style). The table rows there are mechanical code rules and none targets memory prose, so each class below is
  chosen from the bucket definitions. Prose is never a code defect (pr.md, "Prose is never a code/data defect (#454)").

principles_grounded:
  - id: G1
    principle: >
      A shelf file follows the template; its provenance is "seeded | learned from {product / issue}" and references an issue or
      work context. The template names no person.
    sources:
      - "main:core/components/memory/knowledge/_TEMPLATE.md:15 (provenance: seeded | learned:product-or-issue) and :40-41 (## Provenance, seeded | learned from {product / issue}) -- read as on main, before this branch's two added sentences"
      - "main:core/components/memory/standards/templates/knowledge-file.md:86 (Provenance references an issue or work context)"
  - id: G2
    principle: >
      The knowledge base is a bank of empirical learnings, each answering a conditional question; the selection facets (id, title,
      conditions, evolve_when) and the Conditions / Recommendation prose are the durable content, and the real risk is content
      quality and contradiction.
    sources:
      - "main:core/components/memory/knowledge/_DESIGN.md:1-8 (empirical learnings bank), :20-26 (durable content and the template's sections), :60-62 (the real risk)"
  - id: G3
    principle: >
      Where a standard defines a field as a person, the field holds a person. An accepted ADR must name who accepted it; a
      reading play must record the git user who ran it.
    sources:
      - "main:core/components/memory/standards/templates/adr.md:28 (accepted_by = The PERSON who accepted it) and :70 (**Decided by:** <person>)"
      - "main:core/components/skills/author-adr/scripts/adr.py:147-148 (an accepted ADR names who accepted it)"
      - "main:core/components/memory/standards/schemas/product-os/ontology.md:117 (Given by = The git user who ran the reading play, required)"
      - "main:core/components/plays/intent/scripts/capture_source.py:107-108 (given-by must be the git user running the play)"
  - id: G4
    principle: >
      A worked example in a standard is a real, filled-in instance written the way the reader will see it; a person-facing kind is
      written in plain words with a plain example.
    sources:
      - "main:core/components/memory/standards/templates/product-ontology.md:60-62 (Example: a real, filled-in instance, written the way the reader will see it)"
      - "main:core/components/skills/build-product-ontology/SKILL.md:125 (Readable by its reader ... a plain example)"
  - id: G5
    principle: >
      One name carries one meaning, and terms are chosen so they are never confused. The framework's word for the human who
      decides or confirms is "person".
    sources:
      - "main:docs/adr/035-agents-work-only-from-memory.md section 1 (the project tier is called Garura memory, not project memory or LTM, so it is never confused)"
      - "main:core/components/memory/standards/schemas/product-os/ontology.md:84 (the person who asked confirms it; a person drops it) and ADR 035 section 10 (only a person confirms or drops a business intent)"
      - "main:core/components/memory/knowledge/technology/delivery-industry-frames-derived.md:37 ('team experience' already means how much directing the human gets to do)"
      - "main:core/components/memory/standards/rules/pr.md:10 (P3 bucket names 'naming')"
  - id: G6
    principle: >
      A change to the ontology is logged: set updated and add one dated Log line saying what changed and why. The version is bumped
      when a kind is added, changed or removed. The Log line records what changed and why, not who. Every change to Phoenix memory
      is a commit with history.
    sources:
      - "main:core/components/memory/standards/templates/product-ontology.md:12 (version: bumped when a kind is added, changed or removed) and :73 (Log: what changed in the ontology, and why)"
      - "main:core/components/skills/build-product-ontology/SKILL.md:99-100 (bump version, set updated, add one dated log line) -- read with the template, which is the more specific rule for when the version moves"
      - "main:docs/adr/035-agents-work-only-from-memory.md:48 (every memory update is a commit, with history, review and versions)"
  - id: G7
    principle: >
      Everything in core/components/memory/ seeds Phoenix memory. The knowledge base is org-wide knowledge read across projects;
      the project tier (Garura memory) holds what the project makes itself.
    sources:
      - "main:docs/adr/035-agents-work-only-from-memory.md (Affects line; section 1, the three tiers)"
      - "main:docs/philosophy/garura-reference-implementation.md:241 (Knowledge base: org-wide knowledge, written by framework authors through PR review)"
  - id: G8
    principle: >
      The knowledge base's design is LOCKED and changes to it go through a decision record; the shelf template is part of the
      durable content contract it names.
    sources:
      - "main:core/components/memory/knowledge/_DESIGN.md:3-4 (LOCKED; changes go through a decision record, not an ad-hoc edit) and :20-26 (content = markdown learnings, one template)"
  - id: G9
    principle: >
      A client name is kept out of anything shared. (An analogue: the committed rule covers views of the product model, not memory.)
    sources:
      - "main:core/components/memory/standards/schemas/product-os/grounding/capability.md:98 and grounding/epic.md:70 and grounding/functionality.md:77 (no client name reaches a shared view or row)"
  - id: G10
    principle: >
      The ADR template's gold example is stated as the header that a real, named ADR (031) would have if written from the
      template.
    sources:
      - "main:core/components/memory/standards/templates/adr.md:145-146 (ADR 031 is the nearest written example; written from this template its header would read)"
      - "main:docs/adr/031-business-intent-and-ice.md:5 (the real record attributes the decision to a named person)"

