findings:
- id: Q1
  severity: P2
  category: executable-code
  layer: linter (quality-check-scoped)
  file: core/tools/memory/pull.py
  line: 121
  basis: rule BE-12 in ~/.garura/phoenix-memory/standards/rules/pr.md
  finding: download() runs `git clone` of the Phoenix source with no timeout. GIT_TERMINAL_PROMPT=0 stops a password wait, but a stalled network or a slow server
    still holds the call open. The call sits inside root(), so any memory command an agent runs for the first time (search, find, read) can hang, and nothing stops
    it.
- id: Q2
  severity: P3
  category: executable-code
  layer: linter (quality-check-scoped)
  file: core/tools/memory/pull.py
  line: 121
  basis: rule SEC-04 in ~/.garura/phoenix-memory/standards/rules/pr.md
  finding: the clone command is `git clone --quiet <source> <part>` with the source straight from settings. A source that begins with a dash would be read by git
    as an option. Putting `--` before the source closes it.
- id: Q3
  severity: P3
  category: executable-code
  layer: linter (quality-check-scoped)
  file: core/tools/memory/pull.py
  line: 129
  basis: rule CODE-25 in ~/.garura/phoenix-memory/standards/rules/pr.md
  finding: '`except OSError:` around os.rename(part, phoenix) treats every failure as "another first run got there first" and moves on silently. A permission error
    or a full disk looks the same; the caller then sees only "cannot be reached at its setting" with no reason. Only the case where Phoenix memory''s place now exists
    should be treated as a lost race; any other error should be raised with its message.'
- id: Q4
  severity: P3
  category: executable-code
  layer: linter (quality-check-scoped)
  file: core/components/plays/install-garura/scripts/memory_system.py
  line: 101
  basis: rule CODE-27 in ~/.garura/phoenix-memory/standards/rules/pr.md
  finding: data-safety path. A re-install reads the person's edited settings.json into memory (line 99), deletes the whole tool folder (shutil.rmtree, line 102) and
    then copies the new one (line 103). If the copy fails part way (disk full, a permission error), the folder and the edited settings are gone and the only copy
    is a local variable that dies with the error. Copy to a new folder beside it and swap, or write the kept settings back in a finally block.
- id: Q5
  severity: P3
  category: executable-code
  layer: linter (quality-check-scoped)
  file: installer/install.sh
  line: 220
  basis: rule CODE-27 in ~/.garura/phoenix-memory/standards/rules/pr.md
  finding: 'data-safety path. A failed memory check makes the shell installer exit 1 at once (init mode: before the version file is written at line 300; update mode:
    before line 380). install.py does it the other way: it writes the manifest first and then exits 1 (install.py lines 296-300 and 383-387). The two install paths
    therefore end in different states after the same failure: the shell path leaves the skills installed but no recorded version, so the next run cannot tell what
    is on disk. Use one order for both.'
