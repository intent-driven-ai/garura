findings:
  - id: Q1
    class: P2
    category: executable-code
    basis: {rule: BE-12, standards_file: ~/.garura/phoenix-memory/standards/rules/pr.md, check_item: "External service calls have explicit timeout configuration — no infinite waits"}
    file: core/tools/memory/pull.py
    line: 121
    what: >-
      download() runs `git clone` of the Phoenix source with no timeout. GIT_TERMINAL_PROMPT=0 stops a password wait, but a stalled network or a slow server still
      holds the call open. The call sits inside root(), so any memory command an agent runs for the first time (search, find, read) can hang, and nothing stops it.
    fix_hint: >-
      pass a timeout to subprocess.run and turn TimeoutExpired into the same tier_missing refusal the failed-download branch already raises.
  - id: Q2
    class: P3
    category: executable-code
    basis: {rule: SEC-04, standards_file: ~/.garura/phoenix-memory/standards/rules/pr.md, check_item: "All user inputs validated and sanitized before use"}
    taxonomy_severity: P2
    adjusted_because: >-
      the value comes from the person's own settings file or environment, not from a user of a service, so the exposure is small.
    file: core/tools/memory/pull.py
    line: 121
    what: >-
      the clone command is `git clone --quiet <source> <part>` with the source straight from settings. A source that begins with a dash would be read by git as an option.
      Putting `--` before the source closes it.
  - id: Q3
    class: P3
    category: executable-code
    basis: {rule: CODE-25, standards_file: ~/.garura/phoenix-memory/standards/rules/pr.md, check_item: "Errors are logged with context (stack trace + relevant identifiers)"}
    file: core/tools/memory/pull.py
    line: 129
    what: >-
      `except OSError:` around os.rename(part, phoenix) treats every failure as "another first run got there first" and moves on silently. A permission error or a full disk
      looks the same; the caller then sees only "cannot be reached at its setting" with no reason. Only the case where Phoenix memory's place now exists should be
      treated as a lost race; any other error should be raised with its message.
  - id: Q4
    class: P3
    category: executable-code
    basis: {rule: CODE-27, standards_file: ~/.garura/phoenix-memory/standards/rules/pr.md, check_item: "Error recovery is explicit: retry with backoff, fallback, or circuit breaker"}
    file: core/components/plays/install-garura/scripts/memory_system.py
    line: 101
    what: >-
      data-safety path. A re-install reads the person's edited settings.json into memory (line 99), deletes the whole tool folder (shutil.rmtree, line 102) and then
      copies the new one (line 103). If the copy fails part way (disk full, a permission error), the folder and the edited settings are gone and the only copy is a
      local variable that dies with the error. Copy to a new folder beside it and swap, or write the kept settings back in a finally block.
  - id: Q5
    class: P3
    category: executable-code
    basis: {rule: CODE-27, standards_file: ~/.garura/phoenix-memory/standards/rules/pr.md, check_item: "Error recovery is explicit: retry with backoff, fallback, or circuit breaker"}
    file: installer/install.sh
    line: 220
    what: >-
      data-safety path. A failed memory check makes the shell installer exit 1 at once (init mode: before the version file is written at line 300; update mode: before line
      380). install.py does it the other way: it writes the manifest first and then exits 1 (install.py lines 296-300 and 383-387). The two install paths therefore end in different states
      after the same failure: the shell path leaves the skills installed but no recorded version, so the next run cannot tell what is on disk. Use one order for both.
  - id: Q6
    class: P3
    category: tests
    basis: {rule: TEST-01, standards_file: ~/.garura/phoenix-memory/standards/rules/pr.md, check_item: "Tests exist for all business logic functions"}
    taxonomy_severity: P2
    adjusted_because: >-
      install_memory_system() is a thin wrapper around memory_system.py, which is tested.
    file: installer/install.sh
    line: 211
    what: >-
      no automated test runs the public installer. The behaviour that is only in the shell (skip when the release has no script, exit 1 when the check fails, the update path keeping settings)
      is not exercised by anything; the tests call the Python scripts directly.
  - id: Q7
    class: P3
    category: tests
    basis: {rule: CODE-30, standards_file: ~/.garura/phoenix-memory/standards/rules/pr.md, check_item: "Error handling coverage enforced: error paths have explicit tests"}
    file: core/components/plays/install-garura/scripts/test_install.py
    line: 124
    what: >-
      these error paths in the new code have no test - lay() refusing an unknown tool or a source with no memory tool (memory_system.py lines 94 and 124), check() refusing a
      Python older than 3.10 (lines 148-151), a failed download during the check, uninstall --dry-run leaving the memory system in place (uninstall.py lines 160-166), and
      rm_block deleting an AGENTS.md that holds nothing but the block (uninstall.py line 102). The ones that are tested (no short-term folder, tool that cannot run, exit 1 after the manifest) are fine.
  - id: Q8
    class: P3
    category: executable-code
    basis: {rule: CODE-10, standards_file: ~/.garura/phoenix-memory/standards/rules/pr.md, check_item: "Function length <= 50 lines (excluding blank lines and comments)"}
    taxonomy_severity: P2
    adjusted_because: >-
      one to three lines over, borderline.
    file: core/components/plays/install-garura/scripts/memory_system.py
    line: 128
    what: >-
      check() is 51 code lines (new). Also install() in install.py (line 225) was 50 on main and is 53 at this head, so this PR takes it over.
  - id: Q9
    class: P3
    category: executable-code
    basis: {rule: CODE-09, standards_file: ~/.garura/phoenix-memory/standards/rules/pr.md, check_item: "Cyclomatic complexity per function <= 10"}
    file: core/components/plays/install-garura/scripts/memory_system.py
    line: 128
    what: >-
      check() measures 11 (ruff C901, limit 10). New code, one over; the python-version and tool-run branches could be a helper.
  - id: Q10
    class: P4
    category: executable-code
    basis: {rule: CODE-09, standards_file: ~/.garura/phoenix-memory/standards/rules/pr.md, check_item: "Cyclomatic complexity per function <= 10"}
    taxonomy_severity: P3
    adjusted_because: >-
