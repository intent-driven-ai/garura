    file: core/tools/memory/memory.py
    line: 1
    what: >-
      memory.py is 556 lines at this head (534 on main); install.py is 393 (368 on main). test_memory.py is 648 (595 on main), a test file.
  - id: Q12
    class: P4
    category: executable-code
    basis: {rule: CODE-23, standards_file: ~/.garura/phoenix-memory/standards/rules/pr.md, check_item: "Custom error types defined for domain errors (not raw Error or Exception)"}
    file: core/components/plays/install-garura/scripts/memory_system.py
    line: 94
    what: >-
      lay() ends the run with `raise SystemExit("<message>")` (lines 94 and 124). A string makes the exit code 1, which is the code install.py (lines 42-43 of its docstring)
      and this file's own docstring (line 28) give to "the memory check failed"; bad input is documented as 2. Called from install.py, a missing memory tool therefore exits like a failed check.
  - id: Q13
