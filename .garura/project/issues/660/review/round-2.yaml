adr_038_matches_the_code:
  checked_and_matches:
    - "600-second download limit: ADR 038 Negative/Risks says 600 seconds in pull.py; pull.py DOWNLOAD_SECONDS = 600."
    - "Never waits for a password, refusal names Phoenix memory: pull.py GIT_TERMINAL_PROMPT=0 and Refusal tier phoenix."
    - "Place: ~/.garura/phoenix-memory is PHOENIX_PLACE."
    - "Folder: .garura/tools/memory/ with settings.json beside it is TOOL_DEST and the written settings."
    - "Install does not fail when Phoenix memory is absent, reports it and notes when the source does not answer: _phoenix_lines, never a failure. ADR gives no number for the 30-second reach wait; not a conflict."
    - "Old machine-wide copy still laid: install.py and install.sh still copy memory to ~/.garura/core/memory, as the ADR says."
    - "Tool's own folder never answered as Garura memory: memory.py hides the tool's folder (but see N-1)."
  small_wording_gap: "ADR 038 header and §4 say the whitelist gains `.garura/tools/`; §5 and the ADR 017 pointer say `.garura/tools/memory/`. Same intent, one level apart. No finding."
  follow_ups_the_adr_names_itself: ["docs/components/memory.md whitelist", "glossary install rows", "#660 issue text", "initialize play"]

new_findings:
  - id: N-1
    severity: P3
    file: core/components/plays/install-garura/scripts/memory_system.py
    line: 112
    basis: "ADR 038 section 4 (\"A lookup never answers from the tool's own folder as Garura memory\") and rule CODE-27 (data-safety path), rule in ~/.garura/phoenix-memory/standards/rules/pr.md"
    finding: >
      The Q4 fix copies to `.garura/tools/memory.new` and swaps. If the copy or the rename fails, `memory.new` stays. memory.py hides only the
      exact tool folder (`tools/memory/`), and Garura memory is the whole `.garura` folder, so the leftover is answered as Garura memory:
      reproduced in a scratch project, `search --tier garura` returned a hit from `tools/memory.new/README.md`. Uninstall does not remove it
      either (it is not in the manifest and keeps `.garura/tools/` from pruning). The next install clears it. Remove the new folder on failure
      (try/finally) or give it a name memory.py hides.
  - id: N-2
    severity: P4
    file: core/tools/memory/pull.py
    line: 116
    basis: "rule CODE-27 in ~/.garura/phoenix-memory/standards/rules/pr.md; DOWNLOAD_SECONDS at line 47"
    finding: >
      The download folder (`.phoenix-memory-download-*` beside Phoenix memory's place) is only removed when the tool itself ends the download.
      An agent's shell commonly stops a command sooner than 600 seconds (Claude Code's default is 120), which kills the tool mid-clone and leaves
      the folder, and nothing sweeps old ones. The cost is disk space only; a later run is not affected.
  - id: N-3
    severity: P4
    file: core/components/plays/install-garura/scripts/memory_system.py
    line: 158
    basis: "rule CODE-30 in ~/.garura/phoenix-memory/standards/rules/pr.md (same basis as Q13)"
    finding: >
      The Q13 fix guards the error shape, but `t["tier"]` and `t["reachable"]` (lines 158 and 164) and `answer.get` on an answer that is not an
      object (for example a bare list) still raise a traceback instead of a FAIL line.

