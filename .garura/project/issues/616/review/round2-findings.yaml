findings:
  - id: N1
    severity: P2
    category: executable-code
    basis: "pr.md P2 (Major: error-handling and structural violations); contract mismatch: understand SKILL.md Step 0a tells the model to write doc as '<domain-dir>/<capability-slug>/capability.md', author-vision-seed/SKILL.md lines 157-162 shows the real convention where domain id (dom-order-mgmt) differs from its directory (order-management)"
    summary: "persist_understand.py:131-136 (added in 871c4739 to close Q-F4) requires parts[0] == seed['domain'], i.e. the doc directory must equal the domain ID. With the convention vision itself writes (domain id dom-commerce, directory commerce) the correct doc commerce/checkout/capability.md is refused with exit 2 (probed). The only accepted path is the default dom-commerce/checkout/capability.md, a stray directory next to the real one. The 32 tests all use a domain whose id equals its directory (id 'commerce'), so they hide it. The /understand seed path therefore fails or misplaces the doc for any model that follows vision's id convention. Fix: take the allowed directory from the domain's own doc in the spine (dirname of domains[].doc) and compare against that, and build the default from it; add a test with a prefixed domain id."
  - id: N2
    severity: P4
    category: executable-code
    basis: "pr.md CODE-25 family (error handling, P3 floor lowered to P4: no data written, same class as closed Q-F3); script's own exit-code contract (exit 2 on bad input)"
    summary: "persist_understand.py:130-131: seed.get('doc') that is not a string (for example a YAML list) raises AttributeError ('list' object has no attribute 'split') instead of exit 2 (probed, nothing written). Same for non-string domain or answered_by values. Fix: check isinstance(..., str) for doc, domain, answered_by before use."
  - id: N3
    severity: P4
    category: skill-text
    basis: "pr.md CODE-20 catch-all (P4, prose); CLAUDE.md Play Pipeline Rules (no edit history in skill files; Claude reads the whole file each run)"
    summary: "core/components/skills/enrich-capability-ice/SKILL.md lines 84-89 (Procedure step 1) are garbled by the edit: '...and nothing is added to them that the shelf does not support and the capability's KB shelf via the router (python3 $KB shelf <kb_domain>) — pull its personas...'. The two clauses are spliced mid-sentence, so the instruction to read the shelf is hard to parse. The description, the Inputs table and the Rules section also carry '(#616)' issue tags, which is edit history rather than behaviour. Fix: split into two sentences (read the answers verbatim; read the shelf via the router) and drop the issue tags."
