- id: HS1
  severity: P2
  file: core/components/plays/create-play/references/test_setup_branch.py
  line: null
  summary: 'The design says ''Pushes are checked; a failed push stops the run'' and ''Tests for each case'', and the ICE (C9,
    last sentence) now states it as a guarantee. The new _push path in setup_branch.py has no test: none of the 12 setup_branch
    tests makes a push fail (every case that reaches a push succeeds, and the unreachable-origin test stops earlier, at the
    ls-remote). The three other #953 cases (unsafe copy, safe copy, failed lookup) each have a test. Nothing but a read of
    the code proves that a failed push exits 1.'
  basis: 'Harness standard principle 5 (each guarantee has a check that proves it; plan/717/base:docs/standards/harness-standard.md
    lines 60-66) and the approved design ''Tests for each case'' (scope only). pr.md bucket P2: ''missing tests for new code''.
    Fix: add a case that points push at a refused remote (a pre-receive hook that exits 1, or a read-only bare origin) and
    assert exit 1 and the message.'
  category: harness
- id: HS2
  severity: P3
  file: core/components/plays/start-change/SKILL.md
  line: 195
  summary: 'SE-10, the step eval for F9/C9, was widened with ''a stale local plan branch was deleted only when setup_branch.py
    exited 0''. That measure cannot fail for a bad delete: the script deletes only inside a run that goes on, so a run that
    exited 0 always passes it, whether or not the deleted copy held commits found nowhere else. It also does not read source.fetched,
    so a run that read last-fetched copies (fetched: false) and found no plan passes without a person ever being told. F9''s
    new clause (''deleted while origin could not be reached, or while it held commits found nowhere else'') therefore has
    a step eval that matches it in words only. The safety is proved by the unit tests, not by the play''s own eval.'
  basis: 'Harness standard principle 5 (a check that never fails may check nothing; plan/717/base:docs/standards/harness-standard.md
    lines 60-66) and principle 4 (the ICE guarantee and its compiled check must agree). Fix: make the measure read evidence
    a bad delete would change, for example that the old tip (recorded in branch.json or the run record before the delete)
    is an ancestor of origin/main or of origin''s last-known plan branch, and that the report names source.fetched when it
    is false.'
  category: harness
- id: HS3
  severity: P3
  file: core/components/plays/start-change/reference/ice.md
  line: 156
  summary: REC9 now has four triggers; three of them end in 'stop for a person' (an issue in two plans, a stale copy with
    commits found nowhere else, an origin it could not reach), yet the handoff stays 'autonomous', and the compiled table
    and the metadata still count 8 autonomous / 1 human. A recovery that says a person must act is a human handoff; the label
    routes the recovery, so the run may try to repair it alone. The new stop-for-a-person cases are exactly the ones where
    an automatic repair would be unsafe (moving or pushing the lost commits).
  basis: 'Harness standard principle 4 (the compiled recovery follows the ICE exactly) and ADR 060 / the design''s rule ''otherwise
    the run stops and names the commits that would be lost''. The one-person-stop in REC9 existed before; this change adds
    two. Fix: split REC9 into an autonomous re-cut and a human stop, or mark the handoff human, and recount the metadata.'
  category: harness
- id: HS4
  severity: P4
  file: core/components/plays/start-change/scripts/resolve_plan.py
  line: 73
  summary: 'plans_at treats a failed ''git ls-tree <ref>:<plans folder>'' as an empty folder, so a plans folder that does
    not exist at origin/main, or a --plans-dir the script cannot map to a path in the repository (an absolute path loses its
    leading slash), answers ''no plan'' and the issue gets feature/<issue>-<slug> with exit 0. That is the same wrong answer
    #779 is about, though reached by a bad argument and not by a stale checkout. The shipped default (plans.base-path .garura/project/plans/,
    relative) is not affected, and the design does not cover a missing folder.'
  basis: 'Gap outside the approved design (it names the checkout, not the folder), so P4 out of scope. Harness standard principle
    3: a script that is exact about its arguments. Suggested later: exit 2 when ls-tree fails on a ref that exists and the
    folder is expected.'
  category: harness
- id: HS5
  severity: P4
  file: core/components/plays/start-change/scripts/resolve_plan.py
  line: 114
  summary: When the fetch fails, the script reads the last fetched copies and sets fetched false, as designed. A stale origin/main
    can then say 'no plan' for an issue added on main since, and the run still cuts feature/<issue>-<slug> and pushes it;
    the only trace is the record's fetched flag and the sentence 'say so in the report' (no eval reads it, see HS2). The same
    stale read applies to origin/plan/<id>/base, which is derived from the plan id and never checked to still exist on GitHub
    (without --prune a deleted plan branch's last copy is still read).
  basis: 'The design chooses ''use the last fetched copies and say so in the record'', so this is a gap outside the design:
    P4 out of scope. Harness standard principle 6 (nothing is blocked) argues for continuing, so no change is asked now. Recorded
    so a later round can decide whether fetched false plus plan null should stop for a person.'
  category: harness
- id: HS6
  severity: P4
  file: core/components/plays/start-change/scripts/setup_branch.py
  line: 129
  summary: 'The return code of ''git branch -D <plan>'' is not read. If the delete fails (the branch is checked out in another
    worktree), the script goes on as if the copy still exists: it fetches the gone branch, tries to check it out, and stops
    at ''checkout failed'' (exit 1) or, where the checkout works, merges main into the stale copy and pushes it back to origin.
    No commit is lost either way, but the run''s message would not name the real cause.'
  basis: 'Gap outside the approved design (it covers the safety check and the pushes, not the delete''s own result): P4 out
    of scope. Harness standard principle 3 (exact script, same answer every time).'
  category: harness
- id: HS7
  severity: P4
  file: core/components/plays/start-change/scripts/resolve_plan.py
  line: 114
  summary: '''git fetch'' runs with no timeout and does not turn off terminal prompts (no GIT_TERMINAL_PROMPT=0), and setup_branch.py''s
    ''git ls-remote'' calls have the same shape. A login prompt or a hung network could make the lookup wait instead of reaching
    the ''fetch failed, last fetched copies'' path. The design promises a stop on a failed lookup, not on a slow one.'
  basis: 'Gap outside the approved design: P4 out of scope. Harness standard principle 3 (a script gives the same answer every
    time).'
  category: harness
- id: HS8
  severity: P4
  file: core/components/plays/merge-change/scripts/merge_pr.py
  line: 7
  summary: The script's docstring still says it commits 'the run records on main itself (#491)'. The ICE and the compiled
    play now say 'on the branch the change landed on'. The behaviour is the same (it commits on the checkout, which C2 has
