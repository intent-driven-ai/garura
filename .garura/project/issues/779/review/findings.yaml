- id: Q17
  severity: P3
  file: core/components/plays/start-change/scripts/resolve_plan.py
  line: 75
  kind: reviewer-reading
  defect: true
  summary: In git mode a plans folder that git cannot list at the ref is silently treated as "no plans" (ls-tree return code
    ignored). A plans-dir given as an absolute path, or run from a sub-folder, or a typo, returns plan_id null with exit 0,
    so an issue in a plan gets a feature/ branch outside its plan. The play always passes the relative config value from the
    repo root, so no live path hits it today; no test covers it. Should be exit 2, like a missing --ref.
  basis: CODE-25
  artifact_type: garura-prose
  category: quality
- id: Q18
  severity: P3
  file: core/components/plays/start-change/scripts/setup_branch.py
  line: 69
  kind: reviewer-reading
  defect: true
  summary: Data-safety edge. If a plan branch was pushed, then deleted on origin from another clone without being merged into
    main, git still holds the last-known copy; the local copy is an ancestor of it, so it counts as safe and is deleted. The
    new plan branch's push then moves that last-known copy, and the commits are in no branch here or on origin (reproduced
    in a scratch repo). It matches the design's written rule ("or was on origin's plan branch"), so this is a design edge
    for Layer 2, not a code slip. A delete on the same clone removes the last-known copy and is kept and reported correctly.
  basis: CODE-25
  artifact_type: garura-prose
  category: quality
- id: Q19
  severity: P2
  file: core/components/plays/start-change/scripts/resolve_plan.py
  line: 114
  kind: reviewer-reading
  defect: true
  summary: No timeout and no GIT_TERMINAL_PROMPT=0 on the network git calls (git fetch here; git ls-remote at setup_branch.py:55
    and the push at line 77). A server that stalls or asks for a login on a terminal can hang the play. Plays run without
    a terminal, so a login prompt fails fast; a stalled server would still hang. The category note asks for "no network call
    that hangs".
  basis: BE-12
  artifact_type: garura-prose
  category: quality
