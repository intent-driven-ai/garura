standards_groups:
  BE-19:
    verdict: dismissed
    reason: >-
      The rule greps SQL words (SELECT, FROM, JOIN). The 24 hits are Python "from" imports,
      os.path.join/str.join calls and the words from/select inside YAML values in core/config.yaml. No
      SQL exists in the added lines (I grepped for select/insert/update/delete with from/where/values;
      the only match is prose in v5.json). Mechanical false positive on non-SQL code.
  ARCH-02_CODE-14:
    verdict: dismissed
    reason: >-
      The rules ask for a cycle check. An ast import graph over the changed .py files (13 same-folder
      edges) found no cycle, so there is nothing to fix.
  CODE-03:
    verdict: dismissed
    reason: The rule asks for a lint pass. ruff check passes on every changed .py file (28 files, run this round); the one E401 was fixed.
  CODE-04:
    verdict: dismissed
    reason: >-
      The repo has no ruff, black or formatter config, and ruff format would reformat 58 of the first 60
      tracked core .py files on main too. The rule asks for a format check against a standard the repo
      does not use, so it is not in force here; a repo-wide adoption is a separate decision.
  ARCH-07:
    verdict: dismissed
    reason: >-
      core/config.yaml line 10 is the repository's own GitHub address, the same line as in main's
      .garura/core/config.yaml (ADR 040 moved the file, it did not add the value). A config file exists to
      hold such a value; the rule targets hard-coded endpoints in code.

new_findings:
  - id: N-1
    severity: P3
    file: core/components/plays/vision/scripts/write_drive_review.py
    line: 34
    also_files:
      - core/components/plays/understand/scripts/write_drive_review.py
      - core/components/plays/play-creator/references/write_drive_review.py
      - core/components/plays/play-creator/references/test_drive_contract.py
    basis: >-
      pr.md on main bucket P3 (drift) with the P1 definition "breaking API contract" as the reason it
      matters; main:core/tools/memory/README.md line 230 (the contract changes only by a new version, so
      every consumer must follow each new version).
    finding: >-
      The F1 fix pins the writer to an exact list ("4", "5"). The next contract version (6) makes every
      drive that records its decisions write nothing again, which is the round-1 P1 failure on a delay.
      The round-1 advice was to accept the tool's current version, or any at or above 4, and to test with
      a live-shaped answer. The test still builds its "5" case by editing a hand-made answer, not by
      running the tool. Three copies hold the same constant.
  - id: N-2
    severity: P4
    file: core/components/plays/intent/SKILL.md
    line: 99
    basis: >-
      pr.md on main bucket P4 (small drift); sibling behaviour in core/components/plays/understand/SKILL.md
      lines 159-162 ("a halt before Step 0 deletes the scratch").
    finding: >-
      The new pre-flight scratch flow has two loose ends. (1) /intent never says a hard halt before Step 0
      deletes the scratch folder (made with mktemp -d), so a halt leaves a stray folder in the system temp
      area; /understand states the deletion, and /intent's F14 recovery only says "hold it in the scratch
      folder". (2) preflight.json is produced before Step 0, so it records branch main, issue null and
      on_default_branch true, then is moved into the issue's working folder and kept as run evidence; the
      sentence that said the resolver reads the issue from the branch start-change cut was removed. Nothing
      reads the file afterwards, so no behaviour breaks, but the kept record is stale. SE-14 is a prose
      check with no script behind it (same as /vision and /understand).
  - id: N-3
    severity: P4
    file: core/components/plays/intent/SKILL.md
    line: 544
    also_files:
      - core/components/plays/vision/SKILL.md
      - core/components/plays/understand/SKILL.md
    basis: >-
      main:CLAUDE.md "Play Pipeline Rules" (an intent change goes through the ICE source and /play-editor;
      never hand-edit a compiled SKILL.md for an intent change); pr.md on main bucket P4.
    finding: >-
      Commit 9668cb47 adds C14/F14/REC14 and SE-14 to /intent and rewrites fingerprints in all three plays,
      but the compiled_by rows were not given an entry for this change, and the commit does not say it was
      compiled with /play-editor. The fingerprints do equal the ICE hashes and lint_play passes, so the
      result is consistent; whether the SKILL text came from the compiler or a hand sync cannot be told
      from the branch. Please confirm.
  - id: N-4
    severity: P4
    file: core/components/plays/play-creator/references/guidance_block.py
    line: 25
    basis: >-
      main:core/components/memory/standards/rules/grounding-eval.md ("What the judge is given": the
      judge never gets the gold example); pr.md on main bucket P4.
    finding: >-
      cut() ends a guidance block at the next line that starts with "## ". It is right for all four
      grounding templates today (checked), but a template that ever put its gold example under a "###"
      heading inside the guidance block, or inside a fence-less block, would leak it to the judge with no
      warning. The test covers the happy cuts and the fence case; it has no test that the output holds no
      gold-example heading. A guard that refuses output containing "Gold example" would make the rule
      machine-checked.
