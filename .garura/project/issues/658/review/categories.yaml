design_bearing_categories: [tool-interface-contract, tool-design-document]   # the two categories that need a Layer 2 grounding dispatch, one each, concurrent and read-only. Not design-bearing: executable-code, tests, documentation (Layer 1 only), and the two STM categories (no playbook, no design content of their own).
absent_seeded_categories: [decision-records, harness, memory, config-maps]   # no docs/adr/** path (the ADR amendments the change implies are not in the diff); nothing under core/components/**; nothing under core/components/memory/**; the one config file with a change (.garura/core/config.yaml) is an uncommitted working-copy edit, not in the diff
path_accounting:   # 51 + 1 + 4 + 6 + 1 + 3 + 7 = 73
  tool-interface-contract: 51   # v3.json + 50 samples (31 version-only, 6 edited, 5 new, 7 broken edited, 1 renamed; counts of 50: 31 + 19)
  tool-design-document: 1
  executable-code: 4
  tests: 6   # 3 suites + the end-to-end runner + its two records
  documentation: 1
  stm-working-notes-plans: 3
  stm-run-records: 7
missing_playbooks:
  - tool-interface-contract   # a machine-readable interface contract for a tool, with worked examples and a check; also named in the 655 and 657 reviews; design-bearing, so its missing playbook matters most
  - tool-design-document   # the design document of a tool (what the person sees and does, how it talks to the framework, build order); design-bearing; new in this review, because the earlier reviews filed this file with the plans
  - stm-working-notes-plans   # Garura's own plans under .garura/project/issues/**; also missing in the 656, 657, 667 and 655 reviews
  - stm-run-records   # play run receipts under .garura/project/issues/**; also missing in the 656, 657 and 667 reviews
playbook_sharpening:
  - id: review/tests
    note: "it says 'run the suite' without saying what to do with an acceptance runner that needs a person in the middle of it (here, the approval page, outside git). It also does not say where such a runner and its recorded output belong when they sit in an issue's evidence folder."
  - id: review/code
    note: "it says to read data-safety paths hard; it does not say how to treat a record that says 'a person decided' when the code takes the person's name and the place they decided from the caller (here decide and decided_in). A command whose answer carries a claim the tool cannot check is a design question, routed to the contract category."
  - id: review/docs
    note: "it says a README that is not an ADR, harness or memory file is documentation with Layer 1 only; it does not say what to do when the README names plays and pages that do not exist on the base ref (here /learn-memory, /promote-memory and a prototype page outside git). The categories file routes the design statements to the design-bearing neighbour as claims to test."
