method: >
  Principles were reconstructed only from sources committed on main (git show main:<path>):
  the base version of this same design document (sections 1, 2, 3, 4, 5, 7, 10), its mockup,
  ADR 031, 032, 033, 034, 035 and 036, the committed memory-tool contract (version 2), and the
  committed #606 and #653 plans. Nothing the branch adds or rewrites was used as grounding.
  The owner's decisions of 2026-10-18 are quoted in the branch's added text and in the branch's
  #658 plan; they are used here only to answer "is this departure backed by an owner decision",
  never to say what the committed design is. Where a decision is only on the branch, the finding
  says so.
