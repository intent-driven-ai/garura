      $defs.update decided_in; samples/decide.json
    finding: >
      ADR 035 part 5 and ADR 036 part 7 say a person approves by typing until the review tool has the Memory and ADRs section. v3
      requires decided_in on every decide, and the only allowed value is "review-tool". So the contract has no honest value for the
      approval path the ADRs on main keep for now: a person who types "approve" in a session can have it recorded only with a label
      that is not true. One label also covers two different surfaces (the review tool, and the local prototype page that stands in
      until it is built, which is deliberately outside git and not in this diff). A repository clone has no surface that matches
      the committed contract. A one-value enum also cannot grow without a new contract version.
    failure_scenario: "A person approves by typing, as ADR 036 part 7 says; the agent records it with decided_in review-tool, and the record is false."
    principle_violated: ADR036-S7-TYPED-APPROVAL-UNTIL-REVIEW-TOOL
    committed_source: "docs/adr/035 Decision part 5, fourth bullet (line 75); docs/adr/036 Decision part 7, last bullet (line 80), and Negative / Risks (line 117) (main)"
    suggested_direction: >
      Either add the values the record needs (for example typed, review-tool-prototype, review-tool) or record in the ADR amendment
      that typed approval is retired. Say in the contract which surface each value means.

  - id: TIC658-7
    severity: P3
    backing: "consequence of 'always STM' (backed on main in working notes); the pre-issue case has no owner word anywhere"
    file: >
      core/tools/memory/contract/v3.json (commands.propose request.required adds issue; $defs.issue integer >= 1; tiers.short-term);
      core/tools/memory/README.md ('The lookup order', 'When no tier answers')
    finding: >
      v2 let a lookup of Garura or Phoenix memory name no issue, so work can look things up before its issue exists (ADR 008 part
      4 parks that work in _pending/). The README says an empty answer, with or without an issue, "is the cue to raise a memory
      update". v3 makes every update land in an issue's short-term memory and requires issue on propose, as an integer of at least
      one, with a target_path that starts with '<issue>/'. So a no-issue lookup that finds nothing ends in an update that cannot
      be raised. The 655 review raised the same shape for lookups (TIC-3, P2); v2 fixed it for lookups, and v3 reopens it on the
      write side.
    failure_scenario: "start-feature looks up a rule before its issue exists, finds nothing, and cannot raise the update that would fill the gap."
    principle_violated: ADR035-S3-LOOKUP-NEVER-BLOCKS
    committed_source: "docs/adr/035 Decision part 3 (lines 55-59); docs/adr/008 Decision part 4 (main)"
    suggested_direction: >
      Say what a pre-issue update does: wait until the issue exists and then be raised, or land in _pending/ and move with the
      run. One sentence in propose and one broken or good sample.

  - id: TIC658-8
    severity: P3
    backing: >
      not a departure: ADR 035 and ADR 036 both list "whether the rest of a drive goes on while one memory update waits" as open.
      The owner's answer is in the branch record only (658 plan item 1b). Amendment owed.
    file: >
      core/tools/memory/contract/v3.json (answer_rules.blocking; commands.propose request.blocking; $defs.update blocking);
      core/tools/memory/README.md ('When no tier answers' item 1)
    finding: >
      v3 answers the open question as an answer rule: false lets the rest of the work go on, true stops the work until a person
      decides, and false is the default. Three things the contract cannot hold. (1) The proposer, the agent that wants to go on,
      sets the flag; nothing checks it. (2) "Only the work that needs the answer waits" has no handle: an update names its issue but
      not what depends on it. (3) No code reads the flag (the PR body says no drive reads it); the check only holds that propose
      carries it as given. ADR 034 kept "a question nothing supports still stops the drive" as a recorded benefit; the default now
      points the other way, a deliberate owner call, but it means a missing flag lets work go on. This is a label, like decided_in.
    failure_scenario: "A drive hits a gap it cannot do without; the agent raised the update with the default blocking false, and the drive runs on."
    principle_violated: ADR035-NOT-DECIDED
    committed_source: "docs/adr/035 Negative / Risks, 'Not decided here', third bullet (line 134); docs/adr/036 line 122; docs/adr/034 Consequences, Positive (main)"
    suggested_direction: >
      Record the answer in the ADR amendment. In the contract say blocking is a recorded intent that a later drive reads, and
      consider making it required (no default) so the proposer must choose.

