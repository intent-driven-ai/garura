# check-change Layer 1 — installed tools, source layout (changed_paths hold core/components)
lint_components:
  command: "node .garura/core/tools/lint-components/index.js --layout source --target core/components"
  exit: 1
  findings_in_changed_paths: 0
  there_before: 37   # error lines, none in a changed path
lint_play:
  command: "python3 .garura/core/tools/lint-play/lint_play.py core/components/plays/shape-plan/SKILL.md --next-map .garura/project/issues/875/context/templates/standards/rules/pipeline-next.md"
  verdict: FAIL
  gaps:
    - check: "next-command (pipeline-next)"
      detail: "shape-plan has no entry in the handed-out Next-line map (Phoenix copy); the source map core/components/memory/standards/rules/pipeline-next.md has it"
      there_before: true   # the base-ref SKILL.md fails the same check with the same map
  findings_in_changed_paths: 0
ruff:
  command: "ruff check (4 scripts + 3 tests in shape-plan/scripts)"
  result: "All checks passed"
tests:
  command: "python3 test_<name>.py, each in core/components/plays/shape-plan/scripts"
  result: "10 suites, 133 passed, 0 failed"
