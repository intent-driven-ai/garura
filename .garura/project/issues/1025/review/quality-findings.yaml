    check_ice_workable.py: "4 copies (shape-plan, reshape-plan, specify-intent, build-play/references): all sha1 4e20ac76..., byte-identical"
    platform_adapter.py: "8 copies (shape-plan, design-eval, design-slice, merge-work, review-work, validate-work, track-plan-changes, build-play/references): all sha1 00d9c34b..., byte-identical"
    result: "15 files in 3 groups, 0 differ"
  product_model:
    file: .garura/product/product-os/_spine.yaml
    diff_numstat: "239 added, 280 removed"
    removed_lines: "280 lines, every one 'status: proposed' (1 domain + 40 capabilities + 239 features)"
    added_lines: "239 lines, every one 'status: Unplanned'"
    other_change: "none: with status lines stripped, domains, capabilities and features equal their main versions; profile, slices and ices are equal as they stand; counts 1 / 40 / 239 / 3 / 0 / 273 unchanged"
    after: "parses as YAML; 0 domain and 0 capability entries hold a status; all 239 features hold exactly one status and it is Unplanned (a value ADR 070 names)"
    migration_record: ".garura/project/issues/1056/context/migrate-status/link-report.json says domains_cleared 1, capabilities_cleared 40, features_set_unplanned 239, features_kept 0: 280 in all, matches"
    result: "counts match (280 removed, 239 Unplanned, nothing else changed)"
  run_records:
    files_checked: 45
    path_scan: "a grep for home-folder, temp-folder and account-name patterns over the 45 files, in the working tree and in their HEAD versions: 0 matches"
    manifest_check: ".garura/project/issues/1025/context/memory/manifest.json lists 9 copies; all 9 exist and the sha256 of each copy equals its recorded fingerprint"
    result: "no home-folder, temp-folder or account-name path in any run record; manifest holds"
  data_safety_reads_before_writes: >-
    write_work_items.py refuses (exit 2, nothing written) unless the approval is a yes and matches the hashes of
    work-items.json and drafts.json, and runs precheck() (which only reads the tracker) before any write; every
    tracker write goes through Writer.do(), which saves the record after each step and stops at the first failed
    step (exit 1). The model write is not in these scripts: planned_request.py only builds a request and, with no
    state change, an empty one (the play skips the write). Reads and checks come before writes.
