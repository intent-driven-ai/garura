meta:
  pr: 1047
  scope: standards-driven categories only (executable-code 35, tests 18, docs 2, product-model 1, run-records 45 = 101 paths); harness and memory are not in this file
  diff_path: '.garura/project/issues/1025/review/pr.diff'
  taxonomy_path: '.garura/project/issues/1025/context/memory/standards/rules/pr.md'
  categories_path: '.garura/project/issues/1025/review/categories.yaml'
  changed_paths_count: 101
  scan_coverage: 1.0000
  layer: 1
findings: []
counts:
  P1: 0
  P2: 0
  P3: 0
  P4: 0
checks_run:
  scan:
    command: "python3 .claude/skills/check-pr-quality/scripts/scan_taxonomy.py --taxonomy <pr.md copy> --diff pr.diff --paths <the 101 paths>"
    result: "exit 0, errors=0, scan_coverage 1.0. Raw script count P1=0 P2=4 P3=12 P4=5 (21 hits), CODE-20 catch-all=56 (a count, not findings)"
    reading: >-
      All 21 raw hits are pure path rules (no grep rule fired on any added line) and sit on two files:
      core/tools/plan/test_plan.py (ARCH-02, ARCH-03, ARCH-08, CODE-03, CODE-04, CODE-09, CODE-10, CODE-11,
      CODE-12, CODE-13, CODE-14, CODE-15, CODE-17, CODE-19; line 1, path only) and core/tools/plan/README.md
      (DOC-01, DOC-09, DOC-10, DOC-11, DOC-14, DOC-15, DOC-16; line 1, path only). Each row needs evidence the
      path cannot give (lint message, cycle trace, function score, line count). Each was checked against that
      evidence below and none holds, so none is entered as a finding. Every .py under core/components is
      classed garura-prose by the taxonomy's own scoping table, so no path rule reaches those 52 files; the
      ruff run and the added-line greps below stand in for them.
    raw_hits_disposition:
      CODE-03: "ruff E731 at test_plan.py:338 is on a line this PR did not change (line 298 on main): there before"
      CODE-04: "no formatter config is committed, and ruff format would change all 53 py files and their main versions alike: a repo-wide style, not a defect of this diff"
      ARCH-02_CODE-14: "no import cycle: test_plan.py imports only the standard library and plan"
      CODE-09_CODE-10_CODE-11_CODE-15: "ruff C901, PLR0912, PLR0915 on test_plan.py: all checks passed; the one new test function is about 40 lines, 2 levels deep"
      ARCH-03_ARCH-08_CODE-12_CODE-13_CODE-17_CODE-19: "no new file; the +40 lines are one test; no TODO, no print, no long or oddly named identifier added"
      DOC-01_DOC-09_DOC-10_DOC-11_DOC-14_DOC-15_DOC-16: "README.md exists and its diff only rewrites the plan-file field list (intent, epic, slices, represents, held_by); every field it names appears in the new test and the tool; no setup, troubleshooting or architecture section was added or removed by this diff"
  ruff:
    command: "ruff check (0.15.20, default rules, no committed config) on the 53 changed .py files (35 executable-code + 18 tests)"
    result: "3 violations, all on lines this PR did not touch; 0 on changed lines; 0 new"
    there_before:
      - "core/components/plays/specify-domains/scripts/test_vision_scripts.py:383 E731 lambda assigned (main: line 381)"
      - "core/components/skills/link-model-part/scripts/test_link_part.py:8 F401 textwrap unused (main: line 8)"
      - "core/tools/plan/test_plan.py:338 E731 lambda assigned (main: line 298)"
    main_comparison: "ruff on the main versions of the same files gives the same 3 violations; the 4 new files (check_states.py, planned_request.py, test_scenarios.py, test_states.py) are clean"
  tests_run:
    runner: "plain scripts run with python3 from their own folder; the two unittest files run with python3 -m unittest from their own folder (the link-model-part one also from the repo root by path)"
    all_green: true
    results:
      - "core/components/plays/build-play/references/test_check_ice_workable.py: exit 0, 49 passed, 0 failed"
      - "core/components/plays/design-eval/scripts/test_shape_eval_scripts.py: exit 0, 70 passed, 0 failed"
      - "core/components/plays/design-slice/scripts/test_shape_slice_scripts.py: exit 0, 131 passed, 0 failed"
      - "core/components/plays/shape-plan/scripts/test_check_drafts.py: exit 0, 18 passed, 0 failed"
      - "core/components/plays/shape-plan/scripts/test_check_plan.py: exit 0, 12 passed, 0 failed"
