      - "core/components/plays/shape-plan/scripts/test_gather_plan.py: exit 0, 32 passed, 0 failed"
      - "core/components/plays/shape-plan/scripts/test_render_brief.py: exit 0, 17 passed, 0 failed"
      - "core/components/plays/shape-plan/scripts/test_scenarios.py: exit 0, 23 passed, 0 failed"
      - "core/components/plays/shape-plan/scripts/test_states.py: exit 0, 15 passed, 0 failed"
      - "core/components/plays/shape-plan/scripts/test_support.py: exit 0, 34 passed, 0 failed"
      - "core/components/plays/shape-plan/scripts/test_write_plan_file.py: exit 0, 12 passed, 0 failed"
      - "core/components/plays/shape-plan/scripts/test_write_work_items.py: exit 0, 26 passed, 0 failed"
      - "core/components/plays/specify-capabilities/scripts/test_persist_understand.py: exit 0, 103 passed, 0 failed"
      - "core/components/plays/specify-domains/scripts/test_vision_scripts.py: exit 0, 48 passed, 0 failed"
      - "core/components/skills/link-model-part/scripts/test_link_part.py (unittest): Ran 58 tests, OK"
      - "core/tools/plan/test_plan.py (unittest): Ran 21 tests, OK (skipped=1)"
    totals: "18 suites run, 18 green, 0 red, 0 not run; plain-script checks 628 passed, 0 failed; unittest 79 tests OK, 1 skipped"
    skipped_test:
      file: core/tools/plan/test_plan.py
      line: 353
      detail: "test_every_plan_of_this_repository_reads_with_the_template skips with 'no plans folder in this checkout'. The skip is a condition on the checkout, not a disabled test, and the line is not in this PR's diff: there before. The repository-plans check does not run in this checkout."
    working_tree_after_runs: "no new or changed tracked file outside the review run records (checked with git status)"
  added_line_greps:
    command: "grep over the 3813 added lines of the 53 changed .py files"
    patterns: "shell=True, os.system, eval(, exec(, pickle, yaml.load(, unsafe_load, bare except, except Exception: pass, breakpoint, pdb, TODO, FIXME, XXX, http://, hard-coded api key/secret/password/token of 8+ characters, os.environ, md5, sha1, rmtree, os.remove, unlink, shutil.move, skip, xfail, mock, patch(, sleep("
    result: "no match in code under test. Only deletion calls: 4 test clean-ups (test_shape_eval_scripts.py:462, :475, :665 and test_write_plan_file.py:131) that remove their own temp files or folders; no skipped, mocked or sleeping test"
