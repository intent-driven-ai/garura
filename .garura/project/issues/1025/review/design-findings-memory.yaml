  - id: M-6
    severity: P4
    file: core/components/memory/standards/templates/eval-plan.md
    line: 41-44
    principle: PR-5
    basis: 'ontology.md v18 line 493 (a dropped feature stays listed as Dropped, the plan''s eval does not test it); standards/rules/eval-format.md rule on main is silent, but the branch''s own rule says "Out of the plan" is for a feature "left the plan, or was dropped from it" - the template line and the rule must agree'
    detail: 'The template''s "Out of the plan" entry reads "its feature left the plan; kept, not run". The rule adds "or was dropped from it". A feature dropped from the plan (ontology line 493) is not a feature that left the plan, so the template''s wording does not cover the case the rule adds.'
    suggested_fix: 'Change the template line to "its feature left the plan or was dropped from it; kept, not run".'
    blocks_merge: false
