  - id: M-7
    severity: P4
    file: core/components/memory/standards/rules/eval-format.md
    line: 10-11
    principle: PR-5
    basis: 'ontology.md v18 line 493 (the feature is Dropped) against ontology line 722 (a plan-tree item is Dropped when its issue closes as not planned) and docs/adr/070 lines 72 and 80-82 (Dropped is set by a person through /reshape-plan; nothing says it closes the Feature issue)'
    detail: 'The rule leaves out a feature "whose Feature issue item in the plan file''s tree is Dropped". The ontology says the plan''s eval does not test a feature that is Dropped, and a feature''s state is only in the model, while the tree item follows its issue. The two coincide only if dropping a feature through /reshape-plan also closes its Feature issue as not planned, which no committed source says. A feature Dropped in the model with an open Feature issue would still be tested.'
    suggested_fix: 'Ask the ontology (or ADR 070) to say that dropping a feature closes its Feature issue as not planned, or key the rule on both signals (item Dropped, or the feature''s state Dropped read by the plan).'
    blocks_merge: false
    category: memory
