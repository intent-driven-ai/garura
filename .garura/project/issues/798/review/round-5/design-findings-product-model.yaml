findings:
  - id: PM-F2
    status: carried   # from round 4, unchanged
    title: "The slice's outcome runs to a paragraph"
    severity: P4
    file: .garura/product/product-os/slices/sl-intent-to-design.yaml
    line: 5
    principle: PM-1
    source: "plan/788/base:core/components/memory/standards/schemas/product-os/slice.yaml, slice.outcome ('one line: the usable thing this slice delivers'); pr.md P4 (style-only)"
    problem: "Carried from round 3, unchanged. The outcome (lines 5-8) is one long sentence with three parts and a trailing clause about the flag being recorded in a build run's evidence. The model promises one line."
    leads_to: "A reader, and the play that reads the spine line, get a paragraph where the model promises a line. Nothing breaks. The product owner already kept fn-898 in the slice and approved the name, so only the length is left."
    fix: "Shorten the outcome to one sentence, for example the three written parts and 'an eval no build is given', and leave the flag to fn-898."

  - id: PM-F6
    status: carried   # from round 4, unchanged
    title: "fn-898's sources point at things a later reader cannot open"
    severity: P4
    file: .garura/product/product-os/software-delivery-planning/shape-eval/fn-898/feature.md
    line: 39
    also: ["fn-898/feature.md:41", "fn-898/feature.md:16", "fn-898/feature.md:20"]
    principle: PM-2
    source: "plan/788/base:core/components/memory/standards/schemas/product-os/grounding/feature.md ('## Sources': where it is seen, one source per line, in words a later reader can open); pr.md P4"
    problem: "Carried from round 3, unchanged. Sources cite 'Q-builders-1' and 'Q-flag-1', which are question ids in one issue's working file, and 'evidence-file.md, lines 34-38', a line range that moves. The rules (lines 16 and 20) also lean on 'the product owner's answer to Q-builders-1 / Q-flag-1'. The same ADR 057 sentence is pasted into six pages (domain.md:18, capability.md:16, fn-795:41, fn-798:35, fn-818:43, fn-898:38)."
    leads_to: "A later reader cannot open the answer the page rests on, and six places must be kept in step when the ADR changes."
    fix: "Replace the question ids with the words of the answer, or with #898 where they are recorded; drop the line range; cite ADR 057 once in each page in the page's own words."

  - id: PM-F7
    status: carried   # from round 4, unchanged
    title: "The intent page states two different limits on the eval"
    severity: P4
    file: .garura/product/product-os/intents/bi-788.md
    line: 18
    also: ["bi-788.md:16", "bi-788.md:20"]
    principle: PM-4
    source: "plan/788/base:core/components/memory/standards/schemas/product-os/ontology.md, kind Business Intent (Properties 'Must not' and 'Confirmed by and when'; Rules 'Only a person confirms or drops it'); pr.md P4"
    problem: "Carried from round 3, unchanged. The Must-not list (line 18) says 'Do not let a builder read the eval', while the proof line (line 16) and every model page say the build is given the intent and a read is only flagged, never blocked. The owner approved the proof line, not this Must-not line. The confirmation footer (line 20, 2026-10-24, #844) still reads as covering the old proof line; the reason it changed later is in commit 96567014 and #901, not on the page."
    leads_to: "A reader finds two limits on the same thing and cannot tell which the owner means. No effect on a run today."
    fix: "Ask the product owner whether the Must-not line stays as written. Leave the footer note to #901, which records who asked, when and the words; do not edit the intent page again by hand."

  - id: PM-F9
    status: carried   # from round 4, unchanged
    title: "A directional capability page lists its features"
    severity: P4
    file: .garura/product/product-os/software-delivery-planning/shape-eval/capability.md
    line: 6
    principle: PM-8
    source: "plan/788/base:core/components/memory/standards/schemas/product-os/grounding/capability.md (directional stage: 'never touches features'); ontology.md, kind Capability; pr.md P4"
    problem: "Carried from round 3, unchanged. cap-shape-eval is directional, and its page has a 'Features:' paragraph (line 6) naming fn-798 and fn-898 with a summary of each. The directional stage keeps features out of the page; the spine already holds them. The question also stays open: fn-898 holds two checks about the build under a capability named 'Write the hidden eval', and the owner has not said which capability owns it."
    leads_to: "The paragraph can drift from the spine, and a reader may take a build-side check as part of writing the eval."
    fix: "Delete the 'Features:' paragraph. Product owner to say whether cap-shape-eval is the right parent for fn-898."

  - id: PM-F10
    status: carried   # from round 4, unchanged
    title: "The hidden file's header still has the slice's old name"
    severity: P4
    file: .garura/project/plans/788/evals/intent-to-design/failure-and-recovery.md
    line: 3
    principle: PM-7
    source: "plan/788/base:core/components/memory/standards/schemas/product-os/ontology.md, kind Slice (Id and name) and the opening paragraph (same words for the same things); pr.md P4"
    problem: "Carried from round 3, unchanged. The slice was renamed 'Name a business intent, and three plays write its slice, plan and eval', but the hidden file's header (line 3) still reads 'Slice: From a named piece of work to its design'. It is the only place the old name is left. (The file is outside the product-model paths; found while checking the rename.)"
    leads_to: "A person searching the eval by the slice name finds two names for one slice."
    fix: "Make the hidden file again from the renamed slice record (the play writes it), so the header carries the new name."

  - id: PM-F11
    status: carried   # from round 4, unchanged
    title: "A rule tells the story of an earlier draft"
    severity: P4
    file: .garura/product/product-os/software-delivery-planning/shape-eval/fn-898/feature.md
    line: 16
    principle: PM-2
    source: "plan/788/base:core/components/memory/standards/schemas/product-os/grounding/feature.md ('Rules & behavior': the logic, states and edge cases; each line explains itself); pr.md P4"
    problem: "Carried from round 3, unchanged. A rule says 'When the list named only some plays, a play that builds code and is not on the list could be given the eval'. It tells the story of an earlier draft that a later reader has never seen."
    leads_to: "The page does not say what holds now; a reader may think a list of plays still exists."
    fix: "Say it as a rule: every play, skill and agent that builds the software is covered, so a play not on any list is still checked."

