by_hand_checks:
  data_safety_persist_slice:
  - 'A second run changes nothing: HOLDS for a re-run after the kept slice already took its text (the record then equals the shaped text, so no part differs, no history line, action unchanged; proven by
    the existing test at test_persist_slice.py line 304). FAILS for a re-run after a reuse that added a new intent and left the text alone: see finding 1 (reproduced).'
  - 'Only the named parts change: HOLDS. reshape_text (lines 248-270) writes only slice.name, slice.outcome and surface.user_action, and only when `own`; the rest of a record changes only through the intents
    merge (373), the feature change (374-375, only with --pull-in/--push-out), the v2 upgrade (to_v2, named in upgraded_to_v2) and the one appended `edits` entry. Everything is planned on a deep copy and
    compared (383) before any write.'
  - '--at is checked: PARTLY. It is required, and the run is refused with nothing written, whenever the record would take new text (lines 378-381; test at line 270). Its value is not checked: any non-empty
    string is written into the history line (finding 2, reproduced).'
  - 'A slice in progress is still refused: HOLDS. in_progress (280-282) is checked before any read of the record or any write (321-323), on the id actually written (reuse id or the new slice id); the four
    statuses match the schema (epic.yaml line 47, spine.yaml line 214); reproduced: in_delivery and delivered exit 2 with nothing written; tests at lines 326-331 cover validated and the new-slice-with-that-id
    case. One small hardening note: finding 4.'
  - 'Every check runs before the first write: HOLDS. All refusals are raised inside plan(); write() (442-453) runs only after plan() returns. Each file goes through atomic_write. The two files are two separate
    atomic writes (spine, then record); a stop between them leaves the spine ahead of the record, and the next run then reads that as a re-run, which is how finding 1 shows up there too.'
