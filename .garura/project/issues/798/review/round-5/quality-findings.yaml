findings:
- id: Q5-1
  title: Running the same shaping step a second time can overwrite slice text the first run left alone
  severity: P2
  basis: 'pr.md severity buckets: P2 Major covers error-handling violations and data-integrity gaps that do not block; the script''s own header (persist_slice.py lines 24-27, 54-56, 68-73) promises a re-run
    adds nothing twice, and the check the review was asked to make is ''a second run changes nothing''. The code path is lines 257-258, 343 and 377.'
  where: core/components/plays/shape-slice/scripts/persist_slice.py lines 257-258 (own), 343 (added), 377 (reshape call); play steps SKILL.md Step 8 and the 'run Steps 8-10 again' and resume rules (lines
    629, 1122-1127)
  artifact_type: runtime-code
  problem: 'Whether the kept slice takes the new name, outcome and tester action depends on ''no new intent was added in this run'' (own = not added). The first run of a reuse that adds a new intent adds
    it to the spine, so it correctly keeps the old text and the brief says ''the record keeps its text''. Run the same command again and that intent is already there, so nothing is ''added'', own turns
    true, and the record now takes the new text and writes a history line. Reproduced: run 1 (new intent bi-99, new text) left the name ''Old''; run 2 with the same input and --at left the name ''New name'',
    three parts replaced, a history line added. Run 2 without --at is refused, but the play always passes --at <today> in Step 8, so the play''s own call would not be refused.'
  leads_to: A repeat of Step 8 (the guard report asks for 'run Steps 8-10 again', a resume after the slice was written, or a stop between the spine write and the record write) silently turns 'kept as it
    was' into 'replaced', the opposite of what the person was shown at the checkpoint. The old text is not kept anywhere in the record (the history line names the parts, not the old words), so it is gone
    from the model once the run is committed.
  fix: 'Decide ''own'' from the state before the first run, not from this run''s added list: for example, treat the text as a reshape only when the shaped slice''s intents are all already on the record''s
    own intents list and the reuse was asked for a reshape (pass an explicit flag from the play), or refuse a text change on a run that finds the spine and record already carrying the shaped intents unless
    that flag is given. Add the missing test (finding 3).'
- id: Q5-2
  title: The date given with --at is written into the history line without being checked
  severity: P3
  basis: 'pr.md severity buckets: P3 Minor; input at the edge of a script that writes model files should be validated (the script header says every check runs before the first write and lists the checks,
    lines 68-73, with no mention of the date).'
  where: core/components/plays/shape-slice/scripts/persist_slice.py lines 378-382 (the only check is 'not empty'), 466-467 (argument, no type)
  artifact_type: runtime-code
  problem: 'Any non-empty text is accepted as the date: reproduced with ''   '' (blank spaces) and with ''banana'' plus a line break, and both were written into the record''s edits list as the entry''s
    `at`. The YAML dump quotes it safely, so nothing breaks, but the history line then holds a value that is not a date.'
  leads_to: A history line the next person cannot trust or sort; a later edit tool or the review reads `at` as a date. edit_slice.py takes --at the same way, so the same gap sits there.
  fix: Check --at against the date form the play passes (an ISO date or date-time in UTC) in plan() before any write, and refuse with a plain message. Add a test for a bad value.
- id: Q5-3
  title: No test covers a repeat of a reuse that added an intent, or a bad --at
  severity: P3
  basis: 'pr.md severity buckets: P2/P3 ''missing tests for new code''; TEST-01 expects tests beside new logic. Rated P3 because the new logic does have tests for the main path (106 cases pass).'
  where: core/components/plays/shape-slice/scripts/test_persist_slice.py lines 270-306 (the reshape cases) and 326-331
  artifact_type: tests
  problem: The reshape cases run the same-intent path twice (line 304) but never run a reuse with a new intent and then run it again, which is the case in finding 1. No case gives --at a value that is not
    a date. No case checks that the old text of a part survives anywhere after it is replaced.
  leads_to: Finding 1 and finding 2 pass the suite unseen; a future change can keep them.
  fix: 'Add: reuse with a new intent and new text, assert the record keeps its text; run it again and assert nothing changes (or whatever finding 1''s fix decides); and a refused --at test.'
- id: Q5-4
  title: A slice-in-progress check ignores an epic status it does not know
  severity: P4
  basis: 'pr.md severity buckets: P4 Nit; defensive handling at a guard that protects data.'
  where: core/components/plays/shape-slice/scripts/persist_slice.py lines 99 and 280-282
  artifact_type: runtime-code
  problem: 'in_progress lists the four statuses past ready. Reproduced: an epic with status ''done'', ''closed'', ''in_progress'', ''blocked'' or no status is not refused, and the run changes the record.
    The schema allows only five statuses (epic.yaml line 47), so today this needs a hand-edited or misspelled spine.'
  leads_to: A typo in an epic status turns the guard off for that slice.
  fix: Refuse any status that is not 'ready' (allow-list the one safe value) instead of listing the unsafe ones.
