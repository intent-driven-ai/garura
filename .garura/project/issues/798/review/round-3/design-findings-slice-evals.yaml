grounding_note: >
  Every principle comes from a source committed on the base ref plan/788/base (git show plan/788/base:<path>),
  from the memory tool (standards/rules/builder-isolation.md and the severity taxonomy standards/rules/pr.md, both
  short-term copies; found with the memory tool, issue 798), or from the product owner's own answer
  (Q-recovery-1-4, grounding-questions.md), which is used as an instruction and not as a branch design. ADR 057,
  the eval format standard, the step library, the eval templates and the new story and ICE lines are added by this
  branch and are NOT used as grounding. No review playbook covers this category (playbook_missing in
  categories.yaml). Nothing here is run: the eval runner is a later play (#819); "not run" is not "passed".
  Round 3 reads the same principles as round 2 (PR-1 to PR-7, below). No extra memory was copied.
principles:
  - id: PR-1
    text: An eval tests from the outside, on the slice's surface, and reaches the built product only through the usage guide.
    source: "plan/788/base core/components/memory/standards/schemas/product-os/ontology.md (Slice: Eval row; Q29, Q31); docs/adr/049-*.md section 4"
  - id: PR-2
    text: The eval checks that every goal and expectation of the stories is met and that no failure condition in the hidden file happens; what it cannot test it says so.
    source: "plan/788/base ontology.md (Slice: Eval row, Q29)"
  - id: PR-3
    text: The eval holds no recovery condition and no handoff plan. The running eval reads only the recovery parts of the hidden file and writes the handoff plan (the symptom and the way back, never the failure condition, its id or the check).
    source: "plan/788/base ontology.md (Q29, Q35); docs/adr/049-*.md section 4"
  - id: PR-4
    text: The builder never receives failure conditions, recovery conditions or the evals; it receives the validator's handoff plan when a fix is routed back to it. The builder cannot teach to a test it cannot see.
    source: "plan/788/base docs/philosophy/idd-principles.md (Routing Table); core/components/memory/standards/rules/builder-isolation.md; docs/adr/049-*.md section 4"
  - id: PR-5
    text: The hidden file is written by /shape-slice, one entry per feature (feature, capability, the two ICE and which is thin, failure conditions with ids, exactly one recovery each with when / way back / who fixes); the story that delivers a feature never holds those lines.
    source: "plan/788/base docs/adr/052-*.md sections 1, 4, 7; ontology.md (Q33, Q34, Q36, Slice hidden-file row); standards/rules/expectation-generation.md 'A feature's recovery (product ICE)'"
  - id: PR-6
    text: The handoff rule. A recovery is 'the builder can fix this alone' only when the builder can fix it from information it already has, deterministically. It is 'a person must decide' when it needs judgment or authority the builder does not hold - mapping to an external entity (an issue), an approval, an outward-facing decision.
    source: "plan/788/base core/components/memory/standards/rules/expectation-generation.md 'The handoff rule (autonomous vs human)', lines 47-70"
  - id: PR-7
    text: The handoff plan that goes to the builder is made only from the recovery's when and way back. It says what the product does wrong and the way back, never the failure condition, its id or the check that found it. Per the product owner (Q-recovery-1-4) a builder's fix may name the hidden file or a check when that is the thing the feature builds, and never the test that found the failure.
    source: "plan/788/base docs/adr/049-*.md section 4; ontology.md Q35; the product owner's answer to Q-recovery-1-4 in .garura/project/issues/798/context/grounding-questions.md"
