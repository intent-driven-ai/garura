grounding:
  - principle: "Every part is built from its intent. A change to what a part guarantees is made in the ICE and the part is compiled again; the compiled part records the fingerprint of its ICE so the two never drift apart unseen (harness-standard principle 4)."
    source: "git show plan/788/base:docs/standards/harness-standard.md, principle 4 (lines 50-58)"
  - principle: "A change to a play's intent (what it decides or guarantees, its constraints, failure conditions, scenarios, flow) goes through the play's ICE and /edit-play; a compiled SKILL.md is hand-edited only for a non-intent change."
    source: "CLAUDE.md, 'Play Pipeline Rules' (Intent change / Non-intent change)"
  - principle: "Plays orchestrate, agents gather context, skills do the work; mechanical work is a script, judgment is a model (harness-standard principles 2 and 3)."
    source: "git show plan/788/base:docs/standards/harness-standard.md, principles 2 and 3 (lines 33-48); CLAUDE.md 'Agents hold the role of Context Crafting'"
  - principle: "Installed parts name only installed files; no pointer to Garura's docs; no edit notes in skill files."
    source: "git show plan/788/base:docs/standards/harness-standard.md principle 11 (lines 113-135); CLAUDE.md 'Source of Truth' and 'Play Pipeline Rules'"
  - principle: "The play, and only the play, records the full artifact set, the checkpoint decisions and the eval results of its run."
    source: "memory standards/rules/evidence-recording.md lines 25-31 (copy in context/memory/grounding-harness/standards/rules/)"
  - principle: "The shape-slice play before this branch guarantees that a reused slice changes only by pulling a feature in or pushing one out, and that the run keeps every other entry of the hidden file as it is."
    source: "git show plan/788/base:core/components/plays/shape-slice/reference/ice.md C7 and C15"
  - principle: "Severity buckets: P2 major (lint errors, missing tests, structural violations), P3 minor (missing docs, naming), P4 nit (style only)."
    source: "context/memory/standards/rules/pr.md lines 8-11"
