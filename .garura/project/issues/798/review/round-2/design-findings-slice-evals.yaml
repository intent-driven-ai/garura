checked_ok:
  - "Every one of the 25 failure ids of the hidden file has a tagged scenario in the matching eval file, and every goal and expectation of the four stories has a scenario (the eval summary counts 46 scenarios; Untestable is two notes, F17 of #798 and F24 of #898, each saying a person must read the steps). PR-2 holds."
  - "The eval holds no recovery condition and no handoff plan. 'Way back:' and '### Recovery' appear in the eval only as text to look for in a story or the plan file (eval.fn-818.feature.md 52-62). PR-3 holds."
  - "No builder-routed recovery line names a scenario, a tag, an F id or the eval's check that found a failure. The recoveries that name the evals folder, the eval, the hidden file or a check and go to the builder (F1, F3, F6 of fn-795; F20, F21, F22 of fn-898) are about files and checks the feature itself builds, which the product owner allowed (PR-7)."
  - "The Context of the slice eval names what the running eval reads - the eval, the usage guide, the recovery parts of the hidden file - as Q29 says; and the eval reaches the product through names that the usage guide maps (PR-1)."
  - "Hidden file: one entry per feature in spine order, with capability, thin marks, ids, exactly one recovery for each Fails if line (25 lines, 25 recoveries); written by /shape-slice (commits 74f10249, 78751e02), nothing in the evals folder written by the plan play (PR-5)."
findings:
  - id: SE-15
    severity: P3
    file: .garura/project/plans/788/evals/intent-to-design/failure-and-recovery.md
    line: 75
    also_lines: [91]
    principle: PR-6 / PR-4
    source: "plan/788/base failure-and-recovery.md (fn-818 entry: F8 and F11 'Who fixes: a person must decide'; F8 way back 'The person decides if the eval must be made again, because a builder may have read the line'); plan/788/base docs/philosophy/idd-principles.md Routing Table (the builder never receives failure conditions); docs/adr/049-*.md section 4 (a story never holds a failure condition, and the builder reads the story)"
    message: >
      F8 (a story or the plan file holds a failure condition or a recovery condition) and F11 (a story holds a
      failure condition) were 'a person must decide' on the base, because the builder reads the story, so it may
      already have read the line and a person must say whether the build and the eval still stand. They are now
      'the builder can fix this alone', and the sentence about the builder having read the line is gone. The
      same entry keeps F26 (a story names the eval) as 'a person must decide' with 'A person decides if a build
      that read the story must run again' (line 85), so the two agree for the eval and disagree for the failure
      condition. Taking the line out of the story is mechanical; knowing what a build that read it may have
      learned is not. Route both to a person, or add the sentence back to the way back.
  - id: SE-16
    severity: P3
    file: .garura/project/plans/788/evals/intent-to-design/failure-and-recovery.md
    line: 87
    also_lines: [71]
    principle: PR-6
    source: "plan/788/base expectation-generation.md handoff rule (mapping to an external entity such as an issue, and an approval, are 'human'); plan/788/base .garura/product/product-os/software-delivery-planning/cap-718/fn-818/feature.md line 21 ('Nothing goes to the tracker before the product owner's yes'); plan/788/base failure-and-recovery.md (F7 and F10 were 'a person must decide')"
    message: >
      F10 (the epic or a story has no tracker issue) says the way back is to make one tracker issue 'after the
      product owner's yes', and still says 'the builder can fix this alone'. A yes from the product owner is an
      approval the builder does not hold, and a tracker issue is an outward write; both are what the handoff
      rule sends to a person. F7 (a feature has no story, line 71) has the same cause: its way back writes a
      story, which is a tracker issue, and the base also had it as a person's job. F9 in the same entry
      (the tracker copies) is correctly 'a person must decide'. Route F7 and F10 to a person.
  - id: SE-17
    severity: P3
    file: .garura/project/plans/788/evals/intent-to-design/failure-and-recovery.md
    line: 177
    also_lines: [181, 134, 138]
    principle: PR-6 / PR-7
    source: "plan/788/base expectation-generation.md handoff rule; ontology.md Q35; the product owner's answer to Q-recovery-1-4 (a fix to the builder may name the hidden file or a check only when the feature builds it); plan/788/base failure-and-recovery.md (F17 was 'a person must decide')"
    message: >
      Two things in the fn-898 entry. First, F24 (the eval holds a check that nothing asks for) is the same
      condition as F17 of fn-798 (line 134), and F17 sends it to a person ('a person decides if that scenario
      goes') while F24 sends it to the builder alone: one condition, two routes. Second, F24 and F25 go to the
      builder and name things that fn-898 does not build: F24's 'when' names the eval and the hidden file as
      what a check must come from, and F25's way back (line 183) tells the builder to 'write the eval again from
      only the epic, its stories and the hidden file'. fn-898 builds the lint check and the ledger check. The
      same condition in fn-798 (F18, lines 138-141) is worded without any of these names. Route F24 as F17 is
      routed, and reword F25 like F18.
  - id: SE-10
    severity: P4
    file: .garura/project/plans/788/evals/intent-to-design/failure-and-recovery.md
    line: 52
    also_lines: [11, 100, 143, 64, 109, 130]
    principle: PR-5
    source: "plan/788/base ontology.md (Slice hidden-file row: the feature, its capability, the two ICE and which is thin, ids such as F1)"
    message: >
      Still open from round 1. The fn-795 entry has the header '- Capability: ... (Shape a slice)' and
      '- Thin: both ICE ...', and failure lines that start in capitals; the fn-818, fn-798 and fn-898 entries have
      '- Written from' and two 'Thin ICE' lines, the capability name dropped, and lower-case failure lines. F26,
      F27 and F19 stand before F10, F14 and F17 in the lists. All the parts the ontology asks for are there;
      the file has two layouts. This matters a little more now because the eval checks the Fails if lines 'word
      for word' (eval.fn-795.feature.md 111-117): a play that writes the first letter in capitals in one entry
      and not in another cannot satisfy that check in both.
  - id: SE-11
    severity: P4
    file: .garura/project/plans/788/evals/intent-to-design/eval.fn-898.feature.md
    line: 1
    principle: PR-5
    source: "grounding gap: feature fn-898, its ICE and its story are added by this branch (74f10249, 78751e02); no base page exists"
    message: >
      Still open from round 1. The fn-898 eval is checked only against the ICE and the story that this branch
      adds. Only the builder-isolation core (ontology Q28, Q32; ADR 049 section 4; the Routing Table) is grounded
      on the base. The lint check over build-play inputs and the ledger flag have no base source.
  - id: SE-14
    severity: P4
    file: .garura/project/plans/788/evals/intent-to-design/eval.fn-818.feature.md
    line: 93
    principle: PR-5
    source: "plan/788/base docs/adr/052-*.md section 2 ('The plan play writes nothing in the evals folder'); hidden file F12"
    message: >
      Still open from round 1. The F12 scenario checks that the evals folder holds 1 file and that the slice file
      is absent. A play that edits the hidden file in place still passes. Add a step that the hidden file is
      the same as before, or say in Untestable that the format cannot show it.
  - id: SE-18
    severity: P4
    file: .garura/project/plans/788/evals/intent-to-design/eval.fn-798.feature.md
    line: 80
    principle: PR-3 / PR-2
    source: "plan/788/base ontology.md Q35 (the running eval writes the handoff plan from the recovery condition) and Q29; the eval runner is a later play (#819), per categories.yaml"
    message: >
      F15 moved from 'untestable' to a scenario. The scenario runs 'the command that makes the handoff plan for a
      failed check of the first failure condition' (eval.sl-intent-to-design.md line 58), which makes the eval
      report a failed check and write the handoff plan. That is the work of the running eval and its runner, not
      a small reader of files as the Names section describes a command (line 27). Until #819, nothing behind
      the name exists, and neither the scenario nor the Context says so. Say it in the Context or in Untestable
      so that a run that cannot start this command is read as 'not run', never as 'passed'.
  - id: SE-19
    severity: P4
    file: .garura/project/plans/788/evals/intent-to-design/eval.sl-intent-to-design.md
    line: 69
    principle: PR-1
    source: "plan/788/base ontology.md Q31 (the usage guide is the eval's way into the product; names must map to one real thing); the folder-count step counts one folder's files (step library, format only)"
    message: >
      The name [the slice's evals folder] is defined as two folders: '.garura/project/plans/788/evals/ and the
      slice's own folder in it'. The scenarios count its files ('holds 1 files', 'holds 4 files') and look for
      'new files outside' it. Those only make sense for the slice's own folder; for the parent folder the
      count is 0 files. Define the name as the slice's own folder.
  - id: SE-20
    severity: P4
    file: .garura/project/plans/788/evals/intent-to-design/eval.fn-898.feature.md
    line: 9
    also_files:
      - .garura/project/plans/788/evals/intent-to-design/eval.sl-intent-to-design.md
    principle: PR-2
    source: "plan/788/base ontology.md (Slice: Eval row, every goal and expectation is met; what the eval cannot test it says so); story #898 goal 1 (inputs/story-898.md; the story text is the thing the eval is built from)"
    message: >
      Goal 1 says no build play, build skill, build agent or context sub-agent is given the eval, the hidden
      file or the evals folder. The 'given' part is tested by one lint check that reads the inputs of build
      plays only (Names line 59). A skill, agent or sub-agent is covered only for what it reads (the ledger
      scenarios, lines 30-55). The Untestable section says 'None' for #898 apart from F24. Say that 'given to a
      skill, agent or sub-agent' is covered only through the read check, or add the case.
