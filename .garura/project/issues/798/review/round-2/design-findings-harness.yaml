findings:
  - id: DF-H-4
    severity: P4
    file: core/components/plays/shape-eval/reference/ice.md
    line: "16-17, 65-66"
    also:
      - {file: core/components/plays/shape-eval/SKILL.md, line: "184, 189-191"}
    principle: "H4: the ICE is the one place the play's wording is decided, and the compiled play traces to it. ADR 049 Decision 4 names three files for the eval play to read."
    source: "plan/788/base:docs/standards/harness-standard.md principle 4; plan/788/base:docs/adr/049-a-slice-is-shaped-then-planned-then-given-its-eval.md Decision 4 and the 'eval is read at two times' paragraph. (Carried from round 1, DF-H-4 part b.)"
    detail: "ICE C1 and F1 still say the run reads only the epic, its stories and the hidden file, and that reading any other file is a failure. The play also reads the plan file and the tracker (to find the epics), the slice's existing eval files (copied to inputs/existing/ so a later run can keep every scenario), and the templates and step library. SE-1 itself allows 'existing/'. The wording of the guarantee is stricter than what the play does, so F1 read literally is false on every second run. Nothing is harmed."
    suggested_fix: "Edit C1 and F1 in reference/ice.md to say what the run does: the plan file, the epic, its stories, the hidden file and the slice's own existing eval files; then recompile with /edit-play."
  - id: DF-H-5
    severity: P4
    file: core/components/plays/shape-eval/scripts/gather_eval.py
    line: 95
    also:
      - {file: core/components/skills/author-slice-eval/SKILL.md, line: 67}
    principle: "P4-ROUTE: the eval author's column for Recovery in the routing table is empty. Mechanical guards beat a prompt rule (harness principle 3)."
    source: "plan/788/base:docs/philosophy/idd-principles.md - The Routing Table ('Recovery (Expectation) ... -'); plan/788/base:docs/standards/harness-standard.md principle 3. Counter-weight: ADR 049 Decision 4 lets the eval play read the hidden file, so this is a tension and not a violation. (Carried from round 1, DF-H-5; unchanged.)"
    detail: "The whole hidden file, recovery lines included, is copied to the skill, which is told in prose never to write recovery text; check_eval.py then greps for the exact lines. A cleaner design gives the skill only the failure lines (inputs.json already holds them in 'failures')."
    suggested_fix: "Optional: write a failure-only copy of the hidden file for the skill. It needs an ICE change (C1) and a reading of ADR 049, so only if the product owner wants it."
  - id: DF-H-6
    severity: P4
    file: core/components/plays/shape-eval/SKILL.md
    line: "243-244"
    also:
      - {file: core/components/plays/shape-eval/SKILL.md, line: "232-236, 293-296"}
      - {file: core/components/plays/shape-eval/reference/ice.md, line: 18-20}
    principle: "A49-2-3 and H4: an eval of a slice shared by two plans is written once, in the home plan's folder; the step checks of the compiled play must say what the scripts do, and the play traces to its ICE."
    source: "plan/788/base:docs/adr/049-a-slice-is-shaped-then-planned-then-given-its-eval.md Decision 3 ('<plan-id> is the slice's home plan ... Another plan ... never copies them'); plan/788/base:docs/standards/harness-standard.md principle 4"
    detail: "Round 1's home-plan fix was made in gather_eval.py, place_eval.py, Step 2 and the ICE, but the step check SE-6 still says every placed path is '<plans>/<id>/evals/<slug>/...' where <id> is the plan being run (Names used below: '<id> = <intent-issue>'). For a slice whose home plan is another intent, the scripts rightly write under the other plan and SE-6, read as written, fails. The test file may not cover the shared-slice case."
    suggested_fix: "Say 'the slice's evals folder (its home plan's <plans>/<home>/evals/<slug>/)' in SE-6 (a non-intent wording edit of the compiled step check; if the ICE C2 wording is changed too, recompile)."
  - id: DF-H-7
    severity: P3
    file: core/components/skills/platform-adapter/reference/gitlab/verbs.md
    line: 27-33
    also:
      - {file: core/components/skills/platform-adapter/reference/github/verbs.md, line: 23-30}
    principle: "ADAPTER: verbs.md is the normative reference with the exact command and defined substitution tokens; callers and the python adapter must give the same result on both platforms."
    source: "plan/788/base:core/components/skills/platform-adapter/reference/gitlab/verbs.md header and 'Note on project encoding' (the file's own token is {encoded_owner%2Fname}); plan/788/base:core/components/skills/platform-adapter/SKILL.md Step 3 (an argument that is absent halts with 'Missing required argument')"
    detail: "The new GitLab section is `glab api projects/{project}/merge_requests/{pr_number}/diffs --paginate`. {project} is not a token the file or the skill defines; every other GitLab section uses {encoded_owner%2Fname} or {PROJECT_ID}. Run as the skill describes, the verb halts with a missing-argument error. The two sections also give a different shape: the GitHub one says 'one JSON object a line' (--jq '.[] | @json'), the GitLab one gives raw paged arrays, though both are meant to feed the same reader (fetch_pr_context.py). The python adapter does build the GitLab command, so only the skill route is broken; GitLab is not the platform in use here."
    suggested_fix: "Use `{encoded_owner%2Fname}` in the GitLab section (as the other sections do), and either pipe through `jq -c '.[]'` to give one object a line or say in the section that the output is a list of pages."
  - id: DF-H-8
    severity: P4
    file: core/components/agents/evals-engineer.md
    line: 1-7
    also:
      - {file: docs/philosophy/garura-reference-implementation.md, line: "225, 296, 319, 399"}
      - {file: docs/components/plays.md, line: 298}
    principle: "STALE: when a shared agent is rewritten, the documents that name its old job are kept in step or marked old."
    source: "plan/788/base:docs/adr/054-the-last-deprecated-parts-are-deleted-and-the-asking-rule-is-a-shared-skill-file.md; plan/788/base:core/components/agents/evals-engineer.md stale_note ('only stale plays dispatch it')"
    detail: "The agent now has one job (draft the eval for /shape-eval). docs/components/agents.md and the stale notes were brought in step (round 1's DF-H-3). The philosophy reference implementation still lists evals-engineer as the steelman author of /build-epic (lines 225, 296, 319, 372, 399) and plays.md line 298 still gives it 'draft verification scenarios'. Both describe the old /implement pipeline, so this is old text, not a wrong rule, and neither file is touched by the diff."
    suggested_fix: "Optional, in this change or the rebuild of the build stage (#855): add a line to those two places that the agent now writes the slice eval for /shape-eval and the steelman path is stale."
