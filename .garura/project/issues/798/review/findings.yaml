  finding: 'The rule that a later run changes nothing already there is written twice in rules/eval-format.md, and
    the two copies differ. Lines 22-23 say a later run ''only adds scenarios and untestable lines''; lines 36-38
    say it adds scenarios, Untestable lines and Lines covered lines. A reader who stops at the first block would
