- id: R7-1
  title: A start copy holding an empty list, a zero, a false, or an empty string for "intents" slips past the new
    shape check
  severity: P4
  basis: 'pr.md severity buckets: P4 Nit (defensive handling, no data effect). Rated P4 because nothing crashes
    and nothing is lost: the odd value reads as "no intents" or "empty spine", which is the same safe outcome as
    Q6-2 (text kept, not overwritten). The helper''s own docstring says "Anything else is refused, not read", so
    the code does less than it says.'
  where: 'core/components/plays/shape-slice/scripts/persist_slice.py line 542 (yaml.safe_load(fh) or {}) and lines
    290-298 (check_start_copy: x.get("intents") or [])'
  artifact_type: runtime-code
  problem: Reproduced on the scratch model in all three runs. The "or {}" turns a file holding [] , 0 or false (and
    an empty file or null) into an empty mapping before the check sees it, so these are accepted with exit 0 instead
    of being refused as "not a spine". Likewise "x.get(\"intents\") or []" lets a slice whose intents is 0 or an
    empty string through, while 5, a word and a map are refused. The condition that does the check is also a single
    three-way expression with a double "is not None" test, which is hard to read and is how the falsy gap went unseen.
  leads_to: A damaged start copy that happens to hold one of these values is read as "the slice was not listed when
    the run started", so the run keeps the old text without telling the person why. No crash and no write that the
    person did not ask for.
  fix: 'Load the file first, then test it: refuse when the loaded value is not None and not a dict, and when "slices"
    or a slice''''s "intents" is present and not a list (use "is None" tests, not "or"). Split the condition into
    three short checks with one message each. Add test cases for [] , 0 and "intents: 0".'
  category: code
