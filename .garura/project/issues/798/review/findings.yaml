findings:
- id: DF-H-11
  severity: P3
  category: harness
  title: A second run of /shape-slice on a slice that already exists can replace the slice's name, outcome and tester's
    action, and the ICE and the play text never say so
  where: null
  basis: 'H4 and the Play Pipeline Rules: what a play guarantees or decides is stated in its ICE, and the compiled
    play is built from it; a change to what it does is an intent change that goes ICE -> /edit-play, not a script
    change. plan/788/base:docs/standards/harness-standard.md principle 4 (lines 50-58); CLAUDE.md ''Play Pipeline
    Rules''. The base ICE says a reuse adds the intent, pulls features in and pushes features out (plan/788/base:core/components/plays/shape-slice/reference/ice.md
    C7), and the base persist_slice.py docstring says a reuse ''keeps that slice''s feature_refs, vertical and surface
    as they are''.'
  problem: 'Commits dbeb5eaa (#795) and c4c3c3d6 (#798, subject ''let a kept slice take its new name'') added reshape_text
    to persist_slice.py. When a shaping run finds a slice that already serves the intent and the shaped slice has
    the same surface and tester and no new intent, the kept record''s name, outcome and tester''s action are overwritten
    with the new ones, and the difference line says ''the record takes the new text''. The ICE does not say this:
    reference/ice.md C7 (lines 41-49) names only the intent added and features pulled in or pushed out, and the
    words ''name'', ''outcome'' and ''tester''s action'' appear in the ICE only in C20, the edit. SKILL.md Step
    8 (the persist_slice.py paragraph, lines 501-508) says a reuse ''lists differences'' and does not say it replaces
    anything. The commit changed SKILL.md and the ICE for the one-line part of the same change (C8, F8, F17) but
    not for this part. The brief does show the difference before the person types yes (SE-18), so nothing is hidden;
    the missing piece is the guarantee.'
  leads_to: 'The play now does something its ICE does not say: a rebuild of the play from its ICE keeps the script,
    but a reader or a later author of the ICE cannot tell that a re-run may rewrite a confirmed slice''s name and
    outcome, and no failure condition covers it (F7 covers a reuse that can no longer be tested, not a reuse that
    rewrote the record''s words). It also sits beside the new edit rule, which says the name, outcome and tester''s
    action change through an edit that leaves a history line; a re-run changes the same three texts and leaves none.
    The epic and stories written from the old outcome are not named as out of date, as the edit brief does. This
    is the same pattern as round 3''s DF-H-9, on a smaller change.'
  fix: 'Decide with the product owner whether a re-run should replace these three texts. If yes, say it in the ICE
    (C7: a reuse of the same surface and tester takes the shaped name, outcome and tester''s action, shown old and
    new in the brief; and F7 or F17 to match), compile again with /edit-play, and have the brief name the epic and
    stories as out of date, as the edit does. If no, take reshape_text out of persist_slice.py (and its tests) and
    leave the change of these texts to --edit.'
  carried: null
- id: DF-H-4
  severity: P4
  category: harness
  title: The /shape-eval ICE says the run reads only three kinds of file, and the play reads more
  where: null
  basis: 'H4: the ICE is the one place the play''s wording is decided, and the compiled play traces to it. ADR 049
    Decision 4 names three files for the eval play to read. plan/788/base:docs/standards/harness-standard.md principle
    4; plan/788/base:docs/adr/049-a-slice-is-shaped-then-planned-then-given-its-eval.md Decision 4. (Carried from
    rounds 1 to 3, unchanged by round 4: no commit touched shape-eval since 086b74b8.)'
  problem: C1 and F1 still say the run reads only the epic, its stories and the hidden file, and that reading any
    other file is a failure. The play also reads the plan file and the tracker (to find the epics), the slice's
    existing eval files (copied to inputs/existing/ so a later run keeps every scenario), and the templates and
    step library. Read literally, F1 is false on every second run.
  leads_to: Nothing is harmed. A reader who trusts F1 does not know the real list of files, and a check written
    from F1 would fail a valid run.
  fix: State the real list in C1 and F1 (the epic, its stories, the hidden file, and the slice's earlier eval files),
    and compile again with /edit-play.
  carried: null
- id: DF-H-5
  severity: P4
  category: harness
  title: The whole hidden file, recovery lines included, is copied to the eval-writing skill, which is told in prose
    never to use the recovery text
  where: null
  basis: 'P4-ROUTE: the eval author''s column for Recovery in the routing table is empty. Mechanical guards beat
    a prompt rule (harness principle 3). plan/788/base:docs/philosophy/idd-principles.md - The Routing Table; plan/788/base:docs/standards/harness-standard.md
    principle 3. Counter-weight: ADR 049 Decision 4 lets the eval play read the hidden file, so this is a tension,
    not a violation. (Carried, unchanged.)'
  problem: gather_eval.py copies the whole hidden file to the skill; check_eval.py then greps for the exact lines.
    A cleaner design gives the skill only the failure lines (inputs.json already holds them in 'failures').
  leads_to: A skill that ignores the prose rule could copy recovery text into an eval. The check catches the exact
    lines only.
  fix: Copy only the failure lines to the skill's inputs, and keep the full file for the checker.
  carried: null
- id: DF-H-6
  severity: P4
  category: harness
  title: Step check SE-6 of /shape-eval names the wrong folder for a slice whose home plan is another intent
  where: null
  basis: 'A49-2-3 and H4: an eval of a slice shared by two plans is written once, in the home plan''s folder; the
    step checks of the compiled play must say what the scripts do. plan/788/base:docs/adr/049-a-slice-is-shaped-then-planned-then-given-its-eval.md
    Decision 3; plan/788/base:docs/standards/harness-standard.md principle 4. (Carried, unchanged.)'
  problem: The scripts write under the slice's home plan, but SE-6 says every placed path is '<plans>/<id>/evals/<slug>/...'
    where <id> is the plan being run. For a slice whose home plan is another intent, SE-6 read as written fails
    although the scripts are right.
  leads_to: A run for the second plan that shares a slice fails its own step check for a correct write.
  fix: Say '<home plan id>' in SE-6 and in the ICE line it traces to.
  carried: null
- id: DF-H-8
  severity: P4
  category: harness
  title: Two documents still describe the evals-engineer agent by its old job
  where: null
  basis: 'STALE: when a shared agent is rewritten, the documents that name its old job are kept in step or marked
    old. plan/788/base:docs/adr/054-the-last-deprecated-parts-are-deleted-and-the-asking-rule-is-a-shared-skill-file.md;
    plan/788/base:core/components/agents/evals-engineer.md stale_note. (Carried, unchanged: docs/components/agents.md
    is in step; docs/philosophy/garura-reference-implementation.md and docs/components/plays.md line 298 are not
    touched by the diff.)'
  problem: The agent now has one job (draft the eval for /shape-eval). The reference implementation still lists
    evals-engineer as the steelman author of /build-epic, and plays.md line 298 still gives it 'draft verification
    scenarios'. Both describe the old /implement pipeline.
  leads_to: A reader of those pages expects a job the agent no longer has. Old text, not a wrong rule.
  fix: Mark both passages as the old pipeline, or update them.
  carried: null
- id: MEM-5
  severity: P4
  category: memory
  title: ADR 057 does not list every memory file it changes, and states three rules only the rules file holds
  where: null
  basis: null
  problem: 'The Affects line of ADR 057 names the two templates, the step library and two index files. It leaves
    out rules/eval-format.md, which now holds every eval format rule, and rules/_index.md, schemas/eval/_index.md,
    rules/expectation-generation.md and rules/pipeline-next.md, which this change also edits. That rules file also
    carries three mechanisms the ADR never states: the ''Lines covered'' list, the ''@out-of-slice'' tag, and naming
    a moved story line for a person.'
  leads_to: A later reader cannot tell who decided those three mechanisms, and a change to one of the five unlisted
    files will not be traced back to this decision.
  fix: Add the five files to the Affects line, and add one sentence to section 2 or 5 stating the three mechanisms.
  carried: null
- id: MEM-6
  severity: P4
  category: memory
  title: The 'a later run changes nothing already there' rule is written twice and the two copies differ
  where: null
  basis: null
  problem: Lines 22-23 say a later run 'only adds scenarios and untestable lines'. Lines 36-38 (under 'A fixed yardstick')
    say it adds scenarios, Untestable lines and Lines covered lines.
  leads_to: A reader who stops at the first block would think adding a Lines covered line breaks the rule, and a
    checker written from that block would reject a valid run.
  fix: Keep the rule in 'A fixed yardstick' only. In 'A story file', say just that a story whose feature left the
    slice keeps its file with '@out-of-slice' on its first tag line.
  carried: null
- id: MEM-7
  severity: P4
  category: memory
  title: The parent schemas index does not point to the new eval step-library index
  where: null
  basis: null
  problem: schemas/eval/ has its own _index.md, but the parent index has only a pattern row for it and no 'See eval/_index.md'
    line. The base parent index does carry that kind of line for product-os/.
  leads_to: An agent that reads schemas/_index.md will not learn that a list of step libraries exists, and a second
    library added later will not be found from the parent.
  fix: Add 'See `eval/_index.md` for the set of step libraries.' after the eval row.
  carried: null
- id: PM-F2
  severity: P4
  category: product-model
  title: The slice's outcome runs to a paragraph
