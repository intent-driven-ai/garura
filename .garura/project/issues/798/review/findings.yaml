- id: DF-H-7
  severity: P3
  category: harness
  file: core/components/skills/platform-adapter/reference/gitlab/verbs.md
  line: 27-33
  basis: 'ADAPTER: verbs.md is the normative reference with the exact command and defined substitution tokens; the
    python adapter and the skill must give the same result on both platforms. plan/788/base:core/components/skills/platform-adapter/reference/gitlab/verbs.md
    header and ''Note on project encoding''; plan/788/base:core/components/skills/platform-adapter/SKILL.md Step
    3 (''Missing required argument'')'
  finding: The new GitLab pr-files section is `glab api projects/{project}/merge_requests/{pr_number}/diffs --paginate`.
    {project} is not a token the file or the skill defines (the other sections use {encoded_owner%2Fname}), so the
    verb halts with a missing-argument error when run from the skill. The GitHub section gives one JSON object a
    line and the GitLab section gives raw pages. The python adapter builds the right command, so only the skill
    route is broken, and GitLab is not the platform in use here. Round 2 recorded this as not fixed and filed as
    its own issue.
- id: DF-H-9
  severity: P3
  category: harness
  file: core/components/plays/shape-slice/SKILL.md
  line: 489-499
  basis: 'H4 and ICE-C15: a change to what the play guarantees is made in the ICE and the play is compiled again.
    The ICE guarantees that the hidden file keeps every entry as it is, except that a new feature''s entry is added.
    plan/788/base:docs/standards/harness-standard.md principle 4; plan/788/base:core/components/plays/shape-slice/reference/ice.md
    C15 line 95 (''keeps every other entry as it is''); CLAUDE.md ''Play Pipeline Rules'' (a change to a guarantee,
    decision or flow is an intent change and goes ICE -> /edit-play, never a hand edit of SKILL.md).'
  finding: 'Commit d756e304 gives Step 8b a new path: when the person''s change names a feature, pass --redraft
    <feature id>, and that entry is drafted again by author-failure-recovery even when its Fails if lines did not
    change. The commit edited only SKILL.md and the script and test; reference/ice.md was not touched. The ICE still
    says (C15) that the run keeps every other entry as it is, and has no constraint, failure condition, recovery
    or scenario for the person asking for a redraft. Step 8b''s own next paragraph still says the script ''keeps
    each kept entry byte for byte''. The play now does something its ICE does not say, so the play and its ICE disagree,
    and the fingerprint check cannot show it because the ICE hash did not change. This is the drift principle 4
    exists to prevent. What it leads to: a person-requested redraft replaces recoveries and ''who fixes'' answers
    that may have been set by a person earlier in this same change (commit 8fceddab routed six entries to ''a person
    must decide''), and no failure condition would catch a redraft that overwrites them. A later rebuild of the
    play from its ICE will also remove the --redraft step without any warning. The Compilation Metadata compiled_by
    line (910) was not updated for the #798 edits to shape-slice either (it still reads as the base version).'
- id: DF-H-10
  severity: P4
  category: harness
  file: core/components/plays/shape-slice/SKILL.md
  line: 493-499, 532-536
  basis: 'H3: a judgment is made by a model and a fixed sequence by a script; a step check proves each guarantee
    (the SE checks). plan/788/base:docs/standards/harness-standard.md principle 3 (script vs model) and principle
    4 (the ICE carries Expectation: scenarios, recovery, what done means)'
  finding: Two small gaps in the new step. (a) Which feature 'the person's change names' is decided by the orchestrating
    play in free text and written as $(each feature ..., as --redraft <id>) in a command block; no skill picks the
    features and nothing records the choice, so the brief and the record cannot show what was redrafted (the base
    brief lists hidden-file counts only). (b) SE-19 checks only that the file reads ok and every line has one recovery,
    so it cannot tell a redraft that was asked for from one that was not; the script test covers the 'lines' command
    with --redraft and the unknown-feature refusal but not 'write' after a redraft. A redraft that goes wrong would
    pass every check.
