- id: PM-F11
  severity: P4
  category: product-model
  title: A rule tells the story of an earlier draft
  where: null
  basis: null
  problem: Carried from round 3, unchanged. A rule says 'When the list named only some plays, a play that builds
    code and is not on the list could be given the eval'. It tells the story of an earlier draft that a later reader
