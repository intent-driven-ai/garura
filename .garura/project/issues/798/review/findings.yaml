findings:
- id: DF-H-12
  severity: P4
  category: harness
  title: The Step 8 text of /shape-slice does not say that a re-run now rewrites a kept slice's words and leaves
    a history line
  where: core/components/plays/shape-slice/SKILL.md, Step 8 text after the command block (the sentence that starts
    "With --reuse it appends the intent", about lines 506-509)
  basis: 'H4 / harness-standard principle 4: the compiled play is built from the ICE, so what the ICE guarantees
    should be readable in the steps the run follows. The ICE (C7) now guarantees the rewrite, the history line and
    the out-of-date epic. pr.md P4 (style-only nit); the guarantee itself is present in the ICE, F7, SE-29 and the
    brief.'
  problem: The commit added --at to the Step 8 command and wrote the rule in SE-29, but the sentence that tells
    the runner what persist_slice.py does on a reuse still lists only `differences`, `upgraded_to_v2` and `dropped_fields`.
    It does not say that the script takes the new name, outcome and tester's action, adds a history line, or returns
    `replaced` and `out_of_date`.
  leads_to: A runner who reads Step 8 only learns of the rewrite when it reaches the SE-29 check or the brief. Nothing
    breaks, because the script does the work, but the step and the intent do not read the same.
  fix: 'Add one sentence to that Step 8 paragraph: on a reuse with no new intent, the same surface and the same
    tester, the script takes the shaped name, outcome and tester''s action, writes a history line, and returns `replaced`
    and `out_of_date` for the brief. This is a non-intent edit of SKILL.md (the rule is already in the ICE).'
  carried: false
- id: DF-H-13
  severity: P4
  category: harness
  title: F7 and REC7 say the brief must name the slice's epic as out of date, but a slice shaped again before /shape-plan
    has no epic
  where: core/components/plays/shape-slice/reference/ice.md C7, F7, REC7; the matching F7 text and F7 recovery row
    in SKILL.md
  basis: 'H4: a failure condition must be one the play can meet. In the pipeline /shape-slice comes before /shape-plan
    (ADR 049, in the base ICE position note), so a slice shaped again often has no epic yet. SE-29 already says
    ''each spine epic whose slice_ref is the slice'', which is empty in that case. pr.md P4.'
  problem: F7 reads 'without the brief naming the slice's epic as out of date'. Read as written it fails when the
    slice has no epic, because there is nothing to name. REC7 'name the slice's epic as out of date in the brief'
    cannot be done either.
  leads_to: A reader or a later check written from F7 could flag a correct run. The script is right (it returns
    an empty out_of_date list and the brief then names none).
  fix: Say 'each epic of the slice, when it has any' in C7, F7 and REC7, and compile again with /edit-play.
  carried: false
- id: DF-H-14
  severity: P4
  category: harness
  title: The history line a shaping run leaves names every intent the slice serves, not the intent of this run
  where: core/components/plays/shape-slice/scripts/persist_slice.py, history() called with list(body.get("intents"))
    (history() at lines 273-278, called at line 382 with the record's whole intents list)
  basis: The base edit path writes in `words` what was asked in that run (edit_slice.py history_entry); C7 says
    the line records 'when, that a shaping run changed it, and which parts'. A history line is only useful if it
    says what happened. pr.md P4.
  problem: '`body` is the kept slice''s spine entry, so its intents are all of the slice''s intents. For a slice
    that serves bi-10 and bi-788, a run for bi-788 writes ''shaped again by /shape-slice for bi-10, bi-788''.'
  leads_to: A reader of the record cannot tell which intent's run made the change. The date, the actor and the parts
    changed are right, so nothing is lost beyond that detail.
  fix: Pass the intent of the run (the --slice file's intents) instead of the kept slice's list, or drop the 'for
    ...' part of the words.
  carried: false
- id: MEM-5
  severity: P4
  category: memory
  title: ADR 057 does not list every memory file it changes, and states three rules only the rules file holds
  where: null
  basis: null
  problem: 'The Affects line of ADR 057 names the two templates, the step library and two index files. It leaves
    out rules/eval-format.md, which now holds every eval format rule, and rules/_index.md, schemas/eval/_index.md,
    rules/expectation-generation.md and rules/pipeline-next.md, which this change also edits. That rules file also
    carries three mechanisms the ADR never states: the ''Lines covered'' list, the ''@out-of-slice'' tag, and naming
    a moved story line for a person.'
  leads_to: A later reader cannot tell who decided those three mechanisms, and a change to one of the five unlisted
    files will not be traced back to this decision.
  fix: Add the five files to the Affects line, and add one sentence to section 2 or 5 stating the three mechanisms.
  carried: true
