findings:
- id: DF-H-17
  severity: P3
  category: harness
  title: The start copies are now kept for good, so a new run on the same change issue after a stop can start from
    an old copy
  where: core/components/plays/shape-slice/SKILL.md, Pre-flight command block, lines 141-142 (test -f ... || git
    rev-parse HEAD ...; test -f ... || cp ...) and the sentence at lines 145-146 ("written once, by the run's first
    pre-flight")
  basis: 'The base play took start-sha.txt on every run (git show plan/788/base:.../SKILL.md, Pre-flight), so a
    new run always started from its own HEAD; its stop check reads ''HEAD equals start-sha.txt'' (SE-15, SCE-6)
    and the edit checks use ''git diff <start-sha>''. The play''s own text says a run that closed HALTED at a stop
    ''has nothing to resume'' (Pause and Resume) and the stop paths (Step 11 stop, Step X3 stop) clear only the
    hidden-file copy, not these two files. pr.md P3: a rule is stated (''written once, by the run''s first pre-flight'')
    but the step cannot tell a first pre-flight from a later fresh run; not P2 because the stop check would fail
    on the wrong HEAD instead of silently passing, and nothing is lost for good.'
  problem: test -f only asks 'is the file there', not 'is this a resume'. If a person stops a run (it closes HALTED,
    writes undone) and later runs /shape-slice again and start-change finds the same change issue, the new run is
    a fresh run, but pre-flight finds the old start-sha.txt and spine-at-start.yaml and keeps them. The old HEAD
    then is the base of the stop check (HEAD equals start-sha.txt), of 'no commit after start-sha.txt', and of 'git
    diff <start-sha>'. The old spine copy then tells Step 8 which intents the slice served at an earlier time, not
    at this run's start. Whether start-change reuses the same change issue after a stop is not shown in the files
    read here (start-change's Resume check says it reuses a known issue or branch); the play does not say either
    way.
  leads_to: A fresh run after a stop can fail its own stop check on a HEAD it never started from, or treat an intent
    as already served (or not) from an old copy, so the brief can show a change that is not a change, or miss one.
    The yes still gates every write, and a change or stop restores the record, so the harm is a wrong brief or a
    failed check, not lost work.
  fix: 'Keep the guard but make it say ''resume'', which the play already knows: write each copy when it is not
    there, or when the status marker {stm_base}<issue>/status/shape-slice.json does not exist (a fresh run; the
    marker is the play''s own Resume check). Say the same in the sentence under the block. Alternatively, have the
    stop and close paths remove both files. This is a non-intent edit of SKILL.md.'
- id: MEM-5
  severity: P4
  category: memory
  title: ADR 057 does not list every memory file it changes, and states three rules only the rules file holds
  where: null
  basis: null
  problem: 'The Affects line of ADR 057 names the two templates, the step library and two index files. It leaves
    out rules/eval-format.md, which now holds every eval format rule, and rules/_index.md, schemas/eval/_index.md,
    rules/expectation-generation.md and rules/pipeline-next.md, which this change also edits. That rules file also
    carries three mechanisms the ADR never states: the ''Lines covered'' list, the ''@out-of-slice'' tag, and naming
    a moved story line for a person.'
  leads_to: A later reader cannot tell who decided those three mechanisms, and a change to one of the five unlisted
    files will not be traced back to this decision.
  fix: Add the five files to the Affects line, and add one sentence to section 2 or 5 stating the three mechanisms.
- id: MEM-6
  severity: P4
  category: memory
  title: The 'a later run changes nothing already there' rule is written twice and the two copies differ
  where: null
  basis: null
  problem: Lines 22-23 say a later run 'only adds scenarios and untestable lines'. Lines 36-38 (under 'A fixed yardstick')
    say it adds scenarios, Untestable lines and Lines covered lines.
  leads_to: A reader who stops at the first block would think adding a Lines covered line breaks the rule, and a
    checker written from that block would reject a valid run.
  fix: Keep the rule in 'A fixed yardstick' only. In 'A story file', say just that a story whose feature left the
    slice keeps its file with '@out-of-slice' on its first tag line.
- id: MEM-7
  severity: P4
  category: memory
  title: The parent schemas index does not point to the new eval step-library index
  where: null
  basis: null
  problem: schemas/eval/ has its own _index.md, but the parent index has only a pattern row for it and no 'See eval/_index.md'
    line. The base parent index does carry that kind of line for product-os/.
  leads_to: An agent that reads schemas/_index.md will not learn that a list of step libraries exists, and a second
    library added later will not be found from the parent.
  fix: Add 'See `eval/_index.md` for the set of step libraries.' after the eval row.
