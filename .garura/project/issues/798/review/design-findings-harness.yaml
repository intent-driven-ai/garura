findings:
  - id: DF-H-9
    severity: P3
    file: core/components/plays/shape-slice/SKILL.md
    line: "489-499"
    also:
      - {file: core/components/plays/shape-slice/scripts/write_hidden_file.py, line: "29-30, 242-253, 462-463"}
      - {file: core/components/plays/shape-slice/reference/ice.md, line: "85-96, 166-168, 311-312"}
      - {file: core/components/plays/shape-slice/SKILL.md, line: 910}
    principle: "H4 and ICE-C15: a change to what the play guarantees is made in the ICE and the play is compiled again. The ICE guarantees that the hidden file keeps every entry as it is, except that a new feature's entry is added."
    source: "plan/788/base:docs/standards/harness-standard.md principle 4; plan/788/base:core/components/plays/shape-slice/reference/ice.md C15 line 95 ('keeps every other entry as it is'); CLAUDE.md 'Play Pipeline Rules' (a change to a guarantee, decision or flow is an intent change and goes ICE -> /edit-play, never a hand edit of SKILL.md)."
    detail: >
      Commit d756e304 gives Step 8b a new path: when the person's change names a feature, pass
      --redraft <feature id>, and that entry is drafted again by author-failure-recovery even when
      its Fails if lines did not change. The commit edited only SKILL.md and the script and test;
      reference/ice.md was not touched. The ICE still says (C15) that the run keeps every other
      entry as it is, and has no constraint, failure condition, recovery or scenario for the person
      asking for a redraft. Step 8b's own next paragraph still says the script 'keeps each kept
      entry byte for byte'. The play now does something its ICE does not say, so the play and its
      ICE disagree, and the fingerprint check cannot show it because the ICE hash did not change.
      This is the drift principle 4 exists to prevent. What it leads to: a person-requested redraft
      replaces recoveries and 'who fixes' answers that may have been set by a person earlier in this
      same change (commit 8fceddab routed six entries to 'a person must decide'), and no failure
      condition would catch a redraft that overwrites them. A later rebuild of the play from its ICE
      will also remove the --redraft step without any warning. The Compilation Metadata
      compiled_by line (910) was not updated for the #798 edits to shape-slice either (it still reads
      as the base version).
    suggested_fix: >
      Decide whether the person may ask for a redraft. If yes, put it in the ICE (a C15 sentence:
      'when the person's change names a feature, that feature's entry is drafted again and keeps its
      line ids'; a matching F15 clause, a REC and a scenario), run /edit-play, and update
      compiled_by. If no, remove --redraft from the SKILL.md and script.
  - id: DF-H-10
    severity: P4
    file: core/components/plays/shape-slice/SKILL.md
    line: "493-499, 532-536"
    also:
      - {file: core/components/plays/shape-slice/scripts/test_write_hidden_file.py, line: "190-201"}
    principle: "H3: a judgment is made by a model and a fixed sequence by a script; a step check proves each guarantee (the SE checks)."
    source: "plan/788/base:docs/standards/harness-standard.md principle 3 (script vs model) and principle 4 (the ICE carries Expectation: scenarios, recovery, what done means)"
    detail: >
      Two small gaps in the new step. (a) Which feature 'the person's change names' is decided by
      the orchestrating play in free text and written as $(each feature ..., as --redraft <id>) in a
      command block; no skill picks the features and nothing records the choice, so the brief and
      the record cannot show what was redrafted (the base brief lists hidden-file counts only). (b)
      SE-19 checks only that the file reads ok and every line has one recovery, so it cannot tell a
      redraft that was asked for from one that was not; the script test covers the 'lines' command
      with --redraft and the unknown-feature refusal but not 'write' after a redraft. A redraft that
      goes wrong would pass every check.
    suggested_fix: "When DF-H-9 is settled in the ICE, add the matching SE check and a test for write after --redraft; show the redrafted features in the brief."
  - id: DF-H-4
    severity: P4
    file: core/components/plays/shape-eval/reference/ice.md
    line: "16-17, 65-66"
    also:
      - {file: core/components/plays/shape-eval/SKILL.md, line: "184, 189-191"}
    principle: "H4: the ICE is the one place the play's wording is decided, and the compiled play traces to it. ADR 049 Decision 4 names three files for the eval play to read."
    source: "plan/788/base:docs/standards/harness-standard.md principle 4; plan/788/base:docs/adr/049-a-slice-is-shaped-then-planned-then-given-its-eval.md Decision 4. (Carried from round 1 and 2, unchanged.)"
    detail: "ICE C1 and F1 still say the run reads only the epic, its stories and the hidden file, and that reading any other file is a failure. The play also reads the plan file and the tracker (to find the epics), the slice's existing eval files (copied to inputs/existing/ so a later run can keep every scenario), and the templates and step library. F1 read literally is false on every second run. Nothing is harmed."
    suggested_fix: "Edit C1 and F1 in reference/ice.md to say what the run does: the plan file, the epic, its stories, the hidden file and the slice's own existing eval files; then recompile with /edit-play."
  - id: DF-H-5
    severity: P4
    file: core/components/plays/shape-eval/scripts/gather_eval.py
    line: 95
    also:
      - {file: core/components/skills/author-slice-eval/SKILL.md, line: 67}
    principle: "P4-ROUTE: the eval author's column for Recovery in the routing table is empty. Mechanical guards beat a prompt rule (harness principle 3)."
    source: "plan/788/base:docs/philosophy/idd-principles.md - The Routing Table; plan/788/base:docs/standards/harness-standard.md principle 3. Counter-weight: ADR 049 Decision 4 lets the eval play read the hidden file, so this is a tension, not a violation. (Carried, unchanged.)"
    detail: "The whole hidden file, recovery lines included, is copied to the skill, which is told in prose never to write recovery text; check_eval.py then greps for the exact lines. A cleaner design gives the skill only the failure lines (inputs.json already holds them in 'failures')."
    suggested_fix: "Optional: write a failure-only copy of the hidden file for the skill. It needs an ICE change (C1) and a reading of ADR 049, so only if the product owner wants it."
  - id: DF-H-6
    severity: P4
    file: core/components/plays/shape-eval/SKILL.md
    line: "243-244"
    also:
      - {file: core/components/plays/shape-eval/SKILL.md, line: "232-236, 293-296"}
      - {file: core/components/plays/shape-eval/reference/ice.md, line: 18-20}
    principle: "A49-2-3 and H4: an eval of a slice shared by two plans is written once, in the home plan's folder; the step checks of the compiled play must say what the scripts do."
    source: "plan/788/base:docs/adr/049-a-slice-is-shaped-then-planned-then-given-its-eval.md Decision 3; plan/788/base:docs/standards/harness-standard.md principle 4. (Carried, unchanged.)"
    detail: "The scripts write under the slice's home plan, but step check SE-6 still says every placed path is '<plans>/<id>/evals/<slug>/...' where <id> is the plan being run. For a slice whose home plan is another intent, SE-6 read as written fails although the scripts are right."
    suggested_fix: "Say 'the slice's evals folder (its home plan's <plans>/<home>/evals/<slug>/)' in SE-6 (a wording edit of the compiled step check; recompile if C2 is changed too)."
  - id: DF-H-7
    severity: P3
    file: core/components/skills/platform-adapter/reference/gitlab/verbs.md
    line: 27-33
    also:
      - {file: core/components/skills/platform-adapter/reference/github/verbs.md, line: 23-30}
    principle: "ADAPTER: verbs.md is the normative reference with the exact command and defined substitution tokens; the python adapter and the skill must give the same result on both platforms."
    source: "plan/788/base:core/components/skills/platform-adapter/reference/gitlab/verbs.md header and 'Note on project encoding'; plan/788/base:core/components/skills/platform-adapter/SKILL.md Step 3 ('Missing required argument')"
    detail: "The new GitLab pr-files section is `glab api projects/{project}/merge_requests/{pr_number}/diffs --paginate`. {project} is not a token the file or the skill defines (the other sections use {encoded_owner%2Fname}), so the verb halts with a missing-argument error when run from the skill. The GitHub section gives one JSON object a line and the GitLab section gives raw pages. The python adapter builds the right command, so only the skill route is broken, and GitLab is not the platform in use here. Round 2 recorded this as not fixed and filed as its own issue."
    suggested_fix: "Use {encoded_owner%2Fname} in the GitLab section and state the output shape (jq -c '.[]' or 'a list of pages')."
