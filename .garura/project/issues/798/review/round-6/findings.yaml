- id: Q6-1
  title: A wrongly shaped start copy of the spine stops persist_slice.py with a Python crash instead of a plain
    refusal
  severity: P3
  basis: 'pr.md severity buckets: P2/P3 cover error-handling gaps that do not lose data; rated P3 because nothing
    is written when it happens. The script''s own header promises "Exit 0 written, 2 refused or usage error" and
    the play reads the result JSON; main() already turns a spine that is not a mapping into a plain refusal (line
    515), so the new input is held to a lower standard than the old one.'
  where: 'core/components/plays/shape-slice/scripts/persist_slice.py lines 279-288 (new_since_start: start_spine.get,
    list(s.get("intents"))), 528-533 (the load), 537 (the except list: OSError, YAMLError, JSONDecodeError only)'
  artifact_type: runtime-code
  problem: 'The start copy is loaded with yaml.safe_load and used as if it were a mapping with a list of slices.
    Reproduced on the scratch model, each with --reuse, a valid --at and a text change: a file holding a list, a
    plain word or a number -> AttributeError (line 283); "slices: 5" -> TypeError (283); a slice with "intents:
    5" -> TypeError (285); a file that is not UTF-8 text -> UnicodeDecodeError (not an OSError, so line 537 misses
    it). Each ends in a traceback, exit code 1, no JSON on stdout, and no --out file written. A start copy that
    is an empty file, or has "slices" as a word or a map, passes without complaint (see Q6-2).'
  leads_to: The play (Step 8) gets exit 1 and no result file where it expects exit 0 or 2 and a result it can read,
    so a damaged or truncated start copy shows up as a raw crash the person cannot act on. No data is lost (all
    of these stop before the first write).
  fix: 'Check the start copy the way the spine is checked: after loading, refuse with a plain message if it is not
    a mapping or if "slices" is not a list of mappings whose "intents" are lists; and add UnicodeDecodeError (or
    ValueError) to the except list on line 537.'
  category: code
- id: Q6-2
  title: A start copy that does not list the slice is accepted, and the run then keeps the old text without saying
    why
  severity: P4
  basis: 'pr.md severity buckets: P4 Nit; defensive handling at an input that decides whether text is replaced.
    Rated P4 because the wrong outcome is the safe one (text kept, not overwritten).'
  where: core/components/plays/shape-slice/scripts/persist_slice.py lines 283-288 (a start copy without the slice
    returns every intent as new)
  artifact_type: runtime-code
  problem: 'Reproduced: an empty start file, or one with no entry for the slice, makes every intent of the shaped
    slice count as new, so "own" is false, the kept slice keeps its text, and the run exits 0 with action "unchanged"
    and replaced []. For a reuse the slice always exists in the spine at the start, so a start copy without it is
    a wrong file (for example the copy of another model), not a normal case.'
  leads_to: A person who asked for the reshape sees no new text and no reason; the play has no sign that the start
    copy was the wrong file.
  fix: 'In a reuse run, refuse a start copy that does not hold the reused slice ("the start copy has no slice <id>:
    it is not the spine this run started from").'
  category: code
- id: Q6-3
  title: Tests do not cover an unreadable or wrongly shaped start copy
  severity: P4
  basis: 'pr.md severity buckets: P3/P4 test-coverage gaps; TEST-01 expects tests beside new logic. Rated P4 because
    the new logic has tests for the main path and the missing-start and bad-date refusals (113 cases pass).'
  where: core/components/plays/shape-slice/scripts/test_persist_slice.py lines 165-196 (test_rerun_same_result)
    and 298-352 (the reshape cases)
  artifact_type: tests
  problem: The suite covers a run twice with the start copy, a run without one, and bad --at values. No case gives
    --spine-at-start a path that does not exist, a file with the wrong shape, or a file that is not text, which
    is where Q6-1 sits.
  leads_to: Q6-1 passes the suite unseen, and a later change to the start-copy read can break the refusals unnoticed.
  fix: 'Add refusal cases (exit 2, nothing written) for a missing path, a list file, and a "slices: 5" file once
    Q6-1 is fixed.'
  category: code
- id: Q6-4
  title: The same date check is written twice
  severity: P4
  basis: 'pr.md severity buckets: P4 Nit (style / duplication). Rated P4 because the two copies are identical today
    (same regex, same message) and both are tested.'
  where: core/components/plays/shape-slice/scripts/persist_slice.py lines 290-297 and core/components/plays/shape-slice/scripts/edit_slice.py
    lines 303-310
  artifact_type: runtime-code
  problem: 'check_date appears in both files with the same body and message. Both are covered by tests (persist:
    banana, a space, 2026-13-01, 27-10-2026; edit: banana, 2026-02-30).'
  leads_to: A later change to the date form (for example to allow a time) can reach one script and not the other,
    and the two would then disagree on what the history line may hold.
  fix: Put it in one shared script of the play (the play already shares model_names.py and spine_text.py) and import
    it from both.
  category: code
