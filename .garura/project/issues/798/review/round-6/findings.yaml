findings:
- id: DF-H-15
  severity: P3
  category: harness
  title: The copy of the starting spine is run again on every resume, so a resume can overwrite it and bring back
    the bug it was added to fix
  where: core/components/plays/shape-slice/SKILL.md, Pre-flight, the command block line "cp <model>/_spine.yaml
    {stm_base}<issue>/context/shape-slice/spine-at-start.yaml" (line 141) and the sentence under it, "a resume keeps
    it as it is" (line 144)
  basis: 'Harness-standard principle 4 and the base play''s own pattern: pre-flight runs before the Resume check,
    which says only that completed steps are skipped (base SKILL.md Pre-flight and ''Resume check''). A pre-flight
    command that is not guarded is run again on a resume. The sentence says the right thing but nothing in the steps
    makes it true. pr.md P3: the rule is stated but not made to hold in the steps (documentation/behaviour gap);
    the write stays behind the person''s yes and is restored on a change or a stop, so not P2.'
  problem: The cp has no guard. After a stop in or after Step 8 (for example at Step 9), a resume runs the Pre-flight
    block again, and the cp copies the spine as it is now, with the intent already on the kept slice, over spine-at-start.yaml.
    Step 8 then runs again, reads the intent as already served at the start, and takes the new name, outcome and
    tester's action over the text the first run kept. This is Q5-1 again, reached through a resume instead of a
    plain second run. The same unguarded pattern gives start-sha.txt the same fault (not new in this commit). Also,
    <model> is used in the block before the 'Names used below' line defines it.
  leads_to: A resumed run can rewrite a kept slice's words and add a second history line that the first run did
    not need, and the brief then shows a change that is not a change from the person's point of view. The person's
    yes still gates it, and a change or stop restores the record, so nothing is lost for good; the sameness-on-repeat
    that C7 now promises does not hold for a resumed run.
  fix: 'Make the copy conditional in the Pre-flight text: copy only when spine-at-start.yaml does not exist (for
    example `test -f ... || cp ...`), and say it in the step, not only in the sentence under it. Use `<product_base>product-os/_spine.yaml`
    in the command, or move the ''Names used below'' line above the block. Do the same for start-sha.txt when this
    is edited. This is a non-intent edit of SKILL.md.'
- id: DF-H-16
  severity: P4
  category: harness
  title: The two guarantees C7 gained (a repeated step gives the same result; the history date is a real date) have
    no failure condition or scenario in the ICE
  where: core/components/plays/shape-slice/reference/ice.md C7 (lines 46-52), F7 (lines 172-177), S12 (lines 296-301);
    SKILL.md SE-29
  basis: 'Harness-standard principle 4: the Expectation (failure conditions and scenarios) is what the evals are
    compiled from. The base ICE carried each C7 guarantee in F7 and S12. pr.md P4 (style-only nit); the guarantees
    are in C7 and the scripts refuse the bad cases, so the play is not unsafe.'
  problem: F7 still lists only a new slice for a served intent, a slice in progress changed, a slice no longer testable,
    and a name/outcome/action changed without the brief, history line or out-of-date epic. It does not list 'a step
    run twice took text the first run kept' or 'a history line with a date that is not a date'. S12 covers one run
    only. SE-29 now checks both, but it has no F or S above it.
  leads_to: An eval check (SE-29) with no failure condition behind it can be dropped by a later rebuild of the play
    from the ICE without anyone seeing a guarantee go. Nothing breaks now.
  fix: Add the two cases to F7 (and to REC7 and a short S12 measure) in the ICE and compile again with /edit-play.
- id: MEM-5
  severity: P4
  category: memory
  title: ADR 057 does not list every memory file it changes, and states three rules only the rules file holds
  where: null
  basis: null
  problem: 'The Affects line of ADR 057 names the two templates, the step library and two index files. It leaves
    out rules/eval-format.md, which now holds every eval format rule, and rules/_index.md, schemas/eval/_index.md,
    rules/expectation-generation.md and rules/pipeline-next.md, which this change also edits. That rules file also
    carries three mechanisms the ADR never states: the ''Lines covered'' list, the ''@out-of-slice'' tag, and naming
    a moved story line for a person.'
  leads_to: A later reader cannot tell who decided those three mechanisms, and a change to one of the five unlisted
    files will not be traced back to this decision.
  fix: Add the five files to the Affects line, and add one sentence to section 2 or 5 stating the three mechanisms.
- id: MEM-6
  severity: P4
  category: memory
  title: The 'a later run changes nothing already there' rule is written twice and the two copies differ
  where: null
  basis: null
  problem: Lines 22-23 say a later run 'only adds scenarios and untestable lines'. Lines 36-38 (under 'A fixed yardstick')
    say it adds scenarios, Untestable lines and Lines covered lines.
  leads_to: A reader who stops at the first block would think adding a Lines covered line breaks the rule, and a
    checker written from that block would reject a valid run.
  fix: Keep the rule in 'A fixed yardstick' only. In 'A story file', say just that a story whose feature left the
    slice keeps its file with '@out-of-slice' on its first tag line.
- id: MEM-7
  severity: P4
  category: memory
  title: The parent schemas index does not point to the new eval step-library index
  where: null
  basis: null
  problem: schemas/eval/ has its own _index.md, but the parent index has only a pattern row for it and no 'See eval/_index.md'
