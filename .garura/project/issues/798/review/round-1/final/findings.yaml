- id: MEM-1
  severity: P3
  category: memory
  file: core/components/memory/standards/templates/eval-story.feature.md
  basis: Both new templates end in a '## Rules' section of artifact-content rules (what a tag means, 'each Then
    is an exact result', 'a failure-condition scenario shows ...', build order, 'every name a story file uses is
    listed under Names', the time limit is a whole number). templates/_index.md says a template does not hold rules
    for artifact content (that is rules/), and the base work-plan template keeps the shape only and puts its rules
    in rules/work-plan.md. These rules have no home in rules/, so the second reader of the format (check_eval.py,
    the author skill, a person) has the rules only inside the shape file. adr.md is a base template that does carry
    rules, so the precedent is mixed - hence P3, not higher.
  finding: null
- id: MEM-2
  severity: P3
  category: memory
  file: core/components/memory/standards/templates/eval-story.feature.md
  basis: 'Two design rules are written here that no base-ref source gives. (a) ''No scenario of a story file is
    ever changed or deleted by a later run: a later run only adds scenarios and untestable lines'' (also the template
    description in templates/_index.md line 27). Base ADR 049 says that when an ICE changes after its story is made,
    the story and its hidden-file entry are ''made again together'' - the base has no rule that an eval file is
    append-only. The only source of this rule is the branch''s own new content (ADR 057 / shape-eval ICE), which
    cannot ground it. (b) Scenario tags ''@goal-<n>'' and ''@expectation-<n>'' point at the n-th line of the story''s
    lists. The base gives failure conditions stable ids (F1, in the hidden file) but gives goal and expectation
    lines none; a position is not stable when a story''s list is edited or reordered. Together with (a) a wrongly
    pointing tag could never be corrected. M5 grounds the lists themselves, not the numbering.'
  finding: null
- id: MEM-3
  severity: P3
  category: memory
  file: core/components/memory/standards/schemas/eval/steps-command-line.yaml
  basis: 'The schema discipline on base says each schema carries a validation-rules comment block at the end. This
    file has its sentence rules in a header (lines 1-14) and none at the end: it does not say what check_eval.py
    must enforce (every step is exactly one library sentence, And/But take the previous keyword, a name in square
    brackets must be listed under ''Names'' in the slice file, the first step is not And/But). The header also leaves
    the keys ''matches'' (line 17) and ''does'' undocumented, though load_library reads ''matches'' to pick a library
    for a surface. Other base schemas (pr-findings.yaml, slice.yaml) document every key.'
  finding: null
- id: PM-F1
  severity: P3
  category: product-model
  file: .garura/product/product-os/_spine.yaml
  basis: PM-7
  finding: The spine one-lines were not updated with the pages. cap-shape-eval still says 'keep it where no builder
    can read it' and fn-798 still says 'where no builder reads', while capability.md and fn-798/feature.md now say
    the build is given the intent, never the eval, and a read is flagged, not prevented. Agents read the spine first,
    so they get the old design.
- id: PM-F2
  severity: P3
  category: product-model
  file: .garura/product/product-os/slices/sl-intent-to-design.yaml
  basis: PM-1
  finding: Adding fn-898 stretches the slice past its name and surface. The slice is 'From a named piece of work
    to its design' and its tester runs three plays; the new user_action also has the tester run a lint check over
    build plays and find a flag from a build session, which only exists after a build the slice does not run. The
    outcome is now a multi-clause sentence, not one line. The six fields are all present and agree, so this is about
    fit, not shape.
- id: PM-F3
  severity: P3
  category: product-model
  file: .garura/product/product-os/software-delivery-planning/cap-718/fn-818/feature.md
  basis: PM-5
  finding: '''The stories are the build''s whole brief'' is not what the committed design says. The builder reads
    the story and also the context its context sub-agent collected from the story''s Context guidance. The clause
    ''a story never names the eval, the hidden file or the plan''s evals folder'' is fine; the ''whole brief'' claim
    is wrong and may mislead the plan play. fn-898/feature.md:15 repeats it more carefully (''inputs are the slice''s
    stories, each with its scope of work and Context guidance'') but also leaves out the collected context.'
- id: PM-F4
  severity: P3
  category: product-model
  file: .garura/product/product-os/software-delivery-planning/cap-718/fn-818/feature.md
  basis: PM-6
  finding: The new rule for /shape-plan (a story never names the eval, hidden file or evals folder) is in Rules
    & behavior only. fn-818's ICE has no goal or 'Fails if' line for it, so the plan play does not read it as intent
    and the hidden file has no failure condition for it (F8 and F11 cover failure/recovery conditions in stories,
    not naming the eval). The guarantee is not carried anywhere an agent or the eval reads.
- id: PM-F5
  severity: P3
  category: product-model
  file: .garura/product/product-os/software-delivery-planning/shape-eval/fn-898/feature.md
  basis: PM-8
  finding: 'The acceptance criterion ''Given the ontology and managing-work.md ... they say the build is given the
    intent, never the eval, and not that the eval is encrypted'' cannot hold after this change: ontology.md and
    managing-work.md are not in the diff. The committed ontology v12 says the builder ''never reads'' the eval and
    managing-work.md says ''a builder never reads the evals folder''. The change is therefore shipping a page whose
    own criterion is false, and the base design (ADR 049 section 4, #828) still names encryption. Only ADR 057,
    added by this branch, amends ADR 049, so it cannot ground this check; the human owns whether the decision is
    right.'
- id: PM-F6
  severity: P3
  category: product-model
  file: .garura/product/product-os/software-delivery-planning/domain.md
  basis: PM-2
  finding: 'Five model pages now cite ''798/specs/design.md, lines 7-10'' and ''grounding-questions.md'' as sources.
    Those are one issue''s working files in short-term memory (a partial path, line numbers that move), not a durable
    source a later reader can open. The same sentence (''the product owner dropped encryption and #828'') is pasted
    into four pages. The durable record is ADR 057, which the pages do not cite.'
- id: PM-F7
  severity: P3
  category: product-model
  file: .garura/product/product-os/intents/bi-788.md
  basis: PM-4
  finding: 'Not in the diff, so unchanged: bi-788 still says ''The eval is kept in a place where no builder can
