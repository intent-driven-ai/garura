findings:
  - id: PM-F2
    severity: P4
    file: .garura/product/product-os/slices/sl-intent-to-design.yaml
    line: 5
    also: [".garura/product/product-os/slices/sl-intent-to-design.yaml:21"]
    principle: PM-1
    source: "plan/788/base:slice.yaml, slice.outcome ('one line: the usable thing this slice delivers'); ontology.md, kind Slice"
    finding: "The outcome is still a long sentence with three parts and a trailing clause about the flag being recorded in a build run's evidence (four lines of text). The slice record asks for one line. The product owner kept fn-898 in the slice and approved the name, so the fit question is closed; only the length is left."
    fix: "Shorten the outcome to one sentence, for example the three written parts and 'an eval no build is given', and leave the flag to fn-898."

  - id: PM-F6
    severity: P4
    file: .garura/product/product-os/software-delivery-planning/shape-eval/fn-898/feature.md
    line: 39
    also:
      - ".garura/product/product-os/software-delivery-planning/shape-eval/fn-898/feature.md:41"
      - ".garura/product/product-os/software-delivery-planning/shape-eval/fn-898/feature.md:16"
      - ".garura/product/product-os/software-delivery-planning/shape-eval/fn-898/feature.md:20"
    principle: PM-2
    source: "plan/788/base:.../product-os/grounding/feature.md ('## Sources': where it is seen, one source per line)"
    finding: "Sources point to 'Q-builders-1' and 'Q-flag-1', which are question ids in one issue's working file, and to 'evidence-file.md, lines 34-38', a line range that moves. The rules (lines 16 and 20) also say 'the product owner's answer to Q-builders-1 / Q-flag-1', so a reader of the page cannot open the answer. The same ADR 057 sentence is pasted into six pages (domain.md:18, capability.md:16, fn-795:41, fn-798:35, fn-818:43, fn-898:38). The round 1 problem is mostly fixed; this is what is left."
    fix: "Replace the question ids with the words of the answer, or with #898 (where they are recorded); drop the line range; cite ADR 057 once in each page in the page's own words."

  - id: PM-F7
    severity: P4
    file: .garura/product/product-os/intents/bi-788.md
    line: 18
    also: [".garura/product/product-os/intents/bi-788.md:16", ".garura/product/product-os/intents/bi-788.md:20"]
    principle: PM-4
    source: "plan/788/base:ontology.md, kind Business Intent (Properties 'Must not' and 'Confirmed by and when'; Rules 'Only a person confirms or drops it')"
    finding: "Two small points on the hand-edited intent, both for the product owner and neither a fault of the edit. (a) The Must-not list still says 'Do not let a builder read the eval', while the new proof line and every model page say the build is given the intent and a read is only flagged, never blocked. The owner approved the proof line, not this line. (b) The confirmation footer (line 20, 'confirmed it on 2026-10-24 (#844)') still reads as covering the old proof line; the page does not show that the line changed later on the owner's word. The reason sits in commit 96567014 and #901, not on the page."
    fix: "Ask the product owner whether the Must-not line stays as written. Leave the footer note to #901, which is to record who asked, when and the words; do not edit the intent page again by hand."

  - id: PM-F9
    severity: P4
    file: .garura/product/product-os/software-delivery-planning/shape-eval/capability.md
    line: 6
    also: [".garura/product/product-os/software-delivery-planning/shape-eval/capability.md:4"]
    principle: PM-8
    source: "plan/788/base:.../product-os/grounding/capability.md (directional stage: 'never touches features'); ontology.md, kind Capability"
    finding: "cap-shape-eval is a directional capability (spine detail: directional), and its page now adds a 'Features:' paragraph that lists fn-798 and fn-898 with a summary of each. The directional stage keeps features out of the page; the spine already holds them, so the paragraph can drift from it. The earlier question also stays: fn-898 holds two checks about the build, not about writing the eval, under a capability named 'Write the hidden eval'. The product owner kept the feature in the slice but did not say which capability owns it."
    fix: "Delete the 'Features:' paragraph. Product owner to say whether cap-shape-eval is the right parent for fn-898."

  - id: PM-F10
    severity: P4
    file: .garura/project/plans/788/evals/intent-to-design/failure-and-recovery.md
    line: 3
    principle: PM-7
    source: "plan/788/base:ontology.md, kind Slice (Id and name; hidden file 'the slice' entry) and opening paragraph (same words for the same things)"
    finding: "New in round 2. The slice was renamed to 'Name a business intent, and three plays write its slice, plan and eval', but the hidden file's header still says 'Slice: From a named piece of work to its design'. This is the only place the old name is left. (Outside the product-model files; found while checking the rename.)"
    fix: "Make the hidden file again from the renamed slice record (the play writes it), so the header carries the new name."

  - id: PM-F11
    severity: P4
    file: .garura/product/product-os/software-delivery-planning/shape-eval/fn-898/feature.md
    line: 16
    principle: PM-2
    source: "plan/788/base:.../product-os/grounding/feature.md ('Rules & behavior - the logic, states, and edge cases'; each line explains itself)"
    finding: "New in round 2. A rule says 'When the list named only some plays, a play that builds code and is not on the list could be given the eval'. It tells the story of an earlier draft that the reader has never seen. A rule should state what holds now."
    fix: "Say it as a rule: every play, skill and agent that builds the software is covered, so a play not on any list is still checked."

