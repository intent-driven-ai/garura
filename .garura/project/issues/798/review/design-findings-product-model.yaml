category: product-model
round: 2
playbook: null   # none covers the product model (follow-up: write review/product-model)
severity_source: .garura/project/issues/798/context/memory/standards/rules/pr.md (P1-P4 buckets; no table row covers the model, so the bucket text decides)

principles:
  - id: PM-1
    text: "A slice is one vertical outcome a person can test end to end, on one surface. Its record holds name and outcome, and the outcome is 'one line: the usable thing this slice delivers'."
    source: "plan/788/base:core/components/memory/standards/schemas/product-os/ontology.md (v12), kind Slice; plan/788/base:.../product-os/slice.yaml (slice.outcome comment)"
  - id: PM-2
    text: "A feature page's Sources section says where the part is seen, one source per line, in words a later reader can open."
    source: "plan/788/base:.../product-os/grounding/feature.md ('## Sources')"
  - id: PM-3
    text: "A thin ICE carries the mark in two agreeing places: the Thin line on its page and thin: true in its spine entry."
    source: "plan/788/base:ontology.md, kind ICE (Rules); plan/788/base:docs/adr/052 section 5"
  - id: PM-4
    text: "Only a person confirms or drops a business intent. A confirmed intent records who confirmed it and when; the Must-not list holds the limits the person stated."
    source: "plan/788/base:ontology.md, kind Business Intent (Properties 'Must not', 'Confirmed by and when'; Rules 'Only a person confirms or drops it')"
  - id: PM-5
    text: "The builder reads the story and the context its context sub-agent collected from the story's Context guidance; never an ICE page, the eval, the hidden file or a plan's evals folder."
    source: "plan/788/base:ontology.md, kind Story (Rules) and kind Slice (Rules)"
  - id: PM-6
    text: "Each line of an ICE has one reader. The 'Fails if' lines go to the slice's hidden file, one entry per feature, in /shape-slice's words."
    source: "plan/788/base:ontology.md, kind ICE (Rules) and kind Slice (Hidden file)"
  - id: PM-7
    text: "A person and an agent reading the model use the same words for the same things: the spine one-line and the page say the same."
    source: "plan/788/base:ontology.md, opening paragraph; Capability property 'Name and one line'"
  - id: PM-8
    text: "A directional capability page names the capability and gives it direction only; it does not detail it and never touches features. Its features are in the spine."
    source: "plan/788/base:.../product-os/grounding/capability.md (header, 'directional' stage, and 'Heading contract - DIRECTIONAL')"

