      The contract's own check was loaded in a throwaway interpreter (no bytecode written) and
      fed hand-edited copies of the shipped samples. Each edited sample below is still
      accepted by check_sample() against v1.json, so each rule named is not held by the
      contract or its check today.
    results:
      - "i   apply returns ok:true for an update with status waiting, decided_by null, reply null: ACCEPTED"
