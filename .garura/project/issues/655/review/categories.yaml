    runnable_checks:
      - command: "cd core/tools/memory && python3 contract/check_contract.py"
        note: "validates every sample against v1.json's shapes and answer rules, requires every broken sample to fail, scans the folder boundary; prints a JSON report, exit 0 when all hold. The play executes it (SE-7). Observed read-only while assessing (PYTHONDONTWRITEBYTECODE=1): ok true, 20 samples pass, 23 broken fail, no command without a sample, 0 boundary problems, exit 0."
    notes: >
      New kind of work, not on the shelf: a machine-readable interface contract for a tool, with
      its worked examples. It is not a config map (it points at no files), not harness (nothing
      under core/components/**), not memory (not under core/components/memory/**), not executable
      code (it is data that the check script reads). It is design-bearing because it fixes
      behaviour other stories build against (#656, #657, #658, #659) and implements ADR 035 s1
      (three tiers), s3 (lookup order, never blocks a play), s4 (one tool, outside Garura, find
      and update), s5 (nothing used until a person approves a memory update) and s6 (every
      decision names tier, file, lines). Layer 2 grounds ONLY from what is committed on main:
      docs/adr/035-agents-work-only-from-memory.md (incl. s9 and the "Not decided here" list),
      docs/adr/034-plays-answer-from-memory-inside-a-drive.md (s2, s3, s4),
      docs/adr/016-agent-json-contract.md (the JSON-contract principle), docs/adr/011 (STM as
      inter-skill transport; the "a play's own working files stay direct" settlement),
      docs/adr/009, 015 and 017 as 035 amends them, docs/adr/008 (STM per issue),
      core/grounding/glossary.md (Memory Architecture), docs/philosophy/**, and the base version
      of .garura/project/issues/653/specs/plan.md (git show main:...). Not groundable: v1.json's
      own description, lookup_rule and answer_rules prose, core/tools/memory/README.md, the new
      655 plan, the 653 plan's added lines, the PR body, the self-review, and every file under
      .garura/project/issues/655/review/ (the FIRST review's own findings and design findings are
      now committed in the diff; they are branch content, never grounding, and the re-review must
      not inherit its verdicts from them). What changed since the first review (so the
      grounding re-tests it, not copies the old result): every lookup now names its issue and
      short-term memory is read only in that issue; a read of another issue's short-term path is
      bad_request; an update drafted from the web or the model must target short-term memory
      (researched_goes_to_short_term) and an approved update is applied to the issue's short-term
      memory, with promotion to Garura or Phoenix memory a separate update (apply-promotion
      sample); the approval flow is held by the check (propose waits, decide records the person,
      apply writes only an approved update to its own target); new error wrong_state; every_tier
      has a passing and a broken sample; refusals must be answered with bad_request. Design
      pointers the grounding should test, taken from reading the diff, not findings: (a) eleven
      commands against the nine the issue lists (health, pulled, decide beyond it); (b) `decide`
      records `by` and `reply` as free text and the contract cannot tell a person from an agent,
      against ADR 035 s5 "only a person approves" (the 655 plan says this is left open for #658);
      (c) the lookup treats a missing tier as `tier_missing` while ADR 035 s3 says the lookup
      never blocks a play; (d) NEW and the largest: ADR 035 s5 on main says an approved update is
      "written to memory first: to Garura memory ... or to Phoenix memory", and s1 defines
      short-term memory as per issue, "the plans, specs and context of the work"; the contract
      now makes short-term memory the first landing place of every researched update and moves
      promotion outside the work, a decision that on main exists only as Kapil's word recorded
      in the branch's plan, README and PR body, and the branch's own plan says ADR 035 s5 needs
      an amendment for it (test the contract against s5 as committed, and against ADR 008 for the
      one-issue short-term rule); (e) the README settles two questions that ADR 035 lists under
      "Not decided here" and that contradict ADR 034 s2 as it stands on main (learned
      checkpoint answers listed as memory), recorded only in the README and the plan, not in an
      ADR; (f) commands and options with no ADR text behind them: `every_tier`, `pull` versus
      `pulled`, `wrong_state`. The README is the one path of this design content that sits in
      another category (documentation, below); the grounding agent should read its "What is not
      memory", "When no tier answers" and "The lookup order" sections as claims to test, never
      as a source. No playbook covers this kind of work: a playbook is missing (follow-up task
      needed).

  - name: executable-code
    playbook: review/code
    design_bearing: false   # playbook: industry best practice, not a garura-internal design; Layer 1 only
    layers: [linters, runnable-checks]
    evidence:
      - core/tools/memory/contract/check_contract.py   # 393 lines (275 at the first review); stdlib-only Python 3.10+ script the runtime executes: a JSON-Schema-subset validator, answer-rule checks including the approval flow and one-issue short-term rules, and a folder boundary scan (reads files, walks the tool folder, uses ast for imports)
    runnable_checks:
      - command: "ruff check core/tools/memory/contract/check_contract.py"
        note: "language linter; ruff is on this machine at /Users/kapilahuja/.local/bin/ruff. Observed read-only while assessing (--no-cache): All checks passed."
      - command: "<quality-check-scoped, dispatched by the play to quality-auditor against pr.diff>"
        note: "best-practice and severity taxonomy (CODE-*, SEC-*, DATA-*, ARCH-* rows of pr.md); run by the play, not this agent. The script only reads files and walks its own folder; no git, network or destructive operation."
    notes: >
      One script, grown by 118 lines since the first review (approval-flow checks, one-issue
      short-term checks, refusal and read-answers-what-was-asked checks). The playbook's
      data-safety emphasis is light here (no writes outside stdout, no git, no network), so the
      weight falls on error handling, exit codes (0, 1, 2 as its docstring says) and whether
      the boundary scan and validator do what they claim. The script is also run as the contract
      category's check, so its result is shared.

  - name: tests
    playbook: review/tests
    design_bearing: false   # playbook: no design-grounding; run the suite, a red suite is a blocker
    layers: [linters, runnable-checks]
    evidence:
      - core/tools/memory/contract/test_check_contract.py   # 353 lines (151 at the first review); unittest suite for check_contract.py (validator, answer rules, approval flow, boundary), uses tempfile
    runnable_checks:
      - command: "cd core/tools/memory && python3 contract/test_check_contract.py"
        note: "the suite. Run it, do not just read it (SE-7); a red suite is a blocker. Observed read-only while assessing (PYTHONDONTWRITEBYTECODE=1): Ran 49 tests, OK."
      - command: "ruff check core/tools/memory/contract/test_check_contract.py"
        note: "language linter on the test code. Observed (--no-cache): All checks passed."
    notes: >
      Tests the check script only, not the contract's design. The playbook's Layer 1 points
      apply: no skipped or disabled tests, no test that asserts nothing (quality-check-scoped,
      TEST-* rows). No test file here tests anything except check_contract.py; the samples are
      not counted here because they are the contract's examples and the check's inputs (see the
      first category), not test code.

  - name: documentation
    playbook: review/docs
    design_bearing: false   # playbook: Layer 1 only, no design-grounding
    layers: [linters]   # the playbook names no committed prose linter (a known gap), so the tool performs the checks and cites each
    evidence:
      - core/tools/memory/README.md   # 178 lines (141 at the first review); plain-words guide to the tool: tiers, lookup order, commands, when no tier answers, request and answer rules, errors, "what is not memory", rules for the folder, how to run the check
    notes: >
      Human-facing prose that is not an ADR, a harness file or a memory file, so the docs
      playbook governs: spelling, grammar, dead links, heading hierarchy, leftover TODOs, terminology
      consistency (the tool is "Garura memory" / "Phoenix memory", never "project memory" or
      "LTM", per ADR 035 s1; a read-only scan finds neither term in the README), and that every
      claim agrees with v1.json (eleven commands, eight error codes including the new
      wrong_state, the answer rules, the check's behaviour). The playbook names no committed
      prose linter (a known gap), so the tool performs these checks and cites each. Judgement
      flag: this README is not only a guide. Its "What is not memory" section settles two open
      design questions, and its "The lookup order", "When no tier answers" and "The answer
      rules" restate normative behaviour (including the short-term-first landing of an approved
      update), so it carries design content even though its category is not design-bearing.
      That content is routed to the first category's grounding as claims to test (see its
      notes), not handled here. The README no longer quotes Kapil's words (the new commits
      removed them), so the provenance of the settlements now sits only in the plans and the PR
      body. Path is in this category only; it is counted once.

