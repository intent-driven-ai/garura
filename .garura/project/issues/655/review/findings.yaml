- id: TIC-1
  severity: P2
  category: tool-interface-contract
  file: core/tools/memory/contract/v1.json (answer_rules.researched_goes_to_short_term line 43; commands.propose summary line
    528; commands.apply summary line 717); core/tools/memory/README.md (lines 75-85); core/tools/memory/contract/samples/apply.json,
    samples/apply-promotion.json, samples/broken/propose-web-draft-to-phoenix.json
  basis: ADR035-S5-AS-COMMITTED — docs/adr/035-agents-work-only-from-memory.md, Decision part 5 line 74 and Consequences lines
    122, 126; .garura/project/issues/653/specs/plan.md item 5 lines 161-172; .garura/project/issues/654/specs/stories.yaml
    item 5 line 73 (main)
  finding: 'The contract, following the owner''s 2026-10-18 answer, sends every draft made by the web or the model to the
    issue''s own short-term memory, and lets Garura or Phoenix memory get it only through a second, separately approved promotion
    made outside the work. The committed decision says otherwise. ADR 035 part 5 (line 74): "The approved update is written
    to memory first: to Garura memory for something only this project needs, or to Phoenix memory for something any project
    could use. The waiting work then decides from memory." Nothing on main records the change: docs/adr is untouched by this
    PR and neither ADR 035''s nor ADR 034''s Status line carries a note. Plan item 5 (lines 161-172) and story item 5 (line
    73) repeat part 5, and ADR 035''s Consequences build on it ("A gap in memory, once filled, is there for the next run",
    line 122). With one-issue short-term lookups that last sentence now holds only after a promotion nobody is assigned to
    make, and the Negative consequence (line 126, thin memory means many updates) doubles: a durable answer takes two approvals,
    and the next issue asks again. The contract is right to follow the owner; the record is what is wrong, and #657 and #658
    builders read the record.

    '
- id: TIC-2
  severity: P2
  category: tool-interface-contract
  file: core/tools/memory/contract/v1.json (commands.decide summary line 653 and request lines 654-683; commands.propose requested_by
    lines 558-561; commands.cite decided_by lines 351-354; $defs.update decided_by, requested_by lines 1037-1050); core/tools/memory/contract/check_contract.py
    (check_lifecycle lines 183-188); samples/decide.json, samples/cite.json, samples/apply-promotion.json
  basis: ADR035-S5-AS-COMMITTED — docs/adr/035 Decision part 5 lines 70-78; docs/philosophy/idd-principles.md Principle 3
    line 96; docs/adr/033 Decision part 6 (only the review step writes approval, from the person's answers) (main)
  finding: 'ADR 035 part 5 makes one guarantee the whole feature rests on: nothing from the model or the web is used until
    a person approves it, "for every agent and skill". The contract states it in one prose sentence on decide ("Only a person
    decides") and carries it as free strings: by, decided_by and reply on decide; requested_by on propose, which holds an
    agent in one sample ("product-os-keeper (/vision)") and a person in another ("Kapil Viren Ahuja"). Nothing says what a
