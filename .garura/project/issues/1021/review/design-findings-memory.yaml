grounding_gaps:
  - id: GAP-1
    what: >-
      No source committed before this branch decides "exactly one goal, not negotiable"
      (ice-rubric.md line 9), "parts that only connect others are transitional and recorded as
      considered" (intent-depth.md line 10), or "the product owner can set a preference for
      smaller or bigger intents" (intent-depth.md line 9). Searched main: docs/adr/**,
      docs/philosophy/**, core/components/memory/standards/**, the discover-intent play. Only
      GP-3 supports the first, in direction. Reported as DG-MEM-01, -02 and -06.

