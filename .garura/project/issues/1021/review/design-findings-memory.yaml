# Layer 2 design-grounding, category: memory (check-change Step 3, PR 1039, issue 1021)
# Written by change-reviewer. Read-only review: no file under review was changed.
category: memory
base: main
changed_files:
  - core/components/memory/standards/rules/ice-rubric.md        # new
  - core/components/memory/standards/rules/intent-depth.md      # new
  - core/components/memory/standards/rules/_index.md            # +7 lines: a "Product model rules" table
severity_note: >-
  pr.md maps scan rows to buckets mechanically; no row types a design finding, and the scan gives
  no finding on prose. The bucket meanings are used as written: P2 Major = a structural
  violation, here a conflict with a committed design that a downstream agent would act on;
  P3 Minor = missing docs, wording, naming, a gap that does not change what an agent does;
  P4 Nit = style-level or an omission with a cheap fix. No P1: nothing here touches security,
  secrets, data loss, a breaking API contract or migration safety.
counts: {P1: 0, P2: 2, P3: 5, P4: 3, total: 10}

grounded_principles:
  - id: GP-1
    principle: >-
      An ICE holds its Intent as "goals, limits, fails if" (plural goals); the ready check counts
      no lines and judges no richness (that is the product owner's job); a thin ICE is thin
      because of the mark, never because of its line count, and has AT LEAST a goal, a limit and
      one Fails if; writing an ICE is never blocked.
    sources:
      - {path: core/components/memory/standards/schemas/product-os/ontology.md, ref: "main", lines: "482, 493, 518-520"}
      - {path: docs/adr/047-the-ice-is-its-own-node.md, ref: "main", lines: "38-42 (section 2), 66-68 (section 7), 70-74 (section 8)"}
      - {path: docs/adr/052-shape-slice-writes-the-hidden-file-and-proposes-a-thin-ice.md, ref: "main", lines: "47-54 (section 5), 59 (section 6), 74"}
  - id: GP-2
    principle: >-
      The committed ICE schema and grounding template let an ICE carry several goals: goals may
      be many; goals share one ICE only when they share the context; the Goal label may repeat
      (at least one Goal); the committed gold example has two Goal lines; the linter requires
      at least one Goal.
    sources:
      - {path: core/components/memory/standards/schemas/product-os/ice.yaml, ref: "main", lines: "58-65"}
      - {path: core/components/memory/standards/schemas/product-os/grounding/capability.md, ref: "main", lines: "56-70, 109-110"}
      - {path: core/components/plays/discover-capabilities/scripts/lint_grounding.py, ref: "main", lines: "143, 220-237, 471"}
  - id: GP-3
    principle: >-
      The one-goal discipline: "Can you state the goal in one sentence without 'and'?" A goal that
      needs "and" is usually two goals. (Supports the direction of the rubric's one-goal line; it is
      the only committed source that does.)
    sources:
      - {path: docs/philosophy/idd-decision-checklist.md, ref: "main", lines: "113-117"}
  - id: GP-4
    principle: >-
      Builders and validators must not share context: the one who did the work is not the one who
      proves it. (The rubric's "Done means ... by someone other than the one who did the work" and
      "A check by the doer" conform.)
    sources:
      - {path: docs/philosophy/idd-principles.md, ref: "main", lines: "100-118"}
  - id: GP-5
    principle: >-
      A failure condition is observable and binary and checkable from the output alone; a limit
      shapes the builder's design choices. A "Fails if" that needs the goal to judge is a limit in
      disguise.
    sources:
      - {path: docs/philosophy/idd-principles.md, ref: "main", lines: "71, 75-81"}
  - id: GP-6
    principle: >-
      /discover-intent proposes one business intent per need, never merges two needs, and never
      leaves out a part the source shows: every part of the source is mapped to the business
      intent it serves. A part mapped to no intent is a failure condition, and the checker
      refuses it ("nothing may be left out"). Each main section of the product gets its own intent.
    sources:
      - {path: core/components/plays/discover-intent/reference/ice.md, ref: "main", lines: "92-96 (C12), 138-146 (C17), 179-181 (F12), 270-275 (S7), 357-360 (REC12)"}
      - {path: core/components/plays/discover-intent/SKILL.md, ref: "main", lines: "335-339 (SE-12)"}
      - {path: core/components/plays/discover-intent/scripts/check_intent.py, ref: "main", lines: "187-206"}
  - id: GP-7
    principle: >-
      Memory has three tiers read in this order: short-term, Garura, Phoenix. The project tier is
      called Garura memory, never "project memory". Agents also read the project's git repository,
      product model and intents. When no tier answers, an agent raises a memory update; the model
      or web may only help draft it; nothing is used until a person approves it.
    sources:
      - {path: docs/adr/035-agents-work-only-from-memory.md, ref: "main", lines: "36-44 (section 1), 55-68 (section 3), 70-76 (section 5)"}
  - id: GP-8
    principle: >-
      A plan's operational data (status, direction, branch, item kinds, history) is never written in
      the product model's index or on its pages; the ICE has no link to a work item or a business
      intent. The Plan is one of the ontology's thirteen kinds, "the thread between" the layers.
    sources:
      - {path: core/components/memory/standards/schemas/product-os/ontology.md, ref: "main", lines: "9, 482, 585, 629"}
  - id: GP-9
    principle: >-
      A business intent links to its capabilities, never names features (a feature is reached
      through its parent capability); it holds Outcome, Why, Proof, Must not, Rules, Touches, and
      carries no property for a depth preference.
    sources:
      - {path: core/components/memory/standards/schemas/product-os/ontology.md, ref: "main", lines: "173-250 (Business Intent), 194"}
      - {path: core/config.yaml, ref: "main", lines: "whole file: no depth or granularity key"}
  - id: GP-10
    principle: >-
      How a rules file is shaped and admitted. A rule answers "how must this artifact be
      structured", is enforced by at least one skill, and is the single source of truth. Sibling
      rules open with an H1, anchor to the decision that made them (an ADR or issue), and name
      concrete consumers in the index; a rule that lands before its enforcer says "Not yet wired".
    sources:
      - {path: core/components/memory/standards/rules/_index.md, ref: "main", lines: "67-76 (When to Add Here), 14-47 (rows with named consumers)"}
      - {path: core/components/memory/standards/rules/work-plan.md, ref: "main", lines: "3, 11 (Not yet wired)"}
      - {path: core/components/memory/standards/rules/eval-format.md, ref: "main", lines: "3 (ADR 057)"}
      - {path: core/components/memory/standards/rules/direct-model-write.md, ref: "main", lines: "8 (Authority: ADR 026)"}
      - {path: core/components/memory/standards/rules/user-questions.md, ref: "main", lines: "6-9"}
      - {path: core/components/memory/standards/rules/surface-contract.md, ref: "main", lines: "7 (ADR 022)"}

