    result: >-
      Partly. Both open with an H1 and a plain-words body, and both have examples across
      several domains. Neither anchors to a decision or says what enforces it (DG-MEM-07, -08).
  - check: cross-references resolve (no [[...]] link and no markdown link in either file)
    result: none present, nothing to resolve
  - check: frontmatter id consistent with path
    result: not applicable (sibling rules on main carry no frontmatter)
  - check: each file is listed in the shelf index
    result: pass. Both are in core/components/memory/standards/rules/_index.md lines 17-23; both paths exist.
  - check: the component linter (node core/tools/lint-components/index.js --target core/components, from the repo root)
