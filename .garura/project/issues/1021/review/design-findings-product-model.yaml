findings:
- id: DF-1
  class: P2
  title: The Touches lists on ten intent pages name 238 features; the ontology says a Touches list never names a feature
  files:
    - {file: .garura/product/product-os/intents/bi-1.md, lines: "22-47", feature_lines: 24}
    - {file: .garura/product/product-os/intents/bi-2.md, lines: "19-32", feature_lines: 11}
    - {file: .garura/product/product-os/intents/bi-3.md, lines: "21-41", feature_lines: 17}
    - {file: .garura/product/product-os/intents/bi-4.md, lines: "21-48", feature_lines: 23}
    - {file: .garura/product/product-os/intents/bi-6.md, lines: "20-35", feature_lines: 14}
    - {file: .garura/product/product-os/intents/bi-7.md, lines: "22-48", feature_lines: 24}
    - {file: .garura/product/product-os/intents/bi-8.md, lines: "21-38", feature_lines: 17}
    - {file: .garura/product/product-os/intents/bi-9.md, lines: "20-61", feature_lines: 38}
    - {file: .garura/product/product-os/intents/bi-10.md, lines: "21-73", feature_lines: 48}
    - {file: .garura/product/product-os/intents/bi-11.md, lines: "22-44", feature_lines: 22}
  principle: >
    A business intent's Touches list holds the domains and capabilities it reaches into, each marked adds,
    changes or removes. It does not name features; a feature is reached through its parent capability. A
    business intent points only at its capabilities, the intents it was identified by and, loosely, its domains.
  source:
    - {path: core/components/memory/standards/schemas/product-os/ontology.md, ref: main, lines: "194", says: "Touches ... It does not name features; a feature is reached through its parent capability"}
    - {path: core/components/memory/standards/schemas/product-os/ontology.md, ref: main, lines: "214", says: "It points only at its capabilities, the business intents it was identified by and, loosely, its domains"}
    - {path: core/components/memory/standards/schemas/product-os/ontology.md, ref: main, lines: "243-246", says: "the worked example lists one domain line and one capability line, no feature line"}
  evidence: >
    Of 278 Touches lines on the ten pages, 40 are capability lines and 238 are feature lines (86 percent).
    No page has a domain line. The pages were written through author-intent-page, whose base-ref script accepts
    the kind "feature" (core/components/skills/author-intent-page/scripts/write_page.py on main, line 62
    TOUCH_KINDS = domain, capability, feature), so the skill and the ontology disagree on main. The pages
    follow the skill; the ontology is the committed design. Added by this branch (the five old pages had no
    Touches list). The lists also make bi-10 a 48-line list, against "written for a business reader, in plain
    words" (ontology line 222).
  decision_recorded: none found
  action_hint: either take the feature lines off the pages (the capability lines stay), or amend the ontology and the skill together through the ontology play; the choice is the product owner's

- id: DF-2
  class: P3
  title: 39 capability pages are marked directional in the index but carry a detailed body under third-level headings
  files:
    - {file: .garura/product/product-os/_spine.yaml, lines: "62", note: "cap-specify-product detail: directional; same on the other 38"}
    - {file: .garura/product/product-os/software-delivery-planning/specify-product/capability.md, lines: "3, 9-62", note: "## Directional intent holds a Features list (line 9) and ### Benefit hypothesis (31), ### Boundary (43), ### Guiding rules (54)"}
  principle: >
    A capability page has two shapes and the index says which: a directional page names the capability and gives
    it direction, it does not detail it and never touches features; a detailed page has Benefit hypothesis,
    Boundary, Guiding rules and Features as second-level sections. The linter checks the page against the shape
    the entry's detail field names.
  source:
    - {path: core/components/memory/standards/schemas/product-os/grounding/capability.md, ref: main, lines: "8-19", says: "two valid shapes ... directional NAMES the capability ... does not detail it and never touches features ... The linter validates the doc against the shape its detail: field names"}
    - {path: core/components/memory/standards/schemas/product-os/grounding/capability.md, ref: main, lines: "21-41", says: "the directional heading contract (one section) and the detailed heading contract (four sections)"}
    - {path: core/components/memory/standards/schemas/product-os/spine.yaml, ref: main, lines: "75-77", says: "detail drives which capability.md shape the linter requires"}
  evidence: >
    39 of 40 capability pages (all but cap-initialize) have exactly two second-level sections, Directional intent
    and Sources, and three third-level sections with the detailed bodies. The installed structure check reads
    second-level headings only, so it passes them. The page matches neither contract. Median page length is
    3,741 words against 1,576 for a feature page, so the depth gradient (a feature is never leaner than its
    capability, _content-standard.md lines 32-34) is not met by word count; the content-quality eval is the
    right judge of that and was not run. On main the directional pages were one paragraph (cap-718, cap-719).
  decision_recorded: none found
  action_hint: mark them detailed and raise the headings to second level, or cut them back to directional

- id: DF-3
  class: P3
  title: Intelligent model routing serves BI-7 in the index, but BI-7's Touches list does not name it
  files:
    - {file: .garura/product/product-os/_spine.yaml, lines: "672-677", note: "cap-model-routing intents: bi-10, bi-7"}
    - {file: .garura/product/product-os/intents/bi-7.md, lines: "19-50", note: "four capability lines (Install into a project, Upgrade a project, Support each coding tool, Initialize); no Intelligent model routing line"}
  principle: >
    Each capability a business intent has is linked both ways: the capability's index entry names the intent, and
    the intent's Touches list names the capability. A play that makes one side writes the other.
  source:
    - {path: core/components/memory/standards/schemas/product-os/ontology.md, ref: main, lines: "218"}
  evidence: >
    The other ten intent pages agree with the index on their capability lines (checked by script, 40 of 41
    pairs). bi-10.md lines 68-69 name the capability; bi-7.md does not. The five model-routing features are
    also missing from bi-7.md (a consequence of DF-1 if the feature lines go).
  decision_recorded: capabilities.md says Intelligent model routing serves bi-10 and bi-7 (the BI-10 close record), so the index side is the intended one

- id: DF-4
  class: P3
  title: The domain's intents list holds only bi-1, and no intent page names the domain
  files:
    - {file: .garura/product/product-os/_spine.yaml, lines: "2-5", note: "dom-software-delivery-planning intents: [bi-1]"}
    - {file: .garura/product/product-os/intents/bi-2.md, lines: "17-34", note: "ten intent pages, none with a (domain) line"}
  principle: >
    A domain's intents are the business intents that touch it (for search only), and an intent's Touches list names
    every domain it reaches into, as a loose link.
  source:
    - {path: core/components/memory/standards/schemas/product-os/ontology.md, ref: main, lines: "194", says: "Every domain and capability it reaches into"}
    - {path: core/components/memory/standards/schemas/product-os/ontology.md, ref: main, lines: "208", says: "a business intent touches a domain, the domain's spine intents holds the other side"}
    - {path: core/components/memory/standards/schemas/product-os/ontology.md, ref: main, lines: "305"}
  evidence: >
    All 40 capabilities sit in this one domain and serve bi-1 to bi-4 and bi-6 to bi-11, so ten intents reach it,
    yet the domain entry names one (it named two on main: bi-717, bi-788) and zero pages carry a domain line. The
    link is loose and never a stop, so this is a gap, not a block.
  decision_recorded: none found

- id: DF-5
  class: P3
  title: 206 new features take the retired id prefix fn-; the decision says new features use ft-
  files:
    - {file: .garura/product/product-os/_spine.yaml, lines: "726-1400", note: "for example fn-accept-adr, fn-act-on-its-own, fn-add-eval-steps; 206 new feature ids, none with ft-"}
  principle: "Feature ids keep the fn- prefix for the features that exist; new features use ft-."
  source:
    - {path: docs/adr/048-the-product-model-and-the-work-are-two-layers.md, ref: main, lines: "51"}
    - {path: core/components/memory/standards/schemas/product-os/ontology.md, ref: main, lines: "474, 564", says: "the worked examples use ft- ids (ft-pick-a-free-slot, ft-send-a-note-home)"}
  evidence: >
    On main 33 features carry fn- ids, of which 4 are slug ids already against the rule (fn-setup-questions,
    fn-project-memory, fn-review-rule-groups, fn-rerun-initialize); the other 29 predate it or are issue numbers.
    This branch adds 206 more fn- ids, in slug form. Names are a P3 class in the taxonomy.
  decision_recorded: none found
  action_hint: either change the ids, or record the exception in a decision (ADR 048 line 51 is the rule today)

- id: DF-6
  class: P3
  title: The order of work is held on features, where the ontology does not allow it, and the capability-level need that was on main is gone
  files:
    - {file: .garura/product/product-os/_spine.yaml, lines: "1039-1040", note: "fn-748 depends_on fn-741 (feature to feature)"}
    - {file: .garura/product/product-os/_spine.yaml, lines: "450", note: "cap-upgrade-project depends_on: [] (cap-747 needed cap-739 on main)"}
    - {file: .garura/product/product-os/_spine.yaml, lines: "824-825", note: "fn-727 depends_on fn-724; also fn-743, fn-744, fn-745, fn-746 on fn-741 (same 6 on main)"}
  principle: >
    Needs and identified-by join capabilities only; a feature never needs anything, its order of work comes from
    its parent capability. The ontology names fn-727 to fn-724 as not allowed, to become a capability-to-capability
    need (the move is #765).
  source:
    - {path: core/components/memory/standards/schemas/product-os/ontology.md, ref: main, lines: "364, 409, 412"}
    - {path: docs/adr/047-the-ice-is-its-own-node.md, ref: main, lines: "56"}
  evidence: >
    Pre-existing and not counted as a finding: the six feature-level needs (identical on main). New: on main cap-747
    (Installs follow the renames) needed cap-739 (The naming checks, built before any rename). Both now sit in
    Standards (cap-739) and Upgrade a project (cap-747), but cap-upgrade-project carries no need while fn-748 keeps
    the same need on fn-741. The ready check reads capability needs, not feature needs, so this order no longer
    reaches it. cap-718 and cap-723, the pair the ontology names, were merged into cap-turn-intents-into-work and
    cap-manage-model by this branch, so the capability-level need could now be written and was not. All 40
    capabilities have needs [] and identified_by ''.
  decision_recorded: >
    none found for the dropped capability need. The product owner's answer of 2026-11-11 that a feature does not
    need another feature (capabilities.md, the Manage the model entry) points the same way.

