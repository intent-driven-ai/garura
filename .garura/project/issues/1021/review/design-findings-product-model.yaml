pr: 1039
category: product-model
base: main
reviewed_paths: "577 changed paths under .garura/product/product-os/ (the whole model on the branch is 566 files: 273 ice.md, 40 capability.md, 239 feature.md, 1 domain.md, 11 intent pages, _spine.yaml, 1 decision record)"
sampling: >
  Structure checks ran over the whole model (every index entry, every page). Content checks ran over
  all 11 intent pages and all 273 ICE pages by script; a hand read covered a sample of capability,
