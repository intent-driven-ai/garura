# ---------------------------------------------------------------------------------------------------------------
# Principles reconstructed from committed sources (every source exists on the base ref; none is added by this branch)
# ---------------------------------------------------------------------------------------------------------------
grounded_principles:
  - id: G1
    principle: A plan that exists is changed in one place only, /update-plan. A plan play does not change a plan that exists any other way.
    source: docs/adr/063-shape-plan-makes-the-plan-once-and-update-plan-changes-a-plan-that-exists.md (on main), lines 27-29 (Decision 2), line 44 (Consequences, Positive)
    also: ontology Plan kind, Q46 (lines 164-165 of the memory copy) "a person manages it with /update-plan"
  - id: G2
    principle: A plan ends by its Status. The five statuses are Not Started, In Progress, Paused, Done, Dropped; a person moves a plan to any of them, and "Dropped from any status" is the way a plan ends. The ontology names no removal of a plan file.
    source: ontology Plan kind, "States" (line 636 of the memory copy; Phoenix memory standards/schemas/product-os/ontology.md, version b2e40bff2131; same text in core/components/memory/standards/schemas/product-os/ontology.md on main)
  - id: G3
    principle: When a plan pauses, its issues that are still open stay open and stay in the plan; the plan is restarted by cutting a new branch from main.
    source: 'docs/adr/060-a-plans-branch-merges-into-main-when-the-plan-pauses.md (on main), lines 99-103 (Decision 2) and 105-107 (Decision 3); .garura/user-provided/managing-work.md (on main), lines 160-171, "A plan''s branch: start, pause, start again"'
  - id: G4
    principle: The plan is the work list. It holds what is done, what is being worked now and what comes next; open issues that are in no plan are listed by /list-focus-issues.
    source: docs/adr/051-the-next-play-is-dropped-the-plan-is-the-work-list.md (on main), line 18 and line 48; docs/philosophy/garura-reference-implementation.md (on main), line 129
  - id: G5
    principle: The plan is the human's interface. A business user reads it and learns what the intent is being broken into, what is decided, what is built, and what is still to do.
    source: docs/adr/030-plan-mode.md (on main), lines 18-22 (Decision 0); docs/philosophy/idsd.md (on main), lines 98-110, "The Plan Is the Human's Interface; the Product Model Is the Agent's"
  - id: G6
    principle: A Done plan is not reopened. A bug found after a plan is done sits under the story that introduced it, and no new plan is made. A plan is kept in the repo so that anyone, on any day, can see where the work for one business intent stands.
    source: ontology Plan kind, "What it is" (line 583) and rule on line 631 of the memory copy; States, line 636
  - id: G7
    principle: Open work that belongs to no slice is filed on its own, as a Story, Bug or Chore, and /shape-slice and /shape-plan place it when they run. So an issue with no plan is a legal state, not an error.
    source: .garura/user-provided/managing-work.md (on main), lines 65-74
  - id: G8
    principle: A plan's files are removed only by the remove-plan skill, only with the name of the person who approved, and never when the plan has a branch or when a plan that stays needs it; it never opens a file under a plan's folder and never touches the tracker or the model.
    source: core/components/skills/remove-plan/SKILL.md (on main, added by commit faf8a2ef, #1019), lines 11-12, 44-58; core/components/agents/project-orchestrator.md (on main), lines 147 and 164
    caveat: >-
      This is a harness part, not a decision record. It is the only authority for deleting a plan on the base ref, and it is not
      a design record. See finding PLAN-2.
  - id: G9
    principle: A scenario in a play's intent is a guarantee that can be run. An intent change (scenarios, constraints, failure conditions) goes through the play's ICE and /edit-play, never a hand edit of the compiled play.
    source: 'CLAUDE.md (on main), section "Play Pipeline Rules"; docs/adr/049-a-slice-is-shaped-then-planned-then-given-its-eval.md (on main), lines 40-44 (Decision 3: eval and hidden file live in the home plan''s folder)'

