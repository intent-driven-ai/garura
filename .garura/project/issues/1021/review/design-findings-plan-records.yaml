# ---------------------------------------------------------------------------------------------------------------
# Findings
# ---------------------------------------------------------------------------------------------------------------
findings:

  - id: PLAN-1
    severity: P2
    title: 90 of the 162 issues open in the tracker lose their plan, and the approval record does not name them
    files:
      - .garura/project/plans/606.yaml
      - .garura/project/plans/722.yaml
      - .garura/project/plans/734.yaml
      - .garura/project/plans/756.yaml
      - .garura/project/plans/788.yaml
    principle_violated: G3 (open issues of a plan that is not running stay in the plan), supported by G4 (the plan is the work list) and G5 (the plan shows what is still to do)
    committed_source:
      - docs/adr/060-a-plans-branch-merges-into-main-when-the-plan-pauses.md (main) lines 101-103: "even with issues of the plan still open. Those issues stay open and stay in the plan."
      - docs/adr/051-the-next-play-is-dropped-the-plan-is-the-work-list.md (main) line 18 and line 48
      - docs/philosophy/idsd.md (main) lines 98-110
    basis: >-
      Six of the seven plans were Paused, not Dropped (read from main:.garura/project/plans/<id>.yaml; branch null for all seven).
      The design's rule for a plan that is not running is that its open issues stay in the plan. The removal does the opposite:
      the issues stay open in the tracker and leave every plan. Counted from the seven base-ref plan trees against the open issues
      of the repository (read-only gh list): 606 has 39 still open, 722 has 9, 734 has 26, 756 has 7, 788 has 9. That is 90 issues
      (26 stories, 24 bugs, 19 chores, 16 feature items, 5 spikes) out of 162 open issues in the repository (about 56 percent).
      Plans 717 and 767 have none still open. The plan files themselves count 98 items not Done or Dropped (41, 0, 10, 27, 8, 1, 11);
      8 of them are already closed in the tracker, so the plan files were behind the tracker.
      The approval record (.garura/project/issues/1021/context/cleanup/approval.md and plan.md, step 7) says "Every plan is Paused or
      Done with no branch. Git keeps them." It names neither the open items nor their count, though the skill's report carried
      them (items by status per plan). So the product owner approved the deletion without being shown what it leaves on no plan.
    what_stays_true:
      - The seven business intents and the six epics (955, 957, 958, 959, 960, 794) are all CLOSED in the tracker (NOT_PLANNED, or COMPLETED for 717), so no open epic is orphaned.
      - The tracker keeps each issue's parent link; /list-focus-issues lists open issues (ADR 051 line 18); git keeps every file (remove-plan SKILL.md line 48).
      - Plan-less open work is a legal state (G7, managing-work.md lines 65-74).
    why_not_lower: >-
      It is the one place where the removal contradicts an accepted ADR sentence, it touches more than half of the open issues,
      and the approval did not carry the fact. It does not block: nothing is lost and nothing is unsafe. A reviewer may take it to P3
      if the product owner confirms the 90 issues are meant to go back to standalone work.
    owed_to_close: the product owner confirms the 90 open issues are meant to stand alone until /shape-slice and /shape-plan place them (G7), or the list is recorded where it can be found.

  - id: PLAN-2
    severity: P3
    title: Grounding unavailable - no decision record on the base ref allows deleting a plan, and six Paused plans were deleted instead of marked Dropped
    files:
      - .garura/project/plans/606.yaml
      - .garura/project/plans/722.yaml
      - .garura/project/plans/734.yaml
      - .garura/project/plans/756.yaml
      - .garura/project/plans/767.yaml
      - .garura/project/plans/788.yaml
    principle_violated: G1 and G2 (a plan that exists is changed only by /update-plan; a plan ends by Status Dropped), with G3 (Paused means a restart is planned)
    committed_source:
      - docs/adr/063-shape-plan-makes-the-plan-once-and-update-plan-changes-a-plan-that-exists.md (main) lines 27-29 and 44
      - ontology Plan kind, States (memory copy line 636), and Q46 (lines 164-165)
      - docs/adr/060-a-plans-branch-merges-into-main-when-the-plan-pauses.md (main) lines 105-107
    basis: >-
      The base design says one thing about the end of a plan: its Status becomes Dropped, and the file stays. It says one thing
      about changing a plan that exists: /update-plan. It says one thing about a Paused plan: work starts again from a new branch.
      No ADR, ontology line or guide on the base ref says a plan file may be deleted, when, or who decides. The only base-ref
      authority is the skill remove-plan (commit faf8a2ef, #1019, 2026-11-02) and its routing line in project-orchestrator.md
      (lines 147 and 164). A skill is a tool, not a decision. The record that does allow it, ADR 065, is added by this branch and
      is not used as grounding here. This is a grounding gap, not a proven violation: ADR 063 is about plays that change the
      content of a plan, and it neither forbids nor sanctions a deletion.
    conformance_checked_and_met:
      - Every plan has branch null on main, and no plan/* branch exists locally or on origin.
      - No plan stays after the removal, so no remaining plan needs a removed one (needs_plans 717 -> 722, 756 -> 722 all go together).
      - The request carries the approver (the product owner) and a plan list of digits only (remove-plans.json).
      - The script opens only the plan YAML files; files under a plan's folder are counted and moved by name (remove_plans.py lines 66-71 and 124-135).
    owed_to_close: the human reviewer judges ADR 065 (decision-records category) as the record that fills this gap; and decides whether deleting a Paused plan, rather than setting it Dropped, is intended.

  - id: PLAN-3
    severity: P3
    title: The one Done plan (717) is deleted although the design keeps a Done plan as the finished record and the home for later bugs
    files:
      - .garura/project/plans/717.yaml
    principle_violated: G6
    committed_source:
      - ontology Plan kind, "What it is" (line 583), rule on line 631, States (line 636) of the memory copy
    basis: >-
      Plan 717 is Done (35 items: 31 Done, 4 Dropped, none open; its business intent #717 is CLOSED as completed). The ontology says a
      Done plan is not reopened and that a bug found after it sits under the story that introduced it, with no new plan. That rule
      assumes the Done plan stays. With the file gone, a late bug in the work delivered under #717 (/update-plan, /show-plan, plan
      branches) has no plan file to sit in, and /update-plan, which "finds the plan", finds none. The other six deleted plans were
      Paused, so G6 does not reach them.
    what_stays_true: the issues and their parent links stay in the tracker, and git keeps the file; so a later bug can still be filed under its story.
    owed_to_close: the human reviewer confirms that a Done plan may be removed (the same gap as PLAN-2).

  - id: PLAN-4
    severity: P3
    title: The only test that reads this repository's real plan files now has no plan to read; it fails on a tree where the emptied folder remains and is skipped on a clean checkout
    files:
      - .garura/project/plans/606.yaml
      - .garura/project/plans/717.yaml
      - .garura/project/plans/722.yaml
      - .garura/project/plans/734.yaml
      - .garura/project/plans/756.yaml
      - .garura/project/plans/767.yaml
      - .garura/project/plans/788.yaml
    principle_violated: a committed check still has what it checks (core/tools/plan/test_plan.py, class RepoPlansTest, is on main and is not changed by this branch)
    committed_source: core/tools/plan/test_plan.py (main), lines 309-315 - "test_every_plan_of_this_repository_reads_with_the_template" skips when there is no plans folder and otherwise asserts that at least one plan loads
    basis: >-
      Run on this working tree (python3 -B core/tools/plan/test_plan.py RepoPlansTest): FAILED, "AssertionError: [] is not true",
      because remove-plan leaves the emptied .garura/project/plans/ folder on disk. In a clean checkout of the branch the tree
      holds only .garura/project/issues under .garura/project (git ls-tree HEAD .garura/project/), so the folder is absent and the
      test is skipped. Either way the repository has no real plan file left that is checked against the plan-view template.
      Other plan tests write their own temporary plans (test_check_plan_absent.py, test_merge_plan.py, test_resolve_plan.py,
      test_setup_branch.py), so they are not affected. The plan tools themselves tolerate an empty folder (plan.py list prints "No plans in <dir>.").
    owed_to_close: the working-tree folder is removed or the test is told what to do with zero plans; the real-plan check resumes when the next plan is made.

  - id: PLAN-5
    severity: P3
    title: /shape-eval's first success scenario (S1) is pinned on plan 788, its epic and its eval, which no longer exist in the repository
    files:
      - .garura/project/plans/788.yaml
      - .garura/project/plans/788/evals/intent-to-design/ (6 deleted files, counted by name only)
    principle_violated: G9 (a play's scenario is a guarantee that can be run; the eval and the hidden file live in the home plan's folder)
    committed_source:
      - core/components/plays/shape-eval/reference/ice.md (main) line 117: "S1 - (product owner, first eval) Given plan 788 with epic #794, its four stories and the slice's hidden file, and no eval yet, when the product owner runs /shape-eval 788 ..."
      - docs/adr/049-a-slice-is-shaped-then-planned-then-given-its-eval.md (main) lines 40-44
      - CLAUDE.md (main), "Play Pipeline Rules"
    basis: >-
      shape-eval's ICE is not changed by this branch and still gives plan 788 as the case of its first scenario. Plan 788, its eval
      folder (the first evals Garura made, ADR 057 lines 13-15) and, in the model, the slice sl-intent-to-design are all removed in
      this PR, so /shape-eval 788 cannot be run as written. The four features whose stories the deleted eval files were named for
      (fn-795, fn-798, fn-818, fn-898) are still in the model on this branch, moved to new capabilities, with no slice and no eval;
      the design allows that (an eval belongs to a slice), so that part is not a finding. The scenario is an intent line, so its fix is an
      intent change through the play's ICE and /edit-play, not a hand edit.
    owed_to_close: a follow-up through /edit-play changes S1 to a case that exists; not part of this PR.

  - id: PLAN-6
    severity: P4
    title: Two template samples show the removed plans as if they were live
    files:
      - .garura/project/plans/717.yaml
      - .garura/project/plans/788.yaml
      - .garura/project/plans/606.yaml
      - .garura/project/plans/722.yaml
      - .garura/project/plans/734.yaml
      - .garura/project/plans/756.yaml
      - .garura/project/plans/767.yaml
    principle_violated: the plan view is printed from the plan files alone, so a sample that names real plans reads as the current state
    committed_source:
      - 'core/components/memory/standards/templates/plan-view.md (main) lines 99-103 (the graph sample: plan/717/base, plan/788/base, and "on main: #606, #722, #734, #756, #767" - exactly the removed set)'
      - core/components/memory/standards/templates/plan-update.md (main) line 48 (a sample screen headed "Plan 717 - serves #717")
      - core/components/plays/show-plan/SKILL.md (main) description: "from its plan file alone"
    basis: >-
      Both are format samples; the plan tool reads only the Settings block of plan-view.md, so nothing breaks. The names are real,
      the plans are gone, and plan 717's branch was deleted on 2026-10-31 (plan 717 file, branch comment), so the samples
      were already stale.

  - id: PLAN-7
    severity: P4
    title: The work guide still points at plan 606 as the live case of the unplanned-epic rule
    files:
      - .garura/project/plans/606.yaml
    principle_violated: the guide read before every issue should match the plan files it describes
    committed_source: '.garura/user-provided/managing-work.md (main) lines 83-106 ("An unplanned epic gathers defects being fixed together": "Its plan is the business intent''s plan file, plans/<intent>.yaml, with planned: false", "The first is #922, under business intent #606")'
    basis: >-
      Plan 606 (planned: false) was the only plan file of that kind. The rule stays valid for any later unplanned epic; only its
      first and only worked case is gone, and epic #922 is CLOSED as completed. The guide is not changed by this branch.

# ---------------------------------------------------------------------------------------------------------------
# Checked and found consistent (no finding)
# ---------------------------------------------------------------------------------------------------------------
checked_consistent:
  - Each plan's status and branch on main, read from the seven plan files: 717 Done; 606, 722, 734, 756, 767, 788 Paused; branch null on all seven. The claim "Paused or Done, with no branch" is true.
  - No plan/* branch on origin or locally (git branch -a, git ls-remote --heads origin 'plan/*', both empty).
  - The report counts agree with the base-ref plan files: items 76, 35, 12, 44, 17, 1, 35 (220 in all); plan 788's folder held 6 files.
  - The removal is the base-ref skill's own path (remove-plan, named approver, all or nothing), and it opened only plan YAML files.
  - Plans 717, 722, 734, 756, 788 match the five business-intent pages deleted from the model; plans 606 and 767 had no intent page on the base ref, and their business intents (#606, #767) are CLOSED as not planned in the tracker.
  - No remaining file reads a removed plan file as live data: the other mentions are test fixtures that write temporary plans, preflight comments, install.py comments (lines 244 and 253, history), ADR text, and ontology change-log lines. The two plan-view tools tolerate an empty plans folder.

cross_category_notes:
  - The index line .garura/product/product-os/_spine.yaml:1205 (created_by '/update-plan (plan 717, ...)') still names plan 717 as provenance. The cleanup plan already records it (plan.md, "Left as it is"). It belongs to the product-model category.
  - The tracker facts above (closed intents and epics, 162 open issues) are read from GitHub, read-only; they are not committed sources and are used to test conformance, not as a standard.
