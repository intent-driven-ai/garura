  title: The one Done plan (717) is deleted although the design keeps a Done plan as the finished record and the
    home for later bugs
  basis: 'Plan 717 is Done (35 items: 31 Done, 4 Dropped, none open; its business intent #717 is CLOSED as completed).
    The ontology says a Done plan is not reopened and that a bug found after it sits under the story that introduced
    it, with no new plan. That rule assumes the Done plan stays. With the file gone, a late bug in the work delivered
    under #717 (/update-plan, /show-plan, plan branches) has no plan file to sit in, and /update-plan, which "finds
    the plan", finds none. The other six deleted plans were Paused, so G6 does not reach them. | G6 | ["ontology
    Plan kind, \"What it is\" (line 583), rule on line 631, States (line 636) of the memory copy"]'
