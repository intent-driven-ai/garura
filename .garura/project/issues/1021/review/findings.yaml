  lines: null
  title: 90 of the 162 issues open in the tracker lose their plan, and the approval record does not name them
  basis: 'Six of the seven plans were Paused, not Dropped (read from main:.garura/project/plans/<id>.yaml; branch
    null for all seven). The design''s rule for a plan that is not running is that its open issues stay in the plan.
    The removal does the opposite: the issues stay open in the tracker and leave every plan. Counted from the seven
    base-ref plan trees against the open issues of the repository (read-only gh list): 606 has 39 still open, 722
    has 9, 734 has 26, 756 has 7, 788 has 9. That is 90 issues (26 stories, 24 bugs, 19 chores, 16 feature items,
    5 spikes) out of 162 open issues in the repository (about 56 percent). Plans 717 and 767 have none still open.
    The plan files themselves count 98 items not Done or Dropped (41, 0, 10, 27, 8, 1, 11); 8 of them are already
    closed in the tracker, so the plan files were behind the tracker. The approval record (.garura/project/issues/1021/context/cleanup/approval.md
    and plan.md, step 7) says "Every plan is Paused or Done with no branch. Git keeps them." It names neither the
    open items nor their count, though the skill''s report carried them (items by status per plan). So the product
    owner approved the deletion without being shown what it leaves on no plan. | G3 (open issues of a plan that
    is not running stay in the plan), supported by G4 (the plan is the work list) and G5 (the plan shows what is
    still to do) | [{"docs/adr/060-a-plans-branch-merges-into-main-when-the-plan-pauses.md (main) lines 101-103":
    "even with issues of the plan still open. Those issues stay open and stay in the plan."}, "docs/adr/051-the-next-play-is-dropped-the-plan-is-the-work-list.md
    (main) line 18 and line 48", "docs/philosophy/i'
  decision_recorded: null
  source: design-findings-plan-records.yaml
