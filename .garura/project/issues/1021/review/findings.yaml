  - .garura/project/plans/788.yaml
  lines: null
  title: Grounding unavailable - no decision record on the base ref allows deleting a plan, and six Paused plans
    were deleted instead of marked Dropped
  basis: 'The base design says one thing about the end of a plan: its Status becomes Dropped, and the file stays.
    It says one thing about changing a plan that exists: /update-plan. It says one thing about a Paused plan: work
    starts again from a new branch. No ADR, ontology line or guide on the base ref says a plan file may be deleted,
    when, or who decides. The only base-ref authority is the skill remove-plan (commit faf8a2ef, #1019, 2026-11-02)
    and its routing line in project-orchestrator.md (lines 147 and 164). A skill is a tool, not a decision. The
    record that does allow it, ADR 065, is added by this branch and is not used as grounding here. This is a grounding
    gap, not a proven violation: ADR 063 is about plays that change the content of a plan, and it neither forbids
    nor sanctions a deletion. | G1 and G2 (a plan that exists is changed only by /update-plan; a plan ends by Status
    Dropped), with G3 (Paused means a restart is planned) | ["docs/adr/063-shape-plan-makes-the-plan-once-and-update-plan-changes-a-plan-that-exists.md
    (main) lines 27-29 and 44", "ontology Plan kind, States (memory copy line 636), and Q46 (lines 164-165)", "docs/adr/060-a-plans-branch-merges-into-main-when-the-plan-pauses.md
    (main) lines 105-107"]'
  decision_recorded: null
  source: design-findings-plan-records.yaml
