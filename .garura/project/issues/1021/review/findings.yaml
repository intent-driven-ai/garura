- id: DG-MEM-01
  severity: P2
  category: memory
  file: core/components/memory/standards/rules/intent-depth.md
  lines: 10-11, 15-16
  title: The rule lets a part of the source become no intent; the committed /discover-intent play and its checker
    refuse exactly that
  basis: 'On main the play that "specifies intents" (the rule''s own named consumer, in _index.md line 22) holds
    the opposite contract. C12 (core/components/plays/discover-intent/reference/ice.md lines 92-96): "never leaving
    out a part the source shows; every part of the source is mapped to the business intent it serves (the coverage
    map)". F12 (lines 179-181): "a part of what the source shows is mapped to no business intent" is a failure.
    S7 (lines 270-275) and SE-12 (core/components/plays/discover-intent/SKILL.md lines 335-339) test "every part
    mapped". The checker, core/components/plays/discover-intent/scripts/check_intent.py lines 187-206, rejects a
    coverage entry whose intent is missing: "maps to no business intent ... nothing may be left out". The rule also
    has no home for a "considered" record: a coverage entry must name an intent, and the Business Intent and Source
    kinds (ontology.md lines 173-250, 252-290) hold no such property. Line 11 also contradicts itself ("every part"
    versus "each part that matters") and leaves the exempt parts unrecorded, which line 16 calls a fault. | GP-6'
  decision_recorded: null
  source: design-findings-memory.yaml
- id: DG-MEM-02
  severity: P2
  category: memory
  file: core/components/memory/standards/rules/ice-rubric.md
  lines: 9, 37
  title: '"Exactly one goal, not negotiable" reverses the committed ICE design, which lets an ICE carry several
    goals'
  basis: 'The rubric says (line 5) the ontology''s ICE kind "holds the full shape". The ontology''s Intent property
    is "The goals (what must be true), the limits, and what counts as failing" (ontology.md line 493; also line
    482), and ADR 047 section 2 says "the goals" (lines 38-42). The committed ICE schema is explicit: "intent.goals
    and expectations.outcomes may be many" and goals "share an ICE only if they share the context" (ice.yaml lines
    58-65). The committed grounding template says "a label may repeat; at least one Goal" and its gold example has
    two Goal lines (grounding/capability.md lines 69, 109-110); the linter enforces "at least one Goal" (lint_grounding.py
    lines 220-237). The count test is context, not "one". The only committed source for a one-goal bar is docs/philosophy/idd-decision-checklist.md
    lines 113-117 ("usually two goals"), which is advice with "usually", not "not negotiable". | GP-2 (with GP-1)'
  decision_recorded: null
  source: design-findings-memory.yaml
- id: DG-MEM-03
  severity: P3
  category: memory
  file: core/components/memory/standards/rules/ice-rubric.md
  lines: 3, 10-11
  title: '"A thin ICE has up to three" caps what the thin mark defines as a floor, and the rubric never says it
    is advisory'
  basis: 'ADR 052 section 5 (lines 49-54) and ontology.md line 520 give a thin ICE "at least" a goal, a limit and
    one Fails if. ADR 052 line 59 and ontology.md lines 518 and 520: "the check counts no lines ... An ICE is thin
    because it carries the mark, not because it has few lines." The rubric''s own "Thin" section (line 33) says
    the same, so lines 10-11 contradict the file they sit in. Line 3 says "a person, a play or a judge reads an
    ICE against this table" and never says that failing it never blocks a write or work (ontology.md line 519; ADR
    047 section 8 line 74; ADR 052 line 74; lint_grounding.py line 471 "never whether a part is thin or wrong").
    Richness is "the product owner''s job" (ontology.md line 518). | GP-1'
  decision_recorded: null
  source: design-findings-memory.yaml
- id: DG-MEM-04
  severity: P3
  category: memory
  file: core/components/memory/standards/rules/ice-rubric.md
  lines: 22-27
  title: The Read order names "the project's existing memory" and "Garura memory" as two steps and leaves out short-term
    memory
  basis: 'ADR 035 section 1 (lines 36-44): the tiers are Phoenix, Garura and short-term; the project tier "is called
    Garura memory, not ''project memory''". Section 3 (lines 55-68): the lookup runs short-term, then Garura, then
    Phoenix. Line 42: "Agents also read the project''s git repository, its product model and its intents." Rubric
    step 1 uses the banned name, and if it means Garura memory then step 2 repeats it; if it means the issue''s
    folder it omits the tier''s name. Step 4 ("research it and raise a memory update") is consistent with section
    5 (lines 70-76) only if the research is read as drafting help, which the line does not say. | GP-7'
  decision_recorded: null
  source: design-findings-memory.yaml
- id: DG-MEM-05
  severity: P3
  category: memory
  file: core/components/memory/standards/rules/_index.md
  lines: 17-23
  title: The new rows name no concrete consumer, and no play, skill or checker reads either rule
  basis: '_index.md "When to Add Here" (lines 67-76): a rule "is enforced by at least one skill (validator, generator,
    orchestrator)". Every existing row names who reads it (for example eval-format.md names /shape-eval and author-slice-eval;
    work-plan.md names author-plan-file and project-orchestrator). The new rows say "Any play or skill that writes
    or judges an ICE" and "Any play or skill that specifies intents". A search of core/, docs/ and installer/ on
    this branch finds both file names only in _index.md. work-plan.md line 11 shows the base practice when a rule
    lands ahead of its enforcer: a "Not yet wired" note. | GP-10'
  decision_recorded: null
  source: design-findings-memory.yaml
- id: DG-MEM-06
  severity: P3
  category: memory
  file: core/components/memory/standards/rules/intent-depth.md
  lines: '9'
  title: '"They can also set a preference for smaller or bigger intents" names a setting that has no home'
  basis: 'No committed place holds it: core/config.yaml on main has no depth or granularity key; the Business Intent
    kind lists its properties (ontology.md lines 183-195) and none is a depth preference; the play reads no such
    input (discover-intent SKILL.md, ice.md C12 and C17 set the level from the product''s own main areas). Sibling
    rules that name a state say where it lives (work-plan.md "Where it lives", run-status.md "The file", user-questions.md
    "How the file is kept"). The rule does not say where the preference is kept, who writes it, or which play reads
    it. | GP-9'
  decision_recorded: null
  source: design-findings-memory.yaml
- id: DG-MEM-07
  severity: P3
  category: memory
  file: core/components/memory/standards/rules/intent-depth.md
  lines: whole file (also core/components/memory/standards/rules/ice-rubric.md, whole file)
  title: Neither rule anchors to a decision, and no committed decision exists for its design points
  basis: 'Sibling rules open by naming the decision that made them: eval-format.md line 3 (ADR 057), work-plan.md
    line 3 (ADR 030), direct-model-write.md line 8 ("Authority: ADR 026"), user-questions.md lines 6-9 (ADR 050),
    surface-contract.md line 7 (ADR 022). The two new files cite none. GAP-1: nothing on main decides the three
    points DG-MEM-01, -02 and -06 report. The memory playbook''s rationale (knowledge/review/memory.md) warns that
    "a wrong or self-justifying entry propagates silently". The only record the branch offers is ADR 065 and 066,
    which are under review and name neither rule. | GP-10'
  decision_recorded: null
  source: design-findings-memory.yaml
- id: DG-MEM-08
  severity: P4
  category: memory
  file: core/components/memory/standards/rules/ice-rubric.md
  lines: '39'
  title: '"Plans sit outside the model" is looser than the ontology'
  basis: 'The ontology makes the Plan one of its thirteen kinds, "the thread between" the two layers (ontology.md
    line 9, line 585), and forbids a plan''s operational data in "the product model''s index or on its pages" (line
    629). It forbids operational data, not every mention. The conclusion for the ICE page (no plan named) holds:
    the ICE has no link to a work item or a business intent (line 482). Only the reason is worded too wide. | GP-8'
  decision_recorded: null
  source: design-findings-memory.yaml
- id: DG-MEM-09
  severity: P4
  category: memory
  file: core/components/memory/standards/rules/ice-rubric.md
  lines: 9-11
  title: The rubric gives no test that tells a Limit from a Fails if
  basis: 'IDD principle 3 (idd-principles.md lines 75-81): a failure condition is observable and binary and can
    be judged "from builder output alone"; one that needs the goal to judge "may be a constraint in disguise". Line
    71: a requirement that shapes the builder''s design is a constraint. The rubric asks for "at least one, for
    what matters most" and offers no test, so a judge cannot catch a limit written as a Fails if (or the reverse).
    The examples are sound. | GP-5'
  decision_recorded: null
  source: design-findings-memory.yaml
- id: DG-MEM-10
  severity: P4
  category: memory
  file: core/components/memory/standards/rules/intent-depth.md
  lines: '8'
  title: '"The detail goes in its features" skips the capability'
  basis: The Business Intent kind links to its capabilities and "does not name features; a feature is reached through
    its parent capability" (ontology.md line 194). The rule's example also reads "with the discount as a feature".
    The shape holds, but the sentence should say "its capabilities and their features". | GP-9
  decision_recorded: null
  source: design-findings-memory.yaml
