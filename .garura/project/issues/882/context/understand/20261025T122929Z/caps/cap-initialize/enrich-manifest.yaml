enrich:
  capability_ref: cap-initialize
  grounded_in: 'no domain shelf (routing.yaml, re-routed in run 3: unmatched against the ten Phoenix 44e1c4c shelves); the domain page software-delivery-planning/domain.md and its sources; the product owner''s sources GitHub #862 (business intent), #881 (story) and #883 (story, the memory rule rewritten 2026-10-25)'
  capability:
    id: cap-initialize
    slug: initialize
    domain: dom-software-delivery-planning
    status: proposed
    detail: detailed
    one_line: 'After the install, set a project up for Garura: its memory, its review rules, and its tracker''s work-item types.'
    doc: software-delivery-planning/initialize/capability.md
    intents: []
    nfr_needs:
      reliability:
        level: medium
        target: a second run with every answer unchanged and no Phoenix memory change changes 0 files in the project's memory, its rule-group record and its tracker; an install changes 0 files in any project's Garura memory
        gate: run initialize twice on a test project with the same answers and diff the memory folder, the rule-group record and the tracker's type list; install Garura and Phoenix again and diff the project's memory folder
      security:
        level: medium
        target: 0 writes to the tracker or the type mapping before the product owner's typed yes; 0 writes to Phoenix memory or another project's memory from initialize; every type made is named in the run's record
        gate: run initialize on a test GitHub organization with a missing type, answer no, and check the tracker's type list and the mapping are unchanged; answer yes and check the record names each type made; initialize two test projects and diff Phoenix memory and the other project's memory before and after
      maintainability:
        level: medium
        target: a new tracker (Jira, Linear) is added by one entry in the adapter with 0 changes to any play; the plays read only the type mapping
        gate: 'review of the change that adds the second tracker: its diff touches the adapter and no play'
    compliance_needs: []
    metadata:
      created_by: /discover-capabilities
  features:
  - id: fn-setup-questions
    slug: fn-setup-questions
    capability: cap-initialize
    intents: []
    status: proposed
    one_line: Ask the product owner the short set of setup questions built from Phoenix memory, each with choices and a proposed answer that names its source, and keep the confirmed answers for the other features.
    doc: software-delivery-planning/initialize/fn-setup-questions/feature.md
  - id: fn-project-memory
    slug: fn-project-memory
    capability: cap-initialize
    intents: []
    status: proposed
    one_line: Set up the project's Garura memory from only the memory blocks the answers call for, and record the answers in the product profile.
    doc: software-delivery-planning/initialize/fn-project-memory/feature.md
  - id: fn-review-rule-groups
    slug: fn-review-rule-groups
    capability: cap-initialize
    intents: []
    status: proposed
    one_line: Record which review rule groups fit the project, so a review runs only those and names the groups it skipped.
    doc: software-delivery-planning/initialize/fn-review-rule-groups/feature.md
  - id: fn-881
    slug: fn-881
    capability: cap-initialize
    intents: []
    status: proposed
    one_line: Find the tracker's work-item types, make each missing one (Business Intent, Epic, Story, Bug, Chore, Spike) after a typed yes, and record a stand-in, also after a typed yes, where one cannot be made.
    doc: software-delivery-planning/initialize/fn-881/feature.md
  - id: fn-rerun-initialize
    slug: fn-rerun-initialize
    capability: cap-initialize
    intents: []
    status: proposed
    one_line: Run initialize again when the project changes, with the earlier answers proposed, so the memory, rule groups and tracker set-up follow it.
    doc: software-delivery-planning/initialize/fn-rerun-initialize/feature.md
  - id: fn-883
    slug: fn-883
    capability: cap-initialize
    intents: []
    status: proposed
    one_line: Give each project its own memory blocks from the one Phoenix memory on the machine, and on each run compare them with Phoenix memory so the project learns when a block changed.
    doc: software-delivery-planning/initialize/fn-883/feature.md
  implied_levels:
    reliability:
      level: medium
      gate: run initialize twice on a test project with the same answers and diff the results; reinstall and diff the project's memory
    security:
      level: medium
      gate: no tracker or mapping write before the typed yes, on a test GitHub organization; no write to Phoenix memory or another project's memory
    maintainability:
      level: medium
      gate: the change that adds the second tracker touches the adapter and no play
  compliance: []
  gaps:
  - about: cap-initialize
    missing: 'the business intent id of #862 in the model'
    why: '#862 is the business intent this capability serves, but the model has no intent page for it (intents/ holds bi-717, bi-722, bi-734, bi-756, bi-788), so the capability''s and features'' intents lists are left empty and their ICE is not workable until it is linked'
  - about: fn-review-rule-groups
    missing: the list of the review's rule groups and which setup answer decides each
    why: '#862 names front end, back-end service, database and running service for Garura and #860 names permissions; the full list is not in the sources and no memory shelf holds it; the page writes six groups as our default and keeps any other group'
  - about: fn-review-rule-groups
    missing: Garura's own answer to the permissions question
    why: the page keeps the permission group for Garura until that answer says no (our default, stated on the page)
  defaults_written:
  - about: fn-setup-questions
    what: the confirmed answers are kept in the run's short-term memory (the issue's folder, or initialize's own folder when it runs with no issue) and handed to fn-project-memory for the product profile, where a later run finds them
    marked_on_page: true
  - about: fn-setup-questions
    what: questions asked together in one brief; an answer outside the choices kept with a note; a partial reply asked again for the missing questions only
    marked_on_page: true
  - about: fn-project-memory
    what: each choice of the setup questions is built from one named place in Phoenix memory (a standards folder or one domain shelf), its block's selection; the block is every file the memory tool finds there; a file is taken only when it belongs to the block of an answer given; a file in two blocks is taken once and names both answers
    marked_on_page: true
  - about: fn-project-memory
    what: an answer that selects nothing is named and the rest is built; stop and build nothing when Phoenix memory cannot be reached
    marked_on_page: true
  - about: fn-881
    what: where the type mapping and its record are kept (with the project's settings)
    marked_on_page: true
  - about: fn-881
    what: the one-line meaning of each work-item type
    marked_on_page: true
  - about: fn-881
    what: initialize proposes a stand-in and the product owner's typed yes writes it; 'cannot make' gets a stand-in, 'making failed' stays unmapped
    marked_on_page: true
  - about: fn-883
    what: what one memory block holds and its selection (the place in Phoenix memory where the files for that choice are kept)
    marked_on_page: true
  - about: fn-883
    what: the project's block list (answer, selection, files, fingerprints, Phoenix version), the compare on each initialize run (changed, added, taken out), and a changed block taken in only on a typed yes
    marked_on_page: true
  - about: fn-rerun-initialize
    what: a changed tracker answer sets up the new tracker after a typed yes and leaves the old tracker as it is; where the change record is kept
    marked_on_page: true
  - about: fn-review-rule-groups
    what: changing the review play (/check-change) to read the rule-group record, skip the skipped groups and name them in its own record is a later story of this business intent, outside this feature; the feature's goal, acceptance criteria and fails-if lines are the record's contract with the review
    marked_on_page: true
  - about: fn-883
    what: the brief asks a yes or no per file (a reply to a whole block applies to every file under it); a yes overwrites a changed file and updates its fingerprint, copies an added file in and lists it, removes a taken-out file from the memory and the list; a no leaves the file and its entry as they were
    marked_on_page: true
  - about: fn-rerun-initialize
    what: a question new since the last run is asked as a first run does, with a proposal from the project or Phoenix memory, and marked as new in the brief
    marked_on_page: true
  - about: fn-rerun-initialize
    what: a no to the tracker changes leaves the mapping on the old tracker, the memory and rule-group changes of the other confirmed answers still apply, and the change record shows the tracker part as declined
    marked_on_page: true
  fixed_from_run_2:
    cap-initialize: the proof of the benefit hypothesis split into six sub-bullets, one check each; Garura memory, product profile and stand-in defined beside Phoenix memory, memory block and rule group
    fn-setup-questions: Phoenix memory, brief, short-term memory and product profile defined; the answers are kept in the run's short-term memory and handed to the profile, where a later run finds them; the unreachable-memory rule and its criterion say the Phoenix install must run; shelf line in plain words; every neighbour named by title; each rule given its why; the partial-reply criterion split in two
    fn-project-memory: Garura memory, memory block and product profile defined; the selection rule says each answer selects its block; whys added for the selects-nothing rule, the rerun rule and the origin of each file; the rerun replaces the profile's answers; packed criteria split
    fn-881: tracker, adapter, brief, mapping and stand-in defined; the Spike criterion split into three; the two 'Given that brief' criteria given their own Given; whys added to the all-there, failed-make, play-stops and mapping-place rules
    fn-883: brief and block selection defined; the block list holds each block's selection, so an added file is found by what the selection finds now; the packed criteria split, with a new one for an added file
    fn-rerun-initialize: product profile, memory block, rule group, mapping, stand-in and brief defined at the top; the change record defined and where it is kept marked as ours; the tracker-switch criterion split in two
    fn-review-rule-groups: unchanged (passed run 2; the boundary change does not touch it)
