  playbook: review/tests
  playbook_note: null
  design_bearing: false
  treatment:
    layers:
    - layer-1
    linters:
    - name: ruff
      command: ruff check core/components/plays/discover-capabilities/scripts/test_persist_understand.py
      note: same default-config caveat as executable-code
    - name: check-pr-quality
      command: run by quality-auditor; the pr.md TEST-* rows
    design_grounding: No (review/tests).
    runnable_checks:
    - kind: run-suite
      check: 'Run the suite and confirm it passes; a red suite is a blocker. From the repo root: python3 core/components/plays/discover-capabilities/scripts/test_persist_understand.py
        (exits non-zero when any check fails; prints "N passed, M failed"). Record the counts.

        '
    - kind: by-hand
      check: 'the new test asserts something (slug equals the manifest value; slug sits at position two; a set slug
        is kept); no skipped or disabled test was added

        '
