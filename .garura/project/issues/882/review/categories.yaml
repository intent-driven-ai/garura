categories:
- name: product-model
  what: "The project's own product model: the cap-initialize capability page (\"Initialize a project for Garura\"\
    ), six feature pages (fn-setup-questions, fn-project-memory, fn-review-rule-groups, fn-881, fn-rerun-initialize,\
    \ fn-883), and the spine entries that register them (capability, features, nfr_needs, decisions link, product-profile\
    \ security level). These files state intent, boundaries, rules and acceptance criteria for later plays. They\
    \ are the product's design, written as Markdown/YAML; not framework harness and not the agents' knowledge shelves.\
    \ The spine diff also re-wraps the unrelated cap-718 one_line (formatting only).\n Round 3: fn-project-memory,\
    \ fn-883 and fn-881 were rewritten again (the memory rule that a whole Phoenix file is never taken, and the\
    \ quotes on the sources); the capability page and the spine are as in round 2."
  evidence:
  - .garura/product/product-os/_spine.yaml
  - .garura/product/product-os/software-delivery-planning/initialize/capability.md
  - .garura/product/product-os/software-delivery-planning/initialize/fn-881/feature.md
  - .garura/product/product-os/software-delivery-planning/initialize/fn-883/feature.md
  - .garura/product/product-os/software-delivery-planning/initialize/fn-project-memory/feature.md
  - .garura/product/product-os/software-delivery-planning/initialize/fn-rerun-initialize/feature.md
  - .garura/product/product-os/software-delivery-planning/initialize/fn-review-rule-groups/feature.md
  - .garura/product/product-os/software-delivery-planning/initialize/fn-setup-questions/feature.md
  playbook: null
  playbook_note: 'PLAYBOOK MISSING. No playbook on the review shelf covers the product model. review/memory is the
    nearest (shelf-shaped files agents read, Layers 1 and 2) but it names core/components/ memory, not the product
    model, so it is not force-fitted. A follow-up task to write review/product-model is needed.

    '
  design_bearing: true
  treatment:
    layers:
    - layer-1
    - layer-2
    layer_2_note: "Ground from committed sources only (base ref plan/788/base): docs/adr (026 direct-to-model-writes,\
      \ 048 the-product-model-and-the-work-are-two-layers, 033 approval-in-the-product-model), core/grounding/glossary.md,\
      \ docs/philosophy, and, through the memory tool only, the grounding schemas (capability, feature, _content-standard),\
      \ the spine schema and the domain shelves. Never from the new pages. Conformance questions: does each page\
      \ follow the grounding contract; do the capability's In / Out / Never lines agree with the committed split\
      \ between the Phoenix install, the Garura install and initialize; do the spine nfr_needs, the profile security\
      \ level and the decisions link follow the committed model rules; does the profile move from none to medium\
      \ rest on the accepted decision record (read as the product owner's act, not as grounding for the page). Round\
      \ 1 already grounded this category: the play may reuse round-1 principles only where their committed source\
      \ is on the base ref, and re-check anything the new commits touched.\n Round 3 adds: ground the product owner's\
      \ round-2 rule (from round2/decision.yaml, rule_given) beside ADR 039 Decision 4 and the glossary row for\
      \ Garura memory, check NP-1, NP-2 and NP-4 of round 2 against the pages as they are now, and look for problems\
      \ the fixes brought in. Do not raise the known-open items again."
    linters: []
    linter_note: 'No installed tool checks the product model: .garura/core/tools holds lint-components (skills and
      agents), lint-play (plays), memory and rebuild-eval only. The /discover-capabilities run files (lint.txt,
      lint-spine.txt) are that play''s own output, not a review linter run.

      '
    runnable_checks:
    - kind: by-hand
      check: 'each feature page has, in order, What it does / Inputs / Outputs / Rules & behavior / Acceptance criteria
        / Out of scope, then Sources, then Agent intent (ICE); the capability page has Benefit hypothesis / Boundary
        (In / Out / Never) / Guiding rules / Features / Sources / Agent intent (ICE) (contract: the short-term copies
        of standards/schemas/product-os/grounding/{feature,capability}.md)

        '
    - kind: by-hand
      check: '_spine.yaml parses; cap-initialize.doc and every feature doc path resolve to a changed file; every
        fn-* added has capability cap-initialize and a page; every feature named in capability.md "## Features"
        exists in the spine; the capability''s slug sits right after its id (the slug fix, #887)

        '
    - kind: by-hand
      check: 'the decisions link on cap-initialize names dec-cap-initialize-security-none-medium and that file exists;
        the spine''s cap-initialize nfr_needs.security level and the profile security level (medium) match what
        the decision record says

        '
    - kind: by-hand
      check: confirm the cap-718 one_line re-wrap changed no content
- name: decision-record
  what: "One product-level decision record, now status accepted (accepted_by the product owner): it raises the product's\
    \ security level from none to medium so the box admits cap-initialize, with reason, two alternatives, consequences\
    \ and the files it affects. It is a decision record kept as YAML under the product model's decisions/ folder.\n\
    \ Round 3: the wording that read as not yet accepted (the affects line and the last negative consequence) is\
    \ dropped."
  evidence:
  - .garura/product/product-os/decisions/dec-cap-initialize-security-none-medium.yaml
  playbook: review/adrs
  playbook_note: 'The playbook speaks of Markdown ADRs under docs/adr; this record is YAML under product-os/decisions/,
    which the playbook''s signal "**/decisions/*" covers by content (a status, the context, the decision, the consequences).
    The structural checklist is applied to the YAML fields.

    '
  design_bearing: false
  treatment:
    layers:
    - layer-1
    linters: []
    linter_note: 'Playbook gap, stated by the playbook itself: no ADR linter exists in-repo. The structural check
      is a manual checklist the tool surfaces for the human. The decision''s own run (adr-check.json under _adr/20261025T135102Z)
      records lint_ok true and linked true; that is the record-decision play''s output, not a review linter run,
      and is not counted as one.

      '
    design_grounding: 'No (review/adrs): the decision is the design. The human owns the judgement of whether it
      is right. Its consistency with the spine and the pages is checked under product-model.

      '
    runnable_checks:
    - kind: by-hand
      check: 'required fields are present: id, title, status, level, node_ref, reason (context and decision), alternatives
        (each with why_not), supersedes / amends / superseded_by / amended_by, affects, consequences; the status
        is one of the allowed values (accepted)

        '
    - kind: by-hand
      check: 'the record parses as YAML; the id matches the file name; node_ref is cap-initialize and resolves in
        the spine; the spine links the record back

        '
    - kind: by-hand
      check: 'every file named in "affects" is a changed file or exists; the "ice_impact: none" and "business_intent_check:
        none" claims hold against the diff (no ICE text of an existing capability is changed)

        '
    - kind: by-hand
      check: 'note for the human: the record was proposed first, then accepted, and the spine already showed medium
        before acceptance (the record says so); the commit that accepted it is efffaad5

        '
    - kind: by-hand
      check: confirm the round-3 edit left no line that reads as not yet accepted (no 'pending', no 'if the product
        owner rejects')
- name: executable-code
  what: 'One Python script that is part of the discover-capabilities play: persist_understand.py now sets a capability''s
    slug from the manifest only when the entry has none (a set slug is kept), placing it right after the id. It
    rewrites a dictionary in place and the script writes the project''s spine file, so a data-write path.

    '
  evidence:
  - core/components/plays/discover-capabilities/scripts/persist_understand.py
  playbook: review/code
  playbook_note: 'Matches the playbook''s "python scripts inside plays/skills". The harness category is not raised:
    no SKILL.md, ICE source, skill or agent file changed; the file is a script the runtime executes.

    '
  design_bearing: false
  treatment:
    layers:
    - layer-1
    linters:
    - name: ruff
      command: ruff check core/components/plays/discover-capabilities/scripts/persist_understand.py
      note: 'The repository commits no ruff, pyproject or setup.cfg config, so ruff runs with its defaults. If ruff
        is not installed, record "not installed"; it is not a pass.

        '
    - name: check-pr-quality
      command: 'run by quality-auditor against the diff with the pr.md taxonomy copy (SEC-*, CODE-*, ARCH-*, BE-*,
        PERF-*, DATA-* rows)

        '
    - name: lint-components
      command: node .garura/core/tools/lint-components/index.js --layout source --target core/components
      note: 'Source layout, because the changed path is under core/components. It checks skills and agents; it is
        run so that the changed script folder is covered. Only a violation whose file is a changed path is a finding;
        count the others as "there before".

        '
    design_grounding: 'No (review/code): the standard is industry best practice plus the pr.md taxonomy.

      '
    runnable_checks:
    - kind: by-hand
      check: 'data-safety path: the slug is inserted by clearing and rebuilding the live capability mapping in order;
        confirm no other key is lost or reordered, an existing slug is never overwritten, and a manifest with no
        slug leaves the entry untouched

        '
    - kind: by-hand
      check: no stray debug output, no secrets, no broad except added
