- id: PM-4
  severity: P3
  category: product-model
  sources:
  - 'origin/plan/788/base:core/components/memory/standards/schemas/product-os/spine.yaml lines 159-187; origin/plan/788/base:docs/adr/039-...
    lines 35-46; GitHub #862 Done-when (''the profile records them'')'
  basis: G6 / G2 -- the committed `profile` is the box (stage, users, surfaces, nfr, compliance, quality_vision); a person's
    answers are kept in short-term memory and move up only by a promotion; no committed schema holds a record of setup answers,
    a rule-group record, a tracker mapping or a block list.
  finding: 'The pages use ''product profile'' for a new lasting record of setup answers, which the committed term does not
    mean, and place four new records (answers, rule-group record, mapping, block list) in places no committed schema or ADR
    defines. The pages mark most of these ''our default; the sources do not say'', and the product owner''s own #862 says
    ''the profile records them'', so this is a grounding gap, not a contradiction. It also overlaps the box''s `surfaces`
    field.'
  fix: Before build, agree the home and shape of these records (a schema addition or an ADR), and pick a name that is not
    'profile' or define the term in the glossary.
  file: capability.md line 16 and the six feature pages (every use of 'product profile', 'the rule-group record kept in the
    product profile', 'the change record ... beside the mapping', 'the mapping ... in the project's settings')
- id: PM-5
  severity: P3
  category: product-model
  sources:
  - origin/plan/788/base:core/components/memory/standards/schemas/product-os/decision.yaml lines 22, 40-43, 51, 58-59, 65-71
  basis: G5 -- a decision is `accepted` only on a person's word; the schema holds that person in `metadata.accepted_by`, and
    the issue or run in `decided_in`, and `consequences`.
  finding: 'The record says `status: accepted` but has no `accepted_by`, `decided_in`, `consequences`, `ice_impact` or `business_intent_check`;
    its only person link is `decided_by: /discover-capabilities` (the play). The PR body says the product owner approved at
    the checkpoint (''yes'', 2026-10-25), so the acceptance happened; the record does not show it. The schema allows a play-written
    record to carry fewer fields until /record-decision accepts it.'
  fix: 'Add `accepted_by` (the role, not a name), `decided_in: 882`, and consequences, or leave the status `proposed` until
    /record-decision accepts it.'
  file: .garura/product/product-os/decisions/dec-cap-initialize-security-none-medium.yaml
- id: PM-6
  severity: P3
  category: product-model
  sources:
  - origin/plan/788/base:core/components/memory/standards/schemas/product-os/grounding/feature.md lines 31-32; the sibling
    page fn-review-rule-groups/feature.md Out of scope (the change to the review is 'a later story ... outside this feature')
  basis: G7 -- a page names the neighbour that owns each thing it leaves out; and consistency with the sibling page that does
    the same job.
  finding: 'An acceptance criterion and a ''Fails if'' make initialize responsible for how other plays (/shape-plan and the
    filing plays) behave when a type is missing and not mapped. That is a change to those plays, and the page''s Out of scope
    only says that filing is theirs. fn-review-rule-groups handles the same situation correctly by naming the later story
    that owns the review change. Without this, nothing owns the plays'' ''stop and point to initialize'' behaviour that #881
    asks for.'
  fix: State in fn-881's Out of scope which later story changes the filing plays to read the mapping and stop with the message,
    and move that criterion to it (or mark it as checked only once that story lands).
  file: .garura/product/product-os/software-delivery-planning/initialize/fn-881/feature.md (line 49, acceptance; ICE 'Fails
    if' last line) and capability.md line 62
