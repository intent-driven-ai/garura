- id: PM-9
  severity: P4
  category: product-model
  sources:
  - 'GitHub #883 (steps 1-3; ''Not planned yet''; ''this story replaces [ADR 038''s download on first use] with the Phoenix
    install''); origin/plan/788/base:docs/adr/038-install-brings-no-memory.md lines 30-37; origin/plan/788/base:core/grounding/glossary.md
    lines 38, 163'
  basis: G3 -- the product owner's three-step memory rule (Phoenix install once per machine, then Garura install, then initialize).
  finding: 'KNOWN, NOT A NEW DEFECT. ADR 038 Decision 2 (and glossary rows 38 and 163) say the memory tool downloads Phoenix
