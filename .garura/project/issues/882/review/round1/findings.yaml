findings:
- id: PM-1
  severity: P1
  category: product-model
  sources:
  - 'origin/plan/788/base:core/grounding/glossary.md line 37; origin/plan/788/base:docs/adr/039-memory-writes-go-to-short-term-memory-plays-read-no-memory.md
    lines 66-72 (the product owner: ''You don''t need to copy the entire file. You only need to bring in the context which
    is relevant to the checkout part of the commerce ... It should not copy the file.'')'
  basis: G1 -- Garura memory is built from only the part of Phoenix memory the project needs, never a copy of a Phoenix file.
  finding: 'The pages define a memory block as ''every file the memory tool finds in a place'' and have initialize place those
    files in the project''s Garura memory, overwrite the project''s copy of a changed file, and copy an added file. That is
    a file copy of Phoenix memory into Garura memory. The pages also say the sources ''do not say what a block holds'' (fn-project-memory
    line 19, fn-883 line 4), but ADR 039 Decision 4 and the glossary do say it: part of a file, not the file.'
  fix: Re-state a block as the relevant part of Phoenix memory (down to the part of a file a project needs), or take the decision
    to the product owner and record an amendment to ADR 039 Decision 4 first. Remove the claim that the sources are silent
    on this.
  file: .garura/product/product-os/software-delivery-planning/initialize/fn-project-memory/feature.md (lines 19, 28); also
    fn-883/feature.md (line 24, the 'overwrites the project's copy' and 'copies it into' rules) and the capability's wording
    'memory blocks' as 'the set of Phoenix memory files'
  reclassed_by: 'human (product owner, at the gate): ''pm-1 is actually a p1. fix it'''
