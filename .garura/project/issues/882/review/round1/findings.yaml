  fix: Land the planned ADR 038 amendment (and the glossary rows) before initialize is built. No change to these pages.
  file: capability.md Boundary 'Out' bullets, fn-setup-questions/feature.md, fn-project-memory/feature.md, fn-883/feature.md
    (every 'the Phoenix install must run on this machine' message and 'the Phoenix install laid')
