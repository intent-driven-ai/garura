grounded_principles:
  - id: G1
    principle: "Garura memory is built from only the part of Phoenix memory a project needs, by initialize -- never a copy of a Phoenix file. The memory tool reads Phoenix memory and does not copy a file from it."
    sources:
      - "origin/plan/788/base:core/grounding/glossary.md line 37 (Garura memory row: 'never a copy of a Phoenix file'; 'NOT: a copy of Phoenix memory -- checkout, not all of commerce')"
      - "origin/plan/788/base:docs/adr/039-memory-writes-go-to-short-term-memory-plays-read-no-memory.md lines 46-50 (Decision 4, with the product owner's words)"
  - id: G3
    principle: "Memory reaches a project in three steps: the Phoenix install once per machine; the Garura install lays only the pieces and no memory; initialize asks the questions, sets up the project's memory, and can run again. An unreachable tier (tier_missing) is said, never read as 'nothing found'."
    sources:
      - "GitHub #883 (steps 1-3, Done when)"
      - "GitHub #862 (Rules 1-3, Done when)"
      - "the product owner's memory rule (dispatch)"
      - ".claude/rules/garura-memory.md (tier_missing)"
  - id: G4
    principle: "A capability spine entry carries id, slug (right after the id), domain, intents, status, detail, one_line, doc, nfr_needs, compliance_needs, decisions."
    sources:
      - "origin/plan/788/base:core/components/memory/standards/schemas/product-os/spine.yaml lines 58-96"
  - id: G5
    principle: "A decision record carries metadata.accepted_by (the person who accepted it), metadata.decided_in, consequences, ice_impact and business_intent_check; accepted only on a person's word; a box move is a product-level decision accepted by a human."
    sources:
      - "origin/plan/788/base:core/components/memory/standards/schemas/product-os/decision.yaml lines 11-43 and fill_rules lines 44-55"
  - id: G6
    principle: "Two layers. The product layer is the model; only the Business Intent is a product-layer tracker issue, labelled product. The work layer is tracker issues labelled work-item: Epic, Story, Spike, Chore and Bug."
    sources:
      - "origin/plan/788/base:docs/adr/048-the-product-model-and-the-work-are-two-layers.md lines 21-23 (Decision 1)"
  - id: G7
    principle: "Grounding pages follow the contract and the content bar: required headings in order, each item self-explaining and discrete, links resolve, a page names the neighbour that owns what it leaves out."
    sources:
      - "origin/plan/788/base:core/components/memory/standards/schemas/product-os/grounding/{capability,feature,_content-standard}.md (read as the short-term copies the assessment made)"

