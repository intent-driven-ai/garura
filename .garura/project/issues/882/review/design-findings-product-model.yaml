# 1. Round-2 findings the product owner asked to be fixed
# ------------------------------------------------------------------------------------------------
round2_fixes:
  - id: NP-1
    round2_severity: P2
    verdict: fixed
    basis: "G1, G2"
    evidence:
      - "The hole is closed. The phrase 'or all of its sections when every one speaks to the answer' is gone from every page. fn-project-memory line 7 (and fn-883 line 8) now define a part: 'the sections of that file that speak to the answer, as initialize reads them through the memory tool. The project's memory is built from a part; a part is never taken into the project as it is.'"
      - "fn-project-memory line 23 (and fn-883 line 11): 'Initialize never takes a whole Phoenix file into the project, even when every section of it speaks to the answer: it reads the file through the memory tool and builds the project's own memory from what it read, written for the project and never a copy.' This is the rule the product owner gave (G2), and it agrees with G1."
      - "The page no longer allows in one line what it forbids in two others. Acceptance line 41 ('no file in the project's Garura memory is a copy of a whole Phoenix file') and the ICE Fails-if (line 72: 'holds a whole Phoenix file, or a part of Phoenix memory the answers did not select') now stand with line 7 and line 23. The Java case that was the conflict is now its own criterion, line 42: 'Given a Java answer and a Phoenix standards file whose every section speaks to Java, ... then the project's Garura memory holds what was built from that file and no copy of it.' Line 37 asks for the Java standards 'built from the files the memory tool lists for them and not a copy of any of those files'."
      - "Line 24 now says a selection (a standards folder, one shelf, one part of a shelf) is 'where initialize looks, never what it takes into the project', so a folder as a selection no longer reads as a folder copied in."
      - "fn-883 carries the same rule through a re-run: line 15 ('A re-run rebuilds the relevant part; it never copies the new Phoenix file'), rules at lines 33-35 ('it never copies the changed Phoenix file'; 'never a copy of the Phoenix file'), acceptance line 54 ('no whole Phoenix file is in the project's Garura memory'), ICE line 86. fn-rerun-initialize line 8 and capability.md lines 8, 31, 57, 66 (unchanged) agree."
      - "The capability page (unchanged since round 2) and both feature pages now say one thing about a whole file, and it matches G1 and G2."
    residual: "NP-5 (P4), about how the rule is cited, not about what it says."
  - id: NP-2
    round2_severity: P4
    verdict: fixed
    basis: "G6, G7"
    evidence:
      - "fn-881 Sources, line 66 now reads: 'ADR 048, Decision 1 (the product model and the work are two layers): \"Only the Business Intent is a product-layer tracker issue, labelled `product`.\"; \"The **work layer** is tracker issues labelled `work-item`: Epic, Story, Spike, Chore and Bug.\"' Both quotes match the base-ref text word for word (ADR 048 lines 32-33). The pointer to the review of the pull request is gone from fn-881."
  - id: NP-4
    round2_severity: P4
    verdict: fixed
    basis: "G5"
    evidence:
      - "dec-cap-initialize-security-none-medium.yaml, affects, first item now reads: 'profile.nfr.security (level medium and its gate), written by the /discover-capabilities save script and made durable by this decision'. The words 'pending this decision' are gone."
      - "consequences.negative now holds two lines: the product 'now commits to a medium security level with a gate that must be run ...', and 'A later capability whose security need is medium or below now fits the box with no stop for the product owner.' The line 'if the product owner rejects it, the profile's security line must be taken back out' is gone. No line reads as not yet accepted: status is accepted, metadata.accepted_by is 'the product owner', decided_in 882, date '2026-10-25'."
    note: "The accepted record was edited after the commit that accepted it (efffaad5, then ab27f8b1). G5 says accepted decisions are not edited, but the record is new on this branch (it is not on the base ref), the edit is the one round 2 asked for, and the PR lands the record once in its final wording. Noted for the human; not a finding."

