grounded_principles:
  - id: G1
    principle: "Garura memory is built from only the part of Phoenix memory a project needs, by initialize -- never a copy of a Phoenix file. The memory tool reads Phoenix memory and does not copy a file from it."
    sources:
      - "origin/plan/788/base:docs/adr/039-memory-writes-go-to-short-term-memory-plays-read-no-memory.md lines 66-72 (Decision 4: 'The tool reads Phoenix memory. It does not copy a file from it into the project.'; 'A project's Garura memory is built separately, from only the part the project needs: by `initialize`, and by promotion.'; the product owner's words in the same decision: 'You don't need to copy the entire file ... It should not copy the file.')"
      - "origin/plan/788/base:core/grounding/glossary.md line 37 (Garura memory row: 'never a copy of a Phoenix file'; 'NOT: a copy of Phoenix memory -- checkout, not all of commerce')"
  - id: G2
    principle: "The product owner's round-2 rule: never take the whole file; read it, and build the project's memory. A fully relevant Phoenix file is still read and built for the project, never copied whole."
    sources:
      - "round2/decision.yaml, rule_given (the product owner's act on round 2, not a page of this branch)"
      - "the dispatch for this round, quoting it: 'never take the whole file. read it, and build project's memory'"
    note: "G2 only settles what G1 left open in round 2 (whether a wholly relevant file may be taken whole). It is the product owner's own word, so it is grounding for the rule; it is not a committed record yet, which is why the pages that restate it should rest on G1 as well (see NP-5)."
  - id: G3
    principle: "Memory reaches a project in three steps: the Phoenix install once per machine; the Garura install lays only the pieces and no memory; initialize asks the questions, sets up the project's memory, and can run again. An unreachable tier (tier_missing) is said, never read as 'nothing found'."
    sources:
      - "GitHub #883 (steps 1-3, Done when)"
      - "GitHub #862 (Rules 1-3, Done when)"
      - ".claude/rules/garura-memory.md (tier_missing)"
  - id: G4
    principle: "A capability spine entry carries id, slug (right after the id), domain, intents, status, detail, one_line, doc, nfr_needs, compliance_needs, decisions."
    sources:
      - "origin/plan/788/base:core/components/memory/standards/schemas/product-os/spine.yaml"
  - id: G5
    principle: "A decision record carries metadata.accepted_by (the person who accepted it), metadata.decided_in, consequences, ice_impact and business_intent_check; accepted only on a person's word. Accepted decisions are not edited after acceptance."
    sources:
      - "origin/plan/788/base:core/components/memory/standards/schemas/product-os/decision.yaml (header lines 1-5, the decision block, 'immutability', and fill_rules)"
  - id: G6
    principle: "Two layers. The work layer is tracker issues labelled work-item: Epic, Story, Spike, Chore and Bug. Only the Business Intent is a product-layer tracker issue, labelled product."
    sources:
      - "origin/plan/788/base:docs/adr/048-the-product-model-and-the-work-are-two-layers.md lines 32-33 (Decision 1)"
  - id: G7
    principle: "Grounding pages follow the contract and the content bar: required headings in order; each item self-explaining and discrete; acceptance criteria in Given / When / Then, concrete and testable; links resolve; a Sources line names the place and its words in quotes; a cold reader can follow it (the stranger test)."
    sources:
      - "origin/plan/788/base:core/components/memory/standards/schemas/product-os/grounding/feature.md ('Sources' section: 'the place and its words'; 'Acceptance criteria')"
      - "origin/plan/788/base:core/components/memory/standards/schemas/product-os/grounding/_content-standard.md (bars 1, 2, 5), read as the short-term copies the assessment made (context/memory/standards/schemas/product-os/grounding/)"

