round1_fixes:
  - id: PM-1
    round1_severity: P2
    owner_severity: P1
    verdict: fixed
    one_residual: "NP-1 (below) -- a hole in the new definition of a 'part', not a return of the file copy"
    evidence:
      - "capability.md line 15 now defines a block as 'the relevant part of Phoenix memory that one setup answer selects, down to the part of a file: for example only the checkout part of the commerce knowledge ...' and Garura memory as 'built from only the part of Phoenix memory the project needs and is never a copy of a Phoenix file'."
      - "capability.md line 31 (Guiding rule): 'The project's memory is built, never copied ... writes into the project only the part each answer selects, down to the part of a file, and never a whole Phoenix file ... When Phoenix memory changes, a re-run rebuilds the relevant part from it; it does not copy the new file.'"
      - "fn-project-memory line 23: 'Initialize never copies a Phoenix file.' Line 40 (acceptance): 'a checkout answer and a commerce knowledge file ... that also holds catalog, cart and orders ... then the project's Garura memory holds the checkout part and none of the rest of that file.' Line 41: 'no file in the project's Garura memory is a copy of a whole Phoenix file.' Line 70 (Fails if): 'holds a whole Phoenix file, or a part of Phoenix memory the answers did not select.'"
