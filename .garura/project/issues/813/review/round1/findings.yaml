# check-change Step 4 -- consolidated findings, PR #834.
findings:
- category: harness
  severity: P2
  path: core/components/plays/install-garura/scripts/migrate_model.py
  basis: G4
  message: 'No check that the model folder is inside the project. With product.base-path set outside the project
    (tested: ../out/) in a git repo, migrate() dies with an uncaught RuntimeError (''is outside repository'') because
    run() catches only Refused; install.py then aborts after laying everything. In a non-git target the same path
    would be rewritten outside the project. Contain the path and turn any git failure into a report.'
  status: open
- category: harness
  severity: P2
  path: core/components/plays/install-garura/scripts/install.py
  basis: G1, G2, G5
  message: 'The install now rewrites and commits the product model (Garura memory) in the user''s repo. No committed
    decision authorises an install-time writer: ADR 039 says the model is written by a play built for it, ADR 048
    does not mention migration, and decisions.md Q4 covers only the guard. ADR 038 itself holds (no memory brought).
    Record the migration in an ADR (048 addendum or 050) before merge.'
  status: open
- category: harness
  severity: P3
  path: core/components/plays/install-garura/SKILL.md
  basis: G3
  message: install-garura now makes a commit in the project, but its SKILL.md (unchanged; no ICE source exists)
    never says so. Add a line saying the install moves an old model and makes one commit; direct edit, no rebuild.
  status: open
- category: harness
  severity: P3
  path: core/components/plays/install-garura/scripts/migrate_model.py
  basis: G4
  message: 'If a git step fails after files were moved (tested: a failing pre-commit hook), the tree is left moved
    and the index staged, and the report says ''the commit failed: '' with an empty reason. Safe, but half-done
    work with no hint how to finish or undo.'
  status: open
- category: harness
  severity: P4
  path: core/components/plays/discover-domains/scripts/check_kept.py
  basis: '#813 decision Q4 (every script that loads the model gets the guard)'
  message: Reads model pages by name (feature.md) through git diff and has no guard; on an old model it sees no
    pages and says nothing. Low risk; the other discover-domains scripts are guarded.
  status: open
- category: harness
  severity: P4
  path: core/components/plays/discover-capabilities/scripts/check_sources.py
  basis: '#813 decision Q4'
  message: Reads feature.md pages named by a run manifest; unguarded. Same low risk as above.
  status: open
- category: adrs
  severity: P4
  path: docs/adr/050-the-retired-intent-epic-pipeline-is-deleted.md
  basis: plan/788/base:docs/adr/035 and 017 status lines
  message: 'Header says ''Supersedes: ADR 035 (in part)'' but ADR 035''s status line says ''amended in part''; ADR
    017 is ''Amends''. Use one word.'
  status: open
- category: memory
  severity: P4
  path: core/components/memory/standards/rules/rename-map.yaml
  basis: G3
  message: Six old-name entries for the deleted skills removed, so the old-name check no longer knows those names.
    ADR 050 lists this under Risks; accepted.
  status: accepted
- category: memory
  severity: P4
  path: core/components/skills/check-abstraction-layer/SKILL.md
  basis: ADR 050 Negative/Risks
  message: Deprecated skills (check-abstraction-layer, check-kb-extension, infer-research and others) still link
    to deleted rules (product.md Rule 14, kb-extension.md). Dead links in deprecated files only; their own issue
    per decision Q2.
  status: 'deferred: own issue'
- category: memory
  severity: P4
  path: core/components/memory/standards/rules/user-questions.md
  basis: G1
  message: Drops base Rule 12's pointer to validate-intent-epics and to Rule 11; the replacement ('a check ... reports
    uncaptured_inference', inference defined inline) keeps the meaning. No action.
  status: ok
