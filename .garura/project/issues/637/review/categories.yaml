categories:
  - id: harness
    playbook: review/harness
    design_bearing: true
    path_count: 8
    summary: "The /intent and /vision plays are rewritten so both write the one product model and neither waits for the other: /vision now starts from the business intents /intent saved (and/or a goal), grows what the model already holds, places holding-folder capabilities under a domain, and links every part to its intents both ways; /intent now places a capability under its domain when something shows it. The two author skills and the product-os-keeper agent row change to match; vision gains a fourth stop-condition clause (D4, what was there was kept)."
    evidence:
      - core/components/agents/product-os-keeper.md
      - core/components/plays/intent/SKILL.md
      - core/components/plays/intent/reference/ice.md
      - core/components/plays/vision/SKILL.md
      - core/components/plays/vision/reference/ice.md
      - core/components/plays/vision/stop-condition.yaml
      - core/components/skills/author-business-intent/SKILL.md
      - core/components/skills/author-vision-seed/SKILL.md
    notes: "Intent change to both plays (ICE ice.md plus compiled SKILL.md plus stop-condition.yaml for vision), so check that each SKILL.md change traces to its ice.md and that the stop-condition D4 matches the ICE Done means (lint_play.py, lint-components). Layer 2 applies: ground only in committed base-ref sources (ADR 031, ADR 026, docs/philosophy, standards rules such as no-unbacked-recommendation and play-close, the base-ref versions of intent/vision ice.md), never in the branch's own ice.md, design.md or plan.md edits. D4 must be meaningful, not cosmetic. The skills and agent are harness too (agent holds context crafting; skills do the writing)."
  - id: memory
    playbook: review/memory
    design_bearing: true
    path_count: 5
    summary: "The product-os ontology moves to v4 and its schemas change: the spine gains a domain 'detail' stage (directional or detailed) and an 'intents' link on domains, the domain and capability grounding templates are reshaped, the functionality template gains a section, and the capability carries its agent intent in one named section."
    evidence:
      - core/components/memory/standards/schemas/product-os/grounding/capability.md
      - core/components/memory/standards/schemas/product-os/grounding/domain.md
      - core/components/memory/standards/schemas/product-os/grounding/functionality.md
      - core/components/memory/standards/schemas/product-os/ontology.md
      - core/components/memory/standards/schemas/product-os/spine.yaml
    notes: "Standards schemas are memory the agents read, so Layer 1 (structure, cross-references, version consistency across ontology.md and spine.yaml) and Layer 2 both apply. Ground in the base-ref ontology v3, ADR 031 (no play owns a kind; a capability may exist before its domain) and the base-ref schema files via git show main:path; never in design.md (branch-added). Check the changed schema stays consistent with the linters in the plays that read it (lint_grounding.py)."
