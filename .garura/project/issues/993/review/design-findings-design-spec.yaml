    severity: P4
    file: .garura/project/issues/720/specs/design.md
    what: "Stands from round 2. The added paragraph ends with a note of origin, '(Found by the review of PR #995, finding F1, 2026-10-30.)'. F1 lives in a review run record and the PR, not where a later reader of the design will look, and the design's header still records only the one approval and the two rounds. A short line in the header (an amendment date and the reason) would keep the history in the design; the origin note could then go. The commit subjects carry no body that gives the reason either."
    basis: "G3: git show plan/717/base:.garura/project/issues/720/specs/design.md (the header records approval and rounds, so amendments belong there); docs/adr/060 (decision changes carry the reason in the record itself)."
