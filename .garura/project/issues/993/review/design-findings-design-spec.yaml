  grounding_available: true
  principles:
    - id: G1
      principle: "The approved design says what is written, and where, in its own words. In the base text the no-write rule is scoped: 'Nothing is written to GitHub, the model or the plan file during the session.' The session starts after the play is on the plan's branch."
      source: "git show plan/717/base:.garura/project/issues/720/specs/design.md, sections 'The session' and 'How it starts'"
    - id: G2
      principle: "The base design already requires the main-first cut: whenever a plan's branch is cut (and /update-plan on a plan with no branch is named), main's plan file is set to In Progress with the branch named, committed on main, and the branch is cut from that commit. The base design also keeps a running list in the plan's short-term memory, and 'Rejected' leaves the list in short-term memory."
      source: "git show plan/717/base:.garura/project/issues/720/specs/design.md, sections 'Which copy of a plan counts', 'How it starts', 'The session', 'How it ends'"
    - id: G3
      principle: "The design header records its own approval and rounds, so an amendment and its reason belong in the design's record, where the next reader will look. A changed approved piece needs a person's approval; here the owner's instruction of 2026-10-30 to fix all moderate and medium findings covers an edit that only names what the base already required."
      source: "git show plan/717/base:.garura/project/issues/720/specs/design.md, first lines; docs/adr/033; docs/adr/060"
