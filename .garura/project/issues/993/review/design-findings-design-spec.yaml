round_2_follow_up:
  D1:
    status: resolved
    check: "The paragraph and the constraint both say 'GitHub, the model or a plan file', name the branch step for a plan with no branch as the only exception, and the paragraph says the running list in short-term memory is not such a write. This matches the base scope and the base running list. The wording is 'before approved' where the base says 'during the session'; the only write that falls in the gap (the main-first cut in 'How it starts') is the very step the exception names, so nothing is contradicted."
  D2:
    status: resolved
    check: "The clause 'not a change the person approves' is gone. The three steps now named (main's plan file to In Progress with the branch named, commit on main, cut the branch) are the steps the base text already requires in 'Which copy of a plan counts' and 'How it starts'. The edit only names what the base already required, so it needs no new approval beyond the owner's instruction."
findings:
