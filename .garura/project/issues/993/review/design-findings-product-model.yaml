grounding:
  - id: G1
    principle: "The approved #720 design is the stated source of the change. cap-720 and fn-730 must say what it says: nothing written before a plain 'approved'; works on the plan's own branch; cuts a branch only when the plan has none (main's plan file first); agreement of plan file, GitHub and model; nothing beyond the approved list changes."
    source: "git show plan/717/base:.garura/project/issues/720/specs/design.md (committed on the base by commit c004b9ed, 'plan 717 - #720 design approved'; it is not among this branch's additions)"
  - id: G2
    principle: "The tracker issue texts of #720 and #730 hold the same ICE and the same one-line title that the pages and spine must carry (read only)."
    source: "GitHub issues #720 and #730 (read only, titles and bodies)"
  - id: G3
    principle: "The one-line in the spine and the titles in the plan file agree with the issue titles."
    source: "plan/717/base:.garura/project/plans/717.yaml (base titles) against the issue titles; GitHub issues #720, #730, #994"
  - id: G4
    principle: "Capability page (directional stage): headings 'Directional intent' then 'Agent intent (ICE)' last; ICE lines start with Goal/Limit/Fails if/Context/Checked by/Quality need, at least one Goal, each line at least five words. Feature page: heading contract What it does / Inputs-Outputs / Rules & behavior / Acceptance criteria / Out of scope, then ICE last. Content bar: self-explaining (the why), discrete points, depth grows with tree depth."
    source: "base-ref core/components/memory/standards/schemas/product-os/grounding/capability.md, grounding/feature.md, grounding/_content-standard.md (and the same files read through the memory tool, --issue 993, copied under grounding-product-model/)"
  - id: G5
    principle: "Spine entry shape: one_line is a descriptor; metadata may hold updated_by (free text); the spine is the structured map and a play-owned script changes shared files."
    source: "memory tool: standards/schemas/product-os/spine.yaml (copied); base-ref _spine.yaml precedent: fn-729 and fn-628 carry metadata.updated_by as a change name"
  - id: G6
    principle: "Model pages are written for a business reader in plain words, personas not real names."
    source: "base-ref core/components/memory/standards/schemas/product-os/ontology.md ('written for a business reader, in plain words'); the model-page rule in the product owner's saved instructions"
  - id: G7
    principle: "The product ICE is its own node (ice.md, three parts Intent/Context/Expectation) in the current ontology; Garura's own model has not moved yet (#765 not built)."
    source: "git show plan/717/base:core/components/memory/standards/schemas/product-os/ontology.md (version 13, kind ICE and its 'Built / Not built yet' line); docs/adr/047-the-ice-is-its-own-node.md; docs/adr/052-shape-slice-writes-the-hidden-file-and-proposes-a-thin-ice.md. Note: the Phoenix memory copy of the ontology the tool returned is version 4 (stale next to the repo's version 13), so G7 rests on the base-ref file, not the memory-tool copy."
  - id: G8
    principle: "The model changes only through a sub-agent and its skills; model writes go to the live model, a keyed script owns shared files such as the spine."
    source: "memory tool: standards/rules/direct-model-write.md (copied); issue #993 text. Whether the change was made that way is a process fact, not visible in the diff content; the run records (model-lines/*.json) are the work-records category's."

checks_passed:
  - "cap-720 capability.md: the four ICE lines (Goal, Limit, Fails if, Checked by) are character-for-character the ICE in issue #720 and match the #720 design (checked by script, 4 of 4 lines)."
  - "fn-730 feature.md: the four ICE lines are character-for-character the ICE in issue #730 (4 of 4); 'What it does' carries the #730 text (only the 'Functionality:' lead-in is dropped and '#909 is folded in here' is shortened to '#909 folded in')."
  - "Only the lines the issue #993 names changed on the two pages: the H1, the directional intent / what it does, and the four ICE lines on each. The Agent intent heading, the headings, and the blank-line layout are untouched (git diff, six hunks of -4/+4 style)."
  - "Spine: with one_line and metadata removed from the two entries, the whole spine equals the base spine (parsed and compared). The only changes are cap-720 and fn-730 one_line, and a new metadata.updated_by on each. The doc pointers and issue links are unchanged and resolve to real pages."
  - "Spine one_line for #720 and #730 equals the issue titles and the plan 717 titles exactly (parsed and compared, folded YAML string included). The new #994 plan entry title equals the #994 issue title."
  - "_spine.yaml parses as YAML; both pages exist at the doc paths."
  - "No real name, no home path, no organisation name in any added line of the four product-model files and the plan file (grep)."
  - "lint_grounding.py (discover-capabilities copy) on cap-720: ok, 0 errors, 0 warnings, same as base. Whole-model run: 74 errors / 8 warnings with the branch; the fn-730 and cap-720 lines are the same as on the base (see F4)."
  - "No design content comes from the branch's own specs/design.md; the one design cited (#720) is on the base ref."

findings:
  - id: F1
    severity: P3
    file: .garura/product/product-os/capabilities/cap-720/capability.md
    also_in: ".garura/product/product-os/features/fn-730/feature.md"
    what: "The Limit of both pages says 'Nothing is written before a plain approved', and cap-720 'Fails if' says 'a plan is changed anywhere but on its own branch'. Yet both pages also let the play cut a missing plan branch first, and that step (main's plan file set to In Progress with the branch named, committed on main, then the cut) happens when the session starts, before any approval and on main. The sentence is absolute, and the exception is not tied to it. A builder or the compare check reading the Limit literally gets a rule the play must break to start a branch-less plan."
    basis:
      principle: "A Limit is a line that must not be crossed and must not contradict the play's own described behaviour (ICE contract: Limit; Fails if)."
      sources:
        - "plan/717/base:.garura/project/issues/720/specs/design.md - 'Which copy of a plan counts' and 'How it starts' put the main-first commit and the cut at the start; 'The session' says nothing is written to GitHub, the model or the plan file during the session; the design is itself loose on the main-first write."
        - "plan/717/base:core/components/memory/standards/schemas/product-os/grounding/capability.md - the ICE section is the short fixed form an agent works from."
    note: "The pages are faithful to the approved design and to the issue texts of #720 and #730 (same wording), so the gap sits in the source. Fix belongs at the source: say that the one pre-approval write is the main-first plan-file commit and the cut, in the design, the two issues and the two pages together. Not a block for this change: it is the approved wording."

  - id: F2
    severity: P4
    file: .garura/product/product-os/capabilities/cap-720/capability.md
    what: "The new 'Directional intent' is one long run-on sentence of about 90 words with a colon list, and it says what the capability does but not why it matters. The capability template asks for what it is about, its rough scope and why it matters, and the content bar asks for discrete, self-explaining points. The base text was short and also gave no 'why', so this is not new, but the rewrite did not close it."
    basis:
      principle: "Content bar 1 (self-explaining, with the why) and 2 (discrete, not narrative); capability template 'Directional intent'."
      sources:
        - "memory tool: standards/schemas/product-os/grounding/_content-standard.md and grounding/capability.md (copied); same files on plan/717/base"
    note: "Wording is the issue #720 body, so the change did what was asked. Suggest the next edit of this line adds one sentence of why (plans drift when the file, the tracker and the model change apart)."

  - id: F3
    severity: P4
    file: .garura/product/product-os/features/fn-730/feature.md
    what: "The page title uses a dash ('The /update-plan session - instructions, checks, one approval, one landing on the plan's branch') while the spine one_line, the plan 717 title and the #730 issue title use a colon. On base the page title was identical to the one_line; now it differs by one character. The check 'spine one_line matches the page title' therefore reads as a near miss. The capability page is fine (its title is the part of the one_line before the colon, as on base)."
    basis:
      principle: "Spine one_line and the page title name the same thing in the same words; links and titles in the model agree with the tracker titles."
      sources:
        - "plan/717/base: .garura/product/product-os/features/fn-730/feature.md (H1 equal to the spine one_line) against .garura/product/product-os/_spine.yaml"
        - "GitHub issue #730 title (read only)"

  - id: F4
    severity: P4
    file: .garura/product/product-os/features/fn-730/feature.md
    what: "There before, not changed by this PR: the feature page holds only 'What it does' and the ICE. It lacks the required feature sections (Inputs / Outputs, Rules & behavior, Acceptance criteria, Out of scope), so lint_grounding.py gives 4 errors on it, the same 4 on the base file. It is also leaner than its capability page (depth gradient), and its spine entry has no thin mark (fn-729 and fn-628 carry thin: true). The PR did not make this worse."
    basis:
      principle: "A feature is the most detailed level, never leaner than its parent; the heading contract; a thin page carries the thin mark (ADR 052)."
      sources:
        - "plan/717/base: core/components/memory/standards/schemas/product-os/grounding/feature.md and grounding/_content-standard.md"
        - "plan/717/base: docs/adr/052-shape-slice-writes-the-hidden-file-and-proposes-a-thin-ice.md"
    note: "Out of scope for #993 (it changes named lines only, by design). Belongs to #931 / the thin-page path. Listed so it is not mistaken for something this PR introduced."

  - id: F5
    severity: P4
    file: .garura/product/product-os/capabilities/cap-720/capability.md
    also_in: ".garura/product/product-os/features/fn-730/feature.md"
    what: "There before, not changed by this PR: both pages keep the ICE inline as an 'Agent intent (ICE)' section with the old labels (Goal, Limit, Fails if, Checked by). The ontology on the base (version 13) and ADR 047 make the ICE its own page with three parts. The PR follows the model as it stands (Garura's own model has not moved, #765 not built), so it conforms to the as-built state. The ICE lines it rewrites will have to move again in #765."
    basis:
      principle: "The product ICE is its own node (ontology v13, kind ICE; ADR 047); until the move, pages keep the inline section (ontology v13 'Not built yet' line)."
      sources:
        - "plan/717/base: core/components/memory/standards/schemas/product-os/ontology.md (version 13)"
        - "plan/717/base: docs/adr/047-the-ice-is-its-own-node.md"

