findings:
- id: QF-03
  category: code-and-tests
  severity: P4
  file: core/components/skills/enrich-grounding/scripts/change_lines.py
  what: 'Round 1''s QF-03 stands only in part. A rerun of the same request is now safe. Still open: one request that lists
    the same {after, add} twice adds the line twice (run: A / B request with two identical adds put the line on the page two
    times). The idempotence check looks only at the lines already on the page, not at the other adds of the same request.

    '
  basis: 'Rubric: idempotency on write paths. Down from P3 to P4: the retry case is fixed; this needs a request with a repeated
    entry, which the agent writes.'
  source: quality-findings.yaml
- id: QF-05
  category: code-and-tests
  severity: P4
  file: core/components/skills/enrich-grounding/scripts/safe_write.py
  what: 'Stands as in round 1. atomic_write does not fsync the temp file before os.replace, so ''old file whole or new one
    whole'' holds for a stopped process but not for a power cut. _mode_for reads the umask by setting it to 0 and back, which
    is not safe if another thread runs. Owner and group of the replaced file are not kept. The module says it keeps ''the
    permissions'' only, so none of it contradicts the text.

    '
  basis: 'Rubric: safe destructive operations; P4 nit: the files are git-tracked and the claim is about permissions only.'
  source: quality-findings.yaml
- id: QF-06
  category: code-and-tests
  severity: P4
  file: core/components/plays/create-play/references/platform_adapter.py
  what: 'Stands as in round 1. Seven platform_adapter.py copies and three safe_write.py copies are kept equal by hand. Byte-identical
    now (md5 checked), but no test or linter in core/tools compares them, so the next one-copy edit would drift silently.

    '
  basis: 'Category treatment: ''check they stay identical''. P4: identical today; a guard is a nice-to-have.'
  source: quality-findings.yaml
- id: QF-08
  category: code-and-tests
  severity: P4
  file: core/components/skills/enrich-grounding/scripts/change_lines.py
  what: 'The ''already there, do not add again'' test compares the add with the OLD text of the line just below the anchor,
    even when that line is replaced or removed in the same request. Run: page A / B / C with {old B, new Z} and {after A,
    add B} came out A / Z / C; the requested B was not added, the exit was 0 and the report still lists the change. A requested
    line is dropped without a word. Needs a request where the added text equals a line that the same request replaces.

    '
  basis: 'Rubric: deterministic where it claims to be; a silent skip against ''changes exactly the lines the request names''.
    P4: contrived trigger, nothing lost from the page.'
  source: quality-findings.yaml
- id: QF-09
  category: code-and-tests
  severity: P4
  file: core/components/skills/enrich-grounding/scripts/safe_write.py
  what: 'The temp file is opened in text mode with the default newline handling (os.fdopen(fd, "w", encoding="utf-8")). On
    Windows every "\n" is written as "\r\n", so a CRLF page that change_lines.py keeps byte for byte would come out with "\r\r\n".
    On macOS and Linux (where this was run) nothing changes, so the line-ending promise holds there only. Same text in all
    three copies.

    '
  basis: 'Python''s open() newline rules; rubric: deterministic where it claims to be. P4: the project runs on macOS and Linux
    today; not run on Windows.'
  source: quality-findings.yaml
- id: QF-10
  category: code-and-tests
  severity: P4
  file: core/components/skills/enrich-grounding/scripts/change_lines.py
  what: 'text_line rejects "\n" and "\r" but takes other control and line-separator characters in a new or added line: run,
    a new line holding NUL, form feed and U+2028 was written to the page. The script reads back consistently, but a reader
    that splits with Python''s str.splitlines() would see two lines, and a NUL in a markdown page is never wanted.

    '
  basis: 'Round 1 suggested rejecting control and line-separator characters (QF-02); only CR/LF were taken. Rubric: safe input
    handling. P4: the writer is an agent; no loss.'
  source: quality-findings.yaml
- id: QF-11
  category: code-and-tests
  severity: P4
  file: core/components/skills/enrich-grounding/scripts/change_lines.py
  what: 'The write loop catches Exception, not BaseException. A Ctrl-C or SIGTERM while the second of several pages is being
    written leaves the first page changed and not put back, against the header''s ''any failure puts every page back''. (Not
    run; read from the code. Each single page is still whole because atomic_write removes its temp file on BaseException.)

    '
  basis: 'Rubric: safe destructive operations. P4: needs a signal in a window of milliseconds; recoverable from git.'
  source: quality-findings.yaml
- id: QF-12
  category: code-and-tests
  severity: P4
  file: core/components/skills/enrich-grounding/scripts/test_change_lines.py
  what: 'Two gaps left in a much better suite. (1) The two write-failure tests make the write fail with chmod 0o500; a process
    running as root (many CI containers) can still write, so both tests would fail there for a reason that is not a bug. (2)
    No test for a restore that fails and is named (''could not be put back''), for the same add listed twice (QF-03), or for
    an add equal to a replaced line (QF-08).

    '
  basis: pr.md TEST-* intent (tests cover the branches that carry the promise, are stable where they run). No TEST row's match
    rule fires on this path. P4.
  source: quality-findings.yaml
- id: H-3
  category: harness
  severity: P4
  file: core/components/skills/enrich-grounding/SKILL.md
  what: 'Round 1''s finding stands. The `out` input still reads "Where to write grounding-report.json". A named-lines request
    writes lines-report.json instead, and step 5 writes it to `<working>/lines-report.json`, a path the Input table never
    hands over. The one `out` field the agent passes is not described for that case, so the agent cannot tell which file name
    to give or where the report belongs.

    '
  basis:
    principle: G7 (the contract names every output path, so the record of the run is on disk where the caller expects it)
    source: plan/717/base:core/components/skills/link-model-part/SKILL.md (`out` names the one report it writes); plan/717/base:docs/standards/harness-standard.md
      principle 2
  source: design-findings-harness.yaml
- id: H-4
  category: harness
  severity: P4
  file: core/components/skills/enrich-grounding/SKILL.md
  what: 'A named-lines run has two lists of pages: the required `pages` input and the `pages` inside lines-request.json. Step
    1 (read the page and its template, list every section and line) is written for the page-writing modes and says nothing
    about a named-lines run, whose script reads the request alone and needs no template. If the two lists differ, the skill
    has no stated rule for which one counts.

    '
  basis:
    principle: G4 (a skill's Input and Process hold together; one source for one fact) and G1 (the contract is explicit about
      what the agent hands over)
    source: plan/717/base:core/components/skills/enrich-grounding/SKILL.md (Input `pages`, Process steps 1 and 7); plan/717/base:docs/standards/harness-standard.md
      principle 2
  source: design-findings-harness.yaml
