- id: D1
  category: design-spec
  severity: P3
  file: .garura/project/issues/720/specs/design.md
  what: 'The rewritten constraint and the new paragraph make an unscoped claim: ''Nothing is written before a plain "approved"''
    and the branch step is ''the only write before "approved"''. The base rule was scoped to GitHub, the model and the plan
    file during the session. Read as written, the new claim is false against the base design itself: the play writes a running
    list in the plan''s short-term memory for every instruction, and ''Rejected'' leaves that list there. The edit was made
    to remove a contradiction that the base scope did not have (the main-first cut happens in ''How it starts'', before the
    session), and it adds a different one. Suggested wording: keep the base scope (''Nothing is written to GitHub, the model
    or the plan file during the session; the branch step in How it starts is the only write before it, and the running list
    is the design of the update, not a landing'').'
  basis: 'G1 and G2: git show plan/717/base:.garura/project/issues/720/specs/design.md, sections ''The session'' (scope of
    the no-write rule; running list in short-term memory) and ''How it ends'' (''Rejected ends the session with nothing written;
    the list stays in short-term memory'').'
  source: design-findings-design-spec.yaml
- id: D2
  category: design-spec
  severity: P3
  file: .garura/project/issues/720/specs/design.md
  what: 'The added paragraph states a decision the base design does not state: the main commit is ''bookkeeping ... not a
    change the person approves''. The base design is silent on whether the person approves that commit; it only has the person
    confirm the plan match. This is a small addition to an approved design, made by a review finding, and the design file
    carries no record that the owner approved this text: its header still reads ''Approved by the product owner on 2026-10-30
    ("720 approved")''. The only record of the owner''s choice is a blanket instruction (''fix all moderate and medium'')
    in the PR body, which is not a committed source on the base ref and does not name this sentence. Ask the owner to confirm
    the sentence, or drop the ''not a change the person approves'' clause so the edit only names the step.'
  basis: 'G3: git show plan/717/base:.garura/project/issues/720/specs/design.md (approval header; ''How it starts'' has only
    the plan-match confirmation); docs/adr/033 (a changed approved piece is approved again by a person).'
  source: design-findings-design-spec.yaml
- id: D3
  category: design-spec
  severity: P4
  file: .garura/project/issues/720/specs/design.md
  what: 'The reason for the edit is a parenthetical pointing at a review finding (''Found by the review of PR #995, finding
    F1, 2026-10-30''). F1 lives in a review run record and the PR, not in a place a later reader of the design will find;
