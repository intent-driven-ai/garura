grounding:
  - id: G1
    principle: "The approved #720 design is the stated source of the pages: nothing written before a plain 'approved'; works on the plan's own branch; a branch is cut only when the plan has none, with main's plan file set first; agreement of plan file, GitHub and model; nothing beyond the approved list changes."
    source: "git show plan/717/base:.garura/project/issues/720/specs/design.md (base commit c004b9ed). The base copy has NO pre-approval exception paragraph; the branch adds it, so the exception is grounded in G2 (the issue texts), not in the branch's design.md."
  - id: G2
    principle: "The issue texts of #720 and #730 (updated 2026-10-30, outside the branch) hold the ICE and the one-line title that the pages and spine must carry; both name the branch step as the one exception."
    source: "GitHub issues #720 and #730, titles and bodies (read only)"
  - id: G3
    principle: "Spine one_line and the plan-file titles agree with the issue titles."
    source: "plan/717/base:.garura/project/plans/717.yaml and base _spine.yaml against the issue titles"
  - id: G4
    principle: "Capability page: 'Directional intent' then 'Agent intent (ICE)' last; ICE lines start with Goal/Limit/Fails if/Checked by; each at least five words. Feature page: What it does, Inputs/Outputs, Rules & behavior, Acceptance criteria, Out of scope, ICE last. Content bar: self-explaining, discrete points, depth grows down the tree."
    source: "memory_dir copies (read through the memory tool) of standards/schemas/product-os/grounding/capability.md, feature.md, _content-standard.md; same files on plan/717/base"
  - id: G5
    principle: "Spine entry: one_line is a descriptor; metadata.updated_by is free text; a play-owned script changes shared files."
    source: "memory_dir copy of standards/schemas/product-os/spine.yaml; base _spine.yaml precedent (fn-729, fn-628 carry metadata.updated_by)"
  - id: G6
    principle: "The product ICE is its own node in the ontology; Garura's own model has not moved yet (#765 not built)."
    source: "plan/717/base:core/components/memory/standards/schemas/product-os/ontology.md (version 13); plan/717/base:docs/adr/047-the-ice-is-its-own-node.md; ADR 052. The memory-tool copy of the ontology is version 4 (stale), so the base-ref file is used."
  - id: G7
    principle: "Every memory write, including a working list, goes to the issue's short-term memory; the model changes only through its sub-agent and skills."
    source: "memory_dir copy of standards/rules/direct-model-write.md; project memory rules (short-term memory is where all writes go)"

