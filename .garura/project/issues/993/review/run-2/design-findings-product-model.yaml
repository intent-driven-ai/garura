    check: "Limit and Fails if lines of cap-720 and fn-730 are character-for-character the ICE lines of issue #720 and #730 (8 of 8 lines, checked by script against the issue bodies as they stand now). Both now name the branch step (main's plan file set to In Progress with the branch named, then the cut) as the one write before approval. Every other page line and every other spine entry is kept: the page diff touches only the H1, the first body paragraph and the four ICE lines; the spine diff touches only the one_line and a new metadata.updated_by on each of the two entries; spine one_line and plan titles equal the issue titles. #720's design names the same step ('The one write before approval', and the Limit bullet)."
    note: "The design.md paragraph is a branch addition, so it was not used as grounding; the issue texts (outside the branch) carry the same wording and ground the check."

checks_passed:
  - "cap-720 and fn-730 ICE: Goal, Limit, Fails if, Checked by equal the issue texts (8 of 8)."
  - "Pages: only the H1, the directional intent / what it does and the four ICE lines changed; headings and layout untouched."
  - "Spine: with one_line and metadata removed from the two entries it equals the base spine; one_line equals the issue titles and plan 717 titles (new #994 plan entry equals the #994 issue title)."
  - "No real name or home path in any added line of the four product-model files and the plan file (grep)."
  - "design.md edit: the Limit bullet ('Nothing is written before a plain approved, except the branch step above') agrees with the new paragraph and with the issue texts; the 'Nothing is written to GitHub, the model or the plan file during the session' line stays true because the branch step is stated as the one exception right after it."

findings:
  - id: F1
    severity: P4
    file: .garura/product/product-os/capabilities/cap-720/capability.md
    what: "Left over from round 1's F1, now small. The exception sits in the first Limit sentence and in the first 'Fails if' clause only. The next Limit sentence ('It changes a plan only on the plan's own branch') and the last Fails-if clause ('a plan is changed anywhere but on its own branch') have no exception, yet the branch step writes main's plan file on main. A literal reader of the check could call the allowed step a failure. The words equal the issue #720 text and the design says main's copy 'may be behind, and that is all', so this is a gap in the source, not the page."
    basis:
      principle: "A Limit and its Fails-if must not contradict the play's own described step."
      sources:
        - "plan/717/base:.garura/project/issues/720/specs/design.md - 'Which copy of a plan counts' (main-first plan file write, then the cut) beside 'The plan's branch is the only place a plan changes'"
        - "GitHub issue #720, Limit and Fails if (read only)"
    note: "Not a block. If fixed, fix in #720's text and the page together."

  - id: F2
    severity: P4
    file: .garura/product/product-os/capabilities/cap-720/capability.md
    what: "Still stands. The new 'Directional intent' is one long sentence of about 90 words with a colon list; it says what the capability does but not why it matters. The base text also lacked the why, so this is not new."
    basis:
      principle: "Content bar: self-explaining with the why; discrete points; capability template 'Directional intent'."
      sources:
        - "memory_dir copies of grounding/_content-standard.md and grounding/capability.md"

  - id: F3
    severity: P4
    file: .garura/product/product-os/features/fn-730/feature.md
    what: "Still stands. The page title uses a dash after 'The /update-plan session' while the spine one_line, the plan 717 title and the #730 issue title use a colon. On base the page title equalled the one_line."
    basis:
      principle: "The page title and the spine one_line name the same thing in the same words; titles agree with the tracker."
      sources:
        - "plan/717/base: fn-730 feature.md H1 against _spine.yaml one_line"
        - "GitHub issue #730 title (read only)"

  - id: F4
    severity: P4
    file: .garura/product/product-os/features/fn-730/feature.md
    what: "Still stands, there before this PR: the page holds only 'What it does' and the ICE; the required feature sections are missing (same lint errors as on base) and it carries no thin mark. The PR did not make it worse; out of scope for #993 (named lines only)."
    basis:
      principle: "A feature is the most detailed level, never leaner than its parent; the heading contract; a thin page carries the thin mark (ADR 052)."
      sources:
        - "plan/717/base: grounding/feature.md, grounding/_content-standard.md, docs/adr/052-shape-slice-writes-the-hidden-file-and-proposes-a-thin-ice.md"

  - id: F5
    severity: P4
    file: .garura/product/product-os/capabilities/cap-720/capability.md
    also_in: ".garura/product/product-os/features/fn-730/feature.md"
    what: "Still stands, there before this PR: both pages keep the ICE inline with the old labels. The ontology (v13) and ADR 047 make the ICE its own page; the PR follows the model as built (#765 not built), so it conforms today. These lines will move again in #765."
    basis:
      principle: "The product ICE is its own node; until the move pages keep the inline section."
      sources:
        - "plan/717/base: ontology.md (version 13), docs/adr/047-the-ice-is-its-own-node.md"

  - id: F6
    severity: P4
    file: .garura/product/product-os/capabilities/cap-720/capability.md
    also_in: ".garura/product/product-os/features/fn-730/feature.md"
    what: "New in round 2 reading. The Limit says 'Nothing is written before a plain approved', but the same pages (directional intent and #730's step 3) have the play keep a running list in the plan's short-term memory during the session, which is a write. The design scopes its line to 'GitHub, the model or the plan file'; the pages' Limit is wider. Short-term memory writes are allowed by the memory rules, so the intent is clear; the wording is loose."
    basis:
      principle: "A Limit should say what it forbids; the working list is a memory write the rules always allow."
      sources:
        - "plan/717/base:.garura/project/issues/720/specs/design.md ('Nothing is written to GitHub, the model or the plan file during the session'; 'the list stays in short-term memory')"
        - "memory_dir copy of standards/rules/direct-model-write.md; project memory rules (all writes go to short-term memory)"
    note: "Same wording as the issue texts. Not a block."

  - id: F7
    severity: P4
    file: .garura/project/issues/720/specs/design.md
    what: "The new paragraph ends with '(Found by the review of PR #995, finding F1, 2026-10-30.)'. That is a note of origin inside a design that is the source of the model pages. The way the repo keeps such history is the commit message and the issue, not the document."
    basis:
      principle: "History of an edit goes in the commit and the issue, not in the file; notes of origin are removed."
      sources:
        - "project rules: CLAUDE.md, Play Pipeline Rules and 'Installed parts' paragraph (notes of origin deleted; no change logs in generated files); product owner's saved rule that direct-edit history goes in the commit and issue"

