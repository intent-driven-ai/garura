      linters: []
      linters_note: "no linter; objective hand checks only"
      runnable_checks:
        - "by hand (done in this run for the 17 copies listed in the manifests; the two empty grounding manifests list none): each copy's sha256 equals its manifest fingerprint; all matched. The nine shared copies also match the memory tool's current answer (fingerprint and version)"
        - "by hand: every .json file parses; no absolute home-folder path and no real name in the added text"
