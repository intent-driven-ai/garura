# check-change Step 2 - categories present in PR #995 (plan/717/993-page-skill-named-lines -> plan/717/base), round 3
# Derived from the diff's content (97 changed paths, each in exactly one category).
# Treatments are taken from the short-term playbook copies in
# .garura/project/issues/993/context/memory/knowledge/review/ (manifest.json beside them).
# Round 3: the nine shared copies were checked again: each file's sha256 equals its manifest fingerprint and the memory tool still answers the same version (39a55c3a2d0e), so no re-copy.
pr: "995"
round: 3
base: plan/717/base
changed_paths_total: 97
playbook_copies: .garura/project/issues/993/context/memory/knowledge/review/
severity_taxonomy: .garura/project/issues/993/context/memory/standards/rules/pr.md
categories:

  - name: harness
    playbook: review/harness
    design_bearing: true
    path_count: 5
    evidence:
      - "core/components/agents/product-os-keeper.md - agent definition; skill table and routing row gain the named-lines route for enrich-grounding (any page)"
      - "core/components/skills/enrich-grounding/SKILL.md - skill definition; update/fix mode takes a named-lines request on any page, step 5 runs change_lines.py, steps 7 and the in-place rule allow the lines the request names (unchanged since round 2)"
      - "core/components/skills/platform-adapter/SKILL.md - skill definition; new edit-issue-title verb"
      - "core/components/skills/platform-adapter/reference/github/verbs.md - skill reference; edit-issue-title for GitHub"
      - "core/components/skills/platform-adapter/reference/gitlab/verbs.md - skill reference; edit-issue-title for GitLab"
    treatment:
      layers: [1, 2]
      linters:
        - name: lint-components (source layout)
          command: "node .garura/core/tools/lint-components/index.js --layout source --target core/components"
          scope: "only a violation whose file is in the PR's changed paths is a finding; count the rest as 'there before'"
        - name: lint-play
          command: "python3 .garura/core/tools/lint-play/lint_play.py core/components/plays/<play>/SKILL.md --next-map .garura/project/issues/993/context/templates/standards/rules/pipeline-next.md"
          scope: "for each changed play. No play SKILL.md is among the changed paths (only scripts and references under plays/), so no lint_play run applies; record not applicable"
      runnable_checks:
        - "the lint-components command above (tool not installed -> record 'not installed'; crash -> 'did not run: <first error line>'; neither is a pass); lint-play recorded not applicable"
        - "ICE-source rule: the repository holds the plays' source, so the rule applies. No play SKILL.md changed, so there is no compiled play to trace; skills and the agent have no ICE source to trace"
      design_grounding:
        required: true
        grounded_from: "committed sources only: docs/philosophy/**, docs/adr/**, memory/standards/rules/** (user-facing-voice, play-close, evidence-recording), the glossary, docs/standards/harness-standard.md, and the base-ref version of each changed file (git show plan/717/base:<path>). Never the branch's own new prose, including specs/design.md of #993 and the diff's version of the #720 design"
        principles_to_test: "agent-first delegation, JSON contracts over files, play orchestrates / skills produce / scripts do mechanical work, ICE-source discipline, agents craft context and skills do the work (the agent writes lines-request.json; the skill never writes it)"

  - name: executable-code
    playbook: review/code
    design_bearing: false
    path_count: 11
    evidence:
      - "core/components/skills/enrich-grounding/scripts/change_lines.py - new script (233 lines now, 178 in round 1): the named-lines page change, all or nothing"
      - "core/components/skills/enrich-grounding/scripts/safe_write.py - new script (44 lines): safe file write"
      - "core/components/skills/link-model-part/scripts/safe_write.py - changed safe-write script"
      - "core/components/plays/shape-slice/scripts/safe_write.py - changed safe-write script (docstring names change_lines.py as a caller)"
      - "platform_adapter.py, same change in seven copies: plays/check-change/scripts, plays/create-play/references, plays/merge-change/scripts, plays/propose-change/scripts, plays/shape-eval/scripts, plays/shape-plan/scripts, plays/shape-slice/scripts"
    treatment:
      layers: [1]
      linters:
        - name: check-pr-quality (quality-auditor)
          command: "check-pr-quality against the diff with the short-term pr.md copy; rows SEC-*, CODE-*, ARCH-*, BE-*, PERF-*, DATA-*"
        - name: language linter
          command: "whatever the repository commits (ruff or similar); if none is committed, record 'not installed'"
      runnable_checks:
        - "extra weight on data-safety and idempotency: change_lines.py and the three safe_write.py files write to model pages and files (all-or-nothing, restore of pages already written, atomic replace, partial-failure behaviour, line endings kept)"
        - "rubric: error handling, function size, no stray debug output, no secrets, safe destructive operations, deterministic where it claims to be"
        - "the seven platform_adapter.py copies are one change: check they stay identical to each other; the three safe_write.py copies are one file in three places: check they stay identical"
      design_grounding:
        required: false
        note: "standard is industry best practice plus the pr.md taxonomy, not a Garura-internal design"

  - name: tests
    playbook: review/tests
    design_bearing: false
    path_count: 2
    evidence:
      - "core/components/skills/enrich-grounding/scripts/test_change_lines.py - new test file (272 lines now, 172 in round 1) for change_lines.py"
      - "core/components/plays/create-play/references/test_platform_adapter.py - changed test for the platform adapter"
    treatment:
      layers: [1]
      linters:
        - name: check-pr-quality (quality-auditor)
          command: "check-pr-quality against the diff; pr.md TEST-* rows (clear assertions, no skipped/disabled tests, no test that asserts nothing)"
      runnable_checks:
        - name: change_lines tests
          command: 'python3 -m unittest discover -s core/components/skills/enrich-grounding/scripts -p "test_change_lines.py"'
          rule: "run, do not just read; a red suite is a blocker finding"
        - name: platform adapter tests
          command: "python3 core/components/plays/create-play/references/test_platform_adapter.py"
          rule: "run, do not just read; a red suite is a blocker finding. Never treat 'not run' as 'passed'"
      design_grounding:
        required: false

  - name: product-model
    playbook: null
    playbook_missing: true
    note: "playbook missing. The product model pages (spine, capability page, feature page) are not memory shelves (no _TEMPLATE.md shape) and not harness code: they state the intent and ICE (Goal, Limit, Fails if, Checked by) of parts of the product. review/memory is the nearest playbook but its rubric (shelf template, _index listing) does not fit. A follow-up task to write a product-model review playbook is owed; the task tool is not reachable from this run, so the caller should file it. The treatment below is the assessor's proposal."
    design_bearing: true
    path_count: 3
    evidence:
      - ".garura/product/product-os/_spine.yaml - model index; cap-720 and fn-730 one-lines rewritten, metadata.updated_by added to both"
      - ".garura/product/product-os/capabilities/cap-720/capability.md - capability page; title, directional intent and all four ICE lines rewritten (Limit and Fails if now carry the branch-step exception)"
      - ".garura/product/product-os/features/fn-730/feature.md - feature page; title, what-it-does and all four ICE lines rewritten (same exception)"
    treatment:
      layers: [1, 2]
      linters: []
      linters_note: "no installed tool checks the product model (gap). The reviewer does the checks by hand and cites each"
      runnable_checks:
        - "by hand: _spine.yaml still parses as YAML; each changed entry's doc path resolves to a real page; the four ICE lines (Goal, Limit, Fails if, Checked by) are present on both pages; the spine one_line matches each page's title"
        - "by hand: spine one_line titles for #720 and #730 match the titles in .garura/project/plans/717.yaml"
        - "by hand: model pages name personas, not real names"
      design_grounding:
        required: true
        grounded_from: "committed sources only: the base-ref version of each page (git show plan/717/base:<path>), docs/adr/** (product model and ontology decisions), core/grounding/glossary.md, and the model standards read through the memory tool (already copied under grounding-product-model/). The approved #720 design as it stands at plan/717/base (git show plan/717/base:.garura/project/issues/720/specs/design.md) is the stated source of the change and is committed and usable; the diff's version of that file is NOT grounding (it changed in this diff, see design-spec). The new page text is the thing under review and is never its own grounding"
        principles_to_test: "ICE shape (Goal, Limit, Fails if, Checked by), plain-English personas-only model pages, orchestration-only capability limits, the change matches what the base-ref #720 design approved and nothing more (the branch-step exception is not in the base-ref design)"

  - name: design-spec
    playbook: null
    playbook_missing: true
    note: "playbook missing. A person-approved design file for a play, kept in the issue's specs folder. It is not a decision record (docs/adr), not documentation, and not this branch's own work record: it is the source other changes are measured against, and in this diff it was edited after its approval. review/adrs is the nearest playbook (decisions are grounded from the base ref and later edits are suspect) but does not name specs. A follow-up task to write a design-spec review playbook is owed; the task tool is not reachable from this run, so the caller should file it. The treatment below is the assessor's proposal."
    design_bearing: true
    path_count: 1
    evidence:
      - ".garura/project/issues/720/specs/design.md - the approved #720 design ('Approved by the product owner on 2026-10-30'). The diff adds a paragraph 'The one write before approval' (the branch step; cites 'the review of PR #995, finding F1') and loosens the constraint 'It never cuts a branch except as above' to 'Nothing is written before a plain approved, except the branch step'. A change to what the play may do, made after the approval"
    treatment:
      layers: [1, 2]
      linters: []
      linters_note: "no installed tool checks a design spec (gap). By hand only"
      runnable_checks:
        - "by hand: the file still reads whole (headings intact, no broken sentence); the added text names no real person and no absolute home path"
        - "by hand: the edit is only the two hunks shown (the added paragraph and the changed constraint); nothing else moved"
      design_grounding:
        required: true
        grounded_from: "the base-ref version only: git show plan/717/base:.garura/project/issues/720/specs/design.md, plus docs/adr/** and the glossary. The diff's version of this file is the thing under review and is not grounding, and neither is any text on this branch that quotes it (cap-720, fn-730, #993's specs/design.md, product-os-keeper.md)"
        principles_to_test: "a design a person approved changes only with the person's approval, not by a review finding alone; the edit does not widen what the approved design allowed (base-ref: nothing is written to GitHub, the model or the plan file during the session, and no branch is cut except as the design states); the edit is consistent with the base-ref sections it sits beside ('Which copy of a plan counts', 'How it ends')"

  - name: memory-copies
    playbook: null
    playbook_missing: true
    note: "playbook missing. Short-term copies the memory tool and the template-manager laid in this issue's folder: the review shelf, the PR severity taxonomy, the product-model standards the grounding read, and the Next-line map. They are copies, not authored work, and no seeded playbook covers a copy. Only a hand check applies. A follow-up playbook is owed only if copies keep showing up in diffs; the caller may decide."
    design_bearing: false
    path_count: 23
    evidence:
