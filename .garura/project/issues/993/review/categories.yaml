      - ".garura/project/issues/993/context/memory/manifest.json and standards/rules/pr.md - shared manifest and severity taxonomy (2)"
      - ".garura/project/issues/993/context/memory/{grounding-harness, grounding-design-spec}/manifest.json - grounding manifests with no copies (2; grounding-design-spec is new since round 2)"
