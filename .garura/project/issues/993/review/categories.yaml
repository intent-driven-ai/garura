        - "by hand: no absolute home-folder path and no real name in any record (a home path is written with ~). A scan of the added lines of this round's pr.diff found one hit: review/quality-findings.yaml (round 2's committed output) holds a scratchpad path under /private/tmp that contains the machine user's name, in a comment and in an evidence line. The caller should weigh it; it was not written by this run"
