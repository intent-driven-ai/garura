notes:
  - "No category is empty; none from the seeded catalog was forced onto the diff. Absent from this diff: decision-records (adrs), documentation (docs), config-maps."
  - "Round 3 versus round 2: 97 paths against 79. The code, tests, harness and product-model paths and counts are the same (11, 2, 5, 3). Added since round 2: the grounding-design-spec manifest (memory-copies 22 to 23), commits.yaml, the d1 model-line pair, round 2's own review outputs (15) and round 1's now under run-1 (14), which move work-records from 35 to 52. Content changes since round 2: the scoped wording of the branch step in the #720 design file, and the cap-720 and fn-730 pages (round 2 findings D1 and D2)."
  - "The #720 design file is its own category (design-spec), not a work record: it is the source the product-model category is measured against, and this diff edits it. For grounding, its base-ref version (plan/717/base:.garura/project/issues/720/specs/design.md) is committed and usable; the diff's version is not."
  - "Playbook choice for scripts: review/code.md names the python scripts inside plays and skills as executable code, so platform_adapter.py, safe_write.py and change_lines.py are executable-code, not harness. SKILL.md, the agent and verbs.md are harness."
  - "Four categories have no playbook: product-model, design-spec, memory-copies, work-records. Their treatments are the assessor's proposal, marked so. A follow-up task for each missing playbook is owed; the task tool was not reachable from this run, so the caller should file them."
  - "Design-bearing categories for Layer 2 fan-out: harness, product-model, design-spec."
