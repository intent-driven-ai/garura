        required: false

  - name: work-records
    playbook: null
    playbook_missing: true
    note: "playbook missing. Plan file, this issue's run records, PR body, self-review, its own design spec, and the earlier review rounds' outputs are records of the work, not docs, ADRs, harness, memory or code. A follow-up task to write a work-records review playbook is owed; the task tool is not reachable from this run, so the caller should file it. The treatment below is the assessor's proposal."
