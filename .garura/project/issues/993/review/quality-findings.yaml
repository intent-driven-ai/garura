findings:
  - id: QF-03
    severity: P4
    file: core/components/skills/enrich-grounding/scripts/change_lines.py
    line: "113-118, 153-156"
    standard_id: null
    what: >
      Round 1's QF-03 stands only in part. A rerun of the same request is now safe. Still open:
      one request that lists the same {after, add} twice adds the line twice (run: A / B request with
      two identical adds put the line on the page two times). The idempotence check looks only at the
      lines already on the page, not at the other adds of the same request.
    basis: "Rubric: idempotency on write paths. Down from P3 to P4: the retry case is fixed; this needs a request with a repeated entry, which the agent writes."
    suggested_fix: "Refuse a repeated identical {after, add} in read_changes, as a line named twice is refused."
    disposition: confirmed

  - id: QF-05
    severity: P4
    file: core/components/skills/enrich-grounding/scripts/safe_write.py
    line: "21-44 (same text in all three copies)"
    standard_id: null
    what: >
      Stands as in round 1. atomic_write does not fsync the temp file before os.replace, so 'old file
      whole or new one whole' holds for a stopped process but not for a power cut. _mode_for reads the
      umask by setting it to 0 and back, which is not safe if another thread runs. Owner and group of
      the replaced file are not kept. The module says it keeps 'the permissions' only, so none of it
      contradicts the text.
    basis: "Rubric: safe destructive operations; P4 nit: the files are git-tracked and the claim is about permissions only."
    disposition: confirmed

  - id: QF-06
    severity: P4
    file: core/components/plays/create-play/references/platform_adapter.py
    line: null
    standard_id: null
    what: >
      Stands as in round 1. Seven platform_adapter.py copies and three safe_write.py copies are kept
      equal by hand. Byte-identical now (md5 checked), but no test or linter in core/tools compares
      them, so the next one-copy edit would drift silently.
    basis: "Category treatment: 'check they stay identical'. P4: identical today; a guard is a nice-to-have."
    disposition: confirmed

  - id: QF-08
    severity: P4
    file: core/components/skills/enrich-grounding/scripts/change_lines.py
    line: "153-156"
    standard_id: null
    what: >
      The 'already there, do not add again' test compares the add with the OLD text of the line just
      below the anchor, even when that line is replaced or removed in the same request. Run: page
      A / B / C with {old B, new Z} and {after A, add B} came out A / Z / C; the requested B was not
      added, the exit was 0 and the report still lists the change. A requested line is dropped without
      a word. Needs a request where the added text equals a line that the same request replaces.
    basis: "Rubric: deterministic where it claims to be; a silent skip against 'changes exactly the lines the request names'. P4: contrived trigger, nothing lost from the page."
    suggested_fix: "Compare against the lines as they will be after the replace and remove (the new text), or refuse the combination."
    disposition: confirmed

  - id: QF-09
    severity: P4
    file: core/components/skills/enrich-grounding/scripts/safe_write.py
    line: "37"
    standard_id: null
    what: >
      The temp file is opened in text mode with the default newline handling (os.fdopen(fd, "w",
      encoding="utf-8")). On Windows every "\n" is written as "\r\n", so a CRLF page that
      change_lines.py keeps byte for byte would come out with "\r\r\n". On macOS and Linux (where this
      was run) nothing changes, so the line-ending promise holds there only. Same text in all three
      copies.
    basis: "Python's open() newline rules; rubric: deterministic where it claims to be. P4: the project runs on macOS and Linux today; not run on Windows."
    suggested_fix: "Open with newline='' in atomic_write (all three copies together)."
    disposition: confirmed

  - id: QF-10
    severity: P4
    file: core/components/skills/enrich-grounding/scripts/change_lines.py
    line: "82-87"
    standard_id: null
    what: >
      text_line rejects "\n" and "\r" but takes other control and line-separator characters in a new
      or added line: run, a new line holding NUL, form feed and U+2028 was written to the page. The
      script reads back consistently, but a reader that splits with Python's str.splitlines() would
      see two lines, and a NUL in a markdown page is never wanted.
    basis: "Round 1 suggested rejecting control and line-separator characters (QF-02); only CR/LF were taken. Rubric: safe input handling. P4: the writer is an agent; no loss."
    suggested_fix: "Refuse any character in the Unicode categories Cc (except tab) and Zl/Zp in old, new, after and add."
    disposition: confirmed

  - id: QF-11
    severity: P4
    file: core/components/skills/enrich-grounding/scripts/change_lines.py
    line: "221"
    standard_id: null
    what: >
      The write loop catches Exception, not BaseException. A Ctrl-C or SIGTERM while the second of
      several pages is being written leaves the first page changed and not put back, against the
      header's 'any failure puts every page back'. (Not run; read from the code. Each single page is
      still whole because atomic_write removes its temp file on BaseException.)
    basis: "Rubric: safe destructive operations. P4: needs a signal in a window of milliseconds; recoverable from git."
    suggested_fix: "Catch BaseException around the loop, put back, then re-raise."
    disposition: confirmed

  - id: QF-12
    severity: P4
    file: core/components/skills/enrich-grounding/scripts/test_change_lines.py
    line: "119-153"
    standard_id: null
    what: >
      Two gaps left in a much better suite. (1) The two write-failure tests make the write fail with
      chmod 0o500; a process running as root (many CI containers) can still write, so both tests would
      fail there for a reason that is not a bug. (2) No test for a restore that fails and is named
      ('could not be put back'), for the same add listed twice (QF-03), or for an add equal to a
      replaced line (QF-08).
    basis: "pr.md TEST-* intent (tests cover the branches that carry the promise, are stable where they run). No TEST row's match rule fires on this path. P4."
    suggested_fix: "Make the write fail by patching safe_write.atomic_write in-process instead of by file mode; add the three missing cases."
    disposition: confirmed

