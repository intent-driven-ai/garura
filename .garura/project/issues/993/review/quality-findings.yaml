findings:
  - id: QF-03
    severity: P4
    file: core/components/skills/enrich-grounding/scripts/change_lines.py
    line: "113-118, 153-156"
    standard_id: null
    what: "Stands as in round 2. One request that lists the same {after, add} twice adds the line twice; the idempotence check looks only at lines already on the page."
    basis: "Rubric: idempotency on write paths. P4: the retry case is fixed; this needs a repeated entry in one request."
    suggested_fix: "Refuse a repeated identical {after, add} in read_changes, as a line named twice is refused."
    disposition: confirmed (unchanged, code unchanged)

  - id: QF-05
    severity: P4
    file: core/components/skills/enrich-grounding/scripts/safe_write.py
    line: "21-44 (same text in all three copies)"
    standard_id: null
    what: "Stands. atomic_write does not fsync the temp file before os.replace (a stopped process is safe, a power cut is not); _mode_for reads the umask by setting it to 0 and back (not thread safe); owner and group of the replaced file are not kept. The module claims only the permissions."
    basis: "Rubric: safe destructive operations. P4: the files are git-tracked and the claim is about permissions only."
    disposition: confirmed (unchanged)

  - id: QF-06
    severity: P4
    file: core/components/plays/create-play/references/platform_adapter.py
    line: null
    standard_id: null
    what: "Stands. Seven platform_adapter.py copies and three safe_write.py copies are kept equal by hand. Byte-identical today (md5 re-checked this round) but no test or linter in core/tools compares them."
    basis: "Category treatment: check they stay identical. P4: identical today; a guard is a nice-to-have."
    disposition: confirmed (unchanged)

  - id: QF-08
    severity: P4
    file: core/components/skills/enrich-grounding/scripts/change_lines.py
    line: "153-156"
    standard_id: null
    what: "Stands. The 'already there' test compares the add with the OLD text of the line below the anchor even when the same request replaces or removes that line: page A/B/C with {old B, new Z} and {after A, add B} gives A/Z/C, the requested B is dropped, exit 0."
    basis: "Rubric: deterministic where it claims to be. P4: contrived trigger, nothing lost from the page."
    suggested_fix: "Compare against the lines as they will be after the replace and remove, or refuse the combination."
    disposition: confirmed (unchanged)

  - id: QF-09
    severity: P4
    file: core/components/skills/enrich-grounding/scripts/safe_write.py
    line: "37"
    standard_id: null
    what: "Stands. The temp file is opened in text mode with default newline handling, so on Windows each \\n becomes \\r\\n and a kept CRLF page would come out with \\r\\r\\n. Fine on macOS and Linux. Same text in all three copies."
    basis: "Python open() newline rules. P4: the project runs on macOS and Linux today; not run on Windows."
    suggested_fix: "Open with newline='' in atomic_write (all three copies together)."
    disposition: confirmed (unchanged)

  - id: QF-10
    severity: P4
    file: core/components/skills/enrich-grounding/scripts/change_lines.py
    line: "82-87"
    standard_id: null
    what: "Stands. text_line rejects \\n and \\r only; NUL, form feed and U+2028 in a new or added line are written. A reader using str.splitlines() would see two lines."
    basis: "Rubric: safe input handling. P4: the writer is an agent; no loss."
    suggested_fix: "Refuse characters in categories Cc (except tab) and Zl/Zp in old, new, after and add."
    disposition: confirmed (unchanged)

  - id: QF-11
    severity: P4
    file: core/components/skills/enrich-grounding/scripts/change_lines.py
    line: "221"
    standard_id: null
    what: "Stands. The write loop catches Exception, not BaseException: Ctrl-C or SIGTERM between page writes leaves the earlier pages changed, against the header's 'any failure puts every page back'. Read from the code, not run."
    basis: "Rubric: safe destructive operations. P4: needs a signal in a window of milliseconds; recoverable from git."
    suggested_fix: "Catch BaseException around the loop, put back, then re-raise."
    disposition: confirmed (unchanged)

  - id: QF-12
    severity: P4
    file: core/components/skills/enrich-grounding/scripts/test_change_lines.py
    line: "119-153"
    standard_id: null
    what: "Stands. The two write-failure tests fail the write with chmod 0o500, which a root process still writes through, so they would fail in a root CI container for a reason that is not a bug. No test for a restore that fails and is named, for the same add listed twice (QF-03), or for an add equal to a replaced line (QF-08)."
    basis: "pr.md TEST-* intent (stable where they run, cover the branches that carry the promise). No TEST row fires on this path. P4."
    suggested_fix: "Fail the write by patching safe_write.atomic_write in-process; add the three missing cases."
    disposition: confirmed (unchanged)

