findings:
  - id: QF-01
    severity: P2
    file: core/components/skills/enrich-grounding/scripts/change_lines.py
    line: "161-173"
    standard_id: null
    what: >
      The all-or-nothing promise has holes. Only OSError is caught in the write loop, so any other
      failure on page 2 leaves page 1 already changed with a traceback and exit 1 (the module says
      exit 0 or 2 and 'any failure ... writes nothing'). Run: a request whose second page carries a
      lone surrogate (valid in JSON, passes text_line) raised UnicodeEncodeError; the first page
      stayed changed, not put back. Two sibling holes: the final report write (line 173) is outside
      the try, so a failing --out path leaves every page changed with no report (run: --out was a
      folder; pages changed, IsADirectoryError, exit 1); and the put-back loop (lines 167-168) is
      itself unguarded, so one failed restore stops the loop and leaves the later pages changed.
    basis: >
      Data-safety weight for this file; PR-severity bucket P2 (partial write state on a model page,
      narrow trigger, recoverable from git). The module docstring (lines 31-34) and the SKILL.md
      promise exit 0 or 2 and no partial change. Not P1: no silent loss, the run exits non-zero.
    suggested_fix: >
      Encode every after_text to utf-8 in the planning pass (so a bad character refuses before any
      write); catch Exception, not only OSError, around the write loop; put the report write inside
      the same guard (or write it first to a temp name); guard each restore and keep going.
    disposition: confirmed

  - id: QF-02
    severity: P3
    file: core/components/skills/enrich-grounding/scripts/change_lines.py
    line: "94, 129"
    standard_id: null
    what: >
      'Keeps every other line word for word' is not true for some pages. The page is read with
      universal newlines and split with str.splitlines(), then joined with "\n". Run: a page with CRLF
      endings came back entirely LF (every untouched line changed); a line holding U+2028 was split
      in two; a line holding a form feed was split, which also made an unrelated 'old' line look
      like it was on the page twice (a false refusal). The put-back after a failed write is not
      byte-exact for the same reason. text_line rejects "\n" but not "\r", so a new line holding
      "\r" would be written and read back as two lines.
    basis: >
      Rubric: deterministic where it claims to be, safe destructive operations. P3: model pages are
      LF markdown today, so the trigger is rare; the guarantee is the script's headline promise.
    suggested_fix: >
      Read with newline='' and split on "\n" only (keep the line endings), reject any control or
      line-separator character in old, new, after and add.
    disposition: confirmed

  - id: QF-03
    severity: P3
    file: core/components/skills/enrich-grounding/scripts/change_lines.py
    line: "110-115"
    standard_id: null
    what: >
      An {after, add} change is not idempotent. Run: the same request sent twice put the added line
      on the page twice. {old, new} is safe (the second run refuses because 'old' is gone), so a
      retried run after a lost report adds duplicates only for additions. The same request listing
      one add twice also adds it twice; nothing refuses.
    basis: "Rubric: idempotency on destructive/write paths (called out in the category). P3: caller can avoid it; no data is lost."
    suggested_fix: "Refuse an add whose text is already the line directly below the anchor, and refuse a repeated identical add."
    disposition: confirmed

  - id: QF-04
    severity: P3
    file: core/components/skills/enrich-grounding/scripts/test_change_lines.py
    line: "78-168"
    standard_id: null
    what: >
      The ten tests pass and assert real outcomes, but the branches the script advertises as its
      safety net have no test: the put-back when a write fails part way (change_lines.py 166-170, the
      branch QF-01 shows is incomplete), the refusal 'a line is added after a line that is removed'
      (118-120), an absolute path and a symlinked page, a CRLF page, and a second run of an
      {after, add} change. test_a_line_on_the_page_twice_is_refused does not assert the page stayed
      unchanged. A passing suite says nothing about the rollback.
    basis: "pr.md TEST-* intent (new behaviour is covered, tests assert the outcome); no TEST row's match rule fires on this path, so this is a review-rubric finding. P3: highlights, does not block."
    suggested_fix: "Add a test that makes the second page's write fail and asserts the first page is back as it was; add the missing refusals."
    disposition: confirmed

  - id: QF-05
    severity: P4
    file: core/components/skills/enrich-grounding/scripts/safe_write.py
    line: "21-44 (same text in all three copies)"
    standard_id: null
    what: >
      atomic_write does not fsync the temp file before os.replace, so the 'old file whole or new one
      whole' promise holds for a process that stops but not for a power cut (the new name can point
      at an empty file). _mode_for reads the umask by setting it to 0 and back, which is not safe if
      another thread runs. Owner and group of the replaced file are not kept. The module says it
      keeps 'the permissions' only, so none of this contradicts it.
    basis: "Rubric: safe destructive operations; P4 nit: the files are git-tracked and the claim is about permissions only."
    disposition: confirmed

  - id: QF-06
    severity: P4
    file: core/components/plays/create-play/references/platform_adapter.py
    line: null
    standard_id: null
    what: >
      Seven platform_adapter.py copies and three safe_write.py copies are kept equal by hand. They
      are byte-identical now (md5 checked), but no test or linter in core/tools compares them, so the
      next one-copy edit would drift silently. create-play stamps platform_adapter.py from
      references/ at build time; safe_write.py has no such stamp.
    basis: "Category treatment: 'check they stay identical'. P4: identical today; a guard is a nice-to-have."
    disposition: confirmed

  - id: QF-07
    severity: P4
    file: core/components/skills/enrich-grounding/scripts/change_lines.py
    line: "80-133, 85"
    standard_id: null
    what: >
      plan_page is about 55 lines with a branch chain that does planning, validation and rendering in
      one function; the 'basename == _spine.yaml' test on line 85 can never be true after the
      '.md' test on the same line, so it is dead code. The ' "name" and set(change) <= {...} and "new"
      in change' condition on line 99 reads as a double check of the same thing.
    basis: "Rubric: function size. Matches the intent of CODE-10 (P3) but no row fires; set to P4 as style."
    disposition: confirmed

