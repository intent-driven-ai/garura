# Layer 1 standards linter for PR #988 (plan/717/base -> main), issue 717.
# Categories covered: executable-code, tests, issue-work-records (categories.yaml).
# Scanner: check-pr-quality scan_taxonomy.py against pr.diff, changed paths from context.yaml,
# taxonomy = the short-term copy of standards/rules/pr.md.
meta:
  pr: 988
  base: main
  head_checked: plan/717/base (working tree; the 7 code/doc files and the 52 records match HEAD, no uncommitted change in changed_paths)
  diff_path: .garura/project/issues/717/review/pr.diff
  taxonomy_path: .garura/project/issues/717/context/memory/standards/rules/pr.md
  changed_paths_count: 59
  scanner_exit: 0
  scanner_errors: 0
  scanner_raw_counts: {P1: 1, P2: 8, P3: 16, P4: 4}
  scanner_catchall_CODE-20: 6
  scanner_note: >-
    The scanner classes core/components/plays/list-plans/scripts/check_list.py as garura-prose
    (the core/components/** glob), so no grep or path rule ran on it. It is a python script the
    runtime executes, so it was read by hand (findings Q1 and Q3). The scanner raised nothing on
    the 52 run records (stm-evidence gets no finding by the taxonomy's scoping rule).

runnable_checks:
  - name: plan tool suite
    command: python3 -m unittest discover -s core/tools/plan -p "test_plan.py"
    result: "ran: 17 tests, OK, 0 failures, 0 errors, 0 skipped (the one skipTest at test_plan.py:236 is older than this diff and did not fire)"
  - name: language linter (ruff)
    command: ruff check --no-cache (defaults) on plan.py, check_list.py, test_plan.py, base (main) against head
    result: >-
      ran with ruff defaults, because the repo commits no python linter config (so this is not a
      repo gate). Base: 3 findings (E731 lambda, check_list.py, check_list.py, test_plan.py).
      Head: the same 3, only moved by the line shift. None new. With a 100-column limit: base 21
      long lines, head 22; the one new long line is plan.py:197 (Q2).
  - name: check_list.py end to end
    command: plan.py list over .garura/project/plans, run twice, then check_list.py hash and check (output to scratch, nothing in the repo written)
    result: "ran: check.json ok true (all_listed, in_order, template_used, as_set, same_twice, unchanged all true). The two views are byte-identical. The plan files are unchanged (git status clean for them)."
  - name: data-safety by hand (plan.py, check_list.py)
    result: >-
      PASS. listing() only builds a list of lines. check_list.py opens plan files, template and
      views for reading and writes only the file given by --out. No plan file is written. The
      as_set slice view[i+1:i+4] cannot go out of range (a python slice is clipped), and a card at
      the end of the output still compares correctly (the last card ends with its Progress row,
      checked on the real plans).
  - name: stray debug, secrets, home paths in the 3 code files
    result: "PASS. No print debugging, breakpoint, TODO, FIXME, name or home path in the added code lines (check_list.py prints its result record by design, as before)."
  - name: ICE fingerprint (harness check that bears on the script)
    result: "sha256 of reference/ice.md is 004240ca...dc2dd4, equal to the fingerprint row in list-plans/SKILL.md."
  - name: issue-work-records, no home-folder path
    result: >-
      PASS. Added lines of the 52 records hold no user home prefix, /home/ prefix or drive-letter path. The only
      home-style hits are ~/.phoenix/... (11 lines, allowed form) and one review note that names
      a home prefix as the thing it searched for. No git author name or email appears.
  - name: issue-work-records, valid JSON and YAML
    result: "PASS. Every .json and .yaml of the 52 parses (read from HEAD with json and yaml.safe_load): 0 failures."
  - name: issue-work-records, no secrets
    result: >-
      PASS. 25 hits of key/secret/password/token words, all prose or rule text (review wording,
      taxonomy rows, the test title 'A person resets a lost password'). No ghp_, sk-, AKIA, xox
      or private-key header, and no long random string other than sha256 hashes.
  - name: issue-work-records, only this plan's own issues
    result: "PASS. All 52 paths are under .garura/project/issues/717/ (5) or .garura/project/issues/986/ (47). No other issue's folder."

findings:
  - id: Q1
    severity: P2
    file: core/components/plays/list-plans/scripts/check_list.py
    what: >-
      The changed check logic (the new card() helper and the as_set comparison of the direction
      line, blank line and Status row, and the narrowed heading match) has no test. No test file
      in this diff or in core/ imports check_list.py. The play's own run exercises it, and it
      passed on the real plans, but no test would catch a wrong card being accepted or a right
      card being refused.
    basis: TEST-01 (new code without a test, P2 in pr.md); scanner did not fire it (garura-prose classification), confirmed by hand
    disposition: confirmed
  - id: Q2
    severity: P4
    file: core/tools/plan/plan.py
    what: >-
      Line 197, inside the listing() docstring, is 152 characters. The edit joined two sentences
      without re-wrapping, so the docstring wraps at about 100 columns on its first line and then
      runs far past it. Every other line in the three python files is under 140.
    basis: pr.md bucket P4 (style only); nearest scanner row CODE-04 (format), which is a path-only rule and fires on every .py file
    disposition: confirmed
  - id: Q3
    severity: P4
    file: core/components/plays/list-plans/scripts/check_list.py
    what: "The new inner function card(h, direction, status) never uses its first argument h; the caller passes a heading it does not need."
    basis: pr.md bucket P4 (style only); nearest scanner row CODE-17 (identifier), a path-only rule
    disposition: confirmed

