# Layer 2 design-grounding of the 'plan-records' category, PR #1017 (plan 717 landing on main).
# Grounded only in origin/main (eee23a29): the plan-view template and work-plan rules (memory tool, phoenix c14f515d910f),
# the ontology Plan and Epic kinds, ADR 060 and .garura/user-provided/managing-work.md (git show origin/main).
# ADRs 061-064 do not exist on origin/main; they are not used as grounding.
category: plan-records
pr: 1017
base: main
artifact: .garura/project/plans/717.yaml
checks_done:
  - "Parses; plan status 'Done' is a value the template knows (list.plan_statuses); all 35 node statuses are Done or Dropped, both in the template's six. plan.py list exits 0 (see memory_dir plan-list-output.txt)."
  - "Plan status Done: yes (line 5)."
  - "Business intent #717 is not marked closed: GitHub state OPEN; PR body says 'Refs #717' and states it stays open; bi-717.md holds no closed mark; no 'Closes #717' in the branch commits."
  - "Every item against its own GitHub issue (gh issue view, read only): 32 of 35 match; 3 do not (finding PR-1). The 4 Dropped nodes (909, 991, 791, 965) are CLOSED NOT_PLANNED, matching."
grounding:
  - principle: "The plan's Tree gives each work item with its tracker issue and its state; the plan file and the tracker always agree."
    source: "origin/main core/components/memory/standards/schemas/product-os/ontology.md, Plan kind: Properties 'Tree' (line 573) and rule line 598; Epic kind property 'State: open or closed, as the tracker holds it'"
  - principle: "An epic stays open: it is not closed when its stories are done."
    source: "origin/main ontology.md, Epic kind rules (line 643)"
  - principle: "When a plan pauses its branch merges into main and is deleted, and the plan file says branch: null."
    source: "origin/main .garura/user-provided/managing-work.md, 'A plan's branch: start, pause, start again'; origin/main docs/adr/060 ('states what the field reads on a pause (null)')"
  - principle: "Direction is set by a person and shown as 'next' / 'next in line' / 'later'; a status shows as the plan file gives it."
    source: "plan-view template (memory tool, phoenix c14f515d910f), 'The list' section"
  - principle: "The kinds of tree item are epic, story, spike, chore, bug under a story; a Feature is never an issue."
    source: "origin/main ontology.md Plan/Epic/Story kinds, line 21; origin/main managing-work.md 'How does that land in the tracker?'"
findings:
  - id: PR-1
    severity: P2
    file: .garura/project/plans/717.yaml
    line: "75-78 (#730), 80-83 (#917), 96-99 (#931)"
    what: "Three items are marked Done in the plan but their own GitHub issues are still OPEN: #730 (story, line 75-78), #917 (chore, line 80-83), #931 (story, line 96-99). The PR body counts them in '31 items are Done'. Progress shown by /list-plans (30 done, 0 open) therefore overstates what the tracker holds. Their comments say 'landed on plan/717/base with #720', so the likely fix is to close the three issues (a person's call), not to change the plan."
    principle: "The plan's Tree shows each item with its tracker state and the plan file and the tracker always agree."
    source: "origin/main ontology.md Plan kind, line 573 and line 598; the branch's ADR 064 lets a person set an open item Done, but ADR 064 is not on main so it cannot ground this (a human may accept it as the branch's own decision)."
  - id: PR-2
    severity: P3
    file: .garura/project/plans/717.yaml
    line: "8, 14"
    what: "The plan lands with branch: plan/717/base and epic #956 closed. Under the base rule the plan's branch is deleted when it merges and the file says branch: null; until something writes null, /list-plans shows Branch plan/717/base and /list-plans --graph draws a branch that no longer exists. Nothing in the file or the PR says who sets it to null after the merge."
    principle: "A plan's branch merges into main when the plan pauses, is deleted, and the plan file says branch: null."
    source: "origin/main managing-work.md 'A plan's branch: start, pause, start again'; origin/main docs/adr/060, 'What this decision does: states what the field reads on a pause (null)'"
  - id: PR-3
    severity: P3
    file: .garura/project/plans/717.yaml
    line: "15-19"
    what: "Epic #956 is marked Done and its GitHub issue was closed as completed on 2026-10-31 (closedAt 17:11:51Z). The base ontology says an epic stays open and is not closed when its stories are done. The plan matches GitHub, so the file is consistent; the closure itself departs from the base Epic rule. Only the branch's own ontology v14/v15 text ('an epic ... can be closed with open stories') allows it, and that is not usable as grounding. A person should confirm the closure is wanted, or reopen #956 and mark it In Progress."
    principle: "An epic stays open: it is not closed when its stories are done."
    source: "origin/main ontology.md, Epic kind rules (line 643)"
  - id: PR-4
    severity: P4
    file: .garura/project/plans/717.yaml
    line: "6"
    what: "direction: 1 ('next') stays on a plan whose status is Done, so /list-plans prints the 'next' icon under a finished plan. Direction is the person's, so this is not wrong, only stale."
    principle: "Direction says what is next; it is set by a person and shown as the file gives it."
    source: "plan-view template (phoenix c14f515d910f), 'The list' section, Direction paragraph"
  - id: PR-5
    severity: P4
    file: .garura/project/plans/717.yaml
    line: "20, 37, 70, 113, 160 (kind: feature); 152 (kind: issue)"
    what: "The tree holds nodes of kind 'feature' (issue type Feature) between the epic and its stories, and one node of kind 'issue' (#791). Neither is a tree kind in the base ontology (epic, story, spike, chore, bug). Both are already in main's copy of this file, so the landing does not add them; the ontology's v14 on the branch names the 'feature item', which is not usable as grounding. The plan tool does not validate kind, so nothing fails."
    principle: "A tree holds epic, story, spike, chore and bug; a Feature is never an issue."
    source: "origin/main ontology.md line 21; origin/main managing-work.md 'How does that land in the tracker?'"
gaps:
  - "Playbook missing for plan-records (review/plan-records); no severity rows exist in pr.md for plan files, so P-levels are set by the bucket meaning only."
  - "ADRs 061 and 064 are not on origin/main (git show fails), so the rules the task asked to ground in them (cut by start-change; item status follows its own issue) cannot be grounded from main; the base ontology and ADR 060 were used instead."
  - "The Phoenix-tier ontology is old; the Plan and Epic kinds were read from the base-ref source file."
