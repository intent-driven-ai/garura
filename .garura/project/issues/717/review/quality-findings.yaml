  line: 207
  what: RepoPlansTest skips itself (self.skipTest) when the repository has no plans folder, and otherwise reads the repository's live plan files,
    so the test result changes when someone edits a plan. It ran, not skipped, in this check.
  basis: TEST-* family (skipped or disabled test); no matching taxonomy row is mechanical, assessor note
