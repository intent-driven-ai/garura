- id: QF-001
  severity: P2
  file: core/tools/plan/plan.py
  line: 176
  what: '''plan.py list'' and ''plan.py graph'' stop with a Python traceback (FileNotFoundError, exit 1) when git is not on
    the PATH or --repo is not a folder. list calls git for every plan with no ''branch'' field (plan_branch line 171 -> ref_of
    line 176). The module promises exit 0/1/2 (lines 18-20) and the check named ''no git on the machine'' fails. Reproduced
    with PATH=/nonexistent and with --repo /nonexistent. No test covers it.'
  basis: 'executable_code runnable check: error handling on git failures (pr.md P2: error-handling violations)'
  source: check
- id: QF-002
  severity: P3
  file: core/tools/plan/plan.py
  line: 79
  what: 'A plan file whose tree holds something other than a mapping (for example a plain string node) ends in AttributeError
    traceback instead of the exit-2 message the module promises for bad input (reproduced: tree: [''just a string'']). walk()
    line 89-92 and load_plans line 78-81 assume mappings.'
  basis: 'executable_code runnable check: error handling on file failures'
  source: check
- id: QF-003
  severity: P3
  file: core/components/skills/link-model-part/scripts/link_part.py
  line: 148
  what: 'A malformed request (a part that is a string, or a ''doc'' that is a number) ends in AttributeError traceback (exit
    1) instead of ''refused, nothing written'' (exit 2) as the docstring lines 43-48 promise. Reproduced with {''parts'':[''fn-1'']}
    and doc: 5. Nothing is written in these cases (the failure comes before the first write), so no data is lost. main() catches
    only Refused, OSError, ValueError, JSONDecodeError, YAMLError (line 247).'
  basis: 'executable_code runnable check: error handling; write path for the product model'
  source: check
- id: QF-004
  severity: P4
  file: core/components/skills/link-model-part/scripts/link_part.py
  line: 221
  what: 'write_all rolls back only on OSError, and the rollback itself (lines 222-226) is not guarded: a second failure while
    putting a file back replaces the first error and leaves the spine and pages out of step. After the spine and pages are
    written, the report write (line 260) is unguarded: if it fails the model is changed but the run ends in a traceback.'
  basis: 'executable_code runnable check: data-safety and idempotency paths (link_part.py)'
  source: check
