# standard, the glossary, and standards/rules read through the memory tool (Phoenix memory, version
# d68154ae75e9; copies in context/memory/grounding-harness/, manifest beside them).
# NOT used as grounding: anything this diff adds (plan-view.md, the new ice.md/SKILL.md prose, the
# keeper's new rule text, the #719 design.md), and no earlier review file (pr-950/, issues/719/review/).
pr: 981
issue: 717
base: main
category: harness
reviewed:
  - core/components/plays/list-plans/{SKILL.md,reference/ice.md,stop-condition.yaml}
  - core/components/plays/show-plan/{SKILL.md,reference/ice.md,stop-condition.yaml}
