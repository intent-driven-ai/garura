- id: M-1
  category: memory
  severity: P3
  file: core/components/memory/standards/templates/plan-view.md
  what: 'The template now carries content rules for a plan''s own Status (five values, among them Paused, "set by a person,
    never worked out") and Direction (1, 2, 3 or none). The single source of the work-plan rules says nothing of plan-level
    Status or Direction: its rule 19 gives only six node statuses (Not Started, In Progress, Now, Done, Blocked, Dropped).
    The template''s own "The statuses" section still says "Every node of a plan has one of six statuses" and has no pointer
    to the plan-level set, so a reader meets two status lists with no line saying which is which.

    '
  basis: G1 (templates define shape, rules define content; rules/work-plan.md is the single source), G3
  source: design-findings-memory.yaml
- id: M-2
  category: memory
  severity: P3
  file: core/components/memory/standards/templates/plan-view.md
  what: '"Waits on" is specified as "each plan it needs, with its title", and #983 says "never a bare number". The template
    does not say what is printed when a needed plan has no plan file, and the plan tool (plan.py, listing) then prints a bare
    "#N" with no title. That breaks "never bare numbers" for that case, and the template leaves the case open.

    '
  basis: 'G3 (work-plan.md rule 19 ''never bare numbers''), G5 (#983 Rules: Waits on)'
  source: design-findings-memory.yaml
- id: M-3
  category: memory
  severity: P3
  file: core/components/plays/shape-plan/scripts/write_plan_file.py
  what: 'Cross-check of the template''s new plan_statuses against the writer of plan files. The comment that /shape-plan writes
    at the top of every new plan file still reads "Status: Not Started | In Progress | Now | Done | Blocked | Dropped." The
    template''s plan_statuses are Not Started, In Progress, Paused, Done, Dropped, and plan.py now stops on any other value.
    Until /update-plan (#730) exists, a person sets Status by hand from that comment, and Now or Blocked would stop /list-plans,
    /show-plan and /graph. (Code file; reported here because the vocabulary it contradicts is the template''s.)

    '
  basis: 'G4 (the template is the source of the marks and values), G5 (#983: Status is Not Started, In Progress, Paused, Done,
    Dropped)'
  source: design-findings-memory.yaml
