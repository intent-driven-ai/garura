- id: MEM-1
  category: memory
  severity: P4
  file: core/components/memory/standards/templates/plan-view.md
  what: 'The example in ''The list'' shows a second card (#722) that ends after the Status row. It has no Branch row, no Waits
    on row, and no Epic/Progress rows. The prose above it says Branch and Waits on are always shown (Waits on blank when none),
    and the tool prints them for every plan (observed output for plan 722: Status, Branch, Waits on, Epic, Progress). A reader
    copying the example would think a plan with nothing to wait on drops those rows. The first card is complete; only the
    second is cut short, with nothing (such as an ellipsis) saying so.'
  basis: 'Principle: the template''s example must show the shape its own rules and the tool print, because the template is
    the ''what should this look like?'' reference. Sources: main:core/components/memory/standards/templates/plan-view.md (''Waits
    on — always shown ... blank when none''; Branch shown, ''main'' when none); standards/templates/_index.md, Phoenix memory
    copy (''It answers what should this look like?''). No pr.md row fires for this; classed P4 (nit: illustration only, no
    effect on the tool, which reads the settings block, not the example).'
  source: design-findings-memory.yaml
- id: PLAN-1
  category: plan-records
  severity: P4
  file: .garura/project/plans/717.yaml (line 8, comment on `branch`)
  what: 'The comment says plan/717/base "merged into main on 2026-10-29 after #719, #983 and #986 landed". This diff adds
    #986 to that sentence, but the branch has not merged: PR #988, the PR under review, is the merge, and the branch still
    exists. The sentence is true only after PR #988 lands. The sentence was already on main before this PR (main''s file names
    #719 and #983 with the same wording), and the value `branch: null` is what ADR 060 says a pausing plan reads, so the value
    is right; only the dated claim in the comment runs ahead of the merge.

    '
  basis: 'PR-3: ADR 060 records this exact drift as a known risk of keeping the field by hand until #730 (''Plan 717''s `null`
    is true only once PR #950 merges''). No rule forbids writing the value ahead of the merge, so this is a nit, not a violation.'
  source: design-findings-plan-records.yaml
