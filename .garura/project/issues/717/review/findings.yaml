findings:
- id: DOC-HAND-1
  category: code-and-tests
  severity: P4
  file: core/tools/plan/README.md
  what: 'The status paragraph still says only the six node statuses exist and that ''any other status'' is refused. This PR
    adds a separate plan-level status set (Not Started, In Progress, Paused, Done, Dropped) and a direction (1, 2, 3 or empty),
    and plan.py now refuses a plan file with another plan status or direction in list, show and graph alike (load_plans, plan.py:81-84).
    The README names neither, so a reader cannot learn that an older ''status: active'' plan file is now refused by every
    command.'
  basis: 'by hand: category documentation check ''the README''s list description agrees with what plan.py does''; plan.py:81-84;
    plan-view.md:116-117'
  source: quality-findings.yaml
- id: H-1
  category: harness
  severity: P3
  file: core/components/plays/list-plans/SKILL.md
  what: Step C1 (Evidence) still says the evidence file records the step and scenario eval results 'SE-1...SE-6 / SCE-1...SCE-5'.
    The play now defines SE-1...SE-7 and SCE-1...SCE-6, and the summary table at the end of the same file was updated to 7
    and 6. The new SE-7 and SCE-6 results (the only evals that prove C10/F8) would be left out of the evidence record.
  basis: 'P-evidence: evidence-recording.md (main) line 99, ''every eval the play defines''. Also internal drift between Step
    C1 and the file''s own summary table, which the ICE-recompile should have reproduced.'
  source: design-findings-harness.yaml
- id: H-2
  category: harness
  severity: P3
  file: core/components/plays/list-plans/reference/ice.md
  what: S1 now promises each plan's card 'with its Status, Branch and Waits on, and each epic with its Progress', but its
    Measure is still only all_listed and in_order. No eval of the play (check_list.py as_set checks heading icon and Status
    row only) measures Branch, Waits on, the epic lines or Progress, so the larger part of the agreed card design (Waits on
    always shown with a title, Branch 'main' when none, epics only, Progress counts, dropped only when any) is unguarded at
    the play level and rests on the plan tool's own unit tests alone.
  basis: 'P-eval (harness-standard principle 5; idd-principles: a success scenario carries a measure the eval runs); P-design
    (the rules of #983 that no play check covers).'
