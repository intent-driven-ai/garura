- id: M-7
  category: memory
  severity: P4
  file: core/components/memory/standards/templates/plan-view.md
  what: 'plan_statuses is read by load_plans, which every mode shares. After this change /show-plan and /list-plans --graph
    also stop on a plan file whose status is not in the new set (the seven plan files on main hold "active"). #983 puts the
    tree and the graph out of scope. This PR rewrites all seven plan files to Paused, so nothing breaks today; a plan file
    on another branch with the old value would stop the tree and the graph with its file named.

    '
  basis: G5 (#983 Not in scope); main:core/components/plays/show-plan/SKILL.md ("a plan file with a status the template does
    not know stops the play")
  source: design-findings-memory.yaml
- id: PLAN-1
  category: plan-records
  severity: P2
  file: '.garura/project/plans/606.yaml, 717.yaml, 722.yaml, 734.yaml, 756.yaml, 767.yaml, 788.yaml (line `status: Paused`)'
  what: 'All seven plan files now carry the plan status `Paused`. The committed definition of a plan''s Status on main is
    active, done or dropped, and the ontology is not in this PR''s changed paths, so the model and the files disagree after
    the merge: a reader of the ontology cannot know `Paused` exists, and the plan-level `Now` property ("while active") still
    depends on `active`. The tool that writes new plan files on main wrote `status: active`; the PR changes that script to
    write `Not Started`, which is a third value outside the ontology''s three. The vocabulary is changed in files, tool and
    template, but the ontology (the committed standard for the kind) is not changed in the same PR.

    '
  basis: 'PR-1 (ontology v13, kind Plan, Status row; ADR 060 line 62). The new vocabulary appears only in issue #983''s text
    (PR-5), which is not a committed source. Per the plan-records category rubric, Paused is new in this PR, so this is a
    gap in the committed vocabulary.'
  source: design-findings-plan-records.yaml
- id: PLAN-2
  category: plan-records
  severity: P3
  file: .garura/project/plans/606.yaml, 717.yaml, 722.yaml, 734.yaml, 756.yaml, 767.yaml, 788.yaml (new `direction:` key)
  what: 'A new top-level `direction` key (1, 2, 3 or empty) is added to every plan file. The ontology''s Plan Properties table
    on main has no Direction property, and the Plan kind''s rules do not mention it. The key is set by a person and the tool
    reads it; nothing committed on main says what it means or who may set it. Its only definition is issue #983''s text.

    '
  basis: 'PR-5 against PR-1/PR-4: the ontology (main) is the committed definition of what a plan holds; Direction is not in
    it. Grounding unavailable on main for this key.'
  source: design-findings-plan-records.yaml
- id: PLAN-3
  category: plan-records
  severity: P3
  file: .garura/project/plans/606.yaml, 717.yaml, 722.yaml, 734.yaml, 756.yaml, 767.yaml, 788.yaml (header comment line 2,
    unchanged)
  what: 'The header comment in every file still says `Status: Not Started | In Progress (...) | Now (...) | Done | Blocked
    | Dropped`. Read next to `status: Paused` on a later line, it reads as the list of values for the file''s `status:` key,
    and Paused is not in it. It is the node vocabulary only. The header says nothing about the plan-level Paused or about
    `direction`. Each file contradicts its own header.

    '
  basis: 'PR-3 (work-plan.md rule 19 and plan-view.md: six node statuses) is correct for nodes; the header does not separate
    node status from plan status. The category''s own by-hand check asked that the header list the vocabulary the file uses.'
  source: design-findings-plan-records.yaml
- id: PLAN-4
  category: plan-records
  severity: P4
  file: .garura/project/plans/734.yaml (line 6)
  what: 'The reason that sat on the status line (`more work to file under Epic #958`) moved to a stand-alone comment line
    between `direction:` and `started:`. It no longer attaches to a key, and it explained why the plan was `active`; with
    `Paused` it reads as a stray note. The same-day product-owner wording is kept, so no information is lost.

    '
  basis: PR-4 (the plan file stays readable as the record of where the work stands); nit only.
  source: design-findings-plan-records.yaml
