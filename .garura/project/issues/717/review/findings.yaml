  summary: 'Still lands unfixed (recorded as N1, P2, in .garura/project/issues/989/review/design-findings-harness.yaml, approved
    with it open). The ICE''s Done means holds D1 to D8, but the play bakes them into two hand-made manifests: D1 to D4 in
    stop-condition.yaml and D5 to D8 in stop-condition-plan.yaml. The compiler writes one stop-condition.yaml whose content.done
