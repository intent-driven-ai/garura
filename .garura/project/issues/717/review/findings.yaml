  file: core/components/memory/standards/schemas/product-os/ontology.md
  line: null
  summary: 'v14 ''catches up'' the Plan kind but leaves six statements that a slice shaped later for an intent that already
    has a plan is added to that plan by the plan play (/shape-plan). The same PR changes pipeline-next.md to say the opposite:
    /shape-plan stops when the intent has a plan and a later slice joins through /update-plan. The ontology''s Plan kind and
    Q30 now contradict the Next-line map, and a reader of the ontology is sent to the wrong play.'
  basis: 'A memory standard must not contradict its sibling standards; the ontology states ''what must always be true'' and
    its Log entry for a version has to cover every statement the change makes untrue (review/memory rubric: avoid contradicting
    existing knowledge).'
  category: memory
