    severity: P3
    file: core/components/plays/list-plans/reference/ice.md
    what: >
      The Intent paragraph (line 9) still says each card shows "the plan's direction, its
      number and business intent", in that order. This PR moves the direction to its own line
      under the heading (S6 now says so, and the SKILL.md description says "number and business
      intent, its direction ... on the line under"). The ICE intent statement was not brought in
      line with its own scenario, so the source the play is compiled from now states the old
      order while S6 states the new one.
    basis:
      principle: "G1: the ICE is what the team agreed and the compiled part must not drift from it. The compiled description (SKILL.md) and the ICE intent statement now say different things about the card."
      source: "docs/standards/harness-standard.md principle 4 (base ref); base ice.md line 9 (git show main:core/components/plays/list-plans/reference/ice.md) shows the intent text this PR left unchanged"
    suggested_fix: "Reword the Intent paragraph so the order reads number and business intent, then the direction on the line under, and recompile through /edit-play (the fingerprint then changes again)."
  - id: H2
    severity: P4
    file: core/components/plays/list-plans/reference/ice.md
    what: >
      The Context line that lists the stories the play was compiled from (line 64: #729, #806,
      #983) does not name #986, while SKILL.md Compiled From and the compiled_by row now cite
      #986. The two provenance lists disagree.
    basis:
      principle: "G1: the compiled part and its ICE agree on where the play came from (the #983 change added its story to both)."
      source: "docs/standards/harness-standard.md principle 4 (base ref); base ice.md Context lines, which name #983 in the same list"
