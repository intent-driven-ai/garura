pr: 988
base: main
category: harness
changed_artifacts:
  - core/components/plays/list-plans/SKILL.md
  - core/components/plays/list-plans/reference/ice.md
severity_note: >
  The PR severity taxonomy (standards/rules/pr.md, short-term copy) holds no row for harness
  prose, and classes core/components/** as garura-prose, so no grep rule can fire on it. The
  severity below follows the taxonomy's bucket definitions: P3 minor (docs, naming), P4 nit
  (style only).

grounding:
  principles:
    - id: G1
      principle: "A play is compiled from its ICE. A change to what a part guarantees is made in the ICE, and the part is compiled again. The compiled part records a fingerprint of its ICE so the two never drift apart unseen."
      source: "docs/standards/harness-standard.md, principle 4 (git show main:docs/standards/harness-standard.md); ADR 027"
    - id: G2
      principle: "An intent change (the intent statement, constraints, failure conditions, scenarios, the flow, evals) goes through the play's ICE source and /edit-play. A compiled SKILL.md is never hand-edited for an intent change."
      source: "CLAUDE.md, section Play Pipeline Rules, on the base ref"
    - id: G3
      principle: "Plays orchestrate, agents gather context, skills do the work, and mechanical work is a script. A play hands out contracts of paths and reads no memory itself; templates come through template-manager."
      source: "docs/standards/harness-standard.md, principles 2 and 3; docs/adr/039-memory-writes-go-to-short-term-memory-plays-read-no-memory.md section 2 and section 8"
    - id: G4
      principle: "The Standard Play Close lives once, in the shared play-close file. A play carries only its anchor pair, its own values and its own close steps."
      source: "core/components/plays/_shared/play-close.md and CLAUDE.md (Durability rule), both on the base ref; core/components/memory/standards/rules/evidence-recording.md (memory tool copy in the grounding folder)"
    - id: G5
      principle: "A play that serves the guarantee must stay read only where its ICE says so (C2), and the check must be deterministic."
      source: "core/components/plays/list-plans/reference/ice.md on the base ref (git show main:...), constraints C1, C2, C4, C10 and failure F8, which the PR leaves unchanged"
  gap: >
    No principle was found only in branch-added text. The review shelf playbook (review/harness)
    names user-facing-voice as a standard a play is subject to; it governs the orchestrator's
    replies to a person, not the text a tool prints, so it was read (memory tool copy) and found
    not to bear on this change.

