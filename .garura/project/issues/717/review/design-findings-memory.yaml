principles:
  - id: PR-1
    principle: "A work plan's status tree is the GOAL / DONE / NOW / NEXT / WAIT tree; every line says in plain words what the item is, with its issue number."
    source: "git show main:docs/adr/030-plan-mode.md, 'Work This Creates' item 7; git show main:core/components/memory/standards/rules/work-plan.md rule 19 (prior text)"
  - id: PR-2
    principle: "An accepted decision record is never edited. A decision that changes part of it names it in `amends`, and the older record gets a forward pointer (`amended_by`)."
    source: "memory tool: standards/templates/adr.md (core fields amends, amended_by); git show main:docs/adr/030-plan-mode.md header (Status line holds the forward pointers)"
  - id: PR-3
    principle: "work-plan.md is the single source of the rules for work plans, the plan kept at {stm_base}{issue}/specs/plan.md; its template gives status active|done|dropped and one `now` item."
    source: "git show main:core/components/memory/standards/rules/work-plan.md (title, 'Where it lives', rule 8); git show main:core/components/memory/standards/templates/work-plan.md (front matter)"
  - id: PR-4
    principle: "The Plan kind is a file at .garura/project/plans/<id>.yaml; its Status is active, done or dropped; its Now is one work item; a node's state is named in the Tree property but its values are not defined."
    source: "git show main:core/components/memory/standards/schemas/product-os/ontology.md, '### Plan' (Lives at, Properties table). The memory tool's Phoenix copy (d68154ae75e9) has no Plan kind, so main is the committed source here."
  - id: PR-5
    principle: "A template is the canonical output shape; consumers instantiate it instead of inlining their own shape."
    source: "git show main:core/components/memory/standards/templates/_index.md, opening paragraph"
  - id: PR-6
    principle: "pipeline-next.md is the one place the Next-line map lives, and its prose describes where a person goes when a play has no successor."
    source: "git show main:core/components/memory/standards/rules/pipeline-next.md (opening paragraphs, 'The flow'); git show main:docs/adr/051-the-next-play-is-dropped-the-plan-is-the-work-list.md ('a new play that reads the plan files')"
  - id: PR-7
    principle: "A change to a shelf follows the shelf's own shape: a file is listed in its index; cross-references resolve."
    source: "memory tool: knowledge/review/memory.md (Treatment, Linter); standards/rules/_index.md and standards/templates/_index.md"

