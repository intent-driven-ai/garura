  - "templates/product-ontology.md: the Phoenix copy differs from main (skill name, the Layer / In the tracker lines). Main's version was used for the Log and version rule."

checks_passed:
  - "Cross-reference and index: templates/_index.md lists plan-update.md with consumer /update-plan; rules/_index.md git.md row names the plan/ branches. The other changed rules were already listed. No [[...]] or evolve_when links in the ten files."
  - "Templates reach plays only through template-manager: plan-update.md says the play gets its copy from template-manager (ADR 039 section 8). update-plan/SKILL.md lists template-manager loading standards/templates/plan-update.md and plan-view.md, and render_screen.py takes the template as an argument. All 71 keys in the plan-update settings block are used by render_screen.py. No added line in the ten files names a memory path or core/tools."
  - "Ontology recording: ontology.md moves 13 -> 15 with a Log entry for each version (v14 2026-10-30, v15 2026-10-31); v14 lists the Q41-Q47 additions and the Q1/Q4/Q7/Q20/Q22/Q23/Q38 changes and they match the diff. check_ontology.py returns valid:true on the branch file (and on main's)."
  - "No client or personal reference: the added lines hold no client, person, employer, e-mail or machine-path text. Issue numbers in plan-update.md are Garura's own work items."
  - "direct-model-write.md: the /update-plan exception follows the pattern of the two existing declared exceptions (approval first, nothing to revert, containment kept, guard run once before the commit). plan_branch.py go and scoped_write_guard.py exist on the branch. The L-DMW-4 carve-out is worded as the loop-contract carve-out is."
  - "git.md, pipeline-position.md and CLAUDE.md on main agree on plan/<id>/base and plan/<id>/<issue>-<slug>, cut from the plan's branch. spine.yaml's Thin comment matches check_ice_workable.py (any line starting 'Thin:' before the ICE counts) and the ontology's ICE rules."
  - "plan-view.md new tree rule matches core/tools/plan/plan.py finished_children(); no contradiction with the base rule that Done and Dropped are hidden."

findings:
  - id: MEM-1
    severity: P3
    file: core/components/memory/standards/schemas/product-os/ontology.md
    lines: "116-117 (Q30), 427 (Epic: 'made when the plan play adds the slice to a plan'), 583 (Plan 'What it is'), 615 (Plan rule), 640 and 642 (Shop and Clinic examples) - line numbers in the branch file"
    what: "v14 'catches up' the Plan kind but leaves six statements that a slice shaped later for an intent that already has a plan is added to that plan by the plan play (/shape-plan). The same PR changes pipeline-next.md to say the opposite: /shape-plan stops when the intent has a plan and a later slice joins through /update-plan. The ontology's Plan kind and Q30 now contradict the Next-line map, and a reader of the ontology is sent to the wrong play."
    principle: "A memory standard must not contradict its sibling standards; the ontology states 'what must always be true' and its Log entry for a version has to cover every statement the change makes untrue (review/memory rubric: avoid contradicting existing knowledge)."
    sources: "memory-tool copy knowledge/review/memory.md (rubric); main:core/components/memory/standards/templates/product-ontology.md (purpose and Log). The contradicting text is the branch's own pipeline-next.md (lines 22 and 58 in the diff) and the branch ADR 063, cited as the other half of the conflict, not as grounding."
    suggested_fix: "Reword Q30, the Epic tracker line, the Plan 'What it is' and rule 'A business intent has one plan', and the Shop and Clinic examples: the plan play makes the plan once; a later slice joins it through /update-plan. Add it to the v14 (or a v16) Log entry."

