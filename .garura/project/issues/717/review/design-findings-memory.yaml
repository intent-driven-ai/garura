findings:
  - id: MEM-1
    severity: P3
    file: core/components/memory/standards/rules/work-plan.md
    line: 47
    what: >
      Rule 19 replaces the GOAL / DONE / NOW / NEXT / WAIT tree with a tree of six statuses that hides Done
      and Dropped, and no decision record carries the change. ADR 030 item 7 is the committed source of the
      old rule: its tree has a DONE group and a WAIT-on-a-human group. The diff changes no file under docs/adr/,
      so ADR 030 has no `amended_by` pointer and no ADR names this change in `amends`. The rule file is the only
      place that now disagrees with ADR 030.
    basis: "PR-1 and PR-2: git show main:docs/adr/030-plan-mode.md (item 7; Status line); standards/templates/adr.md (amends, amended_by)"
    suggested_fix: "Record the decision (an ADR that amends ADR 030 item 7, with the forward pointer on ADR 030), or show that it was recorded elsewhere."
  - id: MEM-2
    severity: P3
    file: core/components/memory/standards/rules/work-plan.md
    line: 47
    what: >
      Rule 19 now describes the status view of the plan files (.garura/project/plans/<id>.yaml, read by
      /show-plan), but the file it sits in is the rulebook for the work plan at {stm_base}{issue}/specs/plan.md.
      The file's title, 'Where it lives' and its template (status active|done|dropped, one `now`) are unchanged
      and still describe the other artifact. A reader of rules 1 to 18 meets "Every node has one of six statuses"
      with no word on which plan it means or how it relates to the active|done|dropped status and the single
      `now` of rules 8 and 17.
    basis: "PR-3 and PR-4: git show main:.../rules/work-plan.md (title, 'Where it lives', rules 8 and 17); git show main:.../templates/work-plan.md (front matter); ontology '### Plan' (Lives at)"
    suggested_fix: "Say in rule 19 which plan it shows (the plan file), or give the plan-file view its own rule and leave rule 19 for the work plan."
  - id: MEM-3
    severity: P3
    file: core/components/memory/standards/templates/plan-view.md
    line: 19
    what: >
      The six node statuses (Not Started, In Progress, Now, Blocked, Done, Dropped) are defined only here, in the
      branch's own new text. The committed Plan kind gives the plan one Status of active, done or dropped, one
      `Now` item, and says a node has a 'state' without naming the values; ADR 051 speaks of done / now / next.
      The template lets many nodes be Now at once ('someone works on it in an open change right now'), which the
      ontology's single `Now` does not. No committed source anchors the vocabulary, so it cannot be checked against
      anything outside this branch.
    basis: "PR-4: git show main:.../ontology.md '### Plan' (Properties: Tree, Now, Status); git show main:docs/adr/051-... (done / now / next)"
    suggested_fix: "Have the ontology's Plan kind (through /edit-ontology) or the decision record from MEM-1 carry the six statuses, so the template points to a committed definition."
  - id: MEM-4
    severity: P3
    file: core/components/memory/standards/templates/plan-view.md
    line: 76
    what: >
      The template says a change to a mark or a line is made in its settings block, never in the tool, and each
      status has a `shown` setting. The tool does not honour that fully: core/tools/plan/plan.py counts a plan's
      open nodes as every status except the literal names Done and Dropped (list view), and picks 'worked now' by
      the literal names Now and In Progress. Setting `shown: true` on Done would change the tree and leave the
      list's open count unchanged, so the two views would disagree.
    basis: "PR-5: git show main:.../templates/_index.md (templates are the canonical shape; consumers do not inline their own); plan-view.md's own Settings sentence"
    suggested_fix: "Make the list read `shown` from the block, or reword the Settings sentence to say which names the tool fixes."
  - id: MEM-5
    severity: P4
    file: core/components/memory/standards/rules/pipeline-next.md
    line: 15
    what: >
      The prose still tells the person to pick the next piece of work 'from the plan (one plan for each business
      intent, with done / now / next) or from /list-focus-issues'. The same file now maps two plays, /list-plans
      and /show-plan, that show those plans, and the plan has six statuses. 'The flow' names /list-focus-issues
      under the Learn loop bullet and says nothing of the two new plays. The text is stale beside the new rows.
    basis: "PR-6: git show main:.../rules/pipeline-next.md (opening paragraphs, 'The flow'); ADR 051 (the plan is the work list)"
  - id: MEM-6
    severity: P4
    file: core/components/memory/standards/rules/pipeline-next.md
    line: 75
    what: >
      The two new rows do not line up with the row above (`list-focus-issues:          {`). The yaml still parses,
      so this is layout only.
    basis: "PR-6: the neighbouring rows of the Navigation group in git show main:.../rules/pipeline-next.md"

