principles:
  - id: G1
    principle: "A templates/ file defines the shape of an output artifact; rules about artifact content belong in rules/. Rules for work plans have one source (rules/work-plan.md), which skills do not restate."
    source: "main:core/components/memory/standards/templates/_index.md ('When to Add Here'); main:core/components/memory/standards/rules/work-plan.md (opening paragraph, rule 19)"
  - id: G2
    principle: "The templates index lists every template with an accurate description and its consumers."
    source: "main:core/components/memory/standards/templates/_index.md (Contents table); review playbook memory.md (listed in the index)"
  - id: G3
    principle: "A plan's status is shown as a person set it and never worked out from the nodes under it; a plan is shown with plain-words titles, never bare issue numbers."
    source: "main:core/components/memory/standards/rules/work-plan.md rule 19; the agreed design, issue #983 (Rules: Status, Waits on)"
  - id: G4
    principle: "The template's settings block is the only place marks and lines live; the plan tool reads exactly the keys the template holds."
    source: "main:core/components/memory/standards/templates/plan-view.md (Settings: 'A change to a mark or a line is made here, never in the tool'); main:core/components/plays/list-plans/reference/ice.md C4"
  - id: G5
    principle: "The layout and rules of the card are those agreed in #983."
    source: "issue #983 body (The layout, Rules, Today's values, Not in scope)"
  - id: G6
    principle: "User-facing voice applies to replies to the user; artifact templates are outside its scope."
    source: "main:core/components/memory/standards/rules/user-facing-voice.md (Scope)"

findings:
  - id: M-1
    severity: P3
    file: core/components/memory/standards/templates/plan-view.md
    what: >
      The template now carries content rules for a plan's own Status (five values, among them Paused,
      "set by a person, never worked out") and Direction (1, 2, 3 or none). The single source of the
      work-plan rules says nothing of plan-level Status or Direction: its rule 19 gives only six node
      statuses (Not Started, In Progress, Now, Done, Blocked, Dropped). The template's own "The
      statuses" section still says "Every node of a plan has one of six statuses" and has no pointer
      to the plan-level set, so a reader meets two status lists with no line saying which is which.
    basis: "G1 (templates define shape, rules define content; rules/work-plan.md is the single source), G3"
    suggestion: "Add the plan-level Status and Direction rule to rules/work-plan.md (one line, rule 19 neighbour), and name the two vocabularies in the template's statuses section."

  - id: M-2
    severity: P3
    file: core/components/memory/standards/templates/plan-view.md
    what: >
      "Waits on" is specified as "each plan it needs, with its title", and #983 says "never a bare
      number". The template does not say what is printed when a needed plan has no plan file, and the
      plan tool (plan.py, listing) then prints a bare "#N" with no title. That breaks "never bare
      numbers" for that case, and the template leaves the case open.
    basis: "G3 (work-plan.md rule 19 'never bare numbers'), G5 (#983 Rules: Waits on)"
    suggestion: "State in the template what the line shows when the needed plan is missing (for example a plain 'no plan file'), and make the tool follow it."

  - id: M-3
    severity: P3
    file: core/components/plays/shape-plan/scripts/write_plan_file.py
    what: >
      Cross-check of the template's new plan_statuses against the writer of plan files. The comment
      that /shape-plan writes at the top of every new plan file still reads "Status: Not Started | In
      Progress | Now | Done | Blocked | Dropped." The template's plan_statuses are Not Started, In
      Progress, Paused, Done, Dropped, and plan.py now stops on any other value. Until /update-plan
      (#730) exists, a person sets Status by hand from that comment, and Now or Blocked would stop
      /list-plans, /show-plan and /graph. (Code file; reported here because the vocabulary it
      contradicts is the template's.)
    basis: "G4 (the template is the source of the marks and values), G5 (#983: Status is Not Started, In Progress, Paused, Done, Dropped)"
    suggestion: "Change the comment to the plan-level set, or point it at the template."

  - id: M-4
    severity: P4
    file: core/components/memory/standards/templates/_index.md
    what: >
      The index row for plan-view.md was not changed. It still describes "the list of every plan" and
      says the file holds "the six statuses ... their marks and the layout". It now also holds the
      plan-level Status set (with Paused) and the Direction icons. The file is listed, so the
      listing check passes; only the description is behind.
    basis: "G2"
    suggestion: "Update the row's description."

  - id: M-5
    severity: P4
    file: core/components/memory/standards/templates/plan-view.md
    what: >
      The Direction paragraph says "set by a person in the plan file" and "directional, not a
      ranking", but omits "never worked out from the work", which #983 states for Direction and which
      the template does say for Status. The blank case is covered only by "(or blanks)".
    basis: "G5 (#983 Rules: Direction)"

  - id: M-6
    severity: P4
    file: core/components/memory/standards/templates/plan-view.md
    what: >
      The Progress row is described as "done, open, and dropped when there are any" without saying
      what is counted. The tool counts the items under the epic and not the epic itself. #983 words
      it the same way, so the template matches the agreed text, but a person cannot tell from the
      template what "9 done" counts.
    basis: "G5 (the agreed text is silent; a gap, not a departure)"

  - id: M-7
    severity: P4
    file: core/components/memory/standards/templates/plan-view.md
    what: >
      plan_statuses is read by load_plans, which every mode shares. After this change /show-plan and
      /list-plans --graph also stop on a plan file whose status is not in the new set (the seven plan
      files on main hold "active"). #983 puts the tree and the graph out of scope. This PR rewrites
      all seven plan files to Paused, so nothing breaks today; a plan file on another branch with the
      old value would stop the tree and the graph with its file named.
    basis: "G5 (#983 Not in scope); main:core/components/plays/show-plan/SKILL.md (\"a plan file with a status the template does not know stops the play\")"

