pr: 1017
category: memory
base: main

grounding:
  - principle: "Memory is read only through the memory tool; a play gets a template or rule only through template-manager, which loads it through the tool into short-term memory. Plays name no memory path."
    source: "main:docs/adr/039-memory-writes-go-to-short-term-memory-plays-read-no-memory.md section 8; main:.claude/rules/garura-memory.md; main:docs/adr/035-agents-work-only-from-memory.md"
  - principle: "The canonical product ontology is the agreed map of the kinds and 'what must always be true'. Its version is bumped when a kind is added, changed or removed, and each change is recorded in its Log. check_ontology.py must pass."
    source: "main:core/components/memory/standards/templates/product-ontology.md (front matter 'version ... bumped when a kind is added, changed or removed'; the '## Log' section); main:core/components/skills/author-product-ontology/scripts/check_ontology.py"
  - principle: "A model-writing play edits the live model after one write-guard run; a play that writes first and asks later, or asks first and writes after, is a declared exception in direct-model-write.md. The tree is clean at entry; a rejected or aborted run leaves nothing to revert."
    source: "main:core/components/memory/standards/rules/direct-model-write.md ('What every model-writing play does' 4 and 7; the two 'Declared exception' paragraphs); main:docs/adr/026-direct-to-model-writes.md"
  - principle: "A template is listed in standards/templates/_index.md with its consumers; a rule change that alters a listed description updates the index row. A settings block is read by one script, and a change to how a screen reads is made in the block, never in the script."
    source: "main:core/components/memory/standards/templates/_index.md and main:core/components/memory/standards/templates/plan-view.md (Settings); Phoenix copy of standards/_index.md (grounding-memory)"
  - principle: "Branch naming and plan branches: the plan's work is on plan/<id>/base and merges into main when the plan pauses. Plan Status vocabulary Not Started/In Progress/Paused/Done/Dropped and Direction 1/2/3/none are already in plan-view.md on main."
    source: "main:docs/adr/060-a-plans-branch-merges-into-main-when-the-plan-pauses.md; main:core/components/memory/standards/templates/plan-view.md; main:CLAUDE.md (Work Tracking: plan/<id>/base, plan/<id>/<issue>-<slug>)"
  - principle: "Screens addressed to a person lead in product language; branch names, file paths and ids go in the appendix part."
    source: "user-facing-voice.md, Phoenix copy (grounding-memory), identical to main:core/components/memory/standards/rules/user-facing-voice.md"
  - principle: "Review/memory rubric: a changed memory file fits its shelf's purpose, resolves its cross-references, and does not duplicate or contradict existing knowledge."
    source: "knowledge/review/memory.md, memory-tool copy (context/memory/knowledge/review/)"

