# Layer 2 design-grounding: category "memory" (also covers the product-model pages), PR #981, issue 717.
# Base ref: main. Every principle below comes from a committed source on main or from the memory tool
# (copies in .garura/project/issues/717/context/memory/grounding-memory/). Nothing is grounded in text the diff adds.
category: memory
pr: 981
issue: 717
base: main
severity_counts: {P1: 0, P2: 2, P3: 4, P4: 4}

grounding:
  principles:
    - id: G1
      principle: "A plan's tree is the person's interface: it must tell a returning reader what is decided, built, shipped and still to do, and what waits on a human. ADR 030 section 0 and Work-This-Creates item 7 name the view GOAL, DONE, NOW, NEXT, WAIT (on a human)."
      source: "git show main:docs/adr/030-plan-mode.md"
    - id: G2
      principle: "Work-plan rule 10: a finished item says whether it was only decided, built or shipped. Rule 8: 'Now' is one item. Rule header: skills and agents read these rules, they do not restate them."
      source: "git show main:core/components/memory/standards/rules/work-plan.md (rules 8, 10, header); Phoenix copy of the base rule file differs on rule 19 only, see notes"
    - id: G3
      principle: "A decision that changes an accepted ADR's 'Work This Creates' item is recorded by a new ADR with an Amends line; accepted ADRs are never edited."
      source: "git show main:docs/adr/051-the-next-play-is-dropped-the-plan-is-the-work-list.md (Amends: ADR 045, ADR 048 'Work This Creates' items); core/components/memory/standards/templates/_index.md row adr.md ('accepted ADRs never edited; forward pointers both ways')"
    - id: G4
      principle: "The ontology is the agreed vocabulary, changed through /edit-ontology with a Log entry. Plan kind: Tree = each work item 'with its tracker issue and its state'; Now = 'the work item being worked on' (one); Status = active, done or dropped; Plan lives at .garura/project/plans/<id>.yaml."
      source: "git show main:core/components/memory/standards/schemas/product-os/ontology.md (Plan kind, Log v13); main plan 717.yaml header 'Status: done | now | next | blocked | dropped'"
    - id: G5
      principle: "The thin mark is kept in two places that agree: metadata.thin in the spine and one exact Thin line just before the ICE heading: 'Thin: proposed by `/shape-slice` from the person's answers; deepen with `/discover-capabilities`.' A page marked thin without that line is drift; a slice's own pages with a problem make /shape-slice invalid."
      source: "git show main:core/components/memory/standards/schemas/product-os/ontology.md (ICE kind rules); git show main:core/components/plays/shape-slice/scripts/slice_check.py (THIN_LINE, thin_problems, own-parts rule); .../shape-slice/scripts/persist_fills.py THIN_LINE"
    - id: G6
      principle: "Feature grounding heading contract: What it does, Inputs / Outputs, Rules & behavior, Acceptance criteria, Out of scope, then Sources, then Agent intent (ICE). The shared linter fails a page that lacks one."
      source: "memory tool: standards/schemas/product-os/grounding/feature.md (grounding-memory copy); git show main:core/components/plays/shape-slice/scripts/lint_grounding.py CONTRACTS"
    - id: G7
      principle: "A feature takes its business intents and order of work from its parent capability; a story is built from the feature's ICE and its capability's ICE. A child must not contradict the parent's intent."
      source: "git show main:core/components/memory/standards/schemas/product-os/ontology.md (Feature and Capability kinds, ICE rules)"
    - id: G8
      principle: "A file belongs in templates/ only if it defines the shape of an output artifact; rules for artifact content belong in rules/. rules/work-plan.md is the rules file for work plans (ADR 030, specs/plan.md); plans/<id>.yaml is a different file (ontology Plan kind)."
      source: "git show main:core/components/memory/standards/templates/_index.md ('When to Add Here'); git show main:core/components/memory/standards/rules/work-plan.md (header, 'Where it lives')"
    - id: G9
      principle: "pipeline-next.md is the single source for the Next-line map: a play with no single successor has command null and prints no Next line; the person picks from the plan or /list-focus-issues. A 'what next' view, if needed, is a new play that reads the plan files."
      source: "git show main:core/components/memory/standards/rules/pipeline-next.md; git show main:docs/adr/051-the-next-play-is-dropped-the-plan-is-the-work-list.md (sections 2 and 3)"
    - id: G10
      principle: "Model pages name roles, not real people. The ontology Log records the move ('personal names taken out ... #656') and writes 'with the product owner'; ADR 051 'Decided by: the product owner'."
      source: "git show main:core/components/memory/standards/schemas/product-os/ontology.md (Log 2026-10-18, v5-v13); git show main:docs/adr/051-... header"
    - id: G11
      principle: "Content standard: a stranger reading the doc can say what it is, why, and where its edges are; links are real."
      source: "memory tool: standards/schemas/product-os/grounding/_content-standard.md (grounding-memory copy)"
  notes:
    - "The Phoenix copies of standards/rules/work-plan.md, standards/rules/pipeline-next.md, standards/templates/_index.md and standards/templates/plan-view.md already carry this branch's text (promoted before the review). They are not independent grounding for those four files, so the base text was read with git show main:. The Phoenix ontology.md (v4, 205 lines) is older than main's v13 (856 lines); the principles above come from main's ontology, not from Phoenix."
    - "docs/philosophy/idsd.md is named by work-plan.md as the source of 'plan = human interface, model = agent interface'; ADR 030 section 0 states the same and is used instead."
    - "No committed source on main defines the six node statuses (Not Started, In Progress, Now, Done, Blocked, Dropped). Searched: docs/**, .garura/product/**, .garura/project/plans/**, core/components/memory/**, core/grounding/**. The only committed vocabulary is done | now | next | blocked | dropped (plan 717 header on main) and GOAL/DONE/NOW/NEXT/WAIT (ADR 030). See M-03."
    - "Playbook gap: review/memory.md signals name core/components/memory/** only; .garura/product/product-os/** has no playbook signal. These pages were reviewed here as the second folder of Garura memory (.claude/rules/garura-memory.md)."
    - "The rule that model pages use personas and not real names exists only in the owner's notes, not in a committed file. Not used as a basis; G10 rests on the ontology Log and ADR 051."

integrity_checks:   # checked by hand, each with the evidence
  passed:
    - check: "templates/_index.md has a row for plan-view.md"
      evidence: "core/components/memory/standards/templates/_index.md, new row after work-plan.md; file core/components/memory/standards/templates/plan-view.md exists"
    - check: "rules/work-plan.md rule 19 -> templates/plan-view.md resolves"
      evidence: "path core/components/memory/standards/templates/plan-view.md exists on the branch"
    - check: "plan-view.md settings block is the block plan.py reads"
      evidence: "core/tools/plan/plan.py line 33 BLOCK = ```yaml plan-view; the block parses (statuses, tree, list, graph); plan.py list, show --plan 717 and graph over .garura/project/plans exit 0 with the template"
    - check: "pipeline-next.md rows for list-plans and show-plan are valid against the map's own format"
      evidence: "yaml block parses, 30 rows, both rows { command: null, why: ... } like list-focus-issues, under # Navigation; plays core/components/plays/list-plans and show-plan exist; ADR 051 sections 2 and 3 agree"
    - check: "_spine.yaml entries for fn-628, fn-729, fn-806 resolve"
      evidence: "each doc: file exists; capability cap-719 and intent bi-717 exist; no duplicate feature id or issue number; fn-731 and fn-746 untouched in the spine"
    - check: "persona rewrite is complete and in the committed style"
      evidence: "git grep Kapil HEAD -- .garura/product returns nothing (10 lines on main); replacement 'the product owner' matches ontology Log and ADR 051"
    - check: "frontmatter id, [[...]] links, shelf _TEMPLATE shape"
      evidence: "not applicable: no knowledge/ shelf file changed; the changed files are rules, a template and an index"
  failed_or_noted: [M-01, M-02, M-03, M-04, M-05, M-06, M-07, M-08, M-09, M-10]
  linter_runs:
    - "python3 -I core/components/plays/shape-slice/scripts/lint_grounding.py --root .garura/product/product-os --spine .garura/product/product-os/_spine.yaml: main 70 errors, branch 74 errors; the 4 new ones are all fn-806 (missing four required sections). fn-628, fn-729, fn-731, fn-746 fail the same way on main (pre-existing)."
    - "slice_check.thin_problems over fn-628, fn-729, fn-806: three 'thin mark drift' problems (see M-02)."

findings:
  - id: M-01
    severity: P2
    file: core/components/memory/standards/rules/work-plan.md
    also: [core/components/memory/standards/templates/plan-view.md, .garura/product/product-os/features/fn-628/feature.md]
    what: >
      The rewritten rule 19 (and the plan-view template and fn-628 it points to) makes the plan tree hide every Done node
      and show only a count on the last line, drops the old Fails-if "a done line does not say decided, built or shipped",
      and replaces WAIT (on the human) with a plain Blocked ("cannot go on until something else is settled"). A reader coming
      back after two days can no longer see what is decided or built or shipped, and cannot tell what waits on a person.
      Rule 10 of the same file is unchanged and still says every finished item states its kind of done, so the rule file now
      contradicts itself.
    basis: >
      ADR 030 section 0 (the test of a plan: a business user understands what is decided, what is built, what is still to do)
      and Work-This-Creates item 7 (GOAL, DONE, NOW, NEXT, WAIT on a human); work-plan.md rule 10 on main.
      Sources G1, G2.
    suggested_fix: "Keep the Done kind (decided, built, shipped) visible or state why the tree may drop it, and keep a way to show 'waiting on a person'; or amend ADR 030 in a new ADR (see M-03)."

  - id: M-02
    severity: P2
    file: .garura/product/product-os/features/fn-806/feature.md
    also: [.garura/product/product-os/features/fn-628/feature.md, .garura/product/product-os/features/fn-729/feature.md, .garura/product/product-os/_spine.yaml]
    what: >
      The three feature pages carry the line "Thin: proposed by the #719 change (view plans) from the person's words; deepen
      with `/discover-capabilities`." The committed line is fixed and exact. The committed check (slice_check.thin_problems)
      reports "thin mark drift" for all three (spine says metadata.thin: true, but the exact Thin line is not just before
      '## Agent intent (ICE)'). Under the own-parts rule a slice that uses any of these features is not valid until the line
      is fixed. fn-628 and fn-729 were also re-marked thin although their ICE was person-written and unmarked on main, while
      the ontology defines a thin ICE as one /shape-slice proposed from the person's answers. The wording comes from the
      new link_part.py (core/components/skills/link-model-part/scripts/link_part.py line 81), so new thin pages will drift the same way.
    basis: "Ontology ICE kind rules (thin mark in two places that agree, exact Thin line); slice_check.py THIN_LINE and the own-parts rule on main. Source G5."
    suggested_fix: "Write the exact committed Thin line (or change the ontology and slice_check first, through /edit-ontology and an intent change); fix link_part.py to write the committed line; do not mark fn-628 and fn-729 thin unless their ICE is thin."

  - id: M-03
    severity: P3
    file: core/components/memory/standards/rules/work-plan.md
    also: [core/components/memory/standards/schemas/product-os/ontology.md (not changed), .garura/project/plans/*.yaml]
    what: >
      The branch changes the plan-node status vocabulary (done | now | next | blocked | dropped becomes Not Started, In Progress,
      Now, Blocked, Done, Dropped; "Now" may now be many nodes) and the tree view specified by ADR 030, but no decision record
      and no ontology Log entry comes with it. The only places that define the six words are the new template and the
      rule/feature text written for this change. The ontology Plan kind still says Now is "the work item being worked on" (one)
      and gives no node vocabulary.
    basis: "ADR 051 precedent: a change to another ADR's Work-This-Creates item is recorded by an ADR with Amends; accepted ADRs are not edited; ontology is the agreed vocabulary and changes through /edit-ontology with a Log entry. Sources G3, G4."
    suggested_fix: "Record the status vocabulary and the tree view in a short ADR that amends ADR 030 item 7, and log the node statuses in the ontology's Plan kind (one Now per plan or many, stated)."

  - id: M-04
    severity: P3
    file: .garura/product/product-os/features/fn-806/feature.md
    what: >
      The new page has only "What it does" and the ICE. The feature heading contract requires Inputs / Outputs, Rules & behavior,
      Acceptance criteria and Out of scope. The shared linter goes from 70 errors on main to 74 on the branch; the 4 new ones are this page.
      The same shape is already on main for other thin pages (fn-731, fn-628, fn-729, fn-746), so this adds one more instance of a known baseline, not a new kind.
    basis: "Feature grounding heading contract and lint_grounding.py CONTRACTS on main. Source G6."
    suggested_fix: "Fill the four sections, or have the contract say what a thin feature page must hold."

  - id: M-05
    severity: P3
    file: .garura/product/product-os/features/fn-806/feature.md
    also: [.garura/product/product-os/capabilities/cap-719/capability.md (not changed)]
    what: >
      fn-806 puts the graph under capability cap-719 and reads git (branches, commits ahead and behind). The capability's
      intent says "show plans from the plan files alone", its Fails-if says the same files must print the same way twice, and
      its one line names only "every plan, and any one plan as a tree". A graph that follows git changes when git changes with
      the plan files untouched. The parent was not updated for the new feature.
    basis: "Ontology Feature and Capability rules: a feature's intents and limits come from its parent capability, one ICE per capability, a story reads both. Source G7."
    suggested_fix: "Widen cap-719's intent and Fails-if to say git is read for the graph, or move the graph under a capability that allows it."

  - id: M-06
    severity: P3
    file: core/components/memory/standards/rules/work-plan.md
    what: >
      Rule 19 now describes what /show-plan prints from the plan files (.garura/project/plans/<id>.yaml), but this file is the
      rules for the work plan written to specs/plan.md (header, 'Where it lives', template work-plan.md). Two different files
      called "plan" now sit under one rule list, and the rule index row for the file still says "how status is shown (a tree)" with no mention of the plan tool.
    basis: "work-plan.md header and 'Where it lives'; ontology Plan kind 'Lives at'. Source G8."
    suggested_fix: "Say in rule 19 which plan it means, or move the tree rule to a rule file for the plan files."

  - id: M-07
    severity: P4
    file: core/components/memory/standards/templates/plan-view.md
    also: [core/components/memory/standards/rules/work-plan.md, .garura/product/product-os/features/fn-628/feature.md, .garura/product/product-os/features/fn-729/feature.md]
    what: >
      The six statuses and the "hide Done and Dropped, count them on the last line" rule are written in the template, in rule 19,
      and in three feature pages, and the order differs (template and settings: Blocked before Done; rule 19 and fn-628: Done before Blocked).
      The template also states behaviour rules, which belong in rules/.
    basis: "work-plan.md header (read, do not restate); templates/_index.md 'When to Add Here' (rules for content belong in rules/). Source G2, G8."
    suggested_fix: "Keep the list once (the template settings block) and point to it."

  - id: M-08
    severity: P4
    file: core/components/memory/standards/rules/pipeline-next.md
    also: [core/components/memory/standards/rules/_index.md (not changed)]
    what: >
      The prose still says the plan shows "done / now / next" (lines 14-15), the Flow list names /list-focus-issues but not
      /list-plans or /show-plan, and the work-plan.md row in rules/_index.md does not list the two new plays as consumers.
      The two new map rows themselves are valid.
    basis: "pipeline-next.md is the single source for the Next-line map and its prose; ADR 051 sections 2 and 3. Source G9."
    suggested_fix: "Update the 'done / now / next' phrase to the new words and add the two plays to the Flow line and the index consumers."

  - id: M-09
    severity: P4
    file: core/components/memory/standards/templates/plan-view.md
    what: >
      The opening says the plan tool prints each view "from the plan files alone ... no tracker read and no model call, so the
      same files print the same way every time", but the graph section reads commits ahead of and behind main from git.
      Its examples also name live items (plan 717, plan/788/base 4 ahead 3 behind, and #719 shown as Now although #719 is closed) that will go stale.
    basis: "Content standard: a stranger can say what it is and where its edges are; fn-806 itself says 'from the plan files and git alone'. Source G11."
    suggested_fix: "Say 'plan files, plus git for the graph'; mark the examples as invented."

  - id: M-10
    severity: P4
    file: .garura/product/product-os/_spine.yaml
    what: >
      The spine metadata for fn-628, fn-729 and fn-806 holds the prose "the #719 change (view plans)" in created_by / updated_by.
      On main every created_by is a play name (/shape-slice). `issue` and `deepen` are not in the spine schema either; they are already used on main, so only the new created_by value is new.
    basis: "git show main:core/components/memory/standards/schemas/product-os/spine.yaml (metadata fields are strings; main entries all use a play name). Source G5 (spine)."
    suggested_fix: "Name the writer the way the others do (a play or skill name)."

unavailable_grounding: []
