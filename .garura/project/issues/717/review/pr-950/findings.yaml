- id: N1
  category: harness
  severity: P3
  file: core/components/plays/start-change/SKILL.md
  line: 4
  basis: docs/standards/harness-standard.md at origin/main, section 4 (the compiled part matches its intent); CLAUDE.md
    at origin/main, 'Play Pipeline Rules' (the compiled file follows the ICE)
  what: The frontmatter description still says the play cuts "a feature branch off up-to-date main". The ICE intent
    (reference/ice.md:11-13) and the lead of the same file (lines 10-14) now say an issue in a plan gets a sub-branch
    of its plan's branch. The description of the other two plays was updated in the same change.
  impact: The description is what the skill list shows a person who picks the start play. It tells them the old
    branch model, so they may expect a feature branch for an issue that sits in a plan.
- id: N2
  category: harness
  severity: P4
  file: core/components/plays/merge-change/SKILL.md
  line: 172
  basis: review playbook review/harness (an eval must be able to fail for the right reason); docs/standards/harness-standard.md
    at origin/main, section 5
  what: Step 3 and the evals SE-6, SCE-1 and SCE-4 still say the run records are committed "on main" and that "main
    is level with origin". For an issue in a plan the script commits and pushes on the plan's branch (merge_pr.py
    pushes to the base it was given). SE-3 and SCE-5 are already right.
  impact: Read literally, the eval for a plan-branch landing checks the wrong branch. The scripts and stop condition
    are right, so no run fails; the text is out of date for the plan case.
- id: N3
  category: harness
  severity: P3
  file: core/components/plays/start-change/scripts/setup_branch.py
  line: 82
  basis: docs/standards/harness-standard.md at origin/main, section 3 (a script resolves the fact; it does not guess);
    review playbook review/harness (short-term copy)
  what: The fix for the stale plan branch (H10) deletes the local plan branch whenever origin shows none, using
    git branch -D. A failed lookup of origin (offline, or a host error) prints nothing, so _on_origin reads it as
    "not on origin". The delete also does not check that the local branch holds commits that exist nowhere else.
    The push on line 108 is not checked either, so a local-only plan branch is possible.
  impact: 'On a bad network day a live plan branch can be dropped and cut again from main, and any local-only commits
    on it are lost; the new branch then fails to push over the real one without a word. A safer rule: delete only
    when the lookup succeeded, and keep the old branch under a backup name instead of removing it.'
