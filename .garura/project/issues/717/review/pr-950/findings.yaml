  category: memory
  severity: P3
  file: .garura/product/product-os/features/fn-673/feature.md
  line: 4
  basis: 'Committed on origin/main. The page reads: "A plan''s branch merges into main only when every issue in
    the plan is closed, and only after every plan it needs has landed or been merged into it." The ontology rule
    that said the same is gone in v13, and harness-standard principle 8 and the work guide now say a plan''s branch
    merges into main when the plan pauses, with issues still open. A search of the repository (outside run records)
    found this page as the only other file that states the old rule.'
  what: An agent that reads the product model page for this feature learns the old landing rule and believes it
    still holds. The page is not in this diff and is outside the ontology, so it does not block this change. It
    is the one place left that keeps the old rule alive.
  impact: An agent that reads the product model page for this feature learns the old landing rule and believes it
