    row then
- id: H-9
  severity: P4
  category: harness
  file: core/components/skills/write-knowledge-brief/SKILL.md
  basis: 'G7 (CLAUDE.md: Claude reads the whole skill on every run; keep run history out of skill files).'
  finding: 'Both skills open with a story of one Kickoff run ("after a drive ran for an hour and then
    asked him eleven questions", a quote from Kapil). It explains why, but every run reads it and none
    acts on it. The decision record (ADR 042) and the issue already hold that history; keep the skills
    to what the skill does.

    '
  status: resolved
  resolution: fixed in fea9baf7
- id: M-1
  severity: P2
  category: memory
  file: core/components/memory/standards/rules/drive-contract.md
  basis: G-drive-contract; G-adr041. The rule says it is the single source and plays do not restate it.
  finding: 'The rule file was only given one new Related line. Rule 5 still describes the old flow: a
    question is written to open-<play>.json with for_person and examples, "the play never picks an answer
    for itself", and the drive asks the person its open questions "all at once". The branch''s plays and
    the shared drive run now do something different: the person gets a brief of at most seven gaps, each
    with our proposed answer (never example answers), and a gap the context settles is closed without
    asking. Nothing in the rule says when a play may close a gap with a proposed answer or as settled,
    or what the brief is. The rule and the plays now disagree, and a later play author reading the rule
    would build the old flow.

    '
  status: resolved
  resolution: fixed in fea9baf7
- id: M-2
  severity: P2
  category: memory
  file: core/components/skills/propose-answers/SKILL.md
  basis: G-guide (never answer from what you know without an approved memory update); G-adr041 (the drive
    never picks an answer for itself; nothing from the model is used before a person approves); G-drive-contract
    rule 5.
  finding: 'A gap the context "already settles" is closed as `settled` by the model''s own reasoning.
    The brief skill then drops it ("Drop anything the context settles"), so the person never sees it and
    no memory update records it. That is the model deciding that a question needs no answer, with no person''s
    approval and no trace in memory. The same skill also says that when it cannot draft an answer it should
    "propose the safest default", which is a guess dressed as a proposal. ADR 042 names `settled` as a
    decision, but ADR 042 is a Proposed claim, and the committed rules above forbid it. At least the settled
    gaps should be listed in the brief (as a line the person can overrule) or raised as a memory update;
    the human should decide.

    '
  status: resolved
  resolution: fixed in fea9baf7
- id: M-3
  severity: P3
  category: memory
  file: core/components/skills/propose-answers/SKILL.md
  basis: 'G-guide (''When no tier answers: raise a memory update'', with draft_source model); G-adr041
    s8 (the person''s typed word is what `decide` records).'
  finding: 'Our proposed answers (model-drafted) never go through the memory tool''s `propose`. They live
    in proposals.json and brief.json. When the person says "yes", record_review.py writes each one as
    the person''s answer (`from: person`, with `accepted_proposal: true`). The next round then reads them
    as approved. The person did type the word, so this may be acceptable, but it skips the tool''s own
    route for a drafted answer and its draft_source label, so the memory side never learns the answer
    began as a model draft.

    '
  status: resolved
  resolution: fixed in fea9baf7
- id: M-4
  severity: P2
  category: memory
  file: core/components/plays/search-knowledge/SKILL.md
  basis: G-adr039 s2 (a play reads no memory); G-guide (only agents call the tool); G-adr041 s8 (the one
    exception is `decide`, kept narrow).
  finding: 'Step 1 is "Owner: play (script)" and runs group_questions.py with --memory-tool, which calls
    the tool''s `updates` itself. build-knowledge Step 2 does the same through check_knowledge_build.py
    (also run by the play, with --memory-tool). So the play, not an agent, calls the memory tool. The
    calls are read-only lists of the issue''s own waiting updates, and they are better than main''s read-by-path,
    but the committed rule is that the play asks an agent for it. Either have knowledge-builder fetch
    the list and hand it over as a working file, or record the exception in ADR 042 (it widens ADR 041
    s8''s narrow one).

    '
  status: resolved
  resolution: fixed in fea9baf7
- id: M-5
  severity: P3
  category: memory
  file: core/components/plays/review-knowledge/scripts/record_review.py
  basis: G-adr041 s8 ('must stay limited to recording a person's typed word'); G-guide (promotion and
    approval are a person's act).
  finding: 'A bare "yes" is turned into an `approve` or `reject` for every knowledge page by copying our
    own recommendation, and the drive then calls `decide` for each. The person typed "yes", but the decision
    per page is our recommendation, not their word. The brief does list each page with its recommendation,
    so this may be intended. The human should confirm it fits the narrow `decide` exception.

    '
  status: resolved
  resolution: fixed in fea9baf7
