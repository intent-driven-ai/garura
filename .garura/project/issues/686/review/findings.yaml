resolved:
- id: H-1
  severity: P2
  category: harness
  file: core/components/plays/review-knowledge/scripts/record_review.py
  basis: 'G5 (drive-contract.md ''What a contract holds'': answers are keyed by play and question id;
    Shared Drive Run R4 writes answers.json keyed by play) and G1/G2 (a question one play cannot answer
    is closed by an answer the play can read on the next round).'
  finding: 'The person''s reply is recorded one answer per gap (gap G1, theme, answer), but the plays
    that asked the questions can only read answers by their own play and question id. R5b step 3 says
    "add the answers to answers.json" and nothing, in text or in a script, says how a gap answer becomes
    the answers of the plays'' questions. The way back exists only as a chain of three records (gap ->
    build group -> search group -> question ids) that no script walks. So on round n+1 the plays may not
    find the answers, reopen the same questions, and the drive may brief the person again on the same
    gaps. Add a mapping step (best a script in review-knowledge that writes the per-play answers) and
    test it.

    '
  status: resolved
  resolution: fixed in fea9baf7
- id: H-2
  severity: P2
  category: harness
  file: core/components/plays/search-knowledge/scripts/group_questions.py
  basis: 'G4 (ADR 039 section 2: a play is a pure workflow and reads no memory; the memory tool''s guide:
    only agents call the tool, a play asks its agents). G2 allows only the drive''s decide call.'
  finding: 'Both plays call the memory tool themselves, from a script the play runs: group_questions.py
    (search Step 1, "Owner: play (script)") and check_knowledge_build.py (build Step 2) run `memory.py
    updates`. This is better than the old direct read of the update files, but it is still the play, not
    an agent, asking memory. Either let the knowledge-builder agent write the waiting-updates list into
    the play''s working folder and have the scripts read that file, or record the exception in a decision
    record. As written, the play''s own text ("you never raise, decide or promote an update") and docs/components/plays.md
    ("reach memory only through the memory tool") do not tell the reader that the play itself makes these
    calls.

    '
  status: resolved
  resolution: fixed in fea9baf7
- id: H-3
  severity: P2
  category: harness
  file: core/components/skills/write-knowledge-brief/SKILL.md
  basis: 'G3 (ADR 035 section 5: researched content is used only after a person approves it, which presumes
    the person can judge it) and G8 (a checkpoint that is always answered ''yes'' is a rubber stamp);
    also G2 (ADR 041 section 8: an agent never decides a memory update).'
  finding: 'One typed "yes" now approves every researched knowledge page, and the page is shown only as
    one line plus our recommendation (C3, skill step 4). The old R5b showed each page with the questions
    it answers and its sources. The brief neither carries the page''s sources nor points to its text,
    so the person cannot judge web-researched content that is about to become approved memory. Also, the
    drive (a model) expands "yes" into per-page decisions and per-gap accepts; record_review.py checks
    only that every item has a decision, not that the person''s words support it. Show each page''s sources
    and a pointer to its text in the brief, and do not let a bare "yes" approve research the person was
    not shown.

    '
  status: resolved
  resolution: fixed in fea9baf7
- id: H-4
  severity: P2
  category: harness
  file: core/components/skills/propose-answers/SKILL.md
  basis: 'G3 (ADR 035 sections 5 and 6: nothing from the model alone; every decision names the memory
    it came from). The agent''s own MUST NOT list says ''no basis - no answer''.'
  finding: 'Skill step 4 says "if you cannot draft an answer, say why in basis and propose the safest
    default", and the ICE (C3) lets a basis be "reasoning". That is an answer from the model alone with
    no source, memory trace or research behind it, offered to the person as our proposal. It contradicts
    the agent definition ("Answer from the model alone: no quote, no trace, no research source, no basis
    - no answer") and the skill''s own rule "No basis, no proposal". Where nothing supports a proposal,
    the gap should be raised the ADR 035 way (a memory update with the model named as the draft source)
    or stay an honest open gap with what is missing, not a default.

    '
  status: resolved
  resolution: fixed in fea9baf7
- id: H-5
  severity: P3
  category: harness
  file: core/components/plays/review-knowledge/scripts/record_review.py
  basis: 'G3 (ADR 035 section 6: every decision names its memory and where it came from) and G4 (ADR 039
    section 1: the person''s answer is kept in short-term memory).'
  finding: 'An accepted proposal is written as the person''s own answer (`from: person`) and then copied
    into answers.json / answers-sources.json as `from: person`. The text of that answer came from the
    model; the person only said yes. The record keeps `accepted_proposal: true`, but the source label
    the plays and the checker read says the person wrote it. Label an accepted proposal as ours, confirmed
    by the person (for example `from: person (accepted proposal)`), so later rounds and the checker can
    tell the two apart.

    '
  status: resolved
  resolution: fixed in fea9baf7
- id: H-6
  severity: P3
  category: harness
  file: core/components/drives/kickoff/reference/ice.md
  basis: G7 (an intent change goes through the ICE and a recompile, so the ICE must agree with itself)
    and G1 (what the drive does with the person is a drive guarantee).
  finding: 'C5 now says the person gets a brief and never a questionnaire, but the rest of the Kickoff
    ICE still describes the old behaviour: S3 says the owner is asked what is still open "once, after
    showing the draft" and the recovery for F5 says "ask the person only what no play answers"; the compiled
    SKILL repeats both (SCE-3, F5 row). The new guarantee ("never a questionnaire", "never a bare question")
    also has no failure condition and no recovery; it is only mentioned inside SE-5. Update S3, F5 and
    its recovery, add the failure condition, and recompile with /drive-editor so the fingerprint follows.
    (The compiled-drive-example was updated for S2 and F2 and does not have this gap.)

    '
  status: resolved
  resolution: fixed in fea9baf7
- id: H-7
  severity: P3
  category: harness
  file: core/components/plays/review-knowledge/SKILL.md
  basis: G6 (a play's mechanical steps are its own scripts; the play keeps policy) and the harness playbook's
    rubric (does the play -> agent -> skill -> script wiring stay intact).
  finding: 'Three checks the compiled plays promise have no script behind them. (a) review-knowledge SE-3
    and C3 say every update the memory tool lists as waiting is in the brief, but check_brief.py only
    compares against the updates in build.json; a waiting page from an earlier round or from another play
    can be left out and brief-check.json still reads ok. (b) The pre-flight rows "search-check.json reads
    ok: true" (build) and "build-check.json reads ok: true" (review) are marked "Hard halt", but the command
    block runs only the generic preflight.py, which does not read those files. (c) ICE S2 / SCE-2 for
    review-knowledge ("one answer per gap with from: person") can only be true after the drive records
    the reply, which is after the play closes, so the play''s own Scenario Validation step cannot run
    it. Add the checks to the scripts (or the stop condition) or move SCE-2 to the drive.

    '
  status: resolved
  resolution: fixed in fea9baf7
- id: H-8
  severity: P3
  category: harness
  file: docs/adr/042-a-drive-finds-builds-and-reviews-the-knowledge-it-lacks.md
  basis: 'G9 (ADR 041 Context: a reader finds a newer ADR only through an ''amended in part'' pointer;
    docs/adr/_index.md is generated from each ADR''s Status line).'
  finding: 'The drive''s shared run, the Kickoff ICE and the glossary already behave as ADR 042 says while
    ADR 042 is still Proposed, and the accepted ADR 041 still tells a reader that one member play, /build-memory,
