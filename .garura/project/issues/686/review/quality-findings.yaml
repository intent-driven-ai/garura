  - id: Q-5
    severity: P4
    file: core/components/plays/review-knowledge/scripts/check_stop_condition.py (also search-knowledge/scripts/check_stop_condition.py, build-knowledge/scripts/check_stop_condition.py)
    basis: the contract's "standard-library only"
    finding: >
      This helper needs PyYAML, which is not part of Python itself. It stops with a clear message
      if PyYAML is missing. Other plays (adr, agentic) do the same, so this follows the repo's
      existing habit. Noted because the contract says standard library only.
  - id: Q-6
    severity: P3
    file: .garura/project/issues/686/context/self-review.md
    basis: core/components/memory/standards/rules/pr.md run-artifacts (no playbook; reviewing for stale or contradictory facts versus the final diff)
    finding: >
      The self-review says "ADR 042 is added and the ADR index lists it". It does not.
      docs/adr/_index.md stops at ADR 041 and is not in the diff. This matches how earlier ADRs
      were done (ADR 041's commit wrote the index when the person accepted it), so the omission
      looks right but the sentence is wrong and could mislead a reader.
  - id: Q-7
    severity: P4
    file: .garura/project/issues/686/context/commits.yaml
    basis: run-artifacts - stale facts versus the final diff
    finding: >
      The record lists commit ids 8dfc4bdb, 49967915 and b63ad222 with long subjects (the first is
      about 96 characters). The branch now holds 83281a09, c5ddca0d and c0ed43bd with subjects of
      66, 60 and 58 characters. The record no longer matches the history, so it should not be
      used to check subject length. The same goes for self-review.md and pr-body.md, which say
      "5 commits, 63 files" (the branch is now 7 commits, 67 changed paths, the extra ones being
      run records).
  - id: Q-8
    severity: P4
    file: core/components/plays/review-knowledge/scripts/check_brief.py
    basis: core/components/memory/standards/rules/pr.md code-quality (small correctness edge)
    finding: >
      "A gap is named in brief.md" is tested with a plain substring check (`gid not in md`). With
      ten or more gaps, G1 would look present because G10 is. The brief is capped at seven gaps by
      default, so this cannot happen with the default settings. Minor.
  - id: Q-9
    severity: P4
    file: .garura/project/issues/686/context/ (porcelain.txt, analysis.yaml)
    basis: run-artifacts - skim for stale facts
    finding: >
      porcelain.txt is a snapshot from before the commits (all files shown as modified or
