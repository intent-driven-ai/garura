  treatment:
    reviewer: human (the design) + tool (conformance)
    layers: [layer-1, layer-2]
    linters:
      - name: lint-components (source layout; the PR changes core/components/)
        command: node .garura/core/tools/lint-components/index.js --layout source --target core/components
      - name: lint_play for list-plans
        command: python3 .garura/core/tools/lint-play/lint_play.py core/components/plays/list-plans/SKILL.md --next-map .garura/project/issues/719/context/templates/standards/rules/pipeline-next.md
      - name: lint_play for show-plan
        command: python3 .garura/core/tools/lint-play/lint_play.py core/components/plays/show-plan/SKILL.md --next-map .garura/project/issues/719/context/templates/standards/rules/pipeline-next.md
    runnable_checks:
      - "Only a violation whose file is in the PR's changed paths is a finding. Count the other violations and record the count as 'there before'."
      - "A tool that is not installed is recorded 'not installed'; a tool that crashes is recorded 'did not run: <first error line>'. Neither is a pass."
      - "ICE-source rule applies (the repository holds the plays' source): an intent change must trace to the play's reference/ice.md, not to a hand edit of the compiled SKILL.md."
    design_grounding: "Layer 2: reconstruct the principles from committed sources only (docs/philosophy/**, docs/adr/**, memory standards rules such as user-facing-voice, play-close, evidence-recording, and the glossary), never from the branch's new prose. Check agent-first delegation, JSON contracts over files, play orchestrates / skills produce / scripts do mechanical work, ICE-source discipline."

