categories:

- name: harness
  playbook: review/harness
  design_bearing: true
  evidence:
    - core/components/plays/list-plans/SKILL.md
    - core/components/plays/list-plans/reference/ice.md
    - core/components/plays/list-plans/stop-condition.yaml
    - core/components/plays/show-plan/SKILL.md
    - core/components/plays/show-plan/reference/ice.md
    - core/components/plays/show-plan/stop-condition.yaml
    - core/components/skills/enrich-grounding/SKILL.md
    - core/components/skills/link-model-part/SKILL.md
    - core/components/agents/product-os-keeper.md
  note: two new plays (list-plans, show-plan), one new skill (link-model-part), one changed skill and one changed agent. The python scripts inside these plays/skills are reviewed under "executable-code".
  treatment:
    reviewer: human (the design) + tool (conformance)
    layers: [layer-1, layer-2]
    linters:
      - name: lint-components (source layout; the PR changes core/components/)
        command: node .garura/core/tools/lint-components/index.js --layout source --target core/components
      - name: lint_play, for each changed play (list-plans, show-plan)
        command: python3 .garura/core/tools/lint-play/lint_play.py core/components/plays/list-plans/SKILL.md --next-map .garura/project/issues/719/context/templates/standards/rules/pipeline-next.md
      - name: lint_play (show-plan)
        command: python3 .garura/core/tools/lint-play/lint_play.py core/components/plays/show-plan/SKILL.md --next-map .garura/project/issues/719/context/templates/standards/rules/pipeline-next.md
    runnable_checks:
      - "Only a violation whose file is in the changed paths is a finding; count the other violations as 'there before'."
      - "A tool that is not installed is recorded 'not installed'; a tool that crashes is recorded 'did not run: <first error line>'. Neither is a pass."
      - "ICE-source rule applies (the repo holds the plays' source): an intent change must trace to the play's reference/ice.md, not to a hand edit of the compiled SKILL.md."
    design_grounding: "Layer 2: reconstruct principles from committed sources only (docs/philosophy/**, docs/adr/**, memory standards rules such as user-facing-voice, play-close, evidence-recording, the glossary), never from the branch's new prose. Check agent-first delegation, JSON contracts over files, play orchestrates / skills produce / scripts do mechanical work, ICE-source discipline."

