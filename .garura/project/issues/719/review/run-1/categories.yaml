    design_grounding: "Layer 2: reconstruct what the knowledge base is for and how a shelf is shaped from committed sources (knowledge/_DESIGN.md, knowledge/_index.md, knowledge/_TEMPLATE.md, the relevant standards), never from the branch's new text. Check: is a learning truly conditional, does it earn its place, does it duplicate an existing entry, does the severity taxonomy stay mechanical."

