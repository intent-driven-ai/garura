  note: link_part.py / safe_write.py write the product model (data-safety paths, review hard); install.py touches the filesystem (review hard).
  treatment:
    reviewer: the tool, against industry best practice
    layers: [layer-1]
    linters:
      - name: the language linter the repo commits (python); none is named by the playbook
        command: null
      - name: check-pr-quality against the diff using the pr.md taxonomy (SEC-*, CODE-*, ARCH-*, BE-*, PERF-*, DATA-* rows)
        command: null   # the playbook gives no command; the play or quality-auditor runs check-pr-quality
    runnable_checks:
      - "Rubric: error handling, function size, no stray debug output, no secrets, safe handling of destructive/irreversible operations, deterministic where it claims to be."
      - "Review the data-safety and idempotency paths hard (scripts touching git, the filesystem, external services)."
    design_grounding: "no - the standard is industry best practice plus the pr.md taxonomy."

