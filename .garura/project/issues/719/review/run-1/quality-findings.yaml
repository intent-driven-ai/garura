  severity: P3
  file: core/components/skills/link-model-part/scripts/safe_write.py
  line: 22
  what: 'The temp file is made with mkstemp, which creates it with mode 0600, and os.replace puts it over the target, so every
    product-model file this skill rewrites (the spine, the pages) ends up 0600 whatever mode it had. Reproduced: a 0644 file
    came back 0600.'
  basis: 'review/code rubric: safe handling of irreversible operations'
  severity_source: 'reviewer: no taxonomy row fires; severity read from the P1-P4 definitions in pr.md'
  evidence: 'python run of atomic_write on a 0644 file: mode 0o600'
- id: F-07
  severity: P3
  file: core/components/skills/link-model-part/scripts/link_part.py
  line: 229
  what: 'The spine and then each page are written one by one after the checks. If a write fails part way (disk full, permission),
    the spine and the pages disagree and the OSError is not caught: a traceback, and no link-report.json. The header says
    a failure ''writes nothing'', which is true only for the checks before the first write.'
  basis: 'review/code rubric: data-safety and idempotency paths'
  severity_source: 'reviewer: no taxonomy row fires; severity read from the P1-P4 definitions in pr.md'
  evidence: 'read of main(): the except clause at line 225 covers the checks only'
