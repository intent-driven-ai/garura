principles_reconstructed:
  - id: PR-1
    principle: "An accepted ADR is never edited. A change to what it decided is a new ADR that supersedes or amends it, and the older one gains a forward pointer."
    source: "core/components/memory/standards/templates/adr.md, lines 47-51 (git show plan/717/base:...)"
  - id: PR-2
    principle: "ADR 030 decided the plan's tree view: GOAL, DONE, NOW, NEXT, WAIT (on a human), every line in plain words with its issue number. Rule 19 of rules/work-plan.md is the single source that carries it."
    source: "docs/adr/030-plan-mode.md, 'Work This Creates' item 7 and References (git show plan/717/base:...)"
  - id: PR-3
    principle: "A change to the Plan kind of the product model goes through the ontology (/edit-ontology), as ADR 060 did for the landing rule. The ontology's Plan section says: Tree = each work item 'with its tracker issue and its state'; Now = 'the work item being worked on' (one); Status = active, done or dropped."
    source: "core/components/memory/standards/schemas/product-os/ontology.md, section Plan (about lines 561-612); docs/adr/060-a-plans-branch-merges-into-main-when-the-plan-pauses.md, section 'The ontology's landing rule leaves the ontology in this change, through /edit-ontology' (git show plan/717/base:...)"
  - id: PR-4
    principle: "A file belongs in templates/ if it defines the shape of an output artifact; it does NOT belong there if it defines rules for artifact content (that is rules/) or is a YAML schema contract (schemas/). A template holds the shape only and points to the rules page. The eval format is the worked precedent: shape in templates/eval-slice.md and eval-story.feature.md, rules in rules/eval-format.md."
    source: "standards/templates/_index.md 'When to Add Here' (Phoenix copy, tier phoenix, fingerprint in grounding-memory/manifest.json); standards/templates/work-plan.md line 7 ('This file holds the shape only ... rules, in standards/rules/work-plan.md'); standards/rules/eval-format.md line 3"
  - id: PR-5
    principle: "rules/work-plan.md is 'single source of the rules for work plans', the plan at {stm_base}{issue}/specs/plan.md; the glossary entry 'Work plan' says the same and lists what it is NOT. The plan file .garura/project/plans/<id>.yaml is a different thing, the ontology's Plan."
    source: "git show plan/717/base:core/components/memory/standards/rules/work-plan.md lines 1-3, 'Where it lives'; core/grounding/glossary.md line 19; ontology.md Plan 'Lives at'"
  - id: PR-6
    principle: "Examples in shared templates and the ontology are several, across different domains, not one project's own data."
    source: "standards/templates/approval-prompt.md line 30 ('several examples from different domains'); ontology.md Plan examples (Shop, Clinic, Bank)"
  - id: PR-7
    principle: "A play reads a template only through template-manager, which finds it through the memory tool (short-term, Garura, Phoenix) and reports template_missing when no tier holds it. It never invents one."
    source: "core/components/agents/template-manager.md 'What You MUST NOT Do' and Core Principle (git show plan/717/base:...); .claude/rules/garura-memory.md"
  - id: PR-8
    principle: "ADR 051: a 'what next' view over the plan files is a new play built from its own ICE. This supports /show-plan and /list-plans as navigation plays with no successor (conformance, not a finding)."
    source: "docs/adr/051-the-next-play-is-dropped-the-plan-is-the-work-list.md section 3 (git show plan/717/base:...)"

