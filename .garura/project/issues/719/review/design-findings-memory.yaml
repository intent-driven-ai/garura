findings:
  - id: MEM-001
    severity: P2
    file: core/components/memory/standards/rules/work-plan.md
    line_hint: "rule 19 (diff hunk @@ -44,4 +44,4)"
    what: "Rule 19 replaces the status tree that ADR 030 decided (GOAL, DONE, NOW, NEXT, WAIT on a human; Done shown; item 7 of Work This Creates) with six statuses (Not Started, In Progress, Now, Done, Blocked, Dropped), a tree that hides Done and Dropped, and a count line. The accepted ADR 030 is not amended or superseded: no file under docs/adr/ is in the diff, and no later base ADR amends ADR 030 on the status view (ADR 032 amends §5 only). The rules file and the ADR now disagree, and the rules file says ADR 030 is its authority."
    basis:
      principle: "PR-2 (an accepted ADR is never edited; a new ADR amends or supersedes it, with forward and back pointers) and PR-1 (ADR 030 section 0 and item 7: the status tree is GOAL/DONE/NOW/NEXT/WAIT and shows what is decided, built and left)"
      source: "plan/717/base:core/components/memory/standards/templates/adr.md (Rules); plan/717/base:docs/adr/030-plan-mode.md (section 0, Work This Creates item 7); plan/717/base:docs/adr/032-drive-review-of-outcomes.md line 97 (the only later amendment, §5 only)"
    for_the_human: "Decide whether this is a new ADR that amends ADR 030's status view, or whether the vocabulary was settled elsewhere that is committed. I found no committed record of it."
  - id: MEM-002
    severity: P3
    file: core/components/memory/standards/rules/work-plan.md
    line_hint: "rule 19; header 'Where it lives'"
    what: "The work-plan rules govern the work plan at {stm_base}{issue}/specs/plan.md, whose own status is active, done or dropped and whose items move to a Done list (rules 8, 9, 17, 18). Rule 19 now describes what /show-plan prints from the plan files under .garura/project/plans/<id>.yaml, whose nodes carry the six statuses. The rule does not say which plan it means, and the same file now holds two vocabularies for 'done'. A reader of the rules file cannot tell which plan rule 19 governs."
    basis:
      principle: "PR-5 (the work-plan rules are scoped to specs/plan.md; the plan file is the ontology's Plan kind) and naming clarity: one word, one meaning"
      source: "plan/717/base:core/components/memory/standards/rules/work-plan.md (Where it lives, rules 8, 9, 17); plan/717/base:core/components/memory/standards/schemas/product-os/ontology.md (Plan, Lives at and Status)"
  - id: MEM-003
    severity: P3
    file: core/components/memory/standards/rules/work-plan.md ; core/components/memory/standards/templates/plan-view.md
    line_hint: "rule 19; plan-view.md 'The statuses', 'The tree' legend, 'Settings'"
    what: "The six statuses, their order and what the tree hides are stated in rule 19 and again in the template: the status table, the legend example and the settings block (three places in the template). They already differ: rule 19 lists Done before Blocked, the template says the order of its table is the legend order and puts Blocked before Done. There is also no committed home for the node-state vocabulary: the ontology's Plan Tree says only 'its state', and the old vocabulary (done, now, next, blocked, later, dropped) lived in plan-file headers and write_plan_file.py. The six statuses now live only in a template and a rules line."
    basis:
      principle: "PR-3 (one home per fact so copies cannot drift) and PR-9 (a kind's vocabulary is defined in the ontology and its log)"
      source: "plan/717/base:core/components/memory/standards/templates/work-plan.md (Where it lives); plan/717/base:core/components/memory/standards/rules/_index.md (When to Add Here: single source of truth, not a copy of prose); plan/717/base:core/components/memory/standards/schemas/product-os/ontology.md (Plan: Tree, Log v9-v12)"
    for_the_human: "Pick one home for the statuses (the template's settings block is the one the tool reads) and have rule 19 point to it; decide if the Plan kind in the ontology should name the node states."
  - id: MEM-004
    severity: P3
    file: core/components/memory/standards/templates/plan-view.md
    line_hint: "whole file; 'The tree' bullets and 'Settings' block"
    what: "The file is placed in templates/ but holds two things the templates index sends elsewhere: view rules (a status is never worked out from the nodes under it; the tree hides Done and Dropped except under a shown node; a needed plan prints after; the last line counts hidden nodes) and a typed settings contract that the plan tool parses and refuses to run without (BadInput on a missing 'statuses', 'tree', 'list' or 'graph' key). The index says a rule for artifact content goes in rules/ and a YAML schema contract in schemas/, and routes pr-findings.yaml to schemas/ for the same reason."
    basis:
      principle: "PR-4 (templates/ is the shape of an output; rules go in rules/; a typed contract goes in schemas/)"
      source: "plan/717/base:core/components/memory/standards/templates/_index.md (When to Add Here; Scope Notes on pr-findings.yaml)"
    for_the_human: "A template that a tool parses has no precedent on the base ref. Either accept it as a deliberate exception and say so in the index, or split the rules and the contract out."
  - id: MEM-005
    severity: P3
    file: core/components/memory/standards/templates/plan-view.md
    line_hint: "'The list' and 'The graph' sections, and settings keys list.waits and graph.on_main"
    what: "The list view prints 'waits on plan 722' and the graph prints 'on main: #606, #722, #734, #756, #767': plan numbers with no title. Rule 19 keeps its lead 'never bare numbers' and ADR 030 section 0 says the status view is plain words, never bare issue numbers, so a reader coming back after two days knows where things stand. The tree lines carry titles; these two do not."
    basis:
      principle: "PR-1 (the status view is plain words, never bare issue numbers)"
      source: "plan/717/base:docs/adr/030-plan-mode.md (section 0); plan/717/base:core/components/memory/standards/rules/work-plan.md rule 19 (old text: 'Every line says in plain words what the item is, with its issue number beside it')"
  - id: MEM-006
    severity: P4
    file: core/components/memory/standards/templates/plan-view.md
    line_hint: "header paragraph"
    what: "Rule 19 points to templates/plan-view.md, but the template does not point back to rule 19. The base work-plan template names its rules file and says 'This file holds the shape only'; the new template has no such pointer and holds rules itself (see MEM-004)."
    basis:
      principle: "PR-3 (template and rules file point at each other so the two cannot drift)"
      source: "plan/717/base:core/components/memory/standards/templates/work-plan.md (opening paragraphs and Where it lives)"
  - id: MEM-007
    severity: P4
    file: core/components/memory/standards/rules/pipeline-next.md
    line_hint: "diff hunk @@ -72,6 +72,8 (Navigation rows); 'The flow' and header prose"
    what: "The two rows are right (command null, listed so the play is not a lint gap) but the map's prose is unchanged. Its header says the person picks the next work from the plan or from /list-focus-issues, and 'The flow' lists /list-focus-issues as the one navigation play. The new rows break the column alignment of the Navigation block (list-focus-issues is padded to one column, the new keys to another)."
    basis:
      principle: "PR-6 (the map and its prose say what the plays are; ADR 051 makes the plan and /list-focus-issues the way to pick work, and says a plan view is a new play listed when built)"
      source: "plan/717/base:core/components/memory/standards/rules/pipeline-next.md (header, The flow, Navigation); plan/717/base:docs/adr/051-the-next-play-is-dropped-the-plan-is-the-work-list.md (sections 2 and 3)"
  - id: MEM-008
    severity: P4
    file: core/components/memory/standards/templates/plan-view.md
    line_hint: "whole file (delivery, not content)"
    what: "The template is in no memory tier the plays can read today (find across short-term, Garura and Phoenix memory returns nothing), so /list-plans and /show-plan stop at their first step with 'template missing' until it is promoted to Phoenix memory. The PR body (line 22) says so. Promotion is a person's deliberate step outside the work, so this is not a defect of the PR; it is listed so the merge is not read as 'the plays work'. Phoenix memory also still holds older copies of work-plan.md (drive wording) and ontology.md (no Plan kind)."
    basis:
      principle: "PR-7 (a play gets a template only through template-manager and the memory tool; moving a file to Garura or Phoenix memory is a person's promotion)"
      source: "plan/717/base:docs/adr/039-memory-writes-go-to-short-term-memory-plays-read-no-memory.md (sections 1 and 2); plan/717/base:core/components/agents/template-manager.md"

