principles:
  - id: PR-1
    principle: "A tree of plan status is plain words, never bare issue numbers; it is the human's interface, and a business reader must see what is decided, built and still to do (ADR 030 section 0 and Work This Creates item 7, which names the status tree GOAL, DONE, NOW, NEXT, WAIT)."
    source: "plan/717/base:docs/adr/030-plan-mode.md ; plan/717/base:core/components/memory/standards/rules/work-plan.md rule 19 (old text)"
  - id: PR-2
    principle: "An accepted ADR is never edited; a change to what it decided is made by a new ADR that supersedes or amends it, with a forward pointer on the old one."
    source: "plan/717/base:core/components/memory/standards/templates/adr.md (Rules); Phoenix copy context/memory/grounding-memory/standards/templates/adr.md"
  - id: PR-3
    principle: "One fact has one home so the copies cannot drift ('Kept in one place so the two files cannot drift'); a rules file is the single source of truth for its domain, not a copy of other prose."
    source: "plan/717/base:core/components/memory/standards/templates/work-plan.md (Where it lives); plan/717/base:core/components/memory/standards/rules/_index.md (When to Add Here)"
  - id: PR-4
    principle: "templates/ holds the shape of an output artifact. Rules for artifact content belong in rules/. A typed YAML contract a tool parses belongs in schemas/ (the pr-findings.yaml precedent)."
    source: "plan/717/base:core/components/memory/standards/templates/_index.md (Scope Notes; When to Add Here)"
  - id: PR-5
    principle: "work-plan.md rules govern the work plan at {stm_base}{issue}/specs/plan.md. The Plan kind is the plan file .garura/project/plans/<id>.yaml: its Tree holds each work item with its tracker issue and its state; its Status is active, done or dropped."
    source: "plan/717/base:core/components/memory/standards/rules/work-plan.md (Where it lives); plan/717/base:core/components/memory/standards/schemas/product-os/ontology.md (Plan)"
  - id: PR-6
    principle: "The Next-line map holds one row for each user-invocable play, and a play with no single successor has command null; a loop or play is listed, or it is meta_exempt."
    source: "plan/717/base:core/components/memory/standards/rules/pipeline-next.md (header and map); plan/717/base:docs/adr/051-the-next-play-is-dropped-the-plan-is-the-work-list.md (sections 2 and 3)"
  - id: PR-7
    principle: "A play reads no memory; it asks template-manager, which finds a template through the memory tool. Moving a file up to Garura or Phoenix memory is a promotion a person makes on purpose, outside the work."
    source: "plan/717/base:docs/adr/039-memory-writes-go-to-short-term-memory-plays-read-no-memory.md (sections 1 and 2); plan/717/base:core/components/agents/template-manager.md"
  - id: PR-8
    principle: "Memory is read by every agent; a wrong or self-justifying entry propagates silently. Check the change against the shelf's purpose, the template, cross-references and duplication; the severity taxonomy stays mechanical."
    source: "context/memory/knowledge/review/memory.md (playbook copy); context/memory/grounding-memory/knowledge/_DESIGN.md (the real risk: content quality and contradiction)"
  - id: PR-9
    principle: "A new decision-ready fact for a kind (here, the state vocabulary of a plan node) is defined in the ontology of that kind, changed through the ontology's log."
    source: "plan/717/base:core/components/memory/standards/schemas/product-os/ontology.md (Plan: Tree 'its state'; Log entries v9 to v12 each name what changed)"

