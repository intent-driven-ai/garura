scanner_hits_not_substantiated:
  - basis: DATA-18
    scanner_severity: P1
    hits: ["core/tools/plan/test_plan.py:26 'password'", "core/tools/plan/test_plan.py:167 'email'", "core/tools/plan/test_plan.py:169 'email'"]
    reason: "Line 26 is the title text of a test plan ('A person resets a lost password'). Lines 167 and 169 set a throw-away git author (user.email=t@t) for a temporary test repository. No personal data is stored or sent."
  - basis: DATA-17
    scanner_severity: P2
    hits: ["core/tools/plan/test_plan.py:167", "core/tools/plan/test_plan.py:169"]
    reason: "Same two git author lines as above."
  - basis: CODE-25
    scanner_severity: P3
    hits: ["core/tools/plan/plan.py:44", "core/tools/plan/plan.py:71", "core/tools/plan/plan.py:247"]
    reason: "Each catches a named error (OSError, yaml.YAMLError, BadInput) and turns it into a clear message and exit 2; none swallows an error."
  - basis: BE-23
    scanner_severity: P4
    hits: ["core/tools/plan/plan.py:15,19,33,46,48", "core/tools/plan/test_plan.py:44,71,123,156"]
    reason: "The word 'lock' matched inside 'BLOCK' (a regex name), 'block', 'Blocked' and the test title 'Lock the account'. No locking code."
  - basis: "ARCH-02, ARCH-03, ARCH-08, CODE-03 (path half), CODE-04, CODE-09, CODE-10, CODE-11, CODE-12, CODE-13, CODE-14, CODE-15, CODE-17, CODE-19"
    scanner_severity: "P2-P4"
    hits: ["core/tools/plan/plan.py:1", "core/tools/plan/test_plan.py:1"]
    reason: "Path-only rows: they fire on any .py file and need a tool result (lint message, cycle trace, complexity score) to be a defect. No such result exists: plan.py is 255 lines, test_plan.py 186, no import cycle, compiles clean. CODE-03 is substantiated only through the four ruff messages in findings."
  - basis: "DOC-01, DOC-09, DOC-10, DOC-11, DOC-14, DOC-15, DOC-16"
    scanner_severity: "P3-P4"
    hits: ["core/tools/plan/README.md:1"]
    reason: "Path-only rows on README.md. The README holds the usage, the commands, the exit codes, the statuses and the test command, so there is nothing to flag."

coverage_gaps:
  - "The taxonomy classifies everything under core/components/ as garura-prose, so the scanner applied only the CODE-20 catch-all count (17 python files: the list-plans, show-plan, shape-plan, shape-slice, link-model-part and install-garura scripts, and their tests). The mechanical rows (CODE-*, SEC-*, DATA-*) never ran on them. Only compile, ruff and the test suites covered them. Per the contract nothing else was added by judgment."
  - "The category treatment asks for a hard review of the data-safety paths (link_part.py and both safe_write.py files, the two #979 fixes; plan.py refusal of missing fields, #719; install.py). That is a rubric review, not a taxonomy row. Their suites are green, but a person or a rubric pass should read those files."
  - "No python linter or formatter is committed in the repository, so CODE-03 and CODE-04 have no project tool; ruff defaults were used for CODE-03, and black was not treated as a standard."

for_human:
