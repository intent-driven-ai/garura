# check-pr-quality, Layer 1, PR #980 (base plan/717/base), issue 719.
# Categories: executable-code, tests, documentation, config-maps (from review/categories.yaml).
# Inputs used: review/context.yaml, review/categories.yaml, review/pr.diff, review/runnable-checks.txt.
# Nothing under review/run-1/ was read.
meta:
  skill: check-pr-quality (scan_taxonomy.py, exit 0, meta.errors none)
  taxonomy: .garura/project/issues/719/context/memory/standards/rules/pr.md
  scope_paths: 24 (the changed paths listed as evidence for the four categories; all 24 are in pr.diff)
  scanner_raw_counts: {P1: 3, P2: 10, P3: 23, P4: 16}
  scanner_catchall_CODE-20: 24
  note: >
    The scanner's raw hits were triaged. Path-only rows (ARCH-*, CODE-03/04/09-19, DOC-*) fire on
    every matching file and carry no evidence of a defect; grep rows matched words inside test data
    and normal words. Each dismissed hit is listed under scanner_hits_not_substantiated so the
    caller can overrule. findings holds only hits backed by actual tool output or file content.

runnable:
  - {suite: core/tools/plan test_plan, result: pass, detail: "12 tests OK"}
  - {suite: link-model-part test_link_part, result: pass, detail: "15 tests OK"}
  - {suite: shape-plan test_write_plan_file, result: pass, detail: "9 passed, 0 failed"}
  - {suite: shape-slice test_shape_slice_scripts, result: pass, detail: "129 passed, 0 failed"}
  - {suite: install-garura test_install, result: pass, detail: "75 tests OK (121.8s)"}
  - {check: python compile of the 22 changed .py files, result: pass, detail: "py_compile clean"}
  - {check: ruff 'check --isolated' (defaults; the repo commits no python lint config), result: "4 messages", detail: "see findings QF-1..QF-4"}
  - {check: black --check (no formatter config committed), result: not used as a finding, detail: "20 of 22 files differ from black's default style; the repository sets no formatter, so no standard is broken"}
  - {check: ruff T201 (print) , result: not a finding, detail: "all print calls are the CLI output of scripts (JSON or stderr messages); none are stray debug output"}
  - {check: config-maps path resolution, result: pass, detail: ".claude/skills/link-model-part, .claude/skills/list-plans, .claude/skills/show-plan, .garura/core/tools/plan all exist; all 56 'kinds' paths exist; counts (10 agents, 27 skills, 19 plays) match the 'kinds' map"}
  - {check: documentation (core/tools/plan/README.md), result: pass, detail: "no TODO/FIXME; headings fine; commands and the test command match the code; references to /list-plans, /show-plan, /update-plan (#730), /shape-plan (#896) are named, not links"}

