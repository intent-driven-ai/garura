- id: MEM-001
  category: memory
  severity: P2
  file: core/components/memory/standards/rules/work-plan.md
  what: 'Rule 19 replaces the status tree that ADR 030 decided (GOAL, DONE, NOW, NEXT, WAIT on a human; Done shown; item 7
    of Work This Creates) with six statuses (Not Started, In Progress, Now, Done, Blocked, Dropped), a tree that hides Done
    and Dropped, and a count line. The accepted ADR 030 is not amended or superseded: no file under docs/adr/ is in the diff,
    and no later base ADR amends ADR 030 on the status view (ADR 032 amends §5 only). The rules file and the ADR now disagree,
    and the rules file says ADR 030 is its authority.'
  basis:
    principle: 'PR-2 (an accepted ADR is never edited; a new ADR amends or supersedes it, with forward and back pointers)
      and PR-1 (ADR 030 section 0 and item 7: the status tree is GOAL/DONE/NOW/NEXT/WAIT and shows what is decided, built
      and left)'
    source: plan/717/base:core/components/memory/standards/templates/adr.md (Rules); plan/717/base:docs/adr/030-plan-mode.md
      (section 0, Work This Creates item 7); plan/717/base:docs/adr/032-drive-review-of-outcomes.md line 97 (the only later
      amendment, §5 only)
  source: design-findings-memory.yaml
- id: MEM-002
  category: memory
  severity: P3
  file: core/components/memory/standards/rules/work-plan.md
  what: The work-plan rules govern the work plan at {stm_base}{issue}/specs/plan.md, whose own status is active, done or dropped
    and whose items move to a Done list (rules 8, 9, 17, 18). Rule 19 now describes what /show-plan prints from the plan files
    under .garura/project/plans/<id>.yaml, whose nodes carry the six statuses. The rule does not say which plan it means,
    and the same file now holds two vocabularies for 'done'. A reader of the rules file cannot tell which plan rule 19 governs.
  basis:
    principle: 'PR-5 (the work-plan rules are scoped to specs/plan.md; the plan file is the ontology''s Plan kind) and naming
      clarity: one word, one meaning'
    source: plan/717/base:core/components/memory/standards/rules/work-plan.md (Where it lives, rules 8, 9, 17); plan/717/base:core/components/memory/standards/schemas/product-os/ontology.md
      (Plan, Lives at and Status)
  source: design-findings-memory.yaml
- id: MEM-003
  category: memory
  severity: P3
  file: core/components/memory/standards/rules/work-plan.md ; core/components/memory/standards/templates/plan-view.md
  what: 'The six statuses, their order and what the tree hides are stated in rule 19 and again in the template: the status
    table, the legend example and the settings block (three places in the template). They already differ: rule 19 lists Done
    before Blocked, the template says the order of its table is the legend order and puts Blocked before Done. There is also
    no committed home for the node-state vocabulary: the ontology''s Plan Tree says only ''its state'', and the old vocabulary
    (done, now, next, blocked, later, dropped) lived in plan-file headers and write_plan_file.py. The six statuses now live
    only in a template and a rules line.'
  basis:
    principle: PR-3 (one home per fact so copies cannot drift) and PR-9 (a kind's vocabulary is defined in the ontology and
      its log)
    source: 'plan/717/base:core/components/memory/standards/templates/work-plan.md (Where it lives); plan/717/base:core/components/memory/standards/rules/_index.md
      (When to Add Here: single source of truth, not a copy of prose); plan/717/base:core/components/memory/standards/schemas/product-os/ontology.md
      (Plan: Tree, Log v9-v12)'
  source: design-findings-memory.yaml
- id: MEM-004
  category: memory
  severity: P3
  file: core/components/memory/standards/templates/plan-view.md
  what: 'The file is placed in templates/ but holds two things the templates index sends elsewhere: view rules (a status is
    never worked out from the nodes under it; the tree hides Done and Dropped except under a shown node; a needed plan prints
    after; the last line counts hidden nodes) and a typed settings contract that the plan tool parses and refuses to run without
    (BadInput on a missing ''statuses'', ''tree'', ''list'' or ''graph'' key). The index says a rule for artifact content
    goes in rules/ and a YAML schema contract in schemas/, and routes pr-findings.yaml to schemas/ for the same reason.'
  basis:
    principle: PR-4 (templates/ is the shape of an output; rules go in rules/; a typed contract goes in schemas/)
    source: plan/717/base:core/components/memory/standards/templates/_index.md (When to Add Here; Scope Notes on pr-findings.yaml)
  source: design-findings-memory.yaml
- id: MEM-005
  category: memory
  severity: P3
  file: core/components/memory/standards/templates/plan-view.md
  what: 'The list view prints ''waits on plan 722'' and the graph prints ''on main: #606, #722, #734, #756, #767'': plan numbers
    with no title. Rule 19 keeps its lead ''never bare numbers'' and ADR 030 section 0 says the status view is plain words,
    never bare issue numbers, so a reader coming back after two days knows where things stand. The tree lines carry titles;
    these two do not.'
  basis:
    principle: PR-1 (the status view is plain words, never bare issue numbers)
    source: 'plan/717/base:docs/adr/030-plan-mode.md (section 0); plan/717/base:core/components/memory/standards/rules/work-plan.md
      rule 19 (old text: ''Every line says in plain words what the item is, with its issue number beside it'')'
  source: design-findings-memory.yaml
