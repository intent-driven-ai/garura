- id: F-HARNESS-01
  category: harness
  severity: P2
  file: core/components/skills/link-model-part/SKILL.md
  what: 'link-model-part adds a new writer of the shared spine _spine.yaml (and the Thin line on pages): a skill script run
    through the keeper "for a part found during work", with no play and no loop around it. The keeper''s NEVER rule is rewritten
    to say the spine is written "by link-model-part''s script for a part found during work (#979)". The committed rule allows
    exactly two writers of a shared file: a play''s keyed script, and link-model-gaps'' script inside a loop only. This third
    writer is outside both, so the scoped-write guard, the clean-tree entry check and the model-delta commit (rules 4 and
    7, L-DMW-3/4) have no play to run them. The skill''s own checks (path containment, all or nothing, a report of changed
    files) are good, but a skill cannot grant itself the exception; neither an ADR nor direct-model-write.md is changed in
    this PR.

    '
  basis: 'PR5. direct-model-write.md (base): ''Outside a loop, the play''s keyed script is still the only writer of shared
    files''; L-DMW-5 names link-model-gaps as the single exception (''inside a loop only'', ADR 044). ADR 044 shows the pattern:
    a new shared-file writer was authorised by an ADR that amends ADR 026. Harness standard: a change to the standard is a
    decision.'
  source: design-findings-harness.yaml
- id: F-HARNESS-02
  category: harness
  severity: P3
  file: core/components/skills/enrich-grounding/SKILL.md
  what: 'enrich-grounding (an LLM skill) now edits intent pages in place (new step 5, kind ''intent'', modes update/fix),
    and its old rule "never write an intent page" is rewritten. On the base ref the keeper lists an intent page among the
    shared model files it must not write, and intent pages are written by scripts after a person''s word (author-business-intent
    drafts, a script writes). The skill limits the edit to the lines the request names and forbids a change of meaning, which
    keeps ADR 031 intact, but it moves an intent page from ''shared, script-written'' to ''LLM-writable'' with no decision
    record.

    '
  basis: 'PR6 and PR5: keeper NEVER list names ''an intent page'' as a shared model file; direct-model-write rule 3 says the
    LLM writes only per-node grounding docs. PR7: only a person confirms or drops a business intent (the skill''s guard is
    the only protection).'
  source: design-findings-harness.yaml
- id: F-HARNESS-03
  category: harness
  severity: P2
  file: core/components/plays/list-plans/SKILL.md
  what: 'Both plays load standards/templates/plan-view.md and standards/rules/pipeline-next.md through template-manager, and
    halt (hard) when plan-view.md is missing. The memory tool, run across every tier (short-term, garura, phoenix), finds
    no plan-view.md and no list-plans or show-plan row in pipeline-next.md: both exist only in this branch''s core/components/memory.
    Until a person promotes them to Phoenix memory, the plays cannot run in any project that reads Phoenix memory, and the
    Layer 1 GAP in lint-play.txt (next-command: no entry in pipeline-next.md, both plays) is caused by that stale map. Run
    against the PR''s own pipeline-next.md both plays pass all 12 checks.

    '
  basis: 'PR3 and PR11: templates a play fills are memory, fetched by template-manager from the memory tiers (ADR 039 section
    2, 9); the Next-line map is the one place the successor lives and the close renders from it. The delivery depends on a
    memory promotion that is deliberate and outside the work.'
  source: design-findings-harness.yaml
- id: F-HARNESS-04
  category: harness
  severity: P3
  file: core/components/agents/product-os-keeper.md
  what: 'The found-work flow is described as used "by any play or run that finds a part the model lacks" (keeper description;
    routing row ''No discovery play run''; link-model-part description). No play in the repository on the base ref or in this
    diff dispatches it. Play -> agent -> skill has no top: the flow starts from an ad hoc ''run''. Nothing owns the order
    (page first, then link, one link run after the page runs join), the approval of the model change, or the evidence of the
    run.

    '
  basis: 'PR1: a play owns the order of steps and hands each agent a contract; agents and skills do not start work on their
    own. The keeper''s own header lists the plays it serves; this adds an unnamed one.'
  source: design-findings-harness.yaml
- id: F-HARNESS-05
  category: harness
  severity: P4
  file: core/components/agents/product-os-keeper.md
  what: 'The rewritten NEVER rule carries a note of origin with a person and a date: "(the product owner, 2026-10-29)", and
    the first sentence reads "Change the product model by hand ... but only through a skill", which contradicts itself (by
    hand vs through a skill) and sits beside the unchanged "Hand-write model YAML yourself" line. No agent or skill on the
    base ref carries a dated attribution of this kind.

    '
  basis: 'PR4: a note of origin in an installed part is deleted, not reworded; record why in the commit and the issue, not
    in the file.'
  source: design-findings-harness.yaml
- id: F-HARNESS-06
  category: harness
  severity: P4
  file: core/components/plays/list-plans/SKILL.md
  what: 'Step 6 says "the close finds the templates Step 1 already loaded there", but Step 1 asks template-manager for plan-view.md,
    delivery-report.md and pipeline-next.md only; the close also needs evidence-file.md when evidence is recorded. The shared
    close''s Step L loads it, so the run works, but the sentence is inexact and could lead an editor to drop Step L.

    '
  basis: 'PR8: the Standard Play Close''s Step L is not optional and asks template-manager for evidence-file.md when C1 runs.'
  source: design-findings-harness.yaml
