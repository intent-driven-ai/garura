principles:
  - id: G1
    text: "An agent only gathers context and checks; a skill does the work (agent = context, skill = artifact production)"
    source: "CLAUDE.md Behavioral Rule 4; plan/788/base:core/components/plays/edit-play/references/agent-audit.md P7 (and the P1-P11 set)"
    result: "held - all 11 agent contracts in shape-slice/SKILL.md say 'Gather and pass on only' and name a skill in 'skills'; the one with no skill (Step 10b, record the live decisions) is memory-tool cites only, with the question and answer the skill wrote left unchanged. product-os-keeper.md now says every choice, draft and decision is made by a named skill and that a missing skill returns step_failure; it never says the agent reshapes output."
  - id: G2
    text: "Each skill that does the work is named, exists, and does only its part; a skill reads only what its agent put in short-term memory"
    source: "CLAUDE.md Rule 4 and Data Flow; .claude/rules/garura-memory.md; agent-audit.md P7"
    result: "held - the five new skills (author-slice, find-slice-gaps, enrich-grounding, author-slice-brief, author-failure-recovery) each have name, description, user-invocable false, model, allowed-tools Read/Write, and Input / Process / Output / Rules; none searches memory or the web; the old skills' changes are additive modes (one-intent, profile false, depth directional)"
  - id: G3
    text: "Agent audit P1-P11 for product-os-keeper on the changed dispatches"
    source: "plan/788/base:core/components/plays/edit-play/references/agent-audit.md"
    result: "held for P1 (every dispatch is now a JSON contract, including the early brief), P2, P4 (step_failure), P5, P6, P7, P9. Not re-judged: P8, P10, P11, which this change did not touch."
  - id: G4
    text: "An intent change goes through reference/ice.md and a recompile"
    source: "CLAUDE.md Play Pipeline Rules"
    result: "held - SKILL.md fingerprint sha256:26376011...aaca4 is the one the play declares for reference/ice.md; the agent-only-gathers rule is carried as C19/F19/S and SE-25"
  - id: G5
    text: "A builder, a building skill and the build context sub-agent never read a plan's evals folder; the ids never leave the eval folder"
    source: "docs/adr/049 section 4; ontology.md v11 Hidden file row"
    result: "held - the working copies are now cleared after check passes (write_hidden_file.py --clear-working, Step 8b)"
