findings:
  - id: DF-4
    severity: P4
    file: core/components/plays/shape-slice/SKILL.md
    where: "Compilation Metadata, skills_used row"
    finding: "The row ends with 'author-failure-recovery (author-slice, find-slice-gaps, author-slice-brief, enrich-grounding and author-failure-recovery built for this play, #842)'. The bracket lists the five new skills but hangs on the last skill's name, so it reads as if those were what author-failure-recovery uses. Also, the tests row lists 7 test files while the work holds 6 under shape-slice/scripts plus the create-play one; the counts do not obviously agree."
    principle: "Naming clarity: a record says what it means (a metadata row a reader or a later rebuild relies on)"
    basis: "CLAUDE.md, Challenge principle 5 (naming clarity); CLAUDE.md Play Pipeline Rules (the compiled file is read whole on every run)"
    fix: "Direct edit to SKILL.md metadata (non-intent): move the bracket to its own words, 'new for this play: ...', and make the tests row match the files. Record in the commit, not in the file."
no_findings_note: "The key principle held: no dispatch asks the agent to choose, draft or decide. Every contract names the skill that does the work, tells the agent to pass the skill's file on as it is, and splits the mechanical work (writing files, the spine, the hidden file, the brief layout) to play scripts. A missing skill is a step_failure, not agent work."
playbook_gaps: "none for harness"
