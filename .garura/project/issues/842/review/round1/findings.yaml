- id: DF-1
  severity: P3
  file: core/components/plays/shape-slice/SKILL.md
  where: Step 5 eval SE-6 (line 329) and Step 11 eval SE-6 (line 597)
  finding: Two evals carry the id SE-6. The Compilation Metadata says 23 step evals
    (SE-1..SE-23), but the file holds 24 eval blocks. The early-brief check and the
    final-brief check share one id, so a recovery or report that names SE-6 cannot
    say which one.
  principle: One id names one eval, so coverage and reports stay clear (naming clarity)
  basis: lint_play.py maps coverage by id, so a shared id hides one eval from the
    check; CLAUDE.md challenge principle 5 (naming clarity). No committed text states
    'unique ids' in words.
  fix: 'Direct edit to SKILL.md (non-intent): give the early-brief eval its own id,
    or merge it with the final one, and fix the count. Record in the commit, not in
    the file.'
- id: DF-2
  severity: P3
  file: core/components/plays/shape-slice/SKILL.md
  where: Step 8b contracts; scripts/write_hidden_file.py lines/write
  finding: The run's working files hidden-lines.json and hidden-recoveries.json sit
    in {stm}/<issue>/context/shape-slice/. They hold the Fails-if text, the F-ids
    and the recovery text, outside the plan's evals folder. The read rule names only
    the evals folder, so the rule does not cover these copies.
  principle: Failure lines and ids reach no builder; the ids never leave the eval
    folder
  basis: docs/adr/049 section 4 ('Today the eval is kept from the builder by a read
    rule only'); ontology.md v11, Hidden file row ('The ids never leave the eval folder')
  risk: 'Low today: the folder is the intent issue''s short-term memory, not a builder
    issue''s, and the build context sub-agent writes to its own issue. Still a leak
    path the read rule does not close.'
  fix: Write the two working files outside the issue folder, or delete them after
    check passes, or record the exception in an ADR.
