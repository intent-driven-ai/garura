  pre_existing_in_part: true
  category: harness
- id: H-3
  severity: P3
  principle: PR-5
  source: 'core/components/skills/platform-adapter/SKILL.md:36 (main): pr-files is ''for a PR over the 300-file
    diff limit''; the fetcher on this branch, core/components/plays/check-change/scripts/fetch_pr_context.py:165-182,
    tries compare-diff first for every PR over 300 files.'
  file: core/components/skills/platform-adapter/SKILL.md
  lines:
  - 37
  also_in:
  - 'core/components/skills/platform-adapter/reference/github/verbs.md:31-37 (line 33: ''Use it for a PR whose file
    list pr-files cuts off at 3000 files'')'
  defect: 'The new row and the GitHub page say compare-diff is for a PR over the 3000-file limit of pr-files, so
    a reader takes pr-files as the answer for 301 to 3000 files. The only caller does the opposite: it tries compare-diff
    first, for any PR over 300 files (3 tries), and uses pr-files only when compare-diff fails or the head branch
    is unknown (fetch_pr_context.py:97, 170-182). The fetcher docstring (lines 14-19) and the GitLab page (gitlab/verbs.md:37,
    ''a caller falls back to pr-files'') say it correctly; the two lines in SKILL.md and github/verbs.md disagree
    with them. A future play author following the table would pick the verb in the wrong order.'
  fix: 'SKILL.md:37: ''The plain diff between two branches, with no file limit (for a PR over the 300-file diff
    limit; tried before pr-files; GitHub only; GitLab stops with a plain message)''. github/verbs.md:33: ''Use it
    for a PR over the 300-file diff limit; fall back to pr-files when it fails.'''
  category: harness
