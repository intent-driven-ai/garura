  - the same lines in the 6 other adapter copies (create-play/references, merge-change, propose-change, shape-eval,
    shape-plan, shape-slice)
  defect: compare-diff is GitHub only, but it is not in GITHUB_ONLY_VERBS. It has its own second 'if' with its own
    message (line 346), and the docstring counts it apart ('Five verbs ... compare-diff ... is GitHub only too',
    lines 25-31). The SKILL.md row says only 'GitHub only', without the 'GitLab stops with a plain message' the
    other five carry. So the six GitHub-only verbs follow two rules, in the code and in the table. The behaviour
    is right (exit code 2, nothing run, tested); the cost is that anyone who loops over GITHUB_ONLY_VERBS to list
    the GitHub-only verbs (as the test at test_platform_adapter.py:223 does) misses compare-diff, and the copies
