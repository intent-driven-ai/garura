  severity: P4
  principle: PR-3
  source: 'core/components/skills/platform-adapter/SKILL.md:51-55 (main): each GitHub-only row ends ''(GitHub only;
    GitLab stops with a plain message)''; core/components/plays/create-play/references/platform_adapter.py:247,335-338
