- id: Q-007
  category: executable-code
  file: core/components/plays/check-change/scripts/fetch_pr_context.py
  line: 176
  severity: P4
  basis: 'by hand: fallback leaves no trace'
  defect: 'When compare-diff fails three times, or no head branch is known, the fetcher falls back to pr-files without
    writing anything to stderr. The only sign is diff_source pr-files in the context file, and the compare error
    text is lost. A person finding a review built on the 3000-file list cannot tell why. Fix: write one stderr line
    with the last compare-diff stderr before the fallback.

    '
