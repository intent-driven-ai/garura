- id: Q-001
  category: tests
  file: core/components/plays/create-play/references/test_fetch_pr_context.py
  line: 1
  severity: P3
  basis: TEST-01 (new code needs a test; scan_taxonomy could not fire it because core/components/** is garura-prose)
    + by-hand check from categories.yaml tests entry
  defect: 'The create-play copy of fetch_pr_context.py gained the compare-diff path and the three-try loop, but
    its own test file (not in the diff, and a different file from the check-change one) has no compare-diff, retry,
    no-head or 3000-file case. It passes (13 of 13) only because it tests the old behaviour. If the two fetcher
    copies drift, nothing in create-play notices. Fix: bring the six new cases from core/components/plays/check-change/scripts/test_fetch_pr_context.py
