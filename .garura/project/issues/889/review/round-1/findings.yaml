- id: H-2
  severity: P3
  principle: PR-2
  source: core/components/skills/platform-adapter/SKILL.md:30-56 (main, 22 rows) and reference/github/verbs.md:3
    (main, 'One section per verb'); SKILL.md:108-110 (main, Step 2 halts 'Unknown verb' when no section matches).
