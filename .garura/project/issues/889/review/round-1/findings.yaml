  defect: The change moves the verb count to 23 in the description and the Verb Interface heading, but the same
    file still says 'one of the 16 supported verbs' (line 25) and 'NEVER add verbs beyond the 16 defined above without
    a schema change' (line 139). The skill now states 16 and 23 together, and its own constraint forbids the very
    verb this change adds. A model that runs this skill and obeys the constraint can refuse compare-diff, and a
    reader cannot tell how many verbs exist. The 16 was stale before this change (main:25,138) but the change edits
    the count in the same file and leaves the contradiction.
  fix: 'Change line 25 to ''One of the 23 supported verbs'' and line 139 to ''NEVER add verbs beyond the 23 defined
    above without a schema change'' (or name the table: ''beyond those in the Verb Interface table'').'
  pre_existing_in_part: true
