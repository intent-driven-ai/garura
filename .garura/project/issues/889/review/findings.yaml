- id: N-1
  severity: P3
  principle: PR-2
  source: 'reference/github/verbs.md:3 (main): the page is the ''normative reference'' and each section holds ''the
    exact gh command'' the adapter runs.'
  file: core/components/skills/platform-adapter/reference/github/verbs.md
  lines:
  - 10
  defect: Round 2 (Q-003) changed the adapter's view-pr to ask for two more fields, isCrossRepository and headRepositoryOwner
    (platform_adapter.py:108-112, all 7 copies), so the fetcher can name a fork's head as owner:branch. The GitHub
    page's view-pr section still shows the old field list (number ... mergeable,url). The page the adapter is said
    to mirror no longer shows what the adapter runs, and a reader who relies on the page does not learn that view-pr
    gives the fork facts that compare-diff's {owner}:{branch} head depends on.
  fix: 'In github/verbs.md line 10 add '',isCrossRepository,headRepositoryOwner'' to the --json list, and add a
    note under it: ''isCrossRepository and headRepositoryOwner say whether the PR comes from a fork and whose; compare-diff
    needs them to name the head.'' GitLab needs no change (its MR has no fork fields in the fetcher''s use; the
    fetcher reads them with .get).'
  category: harness
- id: N-2
  severity: P4
  principle: PR-2
  source: 'reference/github/verbs.md:3 (main): each section holds the exact command the adapter runs.'
  file: core/components/skills/platform-adapter/reference/github/verbs.md
  lines:
  - 208
  - 215
  - 217
  defect: The new create-issue-typed section says 'Stdout is the new issue's number', but the second command it
    shows has no '--jq .data.createIssue.issue.number' (the adapter adds it, platform_adapter.py:326), so run as
    written it prints JSON, not the number. The section also tells the reader to pass 'the parent's node id' but
    not how to get it; the adapter reads it with 'gh api repos/{owner}/{repo}/issues/{parent_number} --jq .node_id'
    before the second call. A person or model following the page, not the script, gets a different output and has
    to guess the parent step.
  fix: Add the parent look-up line to the code block (gh api repos/{owner}/{repo}/issues/{parent_number} --jq .node_id)
    and end the second command with --jq .data.createIssue.issue.number.
  category: harness
- id: Q-008
  category: tests
  file: core/components/plays/create-play/references/test_fetch_pr_context.py
  line: 125
  severity: P3
  basis: TEST-01 (new behaviour needs a test; scan_taxonomy cannot fire it on garura-prose) plus by-hand mutation
    check. Residual of round-1 Q-001.
  defect: 'test_compare_fallbacks in the create-play fetcher test covers only four cases (compare used, dropped
    call retried, three drops fall back, 404 stops). It has no case for the fork rule (owner:branch), the host without
    the compare command (exit 2), a PR with no head branch, or the exit-3 count check on the compare diff. These
    are the Q-003 data-safety guard and the stop rules. Proof: on a scratch copy of the create-play fetcher with
    compare_head changed to ignore forks, this suite still passes 17 of 17 (the check-change suite fails on the
    same change). So if the create-play fetcher copy loses the fork rule, nothing in create-play notices, and a
    fork PR reviewed from that copy can read another branch''s diff. Fix: copy the fork, exit 2, no-head and exit-3
    cases from core/components/plays/check-change/scripts/test_fetch_pr_context.py into test_compare_fallbacks (they
    need a head and a fork answer in view; the local run() helper takes a fixed view, so pass the view in), or make
    the two test files one shared file.

    '
- id: Q-009
  category: executable-code
  file: core/components/plays/check-change/scripts/fetch_pr_context.py
  line: 110
  severity: P3
  basis: 'by hand: data-safety of the external-call path (categories.yaml executable-code by_hand). Gap in the Q-003
    fix. Same defect in core/components/plays/create-play/references/fetch_pr_context.py:110 (identical copy).'
  defect: 'compare_head names the fork owner only when isCrossRepository is true AND headRepositoryOwner has a login.
    When isCrossRepository is true but the owner is missing or empty (a fork that was deleted, where the host returns
    no owner), it falls through to return the plain branch name (line 112). That is the exact Q-003 case: the compare
    runs against the base repository with the fork''s branch name, and if the base repository has a branch of the
    same name the review reads that other branch''s diff. Checked by calling compare_head with isCrossRepository
    true and headRepositoryOwner null or {login: ''''}: both return the plain name. The exit-3 count check catches
    it only when the file counts differ. Fix: when isCrossRepository is true and there is no owner login, return
    None so read_compare skips compare-diff and the review falls back to pr-files; change both fetcher copies and
    add a test case for it.

    '
