# categories.yaml - /check-change Step 2 (Assess Categories), PR #918, issue 889
# Derived from the content of the 26 changed paths. Playbooks read from the short-term copy
# .garura/project/issues/889/context/memory/knowledge/review/ (manifest beside it).
design_bearing: [harness]
categories:
  - id: executable-code
    what: "Python scripts the runtime executes: the code-host adapter (new compare-diff verb, 23 verbs) copied into 7 plays, and the PR-context fetcher (compare-diff fallback with 3 tries) in 2 places."
    evidence:
      - core/components/plays/check-change/scripts/fetch_pr_context.py
      - core/components/plays/check-change/scripts/platform_adapter.py
      - core/components/plays/create-play/references/fetch_pr_context.py
      - core/components/plays/create-play/references/platform_adapter.py
      - core/components/plays/merge-change/scripts/platform_adapter.py
      - core/components/plays/propose-change/scripts/platform_adapter.py
      - core/components/plays/shape-eval/scripts/platform_adapter.py
      - core/components/plays/shape-plan/scripts/platform_adapter.py
      - core/components/plays/shape-slice/scripts/platform_adapter.py
    playbook: review/code
    design_bearing: false
    treatment:
      layers: [layer-1]
      linters:
        - name: language linter (python)
          command: "ruff check <each changed .py path above>"
          note: "the repo commits no ruff config; ruff is installed on the machine; run with defaults"
        - name: check-pr-quality against the diff with the pr.md taxonomy (SEC-*, CODE-*, ARCH-*, BE-*, PERF-*, DATA-* rows)
          command: "check-pr-quality on pr.diff + changed_paths, taxonomy .garura/project/issues/889/context/memory/standards/rules/pr.md"
      runnable_checks:
        - "python3 core/components/plays/check-change/scripts/test_fetch_pr_context.py"
        - "python3 core/components/plays/create-play/references/test_platform_adapter.py"
      by_hand:
        - "Data-safety and external-call paths: the new compare-diff call (gh api, read-only), its retry loop (3 tries) and the fallback to pr-files; the exit-3 count check must still run on the compare diff."
        - "The adapter is meant to be byte-identical in all 7 plays and the fetcher in 2 places: confirm the copies agree (diff the copies)."
        - "No stray debug output, no secrets, deterministic where it claims to be."
  - id: tests
    what: "Test scripts for the fetcher and the adapter: new cases for the compare diff, the retry, the 3000-file case, the missing head branch, the GitLab stop, and the verb count 23."
    evidence:
      - core/components/plays/check-change/scripts/test_fetch_pr_context.py
      - core/components/plays/create-play/references/test_platform_adapter.py
    playbook: review/tests
    design_bearing: false
    treatment:
      layers: [layer-1, run-the-suite]
      linters:
        - name: coding-best-practice check on the test code plus the pr.md TEST-* rows via check-pr-quality
          command: "check-pr-quality on pr.diff + changed_paths, taxonomy .garura/project/issues/889/context/memory/standards/rules/pr.md; ruff check on the two test files"
      runnable_checks:
        - "python3 core/components/plays/check-change/scripts/test_fetch_pr_context.py (a red suite is a blocker)"
        - "python3 core/components/plays/create-play/references/test_platform_adapter.py (a red suite is a blocker)"
        - "python3 core/components/plays/create-play/references/test_fetch_pr_context.py (covers the changed create-play/references/fetch_pr_context.py; this test file is NOT in the diff and differs from the check-change copy, so the changed create-play copy has no new compare-diff cases - report it as a coverage note; at assessment it passed)"
      by_hand:
        - "Only the adapter copy in create-play/references has a test; the other 6 adapter copies have none of their own. Say so explicitly; do not treat 'not run' as passed."
      assessment_observation: "run once during assessment: test_fetch_pr_context (check-change) 13 passed 0 failed; test_platform_adapter 53 passed 0 failed; create-play test_fetch_pr_context passed."
  - id: harness
    what: "The platform-adapter skill: SKILL.md (verb count 22 to 23, new compare-diff row, unknown-verb message) and its per-platform verb reference pages (GitHub command; GitLab stop with exit 2 and fallback to pr-files)."
    evidence:
      - core/components/skills/platform-adapter/SKILL.md
      - core/components/skills/platform-adapter/reference/github/verbs.md
      - core/components/skills/platform-adapter/reference/gitlab/verbs.md
    playbook: review/harness
    design_bearing: true
    treatment:
      layers: [layer-1, layer-2]
      linters:
        - name: lint-components (source layout, because the PR changes core/components)
          command: "node .garura/core/tools/lint-components/index.js --layout source --target core/components"
          scope: "only a violation whose file is in changed_paths is a finding; count the others as 'there before'"
        - name: lint-play (per changed play)
          command: "python3 .garura/core/tools/lint-play/lint_play.py core/components/plays/<play>/SKILL.md --next-map .garura/project/issues/889/context/templates/standards/rules/pipeline-next.md"
          scope: "no play SKILL.md is in the diff (only scripts under 7 plays changed: check-change, create-play, merge-change, propose-change, shape-eval, shape-plan, shape-slice), so a finding is possible only if the run is widened; run it on those 7 plays for the record, and any result for a file not in changed_paths is 'there before'"
      runnable_checks: []
      by_hand:
        - "ICE-source rule: no compiled play SKILL.md changed, so no intent change to trace; the platform-adapter skill has no ICE source."
        - "Layer 2: ground from the base ref (git show main:<path>) and committed sources - ADR 025 (script-per-verb), docs/philosophy, glossary, the harness standard, standards read through the memory tool - never from the new text of the three changed files. Check: verb count and verb lists agree across SKILL.md, verbs.md pages and the adapter code on base-ref conventions; GitHub-only verb handling matches how existing GitHub-only verbs are documented; the skill keeps its pure verb interface."
  - id: issue-run-records
    what: "The issue's own run records in short-term memory: commit analysis, branch, self-review, PR body, PR json, issue json, porcelain scan, resolved rules, confirm-raise and work-description files written by earlier plays (commit-change, propose-change, start-change, check-change self-review)."
    evidence:
      - .garura/project/issues/889/context/analysis.yaml
      - .garura/project/issues/889/context/branch.json
      - .garura/project/issues/889/context/check-self-review.json
      - .garura/project/issues/889/context/commits.yaml
      - .garura/project/issues/889/context/confirm-raise.txt
      - .garura/project/issues/889/context/issue.json
      - .garura/project/issues/889/context/porcelain.txt
      - .garura/project/issues/889/context/pr-body.md
      - .garura/project/issues/889/context/pr.json
      - .garura/project/issues/889/context/resolved-rules.json
      - .garura/project/issues/889/context/self-review.md
      - .garura/project/issues/889/context/work-description.txt
    playbook: null
    playbook_missing: true
    note: "playbook missing: no review/ playbook covers play run records kept in an issue's short-term memory (the review/memory playbook is for core/components/memory knowledge, not run output). A playbook is owed. Treated as record data, not code, not design-bearing; no design is reconstructed for it."
    design_bearing: false
    treatment:
      layers: [layer-1]
      linters:
        - name: check-pr-quality secrets and hygiene rows on the added lines (SEC-*), for the record
          command: "check-pr-quality on pr.diff + changed_paths, taxonomy .garura/project/issues/889/context/memory/standards/rules/pr.md"
      runnable_checks: []
      by_hand:
        - "No secrets, home-folder paths, client or personal names, or Claude attribution in the added record lines (the self-review claims this; verify it)."
        - "The records agree with the code change: analysis.yaml lists exactly the 14 source files in the diff."
playbooks_not_applicable:
  - adrs
  - docs
  - memory
  - config-maps
memory_copies:
  review_shelf: .garura/project/issues/889/context/memory/knowledge/review/
  severity_taxonomy: .garura/project/issues/889/context/memory/standards/rules/pr.md
  manifest: .garura/project/issues/889/context/memory/manifest.json
