# categories.yaml - /check-change Step 2 (Assess Categories), PR #918, issue 889, review round 2
# Derived from the content of the 53 changed paths (15 under core/components, 38 under .garura/project/issues/889).
# Playbooks read from the short-term copy .garura/project/issues/889/context/memory/knowledge/review/ (manifest beside it).
# Shared memory copies checked, not refreshed: the review shelf and pr.md in the manifest are version 23387be24c0d, the same as Phoenix memory now.
design_bearing: [harness]
round: 2
round_1_fixes:
  H-1: "SKILL.md still said 'one of the 16 supported verbs' and 'NEVER add verbs beyond the 16'; make the counts agree with 23."
  H-2: "The 'Unknown verb' message listed 18 verbs and the 5 older GitHub-only verbs had no verbs.md section; make the message and the pages follow one rule for all GitHub-only verbs, compare-diff included."
  H-3: "SKILL.md row and github/verbs.md said compare-diff is for a PR over the 3000-file limit; it is tried first for any PR over 300 files, pr-files only after it fails."
  Q-001: "create-play copy of test_fetch_pr_context.py had no compare-diff, retry, no-head or 3000-file case."
  Q-002: "The 3 compare tries ran with no pause and retried unfixable failures (404, GitLab exit 2)."
  Q-003: "Compare used headRefName only; a fork PR could read another branch's diff. Ask view-pr for the fork facts and skip compare-diff or name the head owner:branch."
categories:
  - id: executable-code
    what: "Python scripts the runtime executes: the code-host adapter (compare-diff verb, 23 verbs; round 2 touched about 3 lines per copy) copied into 7 plays, and the PR-context fetcher (compare-diff fallback, pause between tries, stop on unfixable failure, fork handling) in 2 places."
    evidence:
      - core/components/plays/check-change/scripts/fetch_pr_context.py
      - core/components/plays/check-change/scripts/platform_adapter.py
      - core/components/plays/create-play/references/fetch_pr_context.py
      - core/components/plays/create-play/references/platform_adapter.py
      - core/components/plays/merge-change/scripts/platform_adapter.py
      - core/components/plays/propose-change/scripts/platform_adapter.py
      - core/components/plays/shape-eval/scripts/platform_adapter.py
      - core/components/plays/shape-plan/scripts/platform_adapter.py
      - core/components/plays/shape-slice/scripts/platform_adapter.py
    playbook: review/code
    design_bearing: false
    round_1_fixes_to_confirm: [Q-002, Q-003]
    confirm_notes:
      Q-002: "fetch_pr_context.py (both copies): a pause between tries; the loop breaks at once on exit 2 or a 404. Check the pause is bounded and the test sets it to 0."
      Q-003: "fetch_pr_context.py (both copies) and the adapter's view-pr fields: fork facts are asked for and a fork PR skips compare-diff or names owner:branch. Confirm the exit-3 count check still runs on the compare diff."
    treatment:
      layers: [layer-1]
      linters:
        - name: language linter (python)
          command: "ruff check <each changed .py path above>"
          note: "the repo commits no ruff config; run with defaults. Assessment run on the two changed folders found 1 error, E741 in core/components/plays/create-play/references/distill_gate_policy.py, a file NOT in changed_paths: 'there before', not a finding."
        - name: check-pr-quality against the diff with the pr.md taxonomy (SEC-*, CODE-*, ARCH-*, BE-*, PERF-*, DATA-* rows)
          command: "check-pr-quality on pr.diff + changed_paths, taxonomy .garura/project/issues/889/context/memory/standards/rules/pr.md"
      runnable_checks:
        - "python3 core/components/plays/check-change/scripts/test_fetch_pr_context.py"
        - "python3 core/components/plays/create-play/references/test_platform_adapter.py"
        - "python3 core/components/plays/create-play/references/test_fetch_pr_context.py"
      by_hand:
        - "Data-safety and external-call paths: compare-diff call (gh api, read-only), the retry loop with its pause and early stop, the fork rule, the fallback to pr-files; the exit-3 count check must still run on the compare diff."
        - "The adapter is meant to be byte-identical in all 7 plays and the fetcher in 2 places: confirm the copies agree (diff the copies). At assessment the 7 adapter copies share one md5 (47c9c5e8...)."
        - "No stray debug output, no secrets, deterministic where it claims to be; any sleep is bounded."
  - id: tests
    what: "Test scripts for the fetcher and the adapter: compare diff, retry, 3000-file case, missing head branch, GitLab stop, verb count 23; round 2 adds the compare-fallback cases to the create-play fetcher test and to the check-change one."
    evidence:
      - core/components/plays/check-change/scripts/test_fetch_pr_context.py
      - core/components/plays/create-play/references/test_fetch_pr_context.py
      - core/components/plays/create-play/references/test_platform_adapter.py
    playbook: review/tests
    design_bearing: false
    round_1_fixes_to_confirm: [Q-001, Q-002, Q-003]
    confirm_notes:
      Q-001: "create-play/references/test_fetch_pr_context.py now has test_compare_fallbacks (compare used, dropped call tried again, three drops fall back to pr-files, 404 stops at once). Confirm it runs from __main__ and fails if the fetcher copy drifts."
      Q-002: "the retry/pause/early-stop cases exist in both fetcher tests and COMPARE_PAUSE is set to 0 so the suite stays fast."
      Q-003: "a test pins the fork rule (skip compare-diff or owner:branch); say plainly if none does."
    treatment:
      layers: [layer-1, run-the-suite]
      linters:
        - name: coding-best-practice check on the test code plus the pr.md TEST-* rows via check-pr-quality
          command: "check-pr-quality on pr.diff + changed_paths, taxonomy .garura/project/issues/889/context/memory/standards/rules/pr.md; ruff check on the three test files"
      runnable_checks:
        - "python3 core/components/plays/check-change/scripts/test_fetch_pr_context.py (a red suite is a blocker)"
        - "python3 core/components/plays/create-play/references/test_platform_adapter.py (a red suite is a blocker)"
        - "python3 core/components/plays/create-play/references/test_fetch_pr_context.py (a red suite is a blocker; now in the diff)"
      by_hand:
        - "Only the adapter copy in create-play/references has a test; the other 6 adapter copies have none of their own (round 1 Q-005, logged not fixed). Say so; do not treat 'not run' as passed."
      assessment_observation: "run once during assessment: check-change test_fetch_pr_context 17 passed 0 failed; test_platform_adapter 53 passed 0 failed; create-play test_fetch_pr_context 17 passed 0 failed."
  - id: harness
    what: "The platform-adapter skill: SKILL.md (verb count, compare-diff row, unknown-verb message, the 16-versus-23 count lines) and its per-platform verb reference pages (GitHub command; GitLab stop with exit 2 and fallback to pr-files)."
    evidence:
      - core/components/skills/platform-adapter/SKILL.md
      - core/components/skills/platform-adapter/reference/github/verbs.md
      - core/components/skills/platform-adapter/reference/gitlab/verbs.md
    playbook: review/harness
    design_bearing: true
    round_1_fixes_to_confirm: [H-1, H-2, H-3]
    confirm_notes:
      H-1: "SKILL.md: no leftover 16; the 'one of the N supported verbs' line and the NEVER-add-verbs line agree with the 23-verb table."
      H-2: "SKILL.md Unknown-verb message lists all verbs the table has (or names the table); the five older GitHub-only verbs and compare-diff follow one rule across SKILL.md Step 2, the table, and both verbs.md pages ('One section per verb' header true or reworded). Ground the rule on base-ref conventions (git show main:<path>), not the new text."
      H-3: "SKILL.md compare-diff row and github/verbs.md say: for a PR over the 300-file diff limit, tried before pr-files, pr-files after it fails; matches fetch_pr_context.py and gitlab/verbs.md."
    treatment:
      layers: [layer-1, layer-2]
      linters:
        - name: lint-components (source layout, because the PR changes core/components)
          command: "node .garura/core/tools/lint-components/index.js --layout source --target core/components"
          scope: "only a violation whose file is in changed_paths is a finding; count the others as 'there before'"
        - name: lint-play (per changed play)
          command: "python3 .garura/core/tools/lint-play/lint_play.py core/components/plays/<play>/SKILL.md --next-map .garura/project/issues/889/context/templates/standards/rules/pipeline-next.md"
          scope: "no play SKILL.md is in the diff (only scripts under check-change, create-play, merge-change, propose-change, shape-eval, shape-plan, shape-slice); run on those 7 for the record; any result for a file not in changed_paths is 'there before'"
      runnable_checks: []
      by_hand:
        - "ICE-source rule: no compiled play SKILL.md changed, so no intent change to trace; the platform-adapter skill has no ICE source."
        - "Layer 2: ground from the base ref (git show main:<path>) and committed sources (ADR 025 script-per-verb, docs/philosophy, glossary, harness standard, standards and adapter docs read through the memory tool), never from the new text of the three changed files. Check verb count and verb lists agree across SKILL.md, both verbs.md pages and the adapter code; GitHub-only handling matches how existing GitHub-only verbs are documented; the skill keeps its pure verb interface."
        - "Round-1 H-4 (compare-diff outside GITHUB_ONLY_VERBS) was logged not fixed; do not re-raise it unless round 2 made it worse."
  - id: issue-run-records
    what: "The issue's own run records in short-term memory: commit analysis, branch, self-review, PR body, PR json, issue json, porcelain scan, resolved rules, confirm-raise, work-description; the memory copies and manifests the review itself made (review shelf, pr.md, grounding-harness adapter docs); the check-change template copies; and the round-1 review records (categories, findings, decision, layer1, posted, quality and design findings, pr.diff and context)."
