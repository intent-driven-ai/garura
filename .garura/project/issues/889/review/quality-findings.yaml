round_1_fixes:
  - id: Q-001
    result: fixed_in_part
    evidence: >
      core/components/plays/create-play/references/test_fetch_pr_context.py:125-173 now has test_compare_fallbacks
      (compare used, dropped call tried again, three drops fall back to pr-files, 404 stops at once), called from
      __main__ at line 181, 17 of 17 pass. Mutation check on a scratch copy: removing the early stop in
      read_compare makes this suite fail (IndexError), so drift in the retry and stop logic is caught.
      Still absent from this file: the fork rule, exit 2 (host without compare), the no-head skip, and the exit-3
      count check on the compare diff. A scratch copy with the fork rule removed from the create-play fetcher
      still passes 17 of 17. See Q-008.
  - id: Q-002
    result: fixed
    evidence: >
      fetch_pr_context.py (both copies, identical) lines 99-125: COMPARE_TRIES = 3, COMPARE_PAUSE = 5 seconds, so the
      wait is at most 2 x 5 = 10 seconds in all (the sleep runs before tries 2 and 3 only, line 120-121). The loop
      breaks at once on exit 0, on exit 2, or on a stderr matching HTTP 404 or 422 (line 123). Both fetcher tests set
      COMPARE_PAUSE = 0 (check-change test line 44, create-play test line 127), so the suite stays fast. Tests pin the
      three-drop fallback, the recovery on try 3, the 404 stop and the exit 2 stop (the exit 2 case is in the
      check-change test only).
  - id: Q-003
    result: fixed_in_part
    evidence: >
      The adapter's view-pr now asks for isCrossRepository and headRepositoryOwner (platform_adapter.py:109-112, same
      in all 7 copies); read live against this PR: isCrossRepository false, owner intent-driven-ai.
      compare_head (fetch_pr_context.py:106-112, both copies) returns owner:branch for a fork and the plain branch
      otherwise. The check-change test pins both (fork gives someone:fix-x; same repository gives the branch only);
      a scratch copy with the fork rule removed fails that test. The exit-3 count check still runs on the compare
      diff (fetch_pr_context.py:209-216; test "the compare diff still has to match the host's count"). Hole left:
      a fork PR whose owner is missing falls back to the plain branch name, the original defect. See Q-009.

