      being byte-identical to the tested copy (see Q-005). Not run is not treated as passed.

findings:
  - id: Q-001
    category: tests
    file: core/components/plays/create-play/references/test_fetch_pr_context.py
    line: 1
    severity: P3
    basis: "TEST-01 (new code needs a test; scan_taxonomy could not fire it because core/components/** is garura-prose) + by-hand check from categories.yaml tests entry"
    defect: >
      The create-play copy of fetch_pr_context.py gained the compare-diff path and the
      three-try loop, but its own test file (not in the diff, and a different file from the
      check-change one) has no compare-diff, retry, no-head or 3000-file case. It passes (13 of 13)
      only because it tests the old behaviour. If the two fetcher copies drift, nothing in
      create-play notices. Fix: bring the six new cases from
      core/components/plays/check-change/scripts/test_fetch_pr_context.py into this file, or make
      the two test files one shared file.
  - id: Q-002
    category: executable-code
    file: core/components/plays/check-change/scripts/fetch_pr_context.py
    line: 170
    severity: P3
    basis: "BE-13 / CODE-27 (retry and fallback) by hand; the grep rules cannot fire on garura-prose"
    defect: >
      The three tries run back to back with no pause, and they retry every failure. A dropped
      connection (the case the comment names) is likely to drop again at once, so the retries add
      little. A permanent answer is also retried three times: a 404 for a missing branch, or exit 2
      when the host is GitLab (compare-diff stops there by design). Cost is small, but the
      retry does not do the job its comment claims. Fix: sleep a second or two between tries
      (time.sleep) and break out of the loop at once when exit_code is 2 or stderr says 404.
  - id: Q-003
    category: executable-code
    file: core/components/plays/check-change/scripts/fetch_pr_context.py
    line: 160
    severity: P3
    basis: "by hand: data-safety of the external-call path (categories.yaml executable-code by_hand)"
    defect: >
      The compare uses headRefName only, and builds the call against the base repository. For a pull request
      from a fork, that name belongs to the fork. If the base repository has a branch
      with the same name, the compare returns that other branch's diff, and the review reads the
      wrong code. The exit-3 count check catches it only when the file counts happen to differ. For
      a same repository PR (how Garura works today) this is safe. Fix: ask view-pr for
      isCrossRepository and headRepositoryOwner, and either skip compare-diff for a fork or pass
      head as owner:branch.
  - id: Q-004
    category: executable-code
    file: core/components/plays/check-change/scripts/platform_adapter.py
    line: 123
    severity: P4
    basis: "by hand: external-call path; no taxonomy row fits"
    defect: >
      base and head go into the URL path unescaped. A branch name with # or ? (git allows both)
      cuts the path short and the call returns the wrong diff or a 404. A slash is fine; I ran a
      real compare with slashes in both names and got the right 26 files. Fix: quote the two names
      with urllib.parse.quote(name, safe="/"). Also applies to the same line in the other 6 adapter copies.
  - id: Q-005
    category: tests
    file: core/components/plays/check-change/scripts/platform_adapter.py
    line: 1
    severity: P4
    basis: "by hand: categories.yaml tests entry (6 of 7 adapter copies have no own test)"
    defect: >
      Seven copies of the adapter are kept identical by hand, and only the create-play copy is
      tested. They agree today (same md5), but nothing fails if one copy is edited alone, so the
      next change to the adapter can leave 6 plays on an untested older verb list. Fix: add a small
      check (in the test file or the linter) that compares the md5 of the 7 copies.
  - id: Q-006
    category: tests
    file: core/components/plays/check-change/scripts/test_fetch_pr_context.py
    line: 119
    severity: P4
    basis: "TEST-02 (test completeness) by hand"
    defect: >
      The tests do not cover a GitLab PR that exceeds 300 files, where compare-diff returns exit 2
      and the fetcher must fall through to pr-files, nor a compare-diff that exits 0 with an empty
      body. Both paths work by reading the code but are not pinned. Fix: add two cases to
      run_main with a compare-diff answer of exit_code 2 and of exit_code 0 with empty stdout.
  - id: Q-007
    category: executable-code
    file: core/components/plays/check-change/scripts/fetch_pr_context.py
    line: 176
    severity: P4
    basis: "by hand: fallback leaves no trace"
    defect: >
      When compare-diff fails three times, or no head branch is known, the fetcher falls back to
      pr-files without writing anything to stderr. The only sign is diff_source pr-files in the
      context file, and the compare error text is lost. A person finding a review built on the
      3000-file list cannot tell why. Fix: write one stderr line with the last compare-diff
      stderr before the fallback.

counts: {P1: 0, P2: 0, P3: 3, P4: 4}
error: null
