      The adapter builds gh api repos/{owner}/{name}/compare/{base}...{head} with the diff Accept
      header: a GET, no write. Run live read-only against this PR's branches (main...feature/889-review-reads-full-diff):
      the diff holds 26 'diff --git' headers, the same as the PR's changedFiles 26.
  - check: "three-try loop and fallback to pr-files"
    result: pass_with_notes
    evidence: >
      fetch_pr_context.py lines 169-182: up to COMPARE_TRIES (3) calls, break on exit 0, then
      pr-files when all fail or head is unknown. Tests pin 3 calls then pr-files, a recovery on
      the 3rd call, and the no-head skip. Notes: Q-002, Q-003, Q-004.
  - check: "exit-3 count check still runs on the compare diff"
    result: pass
    evidence: >
      The count check (changed_files_reported vs paths in the diff) sits after the diff source
      is chosen and applies to compare-diff output; test 'the compare diff still has to match the
      host's count ... (exit 3)' passes.
  - check: "7 adapter copies byte-identical"
    result: pass
    evidence: "md5 0253169911938fab976bbe5d259db9fa for all 7 platform_adapter.py copies (check-change, create-play, merge-change, propose-change, shape-eval, shape-plan, shape-slice)."
  - check: "2 fetcher copies byte-identical"
    result: pass
    evidence: "md5 4f8b81085c0f24cd558a602e82ad9495 for check-change and create-play fetch_pr_context.py."
  - check: "no debug output, secrets, home paths in added code lines"
    result: pass
