    note: "Filed as #919. Round 2 did not make it worse: compare-diff still has its own second 'if' in dispatch (platform_adapter.py:347) and the docstring still counts it apart (lines 25-31). Its SKILL.md row now carries 'GitLab stops with a plain message', so the table half of H-4 is closed; the code half is #919."
adapter_code_check:
  - "compare-diff (github/verbs.md): gh api repos/{owner}/{repo}/compare/{base}...{head} -H 'Accept: application/vnd.github.diff' = _gh argv (platform_adapter.py:121-125). Fork head as {owner}:{branch} = compare_head() in fetch_pr_context.py:106-112. GitLab exit 2, nothing run = dispatch lines 347-350. Match."
  - "set-issue-type, edit-issue-body, remove-label: page commands equal the _gh argv (lines 182-191). Match."
  - "remove-sub-issue: child id look-up on /repos/{owner}/{repo}/issues/{child}, then DELETE /repos/.../issues/{parent}/sub_issue with sub_issue_id, equals dispatch lines 354-361. Match."
  - "create-issue-typed: the two GraphQL calls match the query and mutation constants; two gaps, see N-2."
  - "GitLab stop entries: exit code 2, nothing run = dispatch lines 343-350. Match (the code message says 'no issue types or sub-issues' for all five; the pages give a per-verb reason; harmless)."
  - "view-pr: the adapter now asks for two more fields; the page does not. See N-1."
findings:
  - id: N-1
    severity: P3
    principle: PR-2
    source: "reference/github/verbs.md:3 (main): the page is the 'normative reference' and each section holds 'the exact gh command' the adapter runs."
    file: core/components/skills/platform-adapter/reference/github/verbs.md
    lines: [10]
    defect: "Round 2 (Q-003) changed the adapter's view-pr to ask for two more fields, isCrossRepository and headRepositoryOwner (platform_adapter.py:108-112, all 7 copies), so the fetcher can name a fork's head as owner:branch. The GitHub page's view-pr section still shows the old field list (number ... mergeable,url). The page the adapter is said to mirror no longer shows what the adapter runs, and a reader who relies on the page does not learn that view-pr gives the fork facts that compare-diff's {owner}:{branch} head depends on."
    fix: "In github/verbs.md line 10 add ',isCrossRepository,headRepositoryOwner' to the --json list, and add a note under it: 'isCrossRepository and headRepositoryOwner say whether the PR comes from a fork and whose; compare-diff needs them to name the head.' GitLab needs no change (its MR has no fork fields in the fetcher's use; the fetcher reads them with .get)."
  - id: N-2
    severity: P4
    principle: PR-2
    source: "reference/github/verbs.md:3 (main): each section holds the exact command the adapter runs."
    file: core/components/skills/platform-adapter/reference/github/verbs.md
    lines: [208, 215, 217]
    defect: "The new create-issue-typed section says 'Stdout is the new issue's number', but the second command it shows has no '--jq .data.createIssue.issue.number' (the adapter adds it, platform_adapter.py:326), so run as written it prints JSON, not the number. The section also tells the reader to pass 'the parent's node id' but not how to get it; the adapter reads it with 'gh api repos/{owner}/{repo}/issues/{parent_number} --jq .node_id' before the second call. A person or model following the page, not the script, gets a different output and has to guess the parent step."
    fix: "Add the parent look-up line to the code block (gh api repos/{owner}/{repo}/issues/{parent_number} --jq .node_id) and end the second command with --jq .data.createIssue.issue.number."
