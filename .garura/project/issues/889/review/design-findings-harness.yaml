    result: confirmed fixed
    evidence: "The Unknown-verb message (SKILL.md:111) now lists 23 verbs, the same 23 as the table. Each of github/verbs.md and gitlab/verbs.md has 23 '## ' sections, the same 23 names in the same order as the table. The five GitHub-only verbs and compare-diff each have an entry on both pages (GitHub: command; GitLab: 'Not on GitLab ... exit code 2 and runs nothing'). Step 2 (find the section whose heading matches) now finds all 23, and 'One section per verb' (github:3, gitlab:3) holds."
