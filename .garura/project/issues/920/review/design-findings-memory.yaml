    result: "pass. core/components/memory/standards/rules/severity.md is not in HEAD (git ls-tree: no path with 'severity' other than pr.md's neighbours; none named severity). Deleted by 865faa23."
  - check: "pr.md matches main"
    result: "pass. git diff main HEAD on core/components/memory/standards/rules/pr.md: empty. The 'Findings this table cannot match' line is gone with the page. G6: the taxonomy stays mechanical."
  - check: "The change-reviewer agent matches main"
    result: "pass. git diff main HEAD on core/components/agents/change-reviewer.md: empty. Its Job 2 again says 'a severity drawn from the PR severity taxonomy', and its Grounding row no longer asks the tool for severity.md."
  - check: "rules/_index.md matches main for the severity rows"
    result: "pass. The diff of _index.md against main is two rows only: the new pipeline-next.md row and the loop-contract.md row (knowledge plays -> ADR 059). grep -i severity in _index.md finds only the pr.md row, as on main. No pointer to severity.md remains."
  - check: "No dangling pointer to severity.md or 'the severity rules' outside the review records"
    result: "pass. grep over the repo (excluding .git and .garura/project/) finds none in core/, docs/, .claude/, .garura/user-provided/."
  - check: "The work rules' severity line points to nothing missing"
    result: "pass. managing-work.md, 'A Bug carries its severity in its text': 'Until the severity rules exist (#934), the product owner sets it.' It points to issue #934, not to a file, and says who sets the severity meanwhile. It keeps the main rule that severity is text, not a label (G9). Wording of that file belongs to the documentation category."

