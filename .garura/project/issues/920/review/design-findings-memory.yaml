grounding:
  principles:
    - id: G1
      principle: "naming.yaml is the one list of verbs; a verb no part uses should not stay listed."
      source: "main:core/components/memory/standards/rules/naming.md (rule 3)"
    - id: G2
      principle: "rename-map.yaml lists every name changed when the naming standard was adopted; check_old_names.py reads it to find a stale old name anywhere in the repo."
      source: "main:core/components/memory/standards/rules/naming.md (intro); main:core/tools/naming/check_old_names.py"
    - id: G3
      principle: "The ADR template's core fields mirror schemas/product-os/decision.yaml, and adr.py lint checks a record against the template."
      source: "main:core/components/memory/standards/schemas/product-os/decision.yaml (#632 block); main:core/components/memory/standards/templates/adr.md (intro)"
    - id: G4
      principle: "The standards index lists every file the branch changes; a cross-reference names something that exists."
      source: "knowledge/review/memory.md playbook copy (.garura/project/issues/920/context/memory/knowledge/review/memory.md)"
    - id: G5
      principle: "A 'member' play is one of start-change / commit-change / propose-change / check-change / merge-change."
      source: "main:core/components/memory/standards/rules/pipeline-position.md (table 'The two sequences')"
    - id: G6
      principle: "The PR severity taxonomy is mechanical (no judgment) and its four buckets mean: P1 blocker (security, secrets, injection, auth, data-loss, breaking API contract, migration safety); P2 major, highlights without blocking; P3 minor; P4 nit, suppressed by default. A page that adds judgment rules must agree with these buckets."
      source: "standards/rules/pr.md via the memory tool (copy .garura/project/issues/920/context/memory/standards/rules/pr.md, 'Severity buckets'); knowledge/review/memory.md playbook copy ('pr.md and severity.md must agree')"
    - id: G7
      principle: "Parts of a harness: an agent gathers context and writes it to files; a skill does the work; a script is the mechanical part with no judgment. Memory is never read by a path: an agent fetches it through the memory tool into short-term memory, and the skill reads that copy. A play's own step-to-step files are read directly. Only agents call the tool; plays read no memory."
      source: "main:docs/standards/harness-standard.md (the parts table; principles 2, 3, 9, 11); main:docs/adr/039 (section 1 'breaks the guardrail', section 2, section 11)"
    - id: G8
      principle: "Only a person confirms a business intent and only a person accepts a decision record."
      source: "standards/rules/gate-config.md via the memory tool (copy .garura/project/issues/920/context/memory/grounding-memory/standards/rules/gate-config.md, lines 105-107); main:docs/adr/031, main:docs/adr/036"
    - id: G9
      principle: "A severity of a Bug lives in the text, not a label ('No labels, for now ... severity')."
      source: "main:.garura/user-provided/managing-work.md (Tracker rules, 'No labels, for now')"
  not_applicable:
    - "knowledge/_DESIGN.md governs knowledge shelf files; the branch changes no file under memory/knowledge/."
  memory_copies: ".garura/project/issues/920/context/memory/grounding-memory/manifest.json (knowledge/_DESIGN.md and standards/rules/gate-config.md, phoenix tier, copied through the memory tool)"

