grounding:
  principles:
    - {id: G1, principle: "naming.yaml is the one list of verbs; a verb no part uses should not stay listed.", source: "main:core/components/memory/standards/rules/naming.md (rule 3)"}
    - {id: G2, principle: "rename-map.yaml lists every name changed by the naming standard; check_old_names.py reads it to find a stale old name.", source: "main:core/components/memory/standards/rules/naming.md (intro); main:core/tools/naming/check_old_names.py"}
    - {id: G3, principle: "The ADR template's core fields mirror schemas/product-os/decision.yaml; adr.py lint checks a record against the template.", source: "main:core/components/memory/standards/schemas/product-os/decision.yaml (#632 block); main:core/components/memory/standards/templates/adr.md (intro)"}
    - {id: G4, principle: "The standards index lists every file the branch changes; a cross-reference names something that exists.", source: "knowledge/review/memory.md playbook copy (context/memory/knowledge/review/memory.md)"}
    - {id: G5, principle: "A member play is one of start-change / commit-change / propose-change / check-change / merge-change.", source: "main:core/components/memory/standards/rules/pipeline-position.md (table 'The two sequences')"}
    - {id: G6, principle: "The PR severity taxonomy (pr.md) is mechanical, with four buckets P1-P4; an edit to pr.md must keep it so. A change that does not touch pr.md leaves it as main has it.", source: "standards/rules/pr.md via the memory tool (copy context/memory/standards/rules/pr.md); knowledge/review/memory.md playbook copy"}
    - {id: G9, principle: "Garura's tracker rule: no labels, a Bug's severity lives in the text.", source: "main:.garura/user-provided/managing-work.md (Tracker rules, 'No labels, for now')"}
  not_applicable:
    - "knowledge/_DESIGN.md governs knowledge shelf files; the branch changes no file under memory/knowledge/."

