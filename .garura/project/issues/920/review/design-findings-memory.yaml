  - check: "Cross-references and index"
    result: "pass. severity.md and pipeline-next.md are listed in rules/_index.md; severity.md names standards/rules/pr.md (exists); pr.md names standards/rules/severity.md (exists in the repo, not yet in any memory tier - see change C1); ADR 059 is linked from docs/adr/_index.md; ADR 046 Status line carries the forward pointer."
  - check: "severity.md is written for any team on the Phoenix architecture"
    result: "pass with two nits (S5). No Garura issue number, ADR number, play, loop or agent name is in the body (grep for garura, ADR, check-change, change-reviewer, #<n>: empty). The examples span payments, imports and runbooks as well as harness work. The _index row names change-reviewer and /check-change as consumers, which is where consumers belong."
