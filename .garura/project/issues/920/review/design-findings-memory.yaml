    result: "pass. H-2 P1 (guardrail 2), H-1 P2 (loophole), F1 P3, F3 P4, F2 change are all listed with the same severity."
  - check: "Guardrails 1-6 each trace to a committed source"
    result: "1 harness-standard principle 11; 2 and 3 ADR 039 sections 2 and 10 (as amended on main); 4 harness-standard principle 11; 5 ADR 039 section 1; 6 gate-config.md lines 105-107 plus ADR 031/036. All six trace; the list as 'six guardrails' appears nowhere on main (see S5)."
