changes_owed:
- id: CH-1
  file: core/components/agents/change-reviewer.md (new severity wording) against core/components/plays/check-change/SKILL.md
    and scripts/compute_verdict.py
  note: 'The agent now says a "change" finding gets no severity. compute_verdict.py documents every finding as carrying
    `severity` P1..P4, and check-change''s Step 2 copies only pr.md as the severity source. The play and its verdict
    script do not know the new kind of finding, nor that the agent now wants severity.md copied into its grounding
    folder (the page is in no memory tier yet). Work the change owes: teach check-change, or file a Story.

    '
- id: CH-2
  file: core/components/plays/record-decision/SKILL.md and reference/ice.md (unchanged)
  note: 'adr-keeper''s context file gains `for_the_accepter`; the play''s adr-context.yaml checks (SE-3) and its
    ICE do not list the field. adr.py lint covers the record itself, so nothing slips through. Same kind as round-1
    F2.

    '
- id: CH-3
  file: core/components/loops/complete-discovery/scripts/round_state.py and check_knowledge.py
  note: 'Both ask the memory tool''s read-only `updates`. The committed rule on main (ADR 039 section 10 as amended
    by ADR 042 section 4) gives that only to a knowledge play''s check script; the widening to these two loop scripts
    is ADR 059''s, which is new on this branch. The product owner accepted exactly these two in round 1, so it is
    recorded here, not raised.

    '
- id: CH-4
  file: core/components/plays/install-garura/scripts/install.py (retire_renamed, unchanged)
  note: 'With build-knowledge and review-knowledge now mapped to null there is no new name to lay, so a project
    installed before the install manifest existed keeps its old copies of those two plays; only retire_stale (manifest)
    removes the three deleted plays. No project is known to be in that state.

    '
- id: C1
  note: 'Not defects: new things neighbouring parts do not know yet (the owner''s round-1 F2 precedent).'
  items:
  - 'severity.md is in no memory tier yet. change-reviewer''s Job 2 (changed in this PR) copies it with the memory
    tool; until it is promoted or installed the tool finds nothing (find --issue 920 returns matches: []).'
  - check-change (main) says every finding carries a P1-P4 class and a cited basis (SE-6); the new page says a change
    gets no severity. The play and its findings record have no place for a 'change' finding yet.
  - The review playbook knowledge/review/memory.md (Phoenix memory) says 'does the severity taxonomy stay mechanical'
    and has no word of severity.md.
  - test_naming_tools.py has no case for a name mapped to null (the behaviour F1 relies on); the rename-map row
    in rules/_index.md still says 'Every old name and its new name'; schemas/product-os/_index.md's decision.yaml
    row does not list for_the_accepter.
