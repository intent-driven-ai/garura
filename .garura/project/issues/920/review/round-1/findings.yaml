- id: H-1
  severity: P3
  standard_id: null
  file: core/components/agents/adr-keeper.md
  lines: added paragraph after the memory-reading sentence, about 'the seed of the memory in the repository it is
    decided in'
  principle: G4 - memory is never read by a path; an installed agent does not reach into the source tree. G3 - memory
    only through the tool.
  committed_source: docs/standards/harness-standard.md principles 9 and 11 at main; .claude/rules/garura-memory.md
  finding: 'The new text tells adr-keeper that when a decision changes the seed of the memory in the repository,
    ''that seed is a repository file, not a memory tier: read it as one''. That opens a by-path read of memory content
    (the seed under core/components/memory/) from an installed agent, beside lines that forbid it. The text names
    no path and no limit, so an agent can read any memory file by its path. The same paragraph says to compare it
    with a tier''s copy ''only through the tool''s read'', which shows the intended limit but not what the allowed
    file read is.

    '
  suggestion: Name the one thing allowed (for example the single file the decision edits, given in the brief) and
    say that it is not a lookup of memory, or drop the carve-out and have the person's brief carry the seed text.
  category: harness
- id: H-2
  severity: P3
  standard_id: null
  file: core/components/loops/_shared/loop-run.md
  lines: R5c step 1 (group_questions.py ... --memory-tool .garura/core/tools/memory/memory.py)
  principle: G3 - the memory tool is called by agents; the one exception is a check script asking the read-only
    `updates`.
  committed_source: docs/adr/039 section 10 as amended by docs/adr/042 section 4 at main
  finding: 'R5c step 1 has the loop script group_questions.py call the memory tool (`updates`). That script groups
    questions; it is not a check script. The same call was in the deleted /search-knowledge play (there before),
    so this PR keeps an exception that the committed rule gives only to check scripts. The exception text this PR
    writes (in the new ADR, not used as grounding) lists check_knowledge.py and round_state.py, not group_questions.py,
    so the three scripts and the exception do not match.

    '
  suggestion: Either let the agent pass the waiting updates to group_questions.py (as a file) so the script calls
    no tool, or name group_questions.py in the exception wherever the exception is written.
  category: harness
