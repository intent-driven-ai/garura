  file: core/components/agents/knowledge-builder.md
  lines: '''The knowledge step'', part 2 Build (the propose block and ''name the update it returns'')'
  principle: G1 - the artifact the next step reads must be written by the step that knows it; the build record is
    the contract between the agent and the check.
  committed_source: docs/standards/harness-standard.md principle 2 at main
  finding: 'author-knowledge-page now writes `for_project_memory` into its draft and stops there. The check script''s
