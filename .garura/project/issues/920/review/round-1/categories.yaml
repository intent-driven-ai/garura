# categories.yaml - work categories present in PR #932 (issue 920). Derived from the diff, not from a fixed list.
# Treatments are taken from the playbook copies in short-term memory
# (.garura/project/issues/920/context/memory/knowledge/review/), nothing else.
pr: 932
base: main
shelf: .garura/project/issues/920/context/memory/knowledge/review/
severity_taxonomy: .garura/project/issues/920/context/memory/standards/rules/pr.md
next_map: .garura/project/issues/920/context/templates/standards/rules/pipeline-next.md
categories:

- id: harness
  playbook: review/harness
  design_bearing: true
  evidence:
    - core/components/agents/adr-keeper.md
    - core/components/agents/knowledge-builder.md
    - core/components/loops/_shared/loop-run.md
    - core/components/loops/complete-discovery/SKILL.md
    - core/components/loops/complete-discovery/reference/ice.md
    - core/components/plays/create-loop/SKILL.md
    - core/components/plays/create-loop/references/compiled-loop-example/SKILL.md
    - core/components/plays/create-loop/references/compiled-loop-example/reference/ice.md
    - core/components/skills/author-decision/SKILL.md
    - core/components/skills/author-knowledge-brief/SKILL.md
    - core/components/skills/author-knowledge-page/SKILL.md
    - core/components/skills/find-answers-in-sources/SKILL.md
    - core/components/skills/propose-answers/SKILL.md
    - core/grounding/glossary.md
    - "deleted plays: core/components/plays/{check-knowledge,research-knowledge,search-knowledge}/** (SKILL.md, reference/ice.md, stop-condition.yaml)"
  treatment:
    layers: [layer-1-linters, layer-2-design-grounding]
    reviewer: human (the design) + tool (conformance)
    linters:
      - name: lint-components (source layout; the repo holds Garura's source and the PR changes core/components/)
        command: node .garura/core/tools/lint-components/index.js --layout source --target core/components
      - name: lint-play (once for the changed play that still exists; the three knowledge plays are deleted, the complete-discovery loop is a loop)
        command: python3 .garura/core/tools/lint-play/lint_play.py core/components/plays/create-loop/SKILL.md --next-map .garura/project/issues/920/context/templates/standards/rules/pipeline-next.md
    runnable_checks:
      - Only a violation whose file is in changed_paths is a finding; count the rest as "there before".
      - A tool that is not installed is recorded "not installed"; a tool that crashes is recorded "did not run - first error line". Neither is a pass.
      - ICE-source rule applies (the repo holds the plays' source): an intent change in a compiled SKILL.md must trace to its reference/ice.md. Here the loop SKILL.md files and ice.md files both change; check they agree. The three deleted plays leave no ICE source to trace.
    design_grounding:
      required: true
      grounded_from: docs/philosophy/**, docs/adr/** (on the base ref), standards under memory/standards/rules/** (user-facing-voice, play-close, evidence-recording, loop-contract, naming), the glossary - never from the branch's new prose (ADR 059 is new on this branch and is NOT a grounding source).
      rubric: play->agent->skill->script wiring intact; intent change traces to ICE source; change holds the standards it is subject to.

- id: memory
  playbook: review/memory
  design_bearing: true
  evidence:
    - core/components/memory/standards/rules/_index.md
    - core/components/memory/standards/rules/loop-contract.md
    - core/components/memory/standards/rules/naming.md
    - core/components/memory/standards/rules/naming.yaml
    - core/components/memory/standards/rules/pipeline-next.md
    - core/components/memory/standards/rules/pipeline-position.md
    - core/components/memory/standards/rules/rename-map.yaml
    - core/components/memory/standards/templates/adr.md
  treatment:
    layers: [layer-1-linters, layer-2-design-grounding]
    reviewer: human (the design) + tool (conformance)
    linters: []   # known gap - no installed tool checks memory integrity
    runnable_checks:
      - "Done by hand, each check cited (known gap): file follows its template; frontmatter id matches path; evolve_when and [[...]] cross-references resolve to real files; file is listed in its shelf _index."
      - "Done by hand: renamed/removed names in naming.yaml, rename-map.yaml and pipeline-next.md still match the files that exist (check-knowledge, research-knowledge, search-knowledge are deleted)."
      - "Done by hand: the severity taxonomy stays mechanical."
    design_grounding:
      required: true
      grounded_from: knowledge/_DESIGN.md, knowledge/_index.md, knowledge/_TEMPLATE.md and the relevant standards, read through the memory tool - never from the branch's new text.

- id: decision-records
  playbook: review/adrs
  design_bearing: false
  evidence:
    - docs/adr/059-the-discovery-loops-knowledge-step-is-one-step-run-by-one-agent.md
    - docs/adr/039-memory-writes-go-to-short-term-memory-plays-read-no-memory.md
    - docs/adr/041-a-drive-runs-in-rounds-and-owns-its-questions.md
    - docs/adr/042-a-drive-finds-builds-and-reviews-the-knowledge-it-lacks.md
    - docs/adr/044-the-shared-drive-run-owns-the-steps-between-plays.md
    - docs/adr/046-one-naming-standard-for-every-harness-part.md
    - docs/adr/_index.md
  treatment:
    layers: [layer-1-linters]
    reviewer: human, line by line (the human judges whether the decision is right)
    linters: []   # known gap - no ADR linter exists in-repo
    runnable_checks:
      - "Done by hand (known gap), structural only, never the merit: required sections present; status is an allowed value; markdown well-formed; ADR 059 is numbered and linked from docs/adr/_index.md."
      - "The edits to ADRs 039, 041, 042, 044, 046 are one-line changes; confirm each is a name change and does not alter a decision."
    design_grounding:
      required: false

- id: executable-code
  playbook: review/code
  design_bearing: false
  evidence:
    - core/components/loops/complete-discovery/scripts/check_knowledge.py
    - core/components/loops/complete-discovery/scripts/group_questions.py
    - core/components/loops/complete-discovery/scripts/loop_preflight.py
    - core/components/loops/complete-discovery/scripts/record_review.py
    - core/components/loops/complete-discovery/scripts/round_state.py
    - core/components/plays/create-loop/references/*.py and references/compiled-loop-example/scripts/*.py (copies of the loop scripts)
    - core/components/plays/create-loop/scripts/lint_loop.py
    - core/components/plays/edit-loop/scripts/lint_loop.py
    - core/components/skills/author-knowledge-brief/scripts/render_brief.py
    - "deleted: core/components/plays/{check-knowledge,research-knowledge,search-knowledge}/scripts/*.py (non-test)"
  treatment:
    layers: [layer-1-linters]
    reviewer: the tool, against industry best practice
    linters:
      - name: "check-pr-quality (best-practice and severity checks against the diff, pr.md taxonomy, SEC-*, CODE-*, ARCH-*, BE-*, PERF-*, DATA-* rows)"
        command: "run the check-pr-quality skill (/check-quality) against .garura/project/issues/920/review/pr.diff with the taxonomy at .garura/project/issues/920/context/memory/standards/rules/pr.md; deterministic scan helper: python3 .claude/skills/check-pr-quality/scripts/scan_taxonomy.py"
      - name: language linter (whatever the target repo commits)
        command: "none committed in this repo (no ruff.toml, .ruff.toml or pyproject.toml); record 'no linter committed'. Syntax check by hand: python3 -m py_compile on each changed .py"
    runnable_checks:
      - "Rubric by hand: error handling, function size, no stray debug output, no secrets, safe handling of destructive operations, deterministic where it claims to be."
      - "Weigh hard the data-safety paths: record_review.py, round_state.py, loop_preflight.py, check_knowledge.py (touch git, the filesystem, memory updates)."
      - "Duplicated scripts (complete-discovery/scripts vs create-loop/references vs compiled-loop-example) must stay identical; check the copies agree."
    design_grounding:
      required: false
      note: the standard is industry best practice plus the pr.md taxonomy.

- id: tests
  playbook: review/tests
  design_bearing: false
  evidence:
    - core/components/plays/create-loop/references/test_loop_scripts.py
    - "deleted: core/components/plays/check-knowledge/scripts/test_review_knowledge_scripts.py"
    - "deleted: core/components/plays/research-knowledge/scripts/test_build_knowledge_scripts.py"
    - "deleted: core/components/plays/search-knowledge/scripts/test_search_knowledge_scripts.py"
  treatment:
    layers: [layer-1-linters, run-the-suite]
    reviewer: the tool
    linters:
      - name: check-pr-quality TEST-* rows (pr.md) on the test code - clear assertions, no skipped or disabled tests, no test that asserts nothing
        command: "run the check-pr-quality skill (/check-quality) against pr.diff; deterministic scan helper: python3 .claude/skills/check-pr-quality/scripts/scan_taxonomy.py"
    runnable_checks:
      - name: run the changed suite (a red suite is a blocker; never treat "not run" as "passed")
        command: python3 -m unittest discover -s core/components/plays/create-loop/references -p "test_loop_scripts.py"
      - "The three deleted test files go with their deleted plays; confirm no remaining play still imports or calls them. If a deleted test covered behaviour that moved to the loop, say whether test_loop_scripts.py covers it."
    design_grounding:
      required: false

- id: documentation
  playbook: review/docs
  design_bearing: false
  evidence:
    - docs/components/agents.md
    - docs/components/loops.md
    - docs/components/plays.md
    - .garura/user-provided/managing-work.md   # human-facing work-tracking guidance prose (new section on the unplanned epic)
  treatment:
    layers: [layer-1-linters]
    reviewer: the tool (the human opts out unless they choose to read it)
    linters: []   # known gap - no committed prose linter
    runnable_checks:
      - "Done by hand, each check cited (known gap): spelling and grammar; dead or broken links and paths (e.g. docs referring to the deleted check-knowledge, research-knowledge, search-knowledge plays); heading hierarchy; leftover TODOs; terminology consistency (docs/components names must match the renamed parts); completeness."
    design_grounding:
      required: false

- id: work-records
  playbook: null
  design_bearing: false
  playbook_missing: true
  note: >
    NEW category - no playbook covers it. These are machine-written records of play runs and
    the by-hand plan record, not prose, code, decisions or memory. Treat as Layer 1 only
    (nothing is graded against a design), with the hand checks below, until a playbook is written.
  evidence:
    - .garura/project/issues/920/context/**   # analysis, branch, commits, issue, pr, porcelain, pr-body, self-review, resolved-rules, work-description, commit-change/**
    - .garura/project/issues/920/context/memory/manifest.json and context/memory/standards/schemas/product-os/ontology.md   # short-term memory copy, not an edit to memory
    - .garura/project/issues/920/specs/redesign.md
    - .garura/project/issues/_adr/20261028T034030Z/**   # record-decision run artifacts
    - .garura/project/plans/606.yaml   # unplanned plan record, kept by hand until update-plan exists
  treatment:
    layers: [layer-1-linters]
    reviewer: the tool
    linters: []   # none
    runnable_checks:
      - "By hand: each .json and .yaml file parses (python3 -c 'import json,sys;json.load(open(sys.argv[1]))' and a yaml load)."
      - "By hand: plans/606.yaml names issue numbers and branch that match context/issue.json and context/branch.json."
      - "By hand: no secrets, tokens, absolute home paths or client data in the run records (SEC rows of pr.md)."
      - "Note: the records are not graded for design. specs/redesign.md is the issue's own spec, written on this branch; if a harness or memory finding wants it as grounding, flag the gap instead (circular)."
