outside_scope_recorded:
- The GitHub capability roll-up in merge-change (a capability is closed once every issue under it is closed) is recorded out
  of scope by the product owner.
- The installed tool folder .garura/core/tools/plan has no plan_status.py until a reinstall; owed on the product owner's word,
  not counted as a finding.
- ADR 064, ontology v15 and the design were read as the approved decision and not graded.
- plan_status.py rewrites the whole status line, so a trailing comment on that line is dropped; the docstring says comments
  are left as they are.
- test_merge_pr.py covers _mark_done only; _commit_records staging of the plan file and the main() paths have no test.
- The plan file for 717 shows story 1007 as Done in this PR, set ahead of the merge that the new rule says sets it.
- Older ontology lines name plays (/shape-slice, /update-plan, /discover-capabilities) in the Plan, Slice, ICE and Story kinds,
  the Q-answers and the changelog — the ontology should hold structure and rules only.
- Older changelog lines are not in date order.
