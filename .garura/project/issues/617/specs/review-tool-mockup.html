<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phoenix Outcome Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Light only, by choice (Kapil, 18 Oct). Layout: quiet rail on the left, one reading column, a decision column on the right. White and airy like the 15 Oct screenshot; Phoenix colours for action. */
:root {
  --bg: #FFFFFF;
  --rail: #F6F7FA;
  --raised: #F1F3F7;
  --line: #E4E7EE;
  --fg: #0A0E1A;
  --fg2: #5B6478;
  --fg3: #8A92A6;
  --accent: #0891B2;
  --accent-soft: rgba(8,145,178,.10);
  --key: #DB2777;
  --tag: #7C3AED;
  --add: #15803D; --add-soft: rgba(21,128,61,.10);
  --chg: #B45309; --chg-soft: rgba(180,83,9,.10);
  --del: #B91C1C; --del-soft: rgba(185,28,28,.08);
  --mark: rgba(236,72,153,.16);
  --sig: linear-gradient(90deg, #06B6D4 0%, #EC4899 100%);
  --shadow: 0 8px 28px rgba(10,14,26,.10);
  --f-head: "Space Grotesk", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --f-body: "Nunito", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --f-mono: "SF Mono", Monaco, Menlo, monospace;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.6 var(--f-body); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-head); letter-spacing: -.01em; text-wrap: balance; margin: 0; }
.label { font: 600 11px/1.2 var(--f-body); text-transform: uppercase; letter-spacing: .09em; color: var(--fg3); }

.app { display: grid; grid-template-columns: var(--rail-w, 340px) minmax(0,1fr); min-height: 100%; }

/* Rail */
.rail { background: var(--rail); border-right: 1px solid var(--line); padding: 24px 16px; display: flex; flex-direction: column; gap: 20px; position: sticky; top: 0; height: 100vh; overflow: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.brand b { font: 700 19px/1 var(--f-head); }
.brand small { display: block; font: 500 12px/1.2 var(--f-body); color: var(--fg2); margin-top: 3px; }
.seg { display: flex; background: var(--raised); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 8px; padding: 7px 12px; font-weight: 600; font-size: 13px; color: var(--fg2); white-space: nowrap; }
.seg.sections { flex-wrap: wrap; }
.quote { font: 13px/1.55 var(--f-mono); white-space: pre-wrap; background: var(--raised); border-radius: 8px; padding: 10px 12px; margin-top: 8px; }
.quote.now { background: var(--chg-soft); }
.lands { margin: 8px 0 0; color: var(--fg2); font-size: 12px; }
details.lands summary { cursor: pointer; color: var(--fg3); width: max-content; }
details.lands[open] summary { margin-bottom: 4px; }
.trace { margin-top: 6px; }
.tstep { position: relative; padding: 2px 0 22px 42px; }
.tstep::before { content: ''; position: absolute; left: 13px; top: 30px; bottom: 0; border-left: 1px dashed var(--line); }
.tstep:last-child::before { display: none; }
.tstep .num { position: absolute; left: 0; top: 0; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 12px var(--f-mono); border: 1px solid var(--add); color: var(--add); background: var(--bg); }
.tstep.changed .num { border-color: var(--chg); color: var(--chg); background: var(--chg-soft); }
.tstep.removed .num { border-color: var(--del); color: var(--del); background: var(--del-soft); }
.tstep .ask { font-weight: 600; margin-top: 3px; }
.tstep .found { color: var(--fg2); margin-top: 2px; }
.tstep .where { margin-top: 10px; font-size: 13px; }
.tstep .where .tier { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--fg3); margin-right: 8px; }
.tstep .now-l { margin-top: 12px; }
.tstep .gone { color: var(--del); }
.tstep.removed .where b { text-decoration: line-through; text-decoration-color: var(--del); }
.code { font: 12.5px/1.6 var(--f-mono); background: var(--raised); border-radius: 8px; padding: 6px 0; margin-top: 8px; overflow-x: auto; }
.code .ln { display: grid; grid-template-columns: 46px 1fr; }
.code .no { text-align: right; padding-right: 12px; color: var(--fg3); user-select: none; }
.code .t { white-space: pre-wrap; padding-right: 12px; color: var(--fg2); }
.code .ln.hit { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.code .ln.hit .t { color: var(--fg); }
.code.now .ln.hit { background: var(--chg-soft); box-shadow: inset 3px 0 0 var(--chg); }
.seg.sections button { flex: 1 0 30%; }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--fg); box-shadow: 0 1px 3px rgba(10,14,26,.12); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav .label { padding: 14px 8px 6px; }
.item { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 7px 8px; font-size: 14px; color: var(--fg); }
.item:hover { background: var(--raised); }
.item[aria-current="true"] { background: var(--accent-soft); color: var(--fg); }
.item { align-items: flex-start; line-height: 1.35; }
.item .dot { margin-top: 6px; }
.item .t { flex: 1; min-width: 0; white-space: normal; overflow-wrap: anywhere; }
.grip { position: absolute; top: 0; right: -3px; width: 7px; height: 100%; cursor: col-resize; z-index: 6; }
.grip::after { content: ""; position: absolute; top: 0; bottom: 0; left: 3px; width: 1px; background: transparent; transition: background .15s; }
.grip:hover::after, .grip.on::after { background: var(--accent); width: 2px; }
.resizing, .resizing * { cursor: col-resize !important; user-select: none; }
.bint-tag { display: inline-block; font: 700 9.5px/1 var(--f-body); letter-spacing: .06em; color: var(--key); background: var(--mark); border: 1px solid currentColor; border-radius: 4px; padding: 2px 4px; margin-right: 7px; vertical-align: 2px; }
.big.bint-tag, .big.ice-tag { font-size: 13px; padding: 4px 7px; vertical-align: 8px; margin-right: 12px; }
.ice-tag { display: inline-block; font: 700 9.5px/1 var(--f-body); letter-spacing: .06em; color: var(--tag); border: 1px solid currentColor; border-radius: 4px; padding: 2px 4px; margin-right: 7px; vertical-align: 2px; }
.item.l1 { padding-left: 22px; } .item.l2 { padding-left: 36px; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: transparent; border: 1px solid var(--line); }
.dot.added { background: var(--add); border-color: var(--add); }
.dot.changed { background: var(--chg); border-color: var(--chg); }
.dot.removed { background: var(--del); border-color: var(--del); }
.tick { width: 16px; text-align: center; font-size: 12px; color: var(--fg3); flex: none; }
.tick.accept { color: var(--add); } .tick.drop { color: var(--del); } .tick.send { color: var(--accent); }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding: 0 8px; font-size: 12px; color: var(--fg2); }
.linkish { border: 0; background: none; padding: 0; color: var(--fg2); text-decoration: underline; text-underline-offset: 3px; font-size: 12px; text-align: left; }

/* Top bar */
.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 14px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.top .title { flex: 1; min-width: 200px; }
.top .title b { font: 600 15px/1.3 var(--f-head); display: block; }
.top .title span { font-size: 12px; color: var(--fg2); }
.pill { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 12px; color: var(--fg2); background: var(--bg); }
.pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--add); box-shadow: 0 0 0 0 var(--add-soft); animation: pulse 2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--add-soft); } 70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
.btn { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 14px; font-weight: 600; font-size: 13px; }
.btn:hover { border-color: var(--fg3); }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn.primary[disabled] { opacity: .35; cursor: not-allowed; }
.btn.tool[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

.body { display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 0; flex: 1; }
.body.wide { grid-template-columns: minmax(0,1fr); }
.content { padding: 36px 32px 80px; min-width: 0; }
.content-in { max-width: 760px; }
.side { border-left: 1px solid var(--line); padding: 28px 24px 60px; display: flex; flex-direction: column; gap: 22px; min-width: 0; }

.note { border: 1px solid var(--line); background: var(--raised); border-radius: 10px; padding: 10px 14px; font-size: 13px; color: var(--fg2); display: flex; gap: 10px; align-items: baseline; }
.note b { color: var(--fg); font-weight: 700; }

/* Overview */
.ov h1 { font-size: clamp(30px, 4vw, 44px); line-height: 1.1; margin-top: 22px; max-width: 18ch; }
.ov h1 em { font-style: normal; color: var(--key); }
.ov .sub { color: var(--fg2); margin: 10px 0 0; }
.sig { height: 3px; width: 72px; background: var(--sig); border-radius: 2px; margin-top: 18px; }
.stats { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); margin-top: 34px; border-top: 1px solid var(--line); }
.stat { padding: 18px 18px 0 0; border-right: 1px solid var(--line); margin-right: 18px; }
.stat:last-child { border-right: 0; margin-right: 0; }
.stat .n { font: 600 38px/1.1 var(--f-head); font-variant-numeric: tabular-nums; margin-top: 8px; }
.stat .n.key { color: var(--key); }
.stat .h { font-size: 12px; color: var(--fg2); margin-top: 4px; }
.bar { height: 6px; background: var(--raised); border-radius: 3px; margin-top: 26px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--sig); border-radius: 3px; transition: width .4s; }
.barcap { display: flex; justify-content: space-between; font-size: 12px; color: var(--fg2); margin-top: 8px; }
.sect { margin-top: 44px; }
.sect-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.sect-h h2 { font-size: 21px; }
.sect-h span { font-size: 12px; color: var(--fg2); }
.row { display: grid; grid-template-columns: 110px minmax(0,1fr) auto; gap: 16px; align-items: center; padding: 16px 4px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; }
.row:hover { background: var(--rail); }
.row .rt { font: 600 15px/1.35 var(--f-head); }
.row .rw { font-size: 13px; color: var(--fg2); margin-top: 2px; }
.row .go { color: var(--fg3); }

.chip { display: inline-flex; align-items: center; gap: 5px; font: 600 11px/1 var(--f-body); padding: 5px 8px; border-radius: 6px; background: var(--raised); color: var(--fg2); white-space: nowrap; }
.chip.added { background: var(--add-soft); color: var(--add); }
.chip.changed { background: var(--chg-soft); color: var(--chg); }
.chip.removed { background: var(--del-soft); color: var(--del); }
.chip.ap { background: transparent; border: 1px solid currentColor; }
.chip.ap-approved, .ms.ap-approved b { color: var(--add); }
.chip.ap-changed, .ms.ap-changed b { color: var(--chg); }
.chip.ap-progress, .ms.ap-progress b { color: var(--accent); }
.chip.ap-accepted { color: var(--add); border-style: dashed; }
.chip.ap-dropped { color: var(--del); border-style: dashed; }
.mstate { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 0; margin-top: 18px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.mstate .ms-h { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--rail); font-size: 12px; color: var(--fg2); }
.mstate .ms { padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.mstate .ms + .ms { border-left: 1px solid var(--line); }
.mstate .ms b { font: 600 30px/1.1 var(--f-head); font-variant-numeric: tabular-nums; }
.mstate .ms span { font-weight: 700; font-size: 13px; }
.mstate .ms small { font-size: 12px; color: var(--fg3); }
.chip.kind { background: transparent; border: 1px solid var(--line); }
.chip.link { background: transparent; border: 1px solid var(--line); color: var(--accent); font-size: 12px; padding: 6px 10px; cursor: pointer; }
.chip.link:hover { border-color: var(--accent); }

/* Piece */
.crumb { font-size: 12px; color: var(--fg2); display: flex; gap: 6px; flex-wrap: wrap; }
.piece h1 { font-size: clamp(26px, 3.4vw, 36px); line-height: 1.15; margin: 10px 0 12px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.why { margin: 16px 0 0; color: var(--fg2); font-size: 14px; }
.why b { color: var(--fg); }
.doc { position: relative; margin-top: 30px; }
.sec { padding: 16px 0 16px 18px; border-left: 2px solid transparent; position: relative; }
.sec + .sec { border-top: 1px solid var(--line); }
.sec.added { border-left-color: var(--add); }
.sec.removed { border-left-color: var(--del); }
.sec.changed { border-left-color: var(--chg); }
.sec.removed .tx { text-decoration: line-through; text-decoration-color: var(--del); color: var(--fg2); }
.sec .tx { margin-top: 6px; font-size: 16px; max-width: 66ch; }
.tx p { margin: 0 0 8px; } .tx p:last-child { margin-bottom: 0; }
.tx ul { margin: 2px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.tx li::marker { color: var(--fg3); }
.tx li.li-add { color: var(--add); background: var(--add-soft); border-radius: 4px; padding: 1px 6px; margin-left: -6px; }
.tx li.li-add::marker { content: "+  "; color: var(--add); font-weight: 700; }
.tx li.li-del { color: var(--del); text-decoration: line-through; background: var(--del-soft); border-radius: 4px; padding: 1px 6px; margin-left: -6px; }
.tx li.li-del::marker { content: "–  "; color: var(--del); font-weight: 700; }
.facts { display: flex; flex-wrap: wrap; gap: 10px 28px; margin: 18px 0 0; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.facts div { min-width: 0; } .facts dt { font: 600 11px/1.2 var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--fg3); }
.facts dd { margin: 4px 0 0; font-size: 13px; color: var(--fg); }
.sec .ed { position: absolute; top: 12px; right: 0; display: flex; gap: 4px; opacity: 0; transition: opacity .15s; }
.sec:hover .ed, .sec:focus-within .ed { opacity: 1; }
.ed button { border: 1px solid var(--line); background: var(--bg); border-radius: 7px; font-size: 12px; padding: 3px 8px; color: var(--fg2); }
del { color: var(--del); text-decoration-thickness: 1.5px; background: var(--del-soft); border-radius: 3px; padding: 0 2px; }
ins { color: var(--add); text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px; background: var(--add-soft); border-radius: 3px; padding: 0 2px; }
mark.cmt { background: var(--mark); color: inherit; border-bottom: 2px solid var(--key); border-radius: 2px; }
.p-del { text-decoration: line-through; text-decoration-color: var(--accent); text-decoration-thickness: 2px; color: var(--fg2); }
.p-ins { color: var(--accent); font-weight: 600; }
.mode-final .p-del { display: none; }
.links { margin-top: 26px; display: flex; flex-direction: column; gap: 10px; }
.links .chips { gap: 8px; }
.area { position: absolute; border: 2px solid var(--key); background: var(--mark); border-radius: 6px; pointer-events: none; }
.area span { position: absolute; top: -10px; right: -10px; width: 20px; height: 20px; border-radius: 50%; background: var(--key); color: #fff; font: 700 11px/20px var(--f-body); text-align: center; }
.pointing .doc { cursor: crosshair; user-select: none; }
.pointing .doc::after { content: "Drag a box over the part you want to talk about"; position: absolute; top: -26px; left: 18px; font-size: 12px; color: var(--accent); }

/* Side */
.decide { display: flex; flex-direction: column; gap: 8px; }
.decide .q { font: 600 15px/1.35 var(--f-head); margin-bottom: 4px; }
.dbtn { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; text-align: left; }
.dbtn small { display: block; color: var(--fg2); font-size: 12px; }
.dbtn .k { margin-left: auto; font: 11px var(--f-mono); color: var(--fg3); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
.dbtn:hover { border-color: var(--fg3); }
.dbtn[aria-pressed="true"].accept { border-color: var(--add); background: var(--add-soft); }
.dbtn[aria-pressed="true"].send { border-color: var(--accent); background: var(--accent-soft); }
.dbtn[aria-pressed="true"].drop { border-color: var(--del); background: var(--del-soft); }
.ico { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; flex: none; }
.accept .ico { color: var(--add); background: var(--add-soft); } .send .ico { color: var(--accent); background: var(--accent-soft); } .drop .ico { color: var(--del); background: var(--del-soft); }
.thread { display: flex; flex-direction: column; gap: 12px; }
.cm { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.cm q { display: block; quotes: none; color: var(--fg2); border-left: 2px solid var(--key); padding-left: 8px; margin-bottom: 6px; font-size: 12px; }
.cm .meta { display: flex; justify-content: space-between; gap: 8px; color: var(--fg3); font-size: 11px; margin-top: 6px; }
.cm.garura { background: var(--raised); border-color: transparent; }
.cm.garura .who { color: var(--accent); font-weight: 700; }
.state { font-weight: 700; }
.state.open { color: var(--key); } .state.answered { color: var(--accent); } .state.resolved { color: var(--add); }
.composer { border: 1px solid var(--accent); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
.composer textarea { width: 100%; min-height: 70px; border: 0; resize: vertical; background: transparent; color: var(--fg); font: 14px/1.5 var(--f-body); outline: none; }
.composer .row2 { display: flex; justify-content: flex-end; gap: 6px; }
.feed { font-size: 12px; color: var(--fg2); display: flex; flex-direction: column; gap: 4px; }
.feed div { display: flex; gap: 8px; } .feed code { font-family: var(--f-mono); color: var(--fg3); }
.empty { font-size: 13px; color: var(--fg3); }

/* Popover */
.pop { position: absolute; z-index: 20; display: flex; gap: 2px; background: var(--fg); border-radius: 10px; padding: 4px; box-shadow: var(--shadow); }
.pop button { border: 0; background: transparent; color: var(--bg); font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 7px; }
.pop button:hover { background: color-mix(in srgb, var(--bg) 18%, transparent); }

.scrim { position: fixed; inset: 0; background: rgba(10,14,26,.45); display: grid; place-items: center; z-index: 30; padding: 16px; }
.modal { background: var(--bg); border-radius: 16px; padding: 28px; max-width: 460px; width: 100%; box-shadow: var(--shadow); }
.modal h2 { font-size: 24px; margin-bottom: 8px; }
.modal p { color: var(--fg2); margin: 6px 0; }
.modal .sig { margin: 14px 0 18px; }

@media (max-width: 1080px) { .body { grid-template-columns: minmax(0,1fr); } .side { border-left: 0; border-top: 1px solid var(--line); } }
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0,1fr); }
  .rail { position: static; height: auto; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); }
  .nav { max-height: 260px; overflow: auto; }
  .grip { display: none; }
  .top, .content { padding-left: 16px; padding-right: 16px; }
  .side { padding-left: 16px; padding-right: 16px; }
  .stats { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .stat { border-right: 0; margin-right: 0; }
  .row { grid-template-columns: minmax(0,1fr) auto; } .row .chips { display: none; }
}

/* Catch up: one change per card, like Teams mobile Catch up */
.btn.cu-open { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.cu-open:hover { filter: brightness(1.08); }
.cu-invite { margin-top: 30px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px; padding: 22px 24px; border-radius: 14px; background: var(--accent-soft); }
.cu-invite div { flex: 1; min-width: 220px; }
.cu-invite b { font: 600 19px/1.3 var(--f-head); display: block; }
.cu-invite span { font-size: 13px; color: var(--fg2); }
.cu { position: fixed; inset: 0; z-index: 40; background: var(--rail); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }

.cu-card.dragging { transition: none; cursor: grabbing; }
.cu-hint { position: absolute; top: 22px; z-index: 3; font: 700 13px/1 var(--f-head); letter-spacing: .08em; text-transform: uppercase; padding: 8px 12px; border-radius: 8px; border: 2px solid; opacity: 0; pointer-events: none; }
.cu-hint.r { right: 22px; color: var(--add); background: var(--add-soft); }
.cu-hint.l { left: 22px; color: var(--fg2); background: var(--raised); }

.cu-body .more { font-size: 12px; color: var(--fg3); padding: 12px 0 0 14px; }
.cu-say { padding: 12px 26px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.cu-say textarea { width: 100%; min-height: 64px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: 14px/1.5 var(--f-body); color: var(--fg); background: var(--bg); resize: vertical; }
.cu-say textarea:focus { outline: none; border-color: var(--accent); }
.cu-say .row2 { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.cu-say .lbl { font-size: 13px; font-weight: 600; }

.cu-act { display: flex; flex-direction: column; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 6px; font-size: 13px; font-weight: 700; }

.cu-end h2 { font-size: clamp(28px, 4vw, 40px); }

.cu-sum div { font-size: 12px; color: var(--fg2); } .cu-sum b { display: block; font: 600 30px/1.1 var(--f-head); color: var(--fg); }
.cu-foot { text-align: center; font-size: 12px; color: var(--fg3); padding: 0 16px 14px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; background: var(--fg); color: var(--bg); border-radius: 12px; padding: 10px 12px 10px 16px; display: flex; gap: 14px; align-items: center; font-size: 14px; box-shadow: var(--shadow); }
.toast button { border: 0; background: color-mix(in srgb, var(--bg) 18%, transparent); color: var(--bg); border-radius: 8px; padding: 6px 10px; font-weight: 700; }
@media (max-width: 640px) {

  .cu-acts { grid-template-columns: repeat(2, minmax(0,1fr)); padding: 12px; }
  .cu-act small { display: none; }
}
@media (prefers-reduced-motion: reduce) { .cu-card { transition: none; } }

    why:'Grew to hold guest orders and refunds, from the two new intents.',
    facts:[['Status','Active'],['Page','Full'],['Built for','3 business intents'],['Decisions','1 proposed']],
    sections:[
      ['Intent','Orders takes a shopper from a full basket to a paid order{+ and, when needed, back to a refund+}, and keeps every order traceable from first click to final status. It exists so that no order is ever lost, charged twice, or left without a clear status. It stops at the order: stock and delivery belong to other domains.'],
      ['Business goal','A shop lead can answer “what happened to this order, and where is the money?” for any order, [-from the support tool-]{+from one screen, without asking support+}.'],
      ['Guiding rules','- Every order passes the fraud check before any money moves, because one missed fraud case costs more than a month of lost sales.\n- An order always has exactly one current status, because two statuses means nobody trusts either.\n+- Money only ever goes back to where it came from, because a refund to the wrong card is both a loss and a fraud route.'],
      ['Capabilities','- Checkout — takes a basket to a paid order. Distinct because it is the only place money comes in.\n- Order history — shows a shopper their past orders. Distinct because it only reads orders, never changes them.\n+- Refunds — returns money for a paid order. Distinct because it is the only place money goes out.'],

    links:[['Built for','Shoppers can check out without making an account','i1',''],['Built for','Shop staff can refund an order without calling support','i3',''],['Built for','Returning shoppers find their past orders in one place','i2','']] },

  { id:'p2', tool:'product', kind:'Capability', group:'Orders', level:1, change:'changed', status:'Active',
    title:'Checkout',
    why:'The guest intent needs checkout to work with no account, and saved cards no longer fit.',
    facts:[['Status','Active'],['Page','Full'],['Built for','2 business intents'],['Needs','Security high · Performance high · PCI-DSS'],['Serves','Shoppers, Guests'],['Depends on','Catalogue']],
    sections:[
      ['Benefit hypothesis','As a shopper, we believe that paying in three steps or fewer[-, with a saved card,-]{+ — signed in or as a guest —+} will raise finished checkouts. We will know it is true when the share of baskets that reach a paid order goes up by a tenth within a month.'],
      ['Boundary (In / Out / Never)','- In: the basket review, the address, the payment, and the order confirmation.\n+- In: the guest path — an email address instead of an account.\n- Out: showing past orders — Order history owns that.\n+- Out: refunds — the Refunds capability owns money going back.\n- Never: place an order that has not passed the fraud check.\nx- Never: ask a shopper to type a card they have already saved.'],
      ['Guiding rules','- The fraud check runs on every order, signed in or not, because guests are where most fraud tries first.\n+- A guest gives an email address and nothing else, because every extra field loses shoppers.'],

      ['Agent intent (ICE)','- Goal: A shopper{+, signed in or not,+} pays for a basket in three steps or fewer.\n- Limit: No order is placed without passing the fraud check.\n- Fails if: an order is charged twice, or charged without a confirmation email.\n- Context: serves shoppers and guests; touches the payment provider and the fraud service.\n- Checked by: an end-to-end test that buys as a signed-in shopper and as a guest.\n- Quality need: PCI-DSS for card data; a checkout step answers in under 1 second.'],
    ],
    links:[['Built for','Shoppers can check out without making an account','i1',''],['Inside','Orders','p1','']] },

  { id:'p3', tool:'product', kind:'Functionality', group:'Orders', level:2, change:'added', status:'Proposed',
    title:'Guest checkout',
    why:'New. The prototype shows the guest path from the sign-in step.',
    facts:[['Status','Proposed'],['Built for','1 business intent'],['Inside','Checkout']],
    sections:[
      ['What it does','Lets a shopper pay with only an email address, and sends the receipt and order updates to that address. It sits on the sign-in step as “Continue as guest” and joins the normal payment path after the address.'],
      ['Inputs / Outputs','- In: a basket, an email address, a delivery address, and a card.\n- Out: a paid order marked “guest”, and a receipt sent to the email address.'],
      ['Rules & behavior','- A guest order runs the same fraud check as any other order.\n- The email address is checked for shape only; it is not used to make an account.\n- If the email address already has an account, the shopper is offered sign-in, but may still go on as a guest.'],

ome → category pages → PLP (product listing) → PDP (product detail) → cart →\ncheckout handoff.**\n\nBuild this spine first, end to end, before any enrichment. Everything else hangs\noff it."}}}], "from_update": null}, {"citation_id": "cite-20261018-002", "issue": 613, "play": "/vision", "question": "How does the shop take card payments?", "answer": "Through a payment provider with hosted fields, so card data never touches our servers.", "decided_by": "product-os-keeper (/vision)", "decided_at": "2026-10-18T19:01:24Z", "trace": [{"asked": "Does the shop take money?", "found": "Yes: monetization is paywall.", "source": {"tier": "garura", "path": "product/product-os/profile.yaml", "start": 7, "end": 7, "fingerprint": "sha256:8071569efe1aadc32e2d666855ee1fe766445fb6fb3f30ba3d592a8a19df0377", "text": "    monetization: paywall", "version": null, "around": {"start": 4, "end": 10, "text": "  shape:\n    stage: public\n    users: public\n    monetization: paywall\n    surfaces: [web, mobile]\n  nfr:\n    performance:   { level: high, gate: \"p95 page load under 2 s\" }"}}}, {"asked": "Which domain covers taking money?", "found": "Payments, not ecommerce.", "source": {"tier": "phoenix", "path": "knowledge/domains/ecommerce.md", "start": 22, "end": 22, "fingerprint": "sha256:29199abd32c9e7c4524dd6347d3986b03b2822cc548b5e62a2382e7da43db14b", "text": "Taking money is a separate concern — see `payments`. What to charge and on what", "version": "5fcd88e05cf6", "around": {"start": 19, "end": 25, "text": "the domain is organised around the intents people bring to it, and capabilities are\nhow we satisfy them. Agentic features route and act on these intents directly.\n\nTaking money is a separate concern — see `payments`. What to charge and on what\nplan — see `billing`. The CMS/DAM that backs \"content leads the glass\" — see\n`content-management`. Search and recommendations — see `experience`.\n"}}}, {"asked": "What is the payments stance?", "found": "Never hold card data you don't have to: charge through a PSP with hosted fields and tokenisation.", "source": {"tier": "phoenix", "path": "knowledge/domains/payments.md", "start": 19, "end": 21, "fingerprint": "sha256:a7616b3002d1670c52f7fb9d8bcc8a80d4b9d5a354daddbcf7c433e3bad6ab39", "text": "The one organising rule: **never hold card data you don't have to.** Charge through\na **PSP** (Stripe/Adyen/etc.) with **hosted fields / tokenisation**, so you stay\nout of the worst of PCI scope. Payments is **trust infrastructure** — almost every", "version": "5fcd88e05cf6", "around": {"start": 16, "end": 24, "text": "> as the commerce-heavy quadrants in `ecommerce`.\n\n## Stance (proposed)\nThe one organising rule: **never hold card data you don't have to.** Charge through\na **PSP** (Stripe/Adyen/etc.) with **hosted fields / tokenisation**, so you stay\nout of the worst of PCI scope. Payments is **trust infrastructure** — almost every\nchoice here is pulled by `nfr.security` or a `compliance` regime (PCI-DSS is\nusually one).\n"}}}, {"asked": "What is the floor for card payments?", "found": "Card via PSP with hosted fields.", "source": {"tier": "phoenix", "path": "knowledge/domains/payments.md", "start": 44, "end": 44, "fingerprint": "sha256:fd7868764e0280c165b2ef7106df640b30e3686d1bae635bfb9f2ed6fd113892", "text": "  - Card via PSP / hosted fields — charge through Stripe/Adyen with hosted fields so card data never touches your servers. The floor.", "version": "5fcd88e05cf6", "around": {"start": 41, "end": 47, "text": "## Capabilities (selected by risk, scale, regime)\n- **Payment Processing** — the floor: card via PSP; bank transfer/ACH/wallets when\n  the region or user base expects non-card rails. Tokenise; never store raw PANs.\n  - Card via PSP / hosted fields — charge through Stripe/Adyen with hosted fields so card data never touches your servers. The floor.\n  - Tokenised vaulting — store a PSP token in place of the PAN for later charges. The floor whenever you reuse a method; mandatory when `compliance` includes PCI-DSS.\n  - Bank transfer / ACH — direct-debit / bank rails for lower-fee or non-card payers. Add when `shape.users: public` and a broad consumer base expects them.\n  - Wallets — Apple Pay / Google Pay one-tap. Add when `shape.surfaces` includes mobile."}}}], "from_update": null}, {"citation_id": "cite-20261018-003", "issue": 613, "play": "/vision", "question": "Can a returning shopper pay with a saved card?", "answer": "Yes, as a provider token only — never the card number.", "decided_by": "product-os-keeper (/vision)", "decided_at": "2026-10-18T19:01:24Z", "trace": [{"asked": "What security level and compliance does the profile set?", "found": "Security is high; PCI-DSS and GDPR are in force.", "source": {"tier": "garura", "path": "product/product-os/profile.yaml", "start": 11, "end": 14, "fingerprint": "sha256:792104d6b9ddcfb5eb567bd3e3e3173bce8d6c5a3d5296a223484131bb3c935a", "text": "    security:      { level: high, gate: \"OWASP ASVS L2; no P1/P2\" }\n    accessibility: { level: high, gate: \"WCAG 2.1 AA\" }\n    privacy:       { level: high, gate: \"PII encrypted at rest and in transit\" }\n  compliance: [PCI-DSS, GDPR]", "version": null, "around": {"start": 8, "end": 14, "text": "    surfaces: [web, mobile]\n  nfr:\n    performance:   { level: high, gate: \"p95 page load under 2 s\" }\n    security:      { level: high, gate: \"OWASP ASVS L2; no P1/P2\" }\n    accessibility: { level: high, gate: \"WCAG 2.1 AA\" }\n    privacy:       { level: high, gate: \"PII encrypted at rest and in transit\" }\n  compliance: [PCI-DSS, GDPR]"}}}, {"asked": "What does a saved card need under PCI-DSS?", "found": "Tokenised vaulting is the floor and mandatory under PCI-DSS: store the PSP token, never the card.", "source": {"tier": "phoenix", "path": "knowledge/domains/payments.md", "start": 63, "end": 65, "fingerprint": "sha256:85ad97c8e33a8641f2dee207bc6f564dddb4fad2d0a1394feb5feb96b3aa165e", "text": "- **Saved Methods / One-Click** — when repeat purchase or conversion speed matters;\n  tokenised vaulting only (mandatory under PCI-DSS).\n  - Tokenised vaulting — store the PSP token, never the card, for one-click reuse. The floor of this capability; mandatory when `compliance` includes PCI-DSS.", "version": "5fcd88e05cf6", "around": {"start": 60, "end": 68, "text": "  - Level 1 — full / partial refunds: reverse a charge in whole or part via the PSP. The floor.\n  - Level 2 — chargeback handling: receive and process issuer-initiated reversals. Add when `shape.monetization: monetized`.\n  - Level 3 — dispute-evidence workflow: assemble and submit evidence with an audit trail. Add when `nfr.observability >= high`, or `compliance` includes PCI-DSS.\n- **Saved Methods / One-Click** — when repeat purchase or conversion speed matters;\n  tokenised vaulting only (mandatory under PCI-DSS).\n  - Tokenised vaulting — store the PSP token, never the card, for one-click reuse. The floor of this capability; mandatory when `compliance` includes PCI-DSS.\n  - One-click checkout — charge a saved token without re-entry. Add when `shape.monetization: monetized` and repeat purchase matters.\n\n## Where it goes wrong (proposed)"}}}], "from_update": null}, {"citation_id": "cite-20261018-004", "issue": 613, "play": "/vision", "question": "Are Apple Pay and Google Pay part of launch?", "answer": "Yes. The shop has a mobile app, so wallets are in.", "decided_by": "product-os-keeper (/vision)", "decided_at": "2026-10-18T19:01:24Z", "trace": [{"asked": "Who are the shop's users, and where do they use it?", "found": "The public, on web and mobile.", "source": {"tier": "garura", "path": "product/product-os/profile.yaml", "start": 6, "end": 8, "fingerprint": "sha256:ea4be5fa81c618857bc9e02deec8eb38b782ca54725daf5ca6c452edfeaf77fd", "text": "    users: public\n    monetization: paywall\n    surfaces: [web, mobile]", "version": null, "around": {"start": 3, "end": 11, "text": "  state: set\n  shape:\n    stage: public\n    users: public\n    monetization: paywall\n    surfaces: [web, mobile]\n  nfr:\n    performance:   { level: high, gate: \"p95 page load under 2 s\" }\n    security:      { level: high, gate: \"OWASP ASVS L2; no P1/P2\" }"}}}, {"asked": "When are wallets included?", "found": "Add wallets when the surfaces include mobile.", "source": {"tier": "phoenix", "path": "knowledge/domains/payments.md", "start": 47, "end": 47, "fingerprint": "sha256:bc8ec15bae47abe96db5d0e267587d42041ad8fc38915131f6c38acfc63f172e", "text": "  - Wallets — Apple Pay / Google Pay one-tap. Add when `shape.surfaces` includes mobile.", "version": "5fcd88e05cf6", "around": {"start": 44, "end": 50, "text": "  - Card via PSP / hosted fields — charge through Stripe/Adyen with hosted fields so card data never touches your servers. The floor.\n  - Tokenised vaulting — store a PSP token in place of the PAN for later charges. The floor whenever you reuse a method; mandatory when `compliance` includes PCI-DSS.\n  - Bank transfer / ACH — direct-debit / bank rails for lower-fee or non-card payers. Add when `shape.users: public` and a broad consumer base expects them.\n  - Wallets — Apple Pay / Google Pay one-tap. Add when `shape.surfaces` includes mobile.\n- **Checkout / Payment UX** — accessible payment screens (`nfr.accessibility`);\n  localised currency and methods across regions. (Pairs with `ecommerce`.)\n  - Hosted / redirect checkout — PSP-hosted page or drop-in widget that keeps you out of PCI scope. The floor."}}}], "from_update": null}, {"citation_id": "cite-20261018-005", "issue": 613, "play": "/vision", "question": "Is guest checkout allowed at launch?", "answer": "Yes. An account is offered after payment.", "decided_by": "product-os-keeper (/vision)", "decided_at": "2026-10-18T19:01:25Z", "trace": [{"asked": "Who are the shop's users, and where do they use it?", "found": "The public, on web and mobile.", "source": {"tier": "garura", "path": "product/product-os/profile.yaml", "start": 6, "end": 8, "fingerprint": "sha256:ea4b fered after payment."}}}, {"asked": "How long is a guest cart kept?", "found": "Seven days, then cleared; the guest is told.", "source": {"tier": "short-term", "path": "613/context/answers/guest-cart.md", "start": 1, "end": 1, "fingerprint": "sha256:fe87c37c6249a10ffb228c9df087a92b68b600834299a996b4b5639ffb8fe7b6", "text": "A guest cart is kept for 7 days, then cleared. The guest is told when they come back.", "version": null, "around": {"start": 1, "end": 1, "text": "A guest cart is kept for 7 days, then cleared. The guest is told when they come back."}}}], "from_update": "mu-20261018-001"}, {"citation_id": "cite-20261018-007", "issue": 613, "play": "/vision", "question": "Is there a cap on items in a cart?", "answer": "No cap at launch.", "decided_by": "product-os-keeper (/vision)", "decided_at": "2026-10-18T19:01:25Z", "trace": [{"asked": "What limits has the product model set for checkout?", "found": "Cart size: no cap at launch.", "source": {"tier": "garura", "path": "product/product-os/checkout/limits.md", "start": 3, "end": 3, "fingerprint": "sha256:9bfc2372738dcb11a0470d665c799a22b3878f880bc19724d68175574daa2862", "text": "Cart size: no cap at launch.", "version": null, "around": {"start": 1, "end": 3, "text": "# Checkout limits\n\nCart size: no cap at launch."}}}], "from_update": null}, {"citation_id": "cite-20261018-008", "issue": 613, "play": "/understand", "question": "How do shoppers sign in?", "answer": "Email and password, social login, and MFA.", "decided_by": "product-os-keeper (/understand)", "decided_at": "2026-10-18T19:01:25Z", "trace": [{"asked": "Who are the shop's users, and where do they use it?", "found": "The public, on web and mobile.", "source": {"tier": "garura", "path": "product/product-os/profile.yaml", "start": 6, "end": 8, "fingerprint": "sha256:ea4be5fa81c618857bc9e02deec8eb38b782ca54725daf5ca6c452edfeaf77fd", "text": "    users: public\n    monetization: paywall\n    surfaces: [web, mobile]", "version": null, "around": {"start": 3, "end": 11, "text": "  state: set\n  shape:\n    stage: public\n    users: public\n    monetization: paywall\n    surfaces: [web, mobile]\n  nfr:\n    performance:   { level: high, gate: \"p95 page load under 2 s\" }\n    security:      { level: high, gate: \"OWASP ASVS L2; no P1/P2\" }"}}}, {"asked": "Which domain covers sign-in, and what decides its parts?", "found": "User management. Its parts are picked by the profile: the users, the surfaces, security, accessibility and compliance.", "source": {"tier": "phoenix", "path": "knowledge/domains/user-management.md", "start": 4, "end": 6, "fingerprint": "sha256:e295931e169cff7ce46dfc8847509d1797cde5adcfe9ec5770941dfd04f3273e", "text": "conditions:\n  trigger: \"the product needs accounts, login, profiles, roles, or access control\"\n  selection_keys: [shape.users, shape.surfaces, nfr.security, nfr.accessibility, compliance]", "version": "5fcd88e05cf6", "around": {"start": 1, "end": 9, "text": "---\nid: domains/user-management\ntitle: \"User Management: capabilities and when to include each (profile-driven)\"\nconditions:\n  trigger: \"the product needs accounts, login, profiles, roles, or access control\"\n  selection_keys: [shape.users, shape.surfaces, nfr.security, nfr.accessibility, compliance]\nprovenance: seeded\n---\n"}}}, {"asked": "What security level and compliance does the profile set?", "found": "Security is high; PCI-DSS and GDPR are in force.", "source": {"tier": "garura", "path": "product/product-os/profile.yaml", "start": 11, "end": 14, "fingerprint": "sha256:792104d6b9ddcfb5eb567bd3e3e3173bce8d6c5a3d5296a223484131bb3c935a", "text": "    security:      { level: high, gate: \"OWASP ASVS L2; no P1/P2\" }\n    accessibility: { level: high, gate: \"WCAG 2.1 AA\" }\n    privacy:       { level: high, gate: \"PII encrypted at rest and in transit\" }\n  compliance: [PCI-DSS, GDPR]", "version": null, "around": {"start": 8, "end": 14, "text": "    surfaces: [web, mobile]\n  nfr:\n    performance:   { level: high, gate: \"p95 page load under 2 s\" }\n    security:      { level: high, gate: \"OWASP ASVS L2; no P1/P2\" }\n    accessibility: { level: high, gate: \"WCAG 2.1 AA\" }\n    privacy:       { level: high, gate: \"PII encrypted at rest and in transit\" }\n  compliance: [PCI-DSS, GDPR]"}}}, {"asked": "Which sign-in methods do those values select?", "found": "Email and password is the floor; social login because the users are public; MFA because security is high and PCI-DSS is in force.", "source": {"tier": "phoenix", "path": "knowledge/domains/user-management.md", "start": 44, "end": 47, "fingerprint": "sha256:001365eca3509fec072c26b605372ed8719be8d71efd80c08e780fb6aee613b9", "text": "- **Authentication** — include when users sign in.\n  - Email & password — the default credential login (the floor).\n  - Social login — when `shape.users: public` and signup friction matters.\n  - MFA — when `nfr.security >= high`, or `compliance` includes SOC2 / HIPAA / PCI-DSS.", "version": "5fcd88e05cf6", "around": {"start": 41, "end": 50, "text": "Read each line as \"include X when {profile condition}\". Start at the floor; add\nonly when a profile dimension calls for it.\n\n- **Authentication** — include when users sign in.\n  - Email & password — the default credential login (the floor).\n  - Social login — when `shape.users: public` and signup friction matters.\n  - MFA — when `nfr.security >= high`, or `compliance` includes SOC2 / HIPAA / PCI-DSS.\n  - Passwordless — when `nfr.security >= high` and you want to remove password risk entirely.\n  - Enterprise SSO — when the user base is organizations (B2B), or `compliance` requires federated identity.\n- **Registration** — include when users create accounts."}}}], "from_update": null}, {"citation_id": "cite-20261018-009", "issue": 613, "play": "/understand", "question": "Does the shop need MFA at launch?", "answer": "Yes. Security is high and PCI-DSS is in force; either one brings MFA.", "decided_by": "product-os-keeper (/understand)" }
function memPiece(x) {
  if (x.title) return `<div class="content-in"><div class="chips"><span class="chip kind">ADR</span><span class="chip ${x.status === 'waiting' ? 'changed' : 'added'}">${x.status === 'waiting' ? 'Proposed' : 'Accepted'}</span></div>
    <h1 style="margin-top:14px">${esc(x.title)}</h1><p class="why"><b>Why:</b> ${esc(x.why)}</p><div class="sig" style="margin-top:18px"></div>
    <div class="sec"><div class="label">The decision</div><div class="tx"><p>${esc(x.text)}</p></div></div></div>`;
  if (x.r) {
    const r = x.r, trace = r.trace || [];
    const steps = trace.map((st, i) => { const src = st.source, pr = x.probs.find(p => p.step === i + 1);
      const cls = pr ? (pr.problem === 'source_changed' ? 'changed' : 'removed') : 'added';
      return `<div class="tstep ${cls}"><span class="num">${i + 1}</span>
        <div class="ask">${esc(st.asked)}</div><div class="found">${esc(st.found)}</div>
        <div class="where"><span class="tier">${TIER[src.tier]}</span><b>${esc(src.path)}</b> · ${lineSpan(src)}</div>
        ${codeBlock(src.around, src.start, src.end)}
        <p class="lands">${pr ? '' : 'Read again now: it still says the same.'}</p>
        <details class="lands"><summary>Details</summary>Read ${src.version ? 'at Phoenix version ' + esc(src.version.slice(0, 12)) : src.tier === 'short-term' ? 'from the issue\'s folder' : 'from the project\'s Garura memory'} · fingerprint ${esc(src.fingerprint.slice(7, 15))}…</details>
        ${pr ? (pr.problem === 'source_changed' ? `<div class="label now-l">What those lines say now</div>${codeBlock(pr.now_around, src.start, src.end, 'now')}<p class="lands">${esc(pr.detail)}</p>`
                                                 : `<p class="lands gone"><b>Now:</b> ${esc(pr.detail)}</p>`) : ''}</div>`; }).join('');
    return `<div class="content-in"><div class="chips"><span class="chip kind">${esc(r.play || 'no play')}</span><span class="chip ${STATUS[x.status][0]}">${STATUS[x.status][1]}</span>${r.from_update ? '<span class="chip added">From an approved memory update</span>' : ''}<span class="chip kind">Issue #${r.issue}</span></div>
      <h1 style="margin-top:14px">${esc(r.question)}</h1>
      <p class="why"><b>Decided by</b> ${esc(r.decided_by)} · ${esc(when(r.decided_at))}</p><details class="lands"><summary>Details</summary>Record ${esc(r.citation_id)}${r.from_update ? ' · from memory update ' + esc(r.from_update) : ''}</details><div class="sig" style="margin-top:18px"></div>
      <div class="sec"><div class="label">The answer</div><div class="tx"><p>${esc(r.answer)}</p></div></div>
      ${r.from_update ? (u => `<div class="sec added"><div class="label">From a memory update</div>
        <div class="tx"><p>No memory held this, so ${u ? esc(u.requested_by) : 'the agent'} asked for it. A person approved it, and it was written to the issue's short-term memory. That file is the source of step ${trace.findIndex(st => u && st.source.path === u.target_path) + 1 || 'below'}.</p></div>
        ${u ? `<p class="lands"><b>Missing:</b> ${esc(u.missing)}</p>
        <p class="lands"><b>Approved by</b> ${esc(u.decided_by)} in the ${u.decided_in === 'review-tool' ? 'review tool' : esc(u.decided_in)} · ${esc(when(u.decided_at))}${u.reply ? ` · “${esc(u.reply)}”` : ''}</p>` : ''}</div>`)((MEM.citedUpdates || []).concat(MEM.updates).find(x => x.id === r.from_update)) : ''}
      <div class="label" style="margin:22px 0 10px">The trace — ${trace.length} ${trace.length === 1 ? 'step' : 'steps'}, in the order the agent took them</div>
      ${steps ? `<div class="trace">${steps}</div>` : `<div class="sec removed"><p>No memory was named for this decision.</p><p class="lands">${esc((x.probs[0] || {}).detail || '')} Every decision must name its memory (ADR 035 §6). Send it back, and the agent decides again from memory.</p></div>`}
    </div>`;
  }
  return `<div class="content-in"><div class="chips">${mChips(x)}</div>
    <h1 style="margin-top:14px">${esc(x.missing)}</h1><p class="why"><b>Why:</b> no memory held this. Raised by ${esc(x.by)}, ${esc(x.at)}.</p><div class="sig" style="margin-top:18px"></div>
    <div class="sec"><div class="label">The draft</div><div class="tx"><p>${esc(x.draft)}</p></div></div>
    <div class="sec"><div class="label">If you approve it</div><div class="tx"><p>Garura writes it to issue #${x.issue}'s short-term memory, and the work that waits on it goes on. ${x.blocking ? 'This work is stopped until you answer.' : 'The rest of the work is not waiting on it.'}</p></div></div></div>`;
}
function memSide(x) {
  const side = $('#side');
  if (!x) { side.innerHTML = `<div class="decide"><div class="q">How this works</div><p class="empty">${S.tool === 'memory' ? 'Ask memory in plain words, or open a memory update on the left. Each update is approved or rejected on its own, with your words.' : S.tool === 'adrs' ? 'Open an ADR on the left. Accept it, or send it back with a comment.' : 'Open a decision on the left to see the memory it rested on. Look at the ones whose source changed or is missing first.'}</p></div>`; return; }
  if (x.title) { side.innerHTML = x.status !== 'waiting' ? `<div class="decide"><div class="q">Accepted.</div></div>` : `<div class="decide"><div class="q">Accept this decision?</div>
    <button class="dbtn accept" data-mans="accept"><span class="ico">✓</span><span>Accept<small>The ADR is accepted, and older ones get a pointer.</small></span><span class="k">a</span></button>
    <button class="dbtn send" data-mans="send"><span class="ico">↩</span><span>Send back<small>The /adr play reworks it from your comment.</small></span><span class="k">s</span></button></div>`; return; }
  if (x.r) { side.innerHTML = `<div class="decide"><div class="q">${x.status === 'same' ? 'The memory still says the same.' : 'Does this decision still hold?'}</div>
    <button class="dbtn accept" data-mans="ok" aria-pressed="${MEM.reviewed[x.id] === 'ok'}"><span class="ico">✓</span><span>Looks right<small>The decision stands as it is.</small></span><span class="k">a</span></button>
    <button class="dbtn send" data-mans="redo" aria-pressed="${MEM.reviewed[x.id] === 'redo'}"><span class="ico">↩</span><span>Send back<small>The agent decides again, from memory as it is now.</small></span><span class="k">s</span></button></div>`; return; }
  if (x.status !== 'waiting') { side.innerHTML = `<div class="decide"><div class="q">${x.status === 'rejected' ? 'You rejected this.' : 'You approved this.'}</div><p class="empty">“${esc(x.reply)}”</p></div>`; return; }
  side.innerHTML = `<div class="decide"><div class="q">What do you want to do with this?</div>
    <div class="composer"><textarea id="m-words" placeholder="Your words — needed to approve or reject">${esc(MEM.words[x.id] || '')}</textarea></div>
    <button class="dbtn accept" data-mans="approve"><span class="ico">✓</span><span>Approve<small>Garura writes it to the issue's short-term memory.</small></span><span class="k">a</span></button>
    <button class="dbtn drop" data-mans="reject"><span class="ico">✕</span><span>Reject<small>Nothing is written. Work that waits on it stays stopped.</small></span><span class="k">r</span></button>
    <p class="empty">${esc(MEM.err)}</p></div>`;
}
function memRender() {
  memTopbar(true); memNav();
  const x = MEM.cur ? mFind(MEM.cur) : null;
  $('#content').innerHTML = x ? memPiece(x) : S.tool === 'memory' ? memoryOverview() : S.tool === 'adrs' ? adrsOverview() : decisionsOverview();
  memSide(x);
  $('#cu-btn').textContent = mWaiting().length ? `Catch up (${mWaiting().length})` : 'Catch up';
}
var memDecide = function (u, verdict, words) {
  if (!words.trim()) { MEM.err = 'Write your words first.'; return false; }
  u.status = verdict === 'approve' ? 'approved' : 'rejected'; u.reply = words.trim(); MEM.err = '';
  event(verdict === 'approve' ? 'memory_approved' : 'memory_rejected', { title:u.missing });
  return true;
};
// Catch up for memory updates: one card each; words are needed, so Approve and Reject are buttons.
function memCuQueue() { return mWaiting().filter(u => !MEM.later.includes(u.id)).concat(mWaiting().filter(u => MEM.later.includes(u.id))); }
function memCuRender() {
  let el = $('#cu'); if (!el) { el = document.createElement('div'); el.id = 'cu'; el.className = 'cu'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Catch up'); document.body.appendChild(el); }
  const q = memCuQueue(), u = q[0];
  el.innerHTML = `<div class="cu-top"><div class="ttl"><b>Catch up</b><span>Memory updates · one at a time</span></div><span class="cu-count">${q.length ? q.length + ' left' : ''}</span><button class="btn" data-mcu-exit>Exit</button></div>
    <div class="cu-segs">${MEM.updates.map(x => `<i class="${x === u ? 'now' : x.status === 'waiting' ? '' : x.status === 'rejected' ? 'drop' : 'accept'}"></i>`).join('')}</div>
    <div class="cu-stage"><div class="cu-deck">${u ? `<div class="cu-card cu-now"><div class="cu-head"><div class="ctx">Memory update · issue #${u.issue}</div><h2>${esc(u.missing)}</h2><div class="chips">${mChips(u)}</div><p class="why"><b>Why:</b> no memory held this. Raised by ${esc(u.by)}.</p></div>
      <div class="cu-body"><div class="sec"><div class="label">The draft</div><div class="tx"><p>${esc(u.draft)}</p></div></div><div class="composer" style="margin-top:12px"><textarea id="mcu-words" placeholder="Your words — needed to approve or reject"></textarea></div><p class="empty">${esc(MEM.err)}</p></div>
      <div class="cu-acts"><button class="cu-act later" data-mcu="later">Later<small>keep it waiting · ←</small></button><button class="cu-act drop" data-mcu="reject">✕ Reject<small>with your words · r</small></button><button class="cu-act accept" data-mcu="approve">✓ Approve<small>with your words · a</small></button></div></div>`
      : `<div class="cu-card cu-now"><div class="cu-head"><h2>All caught up</h2><p class="why">Every memory update has your answer.</p></div><div class="cu-acts"><button class="cu-act accept" data-mcu-exit>Back to Memory</button></div></div>`}</div></div>
    <div class="cu-foot">Approve or reject needs your words · ← leaves it for later · Esc to exit</div>`;
  const ta = $('#mcu-words'); if (ta) ta.focus();
}
function memCuClose() { MEM.cu = false; MEM.err = ''; const el = $('#cu'); if (el) el.remove(); memRender(); }

// Wire the three sections in without touching the Intents and Product code paths.
const baseRender = render;
render = function () { if (isMem()) return memRender(); memTopbar(false); return baseRender(); };
for (const t of Object.keys(SEC)) $('#t-' + t).onclick = () => { S.tool = t; MEM.cur = null; render(); };
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t || !isMem()) return;
  if (t.id === 'cu-btn' || t.hasAttribute('data-cu-start') || t.hasAttribute('data-mcu-start')) { e.stopImmediatePropagation(); MEM.cu = true; MEM.err = ''; return memCuRender(); }
  if (t.hasAttribute('data-mcu-exit')) { e.stopImmediatePropagation(); return memCuClose(); }
  if (t.dataset.mcu === 'later') { e.stopImmediatePropagation(); const u = memCuQueue()[0]; if (u) MEM.later = MEM.later.filter(x => x !== u.id).concat(u.id); return memCuRender(); }
  if (t.dataset.mcu) { e.stopImmediatePropagation(); const u = memCuQueue()[0]; return Promise.resolve(u && memDecide(u, t.dataset.mcu, $('#mcu-words').value)).then(memCuRender); }
  if (t.hasAttribute('data-mask')) { e.stopImmediatePropagation(); MEM.ask.q = $('#m-ask').value; return render(); }
  if (t.dataset.mgo !== undefined) { e.stopImmediatePropagation(); MEM.cur = t.dataset.mgo || null; MEM.err = ''; render(); return window.scrollTo(0, 0); }
  if (t.dataset.mans) {
    e.stopImmediatePropagation(); const x = mFind(MEM.cur);
    if (x.title) { if (t.dataset.mans === 'accept') x.status = 'accepted'; event('adr_' + t.dataset.mans, { title:x.title }); return render(); }
    if (x.r) { MEM.reviewed[x.id] = t.dataset.mans; event('decision_' + t.dataset.mans, { title:x.r.question }); return render(); }
    return Promise.resolve(memDecide(x, t.dataset.mans, $('#m-words').value)).then(render);
  }
}, true);
document.addEventListener('input', e => { if (e.target.id === 'm-words' && MEM.cur) MEM.words[MEM.cur] = e.target.value; }, true);
document.addEventListener('change', e => { if (e.target.id === 'm-issue') { MEM.issue = +e.target.value.slice(1); render(); } }, true);
document.addEventListener('keydown', e => {
  if (!isMem()) return;
  e.stopImmediatePropagation();
  if (e.target.closest('textarea, select')) { if (e.key === 'Escape' && MEM.cu) memCuClose(); return; }
  if (MEM.cu) { if (e.key === 'Escape') return memCuClose(); const m = { ArrowLeft:'later', a:'approve', r:'reject' }[e.key]; if (m) document.querySelector(`[data-mcu="${m}"]`)?.click(); return; }
  if ((e.key === 'a' || e.key === 'r' || e.key === 's') && MEM.cur) return document.querySelector({ a:'[data-mans="approve"], [data-mans="accept"], [data-mans="ok"]', r:'[data-mans="reject"]', s:'[data-mans="send"], [data-mans="redo"]' }[e.key])?.click();
  if (e.key === 'j' || e.key === 'k') {
    const ids = [null].concat(S.tool === 'memory' ? mWaiting().concat(mDecided()).map(u => u.id) : S.tool === 'adrs' ? MEM.adrs.map(a => a.id) : decisions().map(d => d.id));
    const i = ids.indexOf(MEM.cur); MEM.cur = ids[Math.max(0, Math.min(ids.length - 1, i + (e.key === 'j' ? 1 : -1)))]; render();
  }
}, true);
{ const [h, id] = location.hash.slice(1).split('/'); if (h in SEC) { S.tool = h; if (id && mFind(id)) MEM.cur = id; render(); } }
</script>
</body>
</html>
