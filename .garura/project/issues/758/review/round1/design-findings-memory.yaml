# check-change Layer 2 - design findings, category: memory (ontology v6), PR #783
base: origin/plan/756/base
grounding_note: >
  Principles come from the base ref (ontology v5, the ontology format template, ADR 031/043) and from the
  agreed standard recorded in this run (locked-model.md + decisions.json), which the caller named as the
  standard for this change. Nothing is grounded in text the diff adds to ontology.md.
principles:
  - id: G1
    text: "The ontology must follow the product-ontology format: frontmatter, questions with Answered by/Status, kinds with the fixed sections, Not yet defined, Log."
    source: "origin/plan/756/base:core/components/memory/standards/templates/product-ontology.md"
  - id: G2
    text: "Every kind a relationship or question names is defined or listed under Not yet defined."
    source: "same template, 'Not yet defined' section"
  - id: G3
    text: "ICE lives inline in its node's grounding doc; no new file type. An ICE is built from a business intent (spine intents on the node)."
    source: "origin/plan/756/base:docs/adr/031-business-intent-and-ice.md sections 3 and 4 (and Consequences: 'No new file type')"
  - id: G4
    text: "The agreed v6 model (ICE own node, one per capability/functionality, 3 parts, no BI link; needs/identified-by capabilities only; Work to ICE N:1; ready/partly/not ready on the ICE; BI holds no ICE)."
    source: ".garura/project/issues/758/context/edit-ontology/locked-model.md; decisions.json (all three points agreed)"
conformance_checks:
  format: "PASS - core/components/skills/author-product-ontology/scripts/check_ontology.py returns valid=true, no problems; all kinds carry the template sections; statuses are answered/partly/not yet."
  named_kinds: "PASS - kinds named by relationships/questions: Business Intent, Source, ICE, Capability, Functionality, Work, Plan (defined); Domain, Tracker Issue (listed Not yet defined). Feature/Story/Spike/Chore/Bug are Work types."
  other_kinds_unchanged: "PASS with notes - Source and Plan sections are byte-identical to base. Business Intent, Capability, Functionality, Work changed as agreed. One unrequested edit: Business Intent example lost a personal name and its job title (see F5)."
  matches_locked_model: "PASS on tree, links, ICE parts, ready check, what-changes list, fn-727 note. Deviations in F2-F5."
findings:
  - id: F1
    severity: P2
    file: core/components/memory/standards/schemas/product-os/ontology.md
    principle: G3
    source: "origin/plan/756/base:docs/adr/031-business-intent-and-ice.md sections 3, 4, Consequences"
    finding: >
      v6 moves the ICE out of the capability/functionality page onto its own ice.md page with its own spine list
      (ices), and makes it N:1 under one part. ADR 031 (Accepted, amended by 033 and 043) says the ICE lives inline
      in the node's grounding doc, "No new file type", and is built from a business intent via the node's spine
      intents. ADR 043 also says "The ICE kind keeps its shape". No ADR (the base ends at 046) records the reversal.
      The owner approved the model in this run, so the direction is not in doubt; the gap is that an accepted
      decision is overridden without an amending ADR. Ask: add or point to an ADR that amends 031 s3/s4 and 043.
  - id: F2
    severity: P3
    file: core/components/memory/standards/schemas/product-os/ontology.md
    principle: G4
    source: "locked-model.md, 'The ready check': partly ready = gaps that do not stop work, 'a thin part such as an empty Context'"
    finding: >
      ICE rules add "A part that is missing from the page counts as an empty part. It is a gap (partly ready), not a
      stop." The locked model names only thin parts (example: Context). As written, an ICE with no Intent at all
      (no goal) is partly ready, so work can start on it. The locked model's Ready needs all three parts, and its
      thin-part example does not say a missing Intent is acceptable. Narrow to Context (or say which parts may be thin).
  - id: F3
    severity: P3
    file: core/components/memory/standards/schemas/product-os/ontology.md
    principle: G3
    source: "origin/plan/756/base:core/components/memory/standards/schemas/product-os/spine.yaml; ADR 043 'Affects' list (check_ice_workable.py, lint_grounding.py copies)"
    finding: >
      The ontology now states a new spine list (ices: id, for, for_kind, doc, metadata), an ice.md page layout, and a
      ready check with three answers. The base spine.yaml has no ices list, and the workable check and grounding
      linters still follow v5. The ontology itself says pages written earlier are drift for Alignment, but it gives
      no pointer to the issues that bring spine, check and linters in line (only #725 and #765 are named). Not a
      fault in this file if those are planned under 756; confirm they are, or name them in the Log.
  - id: F4
    severity: P4
    file: core/components/memory/standards/schemas/product-os/ontology.md
    principle: G4
    source: "decisions.json (second 'kinds' and 'links' change: capability has one domain, domain has one or more) vs locked-model.md link table row 'Domain | Business intent, Capability | N:N'"
    finding: >
      v6 follows the later owner decision (capability in at most one domain; domain has one or more capabilities;
      Domain to Business Intent stays loose N:N), which overrides the locked-model table row. So the ontology
      is correct, but locked-model.md is stale on that row. Record the override beside the locked model so a later
      reader does not read it as a mismatch.
  - id: F5
    severity: P4
    file: core/components/memory/standards/schemas/product-os/ontology.md
    principle: G4
    source: "locked-model.md 'What changes from version 5' (lists no example edits)"
    finding: >
      Additions not in the locked model, all agreed in the kinds/links drafts or harmless: Feature stays and carries
      its capability's ICE (draft-kinds/draft-links, approved "yes"); ICE copy on the issue; the rule that
      pre-v6 '## Agent intent (ICE)' sections are drift; "identified by" may name more than one capability; a
      Business Intent can be identified by another (kept from v5); the Business Intent example drops "Priya, Head of
      Growth" for "the Head of Growth" (a privacy gain, but unlisted in the Log). Informational: note the example
      change in the Log line.
  - id: F6
    severity: P4
    file: core/components/memory/standards/schemas/product-os/ontology.md
    principle: G1
    source: "origin/plan/756/base template 'Product Ontology' opening and base ontology intro"
    finding: >
      The opening paragraph still says "this first version defines the Business Intent... connects it to ICE" while
      the ontology is at v6 with seven kinds. Carried over from base, so not introduced here; v6 rewrote the flow
      sentence directly below it, which is the moment to fix it.
summary: "No P1. One P2 (accepted ADR 031/043 overridden with no amending ADR), two P3, three P4. Format check passes; every named kind is defined or listed; Source and Plan unchanged."
