  message: The `doc` pointer is joined to root and read with no check that it stays
    inside root. An absolute path or `..` in a spine entry makes the linter read files
    outside the model, and such a file would also be counted as "referenced". The
    existing spine checks (around line 392) do the same, so this follows the file's
    pattern. Low risk because the spine is trusted input, but worth a one-line guard.
  status: null
