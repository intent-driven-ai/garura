ice_impact: >
  /shape-plan only, and already changed in #875: C13 (an epic and a story are marked by the issue
  type, with no label: Epic and Story), F11 (a label on an epic or a story, or a wrong type, is a
  failure) and its recovery REC11 (take the label off and set the type). No other play, loop or
  agent ICE changes: no other part files an epic or a story (grep of core/components for issue
  type and work-item). The product's own ICE (capability and feature) do not change.
  Read from the ontology source core/components/memory/standards/schemas/product-os/ontology.md
  (v12), a file the decision names; it was not copied into short-term memory, because the caller
  allowed only the three output files.

business_intent_check: none
business_intent_reason: >
  No person's business intent changes, and the Business Intent kind does not change: it keeps the
  label `product`, and its links are as before. Only how an Epic and a Story are marked in the
  tracker changes. No intent page is in Affects; no intent title (bi-717, bi-722, bi-734, bi-756,
  bi-788) appears in the record.

findings:   # by the ADR keeper, not in the brief; for the person who accepts
  - >
    .garura/user-provided/managing-work.md says "No labels, for now. Not for type, status, area,
    or severity." The ontology (v12) keeps `product` on a Business Intent and `work-item` on a
    Spike, a Chore and a Bug. This decision keeps those labels "for now" (the brief); the two texts
    still disagree on those four kinds until the later change the brief names.
  - >
    /list-focus-issues finds an issue's kind by its labels
    (core/components/plays/list-focus-issues/reference/kind-map.yaml: kind epic = label `epic`).
    An Epic or a Story with no label shows there as "unlabelled", with no recommendation. This was
    already true under ADR 048 (the `work-item` label maps to no kind); this decision does not
    cause it.

