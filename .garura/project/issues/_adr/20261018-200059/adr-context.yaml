ice_impact: >-
  The agent intents of the plays whose agents make decisions change as those agents move onto the
  memory tool (#661: /intent, /vision, /understand and every play's close; #663: every other play),
  each through its ICE source and /play-editor: each decision is recorded with the tool's cite as a
  trace — the steps taken, each with its source — not as one source. No play's ICE changes on this
  branch: no agent calls cite yet, and the drive review record's --decisions option is optional, so
  /vision and /understand run as before. The /adr play's C6: once the review tool's ADRs section
  exists, the accept card ADR 036 placed in Memory and ADRs sits in ADRs; until then C6 stands as
  written. The ICE kind does not change (ontology.md: Goal, Limit, Fails if, Context, Checked by,
  Quality need); a decision record is not an ICE.

business_intent_check: none
business_intent_check_reason: >-
  A framework decision on how an agent records a decision and how the review tool is laid out. No
  person's business intent changes. The Business Intent kind and its rules stand: only a person
  confirms or drops one (ADR 031), and the Intents section is unchanged. The project has no business
  intents folder (.garura/product/product-os/intents does not exist), and Affects names no business
  intent page.

