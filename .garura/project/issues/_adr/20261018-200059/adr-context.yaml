      drafts are never found by a lookup. Its cite summary cites ADR 035 §6 and ADR 034 §4 only.
  - path: core/tools/memory/citations.py
    what: "cite and citations: reads every source first, keeps the text, version and 3 lines around (AROUND = 3); its header cites ADR 035 §6 only."
  - path: core/tools/memory/memory.py
