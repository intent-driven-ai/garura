open_points_for_the_person:
  - "What a person does on an agent decision is not decided by the brief. The design (review-tool.md §4 item 7) has 'Looks right, or send back so the agent decides again from memory'; ADR 033 §6 (only the review step writes approval) bears on it."
  - "Whether the Memory section lists Phoenix memory or reaches it only through Ask memory: the brief says 'mostly garura memory ... and once an issue is selected then its STM'; ADR 036 §7 listed all three tiers."
  - "Still open from ADR 036: whether a product decision (decision.yaml) waiting for a person is reviewed in ADRs or under Decisions in the Product view; who writes the approval when a person accepts a card (ADR 033 §6)."
  - "Naming: the glossary's 'Resolution trace' row (ADR 015's R1–R4 trace) and this ADR's 'trace' share a word, and resolution.md holds both until the agents move (#663). The brief does not say whether the glossary gains a row."
  - "Judgment calls: ADR 032 §3 amended directly (its Status line already names Memory and ADRs); ADR 034 §4 judged not affected (it is reached through ADR 035 §6)."

