supersedes: []

amends:
  - adr: "035"
    file: docs/adr/035-agents-work-only-from-memory.md
    part: >-
      §6 "Every decision names its memory": a decision keeps a trace — the steps the agent took, in
      order, each with what it looked for, what it found, and the memory lines that said so (a tier,
      a file, the lines and a fingerprint of that text), kept with the exact text, the version of
      memory it was read from and up to three lines before and after — not one source ("the tier,
      the file and the lines it rests on"); a check reads every step's source again, names the step
      whose source changed or is gone, and flags a decision with no trace; §7 "A memory review" (a
      Memory view, made Memory and ADRs by ADR 036): the review tool's sections are Intents, Product,
      ADRs, Memory and Agent decisions, and which memory each decision came from is shown in Agent
      decisions, as its trace (and with it §9's line on ADR 032 §3)
    why: >-
      Brief part 1 and "Why now": §6 names one source per decision, while contract version 4
      (core/tools/memory/contract/v4.json, cite and citations) records a trace of steps with the text,
      the version and the lines around. §6's own last line says "The shape of an answer and its
      source is settled in plan item 6" — this is that shape, and it changes §6's words, so a pointer
      is owed. Brief part 2: §7's view (already renamed by ADR 036) is split into three sections.
      §9's line "ADR 032 §3 — the review tool has a third view, Memory" changes with §7, as ADR 036
      did. Everything else in ADR 035 stands — see not_affected for §4, §5 and §9's line on ADR 034 §4.
  - adr: "036"
    file: docs/adr/036-approved-answer-lands-in-short-term-memory.md
    part: >-
      §7 "Memory and ADRs are reviewed in the review tool": the one Memory and ADRs section is
      replaced by three — ADRs (the ADRs a person records with /adr, waiting for a person); Memory
      (the memory that exists: mostly Garura memory, and an issue's short-term memory once one is
      picked; the memory updates waiting for a person; and Ask memory, a plain-words search over all
      three tiers on the same vectorless memory tool, mocked only for now); and Agent decisions (every
      decision an agent made, with its trace); and with it §8's lines on ADR 035 §7 and ADR 032 §3.
      Where the brief is silent, §7 stands: the reviews happen in the review tool, on the Catch up
      cards, and a person approves by typing until the sections exist
    why: >-
      Brief part 2, in Kapil's words ("intents - product - adr(s) ... - memory ... then the agent adrs
      - we call this evidence, aka agent-decisions"). ADR 036 §7 is the decision that names the third
      section "Memory and ADRs" and lists what it shows; the brief replaces it. ADR 036 is accepted and
      its Status line has no pointer yet, so a reader of 036 would see the old section unless this ADR
      points to it. §1 to §6 of ADR 036 stand; its "Not decided here" questions stay open (see
      open_points_for_the_person).
  - adr: "032"
    file: docs/adr/032-drive-review-of-outcomes.md
    part: >-
      §3 "Two review tools", as amended by ADR 033, ADR 035 and ADR 036: the review tool has five
      sections — Intents, Product, ADRs, Memory and Agent decisions — in place of a third section
      called Memory and ADRs; the Intents and Product views, and ADR 033's part of §3 (they show the
      whole model's approval state when they open), stand
    why: >-
      Judgment call, following ADR 036's own (it pointed ADR 032 §3 to its new name so a reader of 032
      needs no second hop). It is stronger here: ADR 032's Status line today quotes ADR 036's pointer,
      "the third section is Memory and ADRs, not Memory", which this decision makes wrong. The brief
      names "ADR 032 §3 (as amended by ADR 035 and ADR 036)" as one of the records behind the change.
      Drop this amendment if one hop through ADR 036 is preferred. The rest of ADR 032 stands.

not_affected:
  - adr: "034"
    why: >-
      §4 "Every answer names its source" stands as written: an answer is still recorded with where it
      came from, the drive's review still shows what was assumed and on what basis, and an answer with
      no source is still not allowed (now also flagged by the check). A trace is where an answer came
      from, step by step. ADR 035 widened §4 through its part 6 (035 §9: "§4 stands and is widened by
      part 6") without a pointer on 034 (034's Status line lists §2, §3 and §6 only); the trace reaches
      §4 the same way, through ADR 035 §6, which this ADR amends. Judgment call — see open points. §2,
      §3 and §6 untouched.
  - adr: "035 §4"
    why: >-
      One tool finds and updates memory, searching the way Claude Code does — stands, and this
      decision rests on it. Ask memory is a plain-words interface for a person over the same tool, with
      no index (vectorless); the brief's last option (a vector index behind Ask memory) lost for that
      reason. Kapil's Griffin remark ("will use nlp, but it will use vectorless search") changes the
      interface only, as §4 already says Griffin changes nothing for Garura and its agents.
  - adr: "035 §5"
    why: >-
      Nothing from the model or the web without an approved memory update — stands. Every trace
      step's source is memory (contract v4 cite: "No source from the model or the web"); a decision
      from an approved memory update names the update, and its written file is a step's source.
  - adr: "035 §9 (other lines)"
    why: "Its line on ADR 034 §4 (\"§4 stands and is widened by part 6\") stays true; only its line on ADR 032 §3 changes, with §7."
  - adr: "033"
    why: >-
      Approval in the product model unchanged. §6 (only the review step writes approval; the review
      tool writes nothing to the model) is not touched: Agent decisions shows the memory tool's
      records. Who writes the approval when a person accepts a card stays open (ADR 036). Related.
  - adr: "012"
    why: >-
      Evidence self-commit unchanged. "Evidence" already names a play's run records (also the
      glossary's Evidence row, core/grounding/glossary.md) — the reason the section is named Agent
      decisions, not evidence. Related.
  - adr: "015"
    why: >-
      Already superseded in part by ADR 035, including "the resolution trace built on it". The
      decision trace here is not ADR 015's resolution trace; resolution.md keeps the old Resolution
      Trace Output for agents not yet on the tool, and it gives way when they move (#663), as
      resolution.md's new section says. Its Knowledge File Standard stands.
  - adr: "016"
    why: "resolution_trace_path already went under ADR 035. cite is a memory tool command, not an agent contract field; the contract is unchanged."
  - adr: "008"
    why: "Short-term memory stays per issue. Decision records are kept in the issue's own short-term folder (context/citations.jsonl, a setting) and never found by a lookup."
  - adr: "011"
    why: "A play's step-to-step files stay direct. The drive review record is written directly by write_drive_review.py."
  - adr: "029"
    why: "Drives unchanged. The drive's review record may now carry the play's decisions (optional --decisions); the review is still the drive's last step (ADR 032)."
  - adr: "031"
    why: "Only a person confirms or drops a business intent — stands. The Intents section is unchanged. Related."

  - adr: "028 / 030 / 026"
    why: "Surfaced by the overlap check on the draft through shared play names only (/intent, /vision, /understand, /play-editor; 030 also through the #606 plan). The five loops, plan mode and direct model writes are not about traces or the review tool's sections."
  - adr: "034 (open point on where a source is recorded)"
    why: "034's Negative / Risks left open where each answer's source is recorded; ADR 035 §6 handed the shape to plan item 6, and #659 built it (cite in the issue's short-term memory; the drive review record carries it). This ADR records the trace's shape only; 034 needs no pointer for it."

