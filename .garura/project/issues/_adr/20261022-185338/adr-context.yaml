ice_impact: >
  The ICE of 21 plays and the Discovery loop changes in wording only: 'functionality' becomes
  'feature', and the four delivery plays take their new names; each fingerprint is stamped again
  and no constraint, failure condition or scenario changes in meaning in #807. The product's own ICE
  keep their shape: one for each capability and each feature (ADR 047). What changes in meaning: a
  work item carries no ICE; a Story writes its scope of work from its Feature's ICE and its
  Capability's ICE; an Epic has no ICE. The ICE of /shape-slice, /build-epic, /validate-epic and
  /next change in meaning later, in #795, #799, #801 and #803, when each stops reading the epic
  record and the dropped slice fields.

business_intent_check:
  value: kind
  text: >
    kind — this ADR changes the Business Intent kind, not any person's business intent. The kind
    gains the tracker label `product` (the only kind with it), an Epic serves it, and a work item
    reaches it through its Epic (ontology v7). No business intent is confirmed, dropped or changed
    in meaning. The #807 rename also changed the word "functionality" to "feature" in six lines on
    three intent pages (bi-717 Plan line; bi-722 Outcome and Why lines; bi-756 Why line; commit
    c14b71d4, same meaning). The first draft's guard stopped on that. Shown the lines on 2026-10-23,
    the product owner chose to keep the new wording ("1"). So those words were changed by the person
    who owns the intents, not by this decision, and the intent pages are not in this ADR's Affects.
  keeper_note: >
    Round 1 declared `instance` and the guard returned exit 4; the play took it to the product owner,
    who kept the wording on the three pages. Round 2 declares `kind`, per the brief. The pages are
    named in the check's own text, in plain view, not in Affects. This is not hiding the finding:
    the guard reads Affects to know what a decision changes, and this decision does not change them.

