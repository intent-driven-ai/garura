for_the_accepter:
- point: The list names plays and loops, but no skill and no agent, and the verb remove is still unrecorded
  what_and_where: The skill verbs and agent endings in core/components/memory/standards/rules/naming.yaml
    (lines 32 to 59), and ADR 046 §5. The 75 skills under core/components/skills/.
  detail: 'The brief says the fixed verb lists are replaced, and gives author, on 21 live skills, as its
    example. names.md names no skill and no agent, and #1015 asks that every verb, skill verbs included,
    gets a role. Separately, remove is in the source naming.yaml (line 56), but not in ADR 046 §5 and
    not in Phoenix memory''s naming.yaml. ADR 065 left it because the verbs change next.'
  why_it_matters: If the skill list goes too, 72 of the 75 skill names fail the naming check, with no
    new names to move to (commit-files and merge-pr keep a verb that stays, and platform-adapter is the
    named exception). If it stays, author stays too, which is the brief's own example of the problem.
    Meanwhile remove-model-part and remove-plan fail the check in any project that reads Phoenix memory's
    copy.
  this_decision_does: Only the play and loop lists change. ADR 046 §5 stands, and remove is not recorded.
  you_decide: 'Decided: skills and agents keep their verbs for now, and get their own list in a later
    decision. remove stays undecided, in that later decision.'
- point: The list drops two design plays, and the brief gave no reason
  what_and_where: /shape-marketing-lens and /shape-measure-lens, with their skills author-marketing-lens
    and author-measure-lens, under core/components/. names.md line 10.
  detail: The brief's six parts do not mention the drop. ADR 053 §4 says the seven lens plays are not
    dropped and are rebuilt when their stage comes, and ADR 028 §2 lists marketing as a design area. Both
    plays are stale today, so no install lays them. /shape-marketing-lens is the only play that covers
    how a slice is found (SEO, AEO, GEO) and its reach signals. /shape-measure-lens is the only play that
    sets a slice to realized, and the stale /build-epic still refuses a slice without it (scripts/check_ready_epic.py,
    lines 187 to 190).
  why_it_matters: This repo records a dropped play in an ADR with its reason (CLAUDE.md, ADR 051). Whoever
    rebuilds /build-epic and /learn-outcomes needs to know the stamp is gone.
  this_decision_does: It records the drop with its reason, and changes ADR 053 §4 and ADR 028 §2. Nothing
    is deleted by this decision.
  you_decide: 'Decided: they go. In the product owner''s words: "They didn''t have good reasons to exist.
    They''ll be added if needed, and for now they go."'
- point: The Alignment loop connects no two phases, so the new pattern cannot name it
  what_and_where: ADR 031 ("Drift is found and fixed by an Alignment drive"), ADR 049 line 91, ADR 052
    lines 63 and 97, and six lines of the ontology (25, 144, 510, 522, 524, 735). ADR 045 §3 gave /drift
    to the Learn loop.
  detail: These records send drift, such as a story out of date with its ICE, or two ICE for one part,
    to an Alignment loop. It is not built. names.md lists six loops, one per transition, and neither it
    nor /drift appears there. Under loop-<from>-<to> it has no from and no to.
  why_it_matters: Until it is named, these records point at a loop with no name and no approval, and no
    loop fixes drift.
  this_decision_does: It names the six loops and leaves those records as they are.
  you_decide: 'Decided: the Alignment loop is unapproved and unnamed. The product owner names it later.
    It does not move into /loop-run-product, and the older ADRs that mention it stay as they are.'
- point: The loop names call the second phase Spec, and no record said the phase was renamed
  what_and_where: '/loop-product-spec and /loop-spec-design (names.md line 23); the open point "Phase
    name" in #1015; the phase table in core/components/memory/standards/rules/naming.md (lines 39 to 46);
    ADR 029''s six phases; docs/philosophy/intent.md lines 12 and 49.'
  detail: 'The loop names and the model''s new pages say Spec, but the rule files and ADR 029 still say
    Intent, and #1015 left the question open. docs/philosophy/intent.md says an intent sits "at a level
    above any specification", and that in intent-driven work "the spec is an intermediate the system generates
    from intent and memory". /loop-product-spec is the loop whose output is intents.'
  why_it_matters: The harness standard is written for other teams to take. They would read a loop named
    for specs next to a page saying an intent is not a spec.
  this_decision_does: It names the second phase Spec (Decision §8). The rule files' wording changes with
    the renames, ADR 029 gains a forward pointer, and the page stays as it is.
  you_decide: 'Decided: Spec, not Intent. docs/philosophy/intent.md stays: an intent sits above a specification,
    and a person''s intent becomes a spec.'
notes:
- naming.md and naming.yaml were read at their repo source paths as the files this decision changes. The
  ontology and Phoenix memory's naming.yaml were read only through the memory tool.
- The second half of the brief's part 1, about what a business intent says, and part 4's words on where
  the work plays sit for now (that place is a business intent), are left out of the Decision at the caller's
  word.
- 'Slip: while checking a count, this agent listed the intents folder and read the first two lines of
  one intent page by its path, against its own rule. The titles were then read again through the memory
  tool, and nothing in this record rests on the direct read.'
- The product owner's answers on the four points came through the coordinator, with the word accept. The
  status stays proposed; the play marks it accepted.
- ADR 046 and ADR 028 are each listed once, under supersedes, with all their parts. apply_adr.py writes
  one pointer per older file, and a second entry for the same file would be skipped, so its part would
  never reach the older ADR.
- ADR 029 moved from left alone to amended. The answer says its wording changes, and an accepted ADR's
  text is never edited, so the change reaches it only as a forward pointer.
