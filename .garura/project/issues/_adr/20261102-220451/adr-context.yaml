guidance_from_the_caller:
- The record is only about how this project is built. Keep business intents and model content out of the
  Decision.
- Short. The product owner reads it in one sitting.
- Only what the person truly must decide goes under "For the Person Who Accepts This".
- Nothing is renamed by this decision, so a play's current name in an older ADR is not a change to that
  ADR.
