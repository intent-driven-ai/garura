  are renamed, each ICE that names one changes in wording only, through /edit-play or /edit-loop, and
  its fingerprint is stamped again. The ICE of the two dropped design plays goes when they are deleted,
  and /build-epic and /learn-outcomes stop reading the realized stamp when those plays are rebuilt. initialize
  has no ICE yet. The ontology (read at version 15) and the ICE kind do not change; the ontology''s wording
  follows the rename.'
