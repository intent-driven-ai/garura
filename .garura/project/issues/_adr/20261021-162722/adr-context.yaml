supersedes: []

amends:
  - adr: "028"
    part: >-
      "Each loop is an intent" — the names Understand, Shape, Execute, Change, Learn are no
      longer working names: the loops are named Discovery (was Understand), Slice (was Shape),
      Execute, Ship (was Change) and Learn; and §5 "Learn": its plays are /learn, /promote and
      /drift (in place of /next, /focus, /learn). Also the word ADR 029 took from it ("loop
      recipe" becomes drive) comes back: a loop is a loop.
  - adr: "029"
    part: >-
      §1 "A drive is a run of plays" — the word: a drive is now a loop, and the
      American-football origin of the name goes; §6 "The first drive: Kickoff" — Kickoff is
      now the Discovery loop; and §1's rule "A drive never shares a name with a play" — the
      Learn loop shares its name with the /learn play; the always-full-name rule ("the Learn
      loop", never a bare "loop") now separates them. Everything else in ADR 029 stands,
      under the new word.
    keeper_note: >-
      The brief does not say it overrides the no-shared-name rule. But it names the Learn
      loop "Learn" and the /learn play exists (core/components/plays/learn/), so the rule no
      longer holds as written. Say this in the draft's Context so the person who accepts can
      check it.
  - adr: "044"
    part: >-
      §1 "The Shared Drive Run owns the steps between plays" — the name only: the Shared Drive
      Run is now the Shared Loop Run. What it owns does not change.

not_affected:
  - adr: "032"
    why: Uses the word "drive" only; how a loop's outcome is reviewed does not change. It reads with drive as loop.
  - adr: "041"
    why: Uses the word only; rounds, question ownership and member plays do not change.
  - adr: "043"
    why: Uses the word and "Kickoff" only; how the plays read and the loop connects nodes does not change.
  - adr: "035"
    why: Script candidate through /learn only; agents working from memory does not change.
  - adr: "025"
    why: >-
      Not affected. But its "goal-loop" inside each play (Level 3) is an inner loop, like the
      agent loop the brief names. The always-full-name rule also keeps a loop apart from it.
  - note: >-
      ADRs 030, 031, 033, 034, 036, 037, 039, 042 also use the word "drive". They keep their
      words (brief, Decision 5) and read with drive as loop. They get no pointer.

