  - core/components/plays/drive-editor/ (becomes loop-editor; scripts/lint_drive.py)
  - core/components/memory/standards/rules/drive-contract.md (becomes the loop contract) and its row in rules/_index.md; other rules that name a drive (run-status.md, direct-model-write.md, work-plan.md, gate-config.md, pipeline-position.md, evidence-recording.md)
  - core/components/agents/drive-checker.md (becomes the loop checker); other agents that name a drive (product-os-keeper.md, prototype-reader.md, knowledge-builder.md, business-intent-keeper.md)
  - core/components/skills/judge-drive-result/ (SKILL.md, verdict.schema.json), find-model-gaps, close-model-gaps, author-adr
  - core/components/plays/play-creator/references/ (check_drive_contract.py, test_drive_contract.py, write_drive_review.py)
