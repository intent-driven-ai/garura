  - core/components/plays/install-garura/scripts/install.py and test_install.py (the drives path, META_PLAYS drive-creator/drive-editor); uninstall-garura
  - core/tools/lint-components/lib/discover.js and lib/rules/structural.js
  - core/tools/rebuild-eval/ and core/tools/memory/contract/v5.json
  - core/components/memory/standards/templates/adr.md ("Inside a drive")
  - core/grounding/glossary.md (the Drive and /drive-creator entries; the "never shares a name with a play" line)
  - docs/philosophy/ (idsd.md, garura-reference-implementation.md, architecture.md) and docs/components/ (plays.md, agents.md, skills.md, memory.md)
  - the ice.md of the plays that run inside a drive and their fingerprints in SKILL.md

ice_impact: >-
  Wording only. The ICE of the plays that name a drive changes "inside a drive" to "inside a
  loop": core/components/plays/{intent,vision,understand,adr,run,start-change,search-knowledge,
  build-knowledge,review-knowledge}/reference/ice.md and core/components/drives/kickoff/reference/ice.md
  (which becomes the Discovery loop's). Each changes through /play-editor (or the loop editor),
  and its fingerprint in SKILL.md is stamped again. No guarantee, constraint, failure condition
  or scenario changes in meaning.

business_intent_check: none
business_intent_why: >-
  A framework rename. No person's business intent changes, and the Business Intent kind does
  not change.

