shape: markdown
number: 069
title_hint: 'The Plan Is Where the Product Model Meets the Work: the Model Knows No Plan, No Tracker and No Decision Record, One Epic and One Eval for Each Plan, and a Done Plan Lands on Main Only When Its Eval Passes'
status: proposed
level: framework
date: 2026-11-12
decided_in: '#954 (/shape-plan makes an Epic for each slice; a plan should have one Epic that holds all its slices)'
template_path: .garura/project/issues/_adr/20261112T093635Z/context/templates/standards/templates/adr.md
draft_path: .garura/project/issues/_adr/20261112T093635Z/adr-draft.md
round: 5
memory_copies:
  ontology_from_memory: .garura/project/issues/_adr/20261112T093635Z/context/memory/standards/schemas/product-os/ontology.md
  note: Line numbers are read from the source ontology, core/components/memory/standards/schemas/product-os/ontology.md, version 16. Phoenix memory's copy is version 15.
changes_at_acceptance:
- '1. Until an eval runner exists, the Garura harness runs the plan''s eval by hand before a done plan lands. The runner is #801 (/validate-epic runs the hidden evals and the checks, and gives the verdict, under #800). #819 is closed and is no longer named as the runner. Round-1 point 1 (ADR 060) is settled: only a done plan waits for its eval; a paused plan still merges (ADR 060 §2).'
- '2. NEW principle, its own numbered part, early: the product model holds no reference to plans, epics, tracker issues or the tracker. Links run one way, from the work side (plans, tracker issues, evals, hidden files) to the model. A slice does not name its plan, the plan''s folder or its eval; the plan names its slices. The business intent page''s Tracker line goes (reverses the last sentence of ADR 068 §1).'
- '3. Round-1 point 3 settled: what replaces the per-slice eval index file (and the eval and guide layout) is left to the /design-eval rework.'
- '4. Round-1 point 4 settled: a slice is in progress when the plan file that holds it records it so. The plan file records each slice it holds and that slice''s status. The model is not asked.'
- '5. Round-1 point 5 settled: /reshape-plan gets an ''add a slice'' instruction for a plan that exists.'
- '6. Round-1 point 6 settled: the unplanned epic goes. A plan''s chores sit in the plan, under its one epic.'
second_change_at_acceptance:
- A. The record states the principle and changes no business intent page itself. The change to the Business Intent kind (no Tracker line; What was done links to no work item) is made through /specify-ontology with the product owner's checkpoints, and is listed under Work This Creates. Affects names the ontology's Business Intent kind, not the intent pages or ids. No intent's title, outcome, why, asked by, proof, must not, rules or stage changes.
- 'B. Round-2 open point 1 settled: each plan''s eval covers every feature of its slices, the held_by ones included; each plan file records that slice''s status for itself.'
- 'C. Round-2 open point 2 settled: existing ids (bi-<n>, fn-<n>) stay as names. Later work: a new business intent gets an id that does not come from the tracker.'
- 'D. Round-2 open point 3 settled: every reference to the tracker and to plans is removed from the model, including pages that cite tracker issue numbers as sources and the spine''s created_by / updated_by lines that name an issue. Git history keeps the origin and is not changed. The clean-up is Work This Creates, through product-os-keeper and the model''s skills, and needs a new ontology rule.'
reference_definition: A "reference" is a name, number, link, path or field in the model (a page and its Sources, a spine entry and its metadata, a slice record) that points at one particular plan, plan folder, eval, hidden file, epic or tracker issue, or at the tracker. Cited issue numbers ("#946", "Built (#818)") and created_by / updated_by lines that name an issue count (settled at acceptance). A part whose subject is plans may still describe plans in general, with placeholders (ADR 065 rule 3, last sentence, kept; the product owner said "ok to your proposal"). Seven Garura pages describe the plan files that way (for example fn-818 line 11, "`.garura/project/plans/<intent>.yaml`"); the keeper reads them as descriptions, not references.
supersedes:
- adr: 049
  part: full
  why: 'The product owner retires it. What goes: one epic for each slice, one epic shared by two plans, one eval for each slice. Every other part, as amended by ADR 052, ADR 057, ADR 063, ADR 067 and ADR 068, is restated (Decision §9), phrased from the plan''s side so that no restated part has the model know a plan.'
- adr: '057'
  part: full
  why: 'The product owner retires it. What goes: the slice file eval.<slice-id>.md and the eval as the slice''s. §1, §2, §4 to §7, as amended by ADR 068, are restated (Decision §10).'
amends:
- adr: 048
  part: 'Decision §1, third bullet (''an Epic stands for a Slice'') and §3, first bullet (''An Epic represents one slice''): an Epic stands for its plan. And §5 (''Until then they stay on disk''): the spine''s epics list leaves the model with this record''s schema change, not with each play''s story. §2''s first paragraph stays superseded; its replacement is restated in Decision §9.1. The rest stands, as amended by ADR 056 and ADR 068; §1''s ''Only the Business Intent is a product-layer tracker issue'' stands.'
- adr: '017'
  part: '§1, the plans/ entry that ADR 049 added under .garura/project/: plans/<id>.yaml and its folder <id>/ with evals/ (the plan''s one eval, and evals/<slug>/ with the hidden file of each slice the plan holds that was first shaped for its intent) and guides/. The principle does not reach §1 otherwise: plans/ is on the work side.'
- adr: '052'
  part: 'Decision §3: the epic that keeps the map is the plan''s one epic, with one line for each feature of each slice the plan holds. §1 (the play makes evals/<slug>/ in the plan''s folder) is play-side, so the principle does not reach it; the rest stands.'
- adr: 058
  part: 'Decision §3, ''It names each epic past ready, with its status, as out of date'': a slice is in progress when a plan file that holds it records it so; the brief names that plan and its epic as out of date. §1 reads with the same test. §2 stands.'
- adr: '060'
  part: 'Decision §4, ''The only reason to hold it back is that it would break main'': a done plan is also held off main until its eval passes; until the eval runner (#801) exists, the Garura harness runs the plan''s eval by hand before a done plan lands. §1, §2 (a paused plan merges), §3 and §5 stand.'
- adr: '062'
  part: 'Decision §2, ''its epic is past ready (in_delivery, validated, fix_required or delivered — the rule /shape-slice uses)'' and ''names each epic past ready, with its status'': a slice is in progress when a plan file that holds it records it so; the confirm screen names that plan and its epic. §1 and the rest of §2 stand.'
- adr: '063'
  part: 'Decision §2, ''the person may add a bug, a story or a feature to the plan'': also a slice (its features'' Feature issues go under the plan''s one epic). §3, ''that slice''s eval is out of date'': the plan''s eval is out of date. §1 stands.'
- adr: '065'
  part: 'Rule 3, ''The product model never names a plan ... Naming a plan means naming one particular plan'': widened — the model holds no reference to a plan, a plan''s folder, an eval, a hidden file, an epic, a tracker issue or the tracker; this includes an issue number cited as a source and a created_by or updated_by line that names an issue. Its last sentence, ''A part about plans may still describe them'', stands. Rules 1, 2 and 4 stand. Also its line on ADR 026, ''The profile and decisions/ stay with the play''s script'' (§ What this decision does, line 50; What this changes, line 147): decisions/ leaves the model; the profile stays with the play''s script.'
- adr: 068
  part: 'Decision §1, last sentence, ''The business intent pages keep their Tracker line'': the Business Intent kind loses the Tracker line, through /specify-ontology. ''every id stays as it is (for example bi-1 and fn-724)'' stands: the ids stay as names (settled at acceptance). §2 to §6 stand; ''a second epic'' in §4 now means another plan''s epic.'
- adr: '026'
  part: 'Decision, ''Consequent mechanics'', ''Containment split'', ''Every shared file — the spine _spine.yaml, profile.yaml, decisions/ —'': decisions/ is no longer a model file; the model holds no decision record. The rest of the split, as amended by ADR 044 and ADR 065, stands.'
- adr: '032'
  part: '§2, ''in the product model: domains, capabilities, functionalities, product limits and decisions'': the model holds no decision records; a product decision is the content of the part it decides. §7, ''Inside a drive, /understand writes its decision as proposed'' and ''it rejects the decision'': a box-move writes no decision record and no ADR; the person''s answer is the raised level and its gate on the profile, and the reason it moved is in git history. Lowering the limit and sending the capability back stand. The rest stands.'
- adr: '033'
  part: '§1, the item ''each decision'', and §5, ''An approved decision is accepted'': the model holds no decision record; a product decision is approved as the content of the part it decides; an ADR, a decision about the code, is accepted on a person''s word through /design-adr. The rest of §1 and §5 stands.'
- adr: '036'
  part: 'Negative / Risks, ''Not decided here'', first item, ''whether a product decision (a decision.yaml record, also an ADR) waiting for a person is reviewed in Memory and ADRs or stays under Decisions in the Product view'': settled. No product decision record exists: a product decision is the content of the part it decides, and is seen with that part in the Product view; an ADR that waits for a person is reviewed with the ADRs. The other items stand.'
- adr: '037'
  part: 'Negative / Risks, ''Not decided here'', third item, its first half, ''whether a product decision (a decision.yaml record) waiting for a person is reviewed in ADRs or under Decisions in the Product view'': settled as for ADR 036. Its second half, ''who writes the approval when a person accepts a card (ADR 033 §6)'', stays open.'
