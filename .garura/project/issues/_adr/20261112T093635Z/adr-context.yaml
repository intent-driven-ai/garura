third_change_at_acceptance:
- 'H. Decision records leave the product model. No decision.yaml record lives in the model, and no model part links to one: the spine''s `decisions` links go (248 of them: 40 capability entries and 208 feature entries; one is not empty, cap-initialize at _spine.yaml lines 52 and 53). The one record, .garura/product/product-os/decisions/dec-cap-initialize-security-none-medium.yaml, is taken out whole with its folder; git history keeps it. It is not edited first, so the rule that an accepted record is never edited holds.'
- 'I. A decision is recorded as an ADR (Markdown, the project''s docs/adr/), never inside the model. This is the orchestrator''s reading of the product owner''s words ''as for ADRs. the rule stays''; the person confirms it at accept (new open point 1). With it, the ADR template keeps one shape (Markdown); the YAML shape, the decision schema and the YAML paths of author-decision, adr.py, /design-adr and adr-keeper go. REPLACED by the fourth change (M, N): a product decision is the content of the part it decides, in the model; an ADR records a decision about the code.'
- 'J. The ADR rule stays: an accepted ADR is never edited; an older ADR is marked superseded (retired) by a forward pointer; a new decision is a new ADR.'
- 'K. Round-3 open point 1 (the accepted product decision record, which may not be edited) is settled by option (c): decision records leave the model. The record is removed whole, not edited. decision.yaml''s decided_in goes with the schema.'
