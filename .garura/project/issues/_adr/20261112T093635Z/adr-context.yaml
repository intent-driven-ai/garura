ice_impact: '/shape-plan, through /fix-play: Intent, C3, C6, C13, F2, S1, D1 — one epic for the plan, its map has a line for each feature of each slice, and the plan file records each slice it holds with its status; author-work-items writes one epic for the plan. /design-eval, through /fix-play: Intent, C1, C2, C3, C7, C8, C9, C12, C13, C14, F14, REC14 — read the plan''s one epic, write one eval for the plan that covers every feature of its slices, the held_by ones included; author-slice-eval and evals-engineer follow. /reshape-plan, through /fix-play: C3, C11, a new "add a slice" instruction (with its failure condition and scenario), and a slice in progress read from its own plan file; author-plan-changes gains the instruction. /design-slice, through /fix-play: C7, C20, F7, F20, REC7, REC20 — a slice in progress is read from the plan files that hold it, never from the spine; the intent page it writes has no Tracker line. merge-work, through /fix-play: Intent lines, F9, REC9 — a done plan''s branch is held off main until its eval passes, the harness runs the eval by hand until #801 exists, a paused plan still lands. author-intent-page and link-model-part follow the ontology. /design-adr, through /fix-play: C2, S3 and its Context — one shape, Markdown, for decisions about the code only; it never writes the model; adr-keeper and author-decision follow. /specify-capabilities, through /fix-play: C8, C9, C10, C13, C14, F7, F8, S2, S3, S4, S7, REC7, REC8 — a box-move still stops for the product owner''s yes, and writes no decision record and no `decisions` link in the model; the person''s answer is written on the profile, as the raised level and its gate, and the reason it moved is kept in git history, in the change that lands it. learn-outcomes and the seven slice lens plays (not installed), through /fix-play when each is next built: no decision record in the model; a product decision is written as the content of the part it decides; a lens play''s choice about how the product is built (its stack, its environments) is an ADR in the project''s ADR folder. link-model-part and remove-model-part stop writing and moving `decisions`. The product''s own ICE: the feature ''Define the product profile and the product decision as kinds of the map'' (fn-profile-decision-kinds) loses its Product Decision half, which does not become a kind of its own (Goal, Fails if line 8, Read, Scope; the Product Profile half stays); its capability''s ICE Scope line 15 follows; the Out line ''product decisions in the model'' of fn-record-adr, fn-keep-adrs-linked and fn-keep-adrs-to-build goes; fn-keep-adrs-to-build''s ''Not decided'' lines 42 and 43 close (a move of the profile is a product fact in the model; the reason for a change in the model is in git history). These change through product-os-keeper and enrich-grounding (update mode), with the product owner''s words. The clean-up of Garura''s own pages takes issue numbers out of their Sources and lines, and changes no ICE''s meaning. The ICE kind does not change. The ontology changes through /specify-ontology.'
business_intent_check: kind
business_intent_note: 'The record changes no business intent page. It states the principle, and the work it creates changes the Business Intent kind through /specify-ontology, at the product owner''s checkpoints: the page has no Tracker line, and What was done keeps what was delivered and its value with no link to a work item. When the kind changes, the Tracker line comes off Garura''s eleven intent pages (bi-1 to bi-11; each has one, bi-5''s is ''**Tracker:** #5'' at line 16; round 2 said bi-5 had none, which was wrong). No intent''s title, outcome, why, asked by, proof, must not, rules or stage changes; every What was done block reads ''(nothing yet)''. Affects names the kind, not the pages or the ids. The guard reads Affects and the intent titles; Work This Creates still names the eleven pages, and the report says so. Third change: the record still changes no business intent page. The link text to fn-profile-decision-kinds in its intent''s Touches list follows the feature''s title if that title changes; Touches is not one of the intent''s own fields. No intent''s own field names a decision record.'
for_the_accepter:
- point: 'One term, two meanings: ''agent decision'''
  what_and_where: the brief's fourth change ('ADRs represent the agent decisions - this is the code part'); docs/adr/037-agent-decisions-keep-a-trace-and-the-review-tool-has-five-sections.md, its title, §1 ('Every agent decision keeps a trace', line 31) and §2 ('Agent decisions — every decision an agent made, with its trace', line 52), which named a section of the review tool
  detail: 'ADR 037 calls every decision an agent makes from memory an ''agent decision'' (for example, which recovery a feature needs, with the memory lines it rested on), and the review tool shows them in their own ''Agent decisions'' section, beside a separate ''ADRs'' section. Your split calls what an ADR records an ''agent decision''. One word now names two things: an agent''s traced choice in a run, and an ADR about the code.'
  why_it_matters: A play, a skill or a person who reads 'agent decision' can file an ADR for a run's traced choice, or look for an ADR in the review tool's 'Agent decisions' section. The two hold different things and are reviewed in different places.
  this_decision_does: 'It words its own rule as ''an ADR records a decision about the code: how the agents and plays work and how the product is built'', and does not use ''agent decision'' for it. It does not amend ADR 037.'
  you_decide: 'One of: (a) keep both: ADR 037''s ''agent decision'' stays the traced choice of a run, and this record says ''a decision about the code'' for an ADR (the draft as written); (b) ''agent decision'' means an ADR''s subject, and ADR 037''s section and term get a new name, through a new ADR.'
- point: Your earlier answer that the product decision becomes a kind of the ontology is partly reversed
  what_and_where: '.garura/product/product-os/software-delivery-planning/define-product/fn-profile-decision-kinds/feature.md and ice.md (Goal line 4, Fails if line 8, Scope line 16); define-product/ice.md, Scope line 15; the answer it rests on, question 8 of the #1021 stock-take, as the feature quotes it: ''the product profile and the product decision become kinds of the ontology'''
  detail: 'The feature is not built. It plans two kinds: the Product Profile and the Product Decision, ''the record of a move of that profile''. Under your split, a product decision is not a record: it is your answer, kept as the content of the part it decides. So the Product Decision half goes, and it does not become a kind of its own; each kind already defines the properties that hold your answers. The Product Profile half stays, and its levels and gates are where a box-move''s answer sits. The keeper reads ''recorded in ontology'' as ''in the model, in the place the ontology gives the part''.'
  why_it_matters: If the feature stays as it is, a later /specify-ontology run adds a kind for a record the model no longer holds.
  this_decision_does: 'It names the feature''s ICE and its capability''s ICE under ICE impact: the feature keeps the Product Profile kind and drops the Product Decision kind. product-os-keeper changes them through enrich-grounding, with the words you approve. If the feature''s title loses ''and the product decision'', the link text to it in its business intent''s Touches list follows.'
  you_decide: Nothing, unless 'recorded in ontology' meant a Product Decision kind of its own; then say so at accept.
- point: 'The model already breaks the Feature''s rule: 23 feature entries name an issue, and a skill writes them'
