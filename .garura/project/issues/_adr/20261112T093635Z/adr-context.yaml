fourth_change_at_acceptance:
- 'L. The split, in the product owner''s words: "product decisions are recorded in ontology. you ask me questions and i answer. those are product decisions. - this the model part. ADRs represent the agent decisions - this is the code part."'
- M. A product decision is the person's answer to a question a play asks them. It is recorded in the product model, as the content of the part it decides, in the place the ontology gives that part (for example the product profile's security level and its gate, or an intent's proof). It is not a separate decision record. This replaces the third draft's reading I ('a decision is recorded as an ADR in docs/adr/').
- 'N. An ADR records an agent decision: a decision about the code, how the agents and plays work and how the product is built. ADRs stay in the project''s ADR folder (docs/adr/ for Garura) with their rule (J).'
- 'O. A box-move (a raised product limit): the person''s answer is recorded on the profile itself, as the raised level and its gate. The reason it moved lives in history: the change that lands it, in git. No ADR and no decision record.'
- 'P. Round-4 open point 1 (what ''as for ADRs, the rule stays'' means for a decision about the product) is settled by the split and removed. It agrees with the product owner''s test of 2026-11-02 (manage-adrs/fn-keep-adrs-to-build/feature.md line 5: ''an ADR is only for how the project is being developed ... What is written inside the product model is not''), and closes that page''s ''Not decided'' lines 42 (a move of the profile is a product fact in the model) and 43 (the reason for a change in the model is kept in git history).'
- 'Q. Keeper''s judgment on fn-profile-decision-kinds: the Product Decision half goes. It does not become a kind of its own, because a product decision is no longer a record: it is the content of the part it decides, and each kind already defines its own properties. The Product Profile half stays, and its levels and gates are where a box-move''s answer sits. The #1021 answer (''the product profile and the product decision become kinds of the ontology'') is still partly reversed; the point stays shown only. The product owner''s words ''recorded in ontology'' are read as ''in the model, in the place the ontology gives the part''; if they meant a kind of its own, the product owner says so at accept.'
- 'R. Keeper''s reading of the lens plays under the split: a lens play''s material choice about how the product is built (its stack, its environments) is a decision about the code, so it is an ADR in the project''s ADR folder, never a record in the model. A person''s answer that a lens play asks for is the content of the part it decides. learn-outcomes''s product-level decisions are product decisions: the content of the part they change, with the reason in git history.'
- 'S. New point found: ADR 037 already uses ''agent decision'' for a different thing: every decision an agent made, with its trace of the memory it rested on, shown in the review tool''s ''Agent decisions'' section (ADR 037 §1, §2 line 52). The product owner''s split uses ''agent decisions'' for what an ADR records. The record words the rule as ''a decision about the code'' and does not amend ADR 037; the product owner decides whether the two meanings stay.'
