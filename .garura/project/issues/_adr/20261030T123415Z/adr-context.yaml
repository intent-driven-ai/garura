for_the_accepter:
- point: The component linter would fail /update-plan once it carries the guard, because its one commit
    is not a feat(model) commit
  what_and_where: The linter rule L-DMW-4 in core/tools/lint-components/lib/rules/structural.js (lines
    250–264), and step 7 of direct-model-write.md (lines 82–103) and its lint anchor L-DMW-4 (lines 230–232).
  detail: 'The L-DMW checks run only on a play that bundles scripts/scoped_write_guard.py (lines 189–199).
    This decision makes /update-plan bundle it. Then L-DMW-4 asks for two texts in its SKILL.md: "git
    status --porcelain ... product-os" and "feat(model)". /update-plan''s SKILL.md has neither today:
    the clean check is done by plan_branch.py go over the whole tree, and the decision says the model
    change is committed in the session''s one commit, not a separate feat(model) commit. L-DMW-4''s only
    "Not a finding" case is a play run with a loop contract. L-DMW-3 and L-DMW-6 do not fire today (the
    SKILL.md has no "Checkpoint" heading, no "approval-prompt" and no persist_*.py).'
  why_it_matters: The rebuild of /update-plan through /edit-play, and the review's Layer 1 lint, would
    report two errors on a play that follows this decision. Whoever runs the rebuild would be pushed to
    add a feat(model) commit the decision says not to make.
  this_decision_does: 'It declares the exception in the rule, and, on the person''s answer at the checkpoint,
    names /update-plan in L-DMW-4''s ''Not a finding'' note in the rule (lines 230–232) and in structural.js
    (lines 250–264), in this same change: its clean-tree check is plan_branch.py go over the whole tree,
    and its model change rides in the session''s one commit.'
  you_decide: nothing — you chose at the checkpoint to name /update-plan in L-DMW-4's 'Not a finding'
    note in this change.
- point: The guard must run after the second model write, not right after the model step
  what_and_where: core/components/plays/update-plan/SKILL.md, Step 8 (lines 264–279) and Step 9 (lines
    290–299).
  detail: 'The session writes the model twice: Step 8 writes each new feature''s page, its spine entry
    and its place in the slice; then, after the tracker step makes the story, Step 9 dispatches product-os-keeper
    again to name the story on the feature''s spine entry (link-model-part, mode update, issue). The brief
    says the guard runs "once after the model write and before the commit".'
  why_it_matters: A guard placed right after Step 8 would not see Step 9's write; a model path written
    there outside the session's parts would reach the commit unchecked.
  this_decision_does: It says the guard runs once, after the last model write and before the one commit
    (Step 12).
  you_decide: nothing
- point: The tool's own words still say "stay" comes before the uncommitted-work check
  what_and_where: core/tools/plan/plan_branch.py, its docstring lines 16–18; core/tools/plan/README.md
    lines 54–55; /update-plan's ICE, Context lines 88–89 and C2 line 21.
  detail: 'The code of go (lines 149–155, uncommitted on this branch) now checks uncommitted work first
    and only then stays on the plan''s branch. The docstring still reads "on the plan''s branch already:
    it stays ...; else, when anything is uncommitted ...: it stops". The README reads "it stays there,
    stops on uncommitted work ...". The ICE''s Context reads "stay, stop on uncommitted work, switch",
    and C2 reads "On another branch with uncommitted work it stops".'
  why_it_matters: 'A builder of #989 (start-change cuts a plan''s branch through plan_branch.py) reads
    the README and the docstring and learns the old order; the ICE would let a rebuilt play stay on a
    dirty plan branch.'
  this_decision_does: It makes the check on every path the rule. On the person's answer at the checkpoint,
    the docstring and the README are corrected in this same change, with the code; the ICE's C2 and Context
    change with /edit-play.
  you_decide: nothing — you chose at the checkpoint to correct the docstring and the README in this change.
- point: /update-plan keeps its own copy of the list of epic statuses that mean "in progress"
  what_and_where: core/components/plays/update-plan/scripts/place_feature.py line 57 and core/components/plays/shape-slice/scripts/find_serving_slice.py
    line 53.
  detail: Both hold IN_PROGRESS = ("in_delivery", "validated", "fix_required", "delivered"). The place_feature.py
    line says "past ready (ADR 058)". Nothing ties the two copies together. A third copy is in core/components/plays/shape-slice/scripts/persist_slice.py
    line 105, inside /shape-slice; edit_slice.py line 57 imports the list from find_serving_slice.py.
  why_it_matters: If /shape-slice's list changes (a new epic status), /update-plan would still treat that
    slice as not in progress and add a feature to it with no warning on the confirm screen — the silent
    change this decision forbids.
  this_decision_does: 'On the person''s answer at the checkpoint, a test in test_update_plan_scripts.py
    ties /update-plan''s copy to find_serving_slice.py''s: it fails when the two lists differ. The list
    does not move. The test does not read persist_slice.py''s copy, which is /shape-slice''s own.'
  you_decide: nothing — you chose at the checkpoint to tie the two copies with a test in this change.
- point: Agents will not see this exception through memory until the rule is promoted, and memory's copy
    is already behind
  what_and_where: Phoenix memory, standards/rules/direct-model-write.md (the only tier that holds it,
    found with the memory tool's find --every-tier); its source core/components/memory/standards/rules/direct-model-write.md.
  detail: 'The memory tool''s copy still names the old plays: line 117 "Declared exception — `/intent`
    run by hand (ADR 031)" and line 123 "Declared exception — `/adr` run by hand (#632)"; the source names
    /discover-intent and /record-decision. The memory copy of the ontology is version 4; the source is
    version 14. #949 tracks Phoenix memory falling behind the source. The fix design (.garura/project/issues/720/specs/fix-design-round-3.md,
    "Order") says the rule is promoted after the merge, on the product owner''s word.'
  why_it_matters: Agents read rules only through the memory tool. Until promotion, an agent that checks
    /update-plan against the rule reads write-then-review with no /update-plan exception, and may report
    the session's order as a breach.
  this_decision_does: Nothing — promotion is a person's act, outside this decision.
  you_decide: Nothing now; the promotion is owed after the merge (#949).
- point: The confirm screen already cites this record before it is accepted
  what_and_where: core/components/memory/standards/templates/plan-update.md line 26 ("(ADR 058, ADR 062)"),
    with place_feature.py and render_screen.py's slice-in-progress lines — all uncommitted on plan/717/720-update-plan.
  detail: Part 2 of this decision is already built in the working tree. The template names "ADR 062",
    the number this record takes.
  why_it_matters: If this record is rejected, those lines name a record that does not exist and let /update-plan
    add a feature to a slice in progress with no decision behind it.
  this_decision_does: Nothing to those files.
  you_decide: Nothing if you accept; on a reject, those lines are taken out before the change lands.
