  it may add a feature to. It does not change the Business Intent kind. No page under .garura/product/product-os/intents/
  changes on this branch (git status and the diff against plan/717/base show none); link-model-part only
  checks that an intent page exists (link_part.py line 238) and writes the intent id on the feature's
  own spine entry.
