ice_impact: '/update-plan''s own ICE changes, through /edit-play: C2, F2 and S2 — uncommitted work stops
  the play on every branch, the plan''s own branch included; C5/C7 — the model is written only after "approved"
  (already so), and the shared scoped-write guard runs once after the last model write and before the
  one commit, putting back any model path outside the session''s parts (a new guarantee, with its failure
  condition and recovery); C11 — a new feature may join a slice in progress, and the confirm screen says
  so and names each epic past ready, with its status, as out of date (with a failure condition when it
  does not). /shape-slice''s ICE (C7, C20, F7, F20) and the author-slice skill do not change: a shaping
  run still never touches a slice in progress, and its edit option still may. No capability or feature
  ICE of the product changes, and the ICE kind does not change. Read from the play''s ICE source, a file
  this decision changes: the memory tool''s copy of the ontology (Phoenix memory, version 4) has no Plan
  or Slice kind; the source is version 14.'
business_intent_check: none
