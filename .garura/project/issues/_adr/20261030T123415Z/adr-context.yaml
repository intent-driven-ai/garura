supersedes: []
amends:
- adr: '026'
  file: docs/adr/026-direct-to-model-writes.md
  part: 'Decision, the write-then-review order and its "Consequent mechanics" line "Checkpoint cancel
    means git restore of the model paths ... Approve means proceed; the writes are already on disk and
    reviewable": for /update-plan, the model is written only after the person''s plain "approved" for
    the whole list; "rejected" and "abort" write nothing in the model, so there is nothing to revert.
    A declared exception, like /discover-intent''s (ADR 031) and /record-decision''s (#632). The rest
    of ADR 026 stands: containment by the shared scoped-write guard, and "Clean tree in, committed delta
    out" (the model delta is committed at close, in the session''s one commit on the plan''s branch).'
  why: ADR 026 is the authority of direct-model-write.md (its line 8). ADR 031 amended ADR 026 for the
    /discover-intent exception in the same way, so this exception is an amendment too.
- adr: 058
  file: docs/adr/058-an-edit-the-person-approves-may-change-a-slice-in-progress.md
  part: 'Decision §2, "An edit the person approves may change a slice in progress" — there the /shape-slice
    edit option is the only way a slice in progress changes: an /update-plan session the person approves
    may now also add a feature to a slice in progress (link-model-part, add_features only; no other part
    of the slice changes), and its confirm screen says the slice is in progress and names each epic past
    ready, with its status, as out of date, as §3 asks of the edit brief. And its ICE impact''s words
    "no other play''s ICE changes": /update-plan''s ICE changes (C11). §1 (a shaping run never touches
    a slice in progress) and §3 (the edit brief names the epic as out of date) stand.'
not_affected:
- adr: '061'
  why: Read in full. It decides who cuts a plan's branch (the play that starts the work, through plan_branch.py,
    main first) and what an abort undoes. It does not say in what order `go` checks uncommitted work against
    "stay". This decision makes the uncommitted check run on every path, the plan's own branch included;
    that adds a stop and changes no part of ADR 061's §1–§4. Related, not amended.
- adr: '031'
  why: Its exception for /discover-intent stands word for word; this decision adds a sibling exception
    in the same rule. Related.
- adr: '043'
  why: It amends ADR 026's "Clean tree in, committed delta out" inside a loop only. /update-plan is never
    run inside a loop (its SKILL.md has no loop contract). Not affected.
- adr: '044'
  why: Inside a loop only (link-model-gaps' apply_links.py). Not affected.
- adr: '052'
  why: 'Its rule "When the slice gains a feature, /shape-slice adds that feature''s entry" (line 31) still
    holds: /update-plan never writes the evals folder and names the hidden-file entry as owed (its C11).
    Not affected.'
- adr: 059
  why: Shares only play names (/discover-intent, /record-decision, /shape-slice); about the Discovery
    loop's knowledge step. Not affected.
- adr: '055'
  why: Installed parts read installed files; shares only play names. Not affected.
- adr: 048
  why: The two layers and the slice definition; nothing on who changes a slice in progress or on model
    writes. Not affected.
- adr: 049
  why: The order shape-slice, shape-plan, shape-eval; nothing on slices in progress. Not affected.
- adr: '057'
  why: The eval's form; not affected.
