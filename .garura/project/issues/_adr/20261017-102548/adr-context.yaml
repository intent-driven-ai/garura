supersedes: []        # none - every older ADR stays in force apart from the parts below

amends:
  - adr: "029"
    file: docs/adr/029-drives.md
    part: >-
      §5 "Every drive ends in a review" and Open Question 1 - the review is the drive's last step,
      not a drive of its own; it looks at the outcome (intents and product model), never the plays.
      This also settles how §2's "the plays' reviews happen after the drive ends" is done: the
      person answers the plays' review records through the outcome, not play by play.
    why: >-
      §5 says "How a finished drive is reviewed is still open; the review will likely be a drive of
      its own." The brief decides it, and rejects the drive-of-its-own option. Open Question 1
      (#617) is answered.
  - adr: "030"
    file: docs/adr/030-plan-mode.md
    part: >-
      §5, the bullet "Inside a drive, big updates are ... approved together at the drive's end
      review" - the plan is not shown in the review; the drive's big plan updates are marked
      approved when the person's answers are applied, in the same commit.
    why: >-
      The brief says "The plan is not reviewed there" and lists "big plan updates marked approved"
      among what the review step applies. ADR 030 §5 expected the person to approve them at the end
      review. §0 (the plan is the human's interface; the product model is written for the agents)
      is NOT changed - the plan stays the person's way to follow the work.
    note_for_person: >-
      The brief does not say whether the person sees the big plan updates at all before they are
      marked approved. The draft records only what the brief says; the person may want to confirm
      this at acceptance.
  - adr: "031"
    file: docs/adr/031-business-intent-and-ice.md
    part: >-
      §5 "No approval stop inside a drive" - the person confirms or drops the proposed intents in
      the intent review tool at the drive's last step, not "the review and the pull request at its
      end"; they may also send an intent back with a comment.
    why: >-
      ADR 031 §5 names the pull request as part of the place the intents are confirmed. The brief
      says the person reviews in two review tools, not on the pull request, which only lands the
      change. The rule that only a person confirms or drops a business intent is unchanged.
  - adr: "026"
    file: docs/adr/026-direct-to-model-writes.md
    part: >-
      Decision, "Review happens through the feature-branch git diff and the end-sequence PR" -
      inside a drive the person reviews the model writes in the two review tools, by meaning; the
      pull request only lands them. Write-then-review itself is kept.
    why: >-
      The brief: "The person reviews in two proper review tools, not on the pull request" and "a
      pull request shows changed lines, not what the product now says". The brief keeps ADR 026's
      write-then-review order on purpose (it rejects "never raise a limit before the review"
      because it would break it), so only where the review happens changes. Run by hand, a play's
      review is unchanged.

