  - adr: "028"
    why: >-
      The five loops; its only review mention is the change chain (start/commit/propose/review/
      merge-change), which still lands the change. ADR 029 already amended its loop recipe.
  - adr: "027"
    why: >-
      ICE/PCAM design and the IDSD row; the brief changes the idsd.md section on the plan and the
      product model, which ADR 027 does not decide.

affects:
  - path: docs/philosophy/idsd.md
    what: >-
      "The Plan Is the Human's Interface; the Product Model Is the Agent's" - the table row "not a
      human interface; only its ontology is" no longer holds: the product model is written for the
      agents and reviewed by the person at the end of each drive, at the outcome level; the
      ontology is the fixed structure, made once. The "two interfaces" paragraph (the output side)
      changes with it. Not an ADR.
  - path: core/components/memory/standards/rules/drive-contract.md
    what: >-
      §5 - the drive's review appends the person's real answer for each deferred learned checkpoint
      when the answers are applied (it says today: "how the drive's review does that belongs to the
      drive-review design (#617)"); §3 - the review records are read by the review step as
      background, not shown play by play.
  - path: core/components/memory/standards/rules/work-plan.md
    what: rule 15 - inside a drive, big updates are marked approved when the review's answers are applied.
  - path: core/components/memory/standards/rules/direct-model-write.md
    what: >-
      the /intent and /adr declared exceptions say "the drive's end review confirms/accepts" - that
      review is now the last step, in the review tools.
  - path: core/components/plays/understand/
    what: >-
      C8/C13 (reference/ice.md, SKILL.md) - the drive's review accepts or drops a box-move; a drop
      now lowers the limit back to the highest level the accepted needs still ask for, rejects the
      decision, and sends the capability back to /understand to fit or be cut. A send-back re-runs
      /understand for that one capability on the drive's branch. Its own steps stay as merged in
      #615 (decisions.md Q6).
  - path: core/components/plays/intent/
    what: >-
      Step 4 and C4 (SKILL.md, reference/ice.md) - "confirms or drops each at the drive's final
      review - the review and the pull request" becomes the intent review tool at the drive's last
      step; a send-back re-runs /intent for that one intent.
  - path: core/components/plays/vision/
    what: >-
      Step 6 - its review record is read by the review step; "a cancel at the drive's review"
      becomes a drop or a send-back of the pieces it wrote.
  - path: core/components/plays/play-creator/references/write_drive_review.py
    what: the review records it writes (decided false) are marked decided by the review step's one commit.
  - path: "the Kickoff drive (#613) - not built yet"
    what: runs the review as its last step. No file exists to name.
  - path: "the intent review tool and the product review tool - not built yet"
    what: new; local, on the person's machine (decisions.md Q7, drafts). #569's per-play viewer does not carry over; its comment-fix-approve loop does.

ice_impact: >-
  Changes the agent intents of the plays that run inside a drive: /intent (C4 and Step 4 - its
  proposed intents are confirmed or dropped in the intent review tool, and can be sent back so
  /intent re-runs for one intent); /understand (C8/C13 - a dropped box-move is undone by lowering
  the limit and sending the capability back; a send-back re-runs it for one capability); /vision
  (Step 6 / C11 - its deferred review record is answered through the outcome). The Kickoff drive's
  intent (#613, not built) gains the review as its last step. ICE as a kind (ontology v4,
  standards/schemas/product-os/ontology.md) does not change: an ICE is still workable only once its
  business intent is confirmed.

business_intent_check: none
business_intent_check_why: >-
  No person's business intent changes. The Business Intent kind (ontology v4) keeps its stages
  (proposed, confirmed, met, dropped) and its rule that only a person confirms or drops it; the
  decision changes only where the person does that (the intent review tool, not the pull request).
  "Send back" re-runs a play; it adds no stage. The idsd.md change is about the product model, not
  the Business Intent kind.
intents_dir_note: >-
  The intents dir named in the contract (.garura/product/product-os/intents) does not exist in
  this repo, so the guard can only check the Affects line for a product-os/intents/ path, not
  intent titles.

