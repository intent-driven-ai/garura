  search: >-
    Every ADR was searched for a rule on plan branches or on when a plan lands on main
    ("plan branch", "plan/<", "/base", "needs_plans", "lands on main", "detour", "main only").
    No ADR states one. The rule this decision replaces was never recorded in an ADR: it was
    written into the harness standard's principle 8 in commit b1c95fed (2026-10-22, #737/#738,
    the commit that also added ADR 046) and into merge-change's ICE (C9, F9, S6, S7) in commit
