  judgments:
    - adr: "030"
      verdict: not affected
      why: >-
        Plan mode: a plan on disk, its items, how it is kept current and how done is checked.
        It says nothing about branches or where a plan's work lands. §6 "the issue is done only
        when its plan is done" is about the done check, not about merging; this decision leaves it.
    - adr: "049"
      verdict: not affected
      why: >-
        One plan for each business intent, the eval in the plan's folder, the shaping loop. No
        branch or landing rule. The plan folder (.garura/project/plans/) and the plan file stay;
        only the hand-kept `branch` field's meaning on pause is now written down.
    - adr: "046"
      verdict: not affected
      why: >-
        Its decision is naming only (§1–§6). It lists docs/standards/harness-standard.md under
        Affects as new, because the standard was published with it, but principle 8 is not part
        of ADR 046's decision and no section of ADR 046 states it. The new ADR changes principle 8
        of the standard, not ADR 046.
    - adr: "048"
      verdict: not affected
      why: Two layers (model and work), Epic and Story. No branch rule.
    - adr: "056"
      verdict: not affected
      why: Issue type marks an Epic or Story. No branch rule.
    - adr: "053"
      verdict: not affected
      why: Drops shape-scope and shape-roadmap. Shares two files only.
    - adr: "035"
      verdict: not affected
      why: Agents work only from memory. Shares managing-work.md only.
    - adr: "043"
      verdict: not affected
      why: Kickoff plays read independently. Shares the ontology file only.
    - adr: "029"
      verdict: not affected
      why: >-
        §3: a drive (loop) opens one branch for its main issue and raises one PR. It does not say
        where that branch lands; the change plays decide that, and still do.
    - adr: "055"
      verdict: not affected
      why: Installed parts read only installed files. Shares the harness standard only (principle 11).
    - adr: "047"
      verdict: not affected
      why: The ICE is its own node. Shares the ontology file only.
    - adr: "033"
      verdict: not affected
      why: Approval in the product model. Shares the ontology file only.
    - adr: "052"
      verdict: not affected
      why: /shape-slice writes the hidden file. Shares the ontology file only.

