for_the_accepter:
  - point: No earlier ADR held the rule this one replaces, so it supersedes and amends nothing
    what_and_where: >-
      The rule "a plan lands on main only when every issue in it is closed, and after every plan
      it needs" — docs/standards/harness-standard.md principle 8, and merge-change's ICE C9, F9,
      S6 and S7 (core/components/plays/merge-change/reference/ice.md).
    detail: >-
      Every ADR in docs/adr/ was searched; none states a plan-branch or plan-landing rule. The rule
      came into principle 8 in commit b1c95fed on 2026-10-22 (#737, #738), the same commit that
      added ADR 046 — but ADR 046's decision is naming only, and it lists the harness standard
      under Affects just as a new file. The merge-change rule came in commit e55fe748 on
      2026-10-22 (#673). ADR 030 (plan mode) and ADR 049 (one plan for each business intent) say
      nothing about branches.
    why_it_matters: >-
      A reader who looks for the ADR this one replaces finds none, and could think an older ADR
      still says a plan waits until done. Whoever accepts needs to know the old rule was a
      standard's line and a play's ICE, not a recorded decision.
    this_decision_does: Records the rule for the first time; no older ADR gains a forward pointer.
    you_decide: Nothing, unless you hold that ADR 046 owns every principle of the harness standard; then say so and it becomes an amendment of ADR 046.


  - point: "Fixed in PR #950 — the work-management guide now says blocking work lands on main"
    what_and_where: >-
      .garura/user-provided/managing-work.md, the bullet "An Epic stands for one slice, and holds
      only that slice's work", lines 70–74.
    detail: >-
      The draft found lines 70–72 saying blocking work "merges back into the plan branch it spawned
      from" (#879), against the guide's new section (lines 160–177). They now read: it gets its own
      Epic and is delivered there; "It lands on main, not on the blocked plan's branch: the blocked
      plan pauses and merges into main first, and the blocker is cut from main".
    why_it_matters: >-
      The guide is read before any issue is filed or worked (CLAUDE.md, Work Tracking); the old
      lines sent blocking work to a plan branch, the landing target this decision drops (#791).
    this_decision_does: States the rule the fixed lines now follow.
    you_decide: "Nothing — the product owner fixed it in PR #950 (2026-10-29)."

  - point: "Fixed in PR #950 — plan 788's file no longer names a gone branch or a detour target"
    what_and_where: .garura/project/plans/788.yaml, the comment (lines 6–8) and `branch` (line 13).
    detail: >-
      The draft found `branch: plan/788/base`, `returns_to: 756` and a comment that plan 788 lands
      back into plan/756/base, though PR #916 had merged plan/788/base into main on 2026-10-27 and
      #791 was closed. The file now reads `branch: null`, has no `returns_to`, and its comment says
      the branch merged with PR #916 and is gone, with no detour plans. Keeping these facts right from
      now on is #730's (the plan update play), recorded there on 2026-10-29.
    why_it_matters: >-
      The plan file is the person's view of the plan (ADR 030 §0); a wrong branch or a promised
      detour landing misleads a reader or a later start-change run.
    this_decision_does: "Says what a paused plan's file reads (`branch: null`, no detour target)."
    you_decide: "Nothing — the product owner fixed it in PR #950 (2026-10-29)."

  - point: The ontology's landing rule leaves the ontology in this change, through /edit-ontology
    what_and_where: >-
      core/components/memory/standards/schemas/product-os/ontology.md line 599 (version 12), and
      the plan files .garura/project/plans/717.yaml lines 9–10 and 722.yaml line 5.
    detail: >-
      Line 599 reads: "A plan that needs another cannot land on main until that plan is done: the
      other plan has landed on main, or has been merged into this plan's branch." Plan 717 needs
      plan 722 (`needs_plans: [722]`), and plan 722 is `status: active`, not done, so PR #950 lands
      plan/717/base on main against that rule. The product owner, 2026-10-29: the line goes in this
      same change, through /edit-ontology. It does not belong in the ontology: the ontology says what
      a plan is and how it links; when a branch lands is a delivery rule, held by the harness
      standard (principle 8) and the plan rules in managing-work.md. The ontology's own line 598 says
      managing a plan never touches branches. The link "It needs another plan" stays, as the order of
      work, not a gate on landing.
    why_it_matters: >-
      Done in this change, the standard, the change plays and the ontology agree when PR #950 merges,
      and no agent or review reading the Plan kind finds plan 717 on main against its rule.
    this_decision_does: Removes line 599 in this change, through /edit-ontology (ontology version 13).
    you_decide: Nothing — decided by the product owner, 2026-10-29. The /edit-ontology run has its own three checkpoints.

  - point: "Later, #949 — the memory tool's copy of the ontology is eight versions behind and has no Plan kind"
    what_and_where: >-
      Phoenix memory, standards/schemas/product-os/ontology.md — the only tier that holds the
      ontology (find --every-tier).
    detail: >-
      The memory tool returns version 4 (205 lines) of the ontology. The source is version 12,
      updated 2026-10-25, and holds the Plan kind and its rules (lines 590–604); after this change it
      is version 13. The memory copy names "plan" only once (line 168). #949 (open) tracks Phoenix
      memory being behind the source in 60 places, the ontology among them.
    why_it_matters: >-
      Agents read the ontology only through the memory tool, so until #949 no agent sees the Plan
      rules, nor the removal of line 599.
    this_decision_does: Nothing — the gap is outside this decision.
    you_decide: "Nothing now — the product owner will do it later, in #949."

  - point: "Recorded on #730 — nothing writes a plan file's branch field yet; it is kept by hand"
    what_and_where: >-
      The `branch` field of each plan file in .garura/project/plans/; start-change's
      resolve_plan.py and setup_branch.py, merge-change's merge_pr.py; issue #730.
    detail: >-
      resolve_plan.py builds the branch name from the plan id and never reads or writes `branch`;
      merge_pr.py never writes the plan file. So `branch: null` on a pause, and the name on a new
      start, are written by hand; plan 788's file showed the drift. Plan 717's file (line 7) already
      reads `branch: null  # plan/717/base merges into main and is deleted on 2026-10-28` while PR
      #950 is open. The comment on #730 (2026-10-29) says the plan update writes `null` when a plan's
      branch lands and the new name when start-change cuts one, and removes a `returns_to` it finds.
    why_it_matters: >-
      Until #730 is built, each pause and start needs a hand edit, or the plan files and the branches
      drift apart; and plan 717's `null` is true only once PR #950 merges.
    this_decision_does: "States what the field reads on a pause (`null`); leaves writing it to #730."
    you_decide: "Nothing — recorded on #730 by the product owner."

  - point: Kept — start-change still brings main into a plan branch that exists
    what_and_where: >-
      core/components/plays/start-change/reference/ice.md C9 (lines 31–36) and S6 (lines 100–104).
    detail: >-
      C9 says that when a plan's branch already exists, "the latest main is merged into it before
      the issue's branch is cut (#731, Kapil 2026-10-22)"; S6 checks it. The option that lost is
      keeping a paused branch open; the merge of main into a running plan's branch stays, because a
      plan's branch now exists only while the plan runs.
    why_it_matters: >-
      A reader of the lost option could take it that start-change no longer brings main in, and
      remove C9's step. Without it, a running plan falls behind main between issues.
    this_decision_does: Keeps C9 and S6 of start-change as they are.
    you_decide: Nothing — the product owner kept it, 2026-10-29.

consequences_guidance:
