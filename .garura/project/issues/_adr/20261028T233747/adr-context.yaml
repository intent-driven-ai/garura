ice_impact: >-
  Three change plays' intents change in meaning. merge-change: a plan's branch (plan/<id>/base)
  lands on main like any approved change, with issues of the plan still open; holding it off main
  for open work is now a failure (F9, REC9); the only guard is the machine wall (C7: approved,
  mergeable, no failing required checks); the "plan done" check and its scenario S7 are gone.
  propose-change: S6, a pausing plan's own branch opens its PR against main. start-change: C9, a
  plan's branch is cut from the latest main when work starts, so after a pause the next start
  cuts a new one. The product ontology changes in this same change: /edit-ontology removes the Plan
  kind's landing rule (line 599). No product agent reads branches (the Plan kind's line 598:
  managing a plan never touches branches or code), so no product agent's ICE changes.

business_intent_check: none
business_intent_check_why: >-
  A framework rule about branches. Nothing under .garura/product/product-os/intents/ changes on
  this branch (git diff main...HEAD on that folder is empty). The one intent page that names
  branches, bi-717.md line 11, says its plan plays must not touch branches or code; this decision
  changes the change plays, not the plan plays, so that line still holds. Removing ontology line
  599 changes the Plan kind's rules (framework doctrine), not a person's intent; the declared check
  stays none, as the brief expects, because no intent page or Business Intent kind rule moves.

