ice_impact: >
  The ICE of /shape-scope and /shape-roadmap goes with the plays (each reference/ice.md is deleted).
  No other play's constraints, failure conditions or scenarios change in meaning. /discover-domains
  and /discover-capabilities keep their limits (they do not prioritise, flip a capability to active,
  or lock the profile); only the text that names /shape-scope as the owner of that work changes. The
  seven lens plays name /shape-scope in their ICE; they are stale (#855) and get a new ICE when rebuilt.
  /shape-slice's ICE does not change.

business_intent_check: none
business_intent_basis: >
  This drops two framework plays and two skills. It does not change the Business Intent kind or its
  rules. No page in .garura/product/product-os/intents/ names either play (grep, empty).

consequences_from_brief_and_sources:
  positive:
    - "The shaping flow has one way through: the three discovery plays, then /shape-slice, then the plan play and the eval play"
    - "No play writes order, effort, depends_on or status: planned onto /shape-slice's slice entries, which the slice check would fail (brief)"
    - "No validate script fails on /shape-slice's slice records (slice.yaml v2) (brief)"
    - "The product-os-keeper agent has two fewer skills to route to"
  negative:
    - "Persona and journey records lose their only writer; they wait for the lens rebuild (brief: ontology v11 has no Persona or Journey kind)"
    - "Keeper finding: /shape-scope was the only play that set a capability active and set the product profile locked (spine.yaml line 168, product-profile.yaml line 20, discover-capabilities rollup_box.py line 24). After this decision no play does. Who does it, if anyone, is not decided here"
    - "Older text that names the two plays must be removed in the same change, or a reader follows a link to a play that is gone; the seven stale lens plays keep their mention until rebuilt (#855)"

alternatives: # from the brief only
  - "Rebuild both for the shaping loop with /create-play — lost: /shape-slice and the plan do their jobs, and the fields they write are gone; a rebuild would have no job"
  - "Mark both stale, like the lens plays — lost: stale means 'rebuild later'; these two will not be rebuilt"
  - "Keep /shape-scope for personas and journeys only — lost: no current play reads them and ontology v11 has no kind for them; the lens rebuild decides where they live"

work_this_creates:
