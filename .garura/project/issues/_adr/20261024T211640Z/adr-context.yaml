ice_impact: >
  /check-change changes in its guarantees: C2 now says the check-knowledge shelf is read only
  through the memory tool (change-reviewer copies the playbooks into short-term memory); C10's
  fetch_pr_context.py names no memory folder; a new C12 says Layer 1 runs the installed tools
  (.garura/core/tools/lint-components/index.js --layout installed, .garura/core/tools/lint-play/lint_play.py),
  never the source, and records "not installed" for a missing tool, never a pass and never a halt;
  F13 and REC13 match it. /discover-intent and /shape-slice change in wording only: their Context and
  constraints point to installed places (the rebuild eval tool, the ontology through the memory
  tool, skills as installed siblings); no guarantee changes in meaning. Other plays get direct
  edits to path text that change no guarantee. The quality-auditor agent and the check-pr-quality
  skill change their contract values (the taxonomy is a short-term copy), not the contract's shape.
  The ICE kind does not change.

business_intent_check: none
business_intent_basis: >
  A framework decision on what an installed part may read and where the install lays the tools.
  It does not change the Business Intent kind or its rules. No page in
  .garura/product/product-os/intents/ names any part here. bi-734 (the harness standard) gains a
  principle that serves its outcome; its outcome, proof and must-not do not change.

consequences_from_brief_and_sources:
  positive:
    - "An installed part works in a product project, where core/ does not exist (brief, Why now)"
    - "One rule, checked by a linter in both layouts, so a new source path cannot land (brief part 6)"
    - "Every tool is laid once, so a play that runs a tool after the install finds it (brief, third option)"
  negative:
    - "The source-only exceptions are a named list; a new source-only part must be added to the list in installed-paths.js by hand, or the linter fails it (keeper finding: SOURCE_ONLY_PARTS and REPO_LAYOUT_FILES)"
    - "A tool fix reaches a project only on its next install (as ADR 038 said for the memory tool)"
    - "Codex users cannot install Garura until the Codex installer is redesigned (#863)"
    - "The machine-wide copy at ~/.garura/core/memory is still written, so 'no source, no memory folder' holds for installed parts but not yet for the install (brief part 8)"
    - "A tool's node_modules is laid whole, so the installed tools folder is large (tools_system.py)"

alternatives: # from the brief only
  - "Leave the source paths and rely on Garura's own repo — lost: every product project breaks after the install"
  - "Copy the source tree into every project — lost: the source is not what a project runs, and two copies drift"
  - "Install only the memory tool and skip the steps that need other tools — lost: plays use those tools after the install; a skipped step is a hidden gap"

work_this_creates:
  - "After acceptance: the forward pointer on ADR 039"
  - "Redesign the Codex installer (#863)"
  - "Stop writing ~/.garura/core/memory once the memory tool is fully live and Phoenix is the home of memory (brief part 8)"

