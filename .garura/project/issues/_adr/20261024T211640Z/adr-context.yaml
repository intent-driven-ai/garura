overlaps:   # adr.py overlaps on the brief -> no candidates (the brief is not an ADR); each ADR below read in full or at its install lines
  - adr: "039"
    file: docs/adr/039-memory-writes-go-to-short-term-memory-plays-read-no-memory.md
    verdict: amended in part
    parts:
      - "§5 'The .garura/ layout': the tree shows core/tools/ holding only memory/ ('the memory tool'). Now .garura/core/tools/ holds every tool the install lays, one folder for each (.garura/core/tools/<name>/); the memory tool stays at .garura/core/tools/memory/, and the play-reviewer prototype is never laid"
    stands: "the rest of §5 and every other section"
    not_amended_with_reason:
      - "§2 'A play is a pure workflow and reads no memory' and its line 'a skill reads only what its agent puts in short-term memory' — this ADR's part 2 says the same thing again for every installed part; no word of §2 changes"
      - "§9 'A block every play shares lives in one common file' (as amended by ADR 054) — 'the install lays the common file beside the plays' already means an installed pointer to an installed file; part 1 here follows it"
  - adr: "017"
    file: docs/adr/017-folder-whitelist.md
    verdict: not amended directly
    why: "ADR 039 §10 made 017 §1's whitelist 'part 5's tree'. The change to tools/ is made in ADR 039 §5, so a reader of 017 follows 039's pointer to this ADR. Same pattern ADR 054 used for 039 §9; no direct pointer on 017 is needed"
  - adr: "038"
    file: docs/adr/038-install-brings-no-memory.md
    verdict: not affected
    why: "§4 (as amended by ADR 039) puts the memory tool at .garura/core/tools/memory/ and says agents call the tool, never a path — this ADR keeps both. Its risk 'The old machine-wide copy is still laid' (~/.garura/core/memory) stays true; part 8 of the brief says the same, so nothing changes"
  - adr: "035"
    file: docs/adr/035-agents-work-only-from-memory.md
    verdict: not affected
    why: "§4 'Agents and skills never read or write memory by a path' (as amended by ADR 039) is what part 2 says again. §8 'Every install carries the memory system' (as amended by ADR 038) is not contradicted: the install now also lays the other tools, which adds to §8 and changes none of its words"
  - adr: "040"
    file: docs/adr/040-config-source-is-core-config-yaml.md
    verdict: not affected
    why: "§2 '.garura/ in the Garura repository is the installed copy, not source' — this ADR builds on it from the other side: the source is core/, and an installed part never reaches back into it. Related, not amended"
  - adr: "046"
    file: docs/adr/046-one-naming-standard-for-every-harness-part.md
    verdict: not affected
    why: "it names plays, loops, skills and agents. A tool folder (lint-play) is not one of these kinds, and no name changes. §2 'No tool built-ins' still lists Codex built-ins; the Codex installer stopping (#863) does not change the naming rule. docs/standards/harness-standard.md, which ADR 046 made, gains principle 11 — a new principle in the document, not a change to 046's decision. The ADR text uses only current names"
  - adr: "054"
    file: docs/adr/054-the-last-deprecated-parts-are-deleted-and-the-asking-rule-is-a-shared-skill-file.md
    verdict: not affected
    why: "§2 already says the parts that ask a person read the rule 'by its installed path _shared/asking-a-person.md, and never through the memory tool'. This ADR makes the same rule general for every installed part; no line of 054 changes"
  - adr: "009"
    file: docs/adr/009-skill-ltm-organizational-knowledge.md
    verdict: not affected
    why: "Rule 3 (LTM paths) is already amended by ADR 035 and ADR 039. Its line 'install-garura deploys LTM content to well-known paths' was judged in ADR 038 to get no pointer, because ADR 035 retired reading memory by a path; the same holds here"
  - adr: "021"
    file: docs/adr/021-status-resume-vs-evidence.md
    verdict: not affected
    why: "the install lays an ignore rule and records it in the manifest; nothing here changes it"
  - adr: "041, 045, 050, 053"
    verdict: not affected
    why: "each names the installer only as a file a rename or deletion touched; no decision about the install layout"

