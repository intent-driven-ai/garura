supersedes:
  - adr: "015"
    file: docs/adr/015-ltm-resolution-protocol.md
    part: >-
      in part — the resolution protocol (R1–R4): its three layers (project LTM, core LTM, then
      the model's own reasoning as a flagged fallback); the `ltm_context` input and the
      resolution trace built on it; the agent and play updates that use them; and the learning
      play's model of promoting the model's guesses into memory afterwards. Its Knowledge File
      Standard (core/components/memory/standards/templates/knowledge-file.md) stands.
    why: >-
      The brief rejects "Keep ADR 015 (R1–R4 with a model fallback that /learn promotes later)".
      Memory is now three tiers read through one tool, and nothing comes from the model without
      an approved memory update first. The Knowledge File Standard is a content template the
      brief does not touch, and it is still in use, so a full supersede would leave it with no
      decision behind it. (The learning-play part is already gone in practice: /learn today
      updates the product model from outcomes, and the knowledge-extractor agent no longer
      exists — core/components/plays/learn/SKILL.md.)

amends:
  - adr: "034"
    file: docs/adr/034-plays-answer-from-memory-inside-a-drive.md
    part: >-
      §2 "What counts as memory": the list becomes the three tiers (short-term, project, Phoenix
      memory), read through the memory tool, with the git repository, the product model and the
      intents; §3 "Never from the model alone": when no tier answers, the agent raises a memory
      update a person approves, written to memory first, and decides from memory — never from
      the model or the web; §6 "Run by hand, a play is unchanged" no longer holds for where an
      agent's answers come from — the memory rule applies by hand and inside a drive.
    why: >-
      Kapil's words in the brief are general ("agents work within the realm of global memory …
      The system should work only within the memory"), not limited to drives. §4 (every answer
      names its source) stands and is widened to every decision. The memory review found two of
      §2's five items cannot answer (the learned checkpoint answers hold verdicts, and the
      prototype's sources are never read again) — whether the learned checkpoint answers stay on
      the list is NOT decided by the brief; flag it as open.
  - adr: "009"
    file: docs/adr/009-skill-ltm-organizational-knowledge.md
    part: >-
      Rule 3 "LTM paths are stable conventions … treated as API contracts", with its "LTM
      Reference Paths" and "Skill Reference Pattern" (load from `~/.garura/core/memory/…`):
      skills find organisational standards through the memory tool, never by a path. Rules 1,
      2, 4 and 5 stand (behaviour embedded; standards in memory; failure is loud; no duplication).
  - adr: "016"
    file: docs/adr/016-agent-json-contract.md
    part: >-
      the optional `ltm_context` input field, the `resolution_trace_path` output field, and the
      "Resolution Protocol Hook" section: they rest on ADR 015's R1–R4. Agents get memory from
      the tool, not from paths passed in the contract; how each answer's source is recorded is
      settled in plan item 6. ADR 016 itself says "Any change requires a new ADR".
  - adr: "017"
    file: docs/adr/017-folder-whitelist.md
    part: >-
      §1's `.garura/core/` entry ("framework state (config, synced memory)") and §2's line that
      `.garura/core/memory/` stays a gitignored synced copy: a project no longer holds a copy of
      all memory; it holds the subset it pulled from Phoenix memory, with a short list of what
      it pulled and from which version. Where in `.garura/` that lives is settled in plan item 3.
  - adr: "032"
    file: docs/adr/032-drive-review-of-outcomes.md
    part: >-
      §3 "Two review tools": the review tool (one app with Intents and Product views —
      .garura/project/issues/617/specs/review-tool.md) gains a third view, Memory: what each tier
      holds, the memory updates waiting for a person, and which memory each decision came from.
    why: >-
      Judgment call. ADR 032 §3 names exactly two tools; a reader of it would miss the memory
      view. Its review of a drive's outcome is otherwise unchanged.

