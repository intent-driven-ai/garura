ice_impact: >-
  The agent intents of every play whose agents read memory change, each through its ICE source
  and /play-editor: their agents find and update memory only through the memory tool; when no
  tier answers they raise a memory update instead of falling back to the model or the web; and
  every decision names the memory it came from. First /intent, /vision and /understand (plan
  item 8): the lines ADR 034 changed — /intent C4, C5 and Step 3, /vision C11, /understand C13 —
  now read "memory" as the three tiers, and "ask the person" as a memory update the person
  approves; /vision's knowledge-base proposal, which rests on web research today, becomes a
  memory update. /fix-bug stops passing `ltm_context`. Then every other play and agent (plan
  item 10), including tech-designer and the research-domain-context skill, which fall back to
  the web or the model today. The Standard Play Close is shared scaffolding, not intent. The ICE
  kind does not change: an ICE's Context is still assembled from memory.

business_intent_check: none
business_intent_check_reason: >-
  A framework decision on where agents find memory and what they may do when memory holds
  nothing. No person's business intent changes. The Business Intent kind and its rules stand:
  only a person confirms or drops one (ADR 031). Affects names no business intent page.

related: "ADR 029 (drives), ADR 031 (business intent and ICE), ADR 033 (approval in the product model), ADR 008 (issue-centric STM), ADR 011 (STM as inter-skill transport), ADR 001 (three-layer hierarchy), #653, #654, #613 (Kickoff), #606, #641–#644 (review tool)"

