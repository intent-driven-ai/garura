overlaps:
  - adr: "032"
    file: docs/adr/032-drive-review-of-outcomes.md
    verdict: amended
    part: >-
      §5 "The answers are applied as one commit" — "statuses are set" becomes a lasting approval
      written on each piece (approved, with the fingerprint of its words, who, when and in which
      review; or in progress after a send-back), and it lasts after the drive. §2/§3 — what the
      tools show: the whole model's approval state every time they open, not only at a drive's
      end; a drive's end review is that same view narrowed to what the drive changed. §4's send
      back now leaves the piece "in progress" until the new version is answered.
    not_changed: "§1 (review is the drive's last step), §4 accept/drop/send back, §6 failed drive, §7 box-move drop, §8 (the product model is reviewed) all stand."
  - adr: "031"
    file: docs/adr/031-business-intent-and-ice.md
    verdict: amended
    part: >-
      §4 "ICE is worked on only when its intent is confirmed" — widened: an ICE is workable only
      when the ICE itself is approved and its business intent is approved (confirmed), and the
      node it sits on (capability, functionality) is approved; approval follows links. Still
      worked out from the model (state + fingerprint + links), not a stored "workable" flag, so
      §4's reason and the rejected "stored workable status" alternative still hold.
    relied_on: >-
      §2 "No play owns a kind" — any play writes any kind; a rule stops work, never a write. This
      ADR keeps that and builds on it (a write is never blocked; it moves the piece to changed).
      §1 "only a person confirms or drops a business intent" — kept. §5 run-by-hand /intent
      pinned confirm — not decided by the brief (see open_points).
  - adr: "026"
    file: docs/adr/026-direct-to-model-writes.md
    verdict: not affected (relied on)
    why: >-
      Write-then-review stands: plays still write the model directly and are reviewed after.
      This ADR adds what the review leaves behind in the model (a lasting approval state) and
      that a write moves a piece to changed. 026's review-through-the-PR part was already
      amended by ADR 032; nothing new in 026's text changes.
  - adr: "029"
    file: docs/adr/029-drives.md
    verdict: not affected (relied on)
    why: >-
      §2 (plays' reviews after the drive) and §5 (every drive ends in a review) were already
      answered by ADR 032. This ADR changes what that review records, through 032, not 029.
  - adr: "030"
    file: docs/adr/030-plan-mode.md
    verdict: not affected
    why: "The plan is not part of the product model; its big-update approval is untouched."
