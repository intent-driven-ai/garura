# --- ICE impact (from the ontology: ICE kind, rule at ontology.md line 168; ADR 031 §4)
ice_impact: >-
  Every agent intent's workability changes. Today an ICE is workable when its node names at least
  one confirmed business intent. After this ADR an agent may take an ICE only when the ICE itself
  is approved, the capability or functionality it sits on is approved, and the business intent it
  is built from is approved (confirmed). A play that rewrites an approved ICE or node moves it to
  changed, and no agent builds from it until a person approves it again. The plays that check
  workability (/intent's check_ice_workable.py and every play that works on ICE) read the approval
  state. The ICE kind keeps its shape (goal, constraints, failure conditions); it gains the
  approval state every piece carries.

# --- Business-intent check
business_intent_check: kind
business_intent_check_reason: >-
  It changes the Business Intent KIND's rules in the ontology (framework doctrine): its stage
  'confirmed' is mapped to approved, it gains the fingerprint/approved-by/when/which-review fields,
  and its rule "work starts only from an ICE built from a confirmed business intent" is widened.
  No person's business intent changes; only a person still confirms or drops one. Nothing under
  product-os/intents/ is written (the intents folder does not exist in this repo).

# --- Open points the brief does not settle (named, not decided — do not invent an answer)
open_points:
  - >-
    The brief says only the review step writes approval. Three places let a person approve
    outside it today: /intent run by hand confirms an intent at its pinned gate (ADR 031 §5,
    direct-model-write.md); /adr run by hand accepts a decision on the person's typed word
    (direct-model-write.md); /shape sets capabilities active (spine.yaml fill_rules). How these
    record approval (fingerprint, who, when) is not in the brief. Draft names it as a risk and
    as work, to be settled when the lifecycle is built (#597); it does not decide it.
  - "Who drops a piece is unchanged: a dropped piece leaves the model; git and the review keep the record."

related: "ADR 032, ADR 031, ADR 026, ADR 029, #597 (product ontology), #613 (Kickoff), #617, #637"

