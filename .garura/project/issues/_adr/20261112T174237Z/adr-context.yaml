person_answers_as_rules:
  - "1. Capability done is a question asked when needed, never stored: done when every one of its features is Completed or Dropped. Nothing is written on the capability. The ready check and 'needs' use it. Ontology lines 398, 417, Q10 line 58 and line 558 change wording only."
  - "2. A Dropped feature stays out of every new slice and plan until a person brings it back, in /reshape-plan, which sets it Unplanned. When a Completed feature's Feature issue is opened again, /reshape-plan sets it back to In progress."
  - "3. The play that takes a feature into a plan sets Planned: /shape-plan when it makes the plan, /reshape-plan when it adds a feature later."
  - "4. Starting a Feature issue, a Story inside it, or a Bug or Spike under that Story moves Planned to In progress. A Chore under the plan's epic and starting a plan change nothing. A Completed feature stays Completed. On an Unplanned feature /start-work says so, goes on only on the person's yes, and records that the work started with no plan; it never blocks."
  - "5. The state is written on the work's branch, like every model write; main shows it when the work lands."
  - "6. The clean-up drafts the list of old features to mark Completed from the old Stories (a Story closed as completed means its feature is Completed). The person confirms the whole list in one review before anything is written."
  - "7. The old spine field `status` (proposed | active | deprecated) is removed from every domain, capability and feature entry and from the spine schema; link-model-part stops writing it. The feature's state takes the name `status`, with the five values."

