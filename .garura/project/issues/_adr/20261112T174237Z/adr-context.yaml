ice_impact: >-
  /shape-plan (C3, D1): leaves out Completed and Dropped features, read from the model; sets Planned.
  /start-work: new constraint, failure and scenario for Planned to In progress, the Unplanned
  question and its record, and no change on a Chore or a plan start. merge-work: Completed on a
  Feature issue closed as completed. /reshape-plan (C7, C8, C11): finish, drop, bring back, reopen,
  Planned on add. /design-slice (C6, C7): built and dropped read from the model; Unplanned on add;
  persist_fills.py stops writing the old status. /specify-capabilities: Unplanned on add; the old
  status goes. learn-outcomes (source only), through /fix-play when next built: it no longer
  writes the old status. link-model-part and product-os-keeper follow. The ICE kind's ready check
  changes wording only, through /specify-ontology. No capability or feature ICE of the product changes.

business_intent_check: none

for_the_accepter_open:
  - point: "learn-outcomes writes the old status field, which the person's seventh answer removes"
    what_and_where: >-
      core/components/plays/learn-outcomes/ (in the source, not installed): scripts/persist_learn.py
      line 16 ("capability/feature `status` (earned promotion)") and lines 117 to 118 (node["status"]
      = c.get("to")); scripts/validate_learn.py line 40 (EARNED = {"active", "validated",
      "delivered"}) and lines 110 to 116.
    detail: >-
      The seventh answer says "Nothing reads it". The installed plays do not, but learn-outcomes
      moves a capability's or a feature's `status` to active, validated or delivered. With the old
      field gone, and the feature's `status` holding the five new values, it would write a value the
      new field does not allow, and on a capability, a field that no longer exists.
    why_it_matters: >-
      When learn-outcomes is next built, it breaks the new rule unless its writes change. Nothing
      runs it today, so no model is harmed now.
    this_decision_does: "It names learn-outcomes under Affects and in Work This Creates."
    you_decide: >-
      What learn-outcomes does instead, when it is next built: write nothing on the state, or
      record what it learns elsewhere. Nothing is needed now.

