amends:
  - adr: "069"
    part: >-
      Decision §2, third bullet, the words "and no part of the model holds a work status": each
      feature holds its own state, named `status`, one of five. No other part holds one, and the
      spine still has no `epics` list. The rest of §2 stands (the model names no plan, epic,
      tracker issue or decision record, and the state names none). §5 stands (whether a slice is
      in progress is read from the plan files).
  - adr: "068"
    part: >-
      Decision §5, "When a feature is built (its Feature issue is closed)": a feature is built when
      its state in the model is Completed. It becomes Completed when its Feature issue closes as
      completed, and once, through the clean-up the person confirms, for a feature built before
      ADR 068. "Closing a Feature issue is a person's call, made through /reshape-plan finish",
      "every slice and plan that holds it counts it as complete" and "no roll-up, ADR 064 stands"
      stand. Also its ICE impact for /design-slice C6 and C7, "it reads each feature's Feature
      issue state through the tracker tool": it reads the feature's state from the model. §4's
      rule stands, and a Dropped feature is also left out. §1 to §4 and §6 stand.

