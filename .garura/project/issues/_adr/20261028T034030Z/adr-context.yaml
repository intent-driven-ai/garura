ice_impact: >
  Agent intents change for the Discovery loop, the knowledge-builder agent and the adr-keeper agent. The loop's C5 stops naming
  /search-knowledge and /research-knowledge: before it asks, the loop runs one step that closes the open questions
  (an intent change, through /edit-loop). The knowledge-builder agent gets one contract for the whole step: it merges
  nothing itself (group_questions.py does), answers from the loop's sources (find-answers-in-sources), looks in memory
  through the memory tool (search, find, read, cite), has author-knowledge-page draft a researched page and raises it
  with the tool's propose, has propose-answers draft what only the person can confirm, and has author-knowledge-brief
  write the knowledge brief. author-knowledge-page stops calling the memory tool. The three plays' own ICE go with
  them. create-loop compiles every new loop with the step and no member plays. propose-answers is unchanged for
  /shape-slice. The adr-keeper agent also gathers the points for the person who accepts a record and reaches memory only
