# ---------------------------------------------------------------------------
supersedes:
  - id: "042"
    file: docs/adr/042-a-drive-finds-builds-and-reviews-the-knowledge-it-lacks.md
    part: full
    why: >
      ADR 042 §1 made the knowledge step three member plays. The product owner calls that a bug and
      retires the record. Because a full supersede ends everything ADR 042 decided, the new ADR must
      carry forward, in its own words, the parts that still hold: §2 the person gets a brief, never a
      questionnaire (at most seven gaps, settled points shown with why, waiting pages listed with a
      recommendation, "yes" or corrections by id); §3 the loop shows the brief, records the reply into the
      issue's short-term memory (from: person) and records each page decision through the memory tool's
      `decide`; §4 memory only through the memory tool, with the one read-only `updates` exception for a
      script. It also carries forward ADR 042's amendment of ADR 041 §5 (a brief, not a questionnaire) and
      of ADR 039 §2 / §10 (the exception), now restated below as this ADR's own amendments.
    keeps_in_substance: ["§2 the brief", "§3 show the brief and record the reply", "§4 memory only through the tool"]
amends:
  - id: "041"
    file: docs/adr/041-a-drive-runs-in-rounds-and-owns-its-questions.md
    part: >
      §3 "Before it asks, the drive builds the memory it lacks" (as amended by ADR 042): the work is one
      step of the loop, run by the knowledge-builder agent with skills, the memory tool and the loop's
      scripts, not member plays · §4 "Member plays" (as amended by ADR 042 and, per its pointer, ADR 043):
      a loop has no member plays; the knowledge step is a step of the loop; the change plays a loop runs
      stay as they are · §5 "The person's questions, when they come" (as amended by ADR 042): restated
      here — the person gets the knowledge brief, never a questionnaire
    note: >
      With no member plays left, ADR 041's own amendment of ADR 029 §4 ("holds for work plays, not member
      plays") no longer has anything to exempt; ADR 029 §4 holds for every play a loop runs. Say this; it
      is not a new amendment of ADR 029. ADR 041's Status line says ADR 043 amended §4 to make "the connect
      step a member play too", but ADR 043's own body runs the connect step as two skills
      (find-model-gaps, close-model-gaps), never a play; after this ADR no step of a loop is a member play.
  - id: "039"
    file: docs/adr/039-memory-writes-go-to-short-term-memory-plays-read-no-memory.md
    part: >
      §2 "A play is a pure workflow and reads no memory" and §10's line on ADR 035 §4 ("only agents call the
      tool"), as amended by ADR 042: the one read-only exception — a script may ask the memory tool's
      `updates` for the issue's waiting memory updates — passes from "a knowledge play's own check script"
      to the Discovery loop's scripts `check_knowledge.py` and `round_state.py` (round_state.py stops
      reading memory-update files by path). The rest of §2 stands and is now kept: no skill calls the
      memory tool (author-knowledge-page stops calling `propose`; the agent raises the page).
    why: >
      ADR 042 is superseded in full, so the exception it gave would lapse; the design keeps it (the check
      script lists waiting updates "read-only, as ADR 042 allows") and adds round_state.py (it "asks the
      memory tool (updates)"). A reader of ADR 039 must find who may call the tool.
  - id: "044"
    file: docs/adr/044-the-shared-drive-run-owns-the-steps-between-plays.md
    part: >
      §1 "The Shared Drive Run owns the steps between plays" (as renamed by ADR 045): its list of run steps
      gains the knowledge step (R5c: close the open questions; R5b: show the knowledge brief and record the
      reply). It is a run step, not a product rule, so §1's rule that a loop carries no product rules of its
      own stands.
    why: >
      §1 names R3, R4b and R5 as the steps the Shared Loop Run owns. The knowledge step was then run by
      member plays; now loop-run.md runs it itself (agent + skills + loop scripts stamped into every loop by
      create-loop). A reader of ADR 044 alone would think the shared run owns only three steps.
  - id: "046"
    file: docs/adr/046-one-naming-standard-for-every-harness-part.md
    part: >
      §4 "Plays take the verb of what they do", the clause "knowledge plays `search`, `research`, `check`":
      there are no knowledge plays. `check` stays a change-play verb (check-change); `search` and
      `research` are no longer play verbs. The skill verb `research` (§5) stands.
    why: naming.md line 49 and naming.yaml lines 15, 23, 24 teach the clause; they change with it.

