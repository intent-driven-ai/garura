  positive:
    - "One agent dispatch per round for the step, one check, one place a failure points to."
    - "The done-record mismatch goes with its cause."
    - "Every memory call is the agent's or a named read-only script's; no skill calls the tool."
    - "Agents reading Phoenix memory learn the real shape once the pages are promoted."
    - "A person accepting a record sees each thing found on the way in full, in one place, with what they decide."
  negative:
    - "Until the corrected pages are promoted, agents in this project still read the old shape from Phoenix memory and cannot find loop-contract.md, naming.md, naming.yaml or rename-map.yaml."
    - "Two scripts now call the memory tool's read-only updates, where ADR 042 allowed one; the exception must stay read-only."
    - "One step does more; its check (check_knowledge.py) must catch what three plays' checks caught. A failure is sent back at most twice."
    - "An installed project keeps the three plays until its next install retires them."
    - "propose-answers says it drafts from memory, but in this flow it is handed no memory (in the design, redesign.md line 48; not fixed here)."
    - "Until the ADR template is promoted, /record-decision hands its agents the old Phoenix copy, which has no section for the accepter."

