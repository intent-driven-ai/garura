# The bug, and the memory it left wrong (the brief's own "Why now": stays in Context)
# ---------------------------------------------------------------------------
bug:
  statement: >
    ADR 042 introduced a bug: it made one agent's job three member plays that no person runs. Found under #920:
  findings:
    - "Three pre-flights, loop-contract checks, stop conditions and closes per round, for one agent's job."
    - "Two plays write their done record under old names, so the loop's done check cannot find them:
       core/components/plays/research-knowledge/SKILL.md line 148 writes status/stop-condition-build-knowledge.yaml;
       core/components/plays/check-knowledge/SKILL.md line 160 writes status/stop-condition-review-knowledge.yaml."
    - "The research skill calls the memory tool itself, against ADR 039 §2:
       core/components/skills/author-knowledge-page/SKILL.md lines 23 and 36 (`memory_tool`, `propose`)."
    - "core/components/loops/complete-discovery/scripts/round_state.py line 58 reads
       <issue>/review/memory-updates/*.json by path (ADR 042 left this as follow-up work)."
    - "The memory search duplicated the memory tool."
  memory_left_wrong:
    why_it_matters: >
      This project holds no memory of its own (ADR 038; no `initialize` yet), so its agents read Phoenix memory
      (one copy on each machine, ~/.phoenix/core/memory). What Phoenix memory says is what the agents decide from.
      The memory tool reports Phoenix memory's version as 23387be24c0d.
    phoenix_pages_teaching_the_old_shape:   # all read through the memory tool, read --tier phoenix, 2026-10-28
      - page: standards/rules/pipeline-next.md
        fingerprint: "sha256:dd5e92bef37a1..."
        lines: "21 (the Discovery loop's knowledge member plays); 76-79 ('# Loop members (run by a loop inside its rounds, never on their own)': search-knowledge, research-knowledge, check-knowledge)"
      - page: standards/rules/_index.md
        fingerprint: "sha256:e8e2f86dba666..."
        lines: "56 (the loop-contract row: the loop 'runs its knowledge plays'); 13-15 list naming.md, naming.yaml, rename-map.yaml and 56 lists loop-contract.md, none of which Phoenix memory holds"
      - page: standards/rules/pipeline-position.md
        note: "speaks of 'member plays'; detail in for_the_accepter point 1"
    missing_from_phoenix:                    # memory tool: find --every-tier, no tier answers (2026-10-28)
      - standards/rules/loop-contract.md     # exists in core/components/memory/standards/rules/
      - standards/rules/naming.md
      - standards/rules/rename-map.yaml
      - standards/rules/naming.yaml          # beyond the brief: for_the_accepter point 7
    garura_product_model: ".garura/product/product-os/features/fn-744/feature.md line 4 names the knowledge plays (build-knowledge → research-knowledge, review-knowledge → check-knowledge)."
    correction_path: >
      Correct the pages in core/components/memory/standards/ (rules/ and templates/adr.md), then promote them to Phoenix
      memory, a person's deliberate act after this change merges (ADR 039 §1). This ADR names the pages; it does not promote them.

# ---------------------------------------------------------------------------
# For the person who accepts this (the person's change, 2026-10-28): every point found on the way,
# moved OUT of Context into the section "## For the Person Who Accepts This", right after Context.
# Points 1-3 confirmed through the memory tool (read --tier phoenix; find --every-tier) on 2026-10-28.
# ---------------------------------------------------------------------------
for_the_accepter:
  - point: "Phoenix memory's page on where a play sits in the pipeline is older than Garura's, and teaches names that no longer exist"
    what_and_where: >
      The rule page `standards/rules/pipeline-position.md` in Phoenix memory (memory tool: tier phoenix, version 23387be24c0d,
      fingerprint sha256:8d332a3c4b3c…), against Garura's source copy `core/components/memory/standards/rules/pipeline-position.md`
      (last changed in this repository on 2026-10-24, commit bf570ece). The brief dates the Phoenix copy to 2026-10-20; the memory
      tool reports the tier's version, not a date for one page.
    detail: >
      The Phoenix copy calls the play builder `play-creator` (lines 4, 5, 31, 34 and on; it is now `/create-play`). It names the
      review step of the end sequence `review-change` (lines 35, 50, 70, 71, 118; it is now `/check-change`). It lists the plays by
      their old names (lines 11-14: `/vision`, `/understand`, `/measure`, `/grill`, `/learn`, `/refactor`, `/intent`, `/adr`, `/arch`,
      `/ux`, `/implement`, `/roadmap`, `/marketing`, `/run`, `/launch`, `/shape`, `/agentic`, `/quality`, `/validate`, `/deploy`,
      `/next`, `/focus`). It says "drive" and points to `drive-contract.md` (lines 15-17, 120) and `check_drive_contract.py`
      (line 19). The source copy has the new names throughout (`create-play`, `check-change`, `/discover-intent`, `/record-decision`,
      "loop", `loop-contract.md`, `check_loop_contract.py`). Separately, both copies use "members" (lines 47-56 in Phoenix) for the six
      change plays a play's position brings in (`start-change` and the four end plays). That is a different meaning from the
      knowledge "member plays" this decision removes.
    why_it_matters: >
      Every agent in this project reads this page from Phoenix memory, because the project has no memory of its own. A play built
      from it gets an end sequence whose third step, `review-change`, no longer exists, so the built play cannot land its change.
      An agent that looks up a play by the names on this page finds nothing.
    this_decision_does: >
      Promotes Garura's source copy to Phoenix memory (part 6), with its wording checked so that "member" reads only as the six
      change plays. It keeps that meaning of "members"; it retires only the knowledge member plays.
    you_decide: "Nothing beyond accepting this record."
  - point: "Phoenix memory holds the loop contract only under its old name, the drive contract"
    what_and_where: >
      The rule page `standards/rules/drive-contract.md` in Phoenix memory (memory tool: tier phoenix, version 23387be24c0d,
      fingerprint sha256:32588ee0ef37…). No tier holds `standards/rules/loop-contract.md` (memory tool: find --every-tier, no match).
      Garura's source has `core/components/memory/standards/rules/loop-contract.md`. The brief dates the Phoenix page to 2026-10-20.
    detail: >
      `drive-contract.md` opens "# Drive Contract … A drive is a run of plays that keeps going until its goal is met" (lines 1-6).
      ADR 045 renamed the drive to the loop and this page to the loop contract in Garura's source; the rename did not reach Phoenix
      memory. The page still says `/build-memory` "builds the memory it lacks before it asks" (lines 124-125), the one play ADR 042 split into three.
    why_it_matters: >
      An agent that looks up the loop contract through the memory tool finds nothing, or, by a search for the contract's words,
      the old drive version, which teaches drives, `/build-memory` and old field names. The loop and the plays that run inside it
      depend on that contract.
    this_decision_does: >
      Adds `loop-contract.md` to Phoenix memory by promotion (part 6), after its lines 131-132, which cite ADR 042's member plays,
      are corrected in the source.
    you_decide: "Whether `standards/rules/drive-contract.md` is deleted from Phoenix memory when `loop-contract.md` is promoted. Left there, a search can still find the old drive version."
  - point: "Phoenix memory's ADR template, which every decision record is drafted from, is older than Garura's"
    what_and_where: >
      The template `standards/templates/adr.md` in Phoenix memory (memory tool: tier phoenix, version 23387be24c0d, fingerprint
      sha256:8be7c19d1725…), against Garura's source copy `core/components/memory/standards/templates/adr.md`. The copy this run of
      `/record-decision` was handed (`.garura/project/issues/_adr/20261028T034030Z/context/templates/standards/templates/adr.md`)
      is the Phoenix copy.
    detail: >
      The Phoenix copy names the play `/adr` and the skill `author-adr` (lines 12, 52; now `/record-decision` and `author-decision`).
      It says "Inside a drive … at the drive's final review" (line 57). It offers the level `functionality` (lines 26, 69, 122; now
      `feature`). Its example names `/intent`, `/vision`, "Kickoff" and `play-creator` (lines 154-156). It has no section for the
      person who accepts the record: that section and its rule are new in the source copy on this branch, made under this change.
    why_it_matters: >
      Every ADR, in this project and in any project that reads Phoenix memory, is drafted from this template. Drafted from the old
      copy, a record names plays that are gone, can take a level the model no longer has, and has no place to tell the person who
      accepts it what was found on the way. This record itself was handed the old copy; the new section was taken from the source.
    this_decision_does: "Adds the ADR template to the pages promoted to Phoenix memory (part 6); the source copy already has the new names and the new section (part 7)."
    you_decide: "Nothing beyond accepting this record."
  - point: "Garura's source memory and Phoenix memory differ far beyond the pages this decision touches"
    what_and_where: "Garura's source memory (`core/components/memory/`) against Phoenix memory, as a whole."
    detail: >
      Counted on 2026-10-28: 49 pages differ between the two, 7 pages are in the source only, and 16 are in Phoenix memory only.
      These counts come from the comparison named in point 5, which read the files by their paths; they have not been counted
      again through the memory tool.
    why_it_matters: >
      Each differing page is a place where the agents of this project may decide from an older rule than the one Garura is built
      with, the same way as points 1 to 3.
    this_decision_does: >
      Fixes only the pages it touches: `_index.md`, `pipeline-next.md`, `pipeline-position.md`, `loop-contract.md`, `naming.md`,
      `naming.yaml`, `rename-map.yaml` and the ADR template. The rest is #921 ("Phoenix memory stays up to date as Garura is built,
      and is versioned per release with its own release notes"), which serves business intent #899 ("A person works across
      Garura's repositories in one change: the source, Phoenix memory and the projects stay in step").
    you_decide: "Nothing here; #921 takes the rest. When #921 is worked, the counts should be taken again through the memory tool."
  - point: "The ADR keeper agent broke the memory rule while drafting this record"
    what_and_where: >
      The `adr-keeper` agent (`core/components/agents/adr-keeper.md`), in the first draft of this record on 2026-10-28, run by hand
      inside #920. The rule is `.claude/rules/garura-memory.md`.
    detail: >
      The agent listed and compared files inside the `phoenix-memory` repository by their paths. The rule says: "You find it only
      through the memory tool, run from the project's root folder. Never read a memory file by its path." The agent then checked
      again, through the memory tool, every fact it used; in this round, points 1 to 3 were read through the tool (`read --tier
      phoenix`, `find --every-tier`), with the fingerprints given above. The counts in point 4 are the one thing that still rests
      on the path comparison.
    why_it_matters: >
      The memory tool gives each answer its tier and its fingerprint, so a decision can cite what it rests on (`cite`) and a later
      check can say when that source changed (`citations --check`). A read by path skips that: nothing records which tier said what,
      and nothing flags it when the page changes.
    this_decision_does: >
      Fixes the agent. `core/components/agents/adr-keeper.md` now says how to find and compare pages through the tool (`find
      --tier`, `--every-tier`, `read --tier`), treats Garura's source memory as repository files, and forbids reading, listing or
      comparing memory by its path in any tier (part 7).
    you_decide: "Nothing beyond accepting this record."
  - point: "ADR 041's status line says the connect step is a member play; ADR 043 itself says it is not"
    what_and_where: "The Status line of ADR 041 (`docs/adr/041-a-drive-runs-in-rounds-and-owns-its-questions.md`, line 3), and ADR 043 (`docs/adr/043-kickoff-plays-read-independently-and-the-drive-closes-the-loop.md`)."
    detail: >
      ADR 041's forward pointer for ADR 043 ends: "And §4 'Member plays' (as amended by ADR 042): the connect step is a member play
      too." ADR 043's own text runs the connect step as two skills, `find-model-gaps` and `close-model-gaps`: "skills, not plays"
      (line 65), and its ICE impact says "The two gap skills are new; no new play" (line 10).
    why_it_matters: "A reader of ADR 041 alone would think a loop has a second member play, and look for a play that does not exist."
    this_decision_does: "After it, no step of a loop is a member play (ADR 041 §4 is amended). Accepted ADRs are not edited; the forward pointer this decision writes on ADR 041 says so."
    you_decide: "Nothing."
  - point: "A fourth standard is missing from Phoenix memory: the machine half of the naming rules"
    what_and_where: "`standards/rules/naming.yaml`: in Garura's source (`core/components/memory/standards/rules/naming.yaml`), in no memory tier (memory tool: find --every-tier, no match)."
    detail: >
      The brief names three standards the loop depends on that Phoenix memory lacks: `loop-contract.md`, `naming.md`,
      `rename-map.yaml`. `naming.yaml` is missing the same way. Phoenix memory's own `_index.md` lists it (line 14: "The machine
      half: the verb lists, industry terms, reserved built-in commands").
    why_it_matters: "An agent that follows the index to the verb lists finds nothing, so it cannot check a new name against the standard (ADR 046)."
    this_decision_does: "Adds `naming.yaml` to Phoenix memory with the other pages (part 6), after its lines 15, 23 and 24 drop the knowledge-play verbs."
    you_decide: "Nothing beyond accepting this record."

