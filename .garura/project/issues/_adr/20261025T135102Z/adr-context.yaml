ice_impact: >-
  none — no ICE text changes. The capability's ICE (capability.md) and the ICE of fn-881, fn-883 and
  fn-rerun-initialize already carry the typed-yes and memory-scope limits; this decision lets the
  product box admit them. What changes for agents is the box they read: the product profile now holds
  a security level (medium) with a gate, so a later capability's security need is compared against
  medium, not none, and stops for the product owner only when it is above medium.
ontology_read: ".garura/project/issues/_adr/20261025T135102Z/context/memory/standards/schemas/product-os/ontology.md (phoenix, sha256:c07cbc67...)"

