business_intent_check_why: >-
  No page in .garura/product/product-os/intents/ names initialize, the profile or security, and
  cap-initialize links no business intent in the spine (intents: []). The decision raises a
  product quality level to meet a capability's need; it does not change what any person wants.

consequences_from_brief:
  positive:
    - cap-initialize's security need fits inside the box, so the capability is not blocked
    - the typed-yes guard before any tracker write and the memory scope get a gate that can be checked
  negative:
    - the product now commits to a medium security level with a gate that must be run (a test GitHub organization, and a diff of Phoenix memory and another project's memory)
    - a later capability whose security need is medium or below now fits the box with no stop for the product owner
    - the spine already shows medium before acceptance; if the product owner rejects, the profile line must go back

gaps: none — the brief gives the decision, the reason, two alternatives and who decided
note_on_names: no real names; "the product owner"
