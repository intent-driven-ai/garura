# Context for the ADR re-draft, gathered by adr-keeper (record-decision, re-draft step).
# The product owner's change at the accept checkpoint (2026-10-31, the last section of the brief)
# rules this re-draft: keep it short and simple; drop the #1002 point, the /update-plan gaps on
# marking an epic for its slice and the feature-to-story map, the ADR 052 §7 point, and the long
# list of other files owed. Add no new gap and no owed work beyond what that section keeps.
shape: markdown
number: "063"
level: framework
node_ref: null
status: proposed
date: 2026-10-31
decided_by_note: >-
  Left empty in the draft: filled with the person's name when a person accepts it. The product
  owner decided it on 2026-10-30 (the #896 design, "approve") and 2026-10-31 ("yes go ahead", to
  amend ADR 049; and the change at the accept checkpoint, "keep it simple").
decided_in: "#896 (/shape-plan stops when the business intent already has a plan), PR #1003 on plan 717's branch; the review of PR #1003, finding HF-1"
title_hint: "/shape-plan makes a business intent's one plan once; a plan that exists is changed only by /update-plan"

next_number_check:
  command: "adr.py number --dir docs/adr"
  result: {next: "063", taken: 62}

decision_parts:
  - >-
    /shape-plan makes the business intent's one plan, once. When the intent already has a plan
    file (in the checkout or on main), it stops at pre-flight, before it opens a change or writes
    anything, and points to /update-plan.
  - >-
    A plan that exists is changed only by /update-plan. In its session the person may add a bug,
    a story or a feature to the plan. On "approved" the change reaches GitHub, and a new feature
    is linked to the product model with a thin ICE, through the skills that exist (ADR 062). A
    plan play does not change existing parts of the product model.
  - >-
    When an /update-plan change adds a feature to a slice, that slice's eval is out of date.
    Updating the eval is a person's later step (perhaps a later "update eval" play), outside this
    decision. A new bug or a new story does not change the slice, unless the story changes the
    feature itself.

overlap_candidates:
  command: "adr.py overlaps --adr <brief> --dir docs/adr --top 5"
  candidates: ["062", "049", "052"]
  judged:
    - adr: "049"
      verdict: amended in part
      part: >-
        Decision §1.2, the words "(or uses the one that exists)"; and Decision §2, the sentence
        "When a new slice is shaped for an intent that has a plan, the plan play adds the slice
        and its epic to that plan." The rest of §1.2 (as amended by ADR 052) and the rest of §2
        stand: one plan for each business intent, its ID the intent's issue number, it holds
        every slice that serves the intent.
    - adr: "062"
      verdict: not affected
      why: >-
        It decides when /update-plan writes the product model (only after "approved") and that a
        new feature may join a slice in progress, with a thin ICE (its C11). This decision relies
        on it as it is.
    - adr: "052"
      verdict: not affected
      why: >-
        Named by the overlap check only because the earlier draft cited it. The product owner
        dropped the ADR 052 §7 point from this record.

