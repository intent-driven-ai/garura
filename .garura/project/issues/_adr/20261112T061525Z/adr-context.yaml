ice_impact: >-
  /shape-plan, on PR #1047's branch, through /fix-play: C3 (a feature's work is found by the plan
  file's mark; when none, through the tracker tool, by the issue of type Feature whose text carries
  the exact line `Represents: <feature id>`; two such issues for one feature stop the run and go to
  the person; never by title; never a second Feature issue or Story; the play files one Feature
  issue for each feature not yet built, under the slice's epic, holding the feature's scope of
  work and Context guidance; when the Feature issue already sits under another epic, the play asks
  the person which epic it goes under), C13 (three types, Epic, Feature and Story; the epic's map
  names Feature issues), F14 and REC14 (the failure is now a second Feature issue or Story for one
  feature, a match by title or by a line that is not exact or on an issue not of type Feature, a
  duplicate not taken to the person, or a move to a second epic with no question), S10 and S11
  (S11: a closed Feature issue means the feature is built), D1 (each feature of each slice has
  exactly one Feature issue). Its reads of the model's `issue` go. author-work-items writes each
  feature's Feature issue (its title, scope of work and Context guidance) where it wrote a story,
  in plan mode and in story mode. /design-eval, through /fix-play: C1, C2, C3, C5, C8, C9, C16, F3,
  F4, F14 and F16 read the Feature issue where they read the story: one eval file for each Feature
  issue in the epic's map, still named by feature id; author-slice-eval follows. /reshape-plan,
  through /fix-play: C11 and F10 (a new feature lands with its thin page and its model entry, with
  no issue on the entry, and with a Feature issue that names it and holds its scope of work), C14
  (a story for a feature in the model goes inside its Feature issue), S10 and S11 ("find #N in the
  model" reads the Feature issue's exact Represents line); "finish" on a Feature issue is the one
  way a feature becomes built; its Step 9 name-story dispatch goes. /design-slice: C6 and C7 (a
  slice pulls in only features that are not yet built; to know that, it reads the state of each
  feature's Feature issue through the tracker tool). Skills: link-model-part stops writing `issue`
  (a request that names one is refused), and the product-os-keeper agent's table says so;
  author-plan-changes's new-feature entry no longer carries a story for the model. The build play's
  context sub-agent, when it is rebuilt (#855, #819), reads the Context guidance from the Feature
  issue. No capability or feature ICE of the product changes, and the ICE kind does not change.
  The ontology is not an agent intent; its change follows through /specify-ontology (#1050).

