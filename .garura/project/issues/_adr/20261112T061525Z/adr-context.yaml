keeper_notes_for_context:
  - "The brief names ADR 067 (superseded in full). The keeper also marks ADR 056 §1 and §2, ADR 048 §1, §3 and two of its lines under Consequences and Alternatives, and ADR 049 §1.2 as amended in part, because each says a feature is not an issue or gets one story in each epic."
  - "Change at acceptance, part 2 (the Feature issue holds the scope of work and the Context guidance; the epic's map names Feature issues) amends three more ADRs in part: ADR 049 §4 (the story holds the scope and the Context guidance), ADR 052 §3, §4 and §7 (the map from each feature to its story; the plan play writes the story's scope; the plan play makes the story again), and ADR 057 §2, §3 and §6 (one story file for each story; the stories in the map's order and their Context guidance; the counts for each story). It also widens the ADR 048 §3 amendment to the second bullet's last sentence (a story writes its scope from two ICE)."
  - "ADR 062, ADR 063, ADR 064 and ADR 065 are not amended; see not_affected. ADR 064 stands by the product owner's words at acceptance."
  - "Facts read on 2026-11-12: Garura's model has 239 features; 23 hold `issue`, each matching its own id (fn-724 names 724). The spine has no slices and there are no plan files (`.garura/project/plans/` does not exist). The tracker holds 64 issues of type Feature, 33 of them open; none has a `Represents:` line. The 31 closed ones are never matched, because a play matches only the exact line. #723 groups the stories of four features (#724, #725, #726, #597), so the clean-up cannot map it to one feature. The ontology (version 15) and the spine schema have no `issue` on a feature: ADR 067's change to them has not landed."
  - "Settled at acceptance, so no longer points for the accepter: how far part 1 reaches (features only), where the scope of work lives (the Feature issue), the eval's file names (one file for each Feature issue), who closes a Feature issue (a person, through /reshape-plan \"finish\"), a search that finds the wrong issue or two (type Feature and the exact line; a duplicate goes to the person), the 64 issues of type Feature and the 23 stories (the clean-up, before the values are deleted)."

for_the_accepter:
- point: A slice may not pull in a built feature, even when its end-to-end test needs that feature
  what_and_where: 'Brief part 4 ("A slice pulls in only features that are not yet built"). The ontology''s
    Slice kind (line 424: features "that together give one vertical outcome a person can test end to end");
    its Story kind (line 697: "when a later Slice includes a Feature again, that Slice''s Epic gets its
    own Story"); /design-slice C2 (the run reads the product model and memory first) and C6.'
  detail: A new slice whose surface needs a feature that is already built must leave that feature out.
    Its build order, its hidden file and its eval then do not name it. To know which features are built,
    /design-slice must also read each feature's Feature issue state from the tracker, through the tracker
    tool; today it reads only the model and memory.
  why_it_matters: A slice can pass its eval while a built feature it relies on is broken, and the person
    who tests the slice end to end meets a step the slice does not list.
  this_decision_does: It keeps built features out of a slice, and lists /design-slice C6 and C7 as changed.
  you_decide: Whether a built feature stays out entirely, or a slice may list it as "relies on, already
    built", with no new work item, so its eval still covers it.
- point: Two plans can hold one feature, but its Feature issue sits under one epic, and the plan check
    wants each item under its tracker parent
  what_and_where: 'Brief part 4 ("A Feature issue sits under one epic at a time"). /reshape-plan''s agreement
    check (`core/components/plays/reshape-plan/scripts/check_agreement.py`: "the item''s parent in the
    plan file is its parent in the tracker"); the Epic kind''s feature-to-story map (ontology line 663).'
  detail: Plan B can hold a feature whose Feature issue sits under plan A's epic. Plan B's file cannot
    put that item under its own epic without failing the check. If the person moves the Feature issue
    to plan B's epic, plan A's tree and its epic's map name an item that is no longer under them, and
    nothing in plan A's session says so.
  why_it_matters: Plan A loses work with no error, or plan B shows work it does not hold.
  this_decision_does: It asks the person which epic, before the move. It says nothing about the other
    plan's file.
  you_decide: How plan B shows a feature whose Feature issue sits under another plan's epic, and whether
    a move updates the plan it leaves.
- point: 'PR #1047 is built on the record this one supersedes'
  what_and_where: 'PR #1047, branch `feature/1025-shape-plan-reuses-open-story`: `core/components/plays/shape-plan/reference/ice.md`
    (C3 lines 21 to 31, C13 line 53, F14 line 88, S10 line 148, D1 line 158, REC14 line 198), `scripts/find_work_items.py`,
    `scripts/gather_plan.py`, `scripts/render_brief.py`, their tests and `scripts/test_support.py`.'
  detail: C3 on that branch says "the feature's story is the issue that the feature's entry in the product
    model names (its `issue`)", and the scripts read that field. Under this decision the field is gone,
    and the play must instead find or file a Feature issue for each feature and ask when a second epic
    holds it.
  why_it_matters: If the PR lands as it is, /shape-plan reads a field the model no longer has, and finds
    nothing.
  this_decision_does: It names the parts to change in its ICE impact. It changes nothing in the PR.
  you_decide: 'Whether PR #1047 is reworked through /fix-play to match before it lands, or closed and
    the work done again.'

