# ------------------------------------------------------------------
ice_impact: >
  `/intent`, `/vision` and `/understand` stop reading memory: `/intent` hands its agent the
  ontology's path from the config file; `/vision` and `/understand` judge through the judging
  skill and get the approval prompt from `template-manager`. Whether each play's ICE changes is
  decided per play (#661 plan item 7): through its ICE source and `/play-editor` if a guarantee
  changes, a direct edit if not. ADR 036's planned ICE change — "a person's own answer goes to
  Garura memory" for these three plays — does not happen; `/intent` already keeps the person's
  answers in its working answers record, in short-term memory. The close's move into one common
  file is a non-intent edit across every play: it changes no guarantee (ADR 035 already calls
  the close "shared scaffolding, not intent"). The new agent and skill change no play's ICE.
  The ICE kind does not change.
business_intent_check: none
business_intent_reason: >
  A framework decision on where memory is read and written, where the memory tool and Phoenix
  memory live, and how plays get templates, the judge prompt and the shared close. No person's
  business intent changes, and the Business Intent kind's rules stand: only a person confirms
  or drops one (ADR 031).
related: "ADR 036, ADR 035, ADR 038, ADR 034, ADR 017, ADR 009, ADR 037, ADR 011 (STM as inter-skill transport), ADR 016 (agent contract), ADR 031, #661, #653, #606, #613 (Kickoff), #662, #663"

# ------------------------------------------------------------------
consequences_hints:
  positive:
    - Garura memory and Phoenix memory change only when a person promotes something on purpose.
    - One place to look for what a person said in a piece of work: the issue's short-term memory.
    - A play is a plain workflow; every memory read is in an agent, through the tool, with a trace.
    - A project's Garura memory holds only the part it needs (checkout, not all of commerce).
    - One close for every play; a fix lands once.
  negative:
    - "A person can be asked the same question again in another issue, until the answer is promoted. ADR 036 §4 was there to stop that ('So no one is asked the same thing twice')."
    - "Without the copy on read, every lookup that reaches Phoenix memory reads it again until `initialize` or a promotion builds Garura memory; the first one needs the network (ADR 038's risk stands)."
    - The tool's contract loses two commands; any caller of `pull` or `pulled` breaks.
    - "`.garura/core/memory/` is gitignored today (.gitignore line 152); now it is Garura memory itself. Whether it stays out of git is not decided here."
    - "Two things are new and not built: `template-manager` and the judging skill. Until they exist, `/vision` and `/understand` still read the approval prompt and the judge prompt."
    - "product.md Rule 12 writes questions and answers outside short-term memory; it now conflicts with part 1 and must change. Not in #661's plan."
    - "The judge prompt is read by nine more plays' grounding gates; they move later (Kapil: 'fixed in the next few days')."
    - "A play now depends on a file outside itself for its close; if the install does not lay it, every close fails."
  not_decided_here:
    - "the common close file's folder (brief part 9)"
    - "whether `.garura/core/memory/` and `.garura/core/tools/` stay out of git"
    - "`.garura/core/engine-state.json`: it sits in `core/` today and the brief names only config.yaml, memory/ and tools/"
    - "how `initialize` builds a project's Garura memory from the part it needs"
    - "which version number the tool's contract takes without `pull` and `pulled`"

work_this_creates_hints:
  note: "None is filed; filed only when Kapil asks. Items 3 to 9 of the #661 plan."
  items:
    - "Fix the docs to say these rules: the tool's GUIDE.md and README.md, docs/components/memory.md, the glossary's memory rows (#661 item 2)."
    - "The tool and the folder: `read` copies nothing; `pull` and `pulled` go; tool at `.garura/core/tools/memory/`; Phoenix memory at `~/.phoenix/core/memory`; uninstall follows; `.garura/project/specs/` goes (#661 item 3)."
    - "Build `template-manager`, the judging skill, and the config key for the ontology's path (#661 item 4)."
    - "Move the close into one common file; `/play-creator` emits the pointer; `lint-components` checks it; update CLAUDE.md's durability rule (#661 item 5)."
    - "The two Kickoff agents read through the tool (#661 item 6); the three plays read no memory (item 7); the drive contract's rule (item 8)."
    - "Change product.md Rule 12 so questions and answers go to the issue's short-term memory (not in any plan yet)."
    - "Move every other play's judge onto the judging skill, and its own memory reads off the play."

references:
