supersedes: []

amends:
  - adr: "035"
    file: docs/adr/035-agents-work-only-from-memory.md
    part: >-
      §2 "Phoenix memory has one home; a project pulls the subset it needs": its line "At install, a
      project pulls a starting set: Garura's rulebook and the memory guide (part 8)" — the install
      pulls nothing; Phoenix memory reaches a machine the first time the memory tool needs it,
      downloaded whole from the source its settings name (today a git repository, later a server
      address) to one place on the machine (default ~/.garura/phoenix-memory), never waiting on a
      password and stopping after a time limit, and a failed download refuses the lookup with
      Phoenix memory named; a project's own Garura memory is set up after the install by a new play,
      `initialize`. The rest of §2 stands (its own git repository, pulling more on need, the list of
      what was pulled). §3: the line in Kapil's quote "installation is key so that it has some part
      of LTM build" — Garura memory is built by `initialize`, not the install; until it runs, lookups
      go up to Phoenix memory; the lookup order and "never blocks a play" stand. §4: "The tool sits
      outside Garura" — the tool is installed in each project at .garura/tools/memory/ with its
      settings beside it; agents still call the tool, never a path, so a move to Griffin still
      changes the tool only. §8 "Every install carries the memory system": the install lays the tool,
      its settings and the memory guide, brings no memory, and checks that the tool runs and reaches
      short-term and Garura memory; it does not fail when Phoenix memory is not on the machine yet —
      it reports it, and notes when the source does not answer. Alternatives Considered: the line "A
      project pulls nothing at install; every piece on first need" (lost to "a starting set at
      install") is now the choice for the install.
    why: >-
      Brief "Why now": the review of PR #677 found the code contradicts §2's starting set and the
      rejected alternative. §3's quote and §8 describe what the install does, and change with it. §4
      is a judgment call: its words "The tool sits outside Garura" read against the tool now living
      inside each project's .garura/; the purpose §4 gives (agents call the tool, so a move to Griffin
      changes nothing for them) stands, and the brief's rejected option "the memory tool outside the
      project" names the same choice. Everything else in ADR 035 stands: §1, §5, §6 (as amended by
      ADR 037), §7, §9, §10, and "Not decided here: where in .garura/ Garura memory lives".
  - adr: "017"
    file: docs/adr/017-folder-whitelist.md
    part: >-
      §1 "Strict .garura/ folder whitelist": the whitelist gains `.garura/tools/`, holding `memory/` —
      the memory tool as installed, with its settings.json beside it. The tool's own folder is never
      answered as Garura memory. The rest of §1 stands.
    why: >-
      Brief: "This adds tools/ to the .garura/ folder whitelist." §1 allows "ONLY these folders. No
      other top-level or second-level folders are permitted anywhere under .garura/" — `tools/` and
      `tools/memory/` are both new. ADR 017's existing pointer (from ADR 035) covers §1's core/ entry
      only.

