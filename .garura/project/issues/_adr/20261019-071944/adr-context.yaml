  positive:
    - "brief: install finishes without any memory; the person picks what the project needs in initialize, from choices built from Phoenix memory, not pulled blind"
    - "brief: one copy of Phoenix memory per machine (one place), fetched by the tool from a source in its settings, so a later server address changes a setting"
    - "brief option 3: each project carries the tool version it was installed with"
    - "brief: a download never blocks on a password and stops after a time limit; the lookup is refused with Phoenix memory named"
    - "brief why-now: the record and the code land together"
  negative:
    - "brief: initialize is not designed or built; until it runs, every lookup goes up to Phoenix memory, so a new project's first lookup needs the network and the download"
    - "memory_system.py / install-garura SKILL.md: the old machine-wide copy (~/.garura/core/memory) is still laid until retired (#653 item 10), so the install still copies memory to the machine for now"
    - "pull.py: the first download can take up to the time limit (600 seconds) during an agent's lookup"
    - "brief option 3: each project carries its own tool version; a fix reaches a project only when it is installed again"
    - ".garura/project/issues/660/specs/plan.md 'Where the issue text no longer matches': the #660 issue text still says an install that cannot reach a tier fails"

