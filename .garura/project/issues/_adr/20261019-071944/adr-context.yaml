ice_impact: >-
  No agent intent changes now. The install-garura and uninstall-garura plays have no ICE source (they
  are garura-native meta plays, edited directly); their guides changed on this branch. The agents'
  intents are unchanged: they already find memory only through the memory tool (ADR 035), and the
  guide they read tells them how; until #661 and #663 no agent calls the tool. The new `initialize`
  play gets its ICE when it is designed. The ICE kind does not change.

