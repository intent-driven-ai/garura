ice_impact: >
  The product ICE keeps its three parts (ADR 047). It gains one optional mark: thin (the Thin line on
  its page and metadata.thin: true in its spine entry), set by /shape-slice and removed by the play
  that deepens it. Each line of an ICE has one reader: /shape-slice reads the "Fails if" lines and
  writes the hidden file; the plan play reads every other line and writes the story. The ready
  check's answer changes: the thin mark gives "partly ready" with the gap "thin ICE"; one mark
  without the other is a drift gap; the light/full richness report is gone. The ICE of /shape-slice
  changes in meaning when it is rebuilt with /edit-play; the plan play and the eval play get theirs
  when built. No play's ICE source changes with this ADR.

business_intent_check: none
business_intent_basis: >
  The Business Intent kind is not changed by v11 (the v11 diff touches the Slice, ICE, Plan, Epic and
  Story kinds and their questions; the Business Intent section is unchanged). No page in
  .garura/product/product-os/intents/ changes on #846.

consequences_from_brief_and_sources:
  positive:
    - "/shape-slice does not stall: the hidden file is keyed by feature, and the features exist when the slice is shaped (the #844 run showed the stories do not)"
    - "The plan play only plans and writes no failure condition, as the product owner said"
    - "Each ICE line has one interpretation, so the hidden file and the story cannot read the same line two ways"
    - "A person is never sent back for a missing ICE; the slice is shaped, with a warning, and the gap is listed"
    - "The ready check stays mechanical: one mark, no line counts, no judgment"
  negative:
    - "Work can start on a thin ICE; a poor outcome from it is on the person who wrote it (ADR 047 §8 stands)"
    - "The thin mark is in two places; when only one is there it is drift, and the check reports it"
    - "The join from hidden-file entry to story depends on the epic's feature-to-story map; a missing map line breaks the join for the eval play"
    - "Until /shape-slice is rebuilt with /edit-play and the plan and eval plays are built, the plays and the ontology say different things"
    - "Two plays act in one Alignment round when an ICE changes"

alternatives: # from the brief only
  - "Keep the plan play as the writer of the hidden file (ADR 049 as it is) — the plan play would write failure conditions, which the product owner said it must not; the shaping splits across two plays"
  - "Key the hidden file by story and have /shape-slice wait for the stories — the stories come after /shape-slice; it would stall"
  - "A thin ICE with Intent only, as a new reason for partly ready (decision 7 as first worded) — with no Context and no Expectation the story has nothing to write from; the product owner chose one line in each part (checkpoint 1, C1; checkpoint 3, L1)"
  - "Force the person back to /discover-capabilities for a part with no ICE — the product owner said never force; warn instead (decision 7)"

work_this_creates:
  - "/edit-play on /shape-slice: write the hidden file and propose a thin ICE with its mark and warning"
  - "Build the plan play (plan file, epic with feature-to-story map, stories; nothing in evals/) and the eval play (joins entries to stories through the map)"
  - "After acceptance: the forward pointers on ADR 049 and ADR 047"

