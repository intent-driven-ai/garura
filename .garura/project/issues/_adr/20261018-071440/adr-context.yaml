    what: >-
      Rule 4, "A question the drive did not answer still stops the play. The play asks the person
      and never picks an answer for itself" — changes the same way as ADR 029 §2 (the brief names
      it). The Related line ("a new question stops the drive") follows. Rule 3's "or it stops the
      play and asks, like any new question" (pinned checkpoints) is not changed by the brief — see
      open_points.
  - path: core/components/memory/standards/rules/_index.md
    what: "the drive-contract row's summary: \"stop on a new question\"."
  - path: core/grounding/glossary.md
    what: "the Drive entry: \"stops only to ask a question that comes up mid-run\"."
  - path: core/components/plays/intent/
    what: >-
      reference/ice.md C4 ("the drive may still ask its questions") and C5 ("Nothing invented:
      every outcome, reason, proof and limit traces either to what the source shows or to the
      person's own answers; ... the play asks the person and never fills the gap itself"), S5;
      SKILL.md Step 3 "Ask and check" (asks every open question one at a time, up to 3 rounds)
      and SE-4; scripts/check_intent.py (accepts only provenance `source` or `person`). Inside a
      drive /intent answers from memory first, records the source, and asks only what nothing
      supports. Through its ICE source and /play-editor (#613 plan item 3).
  - path: core/components/plays/vision/
    what: >-
      reference/ice.md C11 and SKILL.md pre-flight: "A question neither the contract nor the
      model answers — no intents and no goal — stops the run and asks the person; the play never
      picks an answer itself" — widens to all of memory and the system.
  - path: core/components/plays/understand/
    what: >-
      reference/ice.md C13 and SKILL.md Step 1: "an absent capability with no seed answers —
      stops the run and asks the person"; scripts/pick_targets.py and
      scripts/persist_understand.py accept seed answers only with `answered_by: human` (the
