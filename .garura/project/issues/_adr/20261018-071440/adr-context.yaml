  - path: core/components/plays/adr/
    what: >-
      reference/ice.md C5 and SKILL.md Step 2: the business-intent stop inside a drive is
      justified as "a new question, and a new question stops the drive (ADR 029 §2)". The stop
      itself stays — only a person changes their business intent (ADR 031 §1; the ADR template's
      rule) — but its reason can no longer rest on ADR 029 §2 alone.
  - path: core/components/plays/play-creator/references/write_drive_review.py
    what: "the plays' review record — the likely carrier of each answer's source for the drive's review; where the sources are recorded is not decided by the brief."
  - other: "the Kickoff drive (#613, not built yet): its question step (#613 plan item 2); the review step and the two review tools (not built yet; #641–#650): they show the person what was assumed and on what basis"

# --- ICE impact (from each play's ICE source; ontology.md ICE kind read — unchanged)
ice_impact: >-
  The agent intents of the plays that run inside a drive change. /intent (C4, C5, Step 3): inside
  a drive it answers its open questions from memory and the system first, records each answer's
  source, and asks the person only what nothing supports; C5's "every property traces to the
  source or the person's answers" widens, inside a drive, to the memory this ADR names, each with
  its source. /vision (C11) and /understand (C13): "a question neither the contract nor the model
  answers stops the run" widens to all of memory and the system. /adr (C5): its business-intent
  stop stays, on ADR 031's rule rather than ADR 029 §2. The Kickoff drive (#613) stops mid-run
  only for a question nothing in memory supports. Run by hand, no play changes. The ICE kind
  does not change (ontology.md: its properties and rules say nothing on how a question is
  answered).

# --- Business-intent check
business_intent_check: none
business_intent_check_reason: >-
  A framework rule about how plays answer questions inside a drive. No person's business intent
  changes; nothing under product-os/intents/ is named or written. The Business Intent kind's rules
  in ontology.md do not change either: they say nothing about where a draft's properties come
  from, and "Only a person confirms or drops it; an agent never does" stands — inside a drive
  every intent is still saved proposed and confirmed or dropped by a person at the drive's review
  (ADR 031 §5, ADR 032 §4). Edge for the person to see: inside a drive /intent may now fill a
  proposed intent's why, who asked or proof from memory (with its source) instead of asking; if
  the person reads ADR 031 §1 ("an outcome in their words") as kind doctrine this touches, the
  check would be `kind`, not `instance`.

# --- Open points the brief does not settle (named, not decided — do not invent an answer)
open_points:
  - >-
    Pinned checkpoints. The brief changes drive contract rule 4 only. Rule 3 says a pinned
    checkpoint not asked up front "stops the play and asks, like any new question", and
    gate-config.md says a pinned gate always fires: "No config value, policy, or ledger can turn
    it off" — the learned answers live in that ledger. The draft states the scope: this ADR is
    about questions, not checkpoints, and rule 3 is not changed; the wording "like any new
    question" must not be read as letting memory answer a pinned checkpoint. Kapil confirms at
    acceptance.
  - >-
    Product-model pieces not yet approved as memory (ADR 033 §3) — named as a risk, not decided.
  - >-
    Where each answer's source is recorded (an answers file, the review record, the run record)
    — not in the brief; design for #613 plan items 2 and 3.

related: "ADR 029 (drives), ADR 031 (business intent and ICE), ADR 032 (drive review of outcomes), ADR 033 (approval in the product model), ADR 002 (checkpoint model), #613 (Kickoff), #606, #594"

# --- What the brief gives for each required section (no outside reasons)
from_brief:
  context: "Why now — Kickoff (#613) is built next; the 18 October read found /intent asks every open question from its draft one at a time, up to three rounds; these come out of the draft so cannot all be asked before the drive starts; under ADR 029 §2 and drive-contract rule 4 each would stop the drive; Kickoff would stop on nearly every run. The rule must be set before the runner and the play fixes (#613 plan items 1 to 3). Kapil's words, 2026-10-18."
  decision_parts:
    - "Inside a drive a play runs with a high level of autonomy: a question it would ask a person it answers from memory and the system, and may assume from them. It does not stop at every point."
    - "What counts as memory and the system, as the plays have it today: the drive contract's answers (gathered before the drive started); the sources the person gave (the prototype and its saved snapshots); the product model; the knowledge base; the learned checkpoint answers."
    - "Never from the model's own knowledge with nothing behind it. When nothing in memory or the system supports an answer, the play asks the person; that question stops the drive, as ADR 029 §2 says today."
    - "Every answer taken this way is recorded with where it came from; the drive's review (ADR 032) shows the person what was assumed and on what basis. An answer with no source is not allowed."
    - "What this changes: ADR 029 §2's bullet; drive contract rule 4, the same way."
    - "Scope (agent's reading, stated as unchanged, not as a new rule): run by hand a play is unchanged; questions first stays; checkpoints are not questions — rule 3 and gate-config stand; only a person confirms or drops a business intent or accepts an ADR."
  alternatives: "three, each with why it lost — from the brief's Options considered, with Kapil's words"
  quotes: "Use Kapil's own words from the brief, exactly; do not add any."
