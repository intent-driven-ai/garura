amends:
  - adr: "035"
    file: docs/adr/035-agents-work-only-from-memory.md
    part: >-
      §1 short-term memory is the current issue's folder only, and every lookup names its issue;
      §5 an approved researched answer is written to the issue's short-term memory, never straight
      to Garura or Phoenix memory, and moving it up is a promotion, its own memory update a person
      approves outside the work, while a person's own answer to a question goes to Garura memory;
      §7 the review tool's third section is Memory and ADRs, where every memory review and ADR
      review happens, on the Catch up cards (and with it §9's line on ADR 032 §3); and Negative /
      Risks, "Not decided here": its first two questions are settled — learned checkpoint answers
      are not memory, and a play's own working files stay direct (ADR 011).
    why: >-
      Brief points 1, 2, 3, 4, 5, 6 and 7. §1 says only "per issue, in the issue's folder", which
      leaves open whether a lookup reads every issue's folder; point 1 closes that. §5's third
      bullet says the approved update is written to Garura or Phoenix memory; points 2 and 3
      replace it. §7 names only a Memory view; point 7 widens it to Memory and ADRs and makes it
      the one place for every memory and ADR review. §3's lookup order stands ("The order does
      not change"), as do §2, §4, §6, §8 and §10; §5's other bullets stand, including "Until the
      memory review exists (part 7), a person approves a memory update by typing". The last two
      "Not decided here" questions (a drive going on while an update waits; where in .garura/
      Garura memory lives) are not touched by the brief and stay open.
  - adr: "034"
    file: docs/adr/034-plays-answer-from-memory-inside-a-drive.md
    part: >-
      §2 "What counts as memory": the learned checkpoint answers come off the list — they stay a
      checkpoint tool, which holds only "approved or not" for a kind of change and cannot answer a
      question; a person's answers to questions are kept in Garura memory.
    why: >-
      Brief point 5. ADR 035 amended §2 to the three tiers but left this one bullet open in its
      "Not decided here" list, so it still stands on 034 §2 until a decision removes it. §6's line
      "The learned checkpoint answers do not answer it [a pinned checkpoint]" already agrees and
      stands. No component reads learned checkpoint answers as memory today (searched
      core/components: the only hit is drive-contract.md rule 5, a checkpoint rule).
  - adr: "032"
    file: docs/adr/032-drive-review-of-outcomes.md
    part: >-
      §3 "Two review tools", as amended by ADR 035: the third section is Memory and ADRs, not
      Memory — it also shows the ADRs waiting for a person, and every memory review and ADR review
      happens there, on the same Catch up cards as Intents and Product (#644).
    why: >-
      Judgment call. ADR 032 §3 is the decision that names the review tool's sections, and its
      Status line today describes the third one as "Memory" (ADR 035's pointer). A reader of 032
      should see the current name without a second hop. ADR 035's own run left ADR 029 as Related
      in a like case; drop this amendment if one hop through ADR 035 is preferred. The rest of ADR
      032 stands, including §2's list of what a drive's review covers.

