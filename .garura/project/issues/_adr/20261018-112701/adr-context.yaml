ice_impact: >-
  The `/adr` play's agent intent changes once the review tool's Memory and ADRs section exists:
  C6's pinned accept, typed today when run by hand, and the accept at a drive's final review
  move onto a card in that section — through its ICE source
  (`core/components/plays/adr/reference/ice.md`) and `/play-editor`. Until then C6 stands as
  written. The agent intents of the plays whose agents read memory change as they move onto the
  memory tool (#653 plan items 8 and 10), each through its ICE source and `/play-editor`: every
  lookup names the issue, and short-term memory is that issue only; a researched draft is
  proposed to the issue's short-term memory and used only after a person approves it; a
  person's own answer goes to Garura memory. For `/intent` (C4, C5, Step 3), `/vision` (C11) and
  `/understand` (C13), the "memory update the person approves" ADR 035 named lands in the
  issue's short-term memory. Parts 5 and 6 change no agent intent: no play reads learned
  checkpoint answers as memory today, and step-to-step files already stay direct. The ICE kind
  does not change.

