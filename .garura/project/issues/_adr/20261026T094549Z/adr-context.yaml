ice_impact: >-
  The product ICE does not change: each capability and feature keeps one ICE in three parts (ADR
  047), and the eval still reads no ICE page. /shape-eval gets its ICE now
  (core/components/plays/shape-eval/reference/ice.md): Gherkin story files and one slice file
  (C2, C3), a scenario or an Untestable line for every goal, expectation and failure condition
  (C5), a fixed yardstick that only adds scenarios (C7), a summary at the checkpoint and never
  the eval (C9), steps only from the step library of the surface kind, with no agent (C12),
  names in square brackets for what the build makes (C13), and a time limit per scenario (C14).
  evals-engineer changes in intent: it only checks the copies and calls author-slice-eval. The
  eval runner (a later play, #819) gets its ICE when it is built: it runs the steps exactly, with
  no agent, and passes only when every scenario passes. The routing of Principle 4 holds: the
  builder never receives the eval; the validator is now a runner that reads the eval as plain
  text (no decrypt).
