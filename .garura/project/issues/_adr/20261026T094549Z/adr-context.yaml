  - core/components/plays/shape-eval/reference/ice.md (Intent, Constraints C1-C14, Failure conditions F1-F14, Context)
  - core/components/agents/evals-engineer.md (new text and its diff)
  - core/components/memory/standards/schemas/product-os/ontology.md (repo source, v12: Slice's Eval row, Q28, Q29, Q35; read with grep as a file the decision may affect)

business_intent_check: none
business_intent_check_why: >-
  No person's business intent changes, and the Business Intent kind does not change. Business
  intent #788's page (.garura/product/product-os/intents/bi-788.md) has the proof line "The eval
  is kept in a place where no builder can read it" and the must-not "Do not let a builder read
  the eval". Neither names encryption. The product owner confirmed #788 on 2026-10-24, when ADR
  049 (accepted 2026-10-23) already said the eval is kept from the builder "by a read rule only"
  and encryption was only planned (#828). This decision keeps that place (the evals folder of
  the home plan) and that rule (no builder, no skill that builds the software and no context
  sub-agent reads a plan's evals folder; the build is given the stories, never the eval). It
  drops a lock that was planned, not one the intent asked for, and the person who owns #788 made
  the decision. The ADR does not edit the intent page and its Affects names no intent page. Note
  for the person: with no lock, "no builder can read it" is met by the read rule, not by
  anything on disk; if the product owner wants the proof line to say "is never given to a
  builder", that is the person's own edit to the intent, not this ADR's.

