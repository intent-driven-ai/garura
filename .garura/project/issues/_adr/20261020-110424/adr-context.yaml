ice_impact: >
  Agent intents change for every drive and the plays inside one. The Kickoff drive (C4, C5, C7)
  runs its plays in rounds, owns their open questions, runs /build-memory before it asks, asks
  after showing the draft, and ends at the pull request with the person's typed confirm or drop
  recorded, until Argus. /intent (C16) records an unanswerable question for the drive and
  finishes instead of stopping. /vision (C11) and /understand (C13) change the same way — their
  ICE still says such a question "stops the run" and must change through /play-editor. /build-memory
  is a new member play whose intent is to run only inside a drive (C6). /drive-creator compiles
  every new drive with rounds and the member play. /adr (C5) is unchanged: a decision that would
  change a person's business intent is a question only the person can answer, so it still reaches
  them. No ontology kind changes (the ICE and Business Intent kinds stand).

business_intent_check: none
business_intent_check_reason: >
  A framework decision on how a drive runs. No person's business intent changes, and the Business
  Intent kind's rules stand: only a person confirms or drops one (ADR 031); inside a drive every
  intent is saved as proposed; the drive records the person's typed confirm or drop and changes no
  intent's state; only the review step writes approval (ADR 033 §6).

