keeper_note_on_the_brief: >
  The brief says the decision clarifies ADR 029 §2 and §4 and ADR 034 §3 and changes none of their
  intent. The keeper agrees the intent of those parts stands (a drive never picks an answer for
  itself; nothing comes from the model alone). But the words of those parts, read alone, tell a
  reader the opposite of what now happens (a play stops and asks; every play a drive runs can be
  run by hand). The template has no "clarifies" field: a reader of the older ADR finds the new one
  only through an "amended in part" pointer. So each is recorded as an amendment in part that keeps
  the older part's intent. The keeper also found two parts the brief does not name, which the
  decision changes in part: ADR 032 §1 and §5 (point 7, until Argus exists) and ADR 039 §2 with its
  line on ADR 035 §4 (point 8). Say this plainly in the Context so the person sees it at acceptance.

supersedes: []

amends:
  - adr: "029"
    file: docs/adr/029-drives.md
    parts:
      - section: '§2 "A new question stops it" (as amended by ADR 034)'
        what: >
          The stop is the drive's, never a play's. A question one play cannot answer is recorded
          in the drive issue's short-term memory; the play does the work the question does not
          block, saves what it made as proposed with the gap named, and finishes. The drive stops
          and asks the person only what none of its plays, no memory and no approved research can
          answer — after a round that answered nothing new, or at its round limit — and only after
          /build-memory has run. The drive still never picks an answer for itself.
      - section: '§2 "Questions first" — how questions raised mid-run are asked'
        what: >
          The drive still asks its own questions before any play runs. The questions its plays
          raise mid-run are asked after the person is shown the draft, each once, in words that
          make sense to whoever gave the drive its input (decision point 5).
      - section: '§4 "Plays stand on their own"'
        what: >
          Holds for a drive's work plays. A member play (/build-memory) runs only inside a drive,
          as the change plays a drive injects do.
    not_affected: '§1 (rounds make "runs other plays until its intent is met" concrete; the three work plays stay the trinity, a member play is not one of them), §3, §5 as amended by ADR 032, §6'
  - adr: "034"
    file: docs/adr/034-plays-answer-from-memory-inside-a-drive.md
    parts:
      - section: '§3 "Never from the model alone" (as amended by ADR 035)'
        what: >
          "When nothing in memory or the system supports an answer, the play asks the person. That
          question stops the drive" becomes: the play records the question for the drive and
          finishes; the drive asks, after its rounds and /build-memory, only what nothing answered.
          "Never from the model alone" and ADR 035's memory update stand.
      - section: '§5, its line on ADR 029 §2'
        what: 'Read with this ADR: the stop is the drive''s, after its rounds, not the play''s.'
    not_affected: '§1, §2 (as amended by ADR 035, 036 and 039), §4, §6'
  - adr: "032"
    file: docs/adr/032-drive-review-of-outcomes.md
    parts:
      - section: '§1 "The review is the drive''s last step" and §5 "The answers are applied as one commit" — until Argus (the review tool) exists'
        what: >
          A drive ends at the pull request. The person's typed confirm or drop for each proposed
          intent is recorded in the issue's short-term memory; the drive never changes an intent's
          state; the intents stay proposed until Argus's review step writes approval (ADR 033 §6).
          A recorded drop is carried to that review and does not remove the intent from this merge.
          Once Argus exists, §1 and §5 hold as written.
    not_affected: '§2, §3 (the person still confirms in the review tool; the typed record is carried there), §4, §6, §7, §8; ADR 033 §6 (only the review step writes approval) holds and is relied on'
  - adr: "039"
    file: docs/adr/039-memory-writes-go-to-short-term-memory-plays-read-no-memory.md
    parts:
      - section: '§2 "A play is a pure workflow and reads no memory" ("A drive follows the same rule") and §10''s line on ADR 035 §4 ("only agents call the tool")'
        what: >
          A drive still reads no memory. Recording a person's typed decision on a memory update
          through the memory tool's decide (decided_in: session) is not reading memory; the drive
          may make that one call, as the stand-in for Argus's memory view (#664), as memory tool
          contract v5.1 provides (core/tools/memory/contract/v5.json). An agent never decides an
          update; only the person's typed word is recorded.
    not_affected: '§1, §3-§9, §11'

