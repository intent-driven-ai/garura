ice_impact: >
  /shape-slice: C18, F18 and REC18 change — the run reads the rule for asking a person only from
  the shared file _shared/asking-a-person.md, never through the memory tool; when the file is
  missing it says so in the brief, follows the play's floor and goes on (no memory update is raised
  now). /edit-ontology: its Context names _shared/asking-a-person.md, passed by product-os-keeper
  as asking_rule; its guarantees do not change in meaning. The deletions change no live play's ICE:
  every part deleted was deprecated and no live part used it. The seven skills marked stale wait for
  the rebuild of their callers (#855) and get new ICE then.

business_intent_check: none
business_intent_basis: >
  This deletes old framework parts and moves a framework rule. It does not change the Business
  Intent kind or its rules. No page in .garura/product/product-os/intents/ names any part here.

consequences_from_brief_and_sources:
  positive:
    - "No part carries deprecated: true; a reader or an agent no longer finds retired parts and takes them as current (brief)"
    - "The asking rule has one source, read by the parts that use it, by one path"
    - "A play or skill that does not ask a person no longer has to point to a global rule (brief: a memory lookup made it a global rule every play had to point to)"
  negative:
    - "A deleted part can be read again only from git history"
    - "The asking rule is no longer in memory, so a project cannot read it through the memory tool; a part not in the lint list that starts to ask a person must be added to the list by hand (keeper finding: the PARTS list in asking-a-person.js)"
    - "If the install does not lay _shared/, the parts that ask a person follow the play's floor (shape-slice C18)"
    - "Seven stale skills stay until their callers are rebuilt (#855)"

alternatives: # from the brief only
  - "Keep the three agents as ADR 050 §3 said — lost: nothing live uses them, and the installer never ships deprecated parts; they only mislead a reader"
  - "Keep the asking rule in memory, read through the memory tool — lost: it is instructions a few skills share, not knowledge; a memory lookup made it a global rule every play had to point to"
  - "Copy the rule into each skill that uses it — lost: five copies drift; one shared file, as for the play close, keeps one source"

