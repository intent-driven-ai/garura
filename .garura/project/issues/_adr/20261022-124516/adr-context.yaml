ice_impact: >-
  Every product ICE changes place and shape: one ICE for each capability and each functionality, on its own
  page (ice.md) with its own spine entry, in three parts — Intent (goals, limits, fails if), Context (rules for
  the context-gathering sub-agent: read, never read, persona, scope) and Expectation (scenarios, done means,
  quality needs). Agents that build from an ICE now take the ready check's answer: ready or partly ready means
  work starts (gaps listed), not ready means work stops and the page is kept. An ICE with a missing part is not
  ready; a thin or wrong part does not stop it. The gate is the business intent: no tokens are spent on an ICE whose capability serves no confirmed business intent, however rich it is; once that business intent is confirmed the ICE needs no separate approval. Richness is assessed and reported, never a stop. The agent intents of the plays and skills that write or read ICE
  (/discover-capabilities, enrich-capability-ice, the product-os-keeper agent, every play that runs the ready
  check) change when #759, #760 and #761 are built; this ADR changes no play's own ICE source today.

business_intent_check: kind
business_intent_check_reason: >-
  It changes the Business Intent KIND (framework doctrine): a business intent holds no ICE, links to its
  capabilities, gains an optional Rules property, and keeps "identified by" between business intents as a
  connection, never a dependency. No person's business intent changes; nothing under
  .garura/product/product-os/intents/ is edited. Only a person still confirms or drops a business intent (ADR 031).

