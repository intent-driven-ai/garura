overlap_candidates:                # adr.py overlaps (on the brief): 043 (score 6.6), 031 (6.3); others read by hand
  - adr: "031"
    judgment: amended
    part: >-
      Its ICE parts only. §1 "Two levels": an ICE is now one for each capability and each functionality
      (not "one per separate thing the person must see"), and it has no link to a business intent — it finds
      its business intents through its part. §3 "ICE is placed at once": the ICE no longer lives inline in its
      capability's or functionality's grounding doc; it has its own page (ice.md in its part's folder) and its
      own spine entry (an `ices` list). §4 "ICE is worked on only when its intent is confirmed" (as already
      amended by ADR 033 and ADR 043): the workable rule becomes the ready check on the ICE, with three
      answers — ready, partly ready, not ready — and an ICE starts only with all three parts present.
    stays_in_force: "§1's two levels (a business intent is not ICE; only a person confirms or drops one); §2 no play owns a kind; §5 approval inside a loop (as amended by ADR 032); 'worked out, never stored' (the ready answer is computed, never stored)."
  - adr: "043"
    judgment: amended
    part: >-
      Its ICE parts only. §1 "Every kind is written on its own": the ICE is no longer a free node with no parent —
      each ICE belongs to exactly one capability or functionality (spine `for`); the holding folders for
      capabilities and functionalities stay. §2: "/discover-capabilities writes capabilities and functionalities,
      each with its ICE" — the ICE is now written as its own page and spine entry (build: #761). §3 "A node is
      ready only once it is attributed": the ready check moves to the ICE, with three answers; a missing domain
      no longer stops work (it is a gap, the ICE is partly ready); "its ICE -> a confirmed business intent"
      becomes "its capability serves a confirmed business intent" (a functionality's through its parent).
      Note: ontology v5 (#597) already dropped the domain from the ready rule with no ADR; this ADR records it.
    stays_in_force: "§1's holding folders, §4 the loop closes the gaps, §5 independent reading, §6 the two gap skills, §7 the write-up, §8 the person's choice."
  - adr: "033"
    judgment: amended
    part: >-
      §4 "Approval follows links", that part only: the ICE's own approval, and its part's (capability or
      functionality), is no longer a condition of ready — the condition §8 wrote into ADR 031 §4 ("workable only
      when the ICE, its node and its business intent are all approved"). The business intent's confirmation stays:
      an ICE whose capability serves no confirmed business intent is not ready. Source: the brief, "Change at the
      accept step" (the product owner, 2026-10-22).
    stays_in_force: "§1 approval lives in the model; §2 the three states; §3 the governance rule for every other piece (a rule stops work, never a write); §4's link rule for the business intent; §5-§7 the lifecycle mapping, who writes approval, and the review tool view."
    note_for_person: "§3 says no agent builds from a piece a person has not approved. Read with this amendment, it no longer holds for an ICE or its part as a condition of ready. The brief names §4 only; the draft says so in its change list."
  - adr: "027"
    judgment: not affected
    part: "ICE stays the IDSD model and PCAM the design that drives it. Its table already says (via ADR 031) that the business intent is the person-facing kind and the work that carries it is ICE; v6 keeps that (a business intent holds no ICE)."
  - adr: "026"
    judgment: not affected
    part: "Direct model writes are unchanged; a new page (ice.md) and spine list (ices) are written under the same rule. The write scopes of the plays that write them are #761's work."
  - adr: "029, 032, 041, 042, 044, 045"
    judgment: not affected
    part: "Loop doctrine (rounds, reviews, questions, shared run, name). Their ICE mentions are about play ICE or the loop's review, not where a product ICE lives or when it is ready."
  - adr: "046"
    judgment: not affected
    part: "Naming only."

