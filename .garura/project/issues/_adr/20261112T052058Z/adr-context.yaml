ice_impact: >
  /shape-plan only, on PR #1047's branch. C3: when the plan file marks no story, the feature's
  story is the issue its model entry names, of type Story; open, it is used, made a sub-issue of
  the slice's epic, and the move (with the parent it leaves) is shown in the brief before the
  yes; closed, the feature is already built, no story is made and the closed one is left as it
  is; a feature whose ICE is not ready never takes it; a missing issue, an issue not of type
  Story, an issue named for two features, or a feature in two slices of one plan stops the run
  before any tracker write. F14 and REC14 follow C3: a closed issue is no longer a problem, and
  the two-slices case is. S10 stands, and its brief now names the parent the story leaves. A new
  scenario, S11, covers a closed story (keeper's reading of where the caller places it). D1 counts
  a feature whose story is closed as built, not as a missing story. No other play, loop or agent
  ICE changes, and no capability or feature ICE changes. The ontology is not an agent intent; its
  change follows through /specify-ontology.

business_intent_check:
