notes_from_the_keeper:
  - The brief names only ADR 056 §2. The keeper also marks ADR 048 §3 and ADR 049 §2 as amended in part, because the closed rule is an exception to "one story for each feature in each epic". The first point for the accepter lets the person keep or drop those two.
  - Garura's own model today has 239 features; 23 name an issue (the feature id matches the issue, for example fn-724 names #724). All 23 are of type Story. 21 are closed and 2 are open (#725 and #726). No issue is named twice. The spine has no slices today.

for_the_accepter:
  - point: The closed rule also changes "one story for each feature in each epic"
    what_and_where: >
      ADR 048 §3, second bullet; ADR 049 §2; the ontology's Story kind ("There is one Story for
      each Feature in each Epic: when a later Slice includes a Feature again, that Slice's Epic
      gets its own Story for the Feature") and its Feature kind ("In the tracker as: a Story — one
      Story in each Epic that delivers it", and the Clinic example "Send a reminder", which gets
      its own Story in Epic "Follow-up visits"); /shape-plan's D1 ("each feature of each slice the
      plan holds has exactly one story (or is named as skipped)").
    detail: >
      The brief says that when the model's issue is closed, "the feature is already built: the
      play makes no story for it". All of the texts above say the opposite: a later slice that
      includes a feature again gets its own story. In Garura's model, 21 of the 23 features that
      name an issue name a closed Story, so the rebuild for BI-1 will make no story for any of
      them that its slices hold.
    why_it_matters: >
      An accepted ADR and the ontology that disagree mislead the agents that read them. A slice
      that needs new work on a built feature (a new surface for it, for example) gets no story
      for that work, so no builder is given it.
    this_decision_does: >
      The keeper marks ADR 048 §3 and ADR 049 §2 as amended in part for this case, and lists the
      ontology lines for /specify-ontology.
    you_decide: >
      Keep the two extra amendments as written, or narrow the closed rule (for example, a closed
      story counts as built only when it was filed for the same slice) and drop them.

  - point: PR #1047 says the opposite of this record on a closed story, and lacks two of its checks
    what_and_where: >
      PR #1047, branch feature/1025-shape-plan-reuses-open-story:
      core/components/plays/shape-plan/reference/ice.md lines 20 to 31 (C3), 88 to 91 (F14) and
      198 to 201 (REC14); core/components/plays/shape-plan/scripts/find_work_items.py lines 77 to
      79 and 140 to 147; core/components/plays/shape-plan/scripts/render_brief.py lines 42 to 45;
      the PR's description ("If a named issue is missing, closed, not a Story ... the run stops").
    detail: >
      (1) C3, F14, REC14 and find_work_items.py lines 77 to 79 stop the run on a closed issue
      ("the model names #N as the story of fn-..., but #N is closed"). This record says a closed
      issue means the feature is built. (2) Nothing checks for a feature in two slices of one
      plan. (3) render_brief.py says the story "leaves any other parent" but does not name that
      parent. (4) find_work_items.py checks the model's issue (lines 140 to 143) before it skips
      a feature whose ICE is not ready (lines 144 to 147), so a not-ready feature with a closed or
      missing issue still stops the run, though it never takes the story.
    why_it_matters: >
      With (1) as it is, the rebuild for BI-1 stops on any slice that holds one of the 21
      features whose model issue is a closed Story. The PR would land a play that disagrees with
      the accepted record.
    this_decision_does: >
      Nothing in the PR. It states the rule the PR must follow, and the ICE impact names the lines
      to change.
    you_decide: Whether PR #1047 is changed to match before it lands, through /fix-play, in the same change.

  - point: One issue for each feature cannot name a story in each epic, so a second plan can take a story from the first
    what_and_where: >
      The Feature kind's rule "It can be in more than one slice" (ontology, Feature, Rules); the
      model's `issue`, one value on each feature's spine entry; the brief's stop for "a feature
      that sits in two slices of one plan".
    detail: >
      The stop covers two slices of one plan only. When plans exist again, a feature can sit in a
      slice of plan A and a slice of plan B. If plan A is rebuilt first, its epic takes the open
      story. When plan B is then made with no plan file, the model still names that story, so
      /shape-plan moves it from plan A's epic to plan B's. Plan A's file and its epic's
      feature-to-story map then name a story that sits under another epic. The spine has no
      slices today, so this does not happen in the BI-1 rebuild.
    why_it_matters: >
      Plan A loses its story with no error. The person sees the move in plan B's brief, but
      nothing says it belongs to another plan.
    this_decision_does: Nothing beyond the brief. It shows the move and its old parent before the yes.
    you_decide: >
      Whether a story that already sits under another plan's epic also stops the run, or the
      shown move is enough.

  - point: /shape-plan never writes the model's issue back, so the next rebuild finds only what other plays wrote
    what_and_where: >
      /shape-plan's description ("Writes only the plan file, the epics and the stories; nothing
      in the evals folder or the product model"); the writers of a feature's `issue` today:
      link-model-part (link_part.py lines 340 to 341 and 432 to 435) and /reshape-plan through it
      (ADR 062); core/components/memory/standards/schemas/product-os/spine.yaml, `features`
      entry, lines 103 to 121, which has no `issue` field.
    detail: >
      216 of Garura's 239 features name no issue. A story that /shape-plan files is named in the
      plan file and the epic's map, never on the feature's model entry. If the plan files are
      lost again, the model route finds none of those stories. In Garura's model the field also
      came from history: each of the 23 names the issue the feature was first found from, which
      happens to be a Story.
    why_it_matters: >
      The route protects only the stories some other play named. A person reading "the model
      holds the story" would trust it more than it can carry.
    this_decision_does: >
      It gives the field its meaning, the Story filed for that feature. It does not make
      /shape-plan write it. The ontology and the spine schema get the field through
      /specify-ontology.
    you_decide: Whether writing the story back to the model becomes later work for /shape-plan, or stays out.

  - point: Using the two open stories moves them out of an open Feature-type issue
    what_and_where: >
      #725 ("Needs" and "identified by" link capabilities) and #726 (Domains link to business
      intents and capabilities, outside the plan tree), named by fn-725 and fn-726; both sit under
      #723 (Link the product model: needs, identified by, and loose domains), an open issue of
      type Feature whose parent is #11.
    detail: >
      #723 holds #724 (closed Story), #725 (open Story), #726 (open Story), #597 (closed Story)
      and #694 (open Chore). The ontology's Plan kind calls an issue of type Feature a feature
      item, a group of stories inside one epic. If the BI-1 rebuild holds fn-725 or fn-726, the
      story leaves #723, which keeps two closed stories and a chore.
    why_it_matters: >
      #723 then reads as a group with no open story, and whoever reads it may think its work is
      done.
    this_decision_does: It shows each move, with #723 as the parent left, before the yes.
    you_decide: Nothing now; what happens to #723 is decided when the rebuild shows the move.

  - point: The brief does not say whether the epic's map names a closed story, and the eval follows the map
    what_and_where: >
      The Epic kind's feature-to-story map ("For each feature of its slice, the story that
      delivers it"); ADR 057 §2 (one story file for each story of the slice's epic) and §3 (the
      stories in the order of the map); /shape-plan D1.
    detail: >
      "Leaves the closed one as it is" says the closed story is not moved. It does not say
      whether the new epic's map names it. If the map names no story for that feature,
      /design-eval writes no story file for it, so the slice's eval does not test a feature the
      slice still needs end to end.
    why_it_matters: >
      A slice can pass its eval while a built feature it relies on is broken, and no one sees the
      gap.
    this_decision_does: Nothing; the brief leaves it open.
    you_decide: >
      Whether the epic's map names the closed story (as delivered) or names the feature as built
      with no story.

work_this_creates:
  - After acceptance, the forward pointers on ADR 056 (§2), ADR 048 (§3) and ADR 049 (§2), and the ADR index rebuilt.
