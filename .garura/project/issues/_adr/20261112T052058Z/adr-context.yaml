    file: docs/adr/056-an-epic-and-a-story-are-marked-by-their-issue-type-with-no-label.md
    part: >
      §2, "A play finds an epic or a story by the plan file", for a story only: when the plan
      file marks no story for a feature, a play finds it by the issue the feature's entry in the
      product model names, which must be of type Story. An epic is still found only by the plan
      file, and a play still never finds an epic or a story by its title.
    why: The brief names it. §2 says the plan file's `represents` mark is the only way.
  - adr: "048"
    file: docs/adr/048-the-product-model-and-the-work-are-two-layers.md
    part: >
      §3, the second bullet, the sentence "There is one story for each feature in each epic":
      a feature whose model-named story is closed is already built, and the slice's epic gets
      no story for it.
    why: >
      Keeper's judgment, not named in the brief. The brief's closed rule ("the play makes no
      story for it") is an exception to this sentence. The rest of §3 stands.
  - adr: "049"
    file: docs/adr/049-a-slice-is-shaped-then-planned-then-given-its-eval.md
    part: >
      §2, the words "one story for each feature of the slice": not for a feature whose
      model-named story is closed.
    why: Keeper's judgment, not named in the brief, for the same reason as ADR 048 §3. The rest of §2 stands.

