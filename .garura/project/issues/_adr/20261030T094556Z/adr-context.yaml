ice_impact: >-
  /update-plan's ICE (C2, C5, C7, F2, F3, S3) holds the cut, written in #720 on this branch: it
  cuts a plan's branch, main first, as the one write before the person's approval, and an abort
  undoes it. start-change's C9 and S5 do not change now; when #989 is built they change in
  meaning: start-change cuts the plan's branch through plan_branch.py, and main's plan file reads
  In Progress with the branch named. The ontology's Plan kind (v14, rule line 622) already says
  managing a plan may cut its branch and still never merges a branch or touches code; line 623
  makes the cut the one change to a plan's status a person did not type. No product agent's ICE
  changes: no product agent reads branches. Read from the source ontology, because the memory
  tool's copy (Phoenix memory, version 4) has no Plan kind.

