amends:
  - adr: "060"
    file: docs/adr/060-a-plans-branch-merges-into-main-when-the-plan-pauses.md
    part: >-
      Decision §3 "When work on the plan starts again, a new branch is cut from main" — its
      sentence "The next start-change for an issue in the plan finds no plan branch and cuts a new
      `plan/<plan-id>/base` from the latest main": the play that starts the plan's work cuts it
      (/update-plan now, start-change once #989 is built), through the plan tool's plan_branch.py,
      main's plan file first. Its ICE impact's sentence "No product agent reads branches (line
      598: managing a plan never touches branches or code)": managing a plan may now cut the
      plan's branch; it still never merges a branch and never touches code. And, in "What this
      changes", the line "start-change: C9, a plan's branch is cut from the latest main when work
      on the plan starts": it stands until #989 is built, then start-change cuts through the same
      script. §1, §2, §4 and §5 stand: the branch is still cut from main when work starts, merges
      into main when the plan pauses, is held back only to keep main working, and there are no
      detour plans.
    pointer_for_the_play: >-
      amended in part by ADR 061: §3's "The next start-change ... cuts a new plan/<plan-id>/base"
      and its ICE impact's "managing a plan never touches branches" — the play that starts a
      plan's work cuts its branch through plan_branch.py, main's plan file set to In Progress first

