for_the_accepter:
  - point: Until #989 is built, start-change still cuts a plan's branch its own way, and that cut leaves main's plan file as it was
    what_and_where: >-
      start-change's intent, core/components/plays/start-change/reference/ice.md, C9 (lines 31-36)
      and S5 (lines 95-99); its script core/components/plays/start-change/scripts/setup_branch.py
      (lines 107-108 push `plan/<P>/base`); issue #989 (open, "start-change starts a plan on its
      own: it cuts the plan's branch from main, with no story branch").
    detail: >-
      C9 still reads "A plan's branch is created only when work on the plan starts — by the first
      start-change for an issue in it, cut from the latest main". Today setup_branch.py cuts
      `plan/<P>/base` straight from main and does not call plan_branch.py. It writes nothing in
      main's plan file, so the status stays what it was (for example Paused or Not Started) and
      `branch` stays null. The ontology v14 (line 627) says main's copy names the branch. So
      there are two ways to cut a plan's branch until #989: /update-plan's (main first, the file
      names the branch) and start-change's (the file says nothing). C9's word "only" is also no
      longer true: /update-plan cuts too.
    why_it_matters: >-
      A person who starts a plan's work with start-change sees, in /list-plans and /show-plan
      (they read the plan files only), a plan with no branch and the old status while its branch
      exists. A later /update-plan finds the branch in git and switches to it, so it does not fix
      main's file either.
    this_decision_does: >-
      records that start-change will cut through plan_branch.py once #989 is built, and leaves
      C9, S5 and setup_branch.py as they are now (the brief: "start-change's ICE C9 follows when
      #989 is built").
    you_decide: >-
      whether C9 and setup_branch.py wait for #989 as the brief says, or C9's "only ... by the
      first start-change" is reworded now (for example "by the first start-change or
      /update-plan").
  - point: "ADR 060's promise on the plan file's branch field is half kept — the cut writes the name, but nothing writes `branch: null` when a plan pauses"
    what_and_where: >-
      ADR 060, the point "Recorded on #730 — nothing writes a plan file's branch field yet" (lines
      75-81); the comment on #730 of 2026-10-29 ("When a plan's branch lands on main (the plan
      pauses), the field becomes null; when start-change cuts a new plan branch, it gets that
      name"); core/tools/plan/plan_branch.py (lines 118-133 write the field); merge-change's
      scripts and update-plan's scripts.
    detail: >-
      plan_branch.py now writes `branch: plan/<id>/base` on main when it cuts. No script writes
      `branch: null` when a plan's branch lands on main: a search of core/tools/plan/,
      core/components/plays/merge-change/scripts/ and core/components/plays/update-plan/scripts/
      finds no such write, and update-plan's ICE has no step for it. #730 is open on GitHub,
      while plan 717's file on this branch (its `updated:` line) lists #730 as Done.
    why_it_matters: >-
      After a pause, main's plan file still names a branch that was deleted, until a person edits
      it by hand — the drift plan 788's file showed (ADR 060). The cut itself is safe: `go`
      decides from git, not from the file, so a stale name does not stop it.
    this_decision_does: nothing — it is about the cut, not the pause.
    you_decide: "whether writing `branch: null` on a pause stays owed under #730, or becomes its own issue."
  - point: Agents still cannot read the Plan kind through memory — Phoenix memory's ontology is version 4 (#949)
    what_and_where: >-
      Phoenix memory, standards/schemas/product-os/ontology.md (the only tier that holds it,
      found with find --every-tier); the source core/components/memory/standards/schemas/product-os/ontology.md
      is version 14; issue #949 (open).
    detail: >-
      the memory tool returns version 4 (updated 2026-10-18), with no Plan kind and no branch
      rule. The source is version 14 (2026-10-30), whose Plan kind holds this cut (line 622) and
      its status exception (line 623). #949 tracks Phoenix memory falling behind the source in 60
      places.
    why_it_matters: >-
      agents read the ontology only through the memory tool, so none sees that managing a plan
      may now cut its branch. This ADR's ICE impact was read from the source file, as a file the
      decision changes, not from memory.
    this_decision_does: nothing — the gap is outside this decision.
    you_decide: nothing now; it is owed in #949.

