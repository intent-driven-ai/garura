- category: harness
  severity: P3
  path: core/components/plays/create-play/SKILL.md
  basis: 'ADR 047 section 6; issue #760 Done when (needs read between capabilities)'
  message: The rewritten paragraph tells plays to copy the script and call it on the
    ICE, but never mentions passing --done. In the script, when --done is absent open_needs
    returns still_open=None, no stop is raised, and a capability with open needs is
    answered ready. A play following the paragraph literally starts work on an ICE
    whose needs may be open. (Behaviour is inherited from v5, but ADR 047 makes it
    a named not-ready stop.)
  status: null
- category: harness
  severity: P3
  path: core/components/plays/create-play/references/check_ice_workable.py
  basis: ADR 047 section 6; ontology.md ICE ready check
  message: With no --done list, needs_open is null and the answer can be "ready" with
    an empty gaps list. Nothing in stops or gaps says that needs were not checked,
    so the caller cannot tell "needs all done" from "needs not examined".
  status: null
- category: harness
  severity: P4
  path: core/components/plays/create-play/references/check_ice_workable.py
  basis: ADR 047 section 7; design.md change 1 (parts)
  message: read_parts treats any non-blank line under a heading as content, so a section
    holding only an HTML comment or template placeholder passes as present. Consistent
    with section 7 (never judge), but worth recording as accepted behaviour; the richness
    report (all lines missing -> light) is the only signal.
  status: null
- category: harness
  severity: P4
  path: core/components/plays/create-play/references/check_ice_workable.py
  basis: 'plan/756/base spine.yaml comment above ices; issue #760 Done when last bullet'
  message: 'The switch is `spine.get("ices") is not None`, so an explicit empty `ices:
    []` selects the v6 path and answers every capability and functionality "not ready:
    has no ICE". This matches the letter of "has an ices list" but a model that writes
    an empty list while mid-migration would stop all work. Acceptable under ADR 047
    (a part with no ICE is not ready); confirm intended.'
  status: null
- category: harness
  severity: P4
  path: core/components/plays/create-play/SKILL.md
  basis: 'base SKILL.md paragraph (unchanged intent); issue #760 Done when (exit 2
    = unknown node or unreadable input)'
  message: The paragraph says "a non-zero exit skips that node". Exit 2 (unreadable
    spine, unknown node) is an input fault, not a not-ready answer, yet it is treated
    the same as exit 1. Carried over from the base wording; not introduced by this
    change.
  status: null
