- id: QR-01
  category: executable-code (data-safety read)
  severity: P2
  file: core/tools/plan/plan_branch.py
  line: 171
  what: 'The "uncommitted work" check skips every file under --ignore (the issue''s short-term folder), including files already
    staged. The cut then runs `git commit -m` with no path limit, so a staged file under an ignored folder is committed to
    main and pushed. Reproduced in a scratch repo: staged stm/note.md went into the "chore(plan): plan 5" commit on main.
    Fix: commit with `-- <plan file>` (or fail on'
  basis: 'review/code rubric: safe handling of destructive/irreversible operations; pr.md P2 (error-handling violation)'
  source: quality-findings.yaml reviewed_findings
- id: QR-02
  category: executable-code (data-safety read)
  severity: P2
  file: core/tools/plan/plan_branch.py
  line: 175
  what: 'The cut is not all-or-nothing. After `git commit` on main, a rejected `git push main` raises Stop. The Stop record
    has main_commit null and back_to null, so `abort` has no commit to revert and `back` has no branch to return to. Reproduced
    with a remote whose pre-receive hook rejects: the session stays on main, local main is one commit ahead of origin/main,
    and the record says action=stop. The same'
  basis: 'review/code rubric: safe handling of destructive/irreversible operations, error handling; pr.md P2'
  source: quality-findings.yaml reviewed_findings
- id: QR-03
  category: executable-code (data-safety read)
  severity: P2
  file: core/components/plays/update-plan/scripts/commit_plan.py
  line: 89
  what: 'The docstring says it "stages only the plan file, the model files ... and the changed files in the plan''s own short-term
    folder". But the commit is `git commit -m` with no pathspec, and the "nothing staged" test is `git diff --cached --quiet`
    over the whole index. Anything the person already staged (any path) is committed and pushed with the plan commit. Fix:
    `git commit -m <msg> -- <files>` and t'
  basis: 'review/code rubric: safe handling of destructive/irreversible operations; pr.md P2 (a script that says it stages
    only X must stage only X)'
  source: quality-findings.yaml reviewed_findings
- id: QR-04
  category: executable-code (data-safety read)
  severity: P2
  file: core/components/skills/track-plan-changes/scripts/track_changes.py
  line: 104
  what: 'The docstring says a rerun "never makes an issue twice". That holds only when the record file is written after the
    create. Two gaps: (1) tracker.HostTracker.create raises TrackerError when create-issue-typed answers with a non-number,
    after the issue already exists on GitHub, so the op is recorded as failed and a rerun creates a second issue; (2) a crash
    between the GitHub write and write_json lea'
  basis: 'review/code rubric: idempotency of external writes; pr.md P2 (error handling); BE-13 / CODE-27 (retry, fallback)
    are the nearest taxonomy rows'
  source: quality-findings.yaml reviewed_findings
- id: QR-05
  category: executable-code (data-safety read)
  severity: P3
  file: core/components/skills/track-plan-changes/scripts/track_changes.py
  line: 166
  what: 'A rerun skips each op id found in the existing --out record, with no check that the record belongs to this approved
    list. A stale github-record.json from an earlier session in the same folder (ids e1, e2 ...) makes the new session skip
    its writes and report ok. The approval is bound to the list by sha256, the record is not. Fix: store list_sha in the record
    and refuse on a mismatch.'
  basis: 'review/code rubric: deterministic where it claims to be; pr.md P3'
  source: quality-findings.yaml reviewed_findings
- id: QR-06
  category: executable-code (data-safety read)
  severity: P3
  file: core/tools/plan/plan_branch.py
  line: 188
  what: '`abort` trusts the record file: it deletes the branch named in rec["plan_branch"] here and on the remote (`push --delete`)
    without checking it equals plan/<plan>/base. The extra-commits guard (cut..ref) is the only protection. Also, `git revert`
    of the cut can conflict if a later main commit touched the plan file; the half-done revert is left in place (no `revert
    --abort`), and a rerun after a fai'
  basis: 'review/code rubric: safe handling of destructive/irreversible operations; pr.md P3'
  source: quality-findings.yaml reviewed_findings
- id: QR-07
  category: executable-code (data-safety read)
  severity: P3
  file: core/components/plays/update-plan/scripts/commit_plan.py
  line: 80
  what: '`files` from the model record are passed to `git add` as written; nothing checks they stay inside the repo or the
    model folder. The records-dir list is parsed from `git status --porcelain` without -z, so a renamed ("a -> b") or quoted
    (non-ASCII) path becomes a bad pathspec and `git add` fails after the message is built (the run then stops with exit 2,
    nothing committed).'
  basis: 'review/code rubric: safe handling of destructive/irreversible operations; pr.md P3'
  source: quality-findings.yaml reviewed_findings
- id: QR-08
  category: executable-code (data-safety read)
  severity: P4
  file: core/components/skills/track-plan-changes/scripts/tracker.py
  line: 163
  what: '"not found" in any error text is read as "the tracker has no such issue". An unrelated failure that contains those
    words (for example "repository not found") would be reported as a missing issue instead of a tracker error. Safe by luck:
    later ops still raise on a missing issue.'
  basis: 'review/code rubric: no stray debug output / error handling; pr.md P4'
  source: quality-findings.yaml reviewed_findings
