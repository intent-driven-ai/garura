          command: node --check core/tools/lint-components/index.js
          note: Record "not installed" for eslint; the syntax check is the only mechanical JavaScript check.
        - name: check-pr-quality (run by quality-auditor; pr.md taxonomy rows SEC-*, CODE-*, ARCH-*, BE-*, PERF-*, DATA-*)
          command: python3 .claude/skills/check-pr-quality/scripts/scan_taxonomy.py --taxonomy .garura/project/issues/720/context/memory/standards/rules/pr.md --diff <working>/pr.diff --paths <changed-paths file> --out <quality-findings.yaml>
      runnable_checks:
        - 'Review the data-safety and idempotency paths hard: plan_branch.py (branch cut, commit on main, push, revert of main plan commit, abort deleting a branch), commit_plan.py (git commit of the plan files), write_plan_changes.py, track_changes.py and tracker.py (GitHub writes) touch git, the filesystem and an external service.'
        - 'Rubric: error handling, function size, no stray debug output, no secrets, no machine path or user name, safe handling of destructive or irreversible operations, deterministic where it claims to be.'

