      - core/components/skills/track-plan-changes/SKILL.md
    playbook: review/harness
    layers: [1, 2]
    design_grounding_required: true
    treatment:
      reviewer: human (the design) + tool (conformance)
      linters:
        - name: lint-components (source layout; the repository holds Garura's source)
          command: node .garura/core/tools/lint-components/index.js --layout source --target core/components
        - name: lint-play (one changed play, update-plan)
          command: python3 .garura/core/tools/lint-play/lint_play.py core/components/plays/update-plan/SKILL.md --next-map .garura/project/issues/720/context/templates/standards/rules/pipeline-next.md
      runnable_checks:
        - 'Only a violation whose file is in changed_paths is a finding; count the other violations and record the count as "there before".'
        - 'When a tool is not installed record "not installed"; when it crashes record "did not run: <first error line>". Neither is a pass.'
        - 'ICE-source rule applies (the repository holds the plays source): the intent of update-plan must trace to core/components/plays/update-plan/reference/ice.md, not to a hand edit of SKILL.md. Check the SKILL.md intent fingerprint against the ICE source.'
      layer_2: >-
        Reconstruct the harness principles from committed sources only (docs/philosophy/**,
        docs/adr/**, the glossary, standards/rules/** read through the memory tool, and the
        base-ref versions of the edited agents and skills via git show plan/717/base:<path>),
        never from the branch's new prose and never from the build design spec the branch adds.
        Check agent-first delegation, JSON contracts, play orchestrates / skills produce /
        scripts do mechanical work, ICE-source discipline.

