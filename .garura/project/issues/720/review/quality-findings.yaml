# --- Added by quality-auditor after the scan (round 2). The scan above is byte-for-byte scan_taxonomy.py output ---
# Same limit as round 1: the scan sees only core/tools/** as runtime code (plan_branch.py, test_plan_branch.py
# and now lint-components/index.js). Everything under core/components/** is garura-prose, so no grep or
# code-path row fires on the update-plan scripts, the track-plan-changes scripts or link_part.py. The
# review/code rubric was applied by reading the five data-safety paths again, as round 1 did, and by
# running two small checks in a throwaway repo outside the project (a plan file with no status line; an
# abort whose remote refuses the branch delete).
# What is new in the scan against round 1: lint-components/index.js is in the diff now, so the path-only
# rows (ARCH-02, ARCH-03, ARCH-08, CODE-03, CODE-04, CODE-09..CODE-15, CODE-17..CODE-19, FE-08) fire on it
# as they do on the two plan files, and CODE-22 fires twice on it. Nothing else in the scan changed except
# line numbers (plan_branch.py grew by about 60 lines).
scan_notes:
  - finding: "BE-12 at core/tools/plan/plan_branch.py:146 and :232"
    note: "'fetch' here is `git fetch`, not an HTTP call; no timeout-config question applies. False positive."
  - finding: "DATA-17 (P2) and DATA-18 (P1) at core/tools/plan/test_plan_branch.py:43"
    note: "'email' is the throwaway git identity of a test repo (user.email test@example.com). No personal data and no encryption question. False positive. This is the only P1 in the scan."
  - finding: "BE-13 and CODE-27 at core/tools/plan/plan_branch.py:63; BE-23 at :63 and :66"
    note: "'retry' and 'lock' here are the wait for git's own index.lock (8 tries, 2 seconds), bounded, with no service call and no shared state; a retry-policy or lock-scope question does not apply. False positive."
  - finding: "CODE-25 at core/tools/plan/plan_branch.py:175, :179, :193, :294, :308, :314, :326"
    note: "Read each handler. None is bare and none swallows an error: 175 and 179 re-raise as Stop with a message; 193 cleans up and re-raises; 294, 308, 314 and 326 print the record with the error and return a non-zero exit. No finding."
  - finding: "CODE-22 at core/tools/lint-components/index.js:95 and :96"
    note: "The rule asks about capitalised names. The scanner matches case-insensitively, so the lowercase `here` and `relative` match `[A-Z][a-z]+`. False positive."
  - finding: "CODE-03, CODE-04 (lint, format) on plan_branch.py, test_plan_branch.py and index.js"
    note: "Path-only rows that ask for a lint or format run. ruff 0.15.20 with defaults ran clean on the changed non-test Python, and `node --check` passes on index.js with the 6 tests of the linter green (runnable-checks.txt). No eslint or prettier is committed or installed, so JavaScript has a syntax check and tests only; it was not linted or format-checked."
  - finding: "ARCH-02, ARCH-03, ARCH-08, CODE-09..CODE-15, CODE-17..CODE-19, CODE-13, FE-08 (path-only) on the same three files"
    note: "Path-only rows that ask for a human or tool judgment (cycles, complexity, naming, duplication, bundle size). They are not defects by themselves. The one real instance found is the copied git() helper, reported as CODE-13 in reviewed_findings. FE-08 (bundle size) does not apply to a Node command-line tool."
reviewed_findings:
  - status: fixed
    basis: "round 1 P2: safe handling of destructive/irreversible operations"
    severity: P2
    file: core/tools/plan/plan_branch.py
    function: go / uncommitted
    line: 83
    artifact_type: runtime-code
    evidence: >-
      uncommitted() now counts a staged path anywhere, whatever --ignore says (line 96 `staged = code[0] not in " ?"`,
      line 98 `if staged or not ignored`), so a staged file stops go with exit 3 before any commit. The cut commit
      is also limited to the plan file (lines 187-188, `commit ... -- path`). Test:
      test_a_staged_file_stops_it_even_in_an_ignored_folder. The core/tools/plan suite (33 tests) passes.
  - status: fixed
    basis: "round 1 P2: the cut is not all-or-nothing; abort cannot undo go"
    severity: P2
    file: core/tools/plan/plan_branch.py
    function: go
    line: 193
    artifact_type: runtime-code
    evidence: >-
      A stop after the commit now takes the commit back (`reset --soft HEAD~1`, then `restore --staged --worktree`,
      lines 194-197) and returns to the starting branch (line 200); a stop before the commit restores the file
      (line 199). A plan file that is not valid YAML is caught and named (lines 177-180). Tests:
      test_a_rejected_push_of_main_puts_everything_back (a pre-receive hook rejects; main, status and branch are
      as before) and test_a_plan_file_that_cannot_be_read_stops_cleanly. I also ran a plan file with no `status:`
      line: it stopped with exit 2, the plan file was restored byte for byte, and the session stayed on its branch.
  - status: fixed
    basis: "round 1 P2: a script that says it stages only X must stage only X"
    severity: P2
    file: core/components/plays/update-plan/scripts/commit_plan.py
    function: main
    line: 99
    artifact_type: garura-prose
    evidence: >-
      The staged test and the commit are both limited to the named files: `git diff --cached --quiet -- *files`
      (line 100) and `git commit ... -- *files` (line 105). Test: test_the_commit_takes_only_its_own_files
      (a file a person staged stays staged and out of the commit). The 21 tests of the update-plan scripts pass.
  - status: fixed
    basis: "round 1 P2: idempotency of external writes"
    severity: P2
    file: core/components/skills/track-plan-changes/scripts/track_changes.py
    function: run_op
    line: 113
    artifact_type: garura-prose
    evidence: >-
      A create now writes a marker line into the issue text (line 117, 121-122) and looks for it first (line 118);
      when the create itself raises, it looks once more before it fails (lines 123-129). The create is one call
      that also sets the parent (create-issue-typed in platform_adapter.py, one GraphQL createIssue with the parent
      id), so a found issue already has its parent. Test:
      test_a_run_that_died_before_its_record_never_makes_the_issue_twice. The gap that is left is the new
      finding on find_marked below.
  - status: fixed
    basis: "round 1 P3: the record is not tied to the approved list"
    severity: P3
    file: core/components/skills/track-plan-changes/scripts/track_changes.py
    function: apply
