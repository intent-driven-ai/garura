scan_notes:
  - finding: "ARCH-02, CODE-03, CODE-04, CODE-14 (P2) and the path-only P3/P4 rows on core/tools/plan/plan_branch.py, core/tools/plan/test_plan_branch.py, core/tools/lint-components/index.js, and core/tools/lint-components/lib/rules/structural.js and core/tools/lint-components/test/dmw-declared-exception.test.js"
    note: "Path rules that ask for a tool or a person to judge cycles, lint, format, complexity, naming and duplication. Not defects by themselves. Read in round 4 and unchanged in rounds 5 and 6 (the scan output is the same as round 4's: 1 P1, 23 P2, 67 P3, 29 P4; the files behind it did not change): plan_branch.py imports the standard library and yaml only; the new Node test requires Node's own modules and ../lib/rules/structural; no cycle. ruff (default rules) is clean on every changed non-test Python file of the list given for this round; two findings in changed test folders (an unused import in test_link_part.py, a lambda assignment in test_plan.py) were already there before this round's commits. `node` runs the new test (3 pass); no eslint is committed, so JavaScript is run, not linted."
  - finding: "BE-12 (P2) at core/tools/plan/plan_branch.py:150 and :236"
    note: "False positive, same as rounds 2 and 3: `fetch` is `git fetch`, not an HTTP call."
  - finding: "DATA-17 (P2) and DATA-18 (P1) at core/tools/plan/test_plan_branch.py:43"
    note: "False positive, same as rounds 2 and 3: line 43 sets user.email to test@example.com in a throwaway test repository. No personal data. The one P1 of the scan is not a defect."
  - finding: "BE-13 and CODE-27 at core/tools/plan/plan_branch.py:67; BE-23 at :67 and :70"
    note: "False positive, same as round 3: the wait for git's own index.lock, 8 tries of 2 seconds, no service call, no shared state."
  - finding: "CODE-25 at core/tools/plan/plan_branch.py:179, :183, :197, :318, :332, :338, :350"
    note: "Each handler re-raises as Stop, restores the plan file and re-raises, or prints the error and returns a non-zero exit. None swallows an error. The new abort branch (lines 247-272) uses check=False only to read a return code and acts on it."
  - finding: "OPS-09 at core/tools/plan/plan_branch.py:278 and OPS-09/OPS-10 at core/tools/lint-components/test/dmw-declared-exception.test.js:10 and :27"
    note: "False positives. Line 278 is a variable named `log` that holds the output of git log. The test lines are the [PASS] report lines of a plain Node test, the same as the other tests in that folder."
  - finding: "CODE-22 at core/tools/lint-components/index.js:95 and :96, and in the new test"
    note: "False positive: the rule asks about capitalised names; the scanner matches case-insensitively."
  - finding: "TEST-02, TEST-03, TEST-05..TEST-08, TEST-22 on core/tools/lint-components/test/dmw-declared-exception.test.js"
    note: "Path-only rows for a judgment on tests. Read: the test has three assertions that pin the exception to /update-plan and show another play still fails twice; it makes its own temporary folders and does not clean them up (a small leak in the operating system's temp folder)."
  - finding: "DOC rows on core/tools/plan/README.md"
    note: "The README changed this round (5 lines added, 3 removed) to describe the uncommitted check on every path and the second abort; it matches the code read. No new documentation gap found."
  - finding: "The update-plan scripts, the track-plan-changes scripts, link_part.py and the shape-slice scripts are classified garura-prose by the scan, so no grep row fires on them"
    note: "They were read by hand for this round (reviewed_findings below), and run: plan tool 35 tests, update-plan 37, track-plan-changes 13, link-model-part 22, shape-slice scripts (five test files) all pass, linter exception test 3 pass."
  - finding: "The HF-12 fix files (plan_session.py, session_files.py, check_agreement.py, commit_plan.py, test_update_plan_scripts.py) are garura-prose to the scan, so no grep row fires on them"
