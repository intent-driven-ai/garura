findings:
  - id: MEM-1
    status: fixed
    severity: P2
    file: core/components/memory/standards/schemas/product-os/ontology.md
    line: 622
    also_lines: [623, 596]
    title: "The Plan kind makes /update-plan cut the plan's branch; ADR 060 and start-change C9 said the opposite, and no record covered the change"
    principle_violated: G3
    basis: >-
      Round 2 named one gap: no decision record says /update-plan may cut the plan's branch, while ADR 060
      (base) says the next start-change cuts it and its ICE impact says managing a plan never touches branches.
    committed_source: >-
      docs/adr/060-... (base) Decision 3 and ICE impact; core/components/plays/start-change/reference/ice.md
      (base) C9; docs/standards/harness-standard.md (base) principle 8
    evidence_fixed: >-
      docs/adr/061-a-plans-branch-is-cut-by-the-play-that-starts-its-work-main-first.md is in the diff with
      Status Accepted, a named decider (the product owner) and a date. It carries an "Amends: ADR 060" line
      naming exactly the two sentences that clashed (Decision 3's start-change sentence and the ICE impact's
      "never touches branches or code"), and says the harness standard's principle 8 stays true (it names no
      play for the cut; checked against the base file). ADR 060's Status line carries the forward pointer to
      it, and docs/adr/_index.md has the 061 row. The adr lint (adr-lint.txt) is valid with no problems and
      all 18 paths the ADR names exist. The ADR's cited ontology lines (622, 623, 627, 636) match the file.
      The ontology log line and the Plan kind now rest on an accepted record. The gap MEM-1 named is closed.
    residual: >-
      ADR 061 itself records that start-change's C9 ("only ... by the first start-change") and S5 stay as they
      are until #989 is built, and lists this in its "For the Person Who Accepts This" section as a decision
      for the person. That is a recorded, owned divergence in the harness category, not an unrecorded one, so
      it is not raised again here (the harness fan-out owns C9).

  - id: MEM-2
    status: stands
    severity: P3
    file: core/components/memory/standards/schemas/product-os/ontology.md
    line: 566
    also_lines: [141, 168, 486, 522]
    title: "The ontology fixes a new Thin line, but memory and the plays that write or read it still hold the old line"
    principle_violated: G4
    basis: >-
      Base ontology v11 fixed one Thin line, "Thin: proposed by `/shape-slice` from the person's answers;
      deepen with `/discover-capabilities`." Base spine.yaml line 144 repeats it; base slice_check.py line 67
      says it "reads exactly this text, so any other wording reads as drift" (link_part.py line 85, in this
      diff and unchanged on that point, says the same and still writes the old line, as do
      persist_fills.py and write_hidden_file.py). v14 changes the fixed line to "Thin: proposed from the
      person's words; deepen with `/discover-capabilities`." and says an old-line page "is still thin" and its
      old words are drift for the Alignment loop. So /update-plan, which adds thin features through
      link_part.py, will write what v14 calls the old line.
    committed_source: >-
      core/components/memory/standards/schemas/product-os/spine.yaml (base) line 144;
      core/components/plays/shape-slice/scripts/slice_check.py (base) line 67; ontology.md (base) Thin line
    fix: >-
      Update spine.yaml line 144 (memory, in this category) in the same change, and either move the writers to
      the new line or have the ontology keep the one text it already fixes. The writers are for the harness and
      code graders.

  - id: MEM-3
    status: stands
    severity: P3
    file: core/components/memory/standards/schemas/product-os/ontology.md
    line: 594
    also_lines: [626, 892]
    title: "Plan Status values changed (was active, done or dropped), but the ontology holds no drift note for the old value and a committed play still writes it"
    principle_violated: G1
    basis: >-
      edit-ontology ICE C3/F3: an existing kind that changes meaning is logged, and the rest of the model must
      still read the same words the same way. The log names the change; but rule 626 gives a drift note only
      for the item kind `issue` and for items under other parents, not for `status: active`. Base shape-plan
      SKILL.md line 339 still tells the play to write a plan file with `status: active`, and base
      shape-eval's tests build plan files with `status: active`. Neither is in this diff.
    committed_source: >-
      core/components/plays/shape-plan/SKILL.md (base) line 339;
      core/components/plays/edit-ontology/reference/ice.md (base) C3, F3
    fix: >-
      Add `active` to the drift note in rule 626 (read as In Progress, never changed unasked), or change the
      writer in the same plan.

  - id: MEM-4
    status: stands
    severity: P3
    file: core/components/memory/standards/schemas/product-os/ontology.md
    line: 625
    also_lines: [21, 87]
    title: "The Plan kind brings back the word 'feature' (item kind `feature`, tracker type Feature) while the glossary says that work type is gone"
    principle_violated: G5
    basis: >-
      Base glossary line 63, Feature: "In the tracker a Story stands for it. Not the old work type 'Feature',
      which is gone." v14 defines a "feature item" as "an issue of type Feature" and gives plan files an item
      kind `feature`, next to the Feature kind. The ontology explains the difference at lines 21, 87 and 625,
      but the glossary is not changed and still says the type is gone. The item kind value `feature` and the
      kind Feature remain one word for two things.
    committed_source: core/grounding/glossary.md (base) line 63
    fix: >-
      Update the glossary (Feature entry, and a "feature item" entry) in this change, or name the item kind
      differently (a group, say) so the word keeps one meaning.

  - id: MEM-5
    status: stands
    severity: P4
    file: core/components/memory/standards/rules/pipeline-next.md
    line: 77
    title: "update-plan is listed under the 'Navigation' heading, and 'The flow' does not name it"
    principle_violated: G7
    basis: >-
      The base map groups rows by loop or lane (line 73 '# Navigation' holds list-focus-issues, list-plans,
      show-plan, which only show). update-plan changes a plan, so it is not navigation. The base 'The flow'
      bullets (lines 26-31) name every other live play by loop; update-plan is in none, and its why-line
      ("reaches main with the plan's other work") holds only once the plan pauses (ADR 060).
    committed_source: core/components/memory/standards/rules/pipeline-next.md (base) lines 26-31, 73-77; docs/adr/060 (base)
    fix: >-
      Put the row under its own heading (for example '# Plan upkeep') and add one flow bullet.

  - id: MEM-6
    status: stands
    severity: P4
    file: core/components/memory/standards/templates/plan-update.md
    line: 156
    title: "The 'landed' screen opens with the branch and commit, not the outcome"
    principle_violated: G8
    basis: >-
      user-facing-voice.md "Signals you've drifted": the opening names a path, class, function or line
      number instead of the outcome. The screen reads "Landed on {plan_branch} (commit {commit}), pushed.",
      then Model, GitHub, Plan, Check. The rule's scope note excludes templates for internal artifacts; this
      one is shown to a person as it stands.
    committed_source: standards/rules/user-facing-voice.md (memory copy, grounding-memory)
    fix: >-
      Lead with what changed for the person, and put the branch and commit on a later line.

  - id: MEM-7
    status: stands
    severity: P4
    file: core/components/memory/standards/templates/plan-update.md
    line: 68
    also_lines: [41, 51]
    title: "The worked screen shows no item kinds, and row 5 reads as a feature item under a story-level item"
    principle_violated: G2
    basis: >-
      Ontology item-kind rule (base Plan kind + the plan-view template, base): the example of a template is a
      real, filled-in instance. Row 5 adds a new feature item "under #720", and #720 sits under #956 with a
      story (#730) under it. The screen does not say what kind #720 is, so a reader cannot tell the example
      keeps the rule 'a feature item sits under an epic'. Low confidence: the kinds may be set in the plan file.
    committed_source: standards/templates/product-ontology.md (base copy) "Example"; standards/templates/plan-view.md (base)
    fix: >-
      Show the kind in the example (for example 'epic #956', 'feature #720') or pick a parent that is an epic.

