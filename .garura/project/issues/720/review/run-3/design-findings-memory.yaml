principles:
  - id: G1
    principle: >-
      An ontology change bumps the version by one, sets the date, adds one log line, changes only the
      kinds the need touches, names no real person, and a changed meaning is logged.
    source: core/components/plays/edit-ontology/reference/ice.md (base) C1, C3, C4, C6, F3, F6, S3
  - id: G2
    principle: >-
      The ontology follows the committed format: questions, kinds with properties/relationships/rules/
      optional States/example, a log.
    source: standards/templates/product-ontology.md (base copy, via memory tool, in the shared memory folder)
  - id: G3
    principle: >-
      A plan's branch is cut when work on the plan starts, by the first start-change; it merges into main
      when the plan pauses; managing a plan was recorded as never touching branches.
    source: core/components/plays/start-change/reference/ice.md (base) C9; docs/standards/harness-standard.md (base) principle 8; docs/adr/060-a-plans-branch-merges-into-main-when-the-plan-pauses.md (base) ICE impact and Context
  - id: G4
    principle: >-
      The ontology fixes the Thin line, and the plays that write or read it use exactly that text.
    source: ontology.md (base) v11 Thin line; core/components/memory/standards/schemas/product-os/spine.yaml (base) line 144; core/components/plays/shape-slice/scripts/slice_check.py (base) line 67
  - id: G5
    principle: >-
      One word means one thing: the Feature kind is one thing a person can do inside a capability; the
      old work type "Feature" is gone.
    source: core/grounding/glossary.md (base) line 63 (Feature)
  - id: G6
    principle: >-
      A template is a settings block read by a named consumer, listed with its consumers in
      templates/_index.md, and the screens it holds are not worded in the play.
    source: standards/templates/plan-view.md (base) and standards/templates/_index.md (base, memory copy grounding-memory/standards/templates/_index.md)
  - id: G7
    principle: >-
      pipeline-next.md is the one map of successors; each play is listed once, under the loop or lane
      it belongs to, and the flow prose names the loops.
    source: core/components/memory/standards/rules/pipeline-next.md (base) lines 1-60 and map headings
  - id: G8
    principle: >-
      A reply to a person leads with the outcome, not with a path, branch or commit.
    source: standards/rules/user-facing-voice.md (memory copy grounding-memory/standards/rules/user-facing-voice.md) "The rule" and "Signals you've drifted"

