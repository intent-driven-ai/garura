      core/components/plays/edit-ontology/reference/ice.md (base) C3, F3
    fix: none

  - id: MEM-4
    status: fixed
    severity: P3
    file: core/grounding/glossary.md
    lines: [63, 64]
    why: >-
      Round 3 found that the ontology brought back the word "feature" (item kind `feature`, tracker type
      Feature) while the glossary said the type is gone. The glossary Feature entry (line 63) now says "Not the
      tracker's issue type Feature: in a plan, an issue of that type is a feature item (below), never this
