    basis: >-
      core/components/memory/standards/schemas/product-os/spine.yaml (base) line 144;
      core/components/plays/shape-slice/scripts/slice_check.py (base) line 67 ("reads exactly this text")
    fix: none

  - id: MEM-3
    status: fixed
    severity: P3
    file: core/components/memory/standards/schemas/product-os/ontology.md
    lines: [594, 892]
    why: >-
      Round 3 asked for a drift note for the old Status value "active", or a change of the writer. The writer is
