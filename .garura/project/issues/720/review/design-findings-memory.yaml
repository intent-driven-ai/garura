    basis: >-
      core/components/memory/standards/rules/pipeline-next.md (base) lines 20-31 and 73-77;
      docs/adr/060-a-plans-branch-merges-into-main-when-the-plan-pauses.md (base)
    fix: Put the row under its own heading (for example "# Plan upkeep") and add one flow bullet.

  - id: MEM-6
    status: stands
    severity: P4
    file: core/components/memory/standards/templates/plan-update.md
    lines: [171, 172]
    why: >-
      Unchanged since rounds 3 to 5 (the line moved from 156 to 171-172 as the file grew). The "landed" screen opens
      "Landed on {plan_branch} (commit {commit}), pushed." It leads with a branch and a commit, not with what
      changed for the person. The screen is shown to a person as it stands, so it is not an internal artifact.
    basis: standards/rules/user-facing-voice.md (memory copy, grounding-memory) "Signals you've drifted"
    fix: Lead with the outcome (what changed in the model, GitHub and the plan), and put the branch and commit on a later line.

  - id: MEM-7
    status: stands
    severity: P4
    file: core/components/memory/standards/templates/plan-update.md
    lines: [46, 47, 56, 57, 71, 72]
    why: >-
      Unchanged since round 4, still so in round 6 (the screen is at lines 46-72). The worked screen shows no item kinds. Row 4 (line 71) puts a new chore under
      #956 and row 5 a new feature under #720, and the screen never says what kind #956 or #720 is, so a reader
      cannot check the example against the ontology item-kind rule (a chore sits under a story; a story sits
      under an epic or a feature item). Low confidence: the kinds may be in the plan file.
    basis: >-
      standards/templates/product-ontology.md (base copy) "Example"; standards/templates/plan-view.md (base)
    fix: Show the kind in the example (for example "epic #956", "feature item #720").

  - id: MEM-8
    status: stands
    severity: P4
    file: core/components/memory/standards/rules/direct-model-write.md
    lines: [152, 153, 154, 243]
    why: >-
      The new exception says "uncommitted work anywhere stops the session when it gets onto the plan's branch",
      and the L-DMW-4 carve-out (lines 240-244) says the clean check "covers the whole tree". The play and the
      tool do not do that: plan_branch.py go is run with --ignore "${stm_base}_plans/" (SKILL.md line 146), and
      SE-3 says "nothing uncommitted outside the session's own folder" (SKILL.md line 152). The product-os tree,
      which the base L-DMW-4 requires clean, is covered, so the guarantee holds, but the rule overstates it, and a
      rule that a linter and a rebuild read should say what is checked.
    basis: >-
      core/components/memory/standards/rules/direct-model-write.md (base) lines 86-89 (step 7, entry: assert the
      product-os tree is clean) and 230-232 (L-DMW-4)
    fix: >-
      Say "uncommitted work anywhere outside the session's own folder", and in the carve-out say the clean check
      covers the product-os tree and the rest of the repository except that folder.

