    basis: core/grounding/glossary.md (base) line 63
    fix: none

  - id: MEM-5
    status: stands
    severity: P4
    file: core/components/memory/standards/rules/pipeline-next.md
    lines: [73, 77]
    why: >-
      Unchanged since rounds 3 to 5. update-plan sits under the "# Navigation" heading (line 73, with list-focus-issues,
