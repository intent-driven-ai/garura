    lines: [596, 622, 623]
    why: >-
      Closed in round 3 (ADR 061 recorded that /update-plan may cut the plan's branch, main first, and amended ADR
      060). Nothing in rounds 4 to 6 reopens it: the ontology Plan kind is byte-identical to round 3 (and to round 5) and no
      committed source it rests on changed.
    basis: >-
      docs/adr/060-a-plans-branch-merges-into-main-when-the-plan-pauses.md (base) Decision 3 and ICE impact;
      core/components/plays/start-change/reference/ice.md (base) C9
    fix: none
    evidence: >-
      Rule at ontology.md line 622 ("When the plan has no branch, it first sets main's plan file to In Progress
      with the branch named, commits that on main, and cuts the plan's branch from that commit") is unchanged
      since round 3. C9 of start-change stays until #989 is built; ADR 061 records that divergence and the
      harness category owns it.

