    status: fixed
    severity: P3
    file: core/components/memory/standards/schemas/product-os/spine.yaml
    lines: [142, 148]
    why: >-
      Round 3 said the ontology fixed a new Thin line while spine.yaml and the writers still held the old one.
      This round the spine comment (lines 142-148) states the new line and that any line starting "Thin:" counts
