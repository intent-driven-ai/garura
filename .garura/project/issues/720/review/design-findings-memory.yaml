principles:
  - id: G1
    principle: >-
      An ontology change bumps the version by one, sets the date, adds one log line, changes only the kinds the
      need touches, names no real person, and a changed meaning is logged.
    source: core/components/plays/edit-ontology/reference/ice.md (base) C1, C3, C4, C6, F3, F6, S3
  - id: G2
    principle: >-
      The ontology follows the committed format: questions, kinds with properties/relationships/rules/optional
      States/example, a log. A template's worked example is a real, filled-in instance.
    source: standards/templates/product-ontology.md (base copy, shared memory folder); standards/templates/plan-view.md (base)
  - id: G3
    principle: >-
      A plan's branch is cut when work on the plan starts and merges into main when the plan pauses.
    source: core/components/plays/start-change/reference/ice.md (base) C9; docs/standards/harness-standard.md (base) principle 8; docs/adr/060-a-plans-branch-merges-into-main-when-the-plan-pauses.md (base)
  - id: G4
    principle: >-
      The ontology fixes the Thin line, and the plays that write or read it use exactly that text.
    source: ontology.md (base) v11 Thin line; core/components/memory/standards/schemas/product-os/spine.yaml (base) line 144; core/components/plays/shape-slice/scripts/slice_check.py (base) line 67
  - id: G5
    principle: One word means one thing; the old work type "Feature" is gone from the glossary's Feature entry.
    source: core/grounding/glossary.md (base) line 63 (Feature)
  - id: G6
    principle: >-
      A template is a settings block read by a named consumer, listed with its consumers in templates/_index.md;
      the screens it holds are not worded in the play; a question is shown in four parts.
    source: standards/templates/plan-view.md (base); standards/templates/_index.md (base, memory copy); core/components/skills/_shared/asking-a-person.md (base) "Each question"
  - id: G7
    principle: >-
      pipeline-next.md is the one map of successors; each play is listed once, under the loop or lane it belongs
      to, and the flow prose names the loops.
    source: core/components/memory/standards/rules/pipeline-next.md (base) lines 20-31 and map headings
  - id: G8
    principle: A reply to a person leads with the outcome, not with a path, branch or commit.
    source: standards/rules/user-facing-voice.md (memory copy, grounding-memory) "The rule" and "Signals you've drifted"
  - id: G9
    principle: >-
      A play that does not write-then-checkpoint is a declared exception in the rule, with the reason (a typed
      word a file cannot carry), what a reject does (nothing written, nothing to revert), and how containment
      still holds. A model delta is committed once and the model tree is clean on entry.
    source: core/components/memory/standards/rules/direct-model-write.md (base) lines 82-108, 134-146 (the two declared exceptions, /discover-intent per ADR 031 and /record-decision), 230-232 (L-DMW-4); docs/adr/026-direct-to-model-writes.md (base) Decision, "Clean tree in, committed delta out"

