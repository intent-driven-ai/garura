# design-findings-harness.yaml - check-change Step 3, Layer 2, category: harness, ROUND 5
# PR #998 (feature #720, /update-plan), base plan/717/base.
# Every principle is read from the base ref (git show plan/717/base:<path>) or from the memory copies in
# .garura/project/issues/720/context/memory/grounding-harness/ (manifest.json beside them).
# Reused, not copied again: the six rule copies' sha256 still equal the manifest fingerprints.
# ADR 062 and the declared-exception paragraph in direct-model-write.md are added by this diff, so they are NOT grounding.
# Round 5 changes since round 4 (commit 39f52b8f only): update-plan SKILL.md Steps 8, 9, 11, 12 and SE-18; scripts
# check_agreement.py, commit_plan.py, plan_session.py (model_records), session_files.py (guard takes --model-ops and
# one or more --model-record), and the script tests. No other core file changed.
# Line numbers for a finding's file are lines of the new file (the PR head); for a basis, lines of the base-ref file.
category: harness
base_ref: plan/717/base
round: 5
severity_taxonomy: .garura/project/issues/720/context/memory/standards/rules/pr.md
severity_note: >-
  pr.md maps runtime-scan standard IDs to P1-P4; it has no row for garura-prose design rules, so standard_id is null
  and the bucket is chosen from pr.md's bucket definitions (P2 major / structural, P3 minor, P4 nit).

grounding:
  principles:
    - id: HS-2
      says: "Plays orchestrate, agents gather context, skills do the work; the play hands each agent a contract of file paths."
      source: "docs/standards/harness-standard.md (base) lines 33-40"
    - id: HS-3
      says: "A fixed sequence runs as a script the step calls; a model is used only where judgment is needed."
      source: "docs/standards/harness-standard.md (base) lines 42-48"
    - id: HS-4
      says: "A play is compiled from its ICE; the compiled part records the ICE fingerprint."
      source: "docs/standards/harness-standard.md (base) lines 50-58"
    - id: HS-5
      says: "Build the eval first; a check that never failed may check nothing."
      source: "docs/standards/harness-standard.md (base) lines 60-66"
    - id: HS-11
      says: "Installed parts read and name only installed files."
      source: "docs/standards/harness-standard.md (base) lines 115-137"
    - id: KEEPER-1
      says: "The keeper gathers context and passes it on; every choice, draft and decision is made by a named skill."
      source: "core/components/agents/product-os-keeper.md (base) lines 49, 54-56"
    - id: DMW
      says: "A model-writing play runs the shared scoped-write guard once over the full delta, asserts a clean product-os tree at pre-flight, writes then reviews, commits its model delta as feat(model); exceptions are declared in the rule itself."
      source: "core/components/memory/standards/rules/direct-model-write.md (base) lines 63-69, 82-103, 110-116, 134-146, 158-160, 228-232"
    - id: ADR-058
      says: "A shaping run never touches a slice in progress; an approved edit may change only the listed parts; a change to this is a recorded decision that amends the ADR."
      source: "docs/adr/058-an-edit-the-person-approves-may-change-a-slice-in-progress.md (base) lines 14, 24-34"
    - id: ASK
      says: "Every question to a person shows Question, Answer, Why it matters and several Examples; each part that asks reads the shared rule, which a skill takes as an input with a floor when it is missing."
      source: "core/components/skills/_shared/asking-a-person.md (base) lines 7-10, 18-35; core/components/skills/find-slice-gaps/SKILL.md (base) line 25"
    - id: FWP
      says: "find-work-placement takes `work` and `domains_dir` and returns a capability name from the knowledge shelves."
      source: "core/components/skills/find-work-placement/SKILL.md (base) lines 12-20, 50-75; product-os-keeper.md (base) lines 64, 124"
    - id: PO-MEM
      says: "project-orchestrator lists, for every skill it holds, what it puts in short-term memory (or 'nothing from memory')."
      source: "core/components/agents/project-orchestrator.md (base) lines 403-408"
    - id: PLAYS-BASE
      says: "A play's Compilation Metadata states its real script count."
      source: "core/components/plays/show-plan/SKILL.md (base) line 273"
  grounding_gaps:
    - topic: "choices, not gates (a person is never stopped without a choice; every gate has a key that records what is owed)"
      note: >-
        No committed source on the base ref states it. Not used as a basis; no finding raised on the hard stop for
        uncommitted work or on the new guard exit 2 stop. Grounding unavailable: it needs a committed record.
  conformance_checked_and_held:
    - "HF-12 fix is a non-intent edit (HS-4; CLAUDE.md Play Pipeline Rules): reference/ice.md is unchanged on this branch since round 4 (git log: last touched before 39f52b8f), its sha256 3133f728...c433d00c equals the fingerprint in SKILL.md line 543 (Compilation Metadata). ice.md holds no word on model-record, the story record or the guard's inputs (grep); F13 and its recovery row (human, 'the guard report names a path outside the session's parts') are untouched. The edit changes how two script outputs are joined and one stop on a missing record; it adds no constraint, failure condition, scenario or flow step. Direct edit to SKILL.md was the right path."
    - "Step and eval counts: scripts row (line 545) still lists 17 names and the folder holds 17 non-test scripts; step_evals 18 (SE-1..SE-18), scenario_evals 7, recovery 13 unchanged. No script added or removed by the fix (plan_session.py gained a function)."
    - "Scripts for a fixed sequence (HS-3): joining the two records, the allow list, and the refuse-on-missing-record rule are all in scripts (plan_session.model_records, session_files.guard); the play only passes paths. 40 script tests pass (python3 -m unittest, run in scripts folder), including the three new ones (guard reads both records, guard refuses a missing record and puts nothing back, two records read as one)."
    - "Contract of file paths (HS-2): the Step 9 name-story dispatch now writes its own output (model-record-story.json) and the SKILL says why; the Step 8 record format adds 'each path relative to the repository root' and scoped_write_guard.py accepts repo-relative and product-os-relative forms (lines 42-48 of the guard), so the allow list works with either."
    - "DMW (guard once, after the last model write, before commit): the guard still runs once in Step 11 over the union of both records, with --restore; a missing record when parts exist now refuses (exit 2) and puts nothing back, so a missing record no longer reads as 'nothing may change' (which would have reverted every new page)."
    - "Installed parts (HS-11): no added line names core/components/, core/tools/ or Garura's docs/."
    - "Agent-first and KEEPER-1, bucket parity, glossary, position and naming: unchanged since round 4 and still hold (no file of those changed)."

