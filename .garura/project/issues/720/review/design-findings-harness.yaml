  - id: HF-12
    severity: P3
    status: fixed
    standard_id: null
    file: core/components/plays/update-plan/SKILL.md
    lines: "299-307 (Step 8 contract and record shape, paths relative to the repository root); 323-336 (Step 9 name-story writes model-record-story.json and never changes model-record.json); 351-377 (Step 11 guard and agreement read both records); 373-376 (SE-18 asserts model-record.json still names each Step 8 page); 378-383 (Step 12); core/components/plays/update-plan/scripts/plan_session.py 123-135 (model_records); session_files.py 94-110; commit_plan.py 51-52, 82; check_agreement.py 140"
    why: >-
      Round 4: the second keeper dispatch wrote the same output path as the first, so its record could replace the first and the guard (with --restore) would take the Step 8 page out
      of the tree and the commit. Now each dispatch has its own output path, and one function (model_records) joins the records for the guard, the agreement check and
      the commit: parts joined by feature, files with no repeat, a given path that is not on disk refused. The test the PR added exercises exactly the case (Step 8's record names the page, the story record only
      the index; the page stays). SE-18 reads the proof. The edit is non-intent (ice.md unchanged, fingerprint matches). One wording gap in how the new `<records>` is defined
      is HF-14; the keeper row not matching the new file is HF-15.
    basis:
      - "docs/standards/harness-standard.md (base) lines 33-40 (HS-2): the play hands each agent a contract of file paths"
      - "core/components/memory/standards/rules/direct-model-write.md (base) lines 63-69 (DMW)"
    fix: "None owed on this finding. See HF-14, HF-15."

  - id: HF-13
    severity: P4
    status: stands
    standard_id: null
    file: core/components/skills/author-plan-changes/SKILL.md
    lines: "17-26 (Input table has no asking_rule); 52 (Process step 4 reads _shared/asking-a-person.md by itself); core/components/plays/update-plan/SKILL.md 188-192"
    why: "Unchanged: the skill tells itself to read the shared file, but no input names it and no floor is stated if the file is missing. The base's asking parts take it as an input."
    basis:
      - "core/components/skills/find-slice-gaps/SKILL.md (base) line 25"
      - "core/components/skills/_shared/asking-a-person.md (base) lines 7-10 (ASK)"
    fix: "Add `asking_rule` to the skill's Input table and to the Step 5 draft-entries contract, with the floor (question, answer, why, examples) when it is missing."

  - id: HF-14
    severity: P3
    status: new
    standard_id: null
    file: core/components/plays/update-plan/SKILL.md
    lines: "292-293 (Step 8 'Skip when model-ops.json has no parts'); 331-333 (`<records>` defined as --model-record model-record.json, plus the story record when the story step ran); 353, 366, 382 (the three commands that take <records>); scripts/plan_session.py 123-135, session_files.py 96-99, commit_plan.py 82"
    principle: "A play's contract must say what to hand a script on the common path; a step that is skipped writes no file, and the next step must not be told to read it."
    basis:
      - "docs/standards/harness-standard.md (base) lines 33-40 (HS-2): the play hands a contract of file paths; a path handed for a file that does not exist is a broken contract."
    why: >-
      Step 8 is skipped when the session has no new feature (a story retitled, a status changed; the common case). Then model-record.json is never written. But `<records>` is defined
      to always include `--model-record <working>/model-record.json`. The new model_records raises Refused for any given path that is not on disk (checked: it refuses a missing
      path, and returns empty for no path). So following the text as written, Step 11's guard exits 2, check_agreement fails, and commit_plan.py refuses, on every session
      with no new feature. Before this edit a missing record was read as empty and the landing went on. It fails safe (nothing wrong is committed), but the common landing
      would stop and the person could not tell why. The SKILL says "stop for the person" on exit 2 as a missing record, so the play itself would stop a plan that has nothing to model.
    fix: "Say it in Step 9's definition: `<records>` is empty when Step 8 was skipped (no parts); otherwise `--model-record <working>/model-record.json`, and the story record too when the story step ran. Or have model_records skip a path only when model-ops.json has no parts. A direct edit to SKILL.md (non-intent)."

  - id: HF-15
    severity: P4
    status: new
    standard_id: null
    file: core/components/agents/product-os-keeper.md
    lines: "102 (the /update-plan 'land the new features' row: returns `model-record.json`, then 'a second link-model-part run names its issue'); core/components/plays/update-plan/SKILL.md 323-327 (the second dispatch's output is model-record-story.json)"
    principle: "The agent writes to the output path the play's contract names; the agent's own table must not name a different file for the same run."
    basis:
      - "docs/standards/harness-standard.md (base) lines 33-40 (HS-2)"
      - "core/components/agents/product-os-keeper.md (base) lines 49, 54-56 (KEEPER-1): the keeper gathers and passes context to named skills; the file it hands back is the contract's"
    why: "The keeper row names `model-record.json` as the record, and says the second run follows 'after this step' without saying it writes a record of its own. A keeper that follows its row, not the contract, would write the second run's result to model-record.json and bring back the HF-12 replacement. The Step 9 contract also does not state the story record's shape (parts with feature and issue, files)."
    fix: "In the row, say the record goes to the output path the contract names, and that the second run writes only its own files and parts; in Step 9's contract give the record shape in one line."

