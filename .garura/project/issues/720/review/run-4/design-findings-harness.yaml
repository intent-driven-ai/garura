    standard_id: null
    file: core/components/plays/update-plan/SKILL.md
    lines: "277-290 (Step 7: record_answer.py verify --out <working>/verify.json; SE-7 reads ok and list_sha); core/components/plays/update-plan/scripts/record_answer.py 17-20, 51-71"
    why: "verify.json is now written by the gate script on a pass and on a fail ({ok, decision, list_sha, answer_sha, why}), no longer an echo from the play's shell, so SE-7 reads a record the script made and an earlier pass cannot stay behind a later fail."
    basis:
