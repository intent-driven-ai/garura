# design-findings-harness.yaml - check-change Step 3, Layer 2, category: harness, ROUND 4
# PR #998 (feature #720, /update-plan), base plan/717/base (fa6f514c).
# Every principle below is read from the base ref (git show plan/717/base:<path>) or from the memory copies in
# .garura/project/issues/720/context/memory/grounding-harness/ (manifest.json beside them).
# Round 1's six rule copies were reused: each copy's sha256 equals the manifest, and the Phoenix memory tool still answers
# direct-model-write.md at version f8e35c3bd9b6; nothing was copied again this round.
# ADR 062 and the declared-exception paragraph in direct-model-write.md are added by this diff, so they are NOT grounding.
# They were read only to see whether a round 3 finding's fix exists in the diff.
# Round 4 changes to the harness files (since the round 3 review): update-plan SKILL.md and ICE rebuilt (session_files.py,
# scoped_write_guard.py, record_answer.py verify writes verify.json, place_feature.py questions in four parts and the
# slice-in-progress mark, a guard step 11), author-plan-changes (shared asking rule), asking-a-person.md (two parts added),
# link-model-part description and Thin line, track-plan-changes (marker search note), shape-slice ICE C16 and SKILL (Thin line
# text), shape-plan SKILL (surface prose), glossary (Feature item row), ADR 062.
# Line numbers for a finding's file are lines of the new file (the PR head); line numbers for a basis are lines of the base-ref file.
category: harness
base_ref: plan/717/base
round: 4
severity_taxonomy: .garura/project/issues/720/context/memory/standards/rules/pr.md
severity_note: >-
  pr.md maps runtime-scan standard IDs to P1-P4; it has no row for garura-prose design rules, so standard_id is null
  and the bucket is chosen from pr.md's bucket definitions (P2 major / structural, P3 minor, P4 nit).

grounding:
  principles:
    - id: HS-2
      says: "Plays orchestrate, agents gather context, skills do the work; the play hands each agent a contract of file paths."
      source: "docs/standards/harness-standard.md (base) lines 33-40"
    - id: HS-3
      says: "A fixed sequence runs as a script the step calls; a model is used only where judgment is needed."
      source: "docs/standards/harness-standard.md (base) lines 42-48"
    - id: HS-4
      says: "A play is compiled from its ICE; the compiled part records the ICE fingerprint."
      source: "docs/standards/harness-standard.md (base) lines 50-58"
    - id: HS-5
      says: "Build the eval first; a check that never failed may check nothing."
      source: "docs/standards/harness-standard.md (base) lines 60-66"
    - id: HS-11
      says: "Installed parts read and name only installed files."
      source: "docs/standards/harness-standard.md (base) lines 115-137"
    - id: KEEPER-1
      says: "The keeper gathers context and passes it on; every choice, draft and decision is made by a named skill."
      source: "core/components/agents/product-os-keeper.md (base) lines 49, 54-56"
    - id: DMW
      says: "A model-writing play runs the shared scoped-write guard once over the full delta, asserts a clean product-os tree at pre-flight, writes then reviews, commits its model delta as feat(model); exceptions are declared in the rule itself (each with its decision: ADR 031 for /discover-intent, #632 for /record-decision)."
      source: "core/components/memory/standards/rules/direct-model-write.md (base) lines 63-69, 82-103, 110-116, 134-146, 158-160, 228-232"
    - id: ADR-058
      says: "A shaping run never touches a slice in progress; an approved edit may change only the listed parts, and its brief must say the slice is in progress and name its epic, with its status, as out of date; a change to this is a recorded decision that amends the ADR."
      source: "docs/adr/058-an-edit-the-person-approves-may-change-a-slice-in-progress.md (base) lines 14, 24-34 and its Status/Amends pattern"
    - id: ASK
      says: "Every question to a person shows Question, Answer, Why it matters and several Examples from different domains; each part that asks reads the shared rule, which a skill takes as an input with a floor when it is missing."
      source: "core/components/skills/_shared/asking-a-person.md (base) lines 7-10, 18-35; core/components/skills/find-slice-gaps/SKILL.md (base) line 25"
    - id: FWP
      says: "find-work-placement takes `work` and `domains_dir` and returns a capability name from the knowledge shelves."
      source: "core/components/skills/find-work-placement/SKILL.md (base) lines 12-20, 50-75; product-os-keeper.md (base) lines 64, 124"
    - id: PO-MEM
      says: "project-orchestrator lists, for every skill it holds, what it puts in short-term memory (or 'nothing from memory')."
      source: "core/components/agents/project-orchestrator.md (base) lines 403-408"
    - id: PLAYS-BASE
      says: "A play's Compilation Metadata states its real script count."
      source: "core/components/plays/show-plan/SKILL.md (base) line 273"
  grounding_gaps:
    - topic: "choices, not gates (a person is never stopped without a choice; every gate has a key that records what is owed)"
      note: >-
        No committed source on the base ref states it. Not used as a basis; no finding raised on the hard stop for
        uncommitted work (C2/F2). Grounding unavailable: it needs a committed record.
  conformance_checked_and_held:
    - "ICE-source discipline (HS-4): update-plan SKILL.md fingerprint sha256:3133f728... equals the sha256 of reference/ice.md as it stands; shape-slice SKILL.md fingerprint sha256:b551dab4... equals the sha256 of its reference/ice.md. The shape-slice edit (the Thin line text, the 'any line that starts Thin:' read) is in ICE C16 first and in the SKILL.md second. shape-plan/SKILL.md line 339 is surface prose: write_plan_file.py (unchanged on this branch, lines 8, 229) already writes status Not Started and an empty direction, so the edit is a non-intent correction of a script description."
    - "Compilation Metadata (PLAYS-BASE): the update-plan 'scripts' row says 17 and lists 17 names; the folder holds 17 non-test scripts. step_evals 18 (SE-1..SE-18), scenario_evals 7, recovery 13 (7 autonomous, 6 human) all match the file."
    - "Installed parts (HS-11): no added line of a skill, agent or play names core/components/, core/tools/ or Garura's docs/ path; the plan tool is named by its installed path .garura/core/tools/plan/plan_branch.py. scoped_write_guard.py in the play is byte-identical to the canonical create-play/references copy on the base ref."
    - "Agent-first (HS-2) and KEEPER-1: the keeper's two update-plan rows name find-work-placement (routing result only) and enrich-grounding + link-model-part (the person's words, nothing made up); the keeper chooses and drafts nothing. place_feature.py and session_files.py are scripts of fixed rules (HS-3)."
    - "Bucket parity: place_feature.py IN_PROGRESS equals find_serving_slice.py's list (past ready: in_delivery, validated, fix_required, delivered), the rule ADR 058 uses; a test ties the two."
    - "Glossary: the 'Feature item' row and the reworded 'Feature' row match the base work guide (the organization still has the issue type Feature, managing-work.md base lines 58-63) and base ontology rule R1; they do not contradict a base source. The Source column names ontology.md v14 (added by this diff); the ontology check is in the memory category."
    - "Position and naming: unchanged (position none with an explicit position_exception; update-plan, author-plan-changes, track-plan-changes follow naming.yaml)."

