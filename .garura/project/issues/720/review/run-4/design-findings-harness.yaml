    fix: "None owed."

  - id: HF-11
    severity: P4
    status: stands
    standard_id: null
    file: core/components/plays/update-plan/SKILL.md
    lines: "212-215 (the suggest-capability contract: inputs draft, plan_id, product_base); core/components/plays/update-plan/scripts/place_feature.py 119-124, 139-145 (reads placements[0].capability)"
    why: >-
      Unchanged: the dispatch still hands the keeper a draft, a plan id and the product base, not the skill's own inputs (`work` and `domains_dir`), and the
      suggestion is a name from the knowledge shelves that the question prints as 'Proposed: ...', while place() accepts only a capability that is in the spine.
      The base uses the skill for the model too, so this is a contract-clarity point, not a breach.
    basis:
      - "core/components/skills/find-work-placement/SKILL.md (base) lines 12-20"
      - "core/components/agents/product-os-keeper.md (base) lines 64, 124"
    fix: "Word the dispatch with the skill's `work` input, and say in the question that the suggestion is a guess from the knowledge shelves."

  - id: HF-12
    severity: P3
    status: new
    standard_id: null
    file: core/components/plays/update-plan/SKILL.md
    lines: "299-304 (Step 8 contract: outputs.record = model-record.json, {parts, files}); 323-327 (Step 9 name-story contract: outputs.record = the same model-record.json); 346-349 (Step 11 guard allow list = the record's files); core/components/plays/update-plan/scripts/session_files.py 92-103; scripts/commit_plan.py 81-82"
    principle: "Two dispatches write the same output path with no rule on replace or add, and that file is the allow list of a destructive guard and the file list of the commit."
    basis:
      - "docs/standards/harness-standard.md (base) lines 33-40 (HS-2): the play hands each agent a contract of file paths; the contract must say what the file holds when two dispatches share it."
      - "core/components/memory/standards/rules/direct-model-write.md (base) lines 63-69 (DMW): the guard fails or reverts any model path outside the run's declared write scope."
    why: >-
      Step 8 has the keeper write `model-record.json` with every model file written. When a story was made in Step 9, the play dispatches the keeper again
      with the same output path. The second run's own link report names only the spine, so a keeper that writes what it did in that run replaces the first
      record. Step 11's guard builds its allow list from that record's `files` and runs with --restore, which removes each out-of-scope new file: the feature
      page written in Step 8 would be taken out, and commit_plan.py would leave it out of the commit. The agreement check would then fail (features_ok), so
      nothing wrong is committed, but the page is lost and the person must run the landing again. Neither the play nor the keeper's row says the second run adds
      to the first record.
    fix: "Give the second dispatch its own output (model-record-story.json) and have Step 11 and commit_plan.py read both records; or word the contract: 'adds the files it wrote to the record and keeps every part and file already there'. Reword in reference/ice.md first if the ICE carries the words, then recompile."

  - id: HF-13
    severity: P4
    status: new
    standard_id: null
    file: core/components/skills/author-plan-changes/SKILL.md
    lines: "17-26 (Input table has no asking_rule); 52 (Process step 4 reads _shared/asking-a-person.md by itself); core/components/plays/update-plan/SKILL.md 188-192 (the draft-entries contract hands no asking_rule)"
    principle: "The asking rule reaches a skill as an input the play's agent hands over, with a stated floor when the file is missing."
    basis:
      - "core/components/skills/find-slice-gaps/SKILL.md (base) line 25: `asking_rule` is a required input (../_shared/asking-a-person.md from the skill's folder; not memory); the skill states a floor when it is missing."
      - "core/components/skills/_shared/asking-a-person.md (base) lines 7-10: each part that asks reads it there."
    why: "The skill tells itself to read the shared file, but no input names it and no floor is stated if the file is absent, so an installed project that lacks the file gets questions in whatever shape the model picks. The base's asking parts take it as an input so the play can see it was handed over."
    fix: "Add `asking_rule` to the skill's Input table and to the Step 5 draft-entries contract, with the floor (question, answer, why, examples) when it is missing."

