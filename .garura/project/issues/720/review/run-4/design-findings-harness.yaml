  - id: HF-3
    severity: P3
    status: fixed
    standard_id: null
    file: core/components/plays/update-plan/SKILL.md
    lines: "340-353 (Step 11: the scoped-write guard once, after the last model write, before the commit; exit 1 stops for the person); 55-69 and 142-155 (the plan tool stops on uncommitted work on every path); 366-367 (SE-18); core/components/plays/update-plan/scripts/session_files.py 92-103; core/components/memory/standards/rules/direct-model-write.md 148-157 and the L-DMW-4 'Not a finding' note (~240-244)"
    why: >-
      Round 3 asked for one of two things: wire the guard and the clean-tree check, or declare /update-plan an exception by decision. The diff does
      both, through the rule's own route. (1) The guard is wired: scoped_write_guard.py is the stamped canonical script (byte-identical to the base
      create-play copy), run once over the full delta after the last model write (Step 9's name-story) and before commit_plan.py, with --restore, and
      SE-18 reads its report before commit.json. (2) The clean tree is checked at pre-flight for the whole tree by plan_branch.py go (the
      round-3 hard stop, now on every path). (3) The write-then-review order and the commit shape are declared as an exception in direct-model-write.md,
      beside the two declared exceptions the base already holds (ADR 031 and #632), with ADR 062 as its decision record (accepted, amends ADR 026 by
      name). ADR 062 and the new paragraph are added by this diff, so they are not grounding; they are the decision the base rule asks for, and whether
      it is the right decision is the human's call at acceptance. One contract gap the guard step depends on is raised as HF-12.
    basis:
      - "direct-model-write.md (base) lines 63-69, 82-103, 110-116, 134-146, 228-232 (DMW)"
    fix: "None owed on this finding. See HF-12."

  - id: HF-4
    severity: P3
    status: fixed
    standard_id: null
    file: core/components/plays/update-plan/SKILL.md
    lines: "194-201, 233-237 (the confirm screen names the slice in progress and each epic past ready with its status as out of date); 245-248 (SE-17 reads the saved screen); core/components/plays/update-plan/scripts/place_feature.py 41-47, 119-124; core/components/memory/standards/templates/plan-update.md 117-118; core/components/skills/link-model-part/SKILL.md line 3 (description)"
    why: >-
      Round 3 found a feature added to a slice in progress with no recorded decision and no 'out of date' naming. Now: (1) place_feature.py marks the
      slice in progress by the same status list /shape-slice uses and writes each epic with its status; (2) the confirm screen always says so and names
      each epic as out of date, which is exactly what ADR 058 asks of any change to a slice in progress, and SE-17 and F10 check the saved screen;
      (3) the decision is recorded: ADR 062 (accepted) amends ADR 058 Decision 2 for this one addition, the same Amends route ADR 058 used,
      and link-model-part's description now says so instead of 'only /shape-slice'. ADR 062 is added by this diff, so it is not grounding;
      the route is. The ADR 058 limit that a shaping run never touches a slice in progress stands untouched in /shape-slice.
    basis:
      - "docs/adr/058 (base) lines 24-26 (a shaping run never touches a slice in progress)"
      - "docs/adr/058 (base) lines 28-34 (the brief says it is in progress and names the epic as out of date)"
    fix: "None owed."

  - id: HF-5
    severity: P3
    status: fixed
    standard_id: null
    file: core/components/plays/update-plan/SKILL.md
    lines: "157-164 (Step 4: session_files.py numbers); 259-271 (Step 6 abort: session_files.py restore, SE-6 reads restore.json clean: true); core/components/plays/update-plan/scripts/session_files.py 40-90"
    why: "Both fixed sequences of round 3 are now play scripts that write a record: the plan's issue numbers (numbers.json with the csv) and the abort restore (restore.json with restored, deleted and clean). The restore refuses a path that leaves the repository, and the eval SE-6 reads its record."
    basis:
