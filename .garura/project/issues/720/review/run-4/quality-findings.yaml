  - id: N4-06
    status: noted
    basis: "review/code rubric: the plan tool's changed paths"
    severity: none
    file: core/tools/plan/plan_branch.py
    function: go / abort
    line: 150
    artifact_type: runtime-code
    evidence: "Checked: the go order is fetch, uncommitted check, stay, switch, cut; the stop record names the files; abort checks uncommitted work first on both the cut and the non-cut path. The `reverted_already` match uses the full commit id of the cut (rec main_commit is `rev-parse HEAD`), so a similar short id in another message cannot match. One edge left: if someone reverts the revert on main before the second abort, it still sees the first revert and skips; the branch is then deleted while main's plan file reads In Progress again. That needs a person to revert by hand in between; noted, not a finding."
