findings:
- id: F1
  category: executable-code
  severity: P3
  rule_id: knowledge/review/code.md (deterministic where it claims to be); pr.md severity P3 (highlight, does not block)
  file: core/components/plays/play-creator/references/post_verdict.py
  line: 80
  title: The comment that gets posted is never checked against the decision recorded in decision.yaml
  evidence: 'main() reads decision.yaml (line 80) and separately reads the comment body from --comment-file (line 86),
    posts the body as is, then writes decision and decided_by from decision.yaml into posted.json. Nothing compares the
    two. The test itself shows it: run_post (test_post_verdict.py line 56) always posts "Harness verdict: approve",
    and test_posted_decision_holds (line 90) records "decision: reject" and still passes with posted.json
    decision=reject and the stop condition held. The stop-condition D2 text says "that is the decision posted".'
  why_it_matters: The new stop condition reads decision_recorded true as proof that the decision on the PR is the recorded
    one. A PR could carry a comment that says approve while posted.json says reject, and the play would still close
    COMPLETED. Step 6 builds the comment from the decision, so this needs a bug or a hand edit to happen; today it is
    latent. The same copy edit must be made in both script copies.
  basis: knowledge/review/code.md rubric, deterministic where it claims to be; the script says decision_recorded means the
    decision was recorded and posted, but it only checks that the record is valid.
  suggestion: Either have the script write the comment first line from decision.yaml, or fail with exit 2 when the comment
    does not name the same decision and decider. Change the test fixture so the comment follows the decision, and add a
    case where they disagree. Apply to both copies and keep them identical.
- id: F2
  category: tests
  severity: P4
  rule_id: knowledge/review/tests.md (clear assertions, tidy test code); pr.md TEST rows (none fired)
  file: core/components/plays/play-creator/references/test_post_verdict.py
  line: 92
  title: Files are opened and never closed in three places
  evidence: 'Line 92 json.load(open(...)), lines 140 and 141 open(...).read(). The handles are left to be cleaned up by
    garbage collection; python will warn (ResourceWarning) when run with warnings on, and the pattern differs from the
    "with open(...)" form used everywhere else in the two scripts. ruff default rules do not flag it.'
  why_it_matters: Cosmetic. No effect on the result today; on a stricter runner (pytest -W error) it could turn into a failure.
  basis: knowledge/review/tests.md, linter on the test code (clear, tidy test code)
  suggestion: Use "with open(...) as fh" in those three spots.
