observations_not_findings:
- id: OBS-1
  where: core/tools/memory/citations.py
  lines: 75, 152, 156-157, 161
  proposed_severity: P3
  nearest_standard: CODE-25 (P3)
  text: 'citations (with check, or with a play filter) crashes on a decision-file line that is valid JSON but not a whole record. records() keeps any line that parses; the code after it assumes a record. Reproduced against a scratch short-term
    folder: a line "null" or "[1]" gives AttributeError (no attribute get); a line {"play": "/x"} gives KeyError citation_id; a record whose trace step has no source gives KeyError source. Each exits 1 with a Python traceback and no JSON answer.'
  basis: 'README error row "unreadable" (a line that is not a whole record, a cut-off write or a hand edit) and the memory.py header (every answer is one JSON object per line); review/code rubric: error handling; safe handling of destructive
    or irreversible operations (~/.garura/phoenix-memory/knowledge/review/code.md, Treatment)'
  test_gap: test_an_unreadable_line_stops_only_its_own_issue cuts a line short (it does not parse); nothing covers a line that parses but is not a record.
  why_not_a_finding: no pr.md row describes it; CODE-25 is the nearest and takes its severity from the table. cite is not affected (it only appends).
- id: OBS-2
  where: core/components/plays/play-creator/references/write_drive_review.py (identical copies in understand/scripts and vision/scripts)
  lines: '88'
  proposed_severity: P3
  nearest_standard: CODE-25 (P3)
  text: 'a decisions file whose records list holds something that is not an object ends in a traceback instead of the refusal the file promises. The check "not isinstance(r, dict)" selects the bad element and the same comprehension then calls
    r.get("citation_id") on it. Reproduced with a records list ["oops"] and with [null]: AttributeError at line 88, exit 1; nothing is written either way. The header promises exit 2 and "nothing written" for a bad input.'
  basis: 'review/code rubric: error handling; safe handling of destructive or irreversible operations (~/.garura/phoenix-memory/knowledge/review/code.md, Treatment)'
  test_gap: test_drive_contract.py covers "records that are not a list", not a list holding a non-object.
  why_not_a_finding: no pr.md row describes it. The fix is one edit to the canonical copy and a re-stamp of the two copies.
- id: OBS-3
  where: core/tools/memory/memory.py
  lines: 424-426
  proposed_severity: P4
  nearest_standard: CODE-25 (P3)
  text: 'a failed read of the decision file by citations is answered "Garura memory cannot be written", tier garura. The new branch names cite, propose, decide and apply as the short-term writers; citations (a read of short-term memory) falls
    to the garura default. Reproduced with an unreadable decision file: error tier_missing, tier garura, message "Garura memory cannot be written: [Errno 13] Permission denied ...".'
  basis: 'review/code rubric: error handling; safe handling of destructive or irreversible operations (~/.garura/phoenix-memory/knowledge/review/code.md, Treatment); the error table in the README (tier_missing names the tier that cannot be reached)'
  why_not_a_finding: no pr.md row describes it; rare failure, wrong words and wrong tier in the answer.
- id: OBS-4
  where: .garura/project/issues/659/evidence/make_decisions.py
  lines: 29, 194
  proposed_severity: P3
  nearest_standard: null
