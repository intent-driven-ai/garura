observations_not_findings:
- id: R2-1
  where: core/tools/memory/memory.py
  lines: 150-162 (excluded), 164-173 (hidden), 185-197 (files)
  proposed_severity: P3
  nearest_standard: null
  since_round_1: new in this round; the weak point (excluded) is older, the fix (hidden) is new
  text: 'the rule that an issue''s short-term memory is never read through Garura memory is decided from the two settings as written, not from the folders they reach. hidden()
    resolves the request''s path to the real file (links, ''.'', case) but then compares it with excluded(''garura''), which is the short-term setting taken relative to the
    Garura setting without resolving either. Reproduced in scratch: with the Garura folder set directly and the short-term folder set through a link to a folder inside it,
    read --tier garura --path issues/9/n.md answers the short-term note and find --tier garura lists it; with both settings spelled the same way it answers not_found. The round
    1 tool behaves the same, so the fix did not widen or narrow it. Separately, find and search apply the literal prefix while read applies the resolved, case-folded one, so
    find lists a link to a hidden file by the link''s own name (reproduced: alias.md pointing at the decision file) and read then refuses it.'
  basis: 'review/code rubric: error handling; safe handling of destructive or irreversible operations, data-safety paths get extra weight (~/.garura/phoenix-memory/knowledge/review/code.md,
    Treatment); README settings rows for updates_dir and citations_file (''a lookup never reads them'')'
  test_gap: test_other_letter_case_and_links_reach_nothing_hidden covers links inside the tier and other letter case; no test spells a setting through a link.
  why_not_a_finding: no pr.md row describes it; it needs two settings that spell one folder two ways, which the operator controls. The fix commit says the rule is 'however
    spelled', which is true of a request's path, not of the settings.
- id: R2-2
  where: core/components/plays/play-creator/references/write_drive_review.py (identical copies in understand/scripts and vision/scripts)
  lines: 75-78
  proposed_severity: P4
  nearest_standard: CODE-25 (P3)
  since_round_1: new; the --decisions file read is part of this diff
  text: 'a --decisions file that exists but cannot be read (no permission) ends in a PermissionError traceback and exit 1; only ValueError is caught around the read, while
    the run.json read at line 45 catches OSError too. The header promises exit 2 and ''nothing written'' for a bad input. Reproduced in scratch: traceback, exit 1, nothing
    written.'
  basis: 'review/code rubric: error handling (~/.garura/phoenix-memory/knowledge/review/code.md, Treatment)'
  test_gap: test_drive_contract.py covers a missing file, not an unreadable one.
  why_not_a_finding: no pr.md row describes it; nothing is written either way. One edit to the canonical copy and a re-stamp of the two copies.
