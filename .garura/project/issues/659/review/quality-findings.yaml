    The categories file named this as a data-safety path to read hard. It is an evidence script, run by hand on a scratch folder, and its recorded output is committed.
  basis: 'review/code rubric: error handling; safe handling of destructive or irreversible operations (~/.garura/phoenix-memory/knowledge/review/code.md, Treatment)'
  why_not_a_finding: 'no pr.md row covers a destructive file operation. A guard would be: refuse unless the folder is missing, empty, or holds a marker file this script wrote.'
