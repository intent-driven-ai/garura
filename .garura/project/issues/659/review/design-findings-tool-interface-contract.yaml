    No committed record says that an agent's decision record is hidden from lookups, or that "an agent never decides from its own earlier
    decision". The #675 note on main (658 decision comment) asked for the waiting-draft rule only; the 659 plan item 3 files the
    decision-record hiding under the same note. The principle behind it exists on main by analogy (ADR 036 Alternatives, line 128) but no
    record applies it to decision records. See TIC659-3.
  - >
    Nothing committed on main says how a consumer of the contract treats a later contract version, or how the contract's version relates
    to the stamped scripts in plays. Only the base README's version rule exists. See TIC659-11.
  - >
    The glossary on main still describes two tiers and has no entry for Garura memory, Phoenix memory, a memory update, a citation or an
    agent's decision record, so it cannot ground naming for those words; it does ground "decision record" and "resolution trace" for the
    older meanings (TIC659-3).
  - >
    The owner's words of 18 and 19 October (a decision rests on several steps, "these are called traces", three lines around each source,
    waiting drafts hidden) are on main nowhere as a decision record; they sit in the 659 plan. Used for classification only.
  - >
    Nothing committed on main says how a person's approval of an agent decision is written (the design document in this diff adds a
