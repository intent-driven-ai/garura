  - departure: "Each step keeps the exact text, the memory version and up to 3 lines around; a check re-reads every step and flags a decision with no trace."
    covered_by_adr_037: "YES. ADR 037 part 1 and part 2."
  - departure: "Decision records are hidden from every lookup (v4 answer rule waiting_drafts_are_hidden, last sentence)."
    covered_by_adr_037: >
      IN PART. ADR 037 part 6 says "Decision records are kept in the issue's own short-term folder, and a lookup never finds them", but files it
      under 'What this does not change'. Nothing on main decides it, and ADR 036 part 6 on main says the tool can still find a play's working
