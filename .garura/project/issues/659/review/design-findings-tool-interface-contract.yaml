verdicts:
  - question: "(a) The wider shape: a trace of ordered steps (asked, found, source with exact text, version and up to 3 lines around), from_update, play, decided_by, decided_at"
    verdict: >
      CONFORMS IN SUBSTANCE, AMENDMENT OWED. Every step names a tier, a file, lines and a fingerprint, so ADR 035 part 6 and ADR 034 part
      4 hold; the shape was left to plan item 6, whose text on main says "one shape ... built on the trace format Garura already has";
      ADR 035 part 9 says the older resolution trace gives way to part 6, so the trace is its successor, not a second thing. The wider
      parts (several steps, kept text, around lines) are a refinement the ADR delegated, backed in the branch record only. The filed
      done-when is met for records that exist (see TIC659-5 for what it cannot reach). ADR 035 part 6 and ADR 034 part 4 still say "the
      tier, the file and the lines" and the 032 and 036 section names still differ: TIC659-2.
  - question: "(b) The hiding rule"
    verdict: >
      MIXED. For waiting drafts: CONFORMS IN TEXT and closes TIC658-3 (base v3.json has no such rule; the #675 note on main asked for
      it; ADR 036 line 128 is its reason). It is NOT HELD by the tool or by the contract's own path grammar: TIC659-1 (P2). For decision
      records: no committed backing, and the word clashes with the glossary and with the contract's own tiers text: TIC659-3. What the
      contract and its check can and cannot pin about it: TIC659-8 and TIC659-9.
  - question: "(c) decided_by and the approval line"
    verdict: >
      CONFORMS to ADR 033 part 6 (a decision record has no approval field, and nothing in v4 lets an agent write approval). The field name
      decided_by with decided_at reads like an approval's who and when, and means something else here: TIC659-4. The older trust gap (decide
      is on the agent-callable surface and decided_in is a label) is unchanged and carried: see carried_open.
  - question: "(d) The check's reach"
    verdict: >
      PARTLY OVER-CLAIMED IN WORDS. The checking words are accurate ("each source still exists and still says the same thing"); two
      neighbouring phrases claim more than anything holds ("every decision is recorded", "the exact lines the agent read when it decided",
      "the steps the agent took"): TIC659-5. The contract check holds less than its answer rules say in six places that the answer alone
      could settle: TIC659-8.
  - question: "(e) Version policy"
    verdict: >
      CONFORMS. v1.json, v2.json and v3.json are byte-identical to main (empty diff against main); v4 is a new file; contract_version
      moves to "4". v4 was edited in place after its first commits on this branch, which the README rule allows while it is unlanded.
      Carried: every sample and the check run on v4 only, so nothing exercises v1 to v3 (TIC658-11 part 4). The exact pin of '4' in the
      three drive-record writers: TIC659-11.
  - question: "(f) Settings and paths"
    verdict: "PARTLY. The settings text is unchanged from v3 and names neither updates_dir nor citations_file: TIC659-9 (P4)."
  - question: "(g) Error naming"
    verdict: >
      GAPS. errors.changed still describes only an update's target; cite uses changed, not_found, not_approved and bad_request in ways
      the error text and the cite summary do not say, and answers not_found where read answers out_of_range or bad_request for the same
      bad lines: TIC659-7. 'tier' in an error versus target_tier is carried from v3.
  - question: "Built on the trace Garura already has; no source from the model or the web"
    verdict: >
      CONFORMS. The tier enum has only the three memory tiers, so a source cannot name the model or the web, and cite refuses a source
      that is gone or changed (rule cite_reads_its_sources). A decision that rests on an applied update must name the update's written file
      (tool and summary; the rule itself is not in the answer rules: TIC659-7). The one way round it is the path form in TIC659-1.
  - question: "Lookup order, stop at the first tier, tier_missing, nothing used before a person approves, short-term is this issue only, saving rule"
    verdict: >
      CONFORMS. The diff between v3.json and v4.json changes none of lookup_order, lookup_rule, request_rules, settings, paths,
      fingerprint or saving; the lookup answer rules are unchanged apart from the cite wording and the new waiting_drafts_are_hidden rule.
  - question: "Samples (48 moved to version 4, 2 reworked, 8 added) and the contract check"
    verdict: >
      CONFORMS to what the check holds. Observed on a scratch copy of the committed folder (bytecode off): ok true, contract_version 4,
      26 samples valid, 0 failed, 0 commands without a sample, 32 of 32 broken samples refused, 0 boundary problems. What the samples and
      the check do not pin is listed in TIC659-8.

findings:
  - id: TIC659-1
    severity: P2
    backing: >
      not a departure backed by a decision: a stated "never" that is not held. The rule itself is backed on main (the #675 note in the 658
      decision comment, and ADR 036 line 128). The bypass is the same on main's tool for waiting drafts and for another issue's notes read
      through the Garura tier (checked with the same probe on a copy of main), so it is carried code behaviour; v4 is where the contract
      states the rule as "never", extends it to decision records, and adds cite, which gives the bypass a new use.
    cross_category: executable-code   # the flaw is in memory.py (FolderEngine.excluded and read); the contract's path grammar is the contract half
    file: >
      core/tools/memory/contract/v4.json (answer_rules.waiting_drafts_are_hidden, answer_rules.cite_reads_its_sources, $defs.path,
      commands.cite summary and response.stored); core/tools/memory/memory.py (FolderEngine.excluded, FolderEngine.read);
      core/tools/memory/citations.py (CitationStore.source_problem)
    finding: >
      The contract says a lookup "never returns a memory update that waits for a person" and that decision records are never returned. The
      tool keeps that for the plain path only. Run over a throwaway project on a scratch copy: reading '7/review/./memory-updates/<id>.json'
      or '7/review//memory-updates/<id>.json' returns the waiting draft; reading '7/context/./citations.jsonl' (or '7/./context/...',
      '7/context//...') returns the decision records; on this machine's case-insensitive filesystem '7/Review/memory-updates/<id>.json'
      returns the draft; reading './issues/8/notes.md' in the Garura tier returns another issue's short-term note (ADR 036 part 1). The
      path grammar in the contract ($defs.path: no leading slash, no '..', no backslash or line break) accepts every one of these. The
      cite answer itself hands the caller the hidden file's path ('stored.path', '7/context/citations.jsonl'). Worse, cite reads each
      source through the same call: a trace step whose source is the waiting draft, or the agent's own earlier decision record, written in
      one of these forms was recorded (ok true), and 'citations --check' then answered no problem. So a decision can be recorded as resting on
      memory no person approved, and nothing in the record or the check shows it.
    failure_scenario: >
      An agent that has the stored path from a cite answer (or a model that guesses the default folder) reads the waiting draft of a
      memory update, decides from it, and cites the draft's lines as the source; the record passes the check and the drive's review shows an
      ordinary memory step. This is the unapproved draft driving the work that ADR 036 line 128 and ADR 035 part 5 forbid.
    principle_violated: ADR036-ALT-DRAFT-MUST-NOT-ANSWER-A-LOOKUP
    committed_source: >
      docs/adr/036 Alternatives Considered (line 128, main); docs/adr/035 Decision part 5 (lines 70-78, main); docs/adr/036 Decision part 1
      (lines 36-43, main); .garura/project/issues/658/review/decision-comment.md (the waiting-draft note, main).
    suggested_direction: >
      Close it in both halves. In the contract, make the path grammar refuse a '.' segment and an empty segment (the grammar already refuses
      '..', for the same reason), with one broken sample for each; say in the rule that the hiding holds for any spelling of the path. In the
      tool, decide the exclusion on the resolved real location (and on a case-folded comparison where the filesystem folds case) for read and
      for cite, and add a test for each spelling above and for a cite resting on a hidden file. Why P2 and not P1: a local tool that nothing
      calls yet, the odd path has to be typed (or the filesystem folds case), nothing is lost, and the fix is small. Why not lower: it is the
      guarantee the whole feature rests on and the contract says "never". It becomes P1 if an agent or play (#661, #663) is wired to build
      read or cite paths itself rather than use paths from find and search, or the same path handling ships behind a server in Griffin.

  - id: TIC659-2
    severity: P3
    backing: >
      amendment owed. The wider trace is backed in the branch record only (659 plan item 2 and the log of 19 October); on main the 653 plan
      item 6 says "built on the trace format Garura already has". The PR body lists it as carried to its own /adr change.
    file: >
      core/tools/memory/contract/v4.json (description 'Version 4', commands.cite summary, $defs.decision_record, traced_step,
      cited_source, around); core/components/memory/standards/rules/resolution.md ('Decision Records (ADR 035 section 6)', in the memory
      grounding, not here)
    finding: >
      ADR 035 part 6 says a decision "names the tier, the file and the lines it rests on" and leaves the shape to plan item 6; ADR 034 part 4
      says "every answer names its source". v4 records an ordered trace of steps, each with a question, a finding and a source that keeps its
      exact text, the memory version and up to three lines around it, plus from_update, play, decided_by and decided_at. That is a
      refinement the ADR delegated, not a break. But the committed words still describe one source, ADR 032 part 3 and ADR 035 part 7 still
      name a "Memory" view where ADR 036 says "Memory and ADRs", and the contract's own cite summary cites 'ADR 035 section 6, ADR 034
      section 4' for a shape neither states. A builder of #661 to #664 who starts from the ADRs (as the filed stories tell them to) finds a
      contract wider than the record they read.
    failure_scenario: "A builder of #661 writes the agents' decision record from ADR 035 part 6 (one source: tier, file, lines) and the contract refuses it for having no trace."
    principle_violated: ADR035-S6-DECISION-NAMES-MEMORY
    committed_source: >
      docs/adr/035 Decision part 6 (lines 80-82, main); docs/adr/034 Decision part 4 (lines 60-62, main); .garura/project/issues/653/specs/plan.md
      item 6 (lines 148-162, main); docs/adr/035 part 9 (ADR 015 bullet, main).
    suggested_direction: >
      Record the trace in the /adr change the PR body already names (ADR 035 part 6 and ADR 034 part 4: a decision keeps a trace of steps, each
      with a tier, file, lines and fingerprint), and do it before #661 starts. Until it lands, let the contract's description point to the plan
      item, not to a chat quote. Not P2: the shape was delegated to plan item 6, no consumer exists yet, and the owner's word is recorded.
      The older, larger amendment (TIC658-1, scored P2 in the 658 review and carried with the owner's approval) is still owed and is not
      re-scored here; the sum of the two is what the /adr change should settle.

  - id: TIC659-3
    severity: P3
    backing: >
      branch's own rule: no committed record and no owner word backs hiding decision records. The 659 plan item 3 files it under "the #675
      note", which on main covers waiting drafts only. The reason for it is sound by analogy with ADR 036 line 128; what is missing is the
      record, and the word.
    file: >
      core/tools/memory/contract/v4.json (answer_rules.waiting_drafts_are_hidden last sentence; tiers.garura; $defs.decision_record);
      core/tools/memory/README.md ('citations_file' row)
    finding: >
      The rule says "Decision records are not memory either: a lookup never returns them, so an agent never decides from its own earlier
      decision." Two problems. (1) The same contract says, in tiers.garura (unchanged), that Garura memory holds "decisions", as ADR 035 part
      1 does; and the glossary on main says a "decision record" is an ADR at any level (decision.yaml), kept in the product model, which is
      memory. So "decision records are not memory" is, by the committed word, false, and a second engine built from the sentence could hide
      the product model's decisions (or, reading the other sense, not hide the agent's). One word, two things. (2) The carve-out narrows
      ADR 036 part 1 and part 6 (the issue's folder is short-term memory, and the tool can find a play's files there); ADR 036 records one
      such carve-out (waiting drafts) with its reason, and none for decision records. The filed story text on main says agents "write it to
      the issue's short-term memory" and says nothing of hiding it. The rule is probably right (an agent's earlier decision would answer
      its next lookup, as a draft would), but it is not recorded anywhere a reader of the ADRs would look.
    failure_scenario: >
      Griffin's engine is built from the contract, reads "decision records are not memory", and filters the product model's decision.yaml
      files out of lookups; or a builder reads the glossary, takes the record for an ADR, and finds the agent's records are findable.
    principle_violated: ADR035-S1-TIERS-AND-DECISIONS-IN-GARURA
    committed_source: >
      docs/adr/035 Decision part 1 (lines 36-44, main); core/grounding/glossary.md lines 37, 61, 111, 113 (main); docs/adr/036 parts 1 and 6
      and line 128 (main); .garura/project/issues/654/specs/stories.yaml item 6 (line 104, main).
    suggested_direction: >
      Give the agent's record its own name in the contract and the glossary (for example "decision trace" or "agent decision"), keep
      "decision record" for the ADR kind, and say in the rule which files are hidden: the agent's records and the waiting updates. Record
      the rule and its reason in the ADR change (TIC659-2). Ask the owner to confirm that agent decisions are not found by lookups.

  - id: TIC659-4
    severity: P3
    backing: >
      naming; carried from the 658 review, which said "rename cite.decided_by at the cite story (#659)" (TIC658-11 part 3). v4 is the cite
      story and keeps the name, now in a stored record.
    file: >
      core/tools/memory/contract/v4.json (commands.cite request.decided_by; $defs.decision_record decided_by and decided_at; $defs.update
      decided_by and decided_at; commands.decide request.by)
    finding: >
      In update, decided_by is the person who approved, and decided_at when (a person's word). In decision_record, decided_by is the agent
      that made the decision ('product-os-keeper (/understand)' in the samples), and decided_at when it was recorded. The same two names
      mean an approval in one shape and a decision by an agent in the other, and the new shape is shown to a person in a drive's review
      next to approvals. ADR 033 part 2 gives an approval its own who and when, and part 6 says only the review step writes approval. The
      record has no approval field, so nothing breaks today; but a reader, or the review tool's Agent decisions screen, can take decided_by
      on a decision as someone's approval. The contract also cannot tell an agent from a person in either field (both are any non-empty
      string).
    failure_scenario: "The review tool shows a decision with 'decided by' and a time, and the person reads it as approved."
    principle_violated: ADR033-S6-ONLY-REVIEW-STEP-WRITES-APPROVAL
    committed_source: >
      docs/adr/033 Decision parts 2 and 6 (lines 38-45 and 66-68, main); .garura/project/issues/658/review/design-findings-tool-interface-contract.yaml
      TIC658-11 part 3 (main); docs/adr/036 'Not decided here' (line 121, main).
    suggested_direction: >
      Rename the record's fields (for example made_by and made_at) while v4 is unlanded, so the rename costs nothing; or add a one-line
      description on each field saying it is not an approval. Keep decide's by and the update's decided_by as they are.

  - id: TIC659-5
    severity: P3
    backing: >
      wording that claims more than the contract or its check can hold; the PR body says plainly that the check "proves the named lines still
      say what they said; it does not prove the answer follows from them", the contract does not. The owner knows (branch record).
    file: >
      core/tools/memory/contract/v4.json (description 'Version 4', commands.cite summary, commands.citations summary,
      answer_rules.cited_text_is_its_fingerprint, answer_rules.citations_problems)
    finding: >
      Three phrases say more than anything holds. (1) The description: "every decision is recorded with the memory it rests on". The
      contract defines how one decision is recorded; nothing makes every decision be recorded, no agent calls cite yet, and a decision that was
      never cited has no record the check could fail. The filed done-when ("the check fails a decision that names no source") is met only for
      a record that exists: cite refuses an empty trace (minItems 1), so no_source can arise only from a hand-edited file, and the drive record
      carries only cited decisions. (2) "the steps the agent took, in order" and "the exact lines the agent read when it decided": asked and
      found are free text the agent writes, and the tool re-reads the lines when cite is called, not when the agent decided; no read log ties
      a step to a read. (3) "so the person sees each step a decision rested on": the trace is the agent's claim of what it rested on; the
      check proves the lines exist and match their fingerprint, not that the answer follows from them. Under IDD principle 3, a record
      that reads as an audit trail and cannot be observed to be one gives false confidence.
    failure_scenario: >
      A play makes ten decisions and cites two; the drive's review shows two traces and an empty problem list, and the person takes it as the
      whole record. Or an agent cites three real lines that do not support its answer; the check says no problem.
    principle_violated: IDD-P3-OBSERVABLE-BINARY
    committed_source: >
      docs/philosophy/idd-principles.md Principle 3 (lines 75-98, main); docs/adr/035 Decision part 6 (lines 80-82, main); docs/adr/034
      Decision part 4 (lines 60-62, main); .garura/project/issues/654/specs/stories.yaml item 6 'Done when' (lines 106-109, main).
    suggested_direction: >
      Reword so each sentence is true: "cite records what the agent says it rested on, and citations --check proves each named line still
      exists and still has its fingerprint; it does not prove the answer follows, and it cannot see a decision that was never cited." When
      #661 and #663 wire the agents, give each play's own record a list of its decisions with their citation ids so a missing record shows.
      Not P2: it is an audit trail, nothing calls it yet, the owner and the PR body both say so. It becomes P2 if a drive's review treats an
      empty problem list as proof that every decision is cited.

  - id: TIC659-6
    severity: P3
    backing: "n/a: a field the consumer depends on that the contract leaves open"
    file: >
      core/tools/memory/contract/v4.json (commands.cite request.play optional; commands.citations request.play; $defs.decision_record play
      nullable string); core/components/plays/play-creator/references/write_drive_review.py (consumer, read only to learn what it expects)
    finding: >
      A drive's review is built from 'citations --play P'. The contract makes play optional on cite and a free non-empty string, with no rule
      on its form. The tool filters by exact string equality, and the drive-record writer expects '/' plus the play's name ('/vision'), and
      treats any record whose play differs as another play's and refuses the whole file. So a decision cited with no play, or as 'vision',
      never reaches any drive's review, and a consumer passing '--play vision' gets an empty answer: a silent skip, which the contract's own
      lookup rules call an error elsewhere. The play filter also has no answer rule, where updates has 'updates_filter'.
    failure_scenario: "An agent cites a decision as 'vision'; the drive review for /vision lists none, and no one is told."
    principle_violated: ADR034-S4-EVERY-ANSWER-NAMES-SOURCE
    committed_source: >
      docs/adr/034 Decision part 4 (the drive's review shows what was assumed and on what basis, lines 60-62, main); .garura/project/issues/654/specs/stories.yaml
      item 6 'Done when' (the drive review writer carries the sources, main); base v3.json answer_rules.updates_filter (main).
    suggested_direction: >
      Say the form of play (for example the play's command with its leading slash) in the contract, require play on a decision made inside
      a drive (or have citations answer a record with no play under every play's filter), and add a citations_filter answer rule and one
      broken sample.

  - id: TIC659-7
    severity: P3
    backing: "n/a: rules the tool keeps and the contract does not say (cross-category with executable-code)"
    file: >
      core/tools/memory/contract/v4.json (errors.changed, errors.not_approved, errors.not_found, errors.out_of_range; commands.cite summary;
      $defs.decision_record from_update); core/tools/memory/citations.py (cite)
    finding: >
      (1) errors.changed still says "the target changed after the update was proposed; propose again from the current text". cite now
      answers changed when a source's text no longer matches its fingerprint (the cite summary says so; the README row was updated, the
      contract's error text was not), and "propose again" means nothing to a cite. (2) Lines that are not in a file: read answers
      out_of_range, and end before start is bad_request (answer rule refusals); cite answers not_found for both (checked on a scratch copy),
      and the contract check accepts a cite sample whose source has end before start answered ok. (3) from_update: the tool refuses an update
      that is not applied (answering not_approved, which the contract defines as "apply on an update no person approved", and which also
      covers an update that is approved but not applied) and refuses a decision whose steps do not include the update's written file
      (bad_request). Neither rule is in the answer rules or the cite summary beyond "names it, and the update's written file is the source of
      a step". A second engine has no instruction for either. (4) citation_id has no stated form or uniqueness; problems name a record by it.
    failure_scenario: "A server engine accepts a decision whose from_update is a waiting update, and the contract check passes it."
    principle_violated: ADR035-S5-NOTHING-UNAPPROVED
    committed_source: >
      docs/adr/035 Decision part 5 (lines 70-78, main); base v3.json errors and answer_rules.refusals (main); docs/adr/036 Alternatives
      Considered (line 128, main).
    suggested_direction: >
      Add the cite case to errors.changed and errors.not_found (or give the source problems their own codes), say that a source whose lines
      are outside the file or reversed is bad_request or out_of_range as for read, add one answer rule for from_update (the update is applied
      and a step's source is its written file) with a broken sample, and state the form and uniqueness of citation_id. P3: the tool does
      all of this today and tests it; the gap is the second engine.

  - id: TIC659-8
    severity: P3
    backing: "n/a: rules observable from the answer alone that the contract check does not hold; the tool's own tests hold most of them"
    file: >
      core/tools/memory/contract/check_contract.py (check_citations, check_scope); core/tools/memory/contract/samples/ (no sample for the
      cases below); core/tools/memory/README.md ('The answer rules')
    finding: >
      Probed on a scratch copy by editing samples and re-running the check. Each of these passes the check although the answer rule or
      the contract text says otherwise: (1) a citations answer with check true, a record with no trace, and no no_source problem (rule
      citations_problems: "each record with no trace is no_source"; this is the filed done-when's own case); (2) a citations answer for
      play '/understand' holding a record of '/vision'; (3) a source_changed problem whose 'now' equals the cited text, which its own
      fingerprint settles; (4) a now_around that does not hold 'now' (the same test is made for a source's around); (5) a Phoenix step with no
      version, or a Garura step with an invented version (README: Phoenix's version is the repository's commit); (6) two records with one
      citation_id, and a citation_id or decided_at that is any text; (7) a search hit whose path is the hidden decision file or a waiting
      draft (the rule cannot be pinned by a sample, since the contract does not say where they live: TIC659-9); (8) a cite sample whose
      source has end before start answered ok. No sample exists for the new error 'unreadable', for a cite refused as not_found or changed, or
      for a from_update decision. The README's list "The check holds every sample to these" is v3's and lists none of the five answer rules v4
      adds. Under IDD principle 3 a rule that can be observed and is not is false confidence; the PR body's "32 broken samples refused"
      reads as the rules being held.
    failure_scenario: "A second engine returns check true with no no_source for a record with no trace; every sample and the contract check pass."
    principle_violated: IDD-P3-OBSERVABLE-BINARY
    committed_source: >
      docs/philosophy/idd-principles.md Principle 3 (lines 75-98, main); .garura/project/issues/654/specs/stories.yaml item 6 'Done when'
      (the check fails a decision that names no source, main); base v3.json answer_rules (main).
    suggested_direction: >
      Add the six checks the answer settles (1 to 4, 6, 8) to check_citations and check_scope, each with one broken sample, and the samples
      for unreadable, a refused cite and a from_update decision; bring the README's list up to v4. Not P2: the tool is right on every one
      of these and its tests say so; the gap is in what a second engine would be held to.

  - id: TIC659-9
    severity: P4
    backing: "n/a: settings text carried from v3 plus one new setting; the default location is a choice the contract does not name"
    file: >
      core/tools/memory/contract/v4.json (settings; answer_rules.waiting_drafts_are_hidden 'kept apart'); core/tools/memory/README.md
      (settings table: updates_dir, citations_file)
    finding: >
      The contract's settings text names each tier's place, phoenix_ref and where pulled pieces land, and names neither updates_dir nor the
      new citations_file; the README and memory.py do. The hiding rule says updates are "kept apart" without saying where, so a sample cannot
      pin it. The default for decision records, 'context/citations.jsonl', sits under ADR 017's 'context' ("prepare / architecture
      context"), while the glossary puts "how decisions were reached", the audit trail of a play, in evidence, where the resolution trace
      lives today. That is not a break (ADR 017 lists folders, not file kinds) but it is a choice no record makes.
    failure_scenario: "A second engine keeps decision records in a place its lookups read."
    principle_violated: ADR035-S4-ONE-TOOL-EVERY-ANSWER-CITED-THE-SAME-WAY
    committed_source: >
      docs/adr/035 Decision part 4 (lines 61-68, main); docs/adr/017 lines 51-55 and 104-108 (main); core/grounding/glossary.md lines 42 and 43
      (main); base v3.json settings (main).
    suggested_direction: >
      Name the two settings in the contract's settings text (or say the places are the engine's own), say that the hidden files are the
      ones cite and propose report as stored, and note the location choice in the ADR change.

  - id: TIC659-10
    severity: P4
    backing: "n/a: a gap against the contract's own every_result rule"
    file: "core/tools/memory/contract/v4.json ($defs.citation_problem now, now_around; answer_rules.citations_problems; every_result)"
    finding: >
      every_result says every piece of text the tool returns carries its tier, file, lines and fingerprint. A source_changed problem returns
      the text the lines hold now ('now') and the lines around it ('now_around') with no fingerprint of their own, and no memory version. For
      a Phoenix source the text is at whatever approved version the tool read, and the problem does not say which. The old source's
      fingerprint travels in 'source', not the new text's.
    failure_scenario: "The review tool shows 'now' as what memory says, and the person cannot tell at which version of Phoenix memory."
    principle_violated: ADR035-S4-ONE-TOOL-EVERY-ANSWER-CITED-THE-SAME-WAY
    committed_source: "docs/adr/035 Decision part 4 (lines 61-68, main); .garura/project/issues/653/specs/plan.md line 81 (main); base v3.json every_result (main)"
    suggested_direction: "Add now_fingerprint and now_version to citation_problem (null when the lines are gone), and check them with the sample."

  - id: TIC659-11
    severity: P4
    backing: "n/a: grounding unavailable (see grounding_not_available); nothing committed on main says how a consumer follows a contract version"
    file: >
      core/components/plays/play-creator/references/write_drive_review.py and its stamped copies in /vision and /understand (contract_version
      must be '4'); core/tools/memory/pull.py (CONTRACT_VERSION); core/tools/memory/contract/samples/
    finding: >
      The three drive-record writers refuse any citations answer whose contract_version is not exactly '4', and the plays that carry them are
      deployed into projects by install-garura while the memory tool is installed separately. The base README's rule is that the contract
      changes only by a new version, with earlier versions kept; it says nothing about a consumer that sees a later one. The next version
      breaks the writers until all three copies and the canonical one change. Carried and related: every sample and the check run on v4
      only, so nothing exercises v1 to v3 (TIC658-11 part 4).
    failure_scenario: "A project upgrades the memory tool to version 5 and its /vision play refuses every decisions file until Garura is reinstalled."
    principle_violated: README-VERSION-POLICY
    committed_source: "core/tools/memory/README.md 'Rules for this folder' (line 211, main)"
    suggested_direction: "State in the README or the contract how a consumer treats a version it did not build for (accept the versions it lists, or refuse with the versions named), and have the writers name the versions they accept in their refusal."

  - id: TIC659-12
    severity: P4
    backing: "carried shape: TIC658-7 raised the same for propose (P3); here it is narrower because ADR 008 limits pre-issue work to start-feature"
    file: "core/tools/memory/contract/v4.json (commands.cite request.required issue; $defs.issue integer >= 1; $defs.decision_record issue)"
    finding: >
      cite and citations require an issue, an integer of at least 1, and a short-term step must start with '<issue>/'. ADR 035 part 6 says
      "every decision", and ADR 008 part 4 says start-feature works before its issue number exists (in _pending/) and no other play does. A
      decision start-feature makes before it has an issue can be recorded nowhere. Small, because start-feature's early decisions are about
      the issue itself and not from memory, and the contract does not say so.
    failure_scenario: "start-feature decides a branch name from a rule in memory before the issue exists; it has no way to record it."
    principle_violated: ADR008-S4-PRE-ISSUE-WORK
    committed_source: "docs/adr/008 Decision part 4 and Negative (lines 88-106 and 199, main); docs/adr/035 Decision part 6 (lines 80-82, main)"
    suggested_direction: "Say in the contract that a decision made before its issue exists is recorded once the issue does, or is outside part 6."

carried_open:   # present in v4.json unchanged from base v3.json, scored in the 658 review, accepted by the owner for #675 ("Carried" in the 658 decision comment on main). Listed so the verdict can see them; not re-scored and not counted.
  - id: TIC658-1
    status: "still open, P2 as scored in the 658 review"
    note: >
      The /adr amendment for the five v3 rules (every update lands in short-term memory, promotion leaves the tool, typed approval has no
      record, blocking, the review tool writes approval) is still not made, and v4 adds TIC659-2 and TIC659-3 to what it must settle. The
      658 review's own escalation trigger (P1 if a story builds on v3 while the ADRs still say otherwise and the two disagree on a guarantee)
      was tested: v4 changes none of the v3 rules, so it is not met by this diff; it would be met if #661 or #663 build on v4 first.
  - id: TIC658-2
    status: "still open, P2 as scored in the 658 review; the owner carried it on main ('a caller can still run decide itself')"
    note: >
      answer_rules.decide_records_the_person still says "an agent never decides one", and nothing in the contract or its check can tell a
      person from an agent. v4 adds a path on top of it: a decision that rests on an applied update inherits an approval no one can prove
      (from_update). The suggested rewording of the rule (say what the contract can hold) was not made.
  - id: TIC658-3
    status: "FIXED in v4: waiting_drafts_are_hidden is stated (base v3.json has none). Its enforcement gap is TIC659-1."
  - id: TIC658-4_to_8
    status: "unchanged and still open at P3: a person's own answer lands in short-term memory; promotion has no way in; decided_in is review-tool only; propose needs an issue; blocking is a label"
  - id: TIC658-9
    status: "carried: the filed text of #659 now also differs from the delivery (a trace in place of 'the tier, the file, the lines and the fingerprint'; the review tool's design and mock are in the diff), and the PR body lists it. Whether and when the filed text changes is the owner's call."
  - id: TIC658-10_and_11
    status: "unchanged at P4, except TIC658-11 part 3, which this story was named to fix and is now TIC659-4"
