# How the grounding was done.
# Every principle below was read with `git show main:<path>` (ADR 008, 017, 032, 033, 034, 035, 036, the glossary, the IDD principles,
# the PR severity taxonomy, the base v3 contract, the base README, the base 653 plan, the filed story texts in the base 654 stories file,
# and the base 658 review record) or, for pr.md, from Phoenix memory at origin/main in ~/.garura/phoenix-memory (md5 identical to main's copy).
# Nothing is grounded in what this branch adds: v4.json's own description and answer rules, the new README text, the 659 plan, the PR body,
# the self-review and the code comments were read only as claims under test.
# Stated exceptions, so nothing is hidden. (1) The owner's decisions of 2026-10-18 and 19 that v4 builds (the trace of steps, three lines
# around a source, "waiting drafts are hidden" as the #675 note) are quoted in this branch's 659 plan. The caller told this review to use
# them as context. They are used to classify whether a departure is backed and nowhere else; they are never listed as a grounded principle,
# and every finding that leans on them says "branch record only". Where the same decision is on main (the 658 decision comment, the 653
# plan), the finding says so, and says it is a working note, not an ADR. (2) Observations about behaviour were made on scratch copies of the
# committed tool folder (a copy of this branch's head and a copy of main) under the session's scratch directory, outside the repository:
# the contract check was run, samples were edited and re-checked, and the tool was run over a throwaway Phoenix repository. No repository
# file was changed and nothing was committed. The tool and the check are read only to learn what the contract is tested against, never as a
# principle.

grounded_principles:
  - id: ADR035-S6-DECISION-NAMES-MEMORY
    statement: >
      Every decision an agent makes names the memory it came from: the tier, the file and the lines it rests on. "The shape of an
      answer and its source is settled in plan item 6."
    source: "docs/adr/035-agents-work-only-from-memory.md, Decision part 6 (lines 80-82, main)"
  - id: ADR034-S4-EVERY-ANSWER-NAMES-SOURCE
    statement: >
      Every answer a play takes from memory is recorded with where it came from. The drive's review shows the person what was assumed
      and on what basis. "An answer with no source is not allowed."
    source: "docs/adr/034-plays-answer-from-memory-inside-a-drive.md, Decision part 4 (lines 60-62, main)"
  - id: PLAN653-I6-AND-STORY-659-FILED
    statement: >
      Plan item 6 and the filed story text (working notes and a work order, not ADRs): one shape for an answer and its source, built on the
      trace format Garura already has (resolution.md, "Resolution Trace Output"); agents write it to the issue's short-term memory; a script
      checks each named source exists and its fingerprint still matches; a drive's review record carries the sources. Done when: the shape
      is written and a sample passes; the check fails a decision that names no source and one whose source changed; the drive review
      writer carries the sources. Not in the story: showing the sources in the review tool.
    source: ".garura/project/issues/653/specs/plan.md item 6 (lines 148-162, main); .garura/project/issues/654/specs/stories.yaml item 6 (lines 100-112, main)"
  - id: ADR035-S9-RESOLUTION-TRACE-GIVES-WAY
    statement: >
      ADR 015 is superseded in part: R1-R4, the fallback to the model, ltm_context and "the resolution trace built on it" give way to
      parts 3 to 6. So the older per-decision trace is the thing part 6 replaces.
    source: "docs/adr/035, Decision part 9, 'ADR 015' bullet (main)"
  - id: ADR036-ALT-DRAFT-MUST-NOT-ANSWER-A-LOOKUP
    statement: >
      A draft written where lookups read first would be found and used at once, with no person in between, "which ADR 035 section 5
      forbids". This is why an unapproved draft must never answer a lookup.
    source: "docs/adr/036-approved-answer-lands-in-short-term-memory.md, Alternatives Considered, 'The agent writes it to short-term memory alone' (line 128, main)"
  - id: ADR035-S5-NOTHING-UNAPPROVED
    statement: >
      Nothing from the model or the web is used until a person approves a memory update; "this holds for every agent and skill".
    source: "docs/adr/035, Decision part 5 (lines 70-78, main); amended by ADR 036 for where the approved update is written"
  - id: ADR036-S1-SHORT-TERM-IS-THIS-ISSUE
    statement: >
      Every lookup names its issue. Short-term memory is that issue's folder, never another issue's; Garura and Phoenix memory are read in
      full by every issue. Research is allowed only after all three tiers have nothing.
    source: "docs/adr/036, Decision part 1 (lines 36-43, main)"
  - id: ADR036-S6-WORKING-FILES-ARE-SHORT-TERM
    statement: >
      A play's own working files are read and written directly, and "the tool can still find those files later, as short-term memory".
      So files in an issue's folder are short-term memory unless a record says otherwise.
    source: "docs/adr/036, Decision part 6 (lines 68-72, main)"
  - id: ADR035-S1-TIERS-AND-DECISIONS-IN-GARURA
    statement: >
      Garura memory holds the subset of Phoenix memory the project pulled and what the project makes itself: "its product model, its
      intents, its decisions and the person's answers". Short-term memory is per issue: the plans, specs and context of the work.
    source: "docs/adr/035, Decision part 1 (lines 36-44, main)"
  - id: ADR035-S4-ONE-TOOL-EVERY-ANSWER-CITED-THE-SAME-WAY
    statement: >
      Agents and skills never read or write memory by a path; they call one tool. The tool covers all three tiers "so every answer is
      cited the same way". The plan on main says it returns, for every result, the tier, the file, the lines and a fingerprint of the text.
    source: "docs/adr/035, Decision part 4 (lines 61-68, main); .garura/project/issues/653/specs/plan.md line 81 (main); base v3.json every_result"
  - id: ADR033-S6-ONLY-REVIEW-STEP-WRITES-APPROVAL
    statement: >
      The review step writes approved or in progress, from the person's answers; plays write the model; the review tool writes nothing to
      the model. An approved piece keeps who approved it, when, and in which review.
    source: "docs/adr/033-approval-in-the-product-model.md, Decision parts 2 and 6 (lines 38-45 and 66-68, main)"
  - id: ADR036-NOT-DECIDED-WHO-WRITES-APPROVAL
    statement: "Open on main: who writes the approval when a person swipes right on a memory update."
    source: "docs/adr/036, Negative / Risks, 'Not decided here', second bullet (line 121, main)"
  - id: GLOSSARY-DECISION-RECORD-AND-TRACE
    statement: >
      A "decision record" is an ADR at any level, the ProductOS decision.yaml; accepted ones are kept, never edited, and they sit in the
      product model (Product LTM). A "Resolution trace" is the per-decision trace agents write to evidence/{play}/ saying which artifacts
      were read. "Evidence" documents "how decisions were reached", the audit trail of a play. The glossary is still two-tier and has no
      entry for Garura memory, Phoenix memory, a memory update or an agent's decision record.
    source: "core/grounding/glossary.md lines 37, 42, 43, 61, 111, 113 (main)"
  - id: ADR017-STM-WHITELIST
    statement: >
      Issue short-term folders are specs/ (plans), evidence/{play}/ (test and eval evidence), context/ ("prepare / architecture context")
      and review/ (review artifacts).
    source: "docs/adr/017-folder-whitelist.md lines 51-55 and 104-108 (main)"
  - id: ADR008-S4-PRE-ISSUE-WORK
    statement: >
      A play can need working space before the issue number exists; the two-phase _pending/ write "only applies to start-feature; other
      plays have issue context upfront".
    source: "docs/adr/008-issue-centric-stm-and-nwwi.md, Decision part 4 and Negative (lines 88-106 and 199, main)"
  - id: README-VERSION-POLICY
    statement: "The contract changes only by a new version; earlier versions are kept as they were."
    source: "core/tools/memory/README.md, 'Rules for this folder' (line 211, main)"
  - id: V3-BASE-CONTRACT
    statement: >
      The base contract (v3): no answer rule says a waiting draft is hidden from lookups; settings text names phoenix_ref and the pull
      folder only; errors.changed means the update's target changed after it was proposed; cite has a first-version shape "refined by the
      citations story"; the lookup order and request rules are what v4 keeps.
    source: "core/tools/memory/contract/v3.json on main (answer_rules, settings, errors, commands.cite); .garura/project/issues/658/review/decision-comment.md (the three notes the owner approved #675 on, main)"
  - id: IDD-P3-OBSERVABLE-BINARY
    statement: >
      A condition that cannot be observed and evaluated true or false "creates false confidence that problems will be caught."
    source: "docs/philosophy/idd-principles.md, Principle 3 (lines 75-98, main)"
  - id: PR-SEVERITY-TAXONOMY
    statement: >
      P1 blocker (security, secrets, auth, data-loss, breaking API contract); P2 major (missing tests for new code, error-handling
      violations, structural violations); P3 minor (missing docs, naming); P4 nit. No Standard ID row maps to "a contract ahead of the ADR it
      follows" or "a rule the check does not hold", so each finding is classed by the bucket definitions and by how the 655, 657 and 658
      reviews classed the same kind of finding (a backed departure with the amendment owed was P3; a contract that disagrees with an ADR, or
      a guarantee that is stated and not held, was P2).
    source: "core/components/memory/standards/rules/pr.md, Severity buckets (lines 7-11, main; ~/.garura/phoenix-memory/standards/rules/pr.md is the same file, md5 checked)"

