# How the grounding was done.
# Every principle below was read from a committed source: main (git show main:<path>), main's docs/adr, main's standards rules, or Phoenix
# memory at origin/main (~/.garura/phoenix-memory; standards/rules/pr.md has the same md5 as main's copy, f06e57a7). Nothing is grounded
# in what this branch adds. ADR 037 is branch content the owner accepted through /adr: where the branch departs from main's ADR text this
# file says whether ADR 037 covers the departure (departures_from_main_adrs), and ADR 037's own words are never the standard.
# The branch's own prose (the contract's new sentences, the README, the plan, the PR body, resolution.md, the code comments) was read as
# claims under test only.
# Everything observed was observed on scratch copies of the committed tool folder (head, round 1's head fa73b2b5 and main), built with git
# archive into the session's scratch directory outside the repository, on a macOS case-insensitive disk with Python 3.14, with a throwaway
# project (a Phoenix git repository, a Garura folder with the short-term folder inside it). No repository file was changed, nothing was
# committed or pushed, and GitHub was not touched.

grounded_principles:
  - id: ADR036-ALT-DRAFT-MUST-NOT-ANSWER-A-LOOKUP
    statement: >
      A draft written where lookups read first would be found and used at once with no person in between, "which ADR 035 §5 forbids". So an
      unapproved draft must never answer a lookup.
    source: "docs/adr/036-approved-answer-lands-in-short-term-memory.md, Alternatives Considered, first bullet (line 128, main)"
  - id: NOTE-675-DRAFT-HIDDEN-ON-MAIN
    statement: >
      The owner approved #675 on a note that contract version 3 states a waiting draft is hidden from lookups, "the tool already does this,
      and a test checks it". A working note, not an ADR.
    source: ".garura/project/issues/658/review/decision-comment.md line 9 (main)"
  - id: ADR036-S1-SHORT-TERM-IS-THIS-ISSUE
    statement: >
      Every lookup names its issue. Short-term memory is that issue's folder, never another issue's; Garura and Phoenix memory are read in
      full by every issue.
    source: "docs/adr/036 Decision part 1 (lines 36-43, main); core/tools/memory/contract/v3.json lookup_rule (main)"
  - id: ADR036-S6-WORKING-FILES-FOUND-AS-SHORT-TERM
    statement: >
      A play's own working files are read and written directly, and "the tool can still find those files later, as short-term memory".
    source: "docs/adr/036 Decision part 6 (lines 68-70, main)"
  - id: ADR035-S5-NOTHING-UNAPPROVED
    statement: "Nothing from the model or the web is used until a person approves a memory update."
    source: "docs/adr/035-agents-work-only-from-memory.md, Decision part 5 (lines 70-78, main)"
  - id: ADR035-S6-DECISION-NAMES-MEMORY
    statement: >
      Every decision an agent makes names the memory it came from: "the tier, the file and the lines it rests on"; "the shape of an answer
      and its source is settled in plan item 6".
    source: "docs/adr/035 Decision part 6 (lines 80-82, main); .garura/project/issues/653/specs/plan.md item 6 (lines 148-162, main)"
  - id: ADR035-S1-DECISIONS-IN-GARURA-MEMORY
    statement: "Garura memory holds what the project makes itself: \"its product model, its intents, its decisions and the person's answers\"."
    source: "docs/adr/035 Decision part 1 (lines 36-44, main); core/grounding/glossary.md lines 37, 61, 111, 113 (main): a 'decision record' is an ADR at any level"
  - id: V3-RESPONSE-ALWAYS-JSON
    statement: >
      "A response is always a JSON object with ok, contract_version and command." The tool's own command-line parser says a command line it
      cannot read is "answered as bad_request, never a bare usage error".
    source: "core/tools/memory/contract/v3.json, description (main); core/tools/memory/memory.py BadFlags docstring (line 409, main)"
  - id: V3-README-IS-THE-PLAIN-WORDS-GUIDE
    statement: >
      The contract names the README as its plain-words guide ("Plain-words guide: ../README.md"), and the README repeats the path rule
      ("never start with a slash and never contain ..").
    source: "core/tools/memory/contract/v3.json description (main); core/tools/memory/README.md 'What every answer carries' (lines 139-140, main)"
  - id: README-VERSION-POLICY
    statement: "The contract changes only by a new version; earlier versions are kept as they were."
    source: "core/tools/memory/README.md, 'Rules for this folder' (line 211, main)"
  - id: IDD-P3-OBSERVABLE-BINARY
    statement: >
      A condition that cannot be observed and evaluated true or false "creates false confidence that problems will be caught." A check that
      refuses a sample for a reason other than the rule it is named for proves nothing about that rule.
    source: "docs/philosophy/idd-principles.md, Principle 3 (lines 75-98, main)"
  - id: ADR033-S6-ONLY-REVIEW-STEP-WRITES-APPROVAL
    statement: "An approval keeps who and when; only the review step writes it."
    source: "docs/adr/033-approval-in-the-product-model.md, Decision parts 2 and 6 (lines 38-45 and 66-68, main)"
  - id: ADR034-S4-EVERY-ANSWER-NAMES-SOURCE
    statement: "Every answer a play takes from memory is recorded with where it came from; the drive's review shows what was assumed and on what basis."
    source: "docs/adr/034-plays-answer-from-memory-inside-a-drive.md, Decision part 4 (lines 60-62, main)"
  - id: ADR035-S4-ONE-TOOL-EVERY-ANSWER-CITED-THE-SAME-WAY
    statement: "The one tool covers all three tiers \"so every answer is cited the same way\": for every result, the tier, the file, the lines and a fingerprint."
    source: "docs/adr/035 Decision part 4 (lines 61-68, main); core/tools/memory/contract/v3.json every_result (main)"
  - id: ADR008-S4-PRE-ISSUE-WORK
    statement: "Only start-feature works before its issue number exists (the _pending/ write); other plays have issue context upfront."
    source: "docs/adr/008-issue-centric-stm-and-nwwi.md, Decision part 4 and Negative (lines 88-106 and 199, main)"
  - id: ADR017-FOLDERS-ARE-LOWERCASE
    statement: "An issue's short-term folders are specs/, evidence/{play}/, context/ and review/."
    source: "docs/adr/017-folder-whitelist.md lines 51-55 and 104-108 (main)"
  - id: PR-SEVERITY-TAXONOMY
    statement: >
      P1 blocker (security, secrets, auth, data-loss, breaking API contract); P2 major (missing tests for new code, error-handling
      violations, structural violations); P3 minor (missing docs, naming); P4 nit. No Standard ID row maps to "a guarantee a contract states
      and the tool does not hold", so each finding is classed by the bucket definitions and by how the 655, 657, 658 reviews and round 1
      classed the same kind (a stated guarantee not held was P2; a backed departure with the amendment owed, or a gap only a second engine
      meets, was P3).
    source: "core/components/memory/standards/rules/pr.md, Severity buckets (lines 7-11, main; ~/.garura/phoenix-memory/standards/rules/pr.md is the same file, md5 checked)"

grounding_not_available:
  - >
    No committed record says how a consumer of the contract treats a later contract version (TIC659-11 stands on this gap). Only the base
    README's version rule exists.
  - >
    The glossary on main still describes two tiers and has no entry for Garura memory, Phoenix memory, a memory update, a citation or an
    agent's decision record, so it cannot ground naming for those words; it grounds only the older meanings of "decision record" and
    "resolution trace" (TIC659-3).
  - >
    Nothing committed on main says how a person's approval of an agent decision is written. ADR 033 part 6 and ADR 036's open bullet are the
    only text. v4 holds no approval field, so nothing is tested here.

