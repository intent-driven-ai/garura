# ---------------------------------------------------------------------------------------------------------------------------------------
findings:
  - id: TIC659-13
    severity: P3
    origin: "the listing side and the settings side of the guarantee TIC659-1 was about; round 1 did not probe them"
    backing: >
      not a departure backed by a decision: a stated "never" that is not held on two of the three commands it names. The rule is backed on
      main (ADR 036 line 128; the #675 note, 658 decision comment line 9, which says the tool already hides drafts). The settings case is
      also the same on main's tool (carried code behaviour for another issue's notes read through the Garura tier).
    cross_category: executable-code   # the flaw is in memory.py (FolderEngine.files, grep, excluded); the contract sentences below are the contract half
    file: >
      core/tools/memory/contract/v4.json (answer_rules.waiting_drafts_are_hidden; paths; description 'a waiting draft is never found by a
      lookup'); core/tools/memory/memory.py (FolderEngine.files, FolderEngine.grep, FolderEngine.excluded, FolderEngine.hidden)
    finding: >
      The branch's fix puts the hiding decision in a new method, hidden(), that works on the file a path reaches (real path, letter case
      folded), and calls it from read, so from cite and citations --check too. find (files) and search (grep) still decide on the listed name
      with a case-sensitive prefix test (excluded), and excluded('garura') is worked out from the settings as typed, not from the real
      folders. So the same guarantee is kept by two rules. Observed on scratch copies on this machine's case-folding disk: (a) the issue
      folder already holds '7/Review/' (a differently spelled folder; the tool's own propose then writes into it, because the disk folds
      case): find lists '7/Review/memory-updates/<id>.json', and search returns the draft's text, while read of the very path find listed
      answers not_found. (b) the short-term setting spelled '.../ISSUES' while the folder is 'issues': find and search in the Garura tier
      list another issue's short-term notes ('issues/8/notes.md'), which ADR 036 part 1 says a lookup never reads; read refuses. With the two
      roots given through different links ('/tmp/...' for Garura memory, '/private/tmp/...' for short-term memory) find lists them and read
      of 'issues/8/notes.md' returns the other issue's note (main's tool does the same). (c) a hard link to a draft inside the issue folder:
      read returns the draft; realpath compares names, not the file. On a case-sensitive disk the error goes the other way: read refuses
      '7/Context/citations.jsonl' while find lists it. The contract's new sentences say more than the tool keeps: 'a lookup (find, search,
      read) never returns' a waiting draft 'however its path is spelled', and 'One file has one spelling, so what a lookup hides cannot be
      reached by spelling its path another way'. The grammar makes the second true only for '.', '//' and a trailing slash; for case and links
      it is the tool's decision, and the tool makes it in read only. The three new tests exercise read and cite; none exercises find or search.
    failure_scenario: >
      On a Mac where a folder named 'Review' already sits in an issue's folder (or a settings file spells a folder in other case), an agent that
      searches for words in a waiting memory update gets the model's unapproved draft back as a hit and decides from it, with no person in
      between: what ADR 036 line 128 and ADR 035 part 5 forbid.
    principle_violated: ADR036-ALT-DRAFT-MUST-NOT-ANSWER-A-LOOKUP
    committed_source: >
      docs/adr/036 Alternatives Considered (line 128, main); docs/adr/036 Decision part 1 (lines 36-43, main); core/tools/memory/contract/v3.json
      lookup_rule (main); .garura/project/issues/658/review/decision-comment.md line 9 (main).
    suggested_direction: >
      Decide hiding once, in one place: have files() and grep() ask hidden() for each name they would list (it already resolves the real
      path), and work excluded('garura') out from the real paths of both roots. Add one test each for find and search with a differently
      spelled folder and with a differently spelled setting. In the contract, keep 'the tool decides on the file a path reaches' and drop 'One
      file has one spelling', which only the grammar half of the claim supports. Why P3 and not P2: round 1's P2 was a path any caller could
      type and it is closed; what is left needs a machine whose folders or settings are spelled unlike the tool's lowercase defaults (ADR 017's
      folders are lowercase and the tool writes 'review/'), nothing in this repository creates one, and read and cite, the commands a decision
      walks, hold. It becomes P2 if a play or the review tool is found writing a differently spelled 'review/' folder, or if the project's own
      settings spell the roots through links.

  - id: TIC659-14
    severity: P2
    origin: "a fault the TIC659-1 fix introduced"
    backing: >
      not a departure: a stated guarantee not held, and a regression. The base contract says "A response is always a JSON object"; main's
      tool answers a path with a NUL character, and one with a lone surrogate, with not_found; round 1's head did too.
    cross_category: executable-code   # memory.py hidden() and run(); the guarantee is the contract's, so it is reported here
    file: >
      core/tools/memory/memory.py (FolderEngine.hidden, FolderEngine.read, run); core/tools/memory/citations.py (CitationStore.source_problem,
      reached by cite and by citations --check); core/tools/memory/contract/v4.json ($defs.path pattern)
    finding: >
      hidden() calls os.path.realpath on the requested path with no guard. The contract's path pattern accepts a NUL character
      ('7/notes\u0000.md' in a JSON request) and a lone surrogate ('7/\ud800.md'); run() catches only Refusal and OSError. Both now end the
      process with a traceback and no JSON on stdout. Observed on scratch copies, same request on each: main (v3) and round 1's head answer
      {"ok": false, ... "error": {"code": "not_found"}}; the head answers with 'ValueError: lstat: embedded null character in path' (read in
      short-term memory, read in Garura memory, and cite with a step whose source path holds a NUL) and 'UnicodeEncodeError: ... surrogates not
      allowed' (read in short-term memory). 'citations --check' over an issue whose decision file holds one hand-edited record with a NUL in a
      source path now stops with the same traceback for the whole issue; round 1's head answered ok and flagged the record. Cause: the old code
      used os.path.isfile, which turns these into False; the fix replaced it with an unguarded realpath. Carried and the same kind: on main a
      NUL in a search pattern and in a Phoenix read path already crash (ValueError: embedded null byte), unchanged by this branch. No test
      sends such a path.
    failure_scenario: >
      An agent builds a path from text that holds a stray NUL or a broken character and gets a stack trace instead of an answer; a decision
      with such a path cannot be recorded or refused cleanly, and the audit command (citations --check) stops for the whole issue on one bad
      line instead of naming it.
    principle_violated: V3-RESPONSE-ALWAYS-JSON
    committed_source: >
      core/tools/memory/contract/v3.json description, 'A response is always a JSON object with ok, contract_version and command.' (main);
      core/tools/memory/memory.py BadFlags docstring, 'never a bare usage error' (line 409, main); core/components/memory/standards/rules/pr.md
      P2 bucket, 'error-handling violations' (main).
    suggested_direction: >
      Treat ValueError (UnicodeEncodeError is one) like the old isfile did: catch it around the real-path step in hidden() and answer
      not_found (or bad_request), and, if the grammar should refuse the character instead, add \x00 to the pattern's excluded set. Add one
      test per class (a NUL, a lone surrogate) for read, cite and citations --check. Fix the carried search-pattern and Phoenix-read crashes
      in the same pass. Why P2: an error-handling violation (pr.md P2 bucket) against a guarantee the contract states, newly introduced by
      the fix, with no test. Why not P1: it fails before any file is read, so nothing leaks and nothing is lost, and the tool is local and
      not yet called by an agent. It stays P2 rather than P3 because it makes the audit command stop.

  - id: TIC659-15
    severity: P4
    backing: "n/a: a plain-words guide that no longer matches the contract it explains"
    file: "core/tools/memory/README.md ('What every answer carries', Paths bullet, lines 142-143); core/tools/memory/contract/v4.json (paths)"
    finding: >
