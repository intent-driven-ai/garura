verification_of_tic659_1:
  claim_1_path_rule_refuses_dot_and_empty_segments:
    verdict: HOLDS
    observed:
      - "The new $defs.path pattern, tried on 26 spellings with Python's re: refuses '.', './a', 'a/.', 'a/./b', 'a/b/./', 'a//b', 'a/b/', '/a', 'a/..b', 'a/b/..', 'a/b\\c'; accepts 'a/.b', '.a/b', 'a/b.', 'a b'."
      - "check_contract.py on a scratch copy: ok true, contract_version 4, 26 samples valid, 0 failed, 0 commands without a sample, 34 of 34 broken samples refused (round 1 saw 32; the two new ones, read-path-with-dot-segment and read-path-with-empty-segment, are each refused for the path pattern itself), 0 boundary problems. test_check_contract.py 56 tests OK. test_pull.py 13 tests OK."
      - "The tool answers bad_request, before it touches memory, for '7/review/./memory-updates/<id>.json', '7/./review/...', '7/review//memory-updates/...', '7/context/./citations.jsonl', '7/notes.md/', './7/notes.md', '.', '7/.', and for Garura './issues/8/notes.md' and Phoenix 'knowledge/./domains/...' and 'knowledge//domains/...'; cite refuses a step whose source path has a '.' or empty segment with bad_request."
  claim_2_the_tool_decides_hiding_on_the_real_file_case_and_links_included:
    verdict: HOLDS FOR read, cite AND citations --check; DOES NOT HOLD FOR find AND search (TIC659-13)
    observed:
      - "read: '7/Review/memory-updates/<id>.json', '7/review/MEMORY-UPDATES/<id>.json', an upper-cased file name, '7/CONTEXT/Citations.jsonl' and Garura 'Issues/7/notes.md' / 'ISSUES/7/notes.md' all answer not_found (round 1's tool returned the draft for the first); a directory link '7/drafts' to 'review' and a file link to a draft answer not_found; Garura 'issues/8/notes.md' and 'issues/7/review/memory-updates/<id>.json' answer not_found; a plain note '7/notes.md' and Garura 'knowledge/g.md' still read."
      - "find and search with the plain layout never list a draft, a decision record or another issue's note. With a differently spelled folder or setting they do (TIC659-13)."
      - "A hard link to a draft inside the issue folder: read returns the draft (TIC659-13, part c)."
  claim_3_cite_cannot_rest_on_a_hidden_file:
    verdict: HOLDS
    observed:
      - "cite with a step whose source is the waiting draft, the decision file, or either in other letter case: not_found, nothing recorded (dot and empty spellings: bad_request)."
      - "citations --check over five hand-written records that rest on the draft or the decision file (plain, '.' segment and other-case spellings, as an older tool or a hand edit could have stored them): ok true, each flagged source_missing with its step; round 1's tool passed them."
  tests:
    - "test_memory.py on the head copy: 65 tests OK. The three new tests (class HiddenWhateverTheSpelling), run against round 1's committed tool with the new test file: 1 error and 2 failures; the commit message's claim that each spelling fails on the old tool holds. The tests exercise read and cite only; none exercises find or search, and none sends a path with a NUL (TIC659-13, TIC659-14)."
  new_fault_found_while_verifying: TIC659-14

