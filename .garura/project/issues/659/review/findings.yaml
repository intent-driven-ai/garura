- id: DR-1
  severity: P3
  category: memory
  layer: design-grounding (change-reviewer)
  file: core/components/memory/standards/rules/resolution.md
  line: 99-116 (new section), against 1-4 and 118-135 of the same file
  basis: 'G6, G1, G2 — committed source: G6: the base file binds the protocol on ltm_context, makes the two isolated agents
    an exemption, and says no trace is produced without ltm_context; ADR 035 section 9 retires ltm_context but names no replacement
    scope for the exemption or for Backward Compatibility. G1 and G2 set the widening (every decision), so the new section
    is the right place to say how it relates to the old text; ADR 035''s own Negative / Risks says old and new sit side by
    side until each agent moves, which makes the statement of which governs the section''s job. Classed P3 (documentation
    that misleads, not a defect in anything that runs): no agent reads the section yet, and the ADR accepts the transition.

    '
  finding: 'The new section says every decision an agent makes keeps its trace, with no condition. The rest of the same file,
    unchanged by this branch, says the opposite for the same agents. (1) The file opens as ''the standard that all participating
    agents follow when ltm_context is present'', and Backward Compatibility (lines 129-135) says that with no ltm_context
    the protocol is skipped and ''No trace is produced''. Only one play passes ltm_context today, so for nearly every agent
    that clause is the one in force. (2) Context Isolation Exemptions (118-127) says the evals-engineer and the judge never
    receive ltm_context, in terms of ltm_context; ''every decision'' now also covers a judge''s verdict, which rests on no
    memory at all, and the section carves nothing out. (3) The section never says when it starts to bind. Its last sentence
    defers only the old R1-R4 trace to the agents'' move (#663); ''Every decision an agent makes keeps its trace'' and ''A
    drive''s review shows these records'' read as present fact, while the review step and its tools are not built (ADR 033
    Negative / Risks) and no agent records a trace yet. An agent reads exact lines of a rule through the memory tool (ADR
    035 section 4), not the whole file, so the clauses that limit the section are not in front of whoever reads the section.

    '
- id: DR-2
  severity: P3
  category: memory
  layer: design-grounding (change-reviewer)
  file: core/components/memory/standards/rules/resolution.md
  line: 115-116
  basis: 'G3, G5 — committed source: ADR 035 section 5 (no decision from the model or the web; a memory update instead) and
    section 9 (R1-R4, its fallback to the model and the resolution trace give way); ADR 015 line 3 (superseded in part); glossary
    line 43 (Resolution trace is its own term). The text on R4 is not changed by this diff, so the finding is on the new sentence
    and on leaving the old rule unmarked beside it, not on R4 itself.

    '
  finding: 'The closing sentence says ''The trace above (R1-R4), and R4''s model fallback, become this trace when the agents
    move onto the tool.'' Two inaccuracies against the accepted ADR. (1) R4''s fallback to the model does not become a trace
    under ADR 035: it is forbidden (section 5), replaced by a memory update a person approves, and the resolution trace built
    on it ''gives way'' (section 9). Read literally the sentence keeps the fallback and records it; it would be a flagged
    model answer with a trace, which is what ADR 034 section 4 and ADR 035 section 5 rule out. (2) ''The trace above (R1-R4)''
    mixes the two things on main: R1-R4 are four steps; the trace is the Resolution Trace Output block (lines 80-97). The
    glossary keeps ''Resolution trace'' as a separate term. R4 itself (''the agent proceeds with general reasoning'', line
    71-78) still reads as permitted in the same file, with no mark that ADR 035 supersedes it.

    '
- id: DR-3
  severity: P3
  category: memory
  layer: design-grounding (change-reviewer)
  file: core/components/memory/standards/rules/resolution.md
  line: 99 (heading), 109 ('who decided'), 115 ('this trace')
  basis: 'G5 — committed source: G5. ADR 035 section 1 names the care taken so a name is never confused (''Garura memory'',
    not ''project memory'' or ''LTM''); the glossary on main gives ''decision record'' to ADRs; pr.md puts naming in P3. Classed
    P3, not P4: the name sits in a rule that lands in the shared tier and is found by text search, so a collision misroutes,
    it does not only read oddly.

    '
  finding: 'The section is titled ''Decision Records'' and calls the object a ''record'' of a ''decision'' that has ''who
    decided''. On main ''decision record'' already means an ADR: the glossary defines ''a decision record = an ADR at any
    level'', and four rules use the phrase for an ADR that a person accepts. ''Decided'' in the drive''s review record is
    the person''s review answer (it reads ''decided: false'' until the drive''s review answers it), while here ''who decided''
    is the agent. ''Trace'' now has two shapes in one file (the Resolution Trace Output above and ''this trace''). An agent
    or a person who searches memory for a decision record lands here, or the other way round; Phoenix memory serves this file
    to every project.

    '
- id: DR-4
  severity: P3
  category: memory
  layer: design-grounding (change-reviewer)
  file: core/components/memory/standards/rules/resolution.md
  line: 101-113
  basis: 'G2, G3, G4 — committed source: ADR 034 section 4 (''An answer with no source is not allowed''); ADR 035 section
    5 (no model or web decision, a memory update instead) and section 6; plan item 6 on main (''agents write it to short-term
    memory''; the check ''fails an answer that names no source''); ADR 036 section 1. G3 and G4 were read with the plan as
    a working note, so the plan''s wording is a pointer, the ADR sentences are the basis.

    '
  finding: 'The section describes the record and the tool; it never tells an agent what to do. (1) Its one normative sentence
    is the first (''Every decision an agent makes keeps its trace''). It does not say that the agent makes the record through
    `cite` before it returns the decision, or that a decision with no source is not allowed (ADR 034 section 4). The only
    thing it says about a missing source is that `citations --check` flags ''a decision with no trace''; a decision that was
    never recorded is not a record, so nothing flags it. The sentence promises more than the mechanism it describes can check.
    (2) It does not say what an agent does when no tier answers. ADR 035 section 5 is the other half of the same rule: raise
    a memory update and wait for a person''s approval. The section covers only the happy path in which the answer came ''from
    a memory update a person approved''. (3) It does not say where the record is kept; main''s plan item 6 and ADR 036 section
    1 say the issue''s short-term memory, one issue per lookup.

    '
- id: DR-5
  severity: P3
  category: memory
  layer: design-grounding (change-reviewer)
  file: core/components/memory/standards/rules/resolution.md
  line: 101-113
  basis: 'G1, G4 — committed source: ADR 035 section 6 (the shape is settled in plan item 6); plan item 6 on main (one source
    per decision; fingerprint check; review record carries them); ADR 035 section 2 and Phoenix''s README (every change to
    Phoenix memory is a commit with review, and a person approves every promotion, so what lands there should be backed by
    a committed record). Classed P3, not P2: the contract is where the shape is enforced and is graded there; this section
    only points at it (''The shape is the memory tool''s contract'') and the wider shape is a refinement of ADR 035 section
    6, not a reversal of it.

    '
  finding: 'The section states, as a rule for every agent, a shape that is wider than any committed record: a trace of ordered
    steps, each with what the agent looked for, what it found and a source, with the exact text, the memory''s version and
    the surrounding lines kept, and who decided. What is committed on main is narrower: ADR 035 section 6 says a decision
    names ''the tier, the file and the lines it rests on'' and defers the shape to plan item 6, which on main says ''one shape
    ... built on the trace format Garura already has'' (one source per decision) with a fingerprint check. The multi-step
    trace and the kept text are grounded only in the branch''s own plan and the owner''s remarks quoted there, which are not
    groundable. The branch says the ADR change is carried as its own /adr change; no docs/adr path is in the diff. The rule
    would reach Phoenix memory at landing before the record that backs it. Whether the wider shape is a refinement the ADR
    leaves open (''settled in plan item 6'') is judged with the contract in the tool-interface-contract category; this finding
    is only about the rule''s landing order and its source line.

    '
- id: DR-6
  severity: P4
  category: memory
  layer: design-grounding (change-reviewer)
  file: core/components/memory/standards/rules/resolution.md
  line: 109-115
  basis: 'G7 — committed source: The rules index says a rule is ''the single source of truth for the domain, not a copy of
    skill prose'' and that what is ''resolvable from the code itself stays in the code''; ADR 035 section 4 says the tool
    is replaceable behind its contract (Griffin later) without changing Garura or its agents, so a rule that names one tool
    version couples agents to it; ADR 035 section 2 defines versions for Phoenix memory only.

    '
  finding: 'The second and third paragraphs restate what the memory tool does and what its contract holds: it reads every
    source before it records, keeps the exact text, the memory''s version and the lines around it, re-reads on `citations
    --check`. They also pin ''version 4'' of the contract in a rule. The contract is the one place that states this; the rule
    now holds a second copy that will drift when the tool or the contract moves to a new version (the contract''s own policy
    is that it changes by a new version; a rule that names ''version 4'' goes stale at version 5). ''The version of memory''
    is a term the committed record defines only for Phoenix memory (what a project pulled, and from which version); the section
    applies it to every tier without saying what it means for short-term or Garura memory.

    '
