- id: TIC659-1
  severity: P2
  category: tool-interface-contract
  layer: design-grounding (change-reviewer)
  file: 'core/tools/memory/contract/v4.json (answer_rules.waiting_drafts_are_hidden, answer_rules.cite_reads_its_sources,
    $defs.path, commands.cite summary and response.stored); core/tools/memory/memory.py (FolderEngine.excluded, FolderEngine.read);
    core/tools/memory/citations.py (CitationStore.source_problem)

    '
  line: null
  basis: 'ADR036-ALT-DRAFT-MUST-NOT-ANSWER-A-LOOKUP — committed source: docs/adr/036 Alternatives Considered (line 128, main);
    docs/adr/035 Decision part 5 (lines 70-78, main); docs/adr/036 Decision part 1 (lines 36-43, main); .garura/project/issues/658/review/decision-comment.md
    (the waiting-draft note, main).

    '
  finding: 'The contract says a lookup "never returns a memory update that waits for a person" and that decision records are
    never returned. The tool keeps that for the plain path only. Run over a throwaway project on a scratch copy: reading ''7/review/./memory-updates/<id>.json''
    or ''7/review//memory-updates/<id>.json'' returns the waiting draft; reading ''7/context/./citations.jsonl'' (or ''7/./context/...'',
    ''7/context//...'') returns the decision records; on this machine''s case-insensitive filesystem ''7/Review/memory-updates/<id>.json''
    returns the draft; reading ''./issues/8/notes.md'' in the Garura tier returns another issue''s short-term note (ADR 036
    part 1). The path grammar in the contract ($defs.path: no leading slash, no ''..'', no backslash or line break) accepts
    every one of these. The cite answer itself hands the caller the hidden file''s path (''stored.path'', ''7/context/citations.jsonl'').
    Worse, cite reads each source through the same call: a trace step whose source is the waiting draft, or the agent''s own
    earlier decision record, written in one of these forms was recorded (ok true), and ''citations --check'' then answered
    no problem. So a decision can be recorded as resting on memory no person approved, and nothing in the record or the check
    shows it.

    '
