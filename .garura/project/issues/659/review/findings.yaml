    main); .garura/project/issues/653/specs/plan.md line 81 (main); base v3.json every_result (main)'
  finding: 'every_result says every piece of text the tool returns carries its tier, file, lines and fingerprint. A source_changed
    problem returns the text the lines hold now (''now'') and the lines around it (''now_around'') with no fingerprint of
