- id: TIC659-16
  severity: P4
  category: tool-interface-contract
  layer: design-grounding (change-reviewer)
  file: 'core/tools/memory/contract/v4.json ($defs.path pattern); core/tools/memory/contract/samples/broken/read-path-with-newline.json;
    core/tools/memory/contract/check_contract.py (validate: re.search)

    '
  line: null
  basis: 'IDD-P3-OBSERVABLE-BINARY — committed source: docs/philosophy/idd-principles.md Principle 3 (lines 75-98, main);
    core/tools/memory/contract/v3.json $defs.path and samples/broken/read-path-with-newline.json (main)'
  finding: 'The pattern''s last class, [^\\\n\r]+$, means ''no backslash and no line break'', but ''$'' in Python''s re also
    matches before one trailing newline, so ''a/b\n'' passes the pattern in this tool and in the contract check (tried with
    re.search); a JSON Schema validator in ECMA rules would refuse it. The broken sample for the rule, read-path-with-newline,
    holds the path ''a\n../b'', which is refused for the ''..'' it also holds, so it does not prove the line-break rule. No
    hiding bypass follows (a name that ends in a newline is a different file), and the owner''s fix did not claim to touch
    it.

    '
