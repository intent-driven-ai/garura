    (the drive review writer carries the sources, main); base v3.json answer_rules.updates_filter (main).

    '
  finding: 'A drive''s review is built from ''citations --play P''. The contract makes play optional on cite and a free non-empty
    string, with no rule on its form. The tool filters by exact string equality, and the drive-record writer expects ''/''
    plus the play''s name (''/vision''), and treats any record whose play differs as another play''s and refuses the whole
    file. So a decision cited with no play, or as ''vision'', never reaches any drive''s review, and a consumer passing ''--play
    vision'' gets an empty answer: a silent skip, which the contract''s own lookup rules call an error elsewhere. The play
    filter also has no answer rule, where updates has ''updates_filter''.

    '
