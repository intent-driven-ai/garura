- id: TIC659-13
  severity: P3
  category: tool-interface-contract
  layer: design-grounding (change-reviewer)
  file: 'core/tools/memory/contract/v4.json (answer_rules.waiting_drafts_are_hidden; paths; description ''a waiting draft
    is never found by a lookup''); core/tools/memory/memory.py (FolderEngine.files, FolderEngine.grep, FolderEngine.excluded,
    FolderEngine.hidden)

    '
  line: null
  basis: 'ADR036-ALT-DRAFT-MUST-NOT-ANSWER-A-LOOKUP — committed source: docs/adr/036 Alternatives Considered (line 128, main);
    docs/adr/036 Decision part 1 (lines 36-43, main); core/tools/memory/contract/v3.json lookup_rule (main); .garura/project/issues/658/review/decision-comment.md
    line 9 (main).

    '
  finding: 'The branch''s fix puts the hiding decision in a new method, hidden(), that works on the file a path reaches (real
    path, letter case folded), and calls it from read, so from cite and citations --check too. find (files) and search (grep)
    still decide on the listed name with a case-sensitive prefix test (excluded), and excluded(''garura'') is worked out from
    the settings as typed, not from the real folders. So the same guarantee is kept by two rules. Observed on scratch copies
    on this machine''s case-folding disk: (a) the issue folder already holds ''7/Review/'' (a differently spelled folder;
    the tool''s own propose then writes into it, because the disk folds case): find lists ''7/Review/memory-updates/<id>.json'',
    and search returns the draft''s text, while read of the very path find listed answers not_found. (b) the short-term setting
    spelled ''.../ISSUES'' while the folder is ''issues'': find and search in the Garura tier list another issue''s short-term
    notes (''issues/8/notes.md''), which ADR 036 part 1 says a lookup never reads; read refuses. With the two roots given
    through different links (''/tmp/...'' for Garura memory, ''/private/tmp/...'' for short-term memory) find lists them and
    read of ''issues/8/notes.md'' returns the other issue''s note (main''s tool does the same). (c) a hard link to a draft
    inside the issue folder: read returns the draft; realpath compares names, not the file. On a case-sensitive disk the error
    goes the other way: read refuses ''7/Context/citations.jsonl'' while find lists it. The contract''s new sentences say
    more than the tool keeps: ''a lookup (find, search, read) never returns'' a waiting draft ''however its path is spelled'',
    and ''One file has one spelling, so what a lookup hides cannot be reached by spelling its path another way''. The grammar
    makes the second true only for ''.'', ''//'' and a trailing slash; for case and links it is the tool''s decision, and
    the tool makes it in read only. The three new tests exercise read and cite; none exercises find or search.

    '
- id: TIC659-14
  severity: P2
  category: tool-interface-contract
  layer: design-grounding (change-reviewer)
  file: 'core/tools/memory/memory.py (FolderEngine.hidden, FolderEngine.read, run); core/tools/memory/citations.py (CitationStore.source_problem,
    reached by cite and by citations --check); core/tools/memory/contract/v4.json ($defs.path pattern)

    '
  line: null
  basis: 'V3-RESPONSE-ALWAYS-JSON — committed source: core/tools/memory/contract/v3.json description, ''A response is always
    a JSON object with ok, contract_version and command.'' (main); core/tools/memory/memory.py BadFlags docstring, ''never
    a bare usage error'' (line 409, main); core/components/memory/standards/rules/pr.md P2 bucket, ''error-handling violations''
    (main).

    '
  finding: 'hidden() calls os.path.realpath on the requested path with no guard. The contract''s path pattern accepts a NUL
    character (''7/notes\u0000.md'' in a JSON request) and a lone surrogate (''7/\ud800.md''); run() catches only Refusal
    and OSError. Both now end the process with a traceback and no JSON on stdout. Observed on scratch copies, same request
    on each: main (v3) and round 1''s head answer {"ok": false, ... "error": {"code": "not_found"}}; the head answers with
    ''ValueError: lstat: embedded null character in path'' (read in short-term memory, read in Garura memory, and cite with
    a step whose source path holds a NUL) and ''UnicodeEncodeError: ... surrogates not allowed'' (read in short-term memory).
    ''citations --check'' over an issue whose decision file holds one hand-edited record with a NUL in a source path now stops
    with the same traceback for the whole issue; round 1''s head answered ok and flagged the record. Cause: the old code used
    os.path.isfile, which turns these into False; the fix replaced it with an unguarded realpath. Carried and the same kind:
    on main a NUL in a search pattern and in a Phoenix read path already crash (ValueError: embedded null byte), unchanged
    by this branch. No test sends such a path.

    '
