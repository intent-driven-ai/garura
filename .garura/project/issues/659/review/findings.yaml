- id: TIC659-5
  severity: P3
  category: tool-interface-contract
  layer: design-grounding (change-reviewer)
  file: 'core/tools/memory/contract/v4.json (description ''Version 4'', commands.cite summary, commands.citations summary,
    answer_rules.cited_text_is_its_fingerprint, answer_rules.citations_problems)

