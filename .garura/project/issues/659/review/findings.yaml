- id: R2-1
  severity: P3
  category: executable-code
  layer: runnable checks and code reading (quality-auditor)
  file: core/tools/memory/memory.py
  line: 150-162 (excluded), 164-173 (hidden), 185-197 (files)
  basis: 'nearest standard None; review/code rubric: error handling; safe handling of destructive or irreversible operations,
    data-safety paths get extra weight (~/.garura/phoenix-memory/knowledge/review/code.md, Treatment); README settings rows
    for updates_dir and citations_file (''a lookup never reads them'')'
  finding: 'the rule that an issue''s short-term memory is never read through Garura memory is decided from the two settings
    as written, not from the folders they reach. hidden() resolves the request''s path to the real file (links, ''.'', case)
    but then compares it with excluded(''garura''), which is the short-term setting taken relative to the Garura setting without
    resolving either. Reproduced in scratch: with the Garura folder set directly and the short-term folder set through a link
    to a folder inside it, read --tier garura --path issues/9/n.md answers the short-term note and find --tier garura lists
    it; with both settings spelled the same way it answers not_found. The round 1 tool behaves the same, so the fix did not
    widen or narrow it. Separately, find and search apply the literal prefix while read applies the resolved, case-folded
    one, so find lists a link to a hidden file by the link''s own name (reproduced: alias.md pointing at the decision file)
    and read then refuses it.'
  status: null
