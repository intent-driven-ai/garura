- id: R2-1
  severity: P4
  category: memory
  layer: design-grounding (change-reviewer)
  file: core/components/memory/standards/rules/resolution.md
  line: 106-110 and 132-133, against 137-154 (Context Isolation Exemptions, Backward Compatibility)
  basis: 'G6, G1 — committed source: G6: a rule file says to whom and when it binds and does not contradict itself; the base
    file states INV3 and INV4 in terms of ltm_context. G1 and ADR 035 section 5 (''This holds for every agent and skill'')
    carry no exemption for the two agents; ADR 035 section 9 retires ltm_context without naming what replaces the exemption.
    Classed P4: the text says in so many words that the question is open, ADR 035''s Negative / Risks accepts the side-by-side
    period, and no agent reads the section yet.

    '
  finding: 'Two edges are left from round 1''s DR-1. (1) The Scope paragraph says the section ''binds every agent decision''
    and in the same paragraph that whether the evals-engineer and the judge keep a decision trace ''is settled when the agents
    move onto the memory tool''. For those two agents the rule says nothing an agent can act on, and the exemption (INV4)
    is still worded only in terms of ltm_context, which ADR 035 section 9 retires. No committed record answers it: ADR 035
    and ADR 036 on main do not mention the exemption, and ADR 037 does not either. (2) The Scope paragraph says Backward Compatibility
    governs an agent that has not moved, but the closing sentence (lines 132-133) names only R1-R4 and the Resolution Trace
    Output as giving way. Backward Compatibility (''No trace is produced'') and Staleness Handling are not named, so once
    an agent has moved the file still says no trace is produced without ltm_context, a few lines from a section that says
    every agent keeps one.

    '
- id: R2-2
  severity: P4
  category: memory
  layer: design-grounding (change-reviewer)
  file: core/components/memory/standards/rules/resolution.md
  line: 104-135 (the term 'decision trace'), against the glossary row for 'Resolution trace'
  basis: 'G5 — committed source: G5: one name carries one meaning and names are chosen so they are never confused (ADR 035
    section 1; glossary line 43 on main; pr.md puts naming in P3). Classed P4, below round 1''s P3 for the same theme: the
    collision with ''decision record'' is gone, the rule itself separates the two traces in words, and the glossary gap is
    disclosed by the ADR.

    '
  finding: 'The section names its object a ''decision trace''. The glossary on main already defines ''Resolution trace'' as
    ''A per-decision trace written by agents ... when following the R1-R4 protocol''. The two are told apart only inside this
    file, by the sentence that says one gives way to the other. The glossary gets no row, and ADR 037 lists the glossary row
    as not decided. A person or agent who looks up ''decision trace'' in the glossary finds the old trace''s definition. Phoenix
    memory has no glossary, so in the shared tier the file is the only place the two are separated.

    '
- id: R2-3
  severity: P4
  category: memory
  layer: design-grounding (change-reviewer)
  file: core/components/memory/standards/rules/_index.md
  line: 25 (row for resolution.md)
  basis: 'G7, G6 — committed source: G7: the index row states what the file holds and who consumes it (main:_index.md header).
    G6: a rule says when it binds. ADR 035 Negative / Risks on main: until each agent moves, old and new sit side by side.
    Classed P4: one clause, and the detail is one click away in the section.

    '
  finding: 'The row ends ''the decision trace every agent keeps (ADR 035 section 6, ADR 037)''. The section and the file''s
    opening both carry a condition (''once it works through the memory tool''); the row, which is how an agent or person finds
    the rule and is promoted to Phoenix memory with it, states it as a present fact. ADR 037''s own Negative / Risks says
    no agent keeps a trace yet. Read through the index, every agent already does.

    '
- id: R2-4
  severity: P4
  category: memory
  layer: design-grounding (change-reviewer)
  file: core/components/memory/standards/rules/resolution.md
  line: 112-118 (a step names a tier) and 122-124 (makes no decision that no tier supports)
  basis: 'G9, G1 — committed source: G9: ADR 035 section 1 (line 42) and section 9 on main list the repository, the product
    model and the intents beside the tiers. G1: every decision names its memory, the tier, the file and the lines. Classed
    P4: the rule is no stricter than its source ADR, nothing runs against it yet, and the product model and the intents sit
    inside Garura memory per ADR 035 section 1, so only the repository is open.

    '
  finding: 'The rule allows a decision only if a tier supports it and has each step name ''a tier''. ADR 035 section 1 says
    agents also read the project''s git repository, and ADR 035 section 9 gives ADR 034 section 2 the same list (the three
    tiers, with the git repository, the product model and the intents). A decision that rests on the repository (code in a
    diff, a file in the working tree) has no tier to name, and under the second duty it would need a memory update before
    the agent could make it. The rule follows ADR 035 section 6 word for word (''the tier, the file and the lines''), so the
    gap is in the ADR; ADR 037 repeats ''a tier''. It will show when the build and review agents move onto the tool.

    '
- id: TDD-14
  severity: P3
  category: tool-design-document
  layer: design-grounding (change-reviewer)
  file: .garura/project/issues/617/specs/review-tool.md
  line: 276-283 (the Agent decisions bullet), 289-293 ('stand-in only' and 'the local page reads them live')
  basis: "The tool is extractable and talks to Garura only through its own contract; Garura words arrive as data and the tool\
    \ code never names them (G1). The design must say one thing about where the coupling is. Round 1 found the document saying\
    \ two things; the fix has left two things in one bullet.\n — committed source: main:.garura/project/issues/617/specs/review-tool.md\
    \ section 1 items 1, 2, 3 and 7; section 3 ('Garura builds the pack'); section 7 last paragraph (the extraction line).\n"
  finding: 'Lines 276-279 still say ''The page shows the memory tool''s own answers, in the contract''s shape: `citations
    --check` and `updates`''. Lines 280-283 then say ''The page does not read those answers itself''. A builder of #664 who
    reads the first sentence builds the coupling the second forbids. Lines 291-293 add ''the local page reads them live''
    with no note that this is the local prototype of section 7''s ''what stands in until then'', outside the extraction line,
    so the sentence reads as a statement about the real page. The inserted paragraph also splits one sentence, so ''Looks
    right, or send back so the agent decides again from memory as it is now'' (290-291) now follows ''a stand-in only''.

    '
- id: TDD-15
  severity: P3
  category: tool-design-document
  layer: design-grounding (change-reviewer)
  file: .garura/project/issues/617/specs/review-tool.md
  line: section 3 pack outline (150-172) against 283-289 (the pieces Garura builds) and 487-493 (story 9)
  basis: "The pack outline is what the contract is written from (story 1), and Garura words arrive in it as data: kinds with\
    \ a label, an icon and the verbs they allow (G1, G2). One term per meaning (G14): 'decision' is already a pack kind meaning\
    \ a decision record at any level.\n — committed source: main:.garura/project/issues/617/specs/review-tool.md section 1\
    \ items 2 and 3; section 3 (the pack outline: kinds, pieces[], sections[] with a label, a before, an after and editable\
    \ yes or no; change added/changed/removed/same); section 7 story 1; main:core/grounding/glossary.md line 61.\n"
  finding: 'Section 4 now says Garura sends ''a kind for an agent decision, and each step a labelled section that carries
    the lines, the lines around them and a state (same, changed, gone, no source) as data''. The pack outline was not touched.
    Its kinds line lists six kinds and no agent decision; its sections are before and after text, which cannot say which of
    the numbered lines the agent used (the part the owner asked to see marked) or carry a state; and its ''change'' and ''status''
    fields mean what a drive did to a piece, not whether a source still says the same. The word ''decision'' in the kinds
    line already means a product decision record, so the new kind needs a distinct label and the doc names none. The route
    is stated; the data shape it needs is not anywhere the contract can be written from.

    '
- id: TDD-16
  severity: P4
  category: tool-design-document
  layer: design-grounding (change-reviewer)
  file: .garura/project/issues/617/specs/review-tool.md
  line: 322-324 ('Keeping the load low' exception and its quote); 283-290
  basis: "A claim that the owner decided something is only as good as the words it quotes, and the committed ground for what\
    \ the page must show is the ADR that says so. Showing a source's tier, file and lines is required by the committed ADR\
    \ 035 (G9); the design should cite that.\n — committed source: main:docs/adr/035-agents-work-only-from-memory.md section\
    \ 6 ('the tier, the file and the lines it rests on') and section 7 (the review view shows which memory each decision came\
    \ from); main:docs/adr/034-plays-answer-from-memory-inside-a-drive.md section 4.\n"
  finding: 'The exception is credited to the owner with the quote ''the source should show a few lines before and after''.
    That quote asks for the lines around a source, not for the memory, file and lines to appear against the no-file-paths
    rule. The owner''s request for the exception is recorded only as the round 1 review reply and in ADR 037''s Risks. A reader
    checking the sentence against its quote finds a different decision. The design never points to main''s ADR 035 sections
    6 and 7, which already require it.

    '
