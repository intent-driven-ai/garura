  line: null
  basis: 'IDD-P3-OBSERVABLE-BINARY — committed source: docs/philosophy/idd-principles.md Principle 3 (lines 75-98, main);
    docs/adr/035 Decision part 6 (lines 80-82, main); docs/adr/034 Decision part 4 (lines 60-62, main); .garura/project/issues/654/specs/stories.yaml
    item 6 ''Done when'' (lines 106-109, main).

    '
  finding: 'Three phrases say more than anything holds. (1) The description: "every decision is recorded with the memory it
    rests on". The contract defines how one decision is recorded; nothing makes every decision be recorded, no agent calls
    cite yet, and a decision that was never cited has no record the check could fail. The filed done-when ("the check fails
    a decision that names no source") is met only for a record that exists: cite refuses an empty trace (minItems 1), so no_source
    can arise only from a hand-edited file, and the drive record carries only cited decisions. (2) "the steps the agent took,
    in order" and "the exact lines the agent read when it decided": asked and found are free text the agent writes, and the
    tool re-reads the lines when cite is called, not when the agent decided; no read log ties a step to a read. (3) "so the
    person sees each step a decision rested on": the trace is the agent''s claim of what it rested on; the check proves the
    lines exist and match their fingerprint, not that the answer follows from them. Under IDD principle 3, a record that reads
    as an audit trail and cannot be observed to be one gives false confidence.

    '
