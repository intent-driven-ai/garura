- id: TIC659-3
  severity: P3
  category: tool-interface-contract
  layer: design-grounding (change-reviewer)
  file: 'core/tools/memory/contract/v4.json (answer_rules.waiting_drafts_are_hidden last sentence; tiers.garura; $defs.decision_record);
    core/tools/memory/README.md (''citations_file'' row)

    '
  line: null
  basis: 'ADR035-S1-TIERS-AND-DECISIONS-IN-GARURA — committed source: docs/adr/035 Decision part 1 (lines 36-44, main); core/grounding/glossary.md
    lines 37, 61, 111, 113 (main); docs/adr/036 parts 1 and 6 and line 128 (main); .garura/project/issues/654/specs/stories.yaml
    item 6 (line 104, main).

    '
  finding: 'The rule says "Decision records are not memory either: a lookup never returns them, so an agent never decides
    from its own earlier decision." Two problems. (1) The same contract says, in tiers.garura (unchanged), that Garura memory
    holds "decisions", as ADR 035 part 1 does; and the glossary on main says a "decision record" is an ADR at any level (decision.yaml),
    kept in the product model, which is memory. So "decision records are not memory" is, by the committed word, false, and
    a second engine built from the sentence could hide the product model''s decisions (or, reading the other sense, not hide
    the agent''s). One word, two things. (2) The carve-out narrows ADR 036 part 1 and part 6 (the issue''s folder is short-term
    memory, and the tool can find a play''s files there); ADR 036 records one such carve-out (waiting drafts) with its reason,
    and none for decision records. The filed story text on main says agents "write it to the issue''s short-term memory" and
    says nothing of hiding it. The rule is probably right (an agent''s earlier decision would answer its next lookup, as a
    draft would), but it is not recorded anywhere a reader of the ADRs would look.

    '
