- id: TIC659-8
  severity: P3
  category: tool-interface-contract
  layer: design-grounding (change-reviewer)
  file: 'core/tools/memory/contract/check_contract.py (check_citations, check_scope); core/tools/memory/contract/samples/
    (no sample for the cases below); core/tools/memory/README.md (''The answer rules'')

    '
  line: null
  basis: 'IDD-P3-OBSERVABLE-BINARY — committed source: docs/philosophy/idd-principles.md Principle 3 (lines 75-98, main);
    .garura/project/issues/654/specs/stories.yaml item 6 ''Done when'' (the check fails a decision that names no source, main);
    base v3.json answer_rules (main).

    '
  finding: 'Probed on a scratch copy by editing samples and re-running the check. Each of these passes the check although
    the answer rule or the contract text says otherwise: (1) a citations answer with check true, a record with no trace, and
    no no_source problem (rule citations_problems: "each record with no trace is no_source"; this is the filed done-when''s
    own case); (2) a citations answer for play ''/understand'' holding a record of ''/vision''; (3) a source_changed problem
    whose ''now'' equals the cited text, which its own fingerprint settles; (4) a now_around that does not hold ''now'' (the
    same test is made for a source''s around); (5) a Phoenix step with no version, or a Garura step with an invented version
    (README: Phoenix''s version is the repository''s commit); (6) two records with one citation_id, and a citation_id or decided_at
    that is any text; (7) a search hit whose path is the hidden decision file or a waiting draft (the rule cannot be pinned
    by a sample, since the contract does not say where they live: TIC659-9); (8) a cite sample whose source has end before
    start answered ok. No sample exists for the new error ''unreadable'', for a cite refused as not_found or changed, or for
    a from_update decision. The README''s list "The check holds every sample to these" is v3''s and lists none of the five
    answer rules v4 adds. Under IDD principle 3 a rule that can be observed and is not is false confidence; the PR body''s
    "32 broken samples refused" reads as the rules being held.

    '
