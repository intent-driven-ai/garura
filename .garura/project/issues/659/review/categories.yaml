# categories.yaml (round 1) -- derived from the PR #676 diff content (base main). Not matched from a fixed list.
# Review shelf used: ~/.garura/phoenix-memory/knowledge/review/ (Phoenix memory, the third tier). The short-term tier has no knowledge/review folder for this issue; Garura memory (.garura/core/memory/) holds only standards/ and tools/, so context.yaml's ./.garura/core/memory/knowledge/review/ does not exist. Files read there: _index, adrs, code, config-maps, docs, harness, memory, tests (git ls-files lists exactly these eight; no local edits to them; they are byte-identical to the committed copy under core/components/memory/knowledge/review/). The playbooks that govern a category present are code, tests, docs, memory; adrs, harness and config-maps were read to confirm they do not apply.
pr: 676
issue: 659
base: main
round: 1
head_assessed: fa73b2b5   # the branch head this assessment was made at (24 commits ahead of main)
changed_path_count: 88   # 21 added + 67 modified (git diff main...HEAD --name-status); equals the 88 changed_paths in context.yaml and the 88 file headers in pr.diff (checked: the same set, no renames). The review folder .garura/project/issues/659/review/ is not in the diff (untracked, written by this run).
scope_warning: >
  Four things sit outside the diff on purpose, or sit on the line between two categories.
  (1) The working copy of .garura/core/config.yaml differs from the committed one by one line
  (gates.plays.review-change set on, uncommitted, for this run only); that file is not in the PR diff,
  so no config-map category is listed. (2) core/tools/play-reviewer/ is a local prototype excluded
  from git; no path under it is in the diff, so it is not judged. The review tool's design document
  and mock in this diff describe screens that page does not yet implement, and say so ('mock only').
  (3) No docs/adr/** path is in the diff, although this change builds on ADR 035 section 6 and makes
  the review tool's design disagree with the wording of ADR 032 section 3, ADR 035 section 7 and
  ADR 036 section 7 as they stand on main (the PR body says the ADR change is its own /adr change,
  carried). Where that gap shows is tested in the design-bearing categories below. (4) Boundary: the
  three write_drive_review.py copies sit under core/components/plays/**, a path the harness playbook
  lists as a signal, but the content is a mechanical python script; no SKILL.md, ICE, agent or skill
  file is in the diff (git diff main...HEAD finds none) and no play passes the new --decisions option
  yet. They are filed under executable-code, not harness. If a later change makes a play call the
  option, that change is a harness change.
