    evidence:
      - core/components/memory/standards/rules/resolution.md   # modified (+19 / -0): a new section 'Decision Records (ADR 035 §6)' states that every decision an agent makes keeps its trace, made through the memory tool's cite, re-checked by citations --check, shown in a drive's review, and that the shape is the memory tool's contract (version 4); it says the existing R1 to R4 trace and R4's model fallback 'become this trace when the agents move onto the tool (#663)'
    runnable_checks:
      - command: "lint-components on core/components (the play's step; not run in this assessment)"
        note: "the PR body and the self-review say 116 findings on main and the same 116 on the branch, none in a changed file; that is a claim to test, not evidence. No other memory linter is committed (a gap named on the shelf)."
    notes: >
      A standards rule under core/components/memory/standards/rules/, so the memory playbook governs. It is
      the only file in the diff under core/components/memory/. Layer 2 grounds ONLY from committed sources:
      the base version of this same file (git show main:core/components/memory/standards/rules/resolution.md:
      'Resolution Trace Output', R1 to R4, R4 'Flag LLM Fallback', the trace's resolved_from values
      'project | core | llm'; Phoenix memory's copy at ~/.garura/phoenix-memory/standards/rules/resolution.md is
      the same text, checked), docs/adr/035 (sections 5 and 6), docs/adr/034 section 4, the other standards under
      core/components/memory/standards/rules/ (play-close, user-facing-voice, evidence recording), the glossary,
      core/components/memory/knowledge/_DESIGN.md, _TEMPLATE.md and _index.md for what a shelf and a rule are for
      (a knowledge shelf's template does not strictly apply to a standards rule; read them for purpose). NOT
      groundable: the added section's own sentences, the contract's prose, the PR body, the plan.
      Design pointers the grounding should test, taken from reading the diff, not findings:
      (a) one file, two rules: on main the file lets an answer come from the model ('resolved_from: llm', R4);
      ADR 035 section 5 on main says nothing from the model or the web without an approved memory update. The
      added section sits in the same file and defers the rewrite of R1 to R4 to #663. Test whether a standard that
