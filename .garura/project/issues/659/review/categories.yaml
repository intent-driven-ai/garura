      The playbook says no grounding, and this file follows it. The one place a Layer 2 read could still add something is an amendment's
      fidelity to the records it amends; the mechanical part of that is done above. If the play wants a read of whether the older ADRs'
      untouched body lines conflict with ADR 037, it is a read against main's ADR text only, and its output is a note for the human, never
      a design finding against the owner's accepted decision.

  - name: executable-code
    playbook: review/code
    design_bearing: false   # playbook: 'Design-grounding: no, the standard is industry best practice.' Layer 1 only. Data-safety paths get extra weight.
    layers: [linters, runnable-checks]
    evidence:
      - core/tools/memory/citations.py   # new, 182 lines; since round 1: whole() and whole_source() so a line that is JSON but not a whole record answers 'unreadable'
      - core/tools/memory/memory.py   # modified (+59 / -17); since round 1: hidden() decides what a lookup never reads on the file a path reaches (realpath, case-folded, outside-the-tier counts as hidden), used by read
      - core/tools/memory/pull.py   # modified (+3 / -3): contract version 4
      - core/tools/memory/updates.py   # modified (+1 / -1): a comment says version 4
      - core/tools/memory/contract/check_contract.py   # modified (+58 / -3): trace steps, citations answers, lines around a source, a problem naming its step; default contract v4
      - core/components/plays/play-creator/references/write_drive_review.py   # modified (+33 / -3): --decisions; since round 1: a record that is not an object is named, not a crash
      - core/components/plays/understand/scripts/write_drive_review.py   # stamped copy, byte-identical to the canonical one
      - core/components/plays/vision/scripts/write_drive_review.py   # stamped copy, byte-identical to the canonical one
      - .garura/project/issues/659/evidence/make_decisions.py   # new, 199 lines; since round 1: it deletes a folder only if it holds its own mark file, and makes the folder itself
    runnable_checks:
      - command: "ruff check --no-cache <the 13 python files in the diff>"
        note: "Observed: all checks passed."
      - command: "md5 of the three write_drive_review.py copies"
        note: "Observed: one checksum for all three (1290adb9...)."
      - command: "quality-check-scoped against the diff with the pr.md taxonomy"
        note: "the play's or quality-auditor's step; not run in this assessment. Its input must be the 121 paths, not context.yaml's 100 (scope_warning, point 1): memory.py, pull.py and updates.py are among the 21 left out."
    notes: >
      Real source the runtime executes, so the code playbook governs. The three write_drive_review.py copies sit under core/components/plays/**;
      the content decides, not the path (scope_warning, point 5). make_decisions.py lives in an issue's evidence folder but is executable and
      gets the code treatment. Points to read hard (data-safety paths), not findings: (1) memory.py hidden(): a path-containment and
      symlink check that decides what a lookup may read; lowercase prefix comparison on a case-sensitive disk hides more than it
      must (the safe side), and it is the fix for the round-1 hiding hole, so read it with the tests that pin it. (2) citations.py appends to a
      decision file other callers read and makes a record id by reading every issue's file; a malformed line now stops only its own
      issue. (3) memory.py's catch-all for a failed write picks the tier by command. (4) write_drive_review.py pins contract_version '4'
      exactly and reads a caller-named file; it writes only into the run's review folder. (5) make_decisions.py: the new mark-file guard
      is the fix for round 1's unguarded rmtree; confirm it also holds for the end-of-run delete.

  - name: tests
    playbook: review/tests
    design_bearing: false   # playbook: 'Design-grounding: no.' Run the suite. A red suite is a blocker.
    layers: [linters, runnable-checks]
    evidence:
      - core/tools/memory/test_memory.py   # modified (+174 / -1): cite, citations, the hiding rule in its odd spellings (the PR body says each fails on the old tool; not re-run here), the unreadable line, the failed-write tier
      - core/tools/memory/contract/test_check_contract.py   # modified (+39 / -5): the new answer rules, trace steps and problems
      - core/tools/memory/test_pull.py   # modified (+1 / -1): loads contract v4
