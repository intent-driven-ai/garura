        note: "the playbook's prose checks, by hand (no prose linter is committed). Observed: no links, no TODO or FIXME, neither retired term."
    notes: >
      Human-facing prose that is not an ADR, harness or memory file, so the docs playbook governs. Judgement flag, as in earlier reviews: the
      README's commands, settings and error tables restate normative behaviour; those claims are routed to the tool-interface-contract grounding
      as claims to test against the contract, not handled here.

  - name: stm-working-notes-plans
    playbook: null
    playbook_missing: true
    design_bearing: false   # plans: Garura's own working notes. They say what and in what order, never how. The decisions they record are tested in the design-bearing categories above.
    layers: [linters]   # plan format check, plus agreement of the plans with each other and with the diff as a consistency read only
