design_bearing_categories: [tool-interface-contract, tool-design-document, memory]   # three Layer 2 dispatches, one each, concurrent and read-only. decision-records is NOT design-bearing by its playbook (see its grounding_note). executable-code, tests, documentation and the two STM categories are Layer 1 only or nothing.
absent_seeded_categories: [harness, config-maps]   # no play SKILL.md, ICE, agent, skill or grounding file changed (the stamped scripts are filed under executable-code); the one config file with a change (.garura/core/config.yaml) is an uncommitted working-copy edit, not in the diff. decision-records, absent in round 1, is present now.
