playbook_sharpening:
  - id: review/code
    note: "it says python scripts inside plays are executable code, and the harness playbook lists core/components/plays/** as a path signal. It does not say how to file a script that is stamped as an identical copy into several plays: here the copies are filed under code, with a Layer 1 check that they match the canonical one, and the harness category is marked absent. It also does not mention evidence scripts that delete a caller-given folder."
  - id: review/memory
    note: "its Layer 2 grounding names the knowledge-shelf design files (_DESIGN, _TEMPLATE, _index) as the source of 'what a shelf is for'; a change to a standards rule under standards/rules/ has no equivalent named source, so the grounding falls back on the other standards, the glossary and the ADRs."
