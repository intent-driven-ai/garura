        note: "Observed (bytecode writing off, temp folders in scratch): Ran 134 tests, OK."
      - command: "python3 core/components/plays/play-creator/references/test_drive_contract.py"
        note: "Observed: 33 passed, 0 failed, including 'every play's write_drive_review.py is identical to the canonical one (2 copies)'."
    notes: >
      Four test files and their runs. Two of the four (test_memory.py, contract/test_check_contract.py) and test_pull.py are among the
      21 paths missing from context.yaml's list (scope_warning, point 1), so a linter driven by that list would not read them. Not covered
      by a committed test (the self-review says so for the command-line flags of citations; not re-verified here): --issue, --play and --check.

  - name: documentation
    playbook: review/docs
    design_bearing: false   # playbook: Layer 1 only, no design-grounding
    layers: [linters]   # the playbook names no committed prose linter (a known gap), so the tool performs the checks and cites each
    evidence:
