      (c) the section copies the contract's shape in prose ('the shape is the memory tool's contract (cite,
      citations, version 4)'): a pointer that goes stale with the next contract version, against the glossary's and
      the standards' habit of pointing to one source of truth.
      (d) the PR body and plan say the rule section is also promoted to Phoenix memory at landing; ADR 036 section 3
      says promotion happens outside the work, as its own memory update a person approves. Phoenix memory's copy
