    runnable_checks:
      - command: "cd core/tools/memory && python3 contract/check_contract.py"
        note: "validates every sample against v4.json's shapes and answer rules, requires every broken sample to fail, scans the folder boundary. Observed (bytecode writing off): ok true, contract_version 4, 26 samples valid, 0 failed, 0 commands without a sample, 32 of 32 broken samples refused (each for its own reason), 0 boundary problems. What it does NOT check: that a trace's answer follows from the lines it names (the PR body says so too), who 'decided_by' is (a non-empty string any caller writes), the settings text (the contract's settings part names neither updates_dir nor the new citations_file, though the README and memory.py do), or the lookup-hiding rule's meaning (test_memory.py exercises that)."
      - command: "check_sample on the committed evidence answers (.garura/project/issues/659/evidence/decisions.json as a citations --check answer for issue 613, and updates.json as an updates answer) against v4.json"
        note: "Observed: no problems for either (12 records, 26 trace steps, 3 problems named by step). The two files are the tool's own answers over a sample shop, so this shows the contract and the tool agree on real output."
      - command: "cd core/tools/memory && python3 -m unittest contract.test_check_contract"
        note: "also the tests category's check, so its result is shared: see tests."
    notes: >
      Same kind of work as the contract in the issue 655, 657 and 658 reviews: a machine-readable
      interface contract for a tool, with its worked examples. Not a config map (it points at no files),
      not harness (nothing in it is under core/components/ except via the tool it describes), not memory
      (not under core/components/memory/**), not executable code (it is data the check script reads).
      Design-bearing because other stories build against it (#661 to #664) and because version 4
      records rules no ADR on main states. The base-ref contract is the 'before':
      git show main:core/tools/memory/contract/v3.json (and v1, v2; none of the three is in this diff) and
      git show main:core/tools/memory/README.md. Layer 2 grounds ONLY from what is committed on main:
      docs/adr/035-agents-work-only-from-memory.md (as amended by 036; section 6 'Every decision names its
      memory', sections 1, 3, 4, 5), docs/adr/036-approved-answer-lands-in-short-term-memory.md (sections 2
      to 4), docs/adr/034-plays-answer-from-memory-inside-a-drive.md (section 4 'every answer names its
      source'), docs/adr/033-approval-in-the-product-model.md (section 6: only the review step writes
      approval), docs/adr/032-drive-review-of-outcomes.md, docs/adr/016 (agent JSON contract),
      docs/adr/008 and 011 (short-term memory per issue; as inter-skill transport),
      core/grounding/glossary.md (Memory Architecture), docs/philosophy/**, and the base v3.json and README.
      The base versions of .garura/project/issues/653/specs/plan.md (item 6) show what was planned, as a
      working note, not a decision record. NOT groundable (branch content, added or rewritten here):
      v4.json's own description, answer_rules and command summaries; core/tools/memory/README.md; the
      659 plan; the PR body; the self-review; the owner's quotations ('these are called traces', 19
      October) inside any of them; the comments in the tool's code. The tool that implements the contract
      is in executable-code (Layer 1); the grounding may read it only to know what the contract is
      tested against, never as a source of principle.
      Design pointers the grounding should test, taken from reading the diff, not findings:
      (a) ADR 035 section 6 on main says a decision 'names the tier, the file and the lines it rests on'
      and that 'the shape of an answer and its source is settled in plan item 6'. Version 4 records a
      trace: ordered steps, each with what was asked, what was found and a source (tier, file, lines,
      fingerprint) plus the exact text, the memory version and up to 3 lines around it, a from_update
      link and a decided_by string. The basis the branch gives is the owner's word in chat and plan item 2;
      ADR 035 section 6 on main is unchanged by this diff. Test: is the wider shape a refinement the
      ADR leaves open ('settled in plan item 6') or a conformance break, and what severity does the pr.md
      taxonomy give a contract that is ahead of the ADR it cites.
      (b) the hiding rule: decision records and waiting drafts are never found by a lookup, 'an agent
      never decides from its own earlier decision'. ADR 035 section 1 on main says Garura memory holds what
      the project makes itself, 'its decisions' among them, and section 3 fixes the lookup order and says
      the lookup never blocks a play; ADR 036 and ADR 035 section 5 say a waiting draft is not used until
      approved. Test: is the hiding of decision records a rule any committed record states, and does 'decision'
      mean one thing across those sections and this contract (a naming question for the glossary).
      (c) 'decided_by' and the approval line: ADR 033 section 6 says only the review step writes approval;
      the design document in this diff adds a 'looks right' on an agent decision, and the drive record this
      diff writes keeps decided false. The contract takes decided_by as a non-empty string the caller supplies;
      check_contract.py checks its presence, not its origin (the same trust question the 658 review raised for
      decided_in). Test the contract's wording about who decided against what it can enforce.
      (d) the check's reach: the plan item says 'a script checks each source still exists and still says the
      same thing'; the answer rules say a source is read first and again on check. Test that the contract's
      own words claim no more than that (the lines still say what they said, not that the answer follows).
      (e) version policy: README 'The contract changes only by a new version'. v1 to v3 are kept as they
      were, but every sample and the check now run on v4 only, so nothing exercises v1 to v3. Version 4
      also changed in place on the branch after its first commits (the plan log says it was not yet landed),
      which is allowed while it is unlanded; the exact version number 4 is also pinned inside the three
      drive-record writers, so a later version breaks them until they are changed.
      (f) settings and paths: the contract's settings text (unchanged from v3) names neither updates_dir nor
      the new citations_file; memory.py and the README do. Test where the contract is the source of truth for
      a setting an agent or Griffin must provide.
      (g) error naming: 'changed' now also answers a cite whose source no longer says what its fingerprint
      says (the README's table says so); 'tier' in an error and in 'written' still carries all three tiers
      while target_tier carries one value (carried from v3, not new here).

  - name: tool-design-document
    playbook: null
    playbook_missing: true   # a design document for a tool (what the person sees and does, how it talks to Garura, build order) and its mock; not an ADR, not a plan of work, not documentation for readers of the tool; named as its own category in the issue 658 review
    design_bearing: true   # judged on content: the lines added are design statements (five sections where ADR 036 names one, what an Agent decisions card shows and offers, the Ask memory box, who builds what and where), not an order of work. The grounding tests them against decisions committed on main; the plans category does not.
    layers: [design-grounding]   # no mechanical check fits: the plan format check fails on this file on main and on the branch alike (see runnable_checks)
    evidence:
      - .garura/project/issues/617/specs/review-tool.md   # modified (+59 / -12): section 4 'one page, three sections' becomes five sections (Intents, Product, ADRs, Memory, Agent decisions); item 7 rewritten for ADRs, Memory (with Ask memory in plain words, 'vectorless, ADR 035 §4', mocked) and Agent decisions (each decision's trace, each step checked again: unchanged, changed, gone, no source; 'looks right, or send back so the agent decides again'; the page shows the memory tool's citations --check and updates answers); the earlier combined-section text is kept under 'Earlier text, kept'; story 9 split into a tool half and a Garura half; the stand-in paragraph now says the page opens on Memory with Agent decisions live
      - .garura/project/issues/617/specs/review-tool-mockup.html   # modified (+291 / -2): the mock gains the three switches, the Memory section with Ask memory (sample answer), waiting memory updates with Approve and Reject, and the Agent decisions screen (traces, numbered source lines, used lines marked, a changed step shown with what the lines say now); it embeds its own copy of the two evidence answers. The mock says in its own text that its data is made up. It is a design mock, not shipped code.
    runnable_checks:
      - command: "python3 core/components/skills/manage-plan/scripts/check_plan.py --plan <review-tool.md> --out <scratch>/rt.json"
        note: "not a regression and not a finding: the file is a tool plan (kind tool-plan, status draft), not a work plan in the canonical format. Observed: exit 2, valid false, 8 problems on the main version and exit 2, valid false, 8 problems on the branch version (same count)."
    notes: >
      Why this is a design document and not a plan. It says what the person sees and does and how the tool
      talks to Garura; the earlier reviews of issues 617 and 667 filed it with the plans, and the issue 658
      review split it out because the added words are design. Layer 2 grounds ONLY from committed sources:
      the base version of this same file (git show main:.garura/project/issues/617/specs/review-tool.md:
      section 1 'Extractable', section 2 events, section 4 layout and Catch up, section 5 'Approval is part
      of the product model', section 7 build order), docs/adr/036 section 7 ('a third section, Memory and
      ADRs, next to Intents and Product ... the same Catch up cards ... swipe right to accept, swipe left to
      leave for later'), docs/adr/033 section 6, docs/adr/032 section 3, docs/adr/035 sections 4 and 7,
      docs/adr/031, and core/grounding/glossary.md. NOT groundable: the lines this diff adds to the file and
      the mock, the 659 plan, the PR body, the self-review, and the owner's quotations inside them (the 18
      and 19 October remarks are quoted in the added text; none is in an ADR on main).
      Design pointers the grounding should test, taken from reading the diff, not findings:
      (a) sections: ADR 036 section 7 and ADR 035 section 7 on main say the review tool's third section is
      'Memory and ADRs' (ADR 036 lines 87 and 90 also say ADR 032 section 3's third section is Memory and
      ADRs, not Memory); this design makes it three sections and says the owner split it. Test: is the design
      ahead of three accepted ADRs, and is the amendment named anywhere on main (none is in this diff).
      (b) the new 'looks right, or send back' on an agent decision against ADR 033 section 6 (only the review
      step writes approval) and ADR 036 section 7 (cards: swipe right accepts, swipe left leaves for later):
      no ADR on main makes an agent decision something a person approves; the drive record the same diff writes
      keeps decided false. Compare with the base section 5 (approval in the product model).
      (c) Ask memory and 'vectorless, ADR 035 section 4': the word vectorless appears in no ADR on main
      (git grep on main finds none); section 4 says the tool searches the way Claude Code does (find, search the
      text, read exact lines). The added text also quotes 'the tool we are building for Griffin will use nlp'
      and says the interface should be plain words. Test whether section 4 grounds each claim made in its name.
      (d) the extraction line: base section 1 says the tool knows nothing about Garura, imports no Garura code,
      reads no Garura path and talks only through its contract; base section 7 says stories 1 to 4 touch only
      the tool and 5 to 8 only Garura. The added text says the mock's records are made by a script in a Garura
      issue folder and that 'the local page reads them live', and that underneath Ask memory is 'the same
      memory tool the agents use'. Test against base sections 1 and 7.
      (e) a document that keeps its own superseded text ('Earlier text, kept', 'the paragraphs below were
      written for the one combined section; they now read across these three') and names planned plays
      (/learn-memory, /promote-memory, 'planned, not filed yet') that exist on main nowhere: what a reader of
      the document on main can find, and which paragraph is the design.

