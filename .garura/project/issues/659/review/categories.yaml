absent_seeded_categories: [decision-records, harness, config-maps]   # no docs/adr/** path (the ADR change this work implies is not in the diff); no play SKILL.md, ICE, agent or skill file, and no grounding file changed (the stamped scripts are filed under executable-code, see scope_warning point 4); the one config file with a change (.garura/core/config.yaml) is an uncommitted working-copy edit, not in the diff
