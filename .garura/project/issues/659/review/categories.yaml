playbook_sharpening:
  - id: review/adrs
    note: "its Linter line says 'Gap: no ADR linter exists in-repo yet'. adr.py (lint, index, overlaps, pointer, guard, accept) now exists in core/components/plays/adr/scripts/ (a copy sits in the author-adr skill) and passes on all four ADRs here; the playbook should name it. The playbook also says 'there is no prior principle to conform to', which does not hold for an ADR that amends older ones: its fidelity to them is checkable against the base ref. Suggest a sentence saying that check is by reading the older ADRs on main and its result is a note for the human."
  - id: review/code
    note: "it does not say how to file a script stamped as an identical copy into several plays (filed here under code, with a checksum match), nor evidence scripts that delete a caller-given folder."
  - id: review/memory
    note: "its Layer 2 grounding names the knowledge-shelf design files as the source of 'what a shelf is for'; a change to a standards rule under standards/rules/ has no equivalent named source, so the grounding falls back on the other standards, the glossary and the ADRs."
process_notes:
  - "context.yaml changed_paths is cut at 100 of 121 with no marker (scope_warning, point 1). The list builder needs the cap lifted or a truncated flag; Layer 1 inputs must come from git or pr.diff until then."
  - "Each round's pr.diff is committed and then appears inside the next round's pr.diff (scope_warning, point 6)."
