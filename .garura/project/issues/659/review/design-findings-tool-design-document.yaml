principles_grounded:
  - id: G1
    principle: >
      The review tool is extractable. It lives in its own folder, imports no Garura code, reads no
      Garura path, and talks to Garura only through its own contract. Garura words reach it as data
      (kinds with a label, an icon and the verbs they allow), never as code. The tool code never
      names them.
    committed_source: "main:.garura/project/issues/617/specs/review-tool.md opening quote and section 1 items 1, 2, 3, 7; section 3 (kinds)"
  - id: G2
    principle: >
      The pack is outcome-shaped, not file-shaped. The tool never sees a file path.
    committed_source: "main:.garura/project/issues/617/specs/review-tool.md section 3, the paragraph after the pack outline"
  - id: G3
    principle: >
      The tool records each action as a numbered event and writes nothing to the model or to
      Garura. Garura's listener connects out to the tool; the tool never calls Garura (so a hosted
      tool can serve a laptop). Only the review step writes approval.
    committed_source: "main:.garura/project/issues/617/specs/review-tool.md section 2 ('Why the listener connects to the tool, not the other way round') and section 5 ('Who writes it'); main:docs/adr/033-approval-in-the-product-model.md section 6"
  - id: G4
    principle: >
      The review tool's third section is one section, Memory and ADRs, next to Intents and Product.
      It shows short-term, Garura and Phoenix memory, the memory updates waiting, the ADRs waiting,
      and which memory each decision came from. One app, one server, one link.
    committed_source: "main:docs/adr/036-approved-answer-lands-in-short-term-memory.md section 7 and section 8 (the line on ADR 032 section 3); main:docs/adr/035-agents-work-only-from-memory.md section 7; main:.garura/project/issues/653/specs/plan.md 'When this plan is done'"
  - id: G5
    principle: >
      Every memory review and ADR review happens in that section on the same Catch up cards as
      Intents and Product: one card per change, swipe right to accept, swipe left to leave for
      later. An answer that takes the person's words is a button, never a swipe. The /adr accept
      moves onto a card in that section once it exists.
    committed_source: "main:docs/adr/036-approved-answer-lands-in-short-term-memory.md section 7 and Affects; main:.garura/project/issues/617/specs/review-tool.md section 4 item 6; main:.garura/project/issues/617/specs/review-tool-mockup.html (Catch up card)"
  - id: G6
    principle: >
      Nothing is answered twice: a piece shown in two places is answered in one and read-only,
      with a link, in the other. A product decision record and an ADR are the same kind of record
      at different levels, and whether one waiting for a person is reviewed under Decisions in
      Product or in the ADR section is not decided.
    committed_source: "main:.garura/project/issues/617/specs/review-tool.md section 4 layout item 1; main:core/grounding/glossary.md line 61 ('a decision record = an ADR at any level'); main:docs/adr/036-approved-answer-lands-in-short-term-memory.md Negative / Risks, Not decided here, first bullet"
  - id: G7
    principle: >
      Approval is part of the product model. The pieces that carry it are the business intents, the
      agent intents, the domains, capabilities and functionalities, the product limits and the
      decisions. Only the review step writes approved or in progress, from the person's answers;
      the review tool writes nothing to the model. A send-back re-runs the play that writes that
      kind of piece, for that one piece.
    committed_source: "main:docs/adr/033-approval-in-the-product-model.md sections 1, 2, 3, 6; main:docs/adr/032-drive-review-of-outcomes.md section 4"
  - id: G8
    principle: >
      The person reviews the outcome, not the plays, and not the detail under the outcome. The
      plays' records tell the review step what changed and why; they are not shown play by play.
      A person has two interfaces, the intent they give and the output they see; the work in
      between is agent work. The one committed opening for the work in between: the drive's review
      shows what was assumed and on what basis.
    committed_source: "main:docs/adr/032-drive-review-of-outcomes.md section 2 and its Alternatives (a viewer per play, lost); main:docs/philosophy/idsd.md 'The Plan Is the Human's Interface'; main:.garura/project/issues/617/specs/review-tool.md section 3 last sentence ('the plays are never shown'); main:docs/adr/034-plays-answer-from-memory-inside-a-drive.md section 4"
  - id: G9
    principle: >
      Every decision an agent makes names the memory it came from: the tier, the file and the lines.
      An answer with no source is not allowed. The review tool's memory view shows which memory each
      decision came from.
    committed_source: "main:docs/adr/035-agents-work-only-from-memory.md sections 6 and 7; main:docs/adr/034-plays-answer-from-memory-inside-a-drive.md section 4"
  - id: G10
    principle: >
      An answer comes from memory, read in order: this issue's short-term memory, then Garura
      memory, then Phoenix memory. Never from the model alone. When no tier answers, the route is a
      memory update a person approves, not an answer. The memory tool searches the way Claude Code
      does (find files, search their text, read exact lines) and returns tier, file, lines and a
      fingerprint; a search index, semantic or numbered nodes, was considered and set aside.
    committed_source: "main:docs/adr/035-agents-work-only-from-memory.md sections 3, 4, 5 and Alternatives; main:docs/adr/036-approved-answer-lands-in-short-term-memory.md section 1; main:docs/adr/034-plays-answer-from-memory-inside-a-drive.md section 3; main:core/tools/memory/contract/v3.json (answer_rules nothing_found, short_term_is_this_issue)"
  - id: G11
    principle: >
      The page speaks in plain words: no file paths, no field names, no YAML. When the person is
      addressed, the lead is in product and outcome language and paths and field names sit in an
      appendix. (The voice rule's own scope is replies to the person; the base design's rule is
      the one that governs the page.)
    committed_source: "main:.garura/project/issues/617/specs/review-tool.md section 4 'Keeping the load low'; main:core/components/memory/standards/rules/user-facing-voice.md (Scope, The rule); Phoenix memory origin/main standards/rules/user-facing-voice.md"
  - id: G12
    principle: >
      A draft from the web or the model is not used until a person approves it. So the person must
      see what the draft came from: where it came from (marked) and its sources. Approve and Reject
      each carry the person's words.
    committed_source: "main:docs/adr/035-agents-work-only-from-memory.md section 5; main:core/tools/memory/contract/v3.json (propose requires draft_source and sources; decide needs the person's words); main:.garura/project/issues/617/specs/review-tool.md section 4 item 7 (the card lists the issue, what was missing, the draft, where it came from, the sources and whether it blocks)"
  - id: G13
    principle: >
      The build order is the extraction line: stories that touch only the tool and stories that
      touch only Garura, tested every day they are built. Garura builds the pack; the tool renders it.
    committed_source: "main:.garura/project/issues/617/specs/review-tool.md section 7 (last paragraph) and section 3 ('Garura builds the pack')"
  - id: G14
    principle: >
      One term per meaning. "Evidence" already names each play's run records. A "decision" or ADR
      is a decision record at any level. "Resolution trace" is the R1 to R4 per-decision file
      (retired in part by ADR 035). "Vectorless" is already used on main for the knowledge base's
      PageIndex, a tree index that the model navigates.
    committed_source: "main:core/grounding/glossary.md lines 42, 43, 61; main:docs/adr/035-agents-work-only-from-memory.md section 9; main:core/components/memory/knowledge/domains/.pageindex/pageindex.py (module docstring)"

conformance:
  # Changes that conform to the committed design (no finding).
  - change: "Story 9 is split into a tool half and a Garura half, and the extraction-line sentence follows (lines 470 to 482)"
    verdict: conforms
    basis: "G13. The same split as stories 1 to 4 and 5 to 8 on main, and it closes the note from the #675 review that main's #653 plan item 6 lists as note (c). The halves are not yet complete (TDD-8)."
  - change: "The fifth section is named Agent decisions, not Evidence (lines 246 to 251)"
    verdict: conforms
    basis: "G14. The glossary on main (line 42) says Evidence is each play's run records; the branch's text says so and chooses another word."
  - change: "An Agent decisions screen shows each decision with the memory it rested on, and a decision with no source is flagged 'not allowed'"
    verdict: conforms
    basis: "G9. ADR 034 section 4 (the drive's review shows what was assumed and on what basis; an answer with no source is not allowed) and ADR 035 sections 6 and 7 (the view shows which memory each decision came from). The verdict buttons and the grouping are TDD-4 and TDD-5."
  - change: "Ask memory looks in short-term memory (the picked issue), then Garura memory, then Phoenix memory"
    verdict: conforms
    basis: "G10. ADR 035 section 3 and ADR 036 section 1. What the box does when no tier answers is TDD-7."
  - change: "The memory-update card shows the issue, what was missing, the draft, a marked source, whether it blocks, and needs the person's words to approve or reject; nothing is used before approval"
    verdict: conforms
    basis: "G12. ADR 035 section 5 and contract v3 decide. The missing sources line is TDD-10."
  - change: "The mock's memory Catch up gives Approve and Reject as buttons (they take words) and Later on the left arrow"
    verdict: conforms
    basis: "G5. Base section 4 item 6: answers that take a comment are buttons, never swipes; swipe left leaves a card for later. The gap is for ADRs and agent decisions (TDD-6)."
  - change: "The Phoenix tier is shown with its approved version"
    verdict: conforms
    basis: "main:.garura/project/issues/653/specs/plan.md log, 2026-10-18: unapproved Phoenix memory is not read. Whether the Memory section is said to show Phoenix memory in the text is TDD-12."
  - change: "Ask memory is called mocked only; the mock says its data is made up; the Agent decisions records are the memory tool's real answers over real lines"
    verdict: conforms
    basis: "No committed principle is breached by an honest mock. The branch does not present Ask memory as built. What the design leaves unsaid about it is TDD-7."
  - change: "Sending an ADR back with a comment, and accepting one by a person's click"
    verdict: conforms
    basis: "G7. ADR 032 section 4 lists send back for pieces of the outcome, and decisions are part of the outcome (section 2); ADR 036 section 9 says only a person accepts an ADR."

carried_not_new:
  - >
    The memory-updates paragraph and the approval-by-typing and short-term-only statements that main
    already carries (from the #658 change) are kept as 'Earlier text' in this diff. Their wording is
    not changed here, so they are not judged again. They were judged in the #675 review, and the
    committed #653 plan (item 5 and its log) already says ADR 035 section 5 and ADR 036 sections 2
    to 4 need amending for them.

findings:
  - id: TDD-1
    file: ".garura/project/issues/617/specs/review-tool.md; .garura/project/issues/617/specs/review-tool-mockup.html"
    lines: "review-tool.md 265-280 (the Agent decisions bullet) and 470-478 (story 9); review-tool-mockup.html 1134, 1149-1151, 1253-1260, 1265"
    severity: P2
    principle: >
      The tool is extractable and talks to Garura only through its own contract (G1). Garura
      words arrive as data; the tool code never names them. The pack is outcome-shaped and the
      tool never sees a file path (G2).
    committed_source: >
      main:.garura/project/issues/617/specs/review-tool.md section 1 items 2, 3 and 7, and section 3
      ('The pack is outcome-shaped, not file-shaped. The tool never sees a file path.').
    violation: >
      The Agent decisions bullet says "The page shows the memory tool's own answers, in the
      contract's shape: citations --check and updates". The mock does exactly that: it embeds the
      memory tool's raw answer and the page code reads the memory tool's own words (records, trace,
      around, now_around, from_update, citation_id, tier, path, start, end, fingerprint, version,
      and the problem names source_changed, source_missing and no_source). So the review tool's
      code would name Garura's memory vocabulary, speak a second contract (the memory tool's
      version 4) next to its own, and receive file paths. That is the coupling base section 1 rules
      out. Story 9's own Garura half (line 475) says the pack is built from the memory tool's
      answers, which is the right shape, so the same document says two different things about
      whether the page reads the raw answer or a pack.
    backed_by_owner_decision: >
      Partly. The owner asked for the trace to be shown with its sources and the lines around
      them. Nothing quoted says the page should read the memory tool's answer directly or that the
      review tool should learn its words.
    recommendation: >
      Say that Garura's half turns each citations answer into pieces in the pack: a kind for an
      agent decision, each step as a labelled section carrying the lines, the lines around and a
      state (same, changed, gone, no source) as data, with the source already written as plain
      words by Garura. Mark the mock's embedded raw answer as stand-in only, outside the extraction
      line.

  - id: TDD-2
    file: ".garura/project/issues/617/specs/review-tool.md; .garura/project/issues/617/specs/review-tool-mockup.html"
    lines: "review-tool.md 178-182, 197, 246-283; review-tool-mockup.html 344-348 (the five switches)"
    severity: P3
    principle: >
      The review tool's third section is one section, Memory and ADRs. Three accepted ADRs and the
      committed #653 plan say so (G4).
    committed_source: >
      main:docs/adr/036-approved-answer-lands-in-short-term-memory.md section 7 and section 8;
      main:docs/adr/035-agents-work-only-from-memory.md section 7 (amended by 036);
      main:docs/adr/032-drive-review-of-outcomes.md header ('the third section is Memory and ADRs,
      not Memory'); main:.garura/project/issues/653/specs/plan.md 'When this plan is done'.
    violation: >
      The design now has five sections (Intents, Product, ADRs, Memory, Agent decisions) and says
      the owner split the third into three. No ADR amendment is in this diff (nothing under
      docs/adr changed), so ADR 032, 035 and 036 and the #653 plan still describe one section
      called Memory and ADRs, and ADR 036's own Affects list names review-tool.md section 4 as a file
      that follows it. The section also keeps the superseded one-section text beside the new
      bullets ("Earlier text, kept", lines 282-304) with a blanket line that it "now reads across
      these three", so a builder of #664 cannot tell which sentences hold. The doc also states, in
      story 9's Garura half, that Garura applies the /adr accept; ADR 036 lists who writes the
      approval on an ADR card as not decided.
    backed_by_owner_decision: >
      Yes for the split (the owner's 18 October decision, quoted in the added text and in the #659
      plan log). So this is ADR lag, not a fault in the decision: the record has not caught up.
    recommendation: >
      Record the split through /adr (an amendment to ADR 036 section 7 and the lines on ADR 032
      section 3 and ADR 035 section 7) and have this document cite it. Until then add one line to
      item 7 saying ADR 032, 035 and 036 still say one section, and say which kept sentences are
      superseded by the new bullets.

  - id: TDD-3
    file: ".garura/project/issues/617/specs/review-tool.md"
    lines: "252-253 (the ADRs bullet); 246-251"
    severity: P3
    principle: >
      Nothing is answered twice (G6). A product decision record and an ADR are one kind of record
      at different levels, and whether a product decision waiting for a person is reviewed under
      Decisions in Product or in the ADR section is an open point in ADR 036.
    committed_source: >
      main:.garura/project/issues/617/specs/review-tool.md section 4 layout item 1;
      main:core/grounding/glossary.md line 61; main:docs/adr/036-approved-answer-lands-in-short-term-memory.md
      Negative / Risks, Not decided here, first bullet.
    violation: >
      The new ADRs section is "the decisions a person records with /adr: the ones waiting to be
      accepted, and the accepted ones", answered there by Accept or Send back. The Product section
      on main still lists Decisions as a kind with its own verbs (section 3 kinds, section 4 rail).
      By the glossary these are the same record at product level. The text does not say which
      switch answers a decision record and which shows it read-only, so one record can sit in two
      switches. A third meaning of "decision" (an agent's, in Agent decisions) joins the page.
    backed_by_owner_decision: >
      No. The quoted decision names the three sections; it does not say where a product decision
      record is answered.
    recommendation: >
      One sentence: a product decision record is answered in the ADRs section (or in Product) and
      shown read-only, with a link, in the other, the rule already used for an ICE. Say it in item 7
      and close ADR 036's open point in the same /adr record as TDD-2.

  - id: TDD-4
    file: ".garura/project/issues/617/specs/review-tool.md; .garura/project/issues/617/specs/review-tool-mockup.html"
    lines: "review-tool.md 277-278 ('Looks right, or send back so the agent decides again'); review-tool-mockup.html 1284-1287 (the Looks right and Send back buttons), 1338 (recorded as an event only)"
    severity: P3
    principle: >
      Approval is part of the product model; the pieces that carry it are listed; only the review
      step writes approved or in progress; the review tool writes nothing to the model. A send-back
      re-runs the play that writes that kind of piece, for that one piece (G7).
    committed_source: >
      main:docs/adr/033-approval-in-the-product-model.md sections 1, 3 and 6;
      main:docs/adr/032-drive-review-of-outcomes.md section 4 and its Negative / Risks (each play
      that writes a reviewed kind must be able to re-run for one piece).
    violation: >
      A person can mark an agent decision "Looks right" or send it back so "the agent decides
      again". An agent decision record is not among the pieces ADR 033 section 1 lists as carrying
      approval, and no committed text says what "Looks right" writes, who writes it (the mock
      records only an event), whether it counts as approval (ADR 033 section 3: agents build only
      from approved pieces), or whether a decision whose source changed and is then marked right
      keeps its stale source. A send-back also has no unit: which play re-runs, for which question,
      and how a re-run decision replaces the old record, none of which any play can do today.
    backed_by_owner_decision: >
      Partly. The owner wants agent decisions seen (and ADR 034 section 4 backs showing what was
      assumed and on what basis at the drive's review). No quoted decision or ADR backs a verdict on
      one or a per-decision re-run.
    recommendation: >
      Say what each answer records and who writes it (an event, applied by Garura's review step,
      like the other answers), whether it is an approval or only a read mark, and what a send-back
      re-runs. If it is only a read mark, call it "Seen" and drop the send-back until a play can
      re-decide one question.

  - id: TDD-5
    file: ".garura/project/issues/617/specs/review-tool.md; .garura/project/issues/617/specs/review-tool-mockup.html"
    lines: "review-tool.md 265-278 ('Grouped by play, problems first'); review-tool-mockup.html 1154-1155, 1242 (PLAYS, byPlay, one block per play)"
    severity: P3
    principle: >
      The person reviews the outcome, not the plays, and not the detail under the outcome. The
      plays' records are not shown play by play. One committed opening: the drive's review shows what
      was assumed and on what basis (G8).
    committed_source: >
      main:docs/adr/032-drive-review-of-outcomes.md section 2 and Alternatives ('A viewer per play ...
      lost: reviewing a play does nothing'); main:docs/philosophy/idsd.md (a person has two
      interfaces; the work in between is agent work); main:.garura/project/issues/617/specs/review-tool.md
      section 3 ('the plays are never shown'); main:docs/adr/034-plays-answer-from-memory-inside-a-drive.md section 4.
    violation: >
      The Agent decisions screen groups every decision under the play that made it (/intent,
      /vision, /understand) and shows each step of the agent's reasoning, with an action on each
      decision. ADR 032 section 2 says the review stays at the outcome level and the plays'
      records are not shown play by play; its Alternatives rejects a per-play viewer. ADR 034
      section 4 backs showing the assumption and its basis, so showing a decision with its source
      conforms (see conformance). It does not back grouping by play, or the step-by-step trace as
      something the person reviews.
    backed_by_owner_decision: >
      Partly. The owner asked for agent decisions and for their traces to be shown (19 October);
      nothing quoted asks for grouping by play.
    recommendation: >
      Group by what the decision belongs to (the issue, the capability it served), which is
      outcome-shaped, or record the exception to ADR 032 section 2 through /adr alongside TDD-2, and
      say in the doc that the trace is shown so the person can check the basis, not to review the play.

  - id: TDD-6
    file: ".garura/project/issues/617/specs/review-tool.md; .garura/project/issues/617/specs/review-tool-mockup.html"
    lines: "review-tool.md 252-253, 277-278, 284-288 (the kept sentence 'Every memory review and ADR review happens here, with the Catch up cards above'); review-tool-mockup.html 1172 (Catch up button hidden), 1281-1287 (side-panel buttons for ADRs and decisions)"
    severity: P3
    principle: >
      Every memory review and ADR review happens in that section on the same Catch up cards: one
      card per change, swipe right to accept, swipe left to leave for later; answers that take words
      are buttons. The /adr accept moves onto a card in that section (G5).
    committed_source: >
      main:docs/adr/036-approved-answer-lands-in-short-term-memory.md section 7 and Affects;
      main:.garura/project/issues/617/specs/review-tool.md section 4 item 6.
    violation: >
      The new bullets give an ADR "Accept, or send back with a comment" and an agent decision
      "Looks right, or send back", and say nothing about cards. The mock hides the Catch up button in
      the ADRs and Agent decisions sections and answers them from a side panel, so an ADR cannot be
      accepted on a card, which ADR 036 says the /adr accept does once the section exists. Memory
      updates do get a Catch up. The kept sentence on lines 286-288 still says every review uses the
      cards, so the document contradicts its own mock.
    backed_by_owner_decision: >
      No.
    recommendation: >
      Say whether ADR and agent-decision cards exist in Catch up (an ADR: swipe right accepts, swipe
      left leaves it, Send back a button with a comment) and show one in the mock, or state the
      departure from ADR 036 section 7 and record it with TDD-2.

  - id: TDD-7
    file: ".garura/project/issues/617/specs/review-tool.md; .garura/project/issues/617/specs/review-tool-mockup.html"
    lines: "review-tool.md 254-264 (the Memory bullet, Ask memory); review-tool-mockup.html 1122, 1202-1206, 1333 (one canned answer for any question)"
    severity: P3
    principle: >
      An answer comes from memory, never from the model alone; when no tier answers, the route is a
      memory update a person approves. The memory tool finds, searches and reads exact lines and
      returns tier, file, lines and a fingerprint (G10). The review tool never calls Garura; calls
      go from Garura to the tool or by the listener (G3).
    committed_source: >
      main:docs/adr/035-agents-work-only-from-memory.md sections 4 and 5;
      main:docs/adr/034-plays-answer-from-memory-inside-a-drive.md section 3;
      main:core/tools/memory/contract/v3.json (find, search, read; answer_rules nothing_found);
      main:.garura/project/issues/617/specs/review-tool.md section 2 and section 1.
    violation: >
      Ask memory is described as a plain-words question box whose answer "comes with the memory it
      came from", with "the same memory tool the agents use" underneath. The committed tool returns
      lines, not a written answer, so something must read the lines and compose the plain-words
      answer; the design does not say what (a model? where does it run?). It does not say what the box
      shows when no tier answers (the committed rule is a memory update, never an answer from the
      model), and the mock shows only the success case: any question typed returns the same sample
      answer. It also does not say how a question reaches the memory tool and back while a person
      waits, when the review tool never calls Garura and its requests all go from Garura or the
      listener. ADR 035 section 7 names no question box at all.
    backed_by_owner_decision: >
      Yes for the box and for mocking it only ("no need to build this whole thing now"). Not stated:
      who composes the answer, the no-answer path, or how the question crosses the line.
    recommendation: >
      Add three sentences: who writes the answer from the lines and on which side of the line; that
      a question no tier answers shows "memory does not hold this" and offers to raise a memory
      update, never an answer; and how the question travels (an event the listener answers by a
      reply, like a comment). Record the box itself through /adr with TDD-2.

  - id: TDD-8
    file: ".garura/project/issues/617/specs/review-tool.md"
    lines: "470-482 (story 9 and the sentence after it)"
    severity: P3
    principle: >
      Stories that touch only the tool and stories that touch only Garura are the extraction line.
      Garura builds the pack; the tool renders it (G13).
    committed_source: >
      main:.garura/project/issues/617/specs/review-tool.md section 7 (last paragraph) and section 3
      ('Garura builds the pack').
    violation: >
      Story 9's tool half lists "what each memory tier holds" and "which memory each decision came
      from" as the tool's work. Both are Garura data. The Garura half names only the memory tool's
      updates and the decision records for the pack, plus the decide and apply calls and the /adr
      accept. Four pieces the section needs have no owner: building the tier summaries (what each
      tier holds, counts, versions) into the pack; running the citations check and turning its result
      into the pack; Ask memory's answer path; and re-running a decision on a send-back. So "touch
      only Garura" cannot be tested for the Garura half as written.
    backed_by_owner_decision: >
      No.
    recommendation: >
      List the four in the Garura half, and say the tool half renders pieces and records events
      for them without knowing what a tier or a citation is.

  - id: TDD-9
    file: ".garura/project/issues/617/specs/review-tool-mockup.html"
    lines: "1256 (file path), 1258 (fingerprint and Phoenix version hash), 1263 (record id), 1265 (update id)"
    severity: P3
    principle: >
      The page speaks plain words: no file paths, no field names. A source is the exception the
      person must be able to check, and ADR 035 section 6 says a decision names the tier, the file
      and the lines it rests on (G11, G9).
    committed_source: >
      main:.garura/project/issues/617/specs/review-tool.md section 4 'Keeping the load low' ('No file
      paths, no field names, no YAML. Labels in plain words.');
      main:docs/adr/035-agents-work-only-from-memory.md section 6;
      main:core/components/memory/standards/rules/user-facing-voice.md (the voice rule's scope is
      replies to the person, so the base design's rule is the one measured here).
    violation: >
      Each trace step shows the tier, the file path and the lines (backed by ADR 035 section 6), and
      also a short fingerprint ("fingerprint 6b5ec069..."), a 12-character Phoenix memory version
      hash, and record ids (a citation id and a memory-update id) in the lead lines. None of those
      three helps the person judge a decision; they exist for the check. The design text never says
      that showing a path is an exception to section 4's rule, so the two committed principles
      (no paths; name the file and lines) are left in conflict.
    backed_by_owner_decision: >
      Partly. The owner asked for the source's lines in their place; nothing asks for fingerprints,
      version hashes or ids to be shown.
    recommendation: >
      Keep tier, file and lines with the numbered lines; move the fingerprint, version and ids into a
      "details" fold. Add one line to the section: a source is shown as file and lines by exception
      to the plain-words rule, because the person must check it.

  - id: TDD-10
    file: ".garura/project/issues/617/specs/review-tool-mockup.html"
    lines: "1124-1126 (the three waiting updates carry no sources), 1272-1276 (the update card), 1313-1316 (the Catch up card)"
    severity: P3
    principle: >
      Nothing from the web or the model is used until a person approves it, so the card must show
      what the draft came from: where it came from, marked, and its sources (G12).
    committed_source: >
      main:docs/adr/035-agents-work-only-from-memory.md section 5;
      main:core/tools/memory/contract/v3.json (propose: sources is required, with draft_source);
      main:.garura/project/issues/617/specs/review-tool.md section 4 item 7 (the card lists the
      sources).
    violation: >
      The memory-update card and its Catch up card show a "Drafted from the web" or "Drafted by the
      model" chip, the draft and the reason, but no sources. A person asked to approve a web or model
      draft sees no link or lines behind it. The committed design lists the sources on the card, and
      the contract requires them on every update. The mock added in this diff leaves out the one thing
      ADR 035 section 5's safeguard depends on.
    backed_by_owner_decision: >
      No.
    recommendation: >
      Add a Sources line to both cards (links for a web draft; memory lines for a memory draft;
      "none given" shown plainly for a person or model draft), and give each sample update some.

  - id: TDD-11
    file: ".garura/project/issues/617/specs/review-tool.md; .garura/project/issues/617/specs/review-tool-mockup.html"
    lines: "review-tool.md 255-263 ('no index (vectorless, ADR 035 section 4)', the owner's quote about 'the tool'), 265-270 ('trace'); review-tool-mockup.html 1103, 1105"
    severity: P4
    principle: >
      One term per meaning (G14). Naming clarity: an ambiguous or overloaded name is bad design
      leaking.
    committed_source: >
      main:core/components/memory/knowledge/domains/.pageindex/pageindex.py (docstring: 'Vectorless
      RAG', a hierarchical tree the model navigates, i.e. an index);
      main:docs/adr/035-agents-work-only-from-memory.md section 4 and Alternatives (a search index,
      'semantic, or numbered nodes', set aside; the tool searches like Claude Code does);
      main:core/grounding/glossary.md line 43 ('Resolution trace') and main:docs/adr/035-agents-work-only-from-memory.md section 9.
    violation: >
      (a) "vectorless" is not in ADR 035. On main it labels the PageIndex tree index, which ADR 035
      section 4 and Alternatives set aside; the design says "no index (vectorless, ADR 035 section
      4)", so the citation does not carry the word and the word already names an indexed method.
      (b) "the tool" appears in the owner's quote for three things (the review tool, the memory tool
      and the one for Griffin) and the doc keeps the quote unglossed beside "the same memory tool
      under both". (c) "trace" now means the memory tool's ordered steps; the glossary on main
      still defines "Resolution trace" as the R1 to R4 file, which ADR 035 section 9 retires in part,
      and has no entry for the new meaning.
    backed_by_owner_decision: >
      Partly. The owner chose the word "traces" (19 October) and spoke of "vectorless". What is
      missing is only a pointer or a definition.
    recommendation: >
      Say "no index" (or define vectorless in a clause); name the tool in each sentence; add a
      glossary line for "trace" when the resolution rule is rewritten (#663).

  - id: TDD-12
    file: ".garura/project/issues/617/specs/review-tool.md; .garura/project/issues/617/specs/review-tool-mockup.html"
    lines: "review-tool.md 254-255 (the Memory bullet); review-tool-mockup.html 1113-1117 (the three tier cards)"
    severity: P4
    principle: >
      The memory section shows short-term, Garura and Phoenix memory (G4).
    committed_source: >
      main:docs/adr/036-approved-answer-lands-in-short-term-memory.md section 7;
      main:docs/adr/035-agents-work-only-from-memory.md section 7.
    violation: >
      The Memory bullet lists Garura memory and, once an issue is picked, its short-term memory. It
      leaves out Phoenix memory. The mock still shows the Phoenix tier (its file count and approved
      version) and Ask memory looks there. Text and mock disagree, and the text departs from ADR 036.
    backed_by_owner_decision: >
      The owner's quoted words list only Garura memory and short-term memory, so the omission has
      backing in words; the mock has none.
    recommendation: >
      Say whether Phoenix memory is shown (a count and its approved version) and make the text and
      the mock agree; include it in the /adr record from TDD-2.

  - id: TDD-13
    file: ".garura/project/issues/617/specs/review-tool.md; .garura/project/issues/617/specs/review-tool-mockup.html"
    lines: "review-tool.md 265-266 ('every decision an agent made'); review-tool-mockup.html 1233 (the headline), the Memory section's issue picker"
    severity: P4
    principle: >
      Short-term memory is the current issue only, and a decision record is kept in its issue's
      short-term memory. A drive's review is the whole-model view narrowed to what the drive changed.
    committed_source: >
      main:docs/adr/036-approved-answer-lands-in-short-term-memory.md section 1;
      main:core/tools/memory/contract/v3.json (answer_rules short_term_is_this_issue);
      main:docs/adr/033-approval-in-the-product-model.md section 7.
    violation: >
      The doc says the section shows "every decision an agent made" and does not say whose: one
      picked issue's, one drive's, or every issue's. The Memory section has an issue picker; the
      Agent decisions screen has none and its headline reads "for issue #613". A reader cannot tell
      what the list is scoped to or how a drive's end review narrows it.
    backed_by_owner_decision: >
      No.
    recommendation: >
      Say that the list is the picked issue's (or the drive's) decisions, and add the same issue
      picker to the screen.

