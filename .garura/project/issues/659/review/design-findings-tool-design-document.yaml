    No committed source on main names a five-section review tool, an Ask memory box, a verdict on an
    agent decision, a pack kind for an agent decision, or "trace" in the sense this change uses. Those
    points are tested against the closest committed principles (extraction line, one term per
    meaning, outcome level, cards) and, for coverage only, ADR 037.
  - >
    No review playbook exists for this category (playbook null in categories.yaml). The base design
    document and the ADRs stand in for it.

