  - "main:.garura/project/issues/617/specs/review-tool-mockup.html   # switch has Intents and Product only; Catch up card answers are Drop, Send back, Later, Accept, with swipe right to accept and swipe left to leave for later"
  - "main:docs/adr/032-drive-review-of-outcomes.md   # sections 2 (the person reviews the outcome, not the plays; the review stays at the outcome level; plays' records are not shown play by play), 3 (two review tools; header: third section Memory and ADRs), 4 (accept, drop, send back re-runs the play that writes that kind of piece for that one piece)"
  - "main:docs/adr/033-approval-in-the-product-model.md   # sections 1 (which pieces carry approval), 2 (approved, changed, in progress), 3 (agents work only on approved pieces), 6 (only the review step writes approval; the review tool writes nothing to the model), 7 (a drive's review is the whole-model view narrowed to what the drive changed)"
  - "main:docs/adr/034-plays-answer-from-memory-inside-a-drive.md   # sections 3 (never from the model alone), 4 (every answer names its source; the drive's review shows what was assumed and on what basis; an answer with no source is not allowed)"
  - "main:docs/adr/035-agents-work-only-from-memory.md   # sections 3 (lookup order), 4 (one tool; searches the way Claude Code does: find files, search their text, read exact lines), 5 (nothing from the model or the web until a person approves), 6 (every decision names its memory: tier, file, lines), 7 (the review tool's view shows which memory each decision came from), Alternatives (a search index, semantic or numbered nodes, lost)"
  - "main:docs/adr/036-approved-answer-lands-in-short-term-memory.md   # sections 1 (short-term memory is the current issue only), 7 (the third section is Memory and ADRs; it shows short-term, Garura and Phoenix memory, the waiting updates, the waiting ADRs and which memory each decision came from; every memory and ADR review happens there on the same Catch up cards), 8, 9; Affects (review-tool.md section 4 and the /adr accept move onto a card); Negative / Risks, Not decided here (whether a product decision is reviewed in Memory and ADRs or under Decisions in Product; who writes the approval on a memory or ADR card; whether a drive goes on while an update waits)"
