method: >
  Round 2. Principles were reconstructed again, only from sources committed on main (git show
  main:<path>) and from Phoenix memory at origin/main (~/.garura/phoenix-memory, at 5fcd88e): the base
  version of this design document and its base mockup, ADR 029, 031 to 036 as they stand on main,
  the committed #653 plan, the philosophy page on the human interface, the glossary, the user-facing
  voice rule and the PR severity taxonomy (the Phoenix copies of pr.md and user-facing-voice.md were
  compared with main and are the same text). The change since round 1 was read as the diff
  192fd932..4553fe26 on the two files, and the files were then read whole at head. ADR 037 is branch
  content the owner accepted through /adr. It is used for one question only, "does an accepted
  record now cover this departure from main's ADRs", and never as the standard: where a departure
  is covered by ADR 037 the ADR-lag part of a finding is closed; where ADR 037 names the point as
  not decided, or is silent, the finding stands. Nothing the branch adds or rewrites in the two
  files was used as grounding. Owner quotes in the design are used only to answer "is this backed
  by the owner", never to say what the committed design is.
