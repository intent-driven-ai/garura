principles_grounded:
  - id: G1
    principle: >
      The review tool is extractable: its own folder, no Garura code, no Garura path, and it talks to
      Garura only through its own contract. Garura words reach it as data (kinds with a label, an icon
      and the verbs they allow), never as code. The tool code never names them.
    committed_source: "main:.garura/project/issues/617/specs/review-tool.md section 1 items 1, 2, 3, 7; section 3 (kinds)"
  - id: G2
    principle: >
      The pack is outcome-shaped, not file-shaped. The tool never sees a file path. The pack outline is
      the source the contract (story 1) is written from.
    committed_source: "main:.garura/project/issues/617/specs/review-tool.md section 3 (first paragraph and the pack outline); section 7 story 1"
  - id: G3
    principle: >
      The tool records each action as a numbered event and writes nothing to the model. Garura's
      listener connects out to the tool; the tool never calls Garura. Only the review step writes
      approval.
    committed_source: "main:.garura/project/issues/617/specs/review-tool.md sections 2 and 5; main:docs/adr/033-approval-in-the-product-model.md section 6"
  - id: G4
    principle: >
      The review tool's third section on main is one section, Memory and ADRs. It shows short-term,
      Garura and Phoenix memory, the updates waiting, the ADRs waiting, and which memory each decision
      came from.
    committed_source: "main:docs/adr/036-approved-answer-lands-in-short-term-memory.md sections 7 and 8; main:docs/adr/035-agents-work-only-from-memory.md section 7; main:.garura/project/issues/653/specs/plan.md 'When this plan is done'"
  - id: G5
    principle: >
      Every memory review and ADR review happens in that section on the same Catch up cards as
      Intents and Product: one card per change, swipe right to accept, swipe left to leave for later.
      An answer that takes the person's words is a button, never a swipe. The /adr accept moves onto a
      card once the section exists.
    committed_source: "main:docs/adr/036-approved-answer-lands-in-short-term-memory.md section 7 and Affects; main:.garura/project/issues/617/specs/review-tool.md section 4 item 6"
  - id: G6
    principle: >
      Nothing is answered twice: a piece shown in two places is answered in one and read-only, with a
      link, in the other. A product decision record and an ADR are the same kind of record at
      different levels, and where a waiting product decision is reviewed is not decided.
    committed_source: "main:.garura/project/issues/617/specs/review-tool.md section 4 layout item 1; main:core/grounding/glossary.md line 61; main:docs/adr/036-approved-answer-lands-in-short-term-memory.md Negative / Risks, 'Not decided here', first bullet"
  - id: G7
    principle: >
      Approval is part of the product model. The pieces that carry it are listed (business intents,
      agent intents, domains, capabilities, functionalities, limits, decisions). Only the review step
      writes approved or in progress, from the person's answers. A send-back re-runs the play that
      writes that kind of piece, for that one piece.
    committed_source: "main:docs/adr/033-approval-in-the-product-model.md sections 1, 2, 3, 6; main:docs/adr/032-drive-review-of-outcomes.md section 4"
  - id: G8
    principle: >
      The person reviews the outcome, not the plays and not the detail under the outcome. The plays'
      records are not shown play by play. The one committed opening into the work in between: the
      drive's review shows what was assumed and on what basis.
    committed_source: "main:docs/adr/032-drive-review-of-outcomes.md section 2 and Alternatives; main:docs/philosophy/idsd.md 'The Plan Is the Human's Interface'; main:.garura/project/issues/617/specs/review-tool.md section 3 last sentence; main:docs/adr/034-plays-answer-from-memory-inside-a-drive.md section 4"
  - id: G9
    principle: >
      Every decision an agent makes names the memory it came from: the tier, the file and the lines.
      An answer with no source is not allowed. The review view shows which memory each decision came
      from. This is the committed ground for showing a source's tier, file and lines on the page.
    committed_source: "main:docs/adr/035-agents-work-only-from-memory.md sections 6 and 7; main:docs/adr/034-plays-answer-from-memory-inside-a-drive.md section 4"
  - id: G10
    principle: >
      An answer comes from memory read in order (this issue's short-term memory, Garura, Phoenix),
      never from the model alone. When no tier answers, the route is a memory update a person
      approves. The memory tool finds, searches and reads exact lines and returns tier, file, lines
      and a fingerprint; a search index was set aside.
    committed_source: "main:docs/adr/035-agents-work-only-from-memory.md sections 3, 4, 5 and Alternatives; main:docs/adr/036-approved-answer-lands-in-short-term-memory.md section 1; main:docs/adr/034-plays-answer-from-memory-inside-a-drive.md section 3; main:core/tools/memory/contract/v3.json"
  - id: G11
    principle: >
      The page speaks in plain words: no file paths, no field names, no YAML. The voice rule's own
      scope is replies to the person, so the base design's rule is the one that governs the page.
    committed_source: "main:.garura/project/issues/617/specs/review-tool.md section 4 'Keeping the load low'; main:core/components/memory/standards/rules/user-facing-voice.md (Scope, The rule)"
  - id: G12
    principle: >
      A draft from the web or the model is not used until a person approves it, so the card shows
      where it came from (marked) and its sources. Approve and Reject each carry the person's words.
    committed_source: "main:docs/adr/035-agents-work-only-from-memory.md section 5; main:core/tools/memory/contract/v3.json (propose requires draft_source and sources); main:.garura/project/issues/617/specs/review-tool.md section 4 item 7 on main"
  - id: G13
    principle: >
      The build order is the extraction line: stories that touch only the tool and stories that touch
      only Garura, tested every day they are built. Garura builds the pack; the tool renders it.
    committed_source: "main:.garura/project/issues/617/specs/review-tool.md section 7 (last paragraph) and section 3 ('Garura builds the pack')"
  - id: G14
    principle: >
      One term per meaning. Evidence is each play's run records. A decision or ADR is a decision
      record at any level. Resolution trace is the R1 to R4 per-decision file. Vectorless already
      labels the knowledge base's PageIndex, a tree index the model navigates.
    committed_source: "main:core/grounding/glossary.md lines 42, 43, 61; main:docs/adr/035-agents-work-only-from-memory.md section 9; main:core/components/memory/knowledge/domains/.pageindex/pageindex.py (docstring)"

adr_037_coverage:
  # For each departure from main's ADRs that this category carries: does the accepted ADR 037 cover it?
  # (Coverage only. ADR 037's words are not the standard.)
  - departure: "five sections (Intents, Product, ADRs, Memory, Agent decisions) in place of Memory and ADRs"
    covered: yes
    where: "ADR 037 section 3 and section 5; one-line pointers now on the status lines of ADR 032, 035 and 036"
    effect: "The ADR-lag part of round 1 TDD-2 is closed."
  - departure: "a decision keeps a trace of steps, each with a source, and the review tool shows it"
    covered: yes
    where: "ADR 037 sections 1, 2 and 3 (amends ADR 035 section 6 and section 7)"
    effect: "Showing a trace conforms to ADR 035 section 6 and 7 as amended."
  - departure: "a source is shown as its memory, file and lines, an exception to the no-file-paths rule"
    covered: yes
    where: "ADR 037 Negative / Risks ('A source is shown as its memory, file and lines ... an exception ... which [the owner] asked for')"
    effect: "Recorded as a known exception. The committed ground for the content is main's ADR 035 sections 6 and 7 (G9). See TDD-16 for how the design attributes it."
  - departure: "Ask memory, a plain-words search over all three tiers on the same memory tool, mocked only"
    covered: partly
    where: "ADR 037 section 4 covers the box, 'only the interface is plain words', and mocked only"
    effect: "Who composes the plain-words answer, what the box shows when no tier answers, and how a question reaches the memory tool are not covered (TDD-7)."
  - departure: "'Looks right' and 'send back so the agent decides again' on an agent decision"
    covered: no
    where: "ADR 037 Negative / Risks lists it under 'Not decided here', pointing at ADR 033 section 6"
    effect: "Still open (TDD-4)."
  - departure: "whether the Memory section lists Phoenix memory"
    covered: no
    where: "ADR 037 'Not decided here', second bullet"
    effect: "Still open (TDD-12)."
  - departure: "where a waiting product decision (decision.yaml) is reviewed, and who writes the approval on a card"
    covered: no
    where: "ADR 037 'Not decided here', third bullet (still open from ADR 036)"
    effect: "Still open (TDD-3; the /adr accept owner is part of TDD-8)."
  - departure: "whether the glossary gains a row for 'trace'"
    covered: no
    where: "ADR 037 'Not decided here', fourth bullet"
    effect: "Still open (TDD-11 c)."
  - departure: "ADR and agent-decision answers on a side panel with the Catch up button hidden"
    covered: no
    where: "ADR 037 section 3: 'Where this ADR is silent, ADR 036 section 7 stands: the reviews happen ... on the Catch up cards'"
    effect: "ADR 037 keeps main's cards rule where it is silent, so the departure is unrecorded (TDD-6)."
  - departure: "agent decisions grouped by the play that made them"
    covered: no
    where: "ADR 037 section 3 says 'every decision an agent made, with its trace' and nothing about grouping"
    effect: "Stands against ADR 032 section 2 (TDD-5)."
  - departure: "the pack-piece route (Garura builds pieces; the tool never reads the memory tool's answers)"
    covered: not an ADR matter
    where: "It is the design applying main's section 1 and section 3, not departing from an ADR"
    effect: "Judged under G1, G2, G13 (round 1 TDD-1; TDD-14 and TDD-15)."

