category: tool-design-document
grounded_by: change-reviewer (Layer 2, PR #676 / issue 659)
base_ref: main
files_under_review:
  - .garura/project/issues/617/specs/review-tool.md
  - .garura/project/issues/617/specs/review-tool-mockup.html
method: >
  Principles were reconstructed only from sources committed on main (git show main:<path>) and from
  Phoenix memory at origin/main (~/.garura/phoenix-memory): the base version of this same design
  document, its base mockup, ADR 029, 031, 032, 033, 034, 035 and 036, the committed memory-tool
  contract (version 3), the committed #653 plan, the philosophy page on the human interface, the
  glossary, the user-facing voice rule and the PR severity taxonomy. Nothing the branch adds or
  rewrites was used as grounding. The owner's decisions of 18 and 19 October (five sections; Ask
  memory mocked only; "these are called traces") are quoted in the branch's added text and logged in
  the branch's #659 plan. They are used here only to answer "is this departure backed by an owner
  decision", never to say what the committed design is. Where the branch moves past a committed
  ADR, the finding is written as ADR lag (the record has not caught up), not as a fault in the
  owner's decision. The Phoenix memory copies of pr.md, user-facing-voice.md and resolution.md were
  compared with main and are the same text.
status: completed
grounding_unavailable: none
grounding_gaps:
  - >
    No committed source names a five-section review tool, an Ask memory box, a verdict on an agent
    decision, or the word "trace" in the sense this change uses. These are the points the findings
    below test; each is reported as ADR lag or a missing definition, never as grounded by the branch.
  - >
    No review playbook exists for this category (playbook null in categories.yaml). The base design
    document and the ADRs stand in for it.

