findings:
  - id: TDD-14
    new_in_round: 2
    file: ".garura/project/issues/617/specs/review-tool.md"
    lines: "276-283 (the Agent decisions bullet), 289-293 ('stand-in only' and 'the local page reads them live')"
    severity: P3
    principle: >
      The tool is extractable and talks to Garura only through its own contract; Garura words arrive
      as data and the tool code never names them (G1). The design must say one thing about where the
      coupling is. Round 1 found the document saying two things; the fix has left two things in one
      bullet.
    committed_source: >
      main:.garura/project/issues/617/specs/review-tool.md section 1 items 1, 2, 3 and 7; section 3
      ('Garura builds the pack'); section 7 last paragraph (the extraction line).
    violation: >
      Lines 276-279 still say 'The page shows the memory tool's own answers, in the contract's shape:
      `citations --check` and `updates`'. Lines 280-283 then say 'The page does not read those
      answers itself'. A builder of #664 who reads the first sentence builds the coupling the second
      forbids. Lines 291-293 add 'the local page reads them live' with no note that this is the local
      prototype of section 7's 'what stands in until then', outside the extraction line, so the
      sentence reads as a statement about the real page. The inserted paragraph also splits one
      sentence, so 'Looks right, or send back so the agent decides again from memory as it is now'
      (290-291) now follows 'a stand-in only'.
    backed_by_owner_decision: >
      Partly. The owner asked for the route (the pack pieces) in the round 1 review; nothing asks for
      the old sentence to stay.
    recommendation: >
      Reword the first sentence to 'The mockup shows the memory tool's own answers' (or delete it),
      say 'the local prototype reads them live, outside the extraction line' in the last sentence,
      and move 'Looks right, or send back ...' to follow the Grouped-by-play sentence.

  - id: TDD-15
    new_in_round: 2
    file: ".garura/project/issues/617/specs/review-tool.md"
    lines: "section 3 pack outline (150-172) against 283-289 (the pieces Garura builds) and 487-493 (story 9)"
    severity: P3
    principle: >
      The pack outline is what the contract is written from (story 1), and Garura words arrive in it
      as data: kinds with a label, an icon and the verbs they allow (G1, G2). One term per meaning
      (G14): 'decision' is already a pack kind meaning a decision record at any level.
    committed_source: >
      main:.garura/project/issues/617/specs/review-tool.md section 1 items 2 and 3; section 3 (the
      pack outline: kinds, pieces[], sections[] with a label, a before, an after and editable yes or
      no; change added/changed/removed/same); section 7 story 1; main:core/grounding/glossary.md line
      61.
    violation: >
      Section 4 now says Garura sends 'a kind for an agent decision, and each step a labelled section
      that carries the lines, the lines around them and a state (same, changed, gone, no source) as
      data'. The pack outline was not touched. Its kinds line lists six kinds and no agent decision;
      its sections are before and after text, which cannot say which of the numbered lines the agent
      used (the part the owner asked to see marked) or carry a state; and its 'change' and 'status'
      fields mean what a drive did to a piece, not whether a source still says the same. The word
      'decision' in the kinds line already means a product decision record, so the new kind needs a
      distinct label and the doc names none. The route is stated; the data shape it needs is not
      anywhere the contract can be written from.
    backed_by_owner_decision: >
      No. The owner decided the content to show (lines in their place, the used lines marked), not
      the pack shape.
    recommendation: >
      Add the agent decision kind to the pack outline with its own label (not 'decision'), and give
      a step a shape that carries numbered lines, which of them are marked, the lines now (for a
      changed source) and the state. Note that the check data (fingerprint, version, ids) travels in
      a details part the tool shows folded without understanding it.

  - id: TDD-16
    new_in_round: 2
    file: ".garura/project/issues/617/specs/review-tool.md"
    lines: "322-324 ('Keeping the load low' exception and its quote); 283-290"
    severity: P4
    principle: >
      A claim that the owner decided something is only as good as the words it quotes, and the
      committed ground for what the page must show is the ADR that says so. Showing a source's tier,
      file and lines is required by the committed ADR 035 (G9); the design should cite that.
    committed_source: >
      main:docs/adr/035-agents-work-only-from-memory.md section 6 ('the tier, the file and the lines
      it rests on') and section 7 (the review view shows which memory each decision came from);
      main:docs/adr/034-plays-answer-from-memory-inside-a-drive.md section 4.
    violation: >
      The exception is credited to the owner with the quote 'the source should show a few lines
      before and after'. That quote asks for the lines around a source, not for the memory, file
      and lines to appear against the no-file-paths rule. The owner's request for the exception is
      recorded only as the round 1 review reply and in ADR 037's Risks. A reader checking the
      sentence against its quote finds a different decision. The design never points to main's ADR 035
      sections 6 and 7, which already require it.
    backed_by_owner_decision: >
      Yes for the exception itself (the owner's round 1 reply, ADR 037 Risks). Not by the quoted words.
    recommendation: >
      Cite ADR 035 sections 6 and 7 and ADR 037 for the exception, and keep the 19 October quote
      where it belongs, on the lines around each source.

  - id: TDD-2
    carried_from_round_1: true
    file: ".garura/project/issues/617/specs/review-tool.md"
    lines: "294-301 ('The paragraphs below were written for the one combined section; they now read across these three' and 'Earlier text, kept')"
    severity: P4
    principle: >
      The third section on main is one section, Memory and ADRs, and the design must make clear which
      kept sentences still hold once it is five (G4, G5).
    committed_source: >
      main:docs/adr/036-approved-answer-lands-in-short-term-memory.md sections 7 and 8;
      main:docs/adr/032-drive-review-of-outcomes.md status line (the third section is Memory and ADRs).
    violation: >
      The ADR lag is closed: ADR 037 covers the five sections and amends ADR 032, 035 and 036. What
      remains is the design's own text. It still carries 'a third section next to Intents and Product
      ... Every memory review and ADR review happens here', and 'here' now has three sections to
      point at. The blanket line that the paragraphs below 'now read across these three' still does
      not say which sentences survive. ADR 037 section 3 gives a builder the rule for what holds
      (reviews on the Catch up cards where it is silent), which is why this is no higher than P4.
    backed_by_owner_decision: >
      Yes for the split (ADR 037). Nothing asks for the old paragraph to stay as it is.
    recommendation: >
      Drop the first sentence of the kept paragraph and keep what still holds (Catch up cards,
      Built in #664), citing ADR 037 for the sections.

  - id: TDD-3
    carried_from_round_1: true
    file: ".garura/project/issues/617/specs/review-tool.md"
    lines: "254-255 (the ADRs bullet)"
    severity: P3
    principle: >
      Nothing is answered twice (G6). A product decision record and an ADR are one kind of record at
      different levels, and where a waiting product decision is reviewed is open.
    committed_source: >
      main:.garura/project/issues/617/specs/review-tool.md section 4 layout item 1;
      main:core/grounding/glossary.md line 61; main:docs/adr/036-approved-answer-lands-in-short-term-memory.md
      Negative / Risks, 'Not decided here', first bullet.
    violation: >
      Unchanged. The ADRs section answers 'the decisions a person records with /adr' by Accept or Send
      back, and the Product section on main still lists Decisions as a kind with its own verbs. By the
      glossary these are the same record, and the text does not say which switch answers it and
      which shows it read-only. ADR 037 lists the question as still open; it does not decide it.
    backed_by_owner_decision: "No."
    recommendation: >
      One sentence in item 7: a product decision record is answered in one switch and shown
      read-only, with a link, in the other; record the choice with the next /adr that touches this.

  - id: TDD-4
    carried_from_round_1: true
    file: ".garura/project/issues/617/specs/review-tool.md; .garura/project/issues/617/specs/review-tool-mockup.html"
    lines: "review-tool.md 290-291; review-tool-mockup.html 1289-1290 (Looks right and Send back), 1342 (recorded as an event only)"
    severity: P3
    principle: >
      Approval is part of the product model; the pieces that carry it are listed; only the review step
      writes approved or in progress; the review tool writes nothing to the model. A send-back re-runs
      the play that writes that kind of piece, for that one piece (G7).
    committed_source: >
      main:docs/adr/033-approval-in-the-product-model.md sections 1, 3 and 6;
      main:docs/adr/032-drive-review-of-outcomes.md section 4 and its Negative / Risks.
    violation: >
      Unchanged. A person can mark an agent decision 'Looks right' or send it back so 'the agent
      decides again'. An agent decision is not among the pieces ADR 033 section 1 lists as carrying
      approval; nothing says what 'Looks right' writes or who writes it, whether it counts as
      approval, or which play re-runs for which question. ADR 037 names this as not decided and
      points at ADR 033 section 6, so it is a known open point, but the design and the mock present
      both buttons as if it were settled. With the pack-piece route the verdict is an event on a
      piece, which makes the missing answer (what Garura does with it) matter more.
    backed_by_owner_decision: >
      Partly. The owner wants decisions seen; no quoted decision backs a verdict or a per-decision re-run.
    recommendation: >
      Say what each answer records and who applies it, and whether it is approval or a read mark. If
      only a read mark, call it 'Seen' and drop the send-back until a play can re-decide one question.

  - id: TDD-5
    carried_from_round_1: true
    file: ".garura/project/issues/617/specs/review-tool.md; .garura/project/issues/617/specs/review-tool-mockup.html"
    lines: "review-tool.md 279 ('Grouped by play, problems first'); review-tool-mockup.html 1157-1158 (PLAYS, byPlay), 1191, 1245 (one block per play, 'by N plays')"
    severity: P3
    principle: >
      The person reviews the outcome, not the plays. The plays' records are not shown play by play.
      The one committed opening: the drive's review shows what was assumed and on what basis (G8).
    committed_source: >
      main:docs/adr/032-drive-review-of-outcomes.md section 2 and Alternatives (a viewer per play,
      lost); main:docs/philosophy/idsd.md; main:.garura/project/issues/617/specs/review-tool.md
      section 3 ('the plays are never shown'); main:docs/adr/034-plays-answer-from-memory-inside-a-drive.md section 4.
    violation: >
      Unchanged. Agent decisions are grouped under the play that made them and counted 'by N plays'.
      Showing a decision with its basis conforms (ADR 034 section 4); grouping the screen by play does
      not, and ADR 037 section 3 says 'every decision an agent made, with its trace' with no grouping.
    backed_by_owner_decision: >
      Partly. The owner asked for agent decisions and their traces; nothing quoted asks for grouping by play.
    recommendation: >
      Group by what the decision belongs to (the issue, the capability it served), or record the
      exception to ADR 032 section 2 through /adr and say the trace is shown to check the basis, not
      to review the play.

  - id: TDD-6
    carried_from_round_1: true
    file: ".garura/project/issues/617/specs/review-tool.md; .garura/project/issues/617/specs/review-tool-mockup.html"
    lines: "review-tool.md 254-255, 290-291, 299-300; review-tool-mockup.html 1175 (Catch up hidden outside Memory), 1285-1290 (side-panel buttons for ADRs and decisions)"
    severity: P3
    principle: >
      Every memory review and ADR review happens in that section on the same Catch up cards: swipe
      right to accept, swipe left to leave for later; answers that take words are buttons. The /adr
      accept moves onto a card in that section (G5).
    committed_source: >
      main:docs/adr/036-approved-answer-lands-in-short-term-memory.md section 7 and Affects;
      main:.garura/project/issues/617/specs/review-tool.md section 4 item 6.
    violation: >
      Unchanged. The ADRs bullet gives an ADR 'Accept, or send back with a comment' and the mock hides
      the Catch up button for ADRs and Agent decisions, answering them from a side panel, while the
      kept sentence (299-300) still says every ADR review uses the cards. ADR 037 section 3 keeps
      main's cards rule 'where this ADR is silent', so the departure is not recorded anywhere.
    backed_by_owner_decision: "No."
    recommendation: >
      Say whether ADR cards exist in Catch up (swipe right accepts, swipe left leaves it, Send back a
      button with a comment) and show one in the mock, or record the departure through /adr.

  - id: TDD-7
    carried_from_round_1: true
    file: ".garura/project/issues/617/specs/review-tool.md; .garura/project/issues/617/specs/review-tool-mockup.html"
    lines: "review-tool.md 256-266 (the Memory bullet, Ask memory); review-tool-mockup.html 1124, 1207 (one canned answer for any question)"
    severity: P3
    principle: >
      An answer comes from memory, never from the model alone; when no tier answers, the route is a
      memory update a person approves. The memory tool returns lines, tier, file and a fingerprint
      (G10). The review tool never calls Garura (G3).
    committed_source: >
      main:docs/adr/035-agents-work-only-from-memory.md sections 4 and 5;
      main:docs/adr/034-plays-answer-from-memory-inside-a-drive.md section 3;
      main:core/tools/memory/contract/v3.json; main:.garura/project/issues/617/specs/review-tool.md sections 1 and 2.
    violation: >
      Unchanged. ADR 037 section 4 now covers the box and 'mocked only'. Still not said: who reads the
      lines and composes the plain-words answer (the owner says the interface is 'nlp'), and on which
      side of the line; what the box shows when no tier answers (the committed route is a memory
      update, never an answer from the model); and how a question reaches the memory tool and back
      while a person waits, when the tool never calls Garura. The mock shows only the success case.
    backed_by_owner_decision: >
      Yes for the box and for mocking it only. Not stated: the composer, the no-answer path, the route.
    recommendation: >
      Three sentences: who writes the answer from the lines; that a question no tier answers shows
      'memory does not hold this' and offers a memory update; how the question travels (an event the
      listener answers by a reply).

  - id: TDD-8
    carried_from_round_1: true
    file: ".garura/project/issues/617/specs/review-tool.md"
    lines: "486-497 (story 9 and the sentence after it)"
    severity: P3
    principle: >
      Stories that touch only the tool and stories that touch only Garura are the extraction line;
      Garura builds the pack and the tool renders it (G13).
    committed_source: >
      main:.garura/project/issues/617/specs/review-tool.md section 7 (last paragraph) and section 3
      ('Garura builds the pack').
    violation: >
      Narrowed. The Garura half now owns the citations check turned into pack pieces (490-493). Still
      without an owner in either half: building the tier summaries (what each tier holds, counts,
      versions) into the pack; Ask memory's answer path; re-running a decision on a send-back. The
      /adr accept is listed as Garura's, while who writes the approval on an ADR card is open in ADR
      036 and ADR 037. So 'touch only Garura' cannot be tested for these.
    backed_by_owner_decision: "No."
    recommendation: >
      List the three in the Garura half and say the tool half renders pieces and records events for
      them without knowing what a tier or a citation is.

  - id: TDD-10
    carried_from_round_1: true
    file: ".garura/project/issues/617/specs/review-tool-mockup.html"
    lines: "1125-1128 (the three waiting updates carry no sources), 1278 (the update card), 1318 (the Catch up card)"
    severity: P3
    principle: >
      Nothing from the web or the model is used until a person approves it, so the card must show where
      the draft came from (marked) and its sources (G12).
    committed_source: >
      main:docs/adr/035-agents-work-only-from-memory.md section 5;
      main:core/tools/memory/contract/v3.json (propose: sources is required, with draft_source);
      main:.garura/project/issues/617/specs/review-tool.md section 4 item 7.
    violation: >
      Unchanged. The update card and its Catch up card show a 'Drafted from the web' or 'Drafted by the
      model' chip, the draft and the reason, but no sources. A person asked to approve a web or model
      draft sees nothing behind it, which is what ADR 035 section 5's safeguard depends on.
    backed_by_owner_decision: "No."
    recommendation: >
      Add a Sources line to both cards and give each sample update some ('none given' shown plainly
      for a person or model draft).

  - id: TDD-11
    carried_from_round_1: true
    file: ".garura/project/issues/617/specs/review-tool.md; .garura/project/issues/617/specs/review-tool-mockup.html"
    lines: "review-tool.md 256-262 ('no index (vectorless, ADR 035 section 4)' and the owner's quote about 'the tool'), 267-268 ('trace'); review-tool-mockup.html 1105"
    severity: P4
    principle: >
      One term per meaning (G14). Naming clarity.
    committed_source: >
      main:core/components/memory/knowledge/domains/.pageindex/pageindex.py (docstring 'Vectorless RAG',
      a tree the model navigates, i.e. an index); main:docs/adr/035-agents-work-only-from-memory.md
      section 4 and Alternatives (an index set aside; the word 'vectorless' is not in it);
      main:core/grounding/glossary.md line 43 and main:docs/adr/035-agents-work-only-from-memory.md section 9.
    violation: >
      Unchanged. (a) 'vectorless' is cited to ADR 035 section 4, which does not carry the word, and on
      main the word names an indexed method. (b) 'the tool' in the owner's quote stands for three tools
      beside 'the same memory tool under both'. (c) 'trace' now means the memory tool's ordered steps;
      the glossary's 'Resolution trace' is the R1 to R4 file and there is no entry for the new meaning.
      ADR 037 section 4 uses 'vectorless' as well and lists the glossary row as not decided, so (c) is
      a known open point.
    backed_by_owner_decision: >
      Partly. The owner chose the words; only a pointer or a definition is missing.
    recommendation: >
      Say 'no index' (or define vectorless in a clause); name the tool in each sentence; add the
      glossary line when the resolution rule is rewritten (#663).

  - id: TDD-12
    carried_from_round_1: true
    file: ".garura/project/issues/617/specs/review-tool.md; .garura/project/issues/617/specs/review-tool-mockup.html"
    lines: "review-tool.md 256-257 (the Memory bullet) against 297-299 (the kept paragraph); review-tool-mockup.html 1115-1119 (the three tier cards; the Phoenix card carries 'approved version 4f1c2e9a7b3d')"
    severity: P4
    principle: >
      The memory section shows short-term, Garura and Phoenix memory (G4).
    committed_source: >
      main:docs/adr/036-approved-answer-lands-in-short-term-memory.md section 7;
      main:docs/adr/035-agents-work-only-from-memory.md section 7.
    violation: >
      Unchanged, and now inside one file as well. The Memory bullet names Garura memory and an issue's
      short-term memory; the kept paragraph says the section shows short-term, Garura and Phoenix
      memory; the mock shows the Phoenix tier with a version code in view. ADR 037 lists 'whether the
      Memory section lists Phoenix memory' as not decided, so the departure is open, not covered.
    backed_by_owner_decision: >
      The owner's quoted words list only Garura memory and short-term memory; the mock has no backing.
    recommendation: >
      Say whether Phoenix memory is shown (a count and its approved version, or only through Ask
