  - id: TDD-13
    carried_from_round_1: true
    file: ".garura/project/issues/617/specs/review-tool.md; .garura/project/issues/617/specs/review-tool-mockup.html"
    lines: "review-tool.md 267 ('every decision an agent made'); review-tool-mockup.html 1231-1247 (the screen and its headline 'for issue #613'); the issue picker exists only in the Memory overview"
    severity: P4
    principle: >
      Short-term memory is the current issue only and a decision record is kept in its issue's
      short-term memory. A drive's review is the whole-model view narrowed to what the drive changed.
    committed_source: >
      main:docs/adr/036-approved-answer-lands-in-short-term-memory.md section 1;
      main:core/tools/memory/contract/v3.json (short_term_is_this_issue);
      main:docs/adr/033-approval-in-the-product-model.md section 7.
    violation: >
      Unchanged. The doc says every decision an agent made without saying whose: one picked issue's,
      one drive's, or every issue's. The Agent decisions screen has no picker and its headline names
      one issue.
    backed_by_owner_decision: "No."
    recommendation: >
      Say the list is the picked issue's (or the drive's) decisions and add the picker to the screen.

