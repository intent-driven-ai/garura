findings:
  - id: R2-1
    severity: P4
    file: core/components/memory/standards/rules/resolution.md
    line: "106-110 and 132-133, against 137-154 (Context Isolation Exemptions, Backward Compatibility)"
    what: >
      Two edges are left from round 1's DR-1. (1) The Scope paragraph says the section 'binds every agent decision' and in the
      same paragraph that whether the evals-engineer and the judge keep a decision trace 'is settled when the agents move onto
      the memory tool'. For those two agents the rule says nothing an agent can act on, and the exemption (INV4) is still worded
      only in terms of ltm_context, which ADR 035 section 9 retires. No committed record answers it: ADR 035 and ADR 036 on
      main do not mention the exemption, and ADR 037 does not either. (2) The Scope paragraph says Backward Compatibility
      governs an agent that has not moved, but the closing sentence (lines 132-133) names only R1-R4 and the Resolution Trace
      Output as giving way. Backward Compatibility ('No trace is produced') and Staleness Handling are not named, so once an
      agent has moved the file still says no trace is produced without ltm_context, a few lines from a section that says every
      agent keeps one.
    principle: G6, G1
    basis: >
      G6: a rule file says to whom and when it binds and does not contradict itself; the base file states INV3 and INV4 in
      terms of ltm_context. G1 and ADR 035 section 5 ('This holds for every agent and skill') carry no exemption for the two
      agents; ADR 035 section 9 retires ltm_context without naming what replaces the exemption. Classed P4: the text says in
      so many words that the question is open, ADR 035's Negative / Risks accepts the side-by-side period, and no agent
      reads the section yet.
    fix: >
      Add Backward Compatibility (and say whether Staleness Handling stays) to the sentence that says what gives way. For the
      isolated agents, either decide now (a decision that rests on no memory has an empty trace by design; or the exemption
      stands in terms that do not need ltm_context) or name the question in one line with an owner, as ADR 035's 'Not decided
      here' list does, so it is carried to the agents' move.

  - id: R2-2
    severity: P4
    file: core/components/memory/standards/rules/resolution.md
    line: "104-135 (the term 'decision trace'), against the glossary row for 'Resolution trace'"
    what: >
      The section names its object a 'decision trace'. The glossary on main already defines 'Resolution trace' as 'A per-decision
      trace written by agents ... when following the R1-R4 protocol'. The two are told apart only inside this file, by the
      sentence that says one gives way to the other. The glossary gets no row, and ADR 037 lists the glossary row as not
      decided. A person or agent who looks up 'decision trace' in the glossary finds the old trace's definition. Phoenix memory
      has no glossary, so in the shared tier the file is the only place the two are separated.
    principle: G5
    basis: >
      G5: one name carries one meaning and names are chosen so they are never confused (ADR 035 section 1; glossary line 43 on
      main; pr.md puts naming in P3). Classed P4, below round 1's P3 for the same theme: the collision with 'decision
      record' is gone, the rule itself separates the two traces in words, and the glossary gap is disclosed by the ADR.
    fix: >
      When the glossary is next edited for the agents' move, add one row for 'decision trace' next to 'Resolution trace' with
      'gives way to' in both. Until then, one clause in the section's first paragraph naming the old trace ('not the Resolution
      Trace Output above') is enough.

  - id: R2-3
    severity: P4
    file: core/components/memory/standards/rules/_index.md
    line: "25 (row for resolution.md)"
    what: >
      The row ends 'the decision trace every agent keeps (ADR 035 section 6, ADR 037)'. The section and the file's opening both
      carry a condition ('once it works through the memory tool'); the row, which is how an agent or person finds the rule and
      is promoted to Phoenix memory with it, states it as a present fact. ADR 037's own Negative / Risks says no agent keeps a
      trace yet. Read through the index, every agent already does.
    principle: G7, G6
    basis: >
      G7: the index row states what the file holds and who consumes it (main:_index.md header). G6: a rule says when it binds.
      ADR 035 Negative / Risks on main: until each agent moves, old and new sit side by side. Classed P4: one clause, and the
      detail is one click away in the section.
    fix: >
      End the row with 'the decision trace every agent keeps once it works through the memory tool (ADR 035 section 6, ADR
      037)'. The same row is edited in Phoenix memory's copy at landing, which equals main's (blob 8c4c6da3).

  - id: R2-4
    severity: P4
    file: core/components/memory/standards/rules/resolution.md
    line: "112-118 (a step names a tier) and 122-124 (makes no decision that no tier supports)"
    what: >
      The rule allows a decision only if a tier supports it and has each step name 'a tier'. ADR 035 section 1 says agents also
      read the project's git repository, and ADR 035 section 9 gives ADR 034 section 2 the same list (the three tiers, with the
      git repository, the product model and the intents). A decision that rests on the repository (code in a diff, a file
      in the working tree) has no tier to name, and under the second duty it would need a memory update before the agent could
      make it. The rule follows ADR 035 section 6 word for word ('the tier, the file and the lines'), so the gap is in the
      ADR; ADR 037 repeats 'a tier'. It will show when the build and review agents move onto the tool.
    principle: G9, G1
    basis: >
      G9: ADR 035 section 1 (line 42) and section 9 on main list the repository, the product model and the intents beside the
      tiers. G1: every decision names its memory, the tier, the file and the lines. Classed P4: the rule is no stricter than
      its source ADR, nothing runs against it yet, and the product model and the intents sit inside Garura memory per ADR 035
      section 1, so only the repository is open.
    fix: >
      Raise it with the ADR's owner as one more question for the agents' move, and carry it in the section as the isolated
      agents are in R2-1: say what a step names when its source is the repository, or that a decision resting only on the
      repository needs no trace.

conformance_checks_passed:
