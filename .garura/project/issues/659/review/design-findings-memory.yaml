    principle: G1
    result: "'short-term, Garura or Phoenix memory' (line 113); no 'project memory' or 'LTM' inside the new section. The index row and the older text keep 'LTM' as they did on main."
  - check: "A memory update a person approved is a source of a step, by its written file"
    principle: G3
    result: "Lines 117-118 match ADR 035 section 5 and ADR 036 section 2 (the approved answer is written to the issue's short-term memory; the work decides from it)."
  - check: "No decision from the model or the web; a memory update instead"
    principle: G3
    result: "Lines 123-124 and the note under R4 (lines 77-79) match ADR 035 section 5 and section 9. The model may still help draft the update, which the rule does not forbid."
  - check: "Where the record is kept"
    principle: G1
    result: "'the issue's short-term memory' (line 125) matches ADR 036 section 1 (short-term memory is the current issue only)."
  - check: "A decision with no source is not allowed, and the check's limit is stated"
    principle: G2
    result: "Lines 122 and 128-130 carry ADR 034 section 4 into a duty and say what the check cannot see."
  - check: "The rule points at the contract for the shape instead of copying it"
    principle: G7
    result: "Line 129-130 and the Related line; no contract version is named."
  - check: "Cross-references resolve"
    principle: G7
    result: "'Every Decision Names Its Memory' (R4 note) is the new heading; 'Context Isolation Exemptions', 'Backward Compatibility' and 'Resolution Trace Output' are headings in the same file; ADR 034 section 4, ADR 035 sections 5, 6 and 9, ADR 037 exist (037 is on the branch)."
  - check: "The existing rule text was left alone"
    principle: G6
    result: "resolution.md: +39 -1 in three hunks (opening clause, R4 note, new section). R1-R3, the trace block, the exemptions, Backward Compatibility and Staleness Handling are as on main. _index.md: one row, +1 -1."
  - check: "Phoenix reading: no person, client, organisation or home-folder reference, and no Garura-only path"
    principle: G8
    result: "Scanned the 40 added lines for issue numbers, '~/', '.garura', 'core/', 'docs/', '/Users', e-mail, URLs, file extensions, personal and company names and vault names. One hit: 'resolution.md' as the row key of the index row, which is unchanged from main. The only repo-local pointers are 'ADR 034 section 4', 'ADR 035 section 5/6/9' and 'ADR 037'. Round 1's '#663' is gone. The section names the tool's commands, never a memory path (ADR 035 section 4)."
  - check: "Promotion to Phoenix memory applies cleanly"
    principle: G8
    result: "Phoenix origin/main (5fcd88e) holds resolution.md at blob cabb15f0 and _index.md at blob 8c4c6da3, the same blobs as main, and the branch diff is generated against those blobs (index cabb15f0..31853a67 and 8c4c6da3..4882411c). The three hunks and the index row apply with no conflict, and Phoenix's pr.md equals main's."
  - check: "Sign-in example"
    principle: G1
    result: "main:standards/schemas/product-os/product-profile.yaml has shape.users, shape.surfaces, security.level and compliance, the values the example reads; the example is plain and generic."

grounding_limits:
  - "ADR 037 is branch content. It is named under departures_covered_by_adr_037 as the record the owner accepted, and nowhere used as the standard. The standard for each finding is main's ADR text, the glossary, the index and Phoenix's README."
  - "The only committed home of the shape's detail on main is plan item 6, a working note (one source per decision). The multi-step trace is grounded only in ADR 037 (branch); this review reports where it departs and does not rule on the ADR."
  - "Phoenix memory has no memory guide yet (ADR 035 section 8 is not built) and no glossary, so a project that reads the Phoenix copy of the rule finds `cite`, `citations` and 'the memory tool's contract' only through the tool that ships with its install. That is what ADR 035 sections 4 and 8 intend, and it is not a finding while the guide is unbuilt."
  - "No standards template for a rule file exists on main, so conformance to a rule-file shape was tested against neighbouring rules (a Related list, a consumers row in the index), not a template."
  - "The review/memory playbook is written for knowledge shelves; the rubric parts that apply to a rules file (fit, cross-references, duplicating or contradicting) were used, the shelf-template parts were not."

