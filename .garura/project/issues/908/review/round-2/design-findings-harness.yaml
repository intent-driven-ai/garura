grounding:
  # Every source below exists on the base ref or in memory; none is a file this diff adds or rewrites.
  # ADR 058 is added by this diff and is NOT used as grounding for any principle below.
  principles:
    - id: G1
      principle: "A change to what a part guarantees is made in the ICE; the compiled part records the ICE fingerprint so the two never drift."
      source: "docs/standards/harness-standard.md, principle 4 (lines 50-58), on plan/788/798-shape-eval"
    - id: G2
      principle: "Plays orchestrate, agents gather context, skills do the work; a JSON contract hands file paths, never data."
      source: "docs/standards/harness-standard.md, principle 2 (lines 33-40), on base"
    - id: G3
      principle: "Mechanical work is a script; a model is used only where judgment is needed."
      source: "docs/standards/harness-standard.md, principle 3 (lines 42-48), on base"
    - id: G4
      principle: "Agents work only from memory; every decision names its source."
      source: "docs/standards/harness-standard.md, principle 9 (lines 95-102), on base"
    - id: G5
      principle: "Installed parts name only installed files, never core/components, core/tools or Garura's docs; a note of origin is deleted."
      source: "docs/standards/harness-standard.md, principle 11 (lines 113-136), on base; CLAUDE.md 'Source of Truth' and 'Play Pipeline Rules' (no deviation notes or change logs in skill files)"
    - id: G6
      principle: "No builder, no skill that builds the software and no context sub-agent of a build reads a plan's evals folder."
      source: "docs/adr/049-a-slice-is-shaped-then-planned-then-given-its-eval.md lines 53 and 59 (base); docs/adr/057-... line 75 (base); CLAUDE.md 'Work Tracking' (base)"
    - id: G7
      principle: "A pinned checkpoint always fires; no config can turn it off."
      source: "memory standards/rules/gate-config.md lines 4-14 and 36 (copy: grounding-harness/standards/rules/gate-config.md, version 23387be24c0d)"
    - id: G8
      principle: "A human-facing prompt leads in product language; machine identifiers belong in an appendix; a checkpoint asks the person to approve a decision, not 'changes to X'."
      source: "memory standards/rules/user-facing-voice.md lines 25-28 and 37-44; CLAUDE.md section 5 (base)"
    - id: G9
      principle: "Constraints are business-language limits: never agent or skill names, never steps. Skill names belong in the Context part of the ICE."
      source: "memory standards/rules/builder-isolation.md lines 14-17"
    - id: G10
      principle: "Evidence is recorded by the play only, and it holds the full artifact set, the checkpoint decisions and the eval results of the run."
      source: "memory standards/rules/evidence-recording.md lines 27-29 (copy: grounding-harness/standards/rules/evidence-recording.md)"
    - id: G11
      principle: "Build the eval first: the check that proves a change is done exists and covers the change."
      source: "docs/standards/harness-standard.md, principle 5 (lines 60-66), on base"
    - id: G12
      principle: "Pre-existing ICE of the play: C14 (every page a person reads names no real person), F14, and SE-16 (the grep over the brief, the hidden file and the pages); C15/F15 (no working copy of the hidden file's lines outside the evals folder); Pre-flight row 'digits only' for the intent number."
      source: "git show plan/788/798-shape-eval:core/components/plays/shape-slice/reference/ice.md lines 83-84, 87-99, 165, 183-185; git show plan/788/798-shape-eval:core/components/plays/shape-slice/SKILL.md line 109 (pre-flight) and the SE-16 row"
  grounding_unavailable: []

