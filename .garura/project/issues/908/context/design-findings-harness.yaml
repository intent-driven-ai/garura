  - "Fingerprint: SKILL.md compile table reads sha256:3744213f036e0c0b6f557a15272b6be92f42f4ad5ab60cc828fd139127d2233c; shasum -a 256 of reference/ice.md is the same. The base fingerprint f1002e68... is the hash of the base ice.md. Basis G1."
  - "lint_play.py on shape-slice: VERDICT PASS, 0 gaps. lint-components (source layout): no violation in a changed path (36 errors elsewhere, there before)."
  - "Pinned checkpoint before any write: Step X3 is declared 'class: standard, pinned', frames the approval prompt, and Steps X4 and X6 run record_approval.py verify before the write and the commit; Step X1 and X2 write only to the working folder. Basis G7."
  - "Edit path keeps the play's guarantees: no write before yes (verify gate at X4 and X6, stop clears the hidden-file copy at X3); only the list changes (edit_slice.py check rebuilds the expected text of each record and refuses any other change; slice_check, scoped_write_guard and the hidden-file check run after); history line on the slice record on every edit and on the hidden file when it changes; hidden file preamble survives a later shaping run (write_hidden_file.parse keeps the preamble)."
  - "C7 and C20 agree: C7 says a shaping run never touches a slice in progress and only an approved edit (C20) does; F7 now reads 'a shaping run changed a slice in progress'; C20 says an edit may change one and the brief must say so; SKILL.md Forbidden, SE-10, Step X1, F7 row and the author-slice skill say the same. Basis G1."
  - "Installed paths: the three files name no core/components, core/tools or docs/ path; the memory tool is called as .garura/core/tools/memory/memory.py. Basis G5."
  - "No edit notes: the only issue numbers added are in the compile-metadata rows ('changed by edit-play (#842, #908)', compiled_by), which the compiler emits and the base already carried for #842. No change log or deviation note was added. Basis G5 and CLAUDE.md 'Play Pipeline Rules'."
  - "Agent gathers, skill does the work, script does mechanical work: the X2 contract names author-slice and passes its edit-list.json on as it is; lists, copies, applies, checks, restores and the brief are scripts (edit_slice.py, render_brief.py, record_questions.py); the X5 contract names no skill and calls the memory tool only, like the existing shape-slice-trace. SE-25 lists the new contract. Basis G2, G3, G4."
  - "Plain words and personas: author-slice edit mode demands plain words and personas (last line of the skill); --by takes the person's role, never a real name. Basis G8 (see finding F-07 for the brief's body)."
  - "Tests I ran read-only: test_edit_slice.py 29 passed, test_write_hidden_file.py 24 passed, test_render_brief.py 31 passed."

findings:
  - id: F-01
    title: "The edit brief can name no epic as out of date for a slice in progress, because nothing checks that the skill listed it"
    severity: P3
    where: "core/components/plays/shape-slice/SKILL.md lines 788-813 (Step X2, SE-26) and lines 814-826 (Step X3); core/components/plays/shape-slice/scripts/edit_slice.py lines 180-206 (list_problems); core/components/plays/shape-slice/scripts/render_brief.py lines 346-372 (render_edit)"
    basis: "ICE C20 last sentence (reference/ice.md line 149): for a slice in progress the brief names its epic, with its status, as out of date. SE-26 promises 'edit-list.json out_of_date names each of them'. Principle G3 (harness-standard.md lines 42-48): a fixed check is a script, not a model's good behaviour. Principle G1."
    problem: "The In progress section of the brief is built by the script from edit-before.json, so it always names the epic. But the sentence in that section says the started work 'is named below as out of date', and the list below it comes from out_of_date, which author-slice writes. check-list does not refuse an out_of_date that leaves the epic out. SE-26 states the rule but no script enforces it."
    leads_to: "The person can see 'its epic is past ready ... named below as out of date' above a list that says 'Nothing.'. They approve a change to a slice in progress without the brief naming the work that goes out of date, which is the thing C20 and F20 say the brief must do."
    fix: "Make the script do it, as the play does for the rest of the brief: have check-list refuse an out_of_date that lacks an epic from edit-before.json (or let render_edit add those epics itself, with their status). Then SE-26 can read the check result."

  - id: F-02
    title: "An edit run that closes HALTED at the first two steps leaves a working copy of the hidden file's Fails-if lines behind"
    severity: P3
    where: "core/components/plays/shape-slice/SKILL.md lines 783-786 (snapshot refusal, 'show its message and stop'), lines 806-808 (nothing editable, 'close HALTED'); compare line 843 (stop at X3 clears the copy)"
    basis: "Pre-existing ICE C15 and F15 (base reference/ice.md lines 98-99 and 183-185): no working copy of the hidden file's Fails-if lines or ids stays outside the evals folder. The author's own stop path at X3 clears the copy, which shows the intent. Principle G12."
    problem: "Step X1 copies the hidden file to edit-before/hidden.md. The only places that delete it are the X3 stop path and the hidden-file check at X4. When X2 finds the words ask for nothing an edit may change, the run closes HALTED with the copy still in the working folder. The snapshot-refused path also says only 'stop', with no HALTED close named. The working folder is under the issue's short-term memory and is picked up by the run records."
    leads_to: "A copy of the hidden file's failure lines sits outside the evals folder after a run that wrote nothing. The next person to open the issue folder, or the commit of run records, finds text the play promised not to leave there."
    fix: "At both HALTED exits, run the same clear the X3 stop path runs (write_hidden_file.py check with --clear-working on edit-before/hidden.md), and say 'close HALTED' for the snapshot refusal too."

  - id: F-03
    title: "One failure clause of F20 (a kept hidden-file entry changed with no approved edit) has no eval"
    severity: P3
    where: "core/components/plays/shape-slice/reference/ice.md lines 98 and 198-201 (C15 amended, F20 third clause); core/components/plays/shape-slice/SKILL.md lines 809-813 (SE-26) and 884-889 (SE-27), and SCE-11"
    basis: "Principle G11 (harness-standard.md lines 60-66): the check for a change exists and covers it. The play's own rule that every failure has an eval (lint_play 'failure coverage')."
    problem: "F20 says a kept entry of the hidden file must not change 'with no edit the person approved'. SE-26, SE-27 and SCE-11 all look at an edit run. SE-19 (the shaping run's hidden-file eval) checks entries and recoveries, not that a kept entry is byte for byte as before. lint_play passes because F20 is mapped to SE-26 and SE-27, but the shaping-run half of F20 is not measured. The same change removed --redraft, so a shaping run is now meant never to alter a kept entry, and nothing in the evals shows that it does not."
    leads_to: "A later change to write_hidden_file.py that rewrites a kept recovery would pass every eval of this play, and a person's approved edit would be lost on the next shaping run without a signal."
    fix: "Add to SE-19 (or SE-27) a before-and-after comparison: on a shaping run every entry that was kept reads byte for byte as in the start commit; on an edit run every entry not named by the list does. Or write it as its own eval for the F20 clause."

  - id: F-04
    title: "The skill is told to say what an eval scenario says, but it may read only the eval file names"
    severity: P3
    where: "core/components/skills/author-slice/SKILL.md line 35 (evals: 'names only; never read them'), lines 125-127 (out of date: 'an eval scenario that tests a who fixes line you changed') and lines 161-170 (example reason 'Its scenario for F1 says the builder fixes it'); core/components/plays/shape-slice/SKILL.md line 780 (ls of the evals folder)"
    basis: "Principle G4 (harness-standard.md lines 95-102): a decision names its source; an answer with no source cannot be checked. Principle G6 (ADR 049 lines 53 and 59; ADR 057 line 75): no skill reads the evals folder, so the file names are all the skill has. no-unbacked-recommendation rule (project memory 'never recommend when you do not know')."
    problem: "ADR 057 says an eval file is named by its feature id and covers that feature's failure conditions. From a file name the skill can know that a scenario file exists for a feature. It cannot know that the scenario 'says the builder fixes it'. The example teaches the skill to write that claim, and it is shown to the person as a fact in the brief. The out_of_date records are also never checked against the file list (edit_slice.py reads no out_of_date)."
    leads_to: "The brief can state something about an eval that is false, or name a file that does not exist, and the person cannot tell. The reason on that line has no source."
    fix: "Write the out_of_date reason from what is known: 'the eval for feature X may test this line; check it after the edit'. Have check-list refuse an out_of_date record that is not in edit-evals.txt or in the epics of edit-before.json."

  - id: F-05
    title: "The skill's own input table calls four inputs required, but the edit contract passes none of them"
    severity: P3
    where: "core/components/skills/author-slice/SKILL.md lines 22-27 (intent_page, gather, record, spine: 'yes'), lines 33-36 (request, before, evals, refused); core/components/plays/shape-slice/SKILL.md lines 790-796 (the shape-slice-edit contract)"
    basis: "Principle G2 (harness-standard.md lines 33-40): the contract between play, agent and skill is the paths it names, so the skill's input table must match the contract. Base author-slice input table marks required inputs per mode ('yes, to shape', 'for reuse')."
    problem: "In the table, intent_page, gather, record and spine are required with no mode qualifier. The edit contract gives request, before, evals and refused only. A model that reads its input table literally will stop for a missing required input or invent one. The description's 'Use when' sentence also does not name the edit list."
    leads_to: "An edit run can stall at X2, or the skill can look for inputs it was not given and fill them from memory, which breaks the rule that it reads only what its agent put in short-term memory."
    fix: "Qualify the four rows ('yes, except edit') and add 'or a slice edited' to the Use-when sentence of the description."

  - id: F-06
    title: "The agent's own definition and the play's agent table do not know the edit mode"
    severity: P3
    where: "core/components/agents/product-os-keeper.md lines 72, 90 and 129 (not in the diff; author-slice described as shape, reuse and fix); core/components/plays/shape-slice/SKILL.md line 102 (the Phases column lists Intent ... Brief, no Edit)"
    basis: "Review rubric for harness (playbook review/harness): keep the play-agent-skill-script wiring intact. Principle G2. The play now dispatches product-os-keeper to call author-slice in edit mode and to record the trace at X5."
    problem: "The agent reads its own file to learn what each skill does and what to hand it. That file still says reuse and fix modes only and that author-slice needs nothing beyond gather.json, the placement and the question record. The play's agent table row also leaves out the new Edit phase."
    leads_to: "The agent works from a stale description of the skill it is told to call; the wiring is right in the play and wrong in the agent, and the next person to edit one will not see the other."
    fix: "Add edit mode (inputs request, before, evals, refused; output edit-list.json) to the author-slice rows of product-os-keeper.md, and 'Edit' to the Phases cell of the play's agent table. The agent file is changed through its own build path, not by hand in this review."

  - id: F-07
    title: "The edit brief shows feature and line ids, so the person cannot tell which failure line they are approving"
    severity: P3
    where: "core/components/plays/shape-slice/scripts/render_brief.py lines 330-343 (part_words) and 346-372 (render_edit); the brief is the pinned checkpoint at core/components/plays/shape-slice/SKILL.md lines 814-826"
    basis: "Principle G8: user-facing-voice.md lines 25-28 and 43-44 and CLAUDE.md section 5 (base): a checkpoint asks the person to approve a decision they can follow, and machine identifiers go in an appendix. ICE C14 (base): no text a person cannot follow."
    problem: "The opening and the 'What you asked' quote are in plain words. The Changes list then reads 'hidden file, ft-pick, F1: who fixes' and 'model index, dom-x: the one-line'. The feature's name and the text of the failure line are not shown. The change's why field, which holds the plain reason, is not rendered either."
    leads_to: "The one gate that guards every write is a yes to a list the person cannot match to what they meant, so a wrong line can be approved by a plain yes."
    fix: "Show the feature's name and the Fails-if line next to the id (both are in the record copies the script already holds), and show the why. Keep the ids after the plain text."

  - id: F-08
    title: "The new constraint C20 names a skill and spells out steps"
    severity: P4
    where: "core/components/plays/shape-slice/reference/ice.md lines 138-153 (C20: 'author-slice (edit mode)', 'a check compares each record before and after')"
    basis: "Principle G9: builder-isolation.md lines 14-17: constraints are business-language limits, never agent or skill names, never steps."
    problem: "C20 reads as a procedure. The same style is already in the base ICE (C17 and C19 name skills), so this follows the play's own habit and is not new drift, but it widens a rule the standard says is closed."
    leads_to: "A reader of the ICE cannot separate what is guaranteed (only the listed changes, after a yes, with a history line) from how the play does it; renaming a skill later becomes an intent change."
    fix: "Keep the guarantee in C20 and move the skill name and the compare step to the Context part of the ICE. Do this when C17 and C19 are cleaned up, not alone."

  - id: F-09
    title: "A shaping run's checkpoint no longer has a way to redraft one recovery, and nothing tells the person to use --edit"
    severity: P4
    where: "core/components/plays/shape-slice/SKILL.md lines 523-529 (Step 8b, --redraft removed) and 695-718 (Step 11 change path); core/components/plays/shape-slice/reference/ice.md line 97-98 (C15)"
    basis: "ICE C15 as amended (a kept entry changes only through an approved edit) traces the removal, so the removal itself conforms (principle G1). The gap is that the person is not told where the old path went (principle G8, plain words at a checkpoint)."
    problem: "Before this change a person could type 'change:' at the shaping checkpoint and have a feature's recoveries drafted again. Now a kept entry is untouched by any shaping run. A person who types such a change gets a re-run that leaves it as it was, with no line in the brief saying 'use --edit for that'."
    leads_to: "The person's change is silently not made and they may think it was."
    fix: "Add one line to the shaping brief's Hidden file section: 'To change a kept recovery, run /shape-slice #<intent> --edit: <your words>'."

  - id: F-10
    title: "The decision that an edit may change a slice in progress has no decision record"
    severity: P4
    where: "core/components/plays/shape-slice/reference/ice.md lines 40-47 (C7) and 138-153 (C20)"
    basis: "ADR 024 section 2 ('the delivered epic is never touched', docs/adr/024-amendment-record.md lines 35-37, amended by ADR 048) and ADR 049: what ships is kept as it was; the edit leaves every epic as it is and only names it out of date, so it conforms. But the rule it reverses ('a slice in progress is never touched') lives in the ICE only; no ADR on the base records either side."
    problem: "A product-owner decision that reverses an earlier guarantee is recorded only in the play's ICE and in the issue text."
    leads_to: "A later reader of the ADRs sees no reason for the reversal; a review cannot ground it outside the branch."
    fix: "Record the decision in an ADR (or name the issue that holds the product owner's answer) and cite it from C20. Not a blocker for this change."

# No P1 or P2: no data-loss path (restore puts every record back until the hidden-file check passes), no write before the yes,
# and the intent and the compiled play agree. The category 'executable-code' and 'tests' are reviewed by their own dispatches.
