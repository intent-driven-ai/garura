# Layer 2 design-grounding for the 'harness' category of PR #911 (change #908, /shape-slice --edit).
# Base ref: plan/788/798-shape-eval. Read-only review; no file under review was changed.
category: harness
paths_reviewed:
  - core/components/plays/shape-slice/SKILL.md
  - core/components/plays/shape-slice/reference/ice.md
  - core/components/skills/author-slice/SKILL.md
grounding:
  # Every source below exists on the base ref or in memory; none is a file this diff adds or rewrites.
  principles:
    - id: G1
      principle: "A change to what a part guarantees is made in the ICE; the compiled part records the ICE fingerprint so the two never drift."
      source: "docs/standards/harness-standard.md, principle 4 (lines 50-58), on plan/788/798-shape-eval"
    - id: G2
      principle: "Plays orchestrate, agents gather context, skills do the work; JSON contracts hand file paths, never data."
      source: "docs/standards/harness-standard.md, principle 2 (lines 33-40), on base"
    - id: G3
      principle: "Mechanical work is a script; a model is used only where judgment is needed."
      source: "docs/standards/harness-standard.md, principle 3 (lines 42-48), on base"
    - id: G4
      principle: "Agents work only from memory; every decision names its source."
      source: "docs/standards/harness-standard.md, principle 9 (lines 95-102), on base"
    - id: G5
      principle: "Installed parts name only installed files, never core/components, core/tools or Garura's docs; a note of origin is deleted."
      source: "docs/standards/harness-standard.md, principle 11 (lines 113-136), on base; ADR 055 section 1"
    - id: G6
      principle: "No builder, no skill that builds the software and no context sub-agent reads a plan's evals folder."
      source: "docs/adr/049-a-slice-is-shaped-then-planned-then-given-its-eval.md lines 53 and 59 (base); docs/adr/057-a-slices-eval-is-plain-text-gherkin-that-runs-with-no-agent.md line 75 (base); CLAUDE.md lines 148-151 (base)"
    - id: G7
      principle: "A pinned checkpoint always fires; no config can turn it off; unpinning is an intent change."
      source: "memory standards/rules/gate-config.md lines 4-14 and 36 (copy: grounding-harness/standards/rules/gate-config.md)"
    - id: G8
      principle: "A human-facing prompt leads in product language; machine identifiers belong in an appendix. A checkpoint asks the person to approve a decision, not 'changes to X'."
      source: "memory standards/rules/user-facing-voice.md lines 25-28 and 43-44; CLAUDE.md section 5 (base)"
    - id: G9
      principle: "Intent holds goal, constraints (business-language limits) and failure conditions; constraints never hold agent or skill names or steps."
      source: "memory standards/rules/builder-isolation.md lines 14-17"
    - id: G10
      principle: "The hidden file is written by /shape-slice into the plan's evals folder, one entry for each feature, one recovery for each Fails-if line; the eval reads it later."
      source: "docs/adr/052-shape-slice-writes-the-hidden-file-and-proposes-a-thin-ice.md section 1 (lines 29-37, base); ADR 049 section 3 (lines 40-43, base)"
    - id: G11
      principle: "Build the eval first: the check that proves a change is done exists and covers the change."
      source: "docs/standards/harness-standard.md, principle 5 (lines 60-66), on base"
    - id: G12
      principle: "Pre-existing ICE of the play: a working copy of the hidden file's Fails-if lines or ids stays outside the evals folder only until the file reads ok (C15, F15)."
      source: "git show plan/788/798-shape-eval:core/components/plays/shape-slice/reference/ice.md lines 87-99 and 183-185"
  grounding_unavailable: []

