- id: DG-H1
  severity: P2
  category: harness
  file: core/components/drives/_shared/drive-run.md
  basis: ADR 039 §2 ('A drive follows the same rule'); glossary Drive ('Like any play, it reads no memory');
    drive-contract.md preamble on main ('A drive reads no memory').
  finding: 'Step R3 tells the drive to ''look in memory first, through the memory tool'' and to record
    answers whose source is `memory` with tier, path and trace. Kickoff C3 and Step 2 repeat it. Step
    R5b also has the drive mark memory updates approved or rejected through the memory tool. That makes
    the drive itself a memory reader and a memory writer. The committed design says the drive reads no
    memory; only its plays'' agents do, through the tool. The same branch''s drive-contract.md preamble
    (unchanged from main) and Kickoff''s own ICE Context cite ADR 039 for the opposite.

    '
- id: DG-H2
  severity: P2
  category: harness
  file: core/components/drives/_shared/drive-run.md
  basis: ADR 029 §2 ('A new question stops it ... the drive stops and asks'); ADR 034 §3 and §5 (the question
    stops the drive only when nothing supports an answer); glossary Drive ('stops only to ask a question
    that comes up mid-run', 'No rules of its own'); drive-contract.md rule 5 on main ('still stops the
    play'); base plan item 3 ('anything that changes an earlier decision is an ADR').
  finding: 'The branch changes how a drive handles a question nothing supports. Instead of stopping, the
    play keeps going, saves its work with the gap marked open, and the drive loops all three plays again
    (rounds, a round limit, ''again / ask''), asking the person only after a round that answered nothing
    new. /intent''s F16 now makes ''stopped to ask'' a failure inside a drive, which reverses the base
    rule. The only recorded basis is dated quotes (Kapil, 2026-10-20) written into the branch''s own prose.
    No ADR on the branch (or on main) amends ADR 029 §2 or ADR 034; the base plan said such a change is
    an ADR. The drive also now carries a run loop and a round limit as rules of its own, against ''no
    rules of its own''. ADR 034 itself names the risk this raises: later plays build on an assumption
    the person has not seen.

    '
- id: DG-H3
  severity: P3
  category: harness
  file: core/components/plays/build-memory/SKILL.md
  basis: ADR 029 §4 ('Every play a drive runs can also be run by hand ... depends on no other play having
    run first'); ADR 029 §1 ('aim ... three plays', a trinity); glossary Drive ('Runs Atomic Plays, ideally
    three').
  finding: '/build-memory is user-invocable but hard-halts without a drive contract (''this play runs
    only inside a drive''), and the Next map says drive members are run ''never on their own''. It is
    a fourth play inside the Kickoff run (R5c, Step 6c), and drive-creator now builds this step into the
    fixed shape of every drive. That departs from the trinity aim and from ''plays stand on their own''
    with no ADR.

    '
- id: DG-H4
  severity: P3
  category: harness
  file: core/components/drives/kickoff/SKILL.md
  basis: 'ADR 032 §3 (''The pull request is not where the person reviews'') and its Negative consequence
    (''Until [the two tools] are built, Kickoff cannot close''); ADR 031 §5 (confirm or drop at the drive''s
    final review); ADR 029 §2 (no rules of its own); base plan on main, ''What this plan leaves out''
    (confirmed intents wait for #641-#650; until then the drive ends with the plays'' review records and
    a pull request).'
  finding: 'Kickoff adds Step 8: after the pull request is raised, the drive asks the person to type confirm
    or drop for each intent and records the words in confirmation.yaml, and Done means D6 requires it.
    The intents stay proposed, so a recorded ''drop'' changes nothing and the merge still lands the dropped
    intent. ADR 032 says Kickoff cannot close until the review tools exist, and the base plan deliberately
    left this out. ADR 035 §7 allows typed approval as a stand-in for memory and ADR approvals only, not
    for intents. The drive''s own Role says ''every rule about intents lives in the plays'', yet the drive
    owns this intent step. The stand-in is labelled and the drive never changes an intent''s state, so
    it does not breach ADR 031''s ''only a person confirms''; the gap is the missing decision record,
    and what a recorded ''drop'' does.

    '
- id: DG-H5
  severity: P3
  category: harness
  file: core/components/drives/_shared/drive-run.md
  basis: 'glossary Skill (''Invoked only by agents, never directly by humans or plays''), Agent (''Named
    {domain}-{role}''), Agent-first pattern (''unconditional''), High-Order Play (''NOT: a play that invokes
    domain agents directly''); CLAUDE.md Behavioral Rule 2.'
  finding: 'The checker (R6) is an unnamed sub-agent on a chosen model told to ''judge this drive''s result
    with the judge-drive-result skill'', or Codex reading SKILL.md. There is no agent definition that
    owns the check, so a skill is invoked without an agent in the middle, and the drive hands domain judgement
    to an anonymous sub-agent. ADR 029 §2 allows ''a different model, sub-agent, or coding agent'', so
    the checker is grounded; the missing piece is the agent that owns the skill, its contract and its
    failure protocol.

    '
- id: DG-H6
  severity: P3
  category: harness
  file: core/components/drives/kickoff/reference/ice.md
  basis: 'ADR 029 §6 (Kickoff''s goal has two outputs, a plan and its issues for the person; ''Done when:
    the person has approved the plan ... the plan and its issues exist and pass the plan check''); base
    plan on main, ''What this plan leaves out'' (waiting on Kapil).'
  finding: 'The Kickoff goal and Done means (D1-D7) say nothing about the person''s plan and issues or
    about approve-change. The base plan records that omission as an open item, but the ICE and the SKILL
    describe Kickoff as complete without naming it, so a reader of the ICE would think ADR 029 §6 is met.

    '
- id: DG-H7
  severity: P4
  category: harness
  file: core/components/drives/_shared/drive-run.md
  basis: 'CLAUDE.md ''Play Pipeline Rules'' on main: ''Claude reads the whole file on every run, and nothing
    reads edit history there. Add no deviation notes or change logs to skill files.'''
  finding: 'Run history and dated quotes sit inside files read on every run: drive-run.md (''#613''s third
    Kickoff run lost /intent''s walk that way''; ''Kapil, 2026-10-20''), play-close.md (''the #662 run
    closed all three Kickoff plays that way''), answer-from-source (''#613''s audit found 39 of 82 ...'';
    ''a question claimed ...''), and drive-contract.md rule 5. They explain why a rule exists, not what
    to do, and are the kind of history the rule keeps out. (The ICE source and ADRs may carry such provenance;
    these are not ICE sources.)

    '
- id: DG-H8
  severity: P4
  category: harness
  file: core/components/agents/prototype-walker.md
  basis: 'ADR 004 (''{domain}-{role}'' naming; one agent = one domain); the agent''s own frontmatter (domain:
    business-intent, role: walker).'
  finding: 'The file''s own frontmatter gives domain `business-intent` and role `walker`, but the name
    is `prototype-walker`, not `business-intent-walker`. business-intent-keeper and memory-builder follow
    the pattern. Several existing agents do not (change-reviewer, scriber), so this is a nit.

    '
- id: MEM-1
  severity: P2
  category: memory
  file: core/components/memory/standards/rules/drive-contract.md
  basis: P-A / P-B
  finding: 'Rule 5 changes a decision two accepted ADRs made. The base rule says a question nothing in
    memory answers "stops the play ... (ADR 029: a new question stops the drive)". The branch says the
    question does not stop the play: the play finishes what it can, writes open-<play>.json, closes; the
    drive loops for further rounds and asks the person only at the end, all questions at once. That is
    a new run shape (rounds, deferred batch asking, play closes with a gap) and it moves when the drive
    stops from "mid-run, on the question" to "after every play has had a round". ADR 029 §2 and ADR 034
    §3 still say the question stops the drive; the glossary Drive entry on main still says it "stops only
    to ask a question that comes up mid-run". The only basis offered is a dated quote ("Kapil, 2026-10-20").
    No ADR in this diff amends ADR 029 §2 / ADR 034 §3, although ADR 034 shows the repo''s convention:
    change this rule through an ADR that names the sections it amends and lists the carriers (rule, index
    row, glossary, plays'' ICE).

    '
- id: MEM-2
  severity: P3
  category: memory
  file: core/components/memory/standards/rules/drive-contract.md
  basis: P-A
  finding: 'The rewrite leaves stale text that now contradicts it. Rule 4 still says a pinned checkpoint
    with no answer "stops the play and asks, like any new question"; rule 5 now says a question does not
    stop the play. A reader cannot tell whether a pinned checkpoint stops the play or goes to open-<play>.json.
    The Related line still says "a new question stops the drive" (true only at the end of rounds now).
    Rule 1 lists what run.json holds and omits `round`, which check_drive_contract.py now writes. The
    JSON example block in ''What a contract holds'' also omits the two new fields (`round`, `plays`) that
    the table adds. ADR 029 says pinned gates always stop for a human, so the pinned case needs one explicit
    sentence.

    '
- id: MEM-3
  severity: P3
  category: memory
  file: core/components/memory/standards/rules/drive-contract.md
  basis: P-C
  finding: 'Conforms in intent (nothing rests on a draft before a person approves; a play never picks
    an answer), but the rule is silent on one thing ADR 035 §5 and ADR 036 §2 settle: the approved answer
    lands in the issue''s short-term memory and "the waiting work then decides from memory". The new rule
    has work proceed ''as proposed with the gap named'' and a later round ''fill what it can'', without
    saying that a round-2 fill must read the approved answer from short-term memory rather than from another
    play''s unapproved draft. Reading "what the other plays wrote" on round 2 could let one play''s proposed
    (unapproved) output become another''s grounding.

    '
- id: MEM-4
  severity: P3
  category: memory
  file: core/components/memory/standards/rules/run-status.md
  basis: P-B / P-G
  finding: 'Grounding is partly unavailable. No committed record on main decides that a drive writes a
    live status file at every step, nor that a separate Claude-Code-only plugin displays it; the only
    basis is "Kapil, 2026-10-20" inside the rule itself. ADR 029 §2 gives a drive no rules of its own,
    so a per-step status duty on the drive is a drive-level rule that needs a record to stand on. The
    rule''s second consumer ("a status plugin (later)") does not exist, so the rule is enforced today
    only by the drive''s own script (drive_status.py) with no validator named.

    '
- id: MEM-5
  severity: P4
  category: memory
  file: core/components/memory/standards/rules/run-status.md
  basis: P-E / P-H
  finding: 'Not a violation of ADR 021''s storage rules (the file sits in a gitignored status/ folder,
    and the rule correctly cites ADR 021 for that). But ADR 021 defines status/ as the resume marker "read
    only by the same play ... nothing else consumes it". run-status.md puts a different thing in that
    folder, a progress display file read by an outside reader, and calls it ''status''. Two meanings of
    ''status'' in one folder; a reader of ADR 021 will assume run-<name>.json is a resume marker. The
    rule does not say it is not.

    '
- id: MEM-6
  severity: P4
  category: memory
  file: core/components/memory/standards/rules/drive-contract.md
  basis: P-F
  finding: 'Consistent with the base policy in substance (C1 per evidence.record, no C2, compact result).
    The trigger differs: on main a sub-play is identified by parent_run_id; a play inside a drive carries
    drive_run_id and no parent_run_id. The branch''s play-close.md adds the in_drive trigger, but evidence-recording.md
    (the policy rule, unchanged) still defines ''sub-play'' only by parent_run_id, so the two committed
    rules describe the in-drive close differently.

    '
- id: MEM-7
  severity: P4
  category: memory
  file: core/components/memory/standards/rules/_index.md
  basis: P-G
  finding: 'The index row is accurate and cross-references resolve (run-status.md exists; drive-contract.md
    and drive_status.py paths are real on the branch). Placement: the row joins ''Play lifecycle rules
    (auto-emitted by the play compiler)''. run-status is not emitted by the play compiler and is not about
    a play''s lifecycle; drive-contract already sat there for the same reason, so this extends an existing
    mismatch.

    '
- id: MEM-8
  severity: P4
  category: memory
  file: core/components/memory/standards/rules/pipeline-next.md
  basis: P-D / naming clarity
  finding: 'Conforms. kickoff -> shape matches the existing understand -> shape step and the ''why'' says
    the intent -> design drive replaces it (ADR 029 names that drive as the next hand-on). build-memory
    with a null next fits ''runs inside a drive''. drive-creator / drive-editor under meta_exempt matches
    play-creator / play-editor. Small doc drift: the file''s header still scopes the map to ''user-invocable
    compiled play'' and its ''Kickoff loop'' prose still reads ''/intent -> /vision -> /understand'',
    so a drive name now sits in a play-keyed map without the text saying so.

    '
