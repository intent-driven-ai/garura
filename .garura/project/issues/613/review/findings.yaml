- id: DG2-H9
  severity: P3
  category: harness
  file: core/components/plays/drive-creator/references/compiled-drive-example/SKILL.md
  basis: 'ADR 039 §2 and glossary Drive (origin/main): a drive reads no memory. ADR 029 §2 (drive loops
    its plays). The branch''s own drive-run.md R3/R5 are the target shape, but the claim rests on the
    base ADRs.'
  finding: 'The worked example that `/drive-creator` copies the shape of for every new drive still teaches
    the old reading. Its Step 2 says ''Run R3: ask ... memory first'' and its eval says an answer''s source
    is ''memory, or the person''s typed words''; its ICE goal says ''no stop except a question memory
    cannot answer'' and C2 says ''a question memory and the answers do not cover stops the drive and goes
