- id: DG2-H10
  severity: P3
  category: harness
  file: core/components/plays/understand/reference/ice.md
  basis: 'ADR 029 §2 / ADR 034 §3 (origin/main) as the branch now reads them through ADR 041 (the play
    records the question for the drive and finishes); CLAUDE.md Play Pipeline Rules: an intent must agree
    with itself and with its compiled SKILL.'
  finding: 'Round 2 changed /understand C13 and the SKILL Step 0a drive case so a capability with no answers
    becomes the drive''s question (`open-understand.json`) and the play finishes the other targets. Three
    other lines in the same ICE and SKILL still say the opposite: C1 (''With no answers in the contract,
    the play stops and asks the person before any model write''), the F1 failure''s recovery (''ask the
    person what the capability is ... record the answers before seeding'', in the SKILL table and as REC1
    in the ICE), and the SKILL''s Step 0a rule ''With no answer ... halt''. Read together, a drive run
    is told both to hand the question to the drive and to stop and ask. The fingerprint matches the ICE,
    so the compiled SKILL has not drifted; the ICE disagrees with itself.

    '
  status: open
- id: DG2-H11
  severity: P3
  category: harness
  file: core/grounding/glossary.md
  basis: 'pipeline-next.md on origin/main (commit-change -> propose-change -> review-change -> merge-change
    each have their own command; /start-change listed); the five change plays carry user-invocable: true
    on origin/main. ADR 029 §4.'
  finding: 'The glossary Drive entry now says ''Its member plays (the change plays and /build-memory)
    run only inside it'', and ADR 041 part 4 justifies /build-memory ''as the change plays a drive injects
    do''. On origin/main the change plays are user-invocable and are run by hand as their own commands,
    so they do not run only inside a drive. Only /build-memory does. The glossary is the project''s grounding
    vocabulary, so the slip would mislead later reviews and play-creator.

    '
  status: open
