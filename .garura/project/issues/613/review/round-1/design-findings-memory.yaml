# design-findings-memory.yaml — Layer 2 design-grounding, category "memory", PR #682 (#613), base: main
# Every principle below is cited to a source committed on the base ref (git show main:<path>).
# Nothing is grounded in the branch's own new text. Severity buckets from standards/rules/pr.md
# (P1-P4); no taxonomy row maps to design conformance, so the bucket is the reviewer's, stated as such.
category: memory
playbook: review/memory   # ~/.phoenix/core/memory/knowledge/review/memory.md
changed_artifacts:
  - core/components/memory/standards/rules/_index.md
  - core/components/memory/standards/rules/drive-contract.md
  - core/components/memory/standards/rules/pipeline-next.md
  - core/components/memory/standards/rules/run-status.md   # new
no_knowledge_shelf_changed: true   # no knowledge/** page, schema or template in this diff; _DESIGN.md/_TEMPLATE.md tests do not apply

principles:
  - id: P-A
    text: "A drive stops and asks when a question comes up mid-run that was not answered at the start; it never picks an answer. Inside a drive a play answers from memory, and the question stops the drive only when nothing in memory supports an answer."
    source: "main:docs/adr/029-drives.md §2 'A new question stops it'; main:docs/adr/034-plays-answer-from-memory-inside-a-drive.md §3 'Never from the model alone' ('That question stops the drive, as ADR 029 §2 says today')"
  - id: P-B
    text: "An accepted decision changes only through a decision record that names what it amends; ADR 034 is exactly such a record for ADR 029 §2 and lists drive-contract.md, the _index.md row and the glossary Drive entry as the carriers to update."
    source: "main:docs/adr/034-...md header ('Amends: ADR 029 §2', 'Affects: drive-contract.md rule 4 ... _index.md the drive contract's row ... glossary Drive entry'); main:docs/adr/035-agents-work-only-from-memory.md ('change only through a decision record'); main:docs/adr/029-drives.md header (amendment chain)"
  - id: P-C
    text: "No model or web answer is used until a person approves a memory update; the approved answer lands in the issue's short-term memory; the waiting work then decides from memory."
    source: "main:docs/adr/035-agents-work-only-from-memory.md §5; main:docs/adr/036-approved-answer-lands-in-short-term-memory.md §2; main:docs/adr/039-memory-writes-go-to-short-term-memory-plays-read-no-memory.md §1"
  - id: P-D
    text: "A drive has no rules of its own: its one rule is to run its plays; every other rule lives in the plays."
    source: "main:docs/adr/029-drives.md §2 'No rules of its own'"
  - id: P-E
    text: "A status/resume marker is a machine-local, gitignored resume marker written and read by the same play; nothing else consumes it. Evidence is the separate, durable record."
    source: "main:docs/adr/021-status-resume-vs-evidence.md Context and Decision §1"
  - id: P-F
    text: "A sub-play (carries parent_run_id) emits only C1 under the resolved evidence flag and skips C2; the parent's close absorbs the result."
    source: "main:core/components/memory/standards/rules/evidence-recording.md ('Sub-plays follow _shared/play-close.md ...'); main:core/components/plays/_shared/play-close.md 'Sub-plays'"
  - id: P-G
    text: "A rule file earns its place by answering 'how must this artifact/surface be structured', being enforced by at least one skill/validator/orchestrator, and being the single source of truth; the index lists it under the section that matches its kind."
    source: "main:core/components/memory/standards/rules/_index.md 'When to Add Here' and its section headings (section 'Play lifecycle rules (auto-emitted by the play compiler)')"
  - id: P-H
    text: "Naming clarity: one word, one meaning. 'status' in a play's status/ folder means the resume marker."
    source: "main:docs/adr/021-status-resume-vs-evidence.md; Garura CLAUDE.md / global challenge principle 5 (naming clarity)"

findings:
  - id: MEM-1
    severity: P2
    file: core/components/memory/standards/rules/drive-contract.md
    where: "'How a play runs inside a drive', rule 5 (rewritten), plus the new 'round' / 'open-<play>.json' mechanism"
    principle: P-A / P-B
    basis_sources:
      - "main:docs/adr/029-drives.md §2"
      - "main:docs/adr/034-plays-answer-from-memory-inside-a-drive.md §3 and header (Affects: drive-contract rule 4)"
    finding: >
      Rule 5 changes a decision two accepted ADRs made. The base rule says a question nothing in memory
      answers "stops the play ... (ADR 029: a new question stops the drive)". The branch says the question
      does not stop the play: the play finishes what it can, writes open-<play>.json, closes; the drive loops
      for further rounds and asks the person only at the end, all questions at once. That is a new run
      shape (rounds, deferred batch asking, play closes with a gap) and it moves when the drive stops from
      "mid-run, on the question" to "after every play has had a round". ADR 029 §2 and ADR 034 §3 still say
      the question stops the drive; the glossary Drive entry on main still says it "stops only to ask a
      question that comes up mid-run". The only basis offered is a dated quote ("Kapil, 2026-10-20"). No ADR
      in this diff amends ADR 029 §2 / ADR 034 §3, although ADR 034 shows the repo's convention: change this
      rule through an ADR that names the sections it amends and lists the carriers (rule, index row,
      glossary, plays' ICE).
    suggested_fix: "Record the rounds-and-batched-asking decision as an ADR amending ADR 029 §2 / ADR 034 §3 (or confirm it is already recorded elsewhere on main and cite it), then align the glossary Drive row. Until then the rule's authority is a chat quote, not a committed decision."

  - id: MEM-2
    severity: P3
    file: core/components/memory/standards/rules/drive-contract.md
    where: "rule 4 (unchanged text) vs rule 5 (changed); rule 1 (unchanged run.json field list); Related line (unchanged)"
    principle: P-A
    basis_sources:
      - "main:docs/adr/029-drives.md §2 and 'Negative / Risks — Pinned gates'"
      - "main:core/components/memory/standards/rules/drive-contract.md (rule 4 on base)"
    finding: >
      The rewrite leaves stale text that now contradicts it. Rule 4 still says a pinned checkpoint with no
      answer "stops the play and asks, like any new question"; rule 5 now says a question does not stop the
      play. A reader cannot tell whether a pinned checkpoint stops the play or goes to open-<play>.json.
      The Related line still says "a new question stops the drive" (true only at the end of rounds now).
      Rule 1 lists what run.json holds and omits `round`, which check_drive_contract.py now writes. The
      JSON example block in 'What a contract holds' also omits the two new fields (`round`, `plays`) that
      the table adds. ADR 029 says pinned gates always stop for a human, so the pinned case needs one
      explicit sentence.
    suggested_fix: "Reword rule 4's pinned-checkpoint clause to say explicitly whether it stops the play or the drive; update the Related line, rule 1's field list and the JSON example."

  - id: MEM-3
    severity: P3
    file: core/components/memory/standards/rules/drive-contract.md
    where: "rule 5 ('what no tier answers and research can, is drafted as a memory update ...') and the new open-<play>.json hand-off"
    principle: P-C
    basis_sources:
      - "main:docs/adr/035-agents-work-only-from-memory.md §5"
      - "main:docs/adr/036-approved-answer-lands-in-short-term-memory.md §2"
    finding: >
      Conforms in intent (nothing rests on a draft before a person approves; a play never picks an answer),
      but the rule is silent on one thing ADR 035 §5 and ADR 036 §2 settle: the approved answer lands in the
      issue's short-term memory and "the waiting work then decides from memory". The new rule has work
      proceed 'as proposed with the gap named' and a later round 'fill what it can', without saying that a
      round-2 fill must read the approved answer from short-term memory rather than from another play's
      unapproved draft. Reading "what the other plays wrote" on round 2 could let one play's proposed
      (unapproved) output become another's grounding.
    suggested_fix: "State that a later-round fill rests only on memory (including approved answers in STM), never on another play's still-proposed output."

  - id: MEM-4
    severity: P3
    file: core/components/memory/standards/rules/run-status.md
    where: "whole new file ('The run presents a status ... A display ... a plugin installed only when the install chooses Claude Code')"
    principle: P-B / P-G
    basis_sources:
      - "main:docs/adr/029-drives.md §2 'No rules of its own'"
      - "main:core/components/memory/standards/rules/_index.md 'When to Add Here'"
    finding: >
      Grounding is partly unavailable. No committed record on main decides that a drive writes a live status
      file at every step, nor that a separate Claude-Code-only plugin displays it; the only basis is
      "Kapil, 2026-10-20" inside the rule itself. ADR 029 §2 gives a drive no rules of its own, so a
      per-step status duty on the drive is a drive-level rule that needs a record to stand on. The rule's
      second consumer ("a status plugin (later)") does not exist, so the rule is enforced today only by the
      drive's own script (drive_status.py) with no validator named.
    suggested_fix: "Cite or add the decision (ADR, or a plan item on main) for the run-status file and the decoupled display; name the check that enforces the schema (lint_drive or the stop-condition)."

  - id: MEM-5
    severity: P4
    file: core/components/memory/standards/rules/run-status.md
    where: "'The file' - path status/run-<name>.json"
    principle: P-E / P-H
    basis_sources:
      - "main:docs/adr/021-status-resume-vs-evidence.md"
      - "main:core/components/memory/standards/rules/drive-contract.md rule 2 (status markers go to {stm_base}<issue>/status/)"
    finding: >
      Not a violation of ADR 021's storage rules (the file sits in a gitignored status/ folder, and the rule
      correctly cites ADR 021 for that). But ADR 021 defines status/ as the resume marker "read only by the
      same play ... nothing else consumes it". run-status.md puts a different thing in that folder, a
      progress display file read by an outside reader, and calls it 'status'. Two meanings of 'status' in one folder; a
      reader of ADR 021 will assume run-<name>.json is a resume marker. The rule does not say it is not.
    suggested_fix: "Add one line to run-status.md: this file is a progress display, not a resume marker (ADR 021), and nothing resumes from it."

  - id: MEM-6
    severity: P4
    file: core/components/memory/standards/rules/drive-contract.md
    where: "new rule 7 'Close as a sub-play'"
    principle: P-F
    basis_sources:
      - "main:core/components/memory/standards/rules/evidence-recording.md (sub-play = carries parent_run_id; emits C1 only, skips C2)"
      - "main:core/components/plays/_shared/play-close.md 'Sub-plays'"
    finding: >
      Consistent with the base policy in substance (C1 per evidence.record, no C2, compact result). The
      trigger differs: on main a sub-play is identified by parent_run_id; a play inside a drive carries
      drive_run_id and no parent_run_id. The branch's play-close.md adds the in_drive trigger, but
      evidence-recording.md (the policy rule, unchanged) still defines 'sub-play' only by parent_run_id, so
      the two committed rules describe the in-drive close differently.
    suggested_fix: "Name the in-drive case in evidence-recording.md's sub-play sentence, or have the drive contract also carry parent_run_id."

  - id: MEM-7
    severity: P4
    file: core/components/memory/standards/rules/_index.md
    where: "new run-status.md row; unchanged section heading it sits under"
    principle: P-G
    basis_sources:
      - "main:core/components/memory/standards/rules/_index.md (section headings, 'When to Add Here')"
    finding: >
      The index row is accurate and cross-references resolve (run-status.md exists; drive-contract.md and
      drive_status.py paths are real on the branch). Placement: the row joins 'Play lifecycle rules
      (auto-emitted by the play compiler)'. run-status is not emitted by the play compiler and is not about a
      play's lifecycle; drive-contract already sat there for the same reason, so this extends an existing
      mismatch.
    suggested_fix: "Optional: add a 'Drive rules' section for drive-contract.md and run-status.md."

  - id: MEM-8
    severity: P4
    file: core/components/memory/standards/rules/pipeline-next.md
    where: "new keys kickoff, build-memory; meta_exempt gains drive-creator, drive-editor; header and 'The flow' prose unchanged"
    principle: P-D / naming clarity
    basis_sources:
      - "main:core/components/memory/standards/rules/pipeline-next.md (header: 'Every user-invocable compiled play'; meta_exempt = creators/installers)"
      - "main:docs/adr/029-drives.md §1 and §Kickoff 'Hands on' (next drive is intent -> design)"
    finding: >
      Conforms. kickoff -> shape matches the existing understand -> shape step and the 'why' says the
      intent -> design drive replaces it (ADR 029 names that drive as the next hand-on). build-memory with a
      null next fits 'runs inside a drive'. drive-creator / drive-editor under meta_exempt matches
      play-creator / play-editor. Small doc drift: the file's header still scopes the map to
      'user-invocable compiled play' and its 'Kickoff loop' prose still reads '/intent -> /vision ->
      /understand', so a drive name now sits in a play-keyed map without the text saying so.
    suggested_fix: "Mention drives in the header sentence and the Kickoff-loop bullet."

summary:
  p1: 0
  p2: 1
  p3: 3
  p4: 4
  conformant_checks:
    - "ADR 021: run-status file sits under the gitignored status/ folder and cites ADR 021 (no storage violation)."
    - "ADR 039 §1/§2: open-<play>.json and run files go under the drive's issue; the rule keeps 'a drive reads no memory' intact."
    - "ADR 035 §5: rule 5 keeps 'never picks an answer for itself' and routes a gap to an approved memory update."
    - "_index.md cross-references: run-status.md, drive_status.py (drive-creator/references/), check_drive_contract.py (play-creator/references/) all exist on the branch."
    - "pipeline-next.md: the entries follow the file's own schema; the creators/editors exemption matches the base pattern."
  grounding_gaps:
    - "No ADR on main covers the rounds-and-batched-questions run shape (MEM-1) or the run-status file and display plugin (MEM-4); their only basis is a dated quote inside the rule. Branch work-records (plans, runner-design) were deliberately not used as grounding."
