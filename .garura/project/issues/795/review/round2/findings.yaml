# check-change Step 4 -- consolidated findings, PR #840.
findings:
- category: harness
  severity: P2
  path: core/components/plays/shape-slice/scripts/persist_slice.py
  basis: G1 C7 / S3 (a slice that already lists the intent is reused, no new slice)
  message: 'Reuse by ''lists the intent'' fails when the freshly shaped slice has other features or surface. find_serving_slice
    --reuse-into copies only id and slug, then persist_slice refuses with exit 2 (''give the new slice its own id''),
    which contradicts the reuse the previous step just chose. Reproduced: spine has sl-a [f1] on scr serving bi-1;
    shaped slice [f1,f2] on scr2 -> match sl-a, persist rc=2. A second run for an already-served intent hits this.
    Fix: when reusing, leave the existing slice as it is (or persist only the intent) and report it.'
  status: open
- category: harness
  severity: P2
  path: core/components/plays/shape-slice/scripts/persist_slice.py
  basis: G3 + G6 (slice.yaml v2 is the slice record's schema; decisions Q6)
  message: The record written to slices/<id>.yaml holds slice{id, slug, feature_refs, vertical, surface} only. slice.yaml
    v2 (changed in this PR) names name, outcome, intents, features[{feature_ref, ice_ref, delivery}], acceptance_intent,
    metadata and surface.id / user_action. The script and schema disagree, slice_check does not test the record
    against the schema, and a reused slice's record never gets the added intent although the schema says its `intents`
    equals the spine entry's. Make the writer produce the schema, or cut the schema to what is written.
  status: open
