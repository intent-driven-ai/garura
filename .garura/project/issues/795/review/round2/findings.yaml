    and its deferred bucket; shape-roadmap still writes order/depends_on/status on slices; shape-measure-lens still
    stamps slice status realized; build-epic's check_ready_epic.py still requires a slice 'realized' and an epic
    in the spine epics list that the old /shape-slice cut. After this change no play produces what /build-epic reads,
