# check-change -- category: harness -- PR #840 (issue 795). Grounded on plan/788/base + the approved ICE and decisions.md only.
category: harness
base: plan/788/base
principles:
  - {id: G1, source: "core/components/plays/shape-slice/reference/ice.md (approved before the build) C1-C14, F1-F14, S1-S6", principle: "The compiled play covers every constraint, failure condition and scenario."}
  - {id: G2, source: "plan/788/base:docs/adr/049", principle: "/shape-slice writes the slice and its link to the intent; no plan, epic, story or eval."}
  - {id: G3, source: "plan/788/base:core/components/memory/standards/schemas/product-os/ontology.md (v10 Slice, Q25-Q35)", principle: "Slice record and spine entry follow the ontology; the spine slice entry is id, slug, feature_refs, vertical, intents, record."}
  - {id: G4, source: "plan/788/base:core/components/memory/standards/rules/asking-a-person.md, user-questions.md, no-unbacked-recommendation.md", principle: "Questions all at once, four parts, recorded in STM, no answer proposed without a source."}
  - {id: G5, source: "plan/788/base:CLAUDE.md (Execution Model, Behavioral Rule 4)", principle: "Agents craft context; skills/scripts do the work; JSON contracts over files; typed checkpoints."}
  - {id: G6, source: ".garura/project/issues/795/context/decisions.md Q6", principle: "Dependents change in the same change: spine.yaml and slice.yaml follow the new slice."}
  - {id: G7, source: "plan/788/base:docs/adr/048 + 049 (known follow-ups #799/#801/#837)", principle: "Old-chain plays (build-epic, shape-scope, shape-roadmap, shape-measure-lens) are rebuilt in later stories."}
coverage:
  - "SKILL.md covers C1-C14 / F1-F14 / S1-S6 (SE-1..SE-17, SCE-1..SCE-6, 14 recovery rows); flow is scripts plus JSON-contract agent steps; checkpoint is typed yes/change/stop and pinned; stop restores an empty allow set; the write set is C9's; the cardinal rule is a script (record_questions proposals) plus SE-3; lint-components reports no violation on shape-slice."
  - "/next removal: no live reference to plays/next, rank-actions, author-epics, check-cut-tensions or the work-intelligence shelf remains in core/ or docs/ outside ADRs and the decision record; the Next-line map, play-close and the closes are coherent."
findings:
  - {category: harness, severity: P2, path: core/components/plays/shape-slice/scripts/persist_slice.py, basis: "G1 C7 / S3 (a slice that already lists the intent is reused, no new slice)", message: "Reuse by 'lists the intent' fails when the freshly shaped slice has other features or surface. find_serving_slice --reuse-into copies only id and slug, then persist_slice refuses with exit 2 ('give the new slice its own id'), which contradicts the reuse the previous step just chose. Reproduced: spine has sl-a [f1] on scr serving bi-1; shaped slice [f1,f2] on scr2 -> match sl-a, persist rc=2. A second run for an already-served intent hits this. Fix: when reusing, leave the existing slice as it is (or persist only the intent) and report it.", status: open}
  - {category: harness, severity: P2, path: core/components/plays/shape-slice/scripts/persist_slice.py, basis: "G3 + G6 (slice.yaml v2 is the slice record's schema; decisions Q6)", message: "The record written to slices/<id>.yaml holds slice{id, slug, feature_refs, vertical, surface} only. slice.yaml v2 (changed in this PR) names name, outcome, intents, features[{feature_ref, ice_ref, delivery}], acceptance_intent, metadata and surface.id / user_action. The script and schema disagree, slice_check does not test the record against the schema, and a reused slice's record never gets the added intent although the schema says its `intents` equals the spine entry's. Make the writer produce the schema, or cut the schema to what is written.", status: open}
  - {category: harness, severity: P2, path: core/components/plays/shape-scope/SKILL.md, basis: "G6, G2 (spine.yaml in this PR: /shape-scope 'does NOT write slices (/shape-slice does)'; slice fields status, order, effort, depends_on, domain_ref are gone)", message: "Dependents were not changed with the schema. shape-scope still composes slices and records under <domain>/slices/ and its deferred bucket; shape-roadmap still writes order/depends_on/status on slices; shape-measure-lens still stamps slice status realized; build-epic's check_ready_epic.py still requires a slice 'realized' and an epic in the spine epics list that the old /shape-slice cut. After this change no play produces what /build-epic reads, and the schema now contradicts three live plays. If this is the intended gap (#799/#801/#837), say so in the PR and file the follow-ups; today the break is silent.", status: open}
  - {category: harness, severity: P3, path: core/components/plays/shape-slice/SKILL.md, basis: "G4 / user-questions.md (ID is unique and the same in every run; an answer is a fact)", message: "record_questions filter drops a question when its id is answered in the record, by id only. The agent writes new ids (Q-<topic>-<n>) every run, so a later run in the same issue can reuse Q-scope-1 for a different question and have it silently dropped as answered (or the 'add' step keeps the old entry). Match on id and question text, or have the agent reuse ids from the record.", status: open}
  - {category: harness, severity: P3, path: core/components/plays/shape-slice/SKILL.md, basis: "G1 C12 / F12 (nothing committed before the person's yes; a stop undoes every write)", message: "Step 11 'change': the restore keeps the intent page whole, including the Touches lines persist_fills added ('adds' links to capability pages the restore just deleted). A changed answer that drops a capability leaves a stale link on the intent page, and lint_grounding then reports a broken link on re-check. Restore the Touches list too (keep only the page this run wrote, not later edits). Step 12 also has no script gate: the commit is by prose only; add a check that approval.json reads yes before git commit.", status: open}
  - {category: harness, severity: P3, path: core/components/plays/shape-slice/scripts/record_questions.py, basis: "G4 / asking-a-person.md (opening, one thing per question, stand alone) and SE-7 'each answer typed is on its entry'", message: "`check` exits 0 when asked questions are unanswered (it lists them in 'unanswered' but ok stays true), so SE-7 and the 'blocking question left unanswered keeps the run here' rule rest on prose. `answer` also sets user_decision 'in_scope' by default when none is given, so an empty answer counts as answered and the question is never asked again. The shape check is a heuristic (' and ' / one '?') and does not test the opening. Make an unanswered blocking question fail `check`, and refuse an answer with no text.", status: open}
  - {category: harness, severity: P3, path: core/components/plays/shape-slice/SKILL.md, basis: "plan/788/base:.claude/rules/garura-memory.md (find memory only through the memory tool; every decision keeps its trace with `cite`)", message: "The play reads memory through the agent, but no step runs `memory.py search/read` for the Garura/Phoenix tiers beyond loading asking-a-person.md, and no step runs `memory.py cite` for the decisions (proposed answers, the slice choice). gather.json names lines read, but the trace the memory rule requires is never recorded or checked (`citations --check`). Wire cite, or state why the model-only trace is enough.", status: open}
  - {category: harness, severity: P3, path: core/components/plays/shape-slice/SKILL.md, basis: "G5 (agent crafts context; skills do the work) and the play's own claim 'skills it uses all exist; none created'", message: "Choosing the slice's features, order, surface and tester has no skill: the agent decides it itself (documented, agent principle P7), and it is the most important step of the play. The play does not create `author-slice`, only names it as a follow-up; no follow-up task is referenced. Also 'utility_agents: 0' while Step 11 uses template-manager for the approval prompt and the close. Acceptable as a recorded gap, but file the author-slice issue.", status: open}
  - {category: harness, severity: P4, path: core/components/plays/shape-slice/SKILL.md, basis: "G5 (deterministic flow; scripts for mechanical work)", message: "Two glue steps have no script: Step 4 needs `questions-open-list.json` ('the open list written as is') and Step 5 needs `answers.json` built from the person's reply; both are done by the orchestrator by hand. Step 8's prose says the spine entry holds 'exactly id, slug, feature_refs, vertical and intents' while the script and slice_check also require `record`. slice_check also demands the exact key order of the entry, so a reused legacy entry with other keys or an other order fails the check.", status: open}
  - {category: harness, severity: P4, path: core/components/plays/shape-slice/scripts/persist_fills.py, basis: "G2 / C9 (writes only what C9 allows) and safe writes", message: "Ids and doc paths from the agent are joined to the model root unchecked (an id or doc with '..' in persist_slice record_rel and persist_fills docs can point outside the model); the guard in Step 10 would catch it only after the write. The spine is rewritten in full with yaml.safe_dump, not atomically, so comments and layout in the spine are lost. Reject paths that leave the root; write via temp file and rename.", status: open}
  - {category: harness, severity: P4, path: core/components/plays/shape-slice/SKILL.md, basis: "G1 C13 (lands through the change plays)", message: "Step 12 runs `git add` / `git commit` directly in the play. The model plays in base (discover-domains, shape-scope, edit-ontology) do the same, so this follows the existing pattern; noted only against the CLAUDE.md 'agent-first' example.", status: accepted}
verified_ok:
  - "(b) The scripts behave as written where tested: find_serving_slice rule 1 and 2 order, persist_slice refuses no surface / no persona / more than one surface / unknown feature before any write, persist_fills is additive and refuses duplicates, write_intent_page never overwrites, record_approval refuses an empty reply and keeps history; intent_touches, platform_adapter and lint_grounding in shape-slice are byte-identical to create-play/references."
  - "(d) Deleted skills (author-epics, check-cut-tensions, rank-actions), the next play and the work-intelligence shelf have no live reader; product-os-keeper's table and docs/components list the three skills it now uses, and author-business-intent and propose-answers exist."
