# check-change round 2 -- category: harness -- PR #840 (issue 795). Grounded on plan/788/base + the approved ICE and decisions.md only. Every round-1 finding is re-tested by hand in a scratch folder.
category: harness
base: plan/788/base
round: 2
principles:
  - {id: G1, source: "core/components/plays/shape-slice/reference/ice.md (approved before the build)", principle: "The compiled play covers every constraint, failure condition and scenario."}
  - {id: G2, source: "plan/788/base:docs/adr/049", principle: "/shape-slice writes the slice and its link to the intent; no plan, epic, story or eval."}
  - {id: G3, source: "plan/788/base:core/components/memory/standards/schemas/product-os/ontology.md (v10 Slice)", principle: "Spine slice entry is id, slug, feature_refs, vertical, intents, record."}
  - {id: G4, source: "plan/788/base:core/components/memory/standards/rules/asking-a-person.md, user-questions.md, no-unbacked-recommendation.md", principle: "Questions all at once, recorded in STM, an answer is a fact, no answer proposed without a source."}
  - {id: G5, source: "plan/788/base:CLAUDE.md (Execution Model, Behavioral Rule 4)", principle: "Agents craft context; scripts do the work; typed checkpoints."}
  - {id: G6, source: "plan/788/base:.claude/rules/garura-memory.md", principle: "Memory only through the memory tool; every decision keeps a cite trace."}
tests_run:
  - "Unit suites: test_persist_slice 84 pass, test_shape_slice_scripts 72 pass, test_find_serving_slice 18 pass, test_grill_budget 19 pass. lint-components: 124 errors, none in shape-slice (same old backlog)."
round1_status:
  - {round1: "P2 reuse by 'lists the intent' fails when the shaped slice differs", status: "yes, fixed", line: "persist_slice.py plan()/--reuse; find_serving_slice.py reuse_args. By hand: spine sl-a [ft-1] on scr serves bi-1; shaped [ft-1,ft-2] on scr2/p2 with bi-1,bi-2 -> match sl-a, persist --reuse sl-a rc=0, no second slice, bi-2 appended to entry and record, features and surface kept, 3 differences listed; repeating the same call gives 'unchanged'."}
  - {round1: "P2 record written holds less than slice.yaml v2", status: "yes, fixed", line: "persist_slice.py new_record(). By hand: record has slice{id,slug,name,outcome,feature_refs,vertical,intents} and surface{id,name,persona_ref,user_action}; a reused slice's record gets the added intent; slice_check now tests every spine slice's entry and record (record with no persona_ref -> 'surface has no persona_ref (no tester)'; entry with 'status' -> 'not exactly the six fields')."}
  - {round1: "P2 old-chain dependents not changed with the schema", status: "deferred: #837 (stated in the PR)", line: "pr-body.md 'Known gap'; spine.yaml and pipeline-next.md label the older chain. #837 and #838 are open."}
  - {round1: "P3 record_questions filter by id only", status: "yes, fixed", line: "record_questions.py cmd_filter. By hand: record holds Q-scope-1 'Who tests the screen?' answered; a new run sends Q-scope-1 'Which team owns the report?' -> kept, renamed Q-scope-1-2; a different id 'who tests the screen' (other case, no mark) -> dropped as answered. open-list and answers (id or number, 'skip' -> deferred) now exist as scripts."}
  - {round1: "P3 change at the checkpoint leaves stale Touches lines; Step 12 has no gate", status: "yes, fixed", line: "persist_fills.py --undo; record_approval.py verify. By hand: after fills, undo with the page untouched -> page put back exactly; page edited since -> only the added lines removed, an older Touches line and the later text kept. verify: yes rc=0; change rc=1; stop rc=1; yes then change rc=1; missing file rc=2; empty reply rc=1; recorded empty reply refused rc=2."}
  - {round1: "P3 record_questions check passes with unanswered; empty answer counts", status: "yes, fixed", line: "record_questions.py cmd_check / cmd_answer. By hand: two unanswered asked questions -> ok false, exit 1 (unanswered listed); an answer of blanks -> refused rc=2, nothing written; blocking question skipped -> ok false, 'blocking_deferred'; answering it again clears it. Residual: the shape test is still a heuristic and the opening is still not tested (see N3)."}
  - {round1: "P3 no memory-tool search and no cite trace", status: "yes, fixed (in part; see N4)", line: "SKILL.md lines 196-312, 339-348: gather task runs memory.py search/read/find; slice choice and reuse decision run memory.py cite; citations --check runs and SE-10 reads its file."}
  - {round1: "P3 slice choice has no skill; utility_agents 0", status: "yes, fixed", line: "SKILL.md lines 69-77 and 616-ish table: template-manager listed, utility_agents 1, author-slice named as #838 (open: 'An author-slice skill picks the slice's features, surface and tester')."}
  - {round1: "P4 glue steps by hand; Step 8 prose lists five fields; exact key order", status: "yes, fixed", line: "record_questions.py open-list and answers; SKILL.md Step 8 says six fields; slice_check compares the key set, not the order (read in entry_problems: set comparison, not tested by hand)."}
  - {round1: "P4 '..' ids and docs; non-atomic writes", status: "yes, fixed", line: "persist_slice.py inside()/safe_id()/atomic_dump(); persist_fills.py inside()/intent_page()/atomic_write(). By hand: slice ids '..', '../x', 'a/b', '..hidden' refused, nothing written; a fills doc '../x.md' refused; an intent id '../zz' refused; spine unchanged. Residual: the spine is still rewritten with safe_dump, so comments and layout in it are still lost (N5)."}
  - {round1: "P4 git add/commit directly in the play", status: "accepted (unchanged from round 1)", line: "follows the model plays in base"}
findings:
  - {category: harness, severity: P3, path: core/components/plays/shape-slice/scripts/persist_slice.py, basis: "G1 C7 + G3 (a reused slice must still pass the play's own check; ontology v10)", message: "N1 (new). Reusing a slice whose record was written before slice.yaml v2 (surface nested under slice, no name/outcome) keeps that record as it is: only the intent is appended. Then slice_check, which now checks every spine slice, fails with 'no slice.name', 'no slice.outcome', 'does not hold exactly one surface', and the play has no step that can repair it, so the run cannot finish. Reproduced: legacy entry (status/order/domain_ref) plus legacy record; --reuse sl-old rc=0 (entry cleaned to six fields), then slice_check lists those three problems. Fix: when reusing, write the record to v2 (name and outcome from the shaped slice or ask), or make slice_check name the legacy record as a repair for the person.", status: open}
  - {category: harness, severity: P4, path: core/components/plays/shape-slice/scripts/slice_check.py, basis: "G1 F-conditions (this run's check should fail for this run's writes)", message: "N2 (new). slice_check now fails on any spine slice, so one unrelated defective slice written by an earlier run or hand edit blocks every later /shape-slice run, and the play cannot repair a slice it did not write. Report other slices' problems as warnings, or fail only for the slice this run wrote and the ones it touched.", status: open}
  - {category: harness, severity: P4, path: core/components/plays/shape-slice/scripts/record_questions.py, basis: "G4 / asking-a-person.md (one thing per question, stand alone, opening)", message: "N3 (round 1 residual). shape_problems is still a heuristic (' and ', one '?') and tests neither the opening nor stand-alone wording. Also `answer` called by hand with the text 'skip' and no decision records user_decision 'in_scope' (only `answers` turns skip into deferred), and `answers` treats any reply that starts with 'skip'/'defer' as deferred, e.g. 'Skip the dashboard, use the CLI'. Accept as a known limit, or have `answers` ask when text follows 'skip'.", status: open}
  - {category: harness, severity: P4, path: core/components/plays/shape-slice/SKILL.md, basis: "G6 (every decision keeps its trace)", message: "N4 (round 1 residual). The slice choice and the reuse decision run `memory.py cite`; the proposed answers (propose-answers step, line 210) do not, although each carries a basis ref. And the citation check (`citations --check`) is read only through the agent's citations-check.json in SE-10; stop-condition.yaml does not test it. Add cite for the proposed answers or say the basis ref is the trace.", status: open}
  - {category: harness, severity: P4, path: core/components/plays/shape-slice/scripts/persist_fills.py, basis: "G5 (safe writes)", message: "N5 (round 1 residual) and N6 (new, cosmetic). The spine is still dumped whole with yaml.safe_dump (comments lost; the same as in base model plays). The 'lines removed' undo path leaves an empty '**Touches:**' heading when the page had no list before and was edited since (the 'put back' path is exact).", status: open}
verified_ok:
  - "Round-1 behaviours that held: find_serving_slice rule order; persist_slice refuses no surface / no persona / several surfaces / unknown feature before any write; persist_fills is additive; write_intent_page never overwrites; record_approval refuses an empty reply and keeps history."
