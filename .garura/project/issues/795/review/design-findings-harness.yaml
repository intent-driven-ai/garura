tests_run:
  - "The four unit files are pytest-style; pytest is not installed here, so they were not run (unittest finds none). Behaviour was checked by hand instead (below)."
round2_status:
  - {round2: "N1 reuse of a pre-v2 record cannot finish", status: "yes, fixed", line: "By hand: legacy entry (status) + legacy record (surface under slice, no name/outcome), --reuse rc=0, entry has six fields, record now slice{...name,outcome} + top-level surface, upgraded_to_v2 lists 3 fields; slice_check then has no problem for it. A record whose surface lacks persona_ref/user_action and a shaped surface that is not its own: refused rc=2, nothing written, names the file to fix. See R3-1 for a side effect."}
  - {round2: "N2 one other bad slice blocks every run", status: "yes, fixed (see R3-1 on visibility)", line: "By hand: sl-bad (empty record) next to sl-old: with --slice-id sl-old, problems [] and 7 warnings, valid true for the slice; with --slice-id sl-bad the same lines are problems. (valid stays false in my fixture only because the lint found 7 errors, an incomplete scratch model.)"}
  - {round2: "N3 question shape heuristic; skip handling", status: "yes, fixed / accepted limit", line: "By hand: 'Skip the dashboard, use the CLI' -> `unclear`, no answer, not in unanswered, asked again; bare 'skip' and 'skip it.' -> deferred; 'Skipping is fine, but I want the report' -> kept as an answer; `answer` with text 'skip' and no decision -> deferred. proposals: 'Who is it for?' and '...listed above...' -> 'does not stand alone'. New `message` command: a good message rc=0; a 4-sentence opening and missing parts rc=1 with each problem listed; Q-scope-1 vs Q-scope-10 not confused. Still a floor, not a judgement (stated in the script); accepted."}
  - {round2: "N4 no cite for proposed answers; D5 absent", status: "yes, fixed", line: "SKILL Step 3 now has the agent run memory.py cite for each proposed answer with a basis and write citations.json. D5 added to ice.md and stop-condition.yaml (same wording, same check: citations-check.json field `problems` equals []). core/tools/memory/memory.py cmd_citations returns `problems`, so the field exists; the file path context/shape-slice/citations-check.json matches <working>. The ICE change went through the ICE source, and its fingerprint in SKILL.md was updated."}
  - {round2: "N5 spine comments lost", status: "yes, fixed", line: "spine_text.py. By hand: top comment, '# slices below', '# the old one' and the untouched second entry's flow style all kept; only the changed entry was rewritten (its own inline comment went with it); load-and-compare falls back to a full dump if the result differs, so the data is always right."}
  - {round2: "N6 empty Touches heading after undo", status: "yes, fixed (one edge left, R3-3)", line: "By hand: page with no list before, edited since, undo -> heading removed along with its lines."}
findings:
  - {category: harness, severity: P3, path: core/components/plays/shape-slice/SKILL.md, basis: "G1 C7 (the person sees how the new shape differs from the slice reused) + G4 (nothing hidden at the checkpoint)", message: "R3-1 (new). The two things the round-2 fix added to the script results are not wired into the play. SKILL.md never mentions `upgraded_to_v2` (a reused old record is rewritten, and its name and outcome are taken from the SHAPED slice, not from the slice kept; by hand, a kept slice with features [ft-1] was named 'New' after a shape with [ft-1, ft-2]) and never mentions slice_check's `warnings` (other slices' defects). Neither is shown at the checkpoint or in the summary, so the person approves without seeing that a record was rewritten or that the model holds a broken slice. Fix: list both in the checkpoint next to `differences`/`dropped_fields`, and say in the checkpoint that a name or outcome was taken from the new shape.", status: open}
  - {category: harness, severity: P4, path: core/components/plays/shape-slice/SKILL.md, basis: "G6 (a cite source is a memory tier file)", message: "R3-2 (new). The Step 3 cite instruction says the trace source can be 'a model page or a person's earlier answer ... that page's lines or the record entry', without naming the tier. citations.py accepts only tier/path/fingerprint from a memory read (short-term, garura incl. the product model, phoenix); an agent given this wording may try a repo path. Name the tiers: model page = `--tier garura` product path, earlier answer = the issue's short-term record.", status: open}
  - {category: harness, severity: P4, path: core/components/plays/shape-slice/scripts/persist_fills.py, basis: "G5 (an undo puts back what was there)", message: "R3-3 (new, cosmetic). In the 'lines removed' undo path a page that held '**Touches:** none yet' before the run loses that heading (had_list is false, so the heading is treated as made by the run). By hand: before has 'none yet', page edited since, undo -> heading gone. Test the before-text for the heading, not for entries.", status: open}
  - {category: harness, severity: P4, path: core/components/plays/shape-slice/scripts/record_questions.py, basis: "G4 / asking-a-person.md (opening that says what the person decides)", message: "R3-4 (new). `message` tests the opening by sentence count (2-3) and the word 'decid' only; an id mentioned in the opening makes the opening end early, and the four-part test is a '**Name' prefix match. Accept as the floor (the script says so), or note it in the SKILL step so the agent does not treat ok:true as a full pass.", status: open}
verified_ok:
  - "Round-2 behaviours that held: reuse keeps features and surface, appends intents, lists differences; refusals write nothing; atomic writes; the older-chain label."
  - "spine_text.py falls back safely; the two spine writers (persist_slice, persist_fills) both use it."
