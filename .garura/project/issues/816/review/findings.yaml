# check-change Step 4 -- consolidated findings, PR #823 (issues 816, 817, 815, 820).
# Runnable checks: runnable-checks.txt (all suites exit 0; ruff passed; linter 121 errors, same as base).
findings:
- category: harness
  severity: P2
  path: core/components/skills/author-product-ontology/SKILL.md
  basis: 'ADR 009 Rule 3 (as amended by ADR 039 section 2): a skill reads only what its agent puts in short-term
    memory. The skill''s input table on base (ontology_path, template_path, draft, ...) has no input that carries
    the rule, and this diff adds none.'
  message: The skill now says every draft follows standards/rules/asking-a-person.md, but nothing hands that rule
    to the skill. The play contract (Step 1/3/5) and the skill's input table are unchanged, so the product-os-keeper
    is never told to fetch the rule through the memory tool and put it in short-term memory. A skill that cannot
    reach the rule cannot follow it; the line is a pointer to a path the skill must not read by path. Add the rule
    to the contract (for example a rules input the agent fills from memory) or the instruction does nothing.
  status: null
- category: harness
  severity: P3
  path: core/components/plays/edit-ontology/SKILL.md
  basis: 'CLAUDE.md Play Pipeline Rules: pointing to a shared rule is a non-intent direct edit only if it changes
    no guarantee. The rule adds an opening, a Question/Answer/Why/Example shape, and a read-back test, and says
    a draft that does not follow it ''is not ready to show''. ICE C4 on base asks only for plain English and personas.'
  message: Treated as a non-intent edit, as the brief directs. But the pointed-to rule makes the checkpoint draft
    format a requirement the base ICE and its evals do not state or test. If the format is meant to be a guarantee,
    the ICE source (reference/ice.md, not touched here) needs a constraint and an eval via /edit-play; if it is
    guidance only, say so. Confirm which; no change needed if guidance.
  status: null
- category: harness
  severity: P3
  path: core/components/plays/edit-ontology/SKILL.md
  basis: 'ADR 039 section 2: a play reads no memory; its agents do. The play now names a memory path (standards/rules/asking-a-person.md)
    in steps 1, 2, 4 and 6 but does not say who loads it.'
  message: 'Same gap as the skill finding, seen from the play: the play does not hand the rule to product-os-keeper
    in the Step 1/3/5 contracts, so the ''drafts follow'' lines are not wired to any agent action. The play also
    shows the draft itself in Step 2, so the play side needs the agent to build the draft to the rule.'
  status: null
- category: harness
  severity: P4
  path: core/components/plays/edit-ontology/SKILL.md
  basis: ADR 009 Rule 5 (no duplication); Steps 4 and 6 are written 'As Step 2' on base.
  message: The pointer is stated four times (Step 1, 2, 4, 6). Steps 4 and 6 inherit Step 2, so one statement in
    Step 1 or Step 2 is enough. The Step 2 line also now runs past the file's wrap width.
  status: null
- category: harness
  severity: P4
  path: core/components/plays/shape-slice/scripts/grill_budget.py
  basis: 'Playbook review/harness: play orchestrates, scripts do mechanical work, no orphan references. On plan/788/base,
    shape-slice/SKILL.md and reference/ice.md never mention grill_budget or shape-slice.grill-tier.'
  message: The new script and the config key are not called from shape-slice/SKILL.md or its ICE in this PR, so
    the play does not use them yet. Fine if the wiring lands in the follow-on issue (#817, named in the test header);
    state that in the PR so the script is not read as dead code.
  status: null
- category: memory
  severity: P2
  path: core/components/memory/standards/schemas/product-os/ontology.md
  basis: ADR 048 Decision 2 and 'What this changes in older ADRs' (base)
  message: v9 changes the Plan from 'picks a slice by two tests' to 'holds every slice that serves its intent; does
    not pick, rank or test', drops the Plan's first test, and moves the vertical-outcome rule to the Slice. This
    reverses an Accepted decision (ADR 048 section 2, which also says ADR 022's 'Plan's first test refuses a slice
    with none'). The diff adds no ADR and no amendment to ADR 048; ADR 048 itself lists the ontology as an 'Affects'
    file of its own decision. A decision change needs a decision record that supersedes or amends it.
  status: null
- category: memory
  severity: P2
  path: core/components/memory/standards/schemas/product-os/ontology.md
  basis: 'idd-principles.md Routing Table: Failure conditions -> Builder: no; Eval author: yes (base)'
  message: The Story scope of work now 'says what the feature must do, what is expected, and what must never happen'
    and the Slice eval tests those things. The builder of a Story reads its Story (the ontology's own example says
    so). So failure-condition content ('what must never happen') reaches the builder, which the IDD routing table
    forbids. The same text also has the eval read only epic/stories/guide and 'never the ICE', which departs from
    'eval author receives all of ICE'. The isolation is moved, not preserved; no committed decision backs the change.
  status: null
- category: memory
  severity: P3
  path: core/components/memory/standards/schemas/product-os/ontology.md
  basis: ontology.md line 9 (base)
  message: v9 edits five kinds in one version (Slice, Plan, Epic, Story, Business Intent) plus new questions Q27-Q31.
    The ontology's stated growth rule is one kind at a time. The v9 note says it was agreed with the product owner,
    but the base rule is not amended.
  status: null
- category: memory
  severity: P3
  path: core/components/memory/standards/schemas/product-os/ontology.md
  basis: ADR 017 Decision 1 (base)
  message: Plan now owns a folder .garura/project/plans/<id>/ with evals/ and guides/. ADR 017's whitelist names
    only project/issues/ under project/ and forbids other second-level folders; the base has no ADR that adds project/plans
    (CLAUDE.md names it, but CLAUDE.md is not a decision record). The new sub-folders widen an already unrecorded
    location.
  status: null
- category: memory
  severity: P3
  path: core/components/memory/standards/rules/asking-a-person.md
  basis: approval-prompt.md 'Shape' (base)
  message: The rule says a checkpoint shows its draft in the Question/Answer/Why/Example format and links to templates/approval-prompt.md
    as 'the checkpoint rendering'. That template defines a different checkpoint shape (Tether/Orbit/Vanish, summary
    plus artifact paths) with no place for these four parts. Two canonical checkpoint formats now exist and neither
    points to a reconciliation. The _index.md row also does not mention the overlap.
  status: null
