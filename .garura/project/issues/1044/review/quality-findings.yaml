observations:
- file: core/tools/lint-components/lib/rules/naming.js
  text: The reserved-name rule now blocks only a name equal to a built-in; a name that starts with one passes (matches the ADR 066 wording in the diff). The loop rule requires loop-<from>-<to> with two
    different known phases; the tests cover pass, unknown phase, same phase, and one phase.
- file: core/tools/naming/check_old_names.py
  text: The old-name check now skips every ADR numbered up to 66 through one constant LAST_PAST_ADR = 66, replacing three special lists. Its comment says a later rename moves the number; the test covers
    ADR 066 (skipped) and 067 (searched), and the SUPERSEDED- variants. No error handling or path-escape risk added.
- file: core/components/skills/author-decision/scripts/adr.py
  text: 'index_status and pointers: the conditional return in the "Superseded by" branch parses as (a + b) if cond else c, which is the intended result; tests cover mixed amend/supersede, plain Accepted,
    and a full supersede. The scan does not cover this file (garura-prose); read by hand.'
