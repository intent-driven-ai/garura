# check-change Step 4 -- consolidated findings, PR #832.
findings:
- category: harness
  id: HA1
  severity: P2
  path: core/components/plays/edit-ontology/SKILL.md
  basis: H1
  message: Step 1 now has product-os-keeper load asking-a-person.md via the memory tool, write it to <working>/asking-a-person.md,
    and pass it as new contract input asking_rule to Steps 1, 3 and 5. That is a change to the agent/skill flow
    and contract, not wording. reference/ice.md was not touched and does not mention the rule, so the next /edit-play
    rebuild will drop it. Either update ice.md and recompile, or record why this is wiring only.
  status: open
- category: harness
  id: HA2
  severity: P3
  path: core/components/plays/edit-ontology/SKILL.md
  basis: H2
  message: Direction is consistent with H2 (agent loads rule through the memory tool, skill reads only the file
    the agent put in STM). No violation; the product-os-keeper agent definition itself was not updated to list this
    duty.
  status: open
- category: harness
  id: HB1
  severity: P2
  path: core/tools/lint-components/lib/rules/asking-a-person.js
  basis: H4
  message: 'On real plays the rule adds 30 errors (lint-components 121 to 151). Only edit-ontology is fixed in this
    PR; 29 plays/loops now fail the linter. The PR body states the fix is #831, so the merge lands a red linter
    on the plan branch. Accepted-as-deferred only if #831 lands before the plan merges to main.'
  status: 'deferred: #831'
- category: harness
  id: HB2
  severity: P3
  path: core/tools/lint-components/lib/rules/asking-a-person.js
  basis: H4
  message: 'False positives: signals match any line, including front-matter descriptions and prose mentions. Seen
    on real files: release-epic line 4 (description text), shape-quality-lens line 48 (mentions ''a typed approval''
    in a constraint), create-play line 121 (''interview and asks for approval'' in a note about itself). Detection
    has no scoping to checkpoint steps. Also the content.includes(''asking-a-person.md'') pointer test accepts a
    mention anywhere, so a stray mention passes (false negative).'
  status: open
- category: harness
  id: HB3
  severity: P4
  path: core/tools/lint-components/lib/rules/asking-a-person.js
  basis: H4
  message: 'False negatives: a play that asks through phrasing not in the six patterns (for example ''wait for the
    reply'', ''Tether/Vanish'' alone, ''confirm with the person'') is not caught. Acceptable for a first rule; note
    the list is a heuristic.'
  status: open
- category: harness
  id: HC1
  severity: P2
  path: core/components/plays/*/scripts/lint_grounding.py
