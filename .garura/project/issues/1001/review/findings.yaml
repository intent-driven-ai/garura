- id: H1
  severity: P3
  file: core/components/plays/update-plan/SKILL.md
  line: 527
  summary: 'SCE-9 (a scenario eval run at Step 14) reads the ''clear'' record, but the clear runs in Step 16, two steps later,
    and session_files.py clear prints its result and writes no file (its own docstring: ''writes no file, since it would be
    left behind''). At Step 14 the record does not exist, and after Step 16 the folder it would be read from is gone. The
    guarantee ''nothing is left behind'' is proved only by SE-21 at Step 16; the scenario eval for S9 cannot be evaluated
    where it stands.'
  basis: 'Harness standard principle 5 (build the eval first, each guarantee has a check that proves it) and principle 2 (the
    play owns the order of its steps). The same ICE measure (S9, ''the clear record lists ...'') has no moment at which it
    can be read. Fix: take the measure from the clear command''s printed output at Step 16, or have the scenario eval check
    the folder is absent after the close.'
  category: harness
  outcome: fixed
- id: H2
  severity: P3
  file: core/components/plays/update-plan/SKILL.md
  line: 545
  summary: 'Step 16 (self-clean) sits above the Standard Play Close block, yet says it runs ''after C1 and C2 below''. A reader
    following the text order meets the clear before the stop-condition gate (C0) and the evidence and report steps (C1, C2),
    which read files in the folder it removes. It is also missing from the task list (T1-T15 only), so no task tracks it,
    and ''Depends on: Step 15'' names a step that only says ''run the Standard Play Close'', so the order inside the close
    is not stated where the steps are.'
  basis: Harness standard principle 2 (the play owns the order of its steps); play-close.md on the base ref (the close's steps
    run in order, the play adds its own close lines). The task list is the play's record of order; a step with no task is
    outside it. Put the clear after the close block, or give it a task T16 and say plainly that it runs once C2 is done.
  category: harness
  outcome: fixed
