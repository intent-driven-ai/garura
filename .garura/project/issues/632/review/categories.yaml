pr: 633
base: main
categories:
  - id: harness
    playbook: review/harness
    design_bearing: true
    summary: "New /adr play (compiled SKILL.md plus its ICE source and stop-condition), new author-adr skill, and new adr-keeper agent."
    evidence:
      - core/components/plays/adr/SKILL.md
      - core/components/plays/adr/reference/ice.md
      - core/components/plays/adr/stop-condition.yaml
      - core/components/skills/author-adr/SKILL.md
      - core/components/agents/adr-keeper.md
    notes: "Intent change for a new play, so the ICE-to-SKILL trace, agent-first delegation (adr-keeper gathers context, author-adr skill writes, scripts do mechanical work), the one human accept checkpoint, the drive-contract mode and the Standard Play Close are the main design checks. Ground against base-ref ADRs (notably 031 business intent and ICE, 029 drives, 030 plan mode), the glossary, philosophy docs and play standards, not against the new ice.md text itself."
  - id: memory
    playbook: review/memory
    design_bearing: true
    summary: "Standards that agents read: a new ADR template, the decision schema moved to v2 (adds supersedes and amends style core fields), a schema index entry, a template index entry, and wording in two rules (gate-config adds adr's accept step to the human-only list; pipeline-next successor map)."
    evidence:
      - core/components/memory/standards/templates/adr.md
      - core/components/memory/standards/templates/_index.md
      - core/components/memory/standards/schemas/product-os/decision.yaml
      - core/components/memory/standards/schemas/product-os/_index.md
      - core/components/memory/standards/rules/gate-config.md
      - core/components/memory/standards/rules/pipeline-next.md
    notes: "Standards, schemas, templates and rules under memory/standards, not a knowledge shelf. Ground the decision.yaml v1 to v2 change against the base-ref decision.yaml (git show main:...), existing ADRs, glossary and ADR 031. The gate-config edit changes which steps always need a human, so check it against base-ref gate-config and the approval rules. Never ground against the new adr.md template text itself."
  - id: executable-code
    playbook: review/code
    design_bearing: false
    summary: "Python scripts: the adr play's mechanical helpers (CLI, apply, scope check, stop-condition check, preflight, session stamp), the author-adr skill's own adr.py, and a small install.py change that keeps the adr play in a harness repo's install."
    evidence:
      - core/components/plays/adr/scripts/adr.py
      - core/components/plays/adr/scripts/apply_adr.py
      - core/components/plays/adr/scripts/check_adr_scope.py
      - core/components/plays/adr/scripts/check_stop_condition.py
      - core/components/plays/adr/scripts/preflight.py
      - core/components/plays/adr/scripts/session_stamp.py
      - core/components/skills/author-adr/scripts/adr.py
      - core/components/plays/install-garura/scripts/install.py
  - id: tests
    playbook: review/tests
    design_bearing: false
    summary: "Unit tests for the adr play's apply script and for the author-adr skill's script."
    evidence:
      - core/components/plays/adr/scripts/test_apply_adr.py
      - core/components/skills/author-adr/scripts/test_adr.py
  - id: docs
    playbook: review/docs
    design_bearing: false
    summary: "Component reference pages updated to list the new adr play, skill and agent, plus a generated index table of the existing ADRs."
    evidence:
      - docs/components/agents.md
      - docs/components/plays.md
      - docs/components/skills.md
      - docs/adr/_index.md
    notes: "docs/adr/_index.md sits under the ADR path but is a generated table (by adr.py index), not a decision record, and no ADR file itself is added or edited in this diff, so the adrs playbook does not govern it. Its structural points still apply: every row links to an ADR file that exists, and the generated statuses and dates match what each ADR says."
  - id: config-maps
    playbook: review/config-maps
    design_bearing: false
    summary: "Install manifest lists installed components by path; it gains the adr-keeper agent, the author-adr skill and the adr play, and the counts move to 5 agents, 12 skills, 9 plays."
    evidence:
      - .garura/install-manifest.json
    notes: "Generated by install-garura. Check that the listed paths exist and the counts match."
  - id: stm-run-records
    playbook: null
    playbook_missing: true
    design_bearing: false
    note: "Playbook missing. These are work-tracking and run artifacts under .garura/project/issues/632 (plan, trial run of the adr play on ADR 031 with its draft, manifest, check output and notes, and context and PR scratch files). They are not KB memory, docs or ADRs; the trial ADR draft is a scratch draft, not a committed decision record. Needs its own playbook, or an explicit decision that they are out of review scope. The plan may be used as the stated intent the change is checked against, but it is branch-added, so never as design grounding."
    summary: "Short-term-memory records for issue 632 work and play runs, including a trial run of the adr play on ADR 031."
    evidence:
      - .garura/project/issues/632/context/analysis.yaml
      - .garura/project/issues/632/context/branch.json
      - .garura/project/issues/632/context/commits.yaml
      - .garura/project/issues/632/context/issue.json
      - .garura/project/issues/632/context/porcelain.txt
      - .garura/project/issues/632/context/pr-body.md
      - .garura/project/issues/632/context/pr.json
      - .garura/project/issues/632/context/resolved-rules.json
      - .garura/project/issues/632/context/self-review.md
      - .garura/project/issues/632/context/work-description.txt
      - .garura/project/issues/632/specs/plan.md
      - .garura/project/issues/632/specs/trial-adr-031/adr-check.json
      - .garura/project/issues/632/specs/trial-adr-031/adr-context.yaml
      - .garura/project/issues/632/specs/trial-adr-031/adr-draft.md
      - .garura/project/issues/632/specs/trial-adr-031/adr-manifest-accepted.json
