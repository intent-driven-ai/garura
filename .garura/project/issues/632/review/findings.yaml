- id: H1
  severity: P2
  file: core/components/plays/adr/SKILL.md
  where: Pre-flight ('Resolve the facts'), Task DAG, Step 0 and Step 6 paths, Standard Play Close paths
  principle: 'A ''both'' play''s start-change is what resolves or creates the issue; anything that needs the issue
    number must come after Step 0, or use a fixed path. Sibling plays that run before an issue exists use fixed
    working paths.

    '
  source: 'G6 (pipeline-position.md: start-change ''resolve/create the issue, cut the branch''); G8 (/intent and
    /vision working folders)'
  detail: 'Run by hand, pre-flight runs BEFORE Step 0 on main, where preflight.py extracts the issue from the branch
    name and gets none. The play still defines <working> as {stm_base}{issue}/context/adr-<run-ts>/, writes porcelain-before.txt
    and run.json there, and stamps the session at {stm_base}{issue}/status/..., then says the porcelain is ''captured
    again after Step 0''. The start-change contract output is also keyed on {issue}. In the by-hand (primary) mode
    the issue number does not exist yet at those writes. Inside a drive the branch name supplies it, so drive mode
    is unaffected. /intent avoids this with a fixed ''_kickoff/intent/'' working folder.

    '
  suggested_direction: Key the working folder and stamp marker on a fixed play folder (e.g. {stm_base}_adr/...)
    or move the first writes after Step 0; an ICE-level change if it alters the contract, so via ice.md and play-editor.
  category: harness
