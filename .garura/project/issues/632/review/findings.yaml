- id: H3
  severity: P3
  file: core/components/skills/author-adr/SKILL.md
  where: 'frontmatter allowed-tools: Read, Write, Glob, Bash; ''Scripts'' table (pointer, accept commands)'
  principle: 'Containment by construction: the LLM-facing skill writes only its own artifact; the keyed, deterministic
    script in the play owns the shared writes. The sibling authoring skill has no Bash and no accept/confirm in
    reach.

    '
  source: 'G4 (direct-model-write.md item 3; ADR 026 Decision, containment split); G8 (author-business-intent allowed-tools:
    Read, Write, Glob)'
  detail: 'C6 and C7 (a person accepts; older ADRs get only a forward pointer, after acceptance) are guaranteed
    in prose for the skill and agent (''never accept'', ''never edit an older ADR''), but both hold Bash and the
    skill''s own scripts/adr.py exposes ''accept'' and ''pointer'' (the same copy the play uses). The guarantee
    therefore rests on instruction, with detection afterwards (SE-6, SE-7, SE-9 and the scope check), not on the
    skill being unable to do it. Detect-and-recover exists, so this is not blocking.

    '
  suggested_direction: Keep Bash (the lint needs it) but split the mutating commands (accept, pointer) into the
    play-only script, leaving the skill's adr.py with number, lint, overlaps, guard and index, or add the prohibition
    to the scope check's allow list for the draft run.
