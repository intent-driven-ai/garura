  severity: P3
  file: core/components/plays/adr/SKILL.md (with core/components/plays/adr/reference/ice.md C6, C9)
  where: Step 3 (confirm-before-write), Step 5 (scope check), pre-flight
  principle: 'Model-writing plays write first and review the git diff (ADR 026); the only declared exception is
    /intent run by hand. They assert a clean product-os tree at pre-flight and run the shared scoped-write guard
