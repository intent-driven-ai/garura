ice_impact: >-
  Changes the ICE kind and the agent intents of /intent and of every compiled play that plans,
  breaks down or builds from an ICE. An ICE is now built from a business intent and is workable
  only when that business intent is confirmed; an unlinked ICE is kept but no play works on it.
  ICE may be written inline on a proposed capability before it has a domain. /intent's own ICE
  changes: one business intent per want plus one ICE per separate thing to see, decide or do; no
  approval stop inside a drive; confirm before write by hand.

business_intent_check:
  value: kind
  why: >-
    It changes the Business Intent kind and its rules (only a person confirms or drops one; ICE
    built from it is workable only once confirmed) — framework doctrine. It changes no person's
    business intent, and it names no business intent page.

