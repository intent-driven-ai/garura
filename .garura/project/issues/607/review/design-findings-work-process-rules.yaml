# review-change Step 3 (Layer 2) -- category: work-process-rules
# Scope: the +8-line "The one exception is a drive (ADR 029)" paragraph in
# .garura/user-provided/managing-work.md (after line 109 on main).
# Grounding is read from the base ref (main) and the deployed standards only.
# Not used as grounding: docs/adr/029-drives.md, specs/decisions.md, pr-body.md, self-review.md.
# Whether the decision is wise is out of scope (owner decision). Only conformance and clarity are judged.
category: work-process-rules
pr: 618
base: main
file_under_review: .garura/user-provided/managing-work.md

grounding:
  - id: G1
    principle: "One issue, one session, one branch, one pull request. A session carrying two issues has lost the thread of both."
    source: "git show main:.garura/user-provided/managing-work.md (line 109)"
  - id: G2
    principle: "The issue being worked defines the scope; work never goes beyond it. Anything outside the issue becomes its own issue."
    source: "git show main:.garura/user-provided/managing-work.md (line 114 and following)"
  - id: G3
    principle: "Parent/child links are 'real' tracker links, not a body mention and not a shared label. The file never defines any other kind of 'link'."
    source: "git show main:.garura/user-provided/managing-work.md (lines 59-61)"
  - id: G4
    principle: "A Feature is never worked directly; it is decomposed into Stories. Story = one branch, one pull request. Spike result is a decision record."
    source: "git show main:.garura/user-provided/managing-work.md (lines 50, 91); git show main:docs/philosophy/garura-reference-implementation.md (Work Item Types table, lines ~163-169)"
  - id: G5
    principle: "The handoff is a comment on the issue that was worked; the session reads only the issue and its parent, so the issue text must stand alone."
    source: "git show main:.garura/user-provided/managing-work.md (lines 76-79, 174)"
  - id: G6
    principle: "NWWI: no work without an issue; plays open no work of their own, STM is scoped to one issue."
    source: "git show main:docs/adr/008-issue-centric-stm-and-nwwi.md (Decision 1 and 2); git show main:core/grounding/glossary.md (STM row, line 36)"
  - id: G7
    principle: "Naming clarity: a term used in a binding rule must be defined where the reader will find it."
    source: "CLAUDE.md (user global, challenge principle 5); git show main:core/grounding/glossary.md (no 'drive' entry on main)"
  - id: G8
    principle: "Severity buckets: P3 = missing docs / naming / borderline; P4 = style-only. No pr.md row matches prose paths, so findings are design-judgement, tied to the bucket definitions."
    source: "~/.garura/core/memory/standards/rules/pr.md (Severity buckets; Artifact-Type Scoping: **/*.md is docs-planning, grep rules ineligible)"

conformance_passes:
  - "The exception is scoped and anchored: it ties the drive to one main issue and one branch, and keeps unlinked issues under the existing rule (G1, G2). It does not repeal the rule."
  - "'Plays open no branch and no issue of their own' agrees with NWWI and issue-scoped STM (G6) and with 'a session never files issues itself' in the handoff section (G5)."
  - "The forward reference 'the rule below' lands on 'How far does my work extend?', which is the right section."
  - "Placement is right: it sits directly under the one-issue/one-session/one-branch sentence it excepts. Style (bold lead, ~80 col wrap) matches the file."
  - "No other part of the file contradicts the paragraph outright; the merge/handoff/self-review sections are untouched and still apply to a drive's session by default."

findings:
  - id: WPR-1
    severity: P3
    file: .garura/user-provided/managing-work.md
    location: "new paragraph, 'Issues **linked** to the drive's main issue are fixed on that same branch'"
    principle_violated: "G3 / G7 -- 'linked' is load-bearing (it decides what is in scope) but undefined. The only 'link' this file defines is the real parent/child tracker link; a body mention and a shared label are explicitly not links."
    finding: "A reader cannot tell if 'linked' means child issues, any tracker relation (related, blocks, duplicate), or a body mention. That decides which issues a drive may fix on one branch, and the file's whole scope discipline rests on it."
    suggestion: "Say which link kind counts (for example: a real tracker link of a named kind), or point to where ADR 029 defines it."
    source: "git show main:.garura/user-provided/managing-work.md lines 59-61"

  - id: WPR-2
    severity: P3
    file: .garura/user-provided/managing-work.md
    location: "new paragraph vs line 109 'one issue, one session, one branch, one pull request' and line 107 'Closes the issue with its pull request'"
    principle_violated: "G1 / G5 -- the rule being excepted has four 'ones'. The exception restates only issue and branch (and 'same change'). Session count, pull request count, which issues the pull request closes, and which issue receives the handoff comment are left open."
    finding: "The exception reads as widening two of four limits and is silent on the other two plus on closing and handoff. A session reading this file cannot tell whether linked issues are closed by the drive's pull request, or whether the handoff goes on the main issue only. Silence reads as 'unchanged', which for linked issues is awkward (handoff 'on the issue that was worked')."
    suggestion: "State the pull request count and where the handoff lands in one sentence each, or say 'everything else in this section is unchanged'."
    source: "git show main:.garura/user-provided/managing-work.md lines 104-110, 174"

  - id: WPR-3
    severity: P3
    file: .garura/user-provided/managing-work.md
    location: "new paragraph vs section 'How far does my work extend?' (line 114)"
    principle_violated: "G2 -- 'The issue being worked defines the scope. Work never goes beyond it.' is stated without exception and is left unamended, while the new paragraph lets a drive fix linked issues. The paragraph reconciles only the unlinked case ('the rule below applies to it')."
    finding: "Two sections now give different answers for the same situation (a drive fixing a linked issue) unless the reader joins them up. The file's own text says the scope rule exists so a change 'can be reviewed against that issue'; with linked issues the review anchor is the main issue plus its linked set, which is not said."
    suggestion: "Add a half-line to the scope section, or have the exception say that for a drive the scope is the main issue plus its linked issues."
    source: "git show main:.garura/user-provided/managing-work.md lines 114-125"

  - id: WPR-4
    severity: P3
    file: .garura/user-provided/managing-work.md
    location: "new paragraph, 'a drive (ADR 029)' -- and the absence of a glossary entry"
    principle_violated: "G7 / G5 -- the file says a session reads the issue and its parent 'and nothing else', yet the new rule depends on a term defined only in an ADR. 'Drive' has no entry in core/grounding/glossary.md on main (ADR 028 speaks of 'loops'), and the exception gives no one-line meaning."
    finding: "An agent applying this rule has to open an ADR to learn what a drive is, and the canonical glossary does not carry the term. Naming clarity gap rather than a contradiction."
    suggestion: "Add a short definition clause here and a glossary entry (the glossary is the declared canonical source; check whether this PR or a follow-up adds it)."
    source: "git show main:core/grounding/glossary.md (no drive row); CLAUDE.md Reference section ('core/grounding/glossary.md -- Canonical definitions of every Garura concept')"

  - id: WPR-5
    severity: P4
    file: .garura/user-provided/managing-work.md
    location: "new paragraph, 'one main issue'"
    principle_violated: "G4 -- the file states a Feature is never worked directly and Stories/Bugs are the working units; the paragraph does not say which issue types may be a drive's main issue."
    finding: "If a drive's main issue is a Feature, that contradicts line 50/91; if it is a Story or Spike, the exception should say so. Low severity because the default reading (the type rules still apply) is safe, but the paragraph invites the question. Also: the main issue must still meet the readiness bars in 'Is it ready to work?' -- true by default, worth one clause."
    suggestion: "Name the allowed main-issue types, or state that the type and readiness rules apply unchanged."
    source: "git show main:.garura/user-provided/managing-work.md lines 50, 82-92; git show main:docs/philosophy/garura-reference-implementation.md Work Item Types table"

notes:
  - "No P1 or P2 findings. The paragraph is scoped, does not repeal the base rule, and agrees with ADR 008 (NWWI, issue-scoped STM) and the philosophy work-item table."
  - "No pr.md Standard ID row fires on this file (docs-planning prose; grep rules ineligible), so these are design-judgement findings tied to the P-bucket definitions, not mechanical rows."
  - "No playbook covers the work-process-rules category (missing, as recorded in categories.yaml)."
