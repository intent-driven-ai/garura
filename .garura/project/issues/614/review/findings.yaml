    which gate-config says no mechanism may skip
  basis: Pinned gates NEVER resolve off, with exactly two named exceptions granted by each play's intent (/intent
    confirm, /adr accept). ADR 029 leaves 'how pinned gates fit a drive' open and says Kickoff is unaffected only
    because /vision and /understand are conditional. drive-contract.md step 3 ('Do not stop at the play's own checkpoint')
    is written for any play that runs inside a drive, with no condition, and the rule is the single source plays
    read.
  status: fixed
