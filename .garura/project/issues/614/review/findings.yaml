    a deferred line itself, so the real answer is a fresh crossing line, not a correction of it, which is not stated
    anywhere.'
  status: fixed
  fix: 'e8cfab0c: drive-contract.md step 5 says skips and auto-passes stay as by hand and the drive review appends
    the real answer as a new line (how: #617).'
