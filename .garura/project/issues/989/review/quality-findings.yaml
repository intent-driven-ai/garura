    result: pass
    evidence: "Ran 46 tests, OK"
  unittest_start_change:
    command: "cd core/components/plays/start-change/scripts && python3 -m unittest test_start_change"
    result: pass
    evidence: "Ran 12 tests, OK"
  script_style_tests_create_play_references:
    command: "cd core/components/plays/create-play/references && python3 test_x.py  (every test_*.py, 17 files)"
    result: pass
    evidence: >
      17 of 17 exit 0, no FAIL. "N passed, 0 failed": check_ice_workable 46, concurrent_fanout 8, fetch_pr_context 17,
      guidance_block 13, intent_touches 21, loop_contract 36, merge_plan 10, merge_scripts 15, platform_adapter 58,
      post_verdict 31, resolve_plan 27, resolve_target 7, scoped_write_guard 15, setup_branch 14, submit_pr 6.
      test_chain_checks and test_gate_learning print no "passed, failed" line; they print "ALL PASS"
      (5/5 + 5/5; 8/8, 11/11, 5/5, copies identical) and exit 0.
      The "JSONDecodeError" text in test_loop_contract output is an expected-failure case inside a passing run.
  readme_flags_and_claims:
    result: pass
    evidence: >
      core/tools/plan/README.md "Getting onto a plan's branch": go --plan --plans-dir --ignore --out; back --record --ignore;
      abort --record --ignore all exist (plan_branch.py:337-354). The README leaves out --repo --remote --main
      (they have defaults). Claims checked against the code: uncommitted work stops go on every path including the plan's
      own branch (go:168-170, before any branch step); stale copy gone on remote is deleted only when every commit is on
      main, else it stops and names the commits (go:171-172, drop_stale:241-254, exit 2); main already In Progress on the
      branch writes nothing on main and cuts from main's tip (go:207-218, 230; test_plan_branch.py:166, 174); abort of such
      a cut only deletes the branch (abort:288-289); a second abort finishes after a refused delete (abort:287-311).
      The test line matches the three modules. The README does not mention the Done/Dropped stop (go:204-205); the module
      docstring does. Not a finding: no DOC row asks for it.
