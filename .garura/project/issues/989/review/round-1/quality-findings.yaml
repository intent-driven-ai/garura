    severity: P3
    standard_id: CODE-09
    file: core/tools/plan/plan_branch.py
    line: 155
    category: executable-code
    basis: "CODE-09 (P3, complexity-score). go(): cyclomatic complexity 16 (ruff C901 limit 10). It was 15 at plan/717/base; this PR adds the stale-copy branch (line 168). Borderline, grew by one."
    evidence: "ruff check --select C901: plan_branch.py:155 `go` is too complex (16 > 10); base copy: 15 > 10"
  - id: Q-02
    severity: P3
    standard_id: CODE-10
    file: core/tools/plan/plan_branch.py
    line: 155
    category: executable-code
    basis: "CODE-10 (P3, line-count). go() is 76 lines (PLR0915: 64 statements > 50), the longest function in the PR's code. The new drop_stale() was split out, which keeps the growth small."
    evidence: "ast: go 155-230 = 76 lines; ruff PLR0915 at plan_branch.py:155"
counts: {P1: 0, P2: 0, P3: 2, P4: 0}
