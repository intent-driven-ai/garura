# quality-findings.yaml — /check-change step 3, Layer 1, PR #1016 (issue 989, also closes #991), base plan/717/base
# Categories covered: executable-code, tests, documentation (the standards-driven ones).
# Taxonomy: .garura/project/issues/989/context/memory/standards/rules/pr.md (short-term copy)
# Scanner: .claude/skills/check-pr-quality/scripts/scan_taxonomy.py on review/pr.diff with the 34 changed paths.
# Quality standards (knowledge/quality) were not in short-term memory, so size/complexity thresholds are
# not taken from the KB; ruff's default limits are used only as a proxy and are named where used.
meta:
  pr: 1016
  scanner_totals: {P1: 1, P2: 22, P3: 42, P4: 12, CODE-20_catchall: 18, errors: 0, scan_coverage: 1.0}
  scanner_note: >
    The scanner reads core/components/** as garura-prose (no grep rules, no code path rules), so the
    scripts under core/components/plays/*/scripts/ get no scanner hits; they were covered by ruff and the
    unittest suite instead. The scanner fires only on core/tools/plan/*.py (runtime-code) and its README.
    Most path-only rows (CODE-03/04/14, ARCH-02/03/08, CODE-09..13/15/17/19, DOC-*) fire on every matching
    file at line 1 by design; each was resolved below against a measurement.
runnable_checks:
  ruff_check:
    command: "ruff check <9 changed .py files>"
    version: "ruff 0.15.20, default rules (the repo commits no ruff config)"
    result: pass
    evidence: "All checks passed!"
  ruff_format_check:
    result: "not a finding"
    evidence: >
      5 of the 5 changed non-test scripts would be reformatted, but so would the unchanged neighbours
      (plan.py, plan_status.py, preflight.py, resolve_plan.py). The repo commits no formatter config, so
      CODE-04 has no standard to hold the diff to.
  unittest_start_change:
    command: "cd core/components/plays/start-change/scripts && python3 -m unittest test_start_change"
    result: pass
    evidence: "Ran 12 tests, OK"
  unittest_plan_tool:
    command: "cd core/tools/plan && python3 -m unittest test_plan test_plan_branch test_plan_status test_plan_land"
    result: pass
    evidence: "Ran 57 tests, OK"
  readme_flags:
    result: pass
    evidence: >
      Every flag in core/tools/plan/README.md exists. plan_branch.py go: --plan --plans-dir --ignore --out
      (plan_branch.py:328-334); back/abort: --record --ignore (336-344). plan_land.py ready: --plan --status
      --direction --template --plans-dir --ignore --out (175-185); check: --record --out (187,191);
      landed: --check --out (193,197). The README does not list --repo/--remote/--main/--date; they exist
      and have defaults. The README test command matches the four modules.
  other:
    - "create-play/references/setup_branch.py is byte-identical to start-change/scripts/setup_branch.py (cmp)."
    - "No skipped or disabled tests in the changed test files (grep skip/expectedFailure: none)."
    - "No import cycle: plan_land imports plan and plan_branch; neither imports plan_land."
    - "No TODO/FIXME in the changed scripts or the README. print() calls are the JSON/stderr interface of the CLIs."
