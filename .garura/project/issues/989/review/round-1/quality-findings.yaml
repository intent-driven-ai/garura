notes:
  # Observations that no taxonomy row can carry (the skill rejects findings without a row). For the human layers.
  - "plan_land.py:90-125 (ready): after `git merge --no-commit` succeeds, a failure in `git checkout HEAD -- <plan file>` or `git commit` raises Stop (exit 2) without `git merge --abort`, so the branch is left mid-merge. The clash path (lines 117-120) does abort. A re-run then stops on uncommitted work. Not covered by a test."
  - "plan_land.py:68-87 (set_fields): if the plan file has no top-level `updated:` line, none is added and nothing says so, though the README says `ready` writes `updated:`. `branch:` and `direction:` are inserted when missing. No test for the missing-`updated:` case."
  - "plan_branch.py:76-83 (git timeout): no test drives the TimeoutExpired branch (returncode 124)."
  - "Tests cover: stale copy deleted and cut fresh, stale copy with commits kept (test_plan_branch.py); ready/check/landed including clash, wrong branch, dirty tree, bad Status/Direction (test_plan_land.py); resolve_args, check_plan_start and the plan start through setup_branch (test_start_change.py). The `start == plan_branch` checkout inside drop_stale (plan_branch.py:243-244) has no direct test."
  - "core/tools/plan/README.md lines 60-62: the sentence added at line 60 runs on one over-long line and then wraps ragged; style only."
