  - id: G7
    principle: "The compiler writes ONE <play>/stop-condition.yaml whose content.done is the ICE's Done-means clause list, unchanged; the Standard Play Close checks 'the play's manifest' (the baked stop-condition.yaml)"
    source: "core/components/plays/create-play/SKILL.md @ plan/717/base line 345 'Add the stop condition (#464)'; core/components/plays/_shared/play-close.md @ plan/717/base lines 72 and 78"
  - id: G8
    principle: "A loop opens its change by running start-change as a sub-play; injected start-change opens any 'start'/'both' play; neither is told to hand start-change an input"
    source: "core/components/loops/_shared/loop-run.md @ plan/717/base Step R2 (line 61); core/components/loops/complete-discovery/SKILL.md @ plan/717/base Step 1 (lines 124-125); standards/rules/pipeline-position.md and standards/rules/loop-contract.md (memory tool, phoenix; copies in context/memory/grounding-harness/)"
  - id: G9
    principle: "The run's short-term folder for a run with no issue is the play's own working base under ${stm_base} (for example ${stm_base}_realize/<play>/)"
    source: "core/components/plays/_shared/play-close.md @ plan/717/base lines 50-51"
  - id: G10
    principle: "Choices, not gates"
    source: "GROUNDING UNAVAILABLE. No committed file on plan/717/base states it. No finding rests on it. Observation only: every new hard stop in start-change prints the one line saying what to do next."
