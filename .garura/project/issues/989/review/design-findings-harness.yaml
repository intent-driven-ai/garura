findings:
  - id: N1
    severity: P2
    file: "core/components/plays/start-change/stop-condition-plan.yaml (whole file); SKILL.md lines 32, 494; reference/ice.md lines 195-205"
    what_is_wrong: >
      The Done-means clauses are split across two hand-made manifests: D1-D4 in stop-condition.yaml and D5-D8 in a second
      file, stop-condition-plan.yaml. The compiler does not make a second file. Its rule is: write ONE stop-condition.yaml
      whose content.done is the ICE's clause list unchanged (create-play, 'Add the stop condition'). The next /edit-play
      of start-change reads an ICE whose Done means holds D1-D8 and writes all eight into stop-condition.yaml. Then every
      ordinary change (an issue start) must prove plan-branch.json and plan-start-check.json, which a change never makes,
      so it closes HALTED. The second file is left standing and unused, or removed. The linter does not notice: it checks
      only stop-condition.yaml, and it passes today. It works today only because nobody has recompiled.
    principle: "G3 and G7: what is baked to a play is emitted by the compiler from the ICE, so a rebuild reproduces it; the Standard Play Close checks the play's one manifest"
    source_ref: "CLAUDE.md @ plan/717/base 'Play Pipeline Rules' (durability rule); core/components/plays/create-play/SKILL.md @ plan/717/base line 345; core/components/plays/_shared/play-close.md @ plan/717/base lines 72, 78"
    fix_direction: >
      Either keep one manifest and make the ICE's Done means say which clauses belong to which path in a way the compiler
      and check_stop_condition.py both read (for example a 'path' tag on each clause), or teach create-play (and its
      linter rule) to write and check a second manifest, then recompile. Until then, record the gap where a rebuild will
      meet it.
  - id: N2
    severity: P3
    file: "core/components/plays/start-change/reference/ice.md lines 56-58 (C9), 103-107 (F9), 232-238 (REC9); SKILL.md line 244 (SE-10) and line 473 (F9 row)"
    what_is_wrong: >
      The new guarantee 'a closed plan's branch is never cut; an issue in a Done or Dropped plan starts off main' (C9, S13)
      has a scenario and a step eval (SE-10, tagged F9) but no failure condition names it. F9 lists a branch outside the
      plan, a cut without main first, and a stale local branch. F11 covers a closed plan only for 'plan <id>'. So an issue
      in a closed plan that is cut under the plan's branch (or a plan branch made for it) fails no F, has no recovery
      line, and lint_play passes because SE-10 carries an F9 label. The ICE and the SKILL agree 1:1 on counts, but this
      guarantee has no recovery.
    principle: "G3 (the compiled play carries one recovery per failure condition; the ICE is what was agreed)"
    source_ref: "docs/standards/harness-standard.md @ plan/717/base, principle 4"
    fix_direction: "Add the case to F9 and REC9 (or a new F), recompile."
  - id: N3
    severity: P3
    file: "core/components/plays/start-change/reference/ice.md lines 34-40 (C10), 169-172 (S11); SKILL.md lines 66, 87-102. Callers not in the diff: core/components/loops/_shared/loop-run.md line 61, core/components/loops/complete-discovery/SKILL.md lines 124-125"
    what_is_wrong: >
      (Carried from H4, not fixed.) A hard halt on nothing typed now stops any call that gives start-change no argument.
      The ICE says loops and injected plays 'pass the issue number (or a description), as it does today'. The committed
      callers show no such hand-over: loop-run R2 says only 'Run start-change as a sub-play: one issue, one branch for the
      whole loop', complete-discovery Step 1 says 'Run R2 of the shared run', the pipeline-position rule says 'resolve or
      create the issue', and the loop contract lists no start-change input. Before this PR a call with no argument did not
      stop. I could not prove a loop breaks (the argument may travel in the dispatch, which no file shows), but the claim
      in C10 is not backed by any committed text, and the first step of the loop people run most is the one that would stop.
    principle: "G8 (callers of start-change are written by their own files; a guarantee that changes for callers is stated there), and harness principle 1 (people run loops)"
    source_ref: "core/components/loops/_shared/loop-run.md @ plan/717/base line 61; loop-contract.md and pipeline-position.md (memory tool copies); docs/standards/harness-standard.md principle 1"
    fix_direction: "Say in loop-run R2 and the pipeline-position rule what is handed to start-change (the loop's typed words or issue), or run complete-discovery once to prove it; drop 'as it does today' from C10 if it is not true."
  - id: N4
    severity: P3
    file: "core/components/plays/start-change/SKILL.md lines 87-91"
    what_is_wrong: >
      The person's typed words are put straight inside double quotes on a shell line:
      resolve_args.py --args="<the play's arguments>". A description with a backtick (a file or function name in code
      quotes, common in an issue description) runs as a command and is replaced by its output; a double quote ends the
      string early; '$(...)' and '$VAR' expand. The typed change is then not the change the script reads, and a command
      the person never meant may run. Before this PR a description was written to a file by the orchestrator, not
      inlined in a command.
    principle: "G1 (a mechanical step gives the same answer every time; a script step must not depend on how the text is quoted)"
    source_ref: "docs/standards/harness-standard.md @ plan/717/base, principle 3 ('a script gives the same answer every time')"
    fix_direction: "Write the typed words to a file (or pass them on stdin) and give resolve_args.py the file, like work-description.txt."
  - id: N5
    severity: P4
    file: "core/components/plays/start-change/SKILL.md lines 153-156; scripts/resolve_args.py lines 101-104"
    what_is_wrong: >
      For mode issue the SKILL says '<working>/work-description.txt holds the issue's title and the typed note', and Step 1
      hands that path to project-orchestrator. resolve_args.py writes the file only for mode description, and no step
      writes it for mode issue. Step 5 moves it only 'when a description was typed'. So the contract names a file that
      does not exist at the time of dispatch.
    principle: "G1 and G3 (every file a step names has a writer; the SKILL says what the ICE agreed)"
    source_ref: "docs/standards/harness-standard.md @ plan/717/base, principles 2 and 3"
    fix_direction: "Have resolve_args.py write the note (and no title) for mode issue, or drop the sentence."
  - id: N6
    severity: P4
    file: "core/components/plays/start-change/SKILL.md lines 421-424 (Step C1) and 386-387 (SE-7)"
    what_is_wrong: >
      The evidence slots are still the change path's: 'artifacts produced: issue.json, branch.json, the STM workspace',
      'N/A - no commit step', 'run artifacts are committed on the feature branch'. A plan's start makes
      plan-branch.json, plan-start-check.json and args.json and commits nothing. The close block's comment now gives the
      plan path its paths and title (so H7 is fixed), but the artifact list a plan run's evidence prints is wrong.
    principle: "G9 (a run with no issue uses the play's own base and its own values)"
    source_ref: "core/components/plays/_shared/play-close.md @ plan/717/base lines 50-51"
    fix_direction: "Name the plan path's artifacts in Step C1 and scope SE-7's commit clause to the change path."
  - id: N7
    severity: P4
    file: "core/components/plays/start-change/SKILL.md lines 205-213; scripts/resolve_plan.py line 26 and create-play/references/resolve_plan.py line 26 (docstring); reference/ice.md lines 34-40 and 50-68"
    what_is_wrong: >
      Small drift. (a) Step 4 lists resolve_plan's record as { plan_id, plan_branch, issue_branch, source } and never
      mentions closed_plan, which SE-10 then checks; the docstring's 'Prints { ... }' also leaves it out. (b) Two new
      rules in the play (the change is what is typed, never the branch name; a closed plan's issue goes off main) have no
      decision record. ADR 061 covers the plan cut and 'a plan starts on its own' (#989), and ADR 060 / the ontology cover
      the closed-plan rule in spirit, so I rate it a nit, but C10 changes what every caller can rely on and is recorded
      only in the ICE.
    principle: "G3 and G5"
    source_ref: "docs/adr/061-... 'Work This Creates'; docs/adr/060-... Decision 1 @ plan/717/base"
    fix_direction: "Add closed_plan to the record text; note C10 in a short ADR or in ADR 061's follow-up when #989 closes."
