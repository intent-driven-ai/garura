# Layer 2 design-grounding for the 'harness' category, ROUND 2 (issue 896, PR 1003, base plan/717/base).
# Grounded only in committed sources: git show plan/717/base:<path> and the round-1 memory copies under
# context/memory/grounding-harness/. ADR 063 is new in this diff: read as the approved decision, not a standard.
# Scope (product owner, 2026-10-31): /shape-plan stops at pre-flight when the intent has a plan and points to
# /update-plan, plus the round-1 fixes. Out-of-scope notes are listed apart, with no severity.
category: harness
round: 2
principles:
  - { id: P-ICE, source: "docs/standards/harness-standard.md principle 4 (plan/717/base)" }
  - { id: P-SCRIPT, source: "docs/standards/harness-standard.md principle 3 (plan/717/base)" }
  - { id: P-DECISION, source: "docs/adr/049 header and docs/adr/062 (plan/717/base)" }
  - { id: P-CLOSE, source: "core/components/plays/_shared/play-close.md Steps L, C1, C2, 'evidence.record gate' (plan/717/base); standards/rules/evidence-recording.md (memory copy)" }
  - { id: P-NEXT, source: "standards/rules/pipeline-next.md (memory copy)" }
round1_resolution:
  HF-1: "resolved - ADR 063 amends ADR 049 Decision 1.2 and 2; ADR 049 header and the ADR index carry it. Residual (which play makes a later slice's epic) is the known /update-plan gap, not raised."
  HF-2: "resolved as a contradiction (SKILL.md lines 85 and 98 now say: no close, no task list, nothing opened); the way it was resolved raises NF-1."
  HF-3: "resolved - SKILL.md lines 338-341 now say a new run stops at pre-flight (C14); line 219-222 says the update actions are not reached. The other update wording is listed under outside_scope."
  HF-4: "resolved - pipeline-next.md (prose and the shape-slice next entry) and shape-slice/SKILL.md Next Steps name /update-plan."
  HF-5: "resolved - SKILL.md line 564 reads 7 autonomous / 5 human, equal to the ICE (REC1,3,4,7,8,10,11 / REC2,5,9,12,13)."
  HF-6: "resolved - Step C2 artifacts line is clean (SKILL.md line 499); F12 now stands before F13."
conformance_held:
  - "ICE-source discipline: ice.md sha256 equals the recorded fingerprint 1bd5350c...; the round-1 fix commit changed SKILL.md wording only, no guarantee of the ICE."
  - "Mechanical work is a script (check_plan_absent.py with tests); lint-play for shape-plan and shape-slice: PASS."
findings:
  - id: NF-1
    severity: P3
    file: core/components/plays/shape-plan/SKILL.md
    line: 85
    summary: >
      The round-1 fix for HF-2 settles the plan-exists stop as "No Standard Play Close runs" (lines 85 and 98:
      no close, no task list, nothing opened). The shared close (play-close.md) says Step L is not optional
      whenever C1 or C2 runs, that C2 "is always emitted - it is the user's surface", and sets the only skip
      cases (a sub-play, a loop); it has no exemption for a pre-flight stop. The ICE (C14, S9, F13, REC13) says
      "no file is left behind" but is silent on the close, so the choice to skip the evidence file and the
      delivery report lives only in the compiled file, and the play's Step 11 still says "A stop ... closes
      HALTED". The contradiction round 1 found is gone, but the play now opts out of the shared close with no
      basis in the ICE or in play-close.md.
    basis:
      principle: P-CLOSE + P-ICE
      source: "core/components/plays/_shared/play-close.md (Step L, Step C2, Cross-cutting rules, Sub-plays and loops) and docs/standards/harness-standard.md principle 4 (both on plan/717/base)"
    owner_note: "Either add the exemption to the ICE (C14/S9: the stop is reported by the check's message, with no close) and recompile, or keep the close and let the stop write only the evidence-recording record the shared close defines."
outside_scope:
  - "shape-plan/SKILL.md lines 219-232, 280, 305, 344 and ice.md C13/F12/S8: add-sections, move_out, moved_out and the misplaced stop are still written as live behaviour, beside the new note (line 219-222) that this play does not reach them."
  - "shape-eval/SKILL.md lines 187-188: 'no epic node: run /shape-plan first' sends the person to a play that stops when the plan already exists (a second slice)."
