- id: HF-1
  severity: P2
  file: core/components/plays/shape-plan/reference/ice.md
  line: 16
  summary: 'The change removes what ADR 049 decided (a new slice shaped for an intent that already has a plan is added to
    that plan, with its epic, by the plan play; the plan play runs right after /shape-slice) and records no ADR amendment.
    The diff changes no file under docs/adr. The stop message now sends the person to /update-plan to "add an epic", but the
    committed /update-plan ICE only places a new feature in a slice the plan already holds (C11), and ADR 062 names no play
    that makes the epic and the stories of a second slice. Nothing committed on the base ref shows a play that does this job
    after the change, so a second slice for an intent with a plan has no path to its epic, and /shape-eval ("run /shape-plan
    first" when no epic stands for a slice) has nothing to read.

    '
  basis:
    principle: P-DECISION + P-SHAPING-LOOP + P-UPDATE-PLAN-SCOPE
    source: docs/adr/049-a-slice-is-shaped-then-planned-then-given-its-eval.md Decision 1.2 and 2; docs/adr/062-... (pattern
      of recording an amendment); core/components/plays/update-plan/reference/ice.md C11 (all on plan/717/base)
  owner_note: The approved design (specs/design.md) states the decision; it is not an ADR and is not used as grounding. Needs
    either an ADR amending ADR 049 Decision 2 that says which play handles a second slice, or the confirmed fact that /update-plan
    makes that epic.
  category: harness
  source: design-findings-harness.yaml
- id: HF-2
  severity: P3
  file: core/components/plays/shape-plan/SKILL.md
  line: 85
  summary: 'The plan-exists stop says "close HALTED" and also "nothing was opened or written" and "no file left behind" (C14,
    F13, S9, SE-20, SCE-9). The Standard Play Close the play runs on any halt loads templates into short-term memory, writes
    the stop-condition record and the session-stamp marker, and writes the evidence file (unless evidence.record is false).
    The play does not say which close steps run on this stop, so "no file left behind" cannot hold if the close runs, and
    a stop that skips the close breaks the close rule. The delivery report''s Next line for shape-plan also reads "make the
    eval", which is the wrong pointer for this stop.

    '
  basis:
    principle: P-CLOSE
    source: core/components/plays/_shared/play-close.md Steps L, C0, C1, C2 (plan/717/base); standards/rules/evidence-recording.md
      (memory tool)
  category: harness
  source: design-findings-harness.yaml
