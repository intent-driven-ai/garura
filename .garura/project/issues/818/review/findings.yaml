  suggested_fix: Say 'this play works on GitHub only' when the platform is not GitHub.
  category: harness
  basis: see design-findings-harness.yaml
- id: NF-5
  severity: P4
  file:
  - core/components/plays/shape-plan/scripts/plan_common.py (_split, bold-label branch)
  principle: G2 - a 'Fails if' block is removed whole and nothing else is.
  principle_source: plan/788/base:docs/adr/052-shape-slice-writes-the-hidden-file-and-proposes-a-thin-ice.md
    (ICE impact)
  finding: For '**Fails if:**' followed by bullets with no blank line, the sibling
    bullet that follows (for example a Limit) is taken as part of the block and lost
    from the clean copy. Tested. It fails closed (story text lost, never leaked).
