findings:
- id: NF-1
  severity: P3
  file:
  - core/components/skills/platform-adapter/SKILL.md (Input table, Step 2 'Unknown
    verb' text, Constraints)
  - core/components/skills/platform-adapter/reference/github/verbs.md
  - core/components/skills/platform-adapter/reference/gitlab/verbs.md
  principle: G7 - the adapter skill page is the stated verb interface and says 'NEVER
    add verbs beyond the 16 defined above without a schema change'; its own steps
    look a verb up in reference/{platform}/verbs.md.
  principle_source: plan/788/base:core/components/skills/platform-adapter/SKILL.md
    (Constraints, Step 2, Step 3)
  finding: 'Round 2 changed the description and the verb table to 21 verbs but left
    four statements that say 16: the Input row (''One of the 16 supported verbs''),
    the Step 2 ''Unknown verb'' list (16 names), and the Constraint ''NEVER add verbs
    beyond the 16 defined above''. It also added no section for the five verbs to
    reference/github/verbs.md or reference/gitlab/verbs.md, so an agent that follows
    the skill (Step 2) halts with ''Unknown verb'' for create-issue-typed, set-issue-type,
    edit-issue-body, remove-label and remove-sub-issue. The script and the page now
    disagree. The edit reaches every play that holds an adapter copy (check-change,
    merge-change, propose-change, shape-slice, shape-plan, create-play reference);
    the 16 old verbs are unchanged there, so those plays are not broken.'
  suggested_fix: 'Change the three ''16'' statements to 21 (or drop the number), add
    the five names to the Step 2 list, add one section per verb to both verbs.md files
    (GitLab: the stop message), and say in the Constraint that these five were added
    with the #818 change.'
  category: harness
  basis: see design-findings-harness.yaml
- id: NF-2
  severity: P3
  file:
  - core/components/plays/shape-plan/SKILL.md (Step 6, Pre-flight 'Clean plans tree',
    Step 9)
  - core/components/plays/shape-plan/scripts/write_work_items.py (main, write_slice)
  principle: G1 - a second run makes no copies; the marks that make that true must
    be where the next run reads them.
  principle_source: 'plan/788/base:core/components/memory/standards/schemas/product-os/ontology.md
    (Plan rules: finds the work items that exist before it creates new ones)'
  finding: 'Two gaps in the part-way recovery that round 2 added. (a) After exit 1
    the play runs Step 7 (plan file marks the created issues) and closes HALTED; Step
    9 (the commit) runs only on a completed path. The marked plan file is left uncommitted,
    and the next /shape-plan run halts at the ''Clean plans tree'' pre-flight (REC7).
    The text gives the person no instruction to commit or keep it; if they discard
    it to get past the halt, the next run makes copies. (b) write_work_items.py starts
    the record with ok:true and sets ok:false only for a TrackerError. I ran it with
    a tracker whose read fails after the epic is made (HostTracker.get returns None
    on any adapter error): TypeError, exit 1 from Python, and the record on disk reads
    ok:true, failed:null with the epic in created. Step 6 says exit 1 means ok:false,
    so the two disagree.'
  suggested_fix: (a) Say in Step 6 what the person does with the marked plan file
    (commit it on the change branch, then run again), or let Step 9 commit it when
    the record lists issues. (b) Start the record ok:false and set ok:true at the
    end, or catch every exception in main and write ok:false with the step; make HostTracker.get
    raise instead of returning None on an adapter error other than 'not found'; add
    a test.
  category: harness
  basis: see design-findings-harness.yaml
- id: NF-3
  severity: P3
  file:
  - core/components/plays/shape-plan/SKILL.md (SE-3, SE-8, SE-12, Step 1, Step 3,
    Step 6, Pause and Resume)
  - core/components/plays/shape-plan/reference/ice.md (unchanged since 524c674d)
  principle: G8 - a change to the flow or the evals of a play is made in its ICE and
    recompiled; the compiled SKILL.md is not hand-edited for it.
  principle_source: plan/788/base:CLAUDE.md Play Pipeline Rules ('Intent change ...
    agent/skill flow, or evals ... MUST go through the play's ICE source'); plan/788/base:docs/standards/harness-standard.md
    principle 4
  finding: 'Commit 5be53dbb changed the compiled SKILL.md only. It adds evals and
    flow the ICE does not hold: SE-8 and SE-12 now require the sha256 of brief, work-items.json
    and drafts.json; SE-3 now covers nested Fails-if blocks and ICE page names in
    skill-input.json; the skill reads skill-input.json instead of gather.json; Step
    6 and Pause and Resume require a record after every write. ice.md has none of
    these words (grep: no sha256, skill-input, or per-write record) and its hash still
    equals the fingerprint in SKILL.md, so the fingerprint says ''no drift'' while
    the evals have drifted. The next /edit-play rebuild from ice.md drops them. This
    is the pattern the rule and the fingerprint exist to stop; the play is new in
    this PR, so it is not yet in use.'
  suggested_fix: Put the five guarantees into reference/ice.md (C8 and C5 text, a
    scenario or done-means line for the hash tie and for the record after every write),
    rebuild with /edit-play, and take the hand edits as the check.
  category: harness
  basis: see design-findings-harness.yaml
- id: NF-4
  severity: P4
  file:
  - core/components/plays/shape-plan/scripts/plan_common.py (HostTracker.get)
  principle: G7 - the adapter's GitHub-only verbs stop plainly on GitLab.
  principle_source: plan/788/base:core/components/plays/create-play/references/platform_adapter.py
