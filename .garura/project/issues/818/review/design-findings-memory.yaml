- id: P-B
  principle: A play's close names only its own successor from the map; where the map names none, no Next
    line is printed and nothing else is pointed to.
  source: 'plan/788/base:docs/adr/051-the-next-play-is-dropped-the-plan-is-the-work-list.md (Decision
