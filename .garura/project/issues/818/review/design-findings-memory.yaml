    copied to grounding-memory/'
- id: P-D
  principle: The play is named /shape-plan and takes the business intent's issue number; the eval play
    (#798) is later in the loop.
  source: plan/788/base:.garura/product/product-os/software-delivery-planning/cap-718/fn-818/feature.md
