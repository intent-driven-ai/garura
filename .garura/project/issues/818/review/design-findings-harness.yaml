grounding_sources_used:
- id: G1
  principle: The plan finds the work items that exist before it creates new ones; a second run makes no
    copies.
  source: plan/788/base:core/components/memory/standards/schemas/product-os/ontology.md (Plan rules; Epic
    rules; Story rules)
- id: G2
  principle: No failure or recovery condition reaches the story, the epic or the builder; each ICE line
    has one reader.
  source: plan/788/base:docs/adr/049-a-slice-is-shaped-then-planned-then-given-its-eval.md (Decision 4);
    plan/788/base:docs/adr/052-shape-slice-writes-the-hidden-file-and-proposes-a-thin-ice.md (ICE impact)
- id: G4
  principle: Plays orchestrate, agents gather context, skills write content, mechanical work is a script.
  source: plan/788/base:docs/standards/harness-standard.md principles 2 and 3
- id: G6
  principle: A pinned one-way-door checkpoint always fires; no config value turns it off.
  source: 'memory: standards/rules/gate-config.md (Phoenix 3161dcdfe26f); copy .garura/project/issues/818/context/memory/grounding-harness/standards/rules/gate-config.md'
- id: G7
  principle: The code-host adapter is the one fixed-command-per-verb, config-switchable library; its skill
    page is the stated verb interface.
  source: plan/788/base:core/components/plays/create-play/references/platform_adapter.py (docstring);
    plan/788/base:core/components/skills/platform-adapter/SKILL.md (Verb Interface, Step 2, Constraints)
- id: G8
  principle: A change to what a play guarantees (constraints, failures, scenarios, flow, evals) is made
    in its ICE and recompiled; never a hand edit of the compiled SKILL.md.
  source: plan/788/base:docs/standards/harness-standard.md principle 4; plan/788/base:CLAUDE.md Play Pipeline
    Rules
- id: G9
  principle: A run that fails part way must leave a record the next run can act on; plays halt when preconditions
    (clean plans tree) fail.
  source: the play's own Pre-flight is NOT used as grounding; principle is G1 (no copies on a second run)
    read with the base ontology Plan rules
