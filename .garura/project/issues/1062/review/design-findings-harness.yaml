category: harness
grounding:
  - principle: "A change to what a play decides or guarantees (intent, C-, F-, S-, flow, evals) goes through its reference/ice.md and /fix-play; a non-intent change is a direct edit of SKILL.md."
    source: "main:CLAUDE.md, 'Play Pipeline Rules'"
  - principle: "The model holds no tracker issue; the links run one way, from the work side (plan files, tracker) to the model; /design-slice and /reshape-plan read the plan file, not the model."
    source: "main:docs/adr/069-the-plan-is-where-the-product-model-meets-the-work.md Decision 2 and section 5"
  - principle: "No SKILL.md carries deviation notes or change logs."
    source: "main:CLAUDE.md, 'Play Pipeline Rules' (direct-edit history goes in the commit and the issue)"
answers:
  reshape_plan_skill_md_edit_non_intent: "Yes. The edit changes one sentence of the placement step: the capability is found from the plan file's `represents` rather than from a shared issue number in the model. reference/ice.md (main) holds no line on that lookup (C11, F10 and S6 do not name it) and the diff does not touch ice.md. It changes no guarantee, decision or eval, so a direct edit is correct. The behaviour that the ICE promises (a new feature is placed, or the person is asked) is unchanged."
  reshape_plan_scripts_non_intent: "Yes. feature_ice.py, place_feature.py and plan_common.py (three identical copies) change only where an issue number or capability is read from; tests are updated to match (a story found only through the plan file; the model's old issue number is not read)."
  step_1_finding_DG_H_4_closed: "Yes. Step 1 found that reshape-plan still read the model's `issue` (place_feature.py, feature_ice.py). This diff moves those reads to the plan file, with a test on a spine that has `issue` and a plan node with none. The remaining `.get(\"issue\")` reads in plan_common.map_pairs are on plan-side feature entries, not the model, as its new docstring says."
findings:
  - id: DH-1
    severity: P4
    file: core/components/plays/reshape-plan/SKILL.md
    principle: "Surface prose of a compiled play stays readable; non-intent edits are direct (CLAUDE.md Play Pipeline Rules)"
    basis: "main:CLAUDE.md 'Play Pipeline Rules'; the added line in the diff (the 'the slice the plan holds when exactly one serves `bi-<id>`' clause now sits on one very long line after the rewrap)"
    detail: "Cosmetic: the placement paragraph has one overlong line after the edit. No rule is broken and the linter passes (lint-play PASS, recorded)."
    suggested_fix: "Rewrap the line at the next edit of that paragraph; not worth a push on its own."
    blocks_merge: false
    category: harness
    layer: 2
