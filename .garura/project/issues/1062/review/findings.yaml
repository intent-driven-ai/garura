- id: DG-H-4
  severity: P3
  file: core/components/plays/reshape-plan/scripts/place_feature.py
  principle: The links run one way, from the work side to the model; a spine entry holds no issue number (ADR 069
    Decision 2). Readers of the spine must not need one.
  basis: main:docs/adr/069-the-plan-is-where-the-product-model-meets-the-work.md Decision 2 ('The links run one
    way'; 'No spine entry holds an issue number'); core/components/plays/reshape-plan/scripts/place_feature.py lines
    73-81; feature_ice.py lines 93 and 109; plan_common.py line 700
  detail: 'Writers stop; readers do not. place_feature.py builds `by_issue` from each capability''s spine `issue`
    to place a new feature under the capability whose tracker issue is its story''s parent; feature_ice.py find
    reads feature `issue` first (falling back to the plan file''s `represents`) and returns `story: f.get(''issue'')`;
    plan_common.map_pairs reads `f.get(''issue'')`. When step 2 strips `issue` from Garura''s model, the capability
    lookup silently finds nothing (the person is asked instead) and `story` returns null. The change is not wrong
    today, but it leaves reshape-plan reading a field the model is no longer to hold.'
  suggested_fix: Before or with step 2, move these reads to the plan file's nodes (`represents`) as feature_ice.represented_by
    already does, and add a test with a spine that has no `issue`.
