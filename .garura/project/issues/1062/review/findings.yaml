  principle: A change to what a play guarantees goes through its ICE; the script and the ICE must agree. ADR 069
    says a box-move writes no decision record, but sequences that through /fix-play.
  basis: 'main:CLAUDE.md ''Play Pipeline Rules'' (intent change = ICE then /fix-play); core/components/plays/specify-capabilities/reference/ice.md
    lines 108-110 (C8: each box-move ''is written as its own product-level decision (ADR), linked to its capability'')
    and line 252 (F8); main ADR 069 ''Work This Creates'' (/fix-play on /specify-capabilities)'
  detail: The script no longer adds the decision id to the capability's `decisions` list (a guaranteed link in C8)
    yet still writes one decision record per box-move into the model's decisions folder, so it now matches neither
    the ICE (link required) nor ADR 069 (no record at all). Its docstring now says 'no spine entry gets a `decisions`
    list'. This is a half step; the play's ICE is unchanged.
  suggested_fix: Either do the ICE change and /fix-play of /specify-capabilities in the same series (C8 and F8 reworded,
    then the record dropped), or record in the PR that the ICE rebuild is the owed step 3 and keep the C8 'linked'
    wording flagged as stale.
