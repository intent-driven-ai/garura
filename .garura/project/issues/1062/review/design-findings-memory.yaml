answers:
  keeps_model_free_of_tracker_issues_and_decisions: "The change removes the `decisions` field from the domain, capability and feature entries and adds a rule header naming ADR 069 and ontology v18; created_by and updated_by are described as 'the play or agent and what it did'. It matches ADR 069 for those fields. The schema still defines `epics` with `issue_ref` and the decisions/ folder (DG-M-1)."
findings:
  - id: DG-M-1
    severity: P3
    file: core/components/memory/standards/schemas/product-os/spine.yaml
    principle: "The spine has no `epics` list, no `issue_ref`, no decisions folder (ADR 069 Decision 2 and 8)"
    basis: "main:docs/adr/069-the-plan-is-where-the-product-model-meets-the-work.md Decision 8 ('The spine's `epics` list') and Decision 2 ('the spine has no `epics` list'); spine.yaml lines 43-46 (the new header) against lines 218-231 (`epics` with `issue_ref`) and the layout comment naming `decisions/` (about line 284)"
    detail: "The new header says no entry or metadata names an epic, a tracker issue or a decision record, but the same file still defines an `epics` list whose entries carry `issue_ref: GitHub issue`, and still documents the `decisions/` folder. A schema that states a rule and then breaks it in its own body is internally inconsistent. ADR 069 sends this part through /specify-ontology, so the leftover is expected, but the header reads as if it were done."
    suggested_fix: "Word the header as 'ADR 069 target; the `epics` list and `decisions/` folder below go with the /specify-ontology change', or remove them in the follow-up with the ontology change. Do not claim the rule is in force while the schema allows the opposite."
    blocks_merge: false
    category: memory
    layer: 2
  - id: DG-M-2
    severity: P4
    file: core/components/memory/standards/rules/direct-model-write.md
    principle: "No decision record lives in the model (ADR 069 Decision 2); standards must agree with accepted ADRs"
    basis: "main:docs/adr/069-... Decision 2 and 'Work This Creates' (the /design-adr exception names docs/adr/ only); the committed rule (read through the memory tool) lines 22, 35, 140-154 still list `decisions/` as model content"
    detail: "Grounding gap, not in this diff: the standard that a reviewer reads still describes decisions/ as part of the model, so it cannot ground this review and will mislead builders until ADR 069's follow-up lands."
    suggested_fix: "Update the rule with the /specify-ontology and standards follow-up; no change in this PR."
    blocks_merge: false
    category: memory
    layer: 2
