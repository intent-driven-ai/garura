capabilities:
- id: abandoned-carts-today
  slug: abandoned-carts-today
  domain: ecommerce
  intents:
  - fewer-sales-lost-to-abandoned-carts
  status: proposed
  detail: detailed
  one_line: Shows each shop owner which carts their customers left behind today without
    buying.
  doc: ecommerce/abandoned-carts-today/capability.md
  depends_on: []
  decisions: []
  personas: []
  journeys: []
  metadata:
    created_by: /intent
    updated_by: /intent
    version: 1
  nfr_needs:
    accuracy:
      level: high
      target: 0 carts wrongly shown as abandoned and 0 abandoned carts missing, against
        the shop's cart and order records
      gate: fixture-shop comparison in CI plus a daily reconciliation of the list
        against the shop's records
    performance:
      level: medium
      target: list opens within 2 s at p95 for a shop with 1,000 abandoned carts in
        a day; a new order or abandoned cart shows within 5 minutes
      gate: load test at 1,000 carts/day plus a freshness check on the updated-at
        time
    security:
      level: medium
      target: an owner can read only their own shop's carts; 0 cross-shop rows returned
      gate: 'shop-isolation test: owner of shop A requests shop B''s list and is refused'
    privacy:
      level: medium
      target: customer names and cart contents are shown only to the signed-in owner
        of that shop; no export or sharing path exists
      gate: access review of the list's data paths plus the shop-isolation test
  compliance_needs: []
- id: abandoned-cart-reminders
  slug: abandoned-cart-reminders
  domain: ecommerce
  intents:
  - fewer-sales-lost-to-abandoned-carts
  status: proposed
  detail: detailed
  one_line: Lets a shop owner remind the customer behind an abandoned cart to come
    back and finish the order, in a single click.
  doc: ecommerce/abandoned-cart-reminders/capability.md
  depends_on: []
  decisions: []
  personas: []
  journeys: []
  metadata:
    created_by: /intent
    updated_by: /intent
    version: 1
  nfr_needs:
    privacy:
      level: high
      target: 0 reminders sent to a customer without a current, unwithdrawn opt-in
        to that shop; every reminder carries a working one-click opt-out; return links
        and the reminder record hold no email address or message text
      gate: table-driven eligibility tests over every consent state + read-failure
        case, and an audit of sent reminder entries against consent records showing
        zero violations
    reliability:
      level: medium
      target: 'one owner click yields at most one reminder: 0 duplicate sent reminders
        per cart under double-click, concurrent tabs, reload or retry; 100% of sent
        reminders have a sent entry in the record'
      gate: idempotency tests (double, concurrent, retried requests) + click-to-record
        reconciliation in end-to-end tests
    performance:
      level: medium
      target: owner sees the outcome (sent, or blocked with reason) within 2 s of
        the click at p95
      gate: end-to-end timing test of the remind action at expected shop load
    security:
      level: medium
      target: 100% of remind requests for a cart outside the signed-in person's shop,
        or from a signed-out session, are refused; a shop reads only its own reminder
        entries
      gate: authorization and shop-isolation tests, plus a return-link tampering test
    observability:
      level: medium
      target: every remind attempt is recorded with shop, cart, customer reference,
        owner, time, outcome and reason before the owner sees the outcome
      gate: record-completeness check comparing clicks to entries in end-to-end tests
  compliance_needs: []
- id: carts-won-back
  slug: carts-won-back
  domain: ecommerce
  intents:
  - fewer-sales-lost-to-abandoned-carts
  status: proposed
  detail: detailed
  one_line: Counts the reminded carts that end in an order and the sales they win
    back, month by month, so owners and the business can see whether fewer sales are
    being lost.
  doc: ecommerce/carts-won-back/capability.md
  depends_on: []
  decisions: []
  personas: []
  journeys: []
  metadata:
    created_by: /vision
    updated_by: /vision
    version: 1
  nfr_needs:
    reliability:
      level: medium
      target: A closed month recomputed from the same cart, reminder and order records
        gives identical figures (0 differences); each month closes within 24 hours
        of its win-back window ending
      gate: Recompute-and-diff check on every month close + reconciliation fixture
        run in CI
    observability:
      level: medium
      target: 100% of counted orders carry cart id, order id and (when reminded) reminder
        id; 0 orders matched to more than one cart; every change to a closed month
        has a dated correction record
      gate: Automated completeness and double-count check at month close + reconciliation
        fixture
    security:
      level: medium
      target: '0 cross-shop reads: an owner can open only their own shop''s win-back
        figures; the business summary opens only for business-wide roles'
      gate: Authorization test suite covering every win-back view with two shops and
        an owner-vs-business role pair
    privacy:
      level: medium
      target: 0 shopper personal fields (name, email, phone, address) in any win-back
        figure, order list or summary; matching uses cart id only
      gate: Field-scan test over every win-back output against a fixture holding each
        personal field
    performance:
      level: low
      target: Owner's month-by-month view loads in under 3 s at p95 for a shop with
        24 months of history
      gate: Load test with a seeded 24-month shop
  compliance_needs: []
