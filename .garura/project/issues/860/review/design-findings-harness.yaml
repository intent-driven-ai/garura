findings:
  - id: R1
    severity: P3
    file: docs/adr/055-installed-parts-read-only-installed-files.md
    line: 8
    also: [core/components/plays/record-decision/reference/ice.md (C2, F2, REC2), core/components/plays/record-decision/SKILL.md (fingerprint)]
    what_is_wrong: >
      ADR 055's ICE-impact line names check-change as the play whose guarantees change, says discover-intent and shape-slice change
      in wording only, and says other plays get direct edits to path text that change no guarantee. Commit 54191c55 changed
      record-decision's ICE: C2 now says the play asks template-manager for the ADR template and hands the copy to adr-keeper, F2 gained
      a clause (the template did not come from template-manager), REC2 changed, the fingerprint was recomputed and a utility agent was added.
      That is an intent change to a play, and the record that justifies the branch does not name it.
    basis: "G8 (CLAUDE.md base lines 93-114: an intent change alters what a play decides or guarantees; harness-standard base lines 138-140: the change is recorded). The change itself followed the ICE route; only the record is incomplete."
    suggested_fix: add record-decision (C2, F2, REC2) to the ICE-impact line and the Affects list of ADR 055.

  - id: R2
    severity: P4
    file: core/components/skills/check-pr-quality/SKILL.md
    line: 46
    also: [core/components/skills/check-pr-quality/reference/input-contract.md:9, core/components/agents/quality-auditor.md:99]
    what_is_wrong: >
      The restored guard (at least one entry of standards_order resolves to a short-term copy) cannot fail in a run that passed the taxonomy
      guard: quality-auditor puts the taxonomy copy first in standards_order, and that copy must already exist. So the old halt
      "no standards source resolvable" is always true, while FS-4 still reads as a live failure.
    basis: "G10 (a skill's input contract and its guards are its public interface); the base pre-flight table required a standards source besides the severity table."
    suggested_fix: require at least one quality-standards entry after the taxonomy copy, or say plainly that taxonomy-only is allowed and drop FS-4.
