principles:
  - id: G1
    text: A play is a pure workflow and reads no memory; its sub-agents read memory only through the memory tool; a skill reads only what its agent puts in short-term memory.
    source: docs/adr/039-memory-writes-go-to-short-term-memory-plays-read-no-memory.md (base) lines 48-55; docs/adr/035-agents-work-only-from-memory.md (base) lines 61-66
  - id: G2
    text: The install lays the tool and checks that it runs. Whether the tools folder is kept out of git was left open.
    source: docs/adr/038-install-brings-no-memory.md (base) lines 24-27, 77; docs/adr/039 (base) lines 94-96
  - id: G3
    text: .garura/ in Garura's repository is the installed copy; it changes only when an install is asked. The source is core/.
    source: docs/adr/040-config-source-is-core-config-yaml.md (base) lines 37-41
  - id: G4
    text: A concurrent read-only fan-out is allowed only if each sub-task writes only its own output path.
    source: core/components/memory/standards/rules/concurrent-fanout.md (base) lines 12-27
  - id: G5
    text: One owner for every template (template-manager); a play or agent names the template, template-manager loads it.
    source: docs/adr/039 (base) lines 110-116; core/components/agents/template-manager.md (base) lines 5, 22, 28
  - id: G6
    text: A block that several parts share lives once in a common file the parts point to, and is linted.
    source: docs/adr/039 (base) lines 118-125; docs/adr/054 (base) line 48; CLAUDE.md (base) lines 116-124
  - id: G7
    text: Mechanical work is a script, judgment is a model.
    source: docs/standards/harness-standard.md (base) lines 42-48
  - id: G8
    text: A change to what a play decides or guarantees goes through its ICE source and recompiles with the ICE fingerprint; non-intent edits are direct. A decision record states its effect on the plays truthfully.
    source: CLAUDE.md (base) lines 93-114; docs/standards/harness-standard.md (base) lines 50-58, 138-140
  - id: G9
    text: Each principle of the harness standard names the ADR it comes from.
    source: docs/standards/harness-standard.md (base) lines 3-5
  - id: G10
    text: An agent contract is JSON of paths; a skill's input contract is its public interface. Harness review checks play->agent->skill->script wiring and ICE-source discipline.
    source: docs/adr/016-agent-json-contract.md (base); memory copy knowledge/review/harness.md lines 22-40

