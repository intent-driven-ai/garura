- id: H1
  severity: P2
  file: core/components/plays/install-garura/scripts/tools_system.py
  line: 13
  also:
  - installer/install.sh:226-239
  - core/tools/lint-components/package.json
  what_is_wrong: 'The installed component linter cannot run in a product project that
    installs through the public installer. tools_system.py lays lint-components "with
    its node_modules, so a Node tool runs with no install step", but node_modules
    is git-ignored (.gitignore:24, git ls-files shows 0 tracked files) and install.sh
    downloads the GitHub archive of the git tree, so the archive has no node_modules.
    The tool requires js-yaml (parse-frontmatter.js:3, naming.js:8, structural.js:5),
    so it fails with module-not-found. check-change C12 only handles "tool not installed";
    a laid tool that crashes is neither a pass nor "not installed". It works in Garura''s
    own checkout only because node_modules happens to exist there. The install also
    runs no check that the laid tools run.

    '
  basis: 'G2 (ADR 038 s1: the install checks that the tool runs); G1 install purpose.
    Product-project failure is the very case the branch exists to fix.'
  suggested_fix: lay or install js-yaml at install time (npm ci in tools_system, or
    vendor it), and have the install run each tool's smoke check.
  category: harness
- id: H2
  severity: P2
  file: core/components/plays/check-change/SKILL.md
  line: 178
  also:
  - core/components/plays/check-change/reference/ice.md:86-93 (C12)
  - core/components/memory/knowledge/review/harness.md:25-30
  what_is_wrong: 'Layer 1 for harness now lints the installed copy (--layout installed
    --target .claude, and <installed play>/SKILL.md), not the PR''s changed files.
    In Garura''s repo the PR changes core/components/**, and .claude is a git-ignored
    copy of the last install; check-change does not install, compare to the PR head
    or bound the lint to the changed paths (SKILL.md Step 1 says everything downstream
    is bounded to changed_paths). A broken change passes if the install is old, and
    a missing install yields only "not installed". C12 also forbids naming Garura''s
    source, but the source folders are the thing under review (the s5 exception for
    "folders of the repository under review" was not applied to the lint target).

    '
  basis: 'G3 (ADR 040 s2: the installed copy changes only when an install is asked,
    so it is not the PR); harness playbook Layer 1 (lint the changed plays); check-change
    Step 1 bound.'
  suggested_fix: pass the changed play paths and a source target to the installed
    tools (--layout source --target core/components), or have the play prove the install
    matches the PR head before it trusts the result.
  category: harness
- id: H3
  severity: P2
  file: core/components/agents/change-reviewer.md
  line: 88
  also:
  - core/components/agents/change-reviewer.md:120 (Grounding row)
  - core/components/plays/check-change/SKILL.md:197-206 (C11 fan-out)
  what_is_wrong: 'The new Memory Reading Protocol makes every grounding dispatch copy
    standards and shelves into the same <issue folder>/context/memory/<path as found>
    and record each source in the single shared <issue folder>/context/memory/manifest.json.
    Layer 2 runs one change-reviewer per design-bearing category concurrently. Parallel
    read-modify-write of one manifest.json (and same-file copies) can lose entries
    or corrupt the JSON, and the traceable memory source is the point of the manifest.
    The same file already says "write only that one file - never a shared file".

    '
  basis: 'G4 (concurrent-fanout.md condition 2: distinct output paths; change-reviewer.md
    base lines 58-64).'
  suggested_fix: copy all grounding memory once in the serial assessment step, or
    give each dispatch its own manifest path (for example manifest-<category>.json).
  category: harness
- id: H4
  severity: P3
  file: core/tools/lint-play/lint_play.py
  line: 331
  also:
  - core/components/plays/create-play/scripts/lint_play.py:331
  - core/components/plays/edit-play/scripts/lint_play.py:331
  what_is_wrong: 'The tool that is laid in every project still finds the Next-line
    map by joining a memory folder path (<play>/../../memory/standards/rules/pipeline-next.md)
    and silently skips the Next-line check when it is absent. That is a memory read
    by folder path inside an installed tool, built from path pieces so installed-paths/source-path
    cannot see it. In an installed layout the folder never exists, so any caller that
    omits --next-map gets a skipped check reported as clean.

    '
  basis: 'G1 (ADR 035 s4 / ADR 039 s2: memory is read through the tool, never by a
    path); a silent skip conflicts with C12 "never a pass".'
  suggested_fix: make --next-map required for the installed tool (exit 2 without it)
    and drop the path fallback; keep the fallback only in the source-only copies if
    wanted.
  category: harness
- id: H5
  severity: P3
  file: core/components/plays/check-change/SKILL.md
  line: 169
  also:
  - core/components/plays/check-change/SKILL.md:224
  - core/components/agents/change-reviewer.md:185-186
  what_is_wrong: 'The play itself reads the playbook copies in review_shelf to decide
    each category''s layers ("the play reads each category''s treatment from those
    copies"). The copies sit in short-term memory, but they are memory content, and
    the play is the reader. ADR 039 s2 says a play reads no memory and gets what it
    needs from its sub-agents.

    '
  basis: 'G1 (ADR 039 s2 lines 48-55). Mitigation noted: the memory guide treats a
    play''s own working files as not a lookup, so this is a judgment call; the clean
    form is for change-reviewer to write the treatment (layers, linters, design-grounding
    yes/no) into categories.yaml.'
  category: harness
