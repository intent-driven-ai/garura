  what_is_wrong: 'Two blocks are now pasted word for word into 7 and 5 agents (product-os-keeper
    already carried the protocol on the base ref). Fixing one means editing every
    copy, and nothing lints that they stay equal. The failure format was a pointer
    to a file that was never installed (structured-failure-protocol.md); inlining
