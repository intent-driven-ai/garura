# Layer 2 design-grounding, category: memory. PR #864, issue #860, base plan/788/base (origin/plan/788/base 6c667a70).
# Changed artifacts: core/components/memory/knowledge/review/harness.md, core/components/memory/knowledge/review/memory.md
# Both are review playbooks (Phoenix-memory seed). The change replaces source-repo tool paths with installed-tool paths.
category: memory
principles:
  - id: G1
    text: "Only agents call the memory tool; memory is read through it, never by a path. A play reads no memory; a skill reads only what its agent puts in short-term memory."
    source: "docs/adr/039-memory-writes-go-to-short-term-memory-plays-read-no-memory.md (base) section 2, lines 48-55; docs/adr/035-agents-work-only-from-memory.md (base) section 4"
    also: ".claude/rules/garura-memory.md (base) lines 3-8"
  - id: G2
    text: "The installed tool folder is .garura/core/tools/, and at the base it holds the memory tool only."
    source: "docs/adr/039-... (base) section 5, tree at lines 76-90 ('tools/ # the memory tool'); core/components/plays/install-garura/SKILL.md (base) line 74 (lays .garura/core/tools/memory/ only)"
  - id: G3
    text: "Components deploy into the target's .claude/ (Claude Code) or .agents/skills/ (Codex CLI); a tool-neutral document must not assume one."
    source: "CLAUDE.md (base) line 27"
  - id: G4
    text: "A gap is reported, never hidden or filled with a default (no unbacked recommendation: the gap is reported, an invisible gap is the same failure one step later)."
    source: "core/components/memory/standards/rules/no-unbacked-recommendation.md (base) lines 3-5, 24-26, 37-38"
  - id: G5
    text: "Memory is reviewed against the committed knowledge-base design, and a playbook states a gap honestly (the memory playbook's own 'Gap' rule: memory-integrity linting is partial, cross-reference check to be built)."
    source: ".garura/project/issues/860/context/memory/knowledge/review/memory.md (Phoenix 2f68683b1e44, tier phoenix) Treatment, Linter bullet, lines 21-30; core/components/memory/knowledge/_DESIGN.md (base)"
conformance_ok:
  - "harness.md:25-28 hands lint_play.py the Next-line map as 'the short-term copy of standards/rules/pipeline-next.md'. That matches G1 (memory arrives through the memory tool into short-term memory, not by a path)."
  - "harness.md:32-33 records 'not installed' for a missing tool and goes on. That reports the gap (G4); it does not hide it."
  - "Neither file now names a path into core/components/ or core/tools/ for a linter; the playbooks stay free of memory-by-path reads (G1)."
grounding_unavailable:
  - id: GU1
    note: "Placing lint-components and lint-play under .garura/core/tools/ is not in any committed source at the base: ADR 039 section 5 and the base installer put only the memory tool there (G2). The only record that sanctions it is ADR 055 and the new tools_system.py, both added by this branch, so they cannot ground it. No base principle is violated, but none supports it either. This is a decision for a person to accept, not something this review can confirm."
findings:
  - id: M1
    severity: P3
    file: core/components/memory/knowledge/review/harness.md
    line: 29
    what: "The linter command is `--layout installed --target .claude`. That hard-codes Claude Code's install folder in a shelf that every project reads from Phoenix memory. A Codex project installs to .agents/skills/, so this command checks nothing there (the same tool's own comment says the installed layout is '.claude or .agents')."
    basis: "G3: CLAUDE.md (base) line 27 names both .claude/ and .agents/skills/ as deploy targets."
    suggestion: "Say 'the installed target folder (.claude or .agents)' instead of the literal .claude."
  - id: M2
    severity: P3
    file: core/components/memory/knowledge/review/memory.md
    line: 28
    what: "The Gap sentence now says the installed `.garura/core/tools/lint-components` 'covers some shape' of memory integrity. The installed layout lints parts under .claude or .agents; shelf files live in memory and are reached only through the memory tool, so the installed tool cannot reach them. The base lint-components has no knowledge-shelf or memory rule. The claim was already loose; the edit adds an installed path to it and makes it read as a working check."
    basis: "G5 (the playbook's own honest-gap rule); G1 (memory is not read by a path, so a path-based linter cannot be the memory check)."
    suggestion: "Drop the lint-components claim and say no installed tool checks memory integrity yet."
  - id: M3
    severity: P4
    file: core/components/memory/knowledge/review/memory.md
    line: 28
    what: "harness.md gets a full command and a 'not installed' fallback; memory.md gets a bare folder path and no fallback. The two playbooks now treat the same tool in different ways."
    basis: "G4: a missing tool must be reported the same way wherever the playbooks name it."
  - id: M4
    severity: P4
    file: core/components/memory/knowledge/review/harness.md
    line: 25
    what: "The lint_play.py command sits in a code span that wraps over a line break ('<the short-term / copy of ...>'), so it cannot be pasted and run. The placeholder is also a sentence, not a path."
    basis: "G1: the Next-line map is a short-term copy the agent names; the playbook should name a placeholder (for example <next-map copy>), not describe one."
  - id: M5
    severity: P4
    file: core/components/memory/knowledge/review/harness.md
    line: 31
    what: "The intro says 'run from the installed tools only', but the next item, the play-pipeline rule 'intent change must trace to an ICE source', is not a tool and has no installed form: an installed project holds no ICE source (reference/ice.md lives in the source tree). The sentence now reads as if that check also runs from installed tools."
    basis: "G2 and G3: what an installed project holds, per base install-garura SKILL.md line 74 and CLAUDE.md line 27."
  - id: M6
    severity: P3
    file: core/components/memory/knowledge/review/harness.md
    line: 24
    what: "Grounding gap GU1 as a finding: the playbook now instructs every project to run tools from .garura/core/tools/lint-components and .garura/core/tools/lint-play. The base design lists only the memory tool in that folder, and the installer at the base lays only that tool. The playbook is correct only if ADR 055 (new on this branch) is accepted."
    basis: "G2. Not a violation of a base principle; a missing base ground. A person judges ADR 055."
summary:
  P1: 0
  P2: 0
  P3: 3
  P4: 3
