    text: "Only agents call the memory tool; memory is read through it, never by a path. A play reads no memory; a skill reads only what its agent puts in short-term memory."
    source: "docs/adr/039-memory-writes-go-to-short-term-memory-plays-read-no-memory.md (base) section 2; docs/adr/035-agents-work-only-from-memory.md (base) section 4; .claude/rules/garura-memory.md"
  - id: G2
    text: "The installed tool folder is .garura/core/tools/, and at the base it holds the memory tool only."
    source: "docs/adr/039-... (base) section 5 tree ('tools/ # the memory tool'); core/components/plays/install-garura/SKILL.md (base) line 74"
  - id: G3
    text: "Components deploy into the target's .claude/ (Claude Code) or .agents/skills/ (Codex CLI); a tool-neutral shelf must not assume one."
    source: "CLAUDE.md (base) line 27"
  - id: G4
    text: "A gap is reported, never hidden or filled with a default."
    source: "core/components/memory/standards/rules/no-unbacked-recommendation.md (base)"
  - id: G5
    text: "A playbook states a gap honestly; keeps the review playbook shape (Topic, Recognise, Treatment, Rationale, Provenance)."
    source: "knowledge/review/memory.md (Phoenix 2f68683b1e44, short-term copy) Treatment, Linter bullet; knowledge/_DESIGN.md (Phoenix 2f68683b1e44, grounding-memory copy)"
  - id: G6
    text: "The PR severity taxonomy is mechanical: each row maps a standard ID to a bucket by regex or glob, no judgement."
    source: "standards/rules/pr.md (base) header, 'Mechanical rule'"
