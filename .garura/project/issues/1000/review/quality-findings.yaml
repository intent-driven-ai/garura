findings:
- id: Q01
  severity: P3
  file: core/components/plays/propose-change/scripts/submit_pr.py
  line: '62'
  kind: reviewer-reading
  defect: true
  summary: 'on_target can still pass blind. The new on_target() returns None only when the PR number is
    empty. When the number is known but the host lookup fails (_pr_record gets a non-zero view-pr exit),
    _pr_record keeps its fallback record (number set, url null, state null, base = the base that was asked
    for). on_target() then returns True because that base is the one asked for, not one the host reported.
    I ran it with a failing view-pr: record base plan/717/base, on_target True. This is the same blind
    pass #951 set out to close, left open on the lookup-failed path. The test is what the done check D3
    reads, so D3 holds on a PR whose base was never read from the host. Both copies carry the same code.
    A host answer is the proof; state or url being null is the signal to return None. A transient view-pr
    failure right after a successful one makes this unlikely today, so it is a gap, not a live break.'
  basis: CODE-25
  artifact_type: garura-prose
