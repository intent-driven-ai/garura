- id: HC1
  severity: P2
  file: core/components/plays/merge-change/reference/ice.md
  line: 114
  summary: 'S5''s measure (and the compiled SE-9 and SCE-5) now require that the capability is in issues_closed once every
    issue under it is closed. The committed model has no capability in a plan: a plan''s tree has an epic at the top, then
    feature items and stories, and a capability is a product-layer kind kept in the model only. What merge_pr.py closes (_close_finished_capability,
    walking plan.tree top-level nodes) is therefore the plan''s Epic, closed when every item under it is closed. That contradicts
    the Epic''s definition (long-lived, stays open when its work is done, new Stories can join it) and the rule that an epic
    stays open until its own issue closes. It also leaves the plan file out of step with the tracker: the epic''s issue is
    closed but its plan item is not set Done (merge_pr.py marks only the landed item), against the rule that each item follows
    its own issue. The new check hardens a rule that was already in C9 and the script (#673, older than the current ontology);
    the design approves it, but the design is scope, not grounding. The product owner should decide: keep the epic close (and
    name it an epic, and mark its item), or drop the capability close and its check.'
  basis: 'Ontology (plan/717/base) line 21 (Capability in the model only), line 156 (plan item kinds), line 623 (items follow
    their own issue, no roll-ups, an epic stays open until its own issue closes), line 648 (Epic stays open when its work
    is done; knows no capability); glossary row ''Epic (ProductOS)''. Harness standard principle 4 (the guarantee the ICE
    states must be one the model allows). pr.md bucket P2: structural violation. Fix: a decision by the product owner, then
    change C9, S5, SE-9 and merge_pr.py together through /edit-play.'
  category: Harness
- id: HC2
  severity: P3
  file: core/components/plays/merge-change/SKILL.md
  line: 186
  summary: 'SE-9 cannot be checked mechanically as worded, and it differs from SCE-5 in the same file and from the ICE measure.
    SE-9 says ''when every child of the issue''s capability in the plan file is now Done or Dropped''; SCE-5 and ICE S5 say
    ''every issue under the issue''s capability is now closed''; merge_pr.py closes only when every non-capability issue anywhere
    under the top node is CLOSED in the tracker. Done or Dropped does equal closed (the plan file''s own header: Dropped is
    closed as not planned), so the idea is sound, but ''child'' reads as direct children while the script walks every level,
    and ''the issue''s capability'' names a node the plan file does not have (HC1). Cases where a correct run fails SE-9:
    the top node has no issue number (the script skips it), or it was already closed before this merge (the script returns
    nothing), or a direct child is Done while a story under another level is open (the script does not close). So the records
    the step writes (merge-gate.json issues_closed, the plan file on the landing branch) are enough to check it, but only
    if the top-level node, all levels, the already-closed case and the no-issue case are written into the eval.'
  basis: 'Harness standard principle 4 (compiled part and ICE agree) and principle 5 (a check that can fail a correct run,
    or cannot be read the same way twice, proves little). Plan file header on plan/717/base (Dropped = closed as not planned)
    for the Done/Dropped equivalence. Fix: word SE-9 and SCE-5 the same as the ICE measure, name the node (the plan''s top-level
    item), say ''every item under it at any level'', and add ''unless it was already closed or has no issue''.'
  category: Harness
