- id: HC6
  severity: P4
  file: core/components/plays/create-play/references/preflight.py
  line: 151
  summary: 'plans_base falls back to the default only when the plans.base-path key is missing. A key that is present but blank
    (plans: / base-path:) parses as an empty mapping, so plans_base is {} and start-change would pass that to resolve_plan.py
    as --plans-dir. The other facts (stm_base, ltm_project_target) behave the same way, so this is the resolver''s existing
    handling of a blank value, now shared with one more fact.'
  basis: 'Gap outside the approved design (it names the key and the default, not a blank value): P4 out of scope. Harness
    standard principle 3 (exact, same answer every time).'
  category: Harness
