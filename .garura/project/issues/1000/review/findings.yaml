- id: HC4
  severity: P4
  file: core/components/plays/propose-change/scripts/submit_pr.py
  line: 62
  summary: on_target() treats a PR as looked up when rec['number'] is set, but _pr_record() presets number to the number it
    was asked about, so a failed second view-pr (exit not 0 or empty answer) leaves number set, base equal to the base asked
    for, and on_target True without any host answer. The design covers the case where the number cannot be looked up (create-pr
    succeeded, no number found), and that case now gives null. This second case is the same pass-blind outcome by a rarer
    route (the number was found a moment before by the same call). A safer proof of lookup is that the host answered (url
    or state set).
  basis: 'Gap outside the approved design (it names ''the PR opens but its number cannot be looked up''): P4 out of scope.
    Harness standard principle 3 (a script gives the same answer every time and does not pass blind). Not a regression: before
    this change both cases passed blind.'
  category: Harness
- id: HC5
  severity: P4
  file: core/components/plays/propose-change/reference/ice.md
