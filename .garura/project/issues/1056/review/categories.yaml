      - .garura/project/issues/1056/context/*   # args/branch/issue/plan/pr/target/resolved-rules json, pr-body.md, self-review.md, check-self-review.txt, work-description.txt (11 files)
      - .garura/project/issues/_adr/20261112T174237Z/*   # record-decision run: adr-check, adr-context, adr-draft(-v1), adr-manifest, brief, decision.yaml, guard-report, hashes-before, porcelain-before/after, run.json, context/templates/* (14 files)
    treatment:
      reviewer: not set (no playbook)
      layers: []
      linters: []
      runnable_checks: []
      design_grounding: "not applicable - no playbook says so; nothing in the shelf makes run records design-bearing"
      note: >-
        With no playbook, no layer or linter is assigned from the shelf. The pr.md severity taxonomy classes these
        paths as `stm-evidence`, so grep-based rules are not eligible on them; the play's check-pr-quality
