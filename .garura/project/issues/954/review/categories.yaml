# Work categories present in PR #1055 (issue 954, branch feature/954-ontology-plan-meets-work), derived from the diff content.
# Memory copies (made through the memory tool for issue 954; same Phoenix version e1cd70d61775 as the earlier review, re-used, not refreshed):
#   review_shelf: .garura/project/issues/954/context/memory/knowledge/review/
#   severity_taxonomy: .garura/project/issues/954/context/memory/standards/rules/pr.md
#   manifest: .garura/project/issues/954/context/memory/manifest.json
categories:
  - name: memory
    what_it_is: >
      The product ontology (version 16 to 17): the agreed map of the kinds of things a product is made of,
      which every agent reads through the memory tool. The change makes it match ADR 069 (the Plan is where
      the product model meets the work): a new rule for the whole model, one Epic and one eval for each Plan,
      a Slices list with a status in the plan file, the Chore placement rule, the Business Intent kind without
      a Tracker line, ten new questions (Q54 to Q63) and Product Profile listed under Not yet defined.
      Content decides: it is a schema under memory/standards/schemas, not a document.
    evidence:
      - core/components/memory/standards/schemas/product-os/ontology.md   # +143 / -99 lines; version 16 -> 17; the whole diff is this one file
    playbook: review/memory
    playbook_note: null
    design_bearing: true
    treatment:
      reviewer: "human (the design) + tool (conformance)"
      layers: [layer-1, layer-2]
      layer_2_design_grounding: >
        yes (playbook). Reconstruct what the ontology is for from committed sources on the base ref, never from
        the new v17 text: the v16 ontology on main, ADR 069 and ADR 068 and the ADRs they amend, the glossary
        and docs/philosophy. Then check the changed ontology for conformance. Run once, for this category.
      linters:
        - name: "memory integrity (path, cross-reference, structure)"
          command: null
          status: "gap per the playbook: no installed tool checks memory integrity yet; the reviewer does the checks by reading the changed file and cites each check"
      runnable_checks:
        - "manual: the file keeps the template structure (standards/templates/product-ontology.md): front matter, Questions it must answer, Kinds (each kind with What it is, Who reads it, Layer, In the tracker as, Lives at, Properties, Relationships, Rules, Example), Not yet defined, Log"
        - "manual: front matter version is bumped (17) and a Log line is added for it"
        - "manual: every relationship and every question names a defined kind; a kind named but not built is listed under Not yet defined (Product Profile)"
        - "manual: cross-references resolve (the questions, the kinds and the ADR numbers the new text names exist)"
        - "manual: no duplicate or contradiction of existing knowledge (the rule for the whole model against the kinds that follow it)"
      observed_not_in_playbook: >
        The source-only skill author-product-ontology carries scripts/check_ontology.py (structure, kinds, questions,
        Not yet defined). It reads the file only. Run once here, read-only: valid, 14 kinds, 63 questions, no problems,
        Product Profile under Not yet defined. The playbook still calls the linter a gap; reported to the caller as a
        possible stale playbook.
  - name: run-records
    what_it_is: >
      Short-term-memory evidence the plays wrote while doing the work for issue 954: the /specify-ontology run record
      (need, the ontology as it was, the three drafts for the questions, kinds and links checkpoints, the product
      owner's decisions, the checks), the second /start-work record, the target ontology record, the PR body, PR
      record and self-review for the ontology change, the citation trail, and the run's short-term copies of two
      memory templates with their manifest.
    evidence:
      - .garura/project/issues/954/context/citations.jsonl
      - .garura/project/issues/954/context/memory/manifest.json
      - .garura/project/issues/954/context/memory/standards/templates/plan-view.md          # short-term copy made by the memory tool; not a change to memory
      - .garura/project/issues/954/context/memory/standards/templates/product-ontology.md   # short-term copy made by the memory tool; not a change to memory
      - .garura/project/issues/954/context/pr-body-ontology.md
      - .garura/project/issues/954/context/pr-ontology.json
      - .garura/project/issues/954/context/self-review-ontology.md
      - .garura/project/issues/954/context/specify-ontology/change-check.json
      - .garura/project/issues/954/context/specify-ontology/decisions.json
      - .garura/project/issues/954/context/specify-ontology/draft-kinds.md
      - .garura/project/issues/954/context/specify-ontology/draft-links.md
      - .garura/project/issues/954/context/specify-ontology/draft-questions.md
      - .garura/project/issues/954/context/specify-ontology/need.md
      - .garura/project/issues/954/context/specify-ontology/ontology-before.md
      - .garura/project/issues/954/context/specify-ontology/ontology-check.json
      - .garura/project/issues/954/context/start-work-2/args.json
      - .garura/project/issues/954/context/start-work-2/branch.json
      - .garura/project/issues/954/context/start-work-2/issue.json
      - .garura/project/issues/954/context/start-work-2/plan.json
      - .garura/project/issues/954/context/start-work-2/work-description.txt
      - .garura/project/issues/954/context/target-ontology.json
    playbook: null
    playbook_note: >
      playbook missing: no playbook on the review shelf covers short-term-memory run records. The nearest ones do not
      fit: harness covers plays, skills and agents; memory covers long-term knowledge under memory/ (the two copies
      here are short-term copies the memory tool made, which the memory-reading protocol allows); docs covers
      human-facing prose. The PR severity taxonomy classifies these paths as artifact type stm-evidence
      (.garura/project/**), so keyword rules do not fire on them. A new playbook (review/run-records) is needed.
      Same gap as the earlier review in this issue.
    design_bearing: false
    treatment:
      reviewer: "not defined (no playbook)"
      layers: []
      layer_2_design_grounding: "no (no playbook; the records are output of work, not a design)"
      linters: []
      runnable_checks:
        - "check-pr-quality classifies these paths as stm-evidence (taxonomy table); the play runs it, not this category"
        - "no category-specific checks defined; the missing playbook is the gap"
design_bearing_categories: [memory]
missing_playbooks:
  - category: run-records
    suggested_id: review/run-records
unlisted_empty_categories_note: "Decision records, harness, executable code, config maps, documentation and tests have no changed files and are absent. (The ADR 069 records were merged to main with PR #1054 and are not in this diff.)"
