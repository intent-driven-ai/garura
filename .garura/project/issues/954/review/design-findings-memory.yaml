findings:
  - id: DF-1
    severity: P3
    file: core/components/memory/standards/schemas/product-os/ontology.md
    lines: "18 (link 4), 662, 735, 907-945 (Chore kind), Q43 (line 157)"
    principle: "A decision recorded in an accepted ADR is changed only by a later ADR with a forward pointer (ADR rule, restated in ADR 069 Decision part 2). ADR 048 section 3, third bullet, says a Chore is a child of one story, and ADR 069's 'what this changes' list amends only ADR 048 section 1 third bullet, section 3 first bullet and section 5."
    basis:
      - source: "docs/adr/048-the-product-model-and-the-work-are-two-layers.md, line 46 ('A Spike, Chore or Bug is a child of one story') and Status line 3 (no pointer on that bullet)"
      - source: "docs/adr/069-the-plan-is-where-the-product-model-meets-the-work.md, line 115 ('A plan's chores sit in the plan, under its one epic') and lines 173-174 (the ADR 048 amendment lists no Chore bullet)"
    detail: >
      v17 gives a Chore two possible parents (a Story, or the plan's one Epic) and adds Plan and Epic relationships for it.
      This follows ADR 069 part 3 and the product owner's L3 answer, so the ontology is right to say it. The gap is in the
      ADRs: ADR 048 section 3, third bullet stays in force with no forward pointer, and a reader of ADR 048 alone still
      learns that a Chore has only a Story as parent. The ontology also goes one step past ADR 069 part 3 by keeping the
      Story parent and adding the 'is the upkeep for that story's work' test; that refinement rests on the L3 answer, which
      the product owner agreed at the links checkpoint, and not on an ADR.
    suggested_fix: "Not a change to this file. Add ADR 048 section 3, third bullet, to the pointers owed on ADR 048's Status line (a forward pointer to ADR 069), or record the L3 rule in a follow-up ADR. The ADR is merged on main, so this is a follow-up."
    blocks_merge: false
  - id: DF-2
    severity: P3
    file: core/components/memory/standards/schemas/product-os/ontology.md
    lines: "Plan kind, Business intent property (line 638): 'The plan-view template (standards/templates/plan-view.md), which /view-plan and /list-plans use, shows it at the top of each plan, above the tree'"
    principle: "The ontology must agree with the committed files it names. The Plan kind now says a plan has exactly one Epic (ADR 069 Decision part 3), but the template the ontology cites for the plan views still describes several epics for each plan."
    basis:
      - source: "core/components/memory/standards/templates/plan-view.md on main, lines 65-67 ('each of the plan's epics ... A dotted rule separates the epics of one plan')"
      - source: "docs/adr/069-the-plan-is-where-the-product-model-meets-the-work.md, line 9 (Affects) lists no plan-view template, and line 113-115 (one Epic for each plan)"
    detail: >
      The Business-intent-at-the-top claim in the ontology is true (plan-view.md line 28 prints the business intent on the
      first line). What is stale is the list card, which still draws one block for each epic of a plan. ADR 069 Affects does
      not list the template, and its Work This Creates names the plan tool (slice status) but not this template, so no
      scheduled work covers it.
    suggested_fix: "Not a change to this file. Add plan-view.md (list card, 'each of the plan's epics') to the follow-up for the plan tool, or file it as its own chore."
    blocks_merge: false
  - id: DF-3
    severity: P4
    file: core/components/memory/standards/schemas/product-os/ontology.md
    lines: "428 (Capability example), 469 and 471 (Feature examples), 473 (Feature example), 276 (Business Intent rule)"
    principle: "ADR 069 Decision part 2 and the new rule for the whole model (line 23, Q54): no part of the model cites a tracker issue number or names a plan, in its lines or its Sources."
    basis:
      - source: "docs/adr/069-the-plan-is-where-the-product-model-meets-the-work.md, line 97 ('No page cites a tracker issue, in its lines or in its Sources')"
      - source: "docs/adr/069-the-plan-is-where-the-product-model-meets-the-work.md, line 9 (Affects): it names only the Business Intent, Slice, Plan and Epic kinds in the ontology, and says line 227 and line 615 are read, not changed"
    detail: >
      The examples for Capability 'Loan application' (line 428) and Feature 'Upload documents' (line 473) state a Feature issue
      number in a sentence that reads as the page. The Feature examples at lines 469 and 471 say 'In the tracker: one Feature
      issue, #122' and (line 469) that the feature 'counts complete in plan #120 and in plan #150', though they also say the
      page and spine entry name no issue. The Business Intent rule at line 276 still says 'Plan files use it: for example,
      #722 is identified by #717'. These lines are carried over from v16 (line 243 on main) and are outside the ADR 069 Affects
      list, so the change does not violate the ADR; they only blur the rule the same file now states. Plan and Epic examples
      correctly keep issue numbers (they are work-side kinds).
    suggested_fix: "Optional wording pass in a later ontology version: make each of these examples say that the number is on the tracker side, or drop it."
    blocks_merge: false
  - id: DF-4
    severity: P4
    file: core/grounding/glossary.md (not changed by this PR)
    lines: "line 57 ('keeps only three things forever — structure, intent, decisions'), line 70 (Slice row: 'in the tracker an Epic stands for it')"
    principle: "The glossary is the canonical definition of every concept; it should not keep a definition that v17 and ADR 069 reverse."
    basis:
      - source: "core/grounding/glossary.md on main, lines 57 and 70"
      - source: "docs/adr/069-the-plan-is-where-the-product-model-meets-the-work.md, line 9 (Affects) names glossary lines 44, 69, 72 and 120 only, and Work This Creates (the bullet that closes with 'the glossary follows') schedules those lines"
    detail: >
      Lines 44, 69, 72 and 120 of the glossary are scheduled. Line 57 (the product model keeps decisions) and line 70 (a Slice
      is represented by an Epic) say the opposite of ADR 069 part 2 and part 3 and are not on the list. Not a defect of this PR;
      an item for the glossary work that ADR 069 already owes.
    suggested_fix: "Add glossary lines 57 and 70 to the glossary follow-up."
    blocks_merge: false

notes_not_findings:
  - "Checkpoint wording 'business intent(s)' (links checkpoint): v17 shows one business intent for each plan ('A plan serves one business intent: the one it is given'). That follows ADR 069 part 9.2 ('A business intent has one plan, and never a second') and ADR 063; the ontology's Epic and Plan rows also say 'one'. No conflict; the word '(s)' in the product owner's reply is read as plan files in general."
  - "v16 and v17 both leave Q3 'partly' and Q4 'not yet'; neither is touched by this change."
  - "The ontology Log (including the new v17 line) cites issue numbers (#954, #1050 and older). It is the schema's change log, not a model page, and ADR 069 part 2 says git history is the provenance of model parts; no finding."
  - "Phoenix memory holds ontology version 15 (ADR 069 Negative / Risks, last bullet); agents still read one Epic for each Slice until the source is promoted. Already named in the ADR's Work This Creates (promote after the change lands)."

summary:
  design_bearing_category: memory
  artifacts_checked: 1
  findings: {P1: 0, P2: 0, P3: 2, P4: 2}
  verdict_hint: "v17 conforms to ADR 069 parts 1 to 10 and ADR 068, contradicts no ADR in force on any point the ADRs left open except the un-pointered ADR 048 Chore bullet (DF-1, ADR-side), keeps the template structure, and reflects L1, L2, L3 and the business-intent-at-the-top answer. No finding is in the changed file itself at P2 or above."
