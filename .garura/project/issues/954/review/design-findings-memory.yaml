# Layer 2 design-grounding for the category "memory" — PR #1055, issue 954.
# Artifact graded: core/components/memory/standards/schemas/product-os/ontology.md (v16 on main -> v17 on the branch).
# Severity buckets from the taxonomy copy (.garura/project/issues/954/context/memory/standards/rules/pr.md, lines 8-11):
#   P1 blocker, P2 major (structural violation), P3 minor (missing docs, naming, a stale pointer), P4 nit.
# Grounding rule: every principle below is read from a committed source on main (git show main:<path>) or from the
# shared memory copies the assessment made. No principle is taken from the v17 text the branch adds. The product
# owner's agreed answers (decisions.json and the three drafts) were read only to see what was agreed, not as a standard.

grounding:
  status: available
  principles:
    - id: G1
      principle: "ADR 069 Decision part 1: the Plan is where the product model meets the work; a Plan holds one or more slices of its business intent, plus chores."
      source: "docs/adr/069-the-plan-is-where-the-product-model-meets-the-work.md, lines 87-89 (on main, merged with PR #1054)"
    - id: G2
      principle: "ADR 069 Decision part 2: the model holds no reference to plans, epics, tracker issues or the tracker; links run one way, from the work side to the model; the Business Intent kind has no Tracker line and its What was done links no work item; no page cites a tracker issue; the spine has no epics list and no part holds a work status; ids stay as names; a part about plans may describe plans in general; decision records leave the model, a product decision is the content of the part it decides, an ADR records a decision about the code."
      source: "docs/adr/069-the-plan-is-where-the-product-model-meets-the-work.md, lines 91-111"
    - id: G3
      principle: "ADR 069 Decision part 3: a plan has one Epic that holds the Feature issues of all its slices with their Stories; its map has one line for each feature of each slice; a plan's chores sit in the plan under its one epic; a bug still sits under the Story that introduced it."
      source: "docs/adr/069-the-plan-is-where-the-product-model-meets-the-work.md, lines 113-115"
    - id: G4
      principle: "ADR 069 Decision part 4: one eval for each plan, covering every feature of every slice including held_by features; a done plan lands on main only when it passes (by hand until #801); a paused plan still merges; the eval's index file is left to the /design-eval rework."
      source: "docs/adr/069-the-plan-is-where-the-product-model-meets-the-work.md, lines 117-119"
    - id: G5
      principle: "ADR 069 Decision parts 5 to 7: the plan file records each slice and its status (a slice is in progress when the plan file says so; each plan file records its own status when two plans hold a slice); /reshape-plan gets 'add a slice' for a plan that exists; the unplanned epic goes."
      source: "docs/adr/069-the-plan-is-where-the-product-model-meets-the-work.md, lines 121-131"
    - id: G6
      principle: "ADR 069 Decision part 8 (what goes) and parts 9 and 10 (what still holds from ADR 049 and ADR 057, restated from the plan's side): the shaping loop, one plan for each business intent, where the files live (evals/<slug>/ hidden file of each slice first shaped for the plan's intent; a plan never copies another plan's file; the plays work the place out and nothing in the model stores it), how the ICE reaches the work, the eval and the builder, the recovery rule, plain-text eval with one file for each Feature issue, deterministic steps, fixed yardstick, summary not eval."
      source: "docs/adr/069-the-plan-is-where-the-product-model-meets-the-work.md, lines 133-167"
    - id: G7
      principle: "ADR 069 'What this changes in older ADRs' and 'What this does not change': ADR 048 section 1 third bullet and section 3 first bullet and section 5 are amended; ADR 056, ADR 064, ADR 065 rules 1, 2 and 4, ADR 068 sections 2 to 6 stand; ADR 068 section 1 is amended (the Tracker line goes; ids stay)."
      source: "docs/adr/069-the-plan-is-where-the-product-model-meets-the-work.md, lines 169-198"
    - id: G8
      principle: "ADR 068: no feature carries a tracker issue number; three units of work (Epic, Feature issue, Story); a play finds a Feature issue by the plan file's mark, else by the exact 'Represents:' line, never by title; slices and plans only group features; a Feature issue sits under one epic at a time ('a second epic' now means another plan's epic); an orphan Story is matched to its feature."
      source: "docs/adr/068-each-product-feature-has-one-feature-issue-that-names-it.md, Status line 3 and Decision sections 1 to 6 (lines 73-105)"
    - id: G9
      principle: "ADR 048 section 3: an Epic is long-lived and has no ICE; 'A Spike, Chore or Bug is a child of one story'; a bug sits under the story that introduced the defect. Amended only where ADR 069 names it (section 1 third bullet, section 3 first bullet, section 5)."
      source: "docs/adr/048-the-product-model-and-the-work-are-two-layers.md, lines 3 and 42-47"
    - id: G10
      principle: "ADR 064 (not amended by ADR 069): an item's status in a plan follows its own issue; a status with no issue is set by a person; no roll-ups. ADR 060 sections 1, 2, 3 and 5 (plan branch, paused plan merges) stand. ADR 063 section 1 (a plan is made once)."
      source: "docs/adr/069-the-plan-is-where-the-product-model-meets-the-work.md, line 53 and line 198; docs/adr/063-*.md"
    - id: G11
      principle: "The ontology's own format: a fixed template (front matter with a bumped version, intro, Questions it must answer, Kinds each with the same fields, Not yet defined, Log); every relationship and question must name a defined kind or a kind listed under Not yet defined."
      source: "standards/templates/product-ontology.md, short-term copy .garura/project/issues/954/context/memory/standards/templates/product-ontology.md (the Format block; same content as core/components/memory/standards/templates/product-ontology.md on main); and the v16 ontology on main, core/components/memory/standards/schemas/product-os/ontology.md"
    - id: G12
      principle: "The plan view shows the plan's business intent on the first line, above the tree (the committed behaviour the plan template describes)."
      source: "core/components/memory/standards/templates/plan-view.md on main, line 28"
    - id: G13
      principle: "docs/philosophy/idd-principles.md routing table: the eval is kept in plain text in the slice's evals folder and the builder never sees it; the table itself stays (ADR 069 'does not change'). Nothing in docs/philosophy conflicts with v17."
      source: "docs/philosophy/idd-principles.md on main, lines 121-124"

