  - check: "Template structure (G11): the heading and bold-label skeleton is identical to v16 (diffed: only the values after the labels differ); front matter version 17, updated 2026-11-12; Log line added for v17; Not yet defined lists Product Profile; every question and relationship names a defined kind; Q62 is 'partly' because it names Product Profile. The source-only checker (check_ontology.py) was run read-only and reports valid, 14 kinds, 63 questions, no problems."
    where: "ontology.md lines 1-5, 987-989, 991 and 1014"
  - check: "Checkpoint answers reflected: L1 (epic mark 'epic: <issue number>', one line at the top of the plan file, matched to the tree's epic; 'represents' stays for a Feature issue; an old epic with 'represents' is drift) at lines 642, 750, 690, 684; L2 (four slice statuses Not Started, In Progress, Done, Dropped; Paused, Now and Blocked left out) at lines 643, 674, Q58 (line 202); L3 (a chore under a story when the upkeep is for that story's work, else under the plan's epic; never under a Feature issue; no Feature issue or slice counts it and the eval does not test it) at lines 907-945, Q43 (line 157), link 4 at line 18; the change at the links checkpoint (tree starts at the epic; the plan shows its business intent at the top) at lines 638, 645, 704, 706, 708 and Q59 (line 205). The plan-view template on main already prints the business intent on the first line (G12), so the Plan property is true."
