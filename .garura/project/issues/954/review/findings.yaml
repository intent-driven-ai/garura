      child of one story') and Status line 3 (no pointer on that bullet)
  - source: docs/adr/069-the-plan-is-where-the-product-model-meets-the-work.md, line 115 ('A plan's chores sit in
      the plan, under its one epic') and lines 173-174 (the ADR 048 amendment lists no Chore bullet)
  detail: 'v17 gives a Chore two possible parents (a Story, or the plan''s one Epic) and adds Plan and Epic relationships
    for it. This follows ADR 069 part 3 and the product owner''s L3 answer, so the ontology is right to say it.
    The gap is in the ADRs: ADR 048 section 3, third bullet stays in force with no forward pointer, and a reader
    of ADR 048 alone still learns that a Chore has only a Story as parent. The ontology also goes one step past
