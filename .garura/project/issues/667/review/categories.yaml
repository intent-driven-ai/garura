categories:
  - name: decision-records
    playbook: review/adrs
    design_bearing: false   # playbook: "Design-grounding: no. The decision is the design; there is no prior principle to conform to. The human owns the judgement." Layer 1 only, so no grounding dispatch.
    layers: [linters]
    evidence:
      - docs/adr/036-approved-answer-lands-in-short-term-memory.md   # new, 164 lines; ADR 036, Status Accepted, Decided by Kapil Viren Ahuja; amends ADR 035, 034 and 032
      - docs/adr/035-agents-work-only-from-memory.md                 # modified: Status line only (1 line out, 1 in); gains the "amended in part by ADR 036" pointer
      - docs/adr/034-plays-answer-from-memory-inside-a-drive.md      # modified: Status line only (1 in, 1 out); same pointer kind
      - docs/adr/032-drive-review-of-outcomes.md                     # modified: Status line only (1 in, 1 out); same pointer kind
      - docs/adr/_index.md                                           # modified: one row added for 036 (the index is generated by adr.py index)
    runnable_checks:
      - command: "python3 core/components/plays/adr/scripts/adr.py lint --adr docs/adr/036-approved-answer-lands-in-short-term-memory.md"
        note: "the playbook's structural linter: required sections present, Status one of proposed/accepted/superseded/rejected, well-formed. Run for each of 036, 035, 034 and 032 (the four ADR files changed). Observed read-only while assessing (PYTHONDONTWRITEBYTECODE=1): valid true, 0 problems, exit 0, for all four."
      - command: "python3 core/components/plays/adr/scripts/adr.py index --dir docs/adr --out <scratch>/index-regen.md && diff <scratch>/index-regen.md docs/adr/_index.md"
        note: "the playbook's 'numbered and linked from the index' check. Write the rebuilt index to a scratch file, never over docs/adr/_index.md. Observed: 36 ADRs, rebuilt index identical to the committed docs/adr/_index.md (036 row present, Status Accepted, Date 2026-10-18). Numbering runs 001 to 036 with no repeat; 036 is the next number after 035."
      - command: "git diff main...HEAD --stat -- docs/adr/032-drive-review-of-outcomes.md docs/adr/034-plays-answer-from-memory-inside-a-drive.md docs/adr/035-agents-work-only-from-memory.md"
        note: "an older ADR changes only through its forward pointer. Observed: 3 files, 3 insertions, 3 deletions, each file one line out and one in (the Status line). The bodies of 032, 034 and 035 are untouched."
      - command: "python3 -c <resolve every relative markdown link in the four changed ADRs; resolve every backticked core/, .garura/ and docs/ path in 036 with os.path.exists>"
        note: "dead-link and path-existence check (objective, no judgement). Observed: no unresolved links in 036, 035, 034 or 032; all 10 paths named in 036 exist (v1.json, memory README, the 653 plan, the 654 stories, the 617 review-tool plan, the 655 plan, the TIC-1 findings file, /adr ice.md and SKILL.md, standards/rules/product.md). The run's own adr-check.json records the same for the Affects paths (affects_paths_all_exist true)."
      - command: "git diff --check main...HEAD"
        note: "whitespace and conflict-marker check over the whole diff. Observed: clean."
    notes: >
      A decision record in the full sense: an ADR in the template's shape, three older ADRs
      carrying a forward pointer, and the generated index. The playbook's treatment is Layer 1
      only, with the human judging line by line whether the decision is right, so this
      category is not design-bearing and the play should not dispatch a grounding for it. Two
      observations for the tool and the human, not findings. (1) The playbook is stale on one
      point: it says "Gap: no ADR linter exists in-repo yet", but adr.py (lint, index, guard,
      overlaps, pointer, accept) and check_adr_scope.py exist under
      core/components/plays/adr/scripts/, and the linter above ran. The playbook's gap line
      should be sharpened; no new playbook is missing. (2) ADR 036 makes factual claims about
      committed files that a read can test without judging the decision: its Affects line says
      core/tools/memory/contract/v1.json and core/tools/memory/README.md "already follow parts
      1 to 6". On main, v1.json carries researched_goes_to_short_term and names the issue in
      its lookups; the README is not re-read here. Items the human may want to weigh, taken
      from reading the diff, not grounding and not findings: ADR 036 itself lists two open
      questions (whether a product decision.yaml waiting for a person moves into Memory and
      ADRs, and who writes the approval on a swipe given ADR 033 section 6); its amendment of
      ADR 032 section 3 is marked in the ADR as a judgment call; and its part 7 changes where
      the `/adr` accept happens, which the ADR itself says needs an `/adr` intent change
      through its ICE source before it takes effect. The run records show a person's accept
      (decision.yaml, by person, Kapil Viren Ahuja); they live in the third category and are
      history, not grounding.

