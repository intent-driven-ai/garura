        note: "plan format check. Observed: valid true, status active, now 3, open items 3 to 11, no problems; exit 1 only because the plan is not finished (the script's own meaning: 0 valid and done, 1 valid not done, 2 not valid, 3 unreadable). Apply to this plan only."
      - command: "python3 -c <yaml.safe_load .garura/project/issues/654/specs/stories.yaml>"
        note: "keeps the stories file parseable after the edits and the appended comment lines. Observed: parses."
    notes: >
      Same kind of work as the STM plans and story notes in the PR #666 review (issue 655):
      Garura's own working notes, under .garura/project/issues/**. No playbook covers them. The
      memory playbook does not apply: it governs the knowledge base under
      core/components/memory/**, and none of these paths is there, even though the notes are
