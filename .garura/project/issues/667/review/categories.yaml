      (kind tool-plan, status draft), not a work plan in the canonical format, and it fails the
      format check on main in the same way (exit 2, same problem list), so that result is
      not a regression and not a finding. Consistency points to read, not findings: the 653
      plan, stories.yaml and review-tool.md should say the same about ADR 036 parts 2, 3 and 7
      (the third section Memory and ADRs; approved answer to short-term memory; promotion
