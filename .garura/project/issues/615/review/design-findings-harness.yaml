pr: 640
issue: 615
round: 2
category: harness
scope: "core/components/plays/understand/reference/ice.md and core/components/plays/understand/SKILL.md (compiled play), plus the two byte-identical play-creator/play-editor references/workflow-structures.md guides. Scripts, tests, the standards rules and lint_play.py belong to other categories; they are read here only as the thing the play's text must agree with."
grounding:
  - principle: "Intent changes go ICE source first, then recompile; a compiled SKILL.md is never hand-edited for an intent change; no deviation notes or change logs are added to skill files."
    source: "CLAUDE.md, Play Pipeline Rules (checked in on main)"
  - principle: "A drive asks every question first, passes no stops for the plays' checkpoints, stops and asks on a new question and never picks an answer itself; plays inside a drive open no issue or branch. Kickoff table: /understand 'Runs once for every capability /vision seeded, and details it'. Kickoff Done when: 'each play shows its saved record (one /understand record per capability)'."
    source: "main:docs/adr/029-drives.md sections 2, 3 and 6 (lines 34-43, 63, 67)"
  - principle: "Every play a drive runs can also be run by hand; run by hand it depends on no other play and still stops as its gate settings say."
    source: "main:docs/adr/029-drives.md section 4 (line 47) and 'ADRs This Retires' (line 122)"
  - principle: "Drive path of a play: check the contract first; open nothing; resolve the checkpoint as by hand, writing a review record only where the gate would WAIT; a question the drive did not answer stops the play; a deferred crossing is recorded as deferred_to_drive_review. Answers are 'per play ... question id to answer'."
    source: "main:core/components/memory/standards/rules/drive-contract.md ('What a contract holds', 'How a play runs inside a drive' 1-5)"
  - principle: "The LLM writes only per-node doc files; a keyed script owns every shared file; because the LLM never writes a shared file the file-level guard is sufficient. Write-then-review order: write everything, guard once, classify, checkpoint, commit; nothing out-of-box is COMMITTED without approval; declared exceptions to confirm-before-write exist only for /intent and /adr."
    source: "main:core/components/memory/standards/rules/direct-model-write.md (item 3 lines 28-40, 'Order of operations' lines 93-129); main:docs/adr/026-direct-to-model-writes.md"
  - principle: "BASE concurrent fan-out rule: a step may run sub-tasks at once only when they are read-only over shared inputs, write distinct output paths, and have no sibling dependency; 'A run whose sub-tasks WRITE the tree needs isolation - that is #488, not this'. Always bounded (fixed set) and joined."
    source: "main:core/components/memory/standards/rules/concurrent-fanout.md (lines 5-8, 12-25, 28-40); #488 (open: parallel build-loop with worktree isolation)"
  - principle: "Parallelism is allowed only for independent boxes and checks under one parent, 'possible last', after the budget wall is proven, because it 'multiplies whatever one loop does, including a runaway'; the skeleton stays deterministic at outcome level."
    source: "main:docs/adr/025-level-3-redefined-skeleton-and-loop.md (lines 120-132)"
  - principle: "A box-move is a product-level decision 'proposed during /understand and accepted by a human'; status is proposed | accepted | superseded | rejected."
    source: "main:core/components/memory/standards/schemas/product-os/decision.yaml (status, metadata.accepted_by, fill_rules)"
  - principle: "The roll-up compares needs against the box that is committed in the live spine at the moment it runs (it reads _spine.yaml's profile block)."
    source: "main:core/components/plays/understand/scripts/rollup_box.py (header and profile read, as on main)"
  - principle: "The persist refuses to re-detail a capability that is already detailed in the live spine."
    source: "main:core/components/plays/understand/scripts/persist_understand.py (line 160 on main)"
  - principle: "The enrich skill writes only the target node's docs - 'never a shared file, never a sibling node's doc' - and its declared inputs are capability, kb_domain, product_base, manifest_path, stm_base."
    source: "main:core/components/skills/enrich-capability-ice/SKILL.md (Inputs table); main:core/components/agents/product-os-keeper.md (NEVER list, 'JSON Contract Mode')"
  - principle: "Severity buckets: P1 blocker (halts ship), P2 major (error-handling, missing tests, structural violations), P3 minor (missing docs, borderline, naming), P4 nit."
    source: "main:core/components/memory/standards/rules/pr.md (Severity buckets, lines 9-12). Design findings have no taxonomy row; they use the bucket definitions, as in round 1."
  - principle: "Precedent for a play inside a drive: /vision (#614) on main."
    source: "main:core/components/plays/vision/SKILL.md and reference/ice.md (C11, SE-13/SE-14, F6/F12/F13)"
decision_record_note: "The one-run-for-all-capabilities choice and the scoped-write fan-out ('B') were chosen by Kapil on 2026-10-17. The only record of that choice is the PR's own plan (.garura/project/issues/615/specs/plan.md, item 6 and Log), which is cited here as the decision record, never as a design principle. No ADR or standards text on main records either choice (see H9, H10)."
round1_status:
  H1: "changed - the hidden-box-move half is fixed (every target is measured against the starting box inside one run, C7/C8/S8). The drop half is still open: nothing says what dropping a proposed decision does to a raised box. Kept as P3."
  H2: "still open - SE-16 still reads 'when the gate did not auto-pass' (SKILL.md:588) and S7 still names only deferred or auto_pass (ice.md:274)."
  H3: "still open - SE-15 still reads 'did not wait at Step 6 or Step 0a' (SKILL.md:585-586) against C1/C13 and Step 0a (a stop for an unanswered seed is required)."
  H4: "still open - drive-contract.md is unchanged on main; the nested answers.understand.seeds.<capability> shape is still described only in the play."
  H5: "changed - fixed in substance: one record per capability, named understand-<ts>-<capability>, ADR 029's Done-when is now met. A small residual remains (the writer stores the composite in recorded_at and has no capability field)."
  H6: "still open - C8 ice.md:83 'COMMITTED only on approval', Done-means preamble ice.md:298 'accepted decision', and the #498 note SKILL.md:840 are unchanged."
  H7: "still open - F14/REC14 ice.md:207-208, 360-361 unchanged."
  H8: "still open, extended - D1-D3 unchanged; with the batch there is now also no clause proving every target landed."
conformance_notes:
  - "ICE-first held for this round. The SKILL.md fingerprint (sha256:395c8bd0...0821099) equals shasum -a 256 of reference/ice.md (checked). lint_play.py (play-creator and play-editor copies, run on understand/SKILL.md) gives VERDICT PASS, 0 gaps, including the concurrent fan-out and the new scoped-write fan-out checks. Counts agree: C1-C14, F1-F16, S1-S8, SE-1..SE-17, SCE-1..SCE-8, 16 recoveries. (The recovery split in the metadata is wrong, see H15.)"
  - "No deviation note or change log was added to SKILL.md in this round (grep over the added lines). The '#615' tokens sit in Compiled From, the description and compiled_by, the compiler-emitted places. The older #468/#498 notes are on main."
  - "The batch keeps run-level containment and atomicity. Targets and scopes come from pick_targets.py, which refuses a seed with no human answers, a named detailed target and any two overlapping folders. The persist checks every manifest, seed, capability and box-move before the first write, so a refusal leaves the model untouched (persist_understand.py lines 98-232 run before the first write at 237). One guard run covers the union of scopes plus the spine and decisions (SKILL.md Step 5). Halt on any failed target reverts with guard --restore (Step 2 end, REC16). One checkpoint and one commit (Step 7). The only weakening is between sibling targets (H18)."
  - "Step 1 conforms to the five conditions of the NEW scoped-write rule (own scope declared before dispatch and checked distinct, no shared file, distinct manifest paths, no sibling read, guard after join and commit after checkpoint). It does NOT conform to the BASE rule, whose condition 1 and line 17 forbid sub-tasks that write the tree. The play is therefore only conformant if the rule change ships with it (H10)."
  - "The drive path still matches drive-contract.md and ADR 029: contract checked first, nothing opened, own model commit on the drive's branch, config skip and auto-pass resolve as by hand, only a would-wait gate writes records plus one deferred ledger line, unanswered seed stops and asks. Run by hand is unchanged apart from the batch. The review-record naming fits write_drive_review.py mechanically: it only rejects a --ts with a slash, a backslash or a leading dot (write_drive_review.py:51), and writes <review_dir>/<play>-<ts>.md/.json."
  - "Step 0a ordering is sound: all absent targets are asked in one round before start-change, answers land in STM only, pick_targets.py is re-run so the seeds count and every target gets a scope; run.json answers.seeds.<capability> (SKILL.md) is the same data as the contract's answers.understand.seeds.<capability> (ice.md C13), because check_drive_contract.py copies answers.<play> into run.json."
  - "Resume: a resume after Step 0a reuses each seed.yaml and the in-progress targets.json, which correctly avoids re-picking after the persist has already marked targets detailed (SKILL.md:798-808)."
findings:
  - id: H1
    category: harness
    severity: P3
    status: changed
    title: "Inside a drive a box is raised and committed while its decision is only proposed; the play still does not say what dropping the decision does to the raised box"
    path: core/components/plays/understand/reference/ice.md
    line: "83-87, 140-161"
    also: "core/components/plays/understand/SKILL.md:573-579"
    principle: "A box-move has two halves, the raised profile level and its decision. Write-then-review guarantees nothing out-of-box is COMMITTED without approval and names only /intent and /adr as declared exceptions; the roll-up reads the committed box as the next ceiling."
    source: "main:core/components/memory/standards/rules/direct-model-write.md lines 109-129; main:core/components/plays/understand/scripts/rollup_box.py (reads the live profile); main:core/components/memory/standards/schemas/product-os/decision.yaml (status values); main:docs/adr/031-business-intent-and-ice.md part 5"
    detail: >
      Round 1 also said a second capability in the same drive would read the first one's raised box and hide
      its own box-move. That half is fixed: one run measures every target against the starting box (C7, S8).
      What is left: C8/C13 say the drive's review 'accepts or drops' each proposed decision, but the keyed
      persist has already written the raised profile and Step 7 commits it. A dropped (rejected) decision
      leaves a model whose box moved with no decision behind it, and a later /understand reads that raised
      box as the committed ceiling. Nothing in C8, C13, F7, REC7 or S7 says the drop also lowers the box or
      supersedes it. direct-model-write.md still names only /intent and /adr as exceptions to
      nothing-committed-before-approval; commit-on-deferral is a third. Fix in ice.md first: one sentence
      saying what a drop does to the box, then name the exception in direct-model-write.md (memory follow-up).
  - id: H2
    category: harness
    severity: P3
    status: open
    title: "SE-16 expects a review record whenever the gate did not auto-pass, but a config skip writes none"
    path: core/components/plays/understand/SKILL.md
    line: "588-595 (SE-16), 491-493 (Step 6)"
    also: "core/components/plays/understand/reference/ice.md:148-155, 266-278 (C13, S7)"
    principle: "Inside a drive a config skip is recorded as a skip, as by hand; only a would-wait gate becomes a review record and a deferred ledger line. A play's evals must judge the cases its steps produce."
    source: "main:core/components/memory/standards/rules/drive-contract.md ('How a play runs inside a drive' item 3); main:core/components/memory/standards/rules/gate-config.md; main:core/components/plays/vision/SKILL.md SE-14"
    detail: >
      Step 6 and C13 write records only where the gate resolves ON. SE-16 says 'when the gate did not
      auto-pass, for each target a review record exists ... the ledger reads deferred_to_drive_review (or
      auto_pass)'. A gates.plays.understand off run is neither, so a correct run fails SE-16, or a play that
      follows SE-16 writes records the config said not to. The gap matters more here: with the gate skipped,
      a run that raised the box leaves proposed decisions and no record naming them. Say first in C13/S7 how a
      skipped or auto-passed gate that moved the box still reaches the drive's review, then align SE-16 and
      SCE-7.
  - id: H3
    category: harness
    severity: P3
    status: open
    title: "SE-15 says an in-drive run 'did not wait at Step 6 or Step 0a', but C1, C13 and Step 0a require the play to stop and ask when a seed has no contract answers"
    path: core/components/plays/understand/SKILL.md
    line: "584-587; Step 0a 235-240"
    also: "core/components/plays/understand/reference/ice.md:49-53, 159-161, 206-208"
    principle: "A drive does not stop for the plays' checkpoints, but a question the drive did not answer stops the play and the play never picks the answer."
    source: "main:docs/adr/029-drives.md section 2 (line 36); main:core/components/memory/standards/rules/drive-contract.md item 4"
    detail: >
      With the batch, Step 0a is now the one place a drive can legitimately stop (any capability with no
      contract answers). A run that correctly stopped and asked reads as failing SE-15. Only the wait at the
      checkpoint is forbidden. Fix in ice.md (F14 and S7 text), recompile SE-15 to scope the no-wait to Step 6.
  - id: H4
    category: harness
    severity: P4
    status: open
    title: "The play reads nested seed answers (answers.understand.seeds.<capability>.one_line/why/domain) that drive-contract.md does not describe"
    path: core/components/plays/understand/reference/ice.md
    line: "146-147"
    also: "core/components/plays/understand/SKILL.md:147-151"
    principle: "One contract serves every play and describes answers as 'question id to answer'; the questions a play needs the drive to ask must be findable by the drive (#613)."
    source: "main:core/components/memory/standards/rules/drive-contract.md ('What a contract holds'); main:docs/adr/029-drives.md section 2"
    detail: >
      The shared checker only requires answers.<play> to be an object, so the shape passes, but the rule never
