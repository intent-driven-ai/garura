      follow-up) listing the three question ids per capability would close it.
  - id: H5
    category: harness
    severity: P4
    status: changed
    title: "Review records are now one per capability, but the canonical writer stores the composite '<run ts>-<capability>' in recorded_at and has no capability field"
    path: core/components/plays/understand/SKILL.md
    line: "497-508"
    also: "core/components/plays/understand/scripts/write_drive_review.py:33, 51, 73 (canonical copy in play-creator/references, byte-identical)"
    principle: "Each play shows its saved record, one /understand record per capability, so the drive's review can tell them apart. The writer's own contract is '--ts the run's UTC timestamp' and 'must be a plain timestamp'."
    source: "main:docs/adr/029-drives.md section 6 (line 67); main:core/components/memory/standards/rules/drive-contract.md ('drive_run_id ... so the drive's review can find each play's record')"
    detail: >
      Fixed in substance: ADR 029's Done-when is now met and the names cannot collide between targets. The
