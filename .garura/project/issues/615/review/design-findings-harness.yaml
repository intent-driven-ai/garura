    detail: "Counted in ice.md: 5 'handoff: human', 11 'handoff: autonomous'; the SKILL.md Recovery table agrees (5 human, 11 autonomous). The metadata line is stale and the linter does not catch the split."
  - id: H16
    category: harness
    severity: P4
    status: new
    title: "'Nothing pending, end at once' leaves the close undefined: no persist record exists, so the stop condition cannot read held"
    path: core/components/plays/understand/reference/ice.md
    line: "37-40"
    also: "core/components/plays/understand/SKILL.md:132-133, 692-733"
    principle: "The close never reads COMPLETED with the stop-condition verdict unmet; every play ends with the Standard Play Close."
    source: "main:core/components/memory/standards/rules/play-close.md (Standard Play Close); main:core/components/plays/understand/stop-condition.yaml (D1-D3 as on main); ice.md C11 on main"
    detail: >
      A run with nothing pending (common once Kickoff has run) writes none of D1-D3's artifacts. 'End at once,
      opening nothing' does not say whether Step 9 runs and what it records (HALTED with no work, or a
      COMPLETED no-op that skips the verdict). Name the no-op end in C1 and S-level text and make the close
      honest about it.
  - id: H17
    category: harness
    severity: P4
    status: new
    title: "Step 1 and C14 do not say what happens when one dispatch errors or returns no manifest while its siblings have already written docs"
    path: core/components/plays/understand/SKILL.md
    line: "266-274, 310-315, 363-366"
    also: "core/components/plays/understand/reference/ice.md:170-172"
    principle: "A fan-out is bounded and joined; if any sub-task fails, no later step sees a partial set; all-or-nothing means nothing is committed."
    source: "main:core/components/memory/standards/rules/concurrent-fanout.md ('The bounded join', lines 28-40)"
    detail: >
      The all-or-nothing line covers a target that 'cannot pass its checks after its recovery' (Step 2) and
      a stray write (REC16). A dispatch that fails outright is not a check. The join waits for every dispatch,
      then SE-17 notices a missing manifest, but no step says to revert the siblings' uncommitted docs and
      halt. State it in C14 and Step 1.
  - id: H18
    category: harness
    severity: P4
    status: new
    title: "SE-17 and F16 promise a per-dispatch scope check the harness cannot make: the guard sees only the union of scopes and nothing records which dispatch wrote what"
    path: core/components/plays/understand/SKILL.md
    line: "310-315, 454-472"
    also: "core/components/plays/understand/reference/ice.md:214-218, 162-172"
    principle: "Run-level containment is the guard plus the keyed persist; each sub-task is told one scope before dispatch. The changed rule itself states that a stray write into a sibling's scope 'stays inside the union'."
    source: "main:core/components/memory/standards/rules/direct-model-write.md item 3-4 (guard is file-level, run-level); main:core/components/skills/enrich-capability-ice/SKILL.md Inputs ('never a sibling node's doc')"
    detail: >
      Run-level containment (C10, D3) holds. Between siblings it is trust plus downstream checks (linter,
      judges, checkpoint). SE-17 ('every new or changed doc lies inside its target's scope', 'dispatched once
      per target in one concurrent batch, joined') names evidence that nobody records: there is no dispatch log
      and no per-dispatch file list, and a path-in-scope test cannot say which dispatch wrote it. Soften SE-17
      to what is checkable (every changed path lies inside some target's scope and the manifests exist) and
      let the batch's single message be the evidence of concurrency. Low risk.
  - id: H19
    category: harness
    severity: P4
    status: new
    title: "The fan-out is bounded only by 'every pending capability': N targets mean N concurrent writers plus one judge per doc at once, with no cap or batching"
    path: core/components/plays/understand/reference/ice.md
    line: "162-172"
    also: "core/components/plays/understand/SKILL.md:266-268, 337-340"
    principle: "Parallelism multiplies a runaway; it is allowed under one parent after the budget wall exists, as a fixed bounded set."
    source: "main:docs/adr/025-level-3-redefined-skeleton-and-loop.md lines 125-127; main:core/components/memory/standards/rules/concurrent-fanout.md ('Bounded')"
    detail: "The set is fixed when the step starts, so the rule's boundedness holds. A seeded product with many capabilities still puts that many agents and judges in one batch. A maximum batch width (or batching in input order) would keep the cost predictable; the ICE says nothing."
  - id: H20
    category: harness
    severity: P4
    status: new
    title: "The agent and skill contracts were not updated for the scoped-write dispatch: write_scope is an undeclared input, the skill still names '<working>/seed.yaml', and agent self-recovery can rebuild a shared KB index"
    path: core/components/plays/understand/SKILL.md
    line: "266-292"
    principle: "A play's dispatch contract uses the inputs its agent and skill declare; sub-tasks of a scoped-write fan-out write no shared file (any index)."
    source: "main:core/components/skills/enrich-capability-ice/SKILL.md (Inputs table: capability, kb_domain, product_base, manifest_path, stm_base); main:core/components/agents/product-os-keeper.md (JSON Contract Mode; Self-Recovery 'run kb.py rebuild'); main:core/components/memory/standards/rules/concurrent-fanout.md (base: distinct output paths)"
    detail: >
      The dispatch hands the agent write_scope, which neither the agent nor the skill declares (the skill's
      rule 'never a sibling node's doc' is what actually holds it). The skill's capability input still points
      to '<working>/seed.yaml'. The keeper's self-recovery runs the KB router's rebuild when the index is
      stale; with N concurrent agents all N could do that on the same shared index file, outside the model tree
      so the guard would not see it. Condition 2 of the new rule ('no shared file') is not carried into the
      agent. Both files are outside this PR; a follow-up to add the input and the seed path would close it.
