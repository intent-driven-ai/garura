  - id: H10
    category: harness
    severity: P3
    status: new
    title: "Step 1 is conformant only to the changed fan-out rule; against the base-ref rule it is a forbidden writing fan-out, and the rule change has no decision record outside the PR's plan"
    path: core/components/plays/understand/SKILL.md
    line: "266-274, 310-315; ice.md 162-172"
    also: "core/components/plays/play-creator/references/workflow-structures.md (and the play-editor copy, identical)"
    principle: "The fan-out rule names the ONE exception to the deterministic skeleton and sends sub-tasks that WRITE the tree to #488 (worktree isolation); parallelism is allowed 'last', under one parent, bounded and joined, because it multiplies a runaway. Widening that exception is itself a design decision."
    source: "main:core/components/memory/standards/rules/concurrent-fanout.md lines 5-8, 12-25 (condition 1 and its parenthesis, line 17); main:docs/adr/025-level-3-redefined-skeleton-and-loop.md lines 125-132; main:core/components/memory/standards/rules/direct-model-write.md item 3 (lines 28-40); #488 (open). Decision record: plan.md item 6 (Kapil, 2026-10-17, 'B')"
    detail: >
      Judged against the base rule, Step 1 breaks condition 1 (read-only) and so must stay serial. Judged
      against the new five-condition rule it conforms (see conformance_notes), and the new rule is consistent
      with direct-model-write.md item 3: the sub-tasks write only per-node docs and one keyed persist owns the
      shared files. So the play and the rule must ship together and the rule change is the weightiest design
      decision in the PR (the memory category tests the rule text itself). Nothing on main records the
      decision: it is not in ADR 025/026 and #488 is a different thing (code builds with worktrees). Recommend
      a one-paragraph amendment on ADR 025 or 026 (or a decision note on #488) naming the scoped-write
      fan-out as the second allowed form. The two workflow-structures.md guides follow the new rule and are
      identical to each other.
  - id: H11
    category: harness
    severity: P3
    status: new
    title: "S7, SE-16 and SE-9 test a field the earlier step never records: persist-manifest.json box_moves carries no decision status"
    path: core/components/plays/understand/SKILL.md
    line: "433-435 (SE-9), 593-595 (SE-16), 682-683 (SCE-7)"
    also: "core/components/plays/understand/reference/ice.md:275-276 (S7); scripts/persist_understand.py:233, 269-270"
