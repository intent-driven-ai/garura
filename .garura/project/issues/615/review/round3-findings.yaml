findings:
- id: R3-1
  category: executable-code
  severity: P4
  file: core/components/plays/understand/scripts/persist_understand.py
  line: 283-286
  title: The new box-move shape guard sits after a call that already assumes a dict, so a non-dict move still crashes
    with a traceback instead of being refused
  basis: The fix added `not isinstance(mv, dict)` at line 286, but line 283 calls mv.get('capability') first; a
    move such as 'oops' raised AttributeError in a scratch run (exit by traceback, nothing written, so no data loss).
    The test 'a box-move missing from/to is refused, not a crash' covers only a dict. The intent (refuse, not crash)
    is the commit message's own. Unreachable guard, rollup_box.py never emits a non-dict, so style-level. pr.md
    severity P4 (nit, tech-debt).
  status: fixed in f3d06fb3
- id: R3-2
  category: executable-code
  severity: P4
  file: core/components/plays/understand/scripts/persist_understand.py
  line: 111-114, 124
  title: The never-lower check cannot see a level outside the none-to-xhigh scale, and crashes on a live nfr that
    is not a mapping
  basis: rank() maps any unknown level to 0 (same as rollup_box.py), so a live level like 'critical' lowered to
    'none' passes (exit 0 in a scratch run); a live nfr that is a list raises AttributeError at live_nfr.items().
    ICE C5 fixes the scale at none<low<medium<high<xhigh and product-profile.yaml defines nfr as a per-dimension
    mapping, so both inputs are out of contract and unlikely; the script is the guard C7 relies on, so refusing
    unknown levels would be the robust form. pr.md severity P4.
- id: R3-3
  category: executable-code
  severity: P4
  file: core/components/plays/understand/scripts/persist_understand.py
  line: 120
  title: The check requires the proposed state to be `set` but not that the live state is not `locked`, so a locked
    box is quietly returned to `set`
  basis: "Scratch run: live state locked with equal levels, proposed state set -> exit 0, profile now set. product-profile.yaml\
    \ (state: directional | set | locked; 'locked \u2014 selection (/shape) runs against it') and ICE C7 ('/understand\
    \ never writes locked', box never lowered). rollup_box.py line 139 always writes `set`, so this is also a roll-up\
    \ gap that predates the fix; the Q1 fix is the natural place to hold it. A locked box with a pending capability\
    \ is possible only after /shape has run. pr.md severity P4."
