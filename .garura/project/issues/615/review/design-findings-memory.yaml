grounding:
  - principle: "Determinism lives at the skeleton; a play is a fixed skeleton. Parallelism is allowed last: independent boxes and checks may run concurrently under one parent. A fan-out must be bounded, joined and order-stable so the step stays one deterministic node."
    source: "main:docs/adr/025-level-3-redefined-skeleton-and-loop.md (Decision 'The determinism rule'; Consequences 'Parallelism becomes possible last'; Migration #468)"
  - principle: "Under direct-model-write the LLM writes only per-node doc files; a keyed script owns every shared file; containment is ONE post-write scoped guard over the full delta, run once before the checkpoint; the guard detects and reverts, it does not prevent. Its blind spot is stated: it sees out-of-scope paths, not which sibling wrote what."
    source: "main:docs/adr/026-direct-to-model-writes.md (Decision 1-4; 'Why this is the wrong shape', containment); main:core/components/memory/standards/rules/direct-model-write.md (steps 3-4, 'The shared scoped-write guard', L-DMW-3, L-DMW-6)"
  - principle: "The base concurrent-fanout.md allows only read-only concurrency under three conditions and states in two places that a writing run needs isolation and is #488, not covered"
    source: "main:core/components/memory/standards/rules/concurrent-fanout.md (intro lines 5-8; condition 1 parenthetical line 17; Related)"
  - principle: "#488 is parallel code-building: worktree pool, convergence before the gate, per-worktree changeset attribution, dynamic DAG frontier, per-piece retry"
    source: "GitHub issue #488 (committed record, read-only): 'Parallel build-loop: build independent DAG pieces concurrently with worktree isolation'"
  - principle: "Durability rule: shared scaffolding changed by hand must be reproduced by the play-creator compiler and checked by lint-components, so a direct edit and a rebuild converge"
    source: "main:CLAUDE.md (Play Pipeline Rules, 'Durability rule for non-intent edits')"
  - principle: "play-creator/SKILL.md is the compiler's own instruction file: it tells the compiler how to write a fan-out step and says a step whose sub-tasks write the repo stays serial (#488)"
    source: "main:core/components/plays/play-creator/SKILL.md lines 196-203 (file not changed by this PR)"
  - principle: "Every rule is listed in rules/_index.md with its consumers; status in the index stays in step with the rules"
    source: "main:core/components/memory/standards/rules/_index.md ('When to Add Here'; rows 43, 47)"
  - principle: "Drive contract: a drive-run play skips the opening and end sequence; /vision is the wired precedent; the shared checker is stamped into the play"
    source: "main:core/components/memory/standards/rules/drive-contract.md; main:docs/adr/029-drives.md"
  - principle: "Severity buckets P1-P4"
    source: "main:core/components/memory/standards/rules/pr.md (Severity buckets)"
grounding_unavailable: []
conformance_notes:
  scoped_write_guard_exists_on_main: "True. play-creator/references/scoped_write_guard.py exists on main with a test, and the copy in understand/scripts is byte-identical (cmp). It diffs the model tree against --base-ref and checks changed paths against the union of --allow globs, as the rule says. It does not attribute a changed path to a sub-task (nothing in the base script can)."
  coherence_with_adr_025: "Coherent. ADR 025 'Parallelism becomes possible last' allows independent boxes to run concurrently under one parent and names no read-only limit; the read-only limit lived only in the #468 rule, not in the ADR. The new section keeps the three ADR properties by stating them: fixed set (bounded), barrier before any later read (joined), outputs in input order (order-stable). One overstatement: the rule's own sentence 'Concurrency changes only timing, never the outcome' (line 71) is true for disjoint scopes but not for a stray write (see M-N3)."
  coherence_with_adr_026: "Coherent. Per-node docs by the sub-tasks, shared files by ONE keyed persist, ONE guard after all writes and before the checkpoint: this is ADR 026 steps 3-4 unchanged, with the guard allow-list widened to a union of scopes. direct-model-write.md says 'run once' and the new section runs it once after the join. direct-model-write.md is silent on concurrency (no 'concurren/parallel/fan' match), so there is no contradiction, only a one-way cross-reference."
  adr_needed: "No ADR or ADR amendment is required. ADR 025's determinism rule is untouched (the skeleton stays fixed, the join is bounded and order-stable) and it already permits concurrent independent boxes; the read-only restriction being loosened was set by the #468 rule file, and the rule file is the home of the fan-out decision (no ADR was written for #468 either). Optional: one line in direct-model-write.md or ADR 026's follow-ups naming scoped-write fan-out as a permitted shape (see M-N5)."
  overlap_with_488: "No overlap, no contradiction. #488 is code-building with SHARED files, worktree isolation, convergence and per-piece attribution. The scoped-write section requires disjoint, non-nested folders, no shared file, one persist and one guard, so it needs none of that machinery. The rule keeps #488 as the home for anything that may touch the same files. #488's body claims the survey found 'the only WRITING fan-out in the whole play catalog' - now stale (P4, M-N5)."
  pipeline_position: "The edited sentence is accurate: /understand's compiled SKILL.md runs check_drive_contract.py (Step 0a) and check_drive_contract.py is byte-identical to the play-creator canonical copy (cmp). Unchanged from round 1."
  pipeline_position_pos_wiring: "/understand stays listed under 'both' (#616), matching its frontmatter."
