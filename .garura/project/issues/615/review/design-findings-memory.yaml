findings:
  - id: M-N1
    category: memory
    severity: P2
    title: "play-creator/SKILL.md still tells the compiler that a step whose sub-tasks write the repo stays serial, so the scoped-write fan-out is not emitted by the compiler and is contradicted by it"
    file: core/components/plays/play-creator/SKILL.md
    line: "196-203 (not in the diff)"
    basis: "Durability rule: shared scaffolding must converge-and-lint so a direct edit and a rebuild produce the same result. The PR adds the scoped-write form to concurrent-fanout.md and to references/workflow-structures.md, and /understand is compiled with it by hand. play-creator/SKILL.md (the instruction the compiler reads on every run) still says 'A step whose sub-tasks write to the repo stays serial (#488)' and describes only the read-only form with 'the three safety conditions'. Two instruction files the compiler reads now disagree; a rebuild of /understand from ice.md follows whichever the compiler weighs, and the lint would pass a serial result silently (it only checks declarations, never that the form is used)."
    source: "main:CLAUDE.md (Durability rule); main:core/components/plays/play-creator/SKILL.md lines 196-203; main:core/components/memory/standards/rules/concurrent-fanout.md"
    fix: "Change the play-creator/SKILL.md paragraph (a non-intent direct edit, it is the compiler bootstrap) to name both forms and point at the five scoped-write conditions; keep 'anything else that writes stays serial (#488)'. The mirror in play-editor has no such sentence, so only play-creator needs it."
  - id: M-N2
    category: memory
    severity: P3
    title: "concurrent-fanout.md keeps three sentences that the new section contradicts or makes stale: the condition-1 parenthetical, 'Both forms obey the same three conditions', and the title/_index label 'read-only'"
    file: core/components/memory/standards/rules/concurrent-fanout.md
    line: "19 (condition 1 parenthetical 'A run whose sub-tasks WRITE the tree needs isolation - that is #488, not this'); 88 ('Both forms obey the same three conditions'); 1 (H1 'Concurrent Read-Only Fan-Out'); _index.md row 47"
    basis: "A rule must not give two answers to one question. Line 19 says a writing run needs isolation and is #488; the new section (lines 28-58) runs a writing step with no isolation. The scoped-write form obeys five conditions, not three. The title and index label still say the rule is read-only and the index calls it 'the one allowed intra-step concurrency' before listing a second kind. An agent reading only the title, index row or condition 1 gets the old rule."
    source: "main:core/components/memory/standards/rules/_index.md ('When to Add Here': the index tells agents which rules apply); main:core/components/memory/standards/rules/concurrent-fanout.md (the base text of lines 1, 17, 66)"
    fix: "Edit line 19 to 'a run whose sub-tasks write the tree under conditions other than the scoped-write ones needs isolation (#488)'; line 88 'the same bounded join'; retitle to 'Concurrent Fan-Out' and the _index label to match."
  - id: M-N3
    category: memory
    severity: P3
    title: "The stated limit (a stray write into a sibling's scope stays inside the guard's union) is documented but only weakly mitigated, and it makes the rule's own determinism claim untrue in that case"
    file: core/components/memory/standards/rules/concurrent-fanout.md
    line: "53-57 and 69-71"
    basis: "ADR 025 needs the fan-out to be order-stable ('same outcome concurrent or serial', rule lines 69-71). With disjoint scopes that holds. A stray write by sub-task A into B's folder races with B's own writes: the last writer wins by timing, so the tree depends on scheduling, which is what order-stability forbids. The guard cannot see it (ADR 026: the guard detects out-of-scope paths only; the union hides which sibling wrote). The rule mitigates by 'every node's content is still checked downstream (linter, judges, checkpoint)': those check a doc's shape and grounding, not who wrote it, so a plausible doc about the wrong capability can pass. Mitigated enough NOT to be P1/P2: the tree is on a feature branch, nothing is committed before review (condition 5), the effect is a content defect and not data loss, and the old serial run had the same union blind spot. But a cheap mechanical check exists and the rule does not use it."
    source: "main:docs/adr/025-level-3-redefined-skeleton-and-loop.md (determinism rule, bounded/joined); main:docs/adr/026-direct-to-model-writes.md (Decision 4 containment is detect-after-the-fact; Why this is the wrong shape point 1 'a language model can write outside its lane'); main:core/components/memory/standards/rules/direct-model-write.md ('The shared scoped-write guard')"
    fix: "Add a sixth condition or a sentence: each sub-task lists the model paths it wrote in its own output record, and one script checks after the join that every listed path sits in that sub-task's own scope and that the lists together cover the whole delta. That turns a sibling-scope stray write into a hard stop. Also soften 'never the outcome' to 'when no sub-task leaves its scope'. Escalate to P2 if /understand's step has no such check and the playbook treats the fan-out as proven."
  - id: M-N4
    category: memory
    severity: P3
    title: "The lint counterpart (check_fanout_declaration) is a partial converge-and-lint: whole-text substring checks, silent unless the play names the form, and no check of conditions 1 and 5"
    file: core/components/plays/play-creator/scripts/lint_play.py
    line: "check_fanout_declaration (~lines 349-378; the new block is after 'results = [...]')"
    basis: "Durability rule wants the rule change to have a lint counterpart. The new block fires only if the play text contains the exact phrase 'scoped-write fan-out' (a play that writes concurrently and declares only 'concurrent read-only fan-out' is accepted by the first result), and it passes if the tokens 'write scope' and 'shared file' appear anywhere in the whole play text, not in the fan-out step. It does not check that the scopes are verified distinct (condition 1), or that the guard runs after the join (condition 5). Condition 5's guard half is covered by the existing L-DMW-3/L-DMW-6 lint rows, so the gap is smaller than it looks. This is the same level of strength as the #468 read-only check it extends, so it is not P2."
    source: "main:CLAUDE.md (Durability rule); main:core/components/memory/standards/rules/direct-model-write.md (L-DMW-3, L-DMW-6); main:core/components/plays/play-creator/scripts/lint_play.py (check_fanout_declaration as it stood)"
    fix: "Scope the token check to the fan-out step's text, and fail a play whose step dispatches 'one agent per' item while citing neither form. Accept the rest as prose-only if no mechanical test is cheap."
  - id: M-N5
    category: memory
    severity: P4
    title: "One-way cross-references: direct-model-write.md and ADR 026 do not mention the scoped-write fan-out, and #488's body still says its survey found no other writing fan-out"
    file: core/components/memory/standards/rules/direct-model-write.md
    line: "n/a (not in the diff)"
