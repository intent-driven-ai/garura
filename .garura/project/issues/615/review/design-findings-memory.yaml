    source: "main:core/components/memory/standards/rules/direct-model-write.md; GitHub issue #488 body"
    fix: "Add one line to direct-model-write.md ('Containment') pointing to concurrent-fanout.md; add a note on #488 that /understand's scoped-write fan-out is a separate, disjoint-folder case."
