  title: The bad-status refusal case checks only that the exit was non-zero
  evidence: 'The case (lines 228-233) runs with --decision-status rejected and passes when the exit code is not 0. It does not
    assert that no decision file and no spine change were written, and argparse prints its usage message into the test
    output. The check is a real failure case (mutation (b) above makes it fail), so this is a tightening, not a hole.'
  why_it_matters: A future change that wrote the decision before the argument was refused would still pass this case. Low
    risk today because argparse refuses before any file is read.
  basis: knowledge/review/tests.md rubric, failure cases; mutation check above.
  suggestion: After the refusal, assert the decisions folder does not exist and the spine is unchanged; redirect stderr
    for the call so the test output stays clean.
