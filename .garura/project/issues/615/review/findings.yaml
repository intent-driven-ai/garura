- id: M-N3
  category: memory
  severity: P3
  status: null
  file: core/components/memory/standards/rules/concurrent-fanout.md
  line: 53-57 and 69-71
  title: The stated limit (a stray write into a sibling's scope stays inside the guard's union) is documented but
    only weakly mitigated, and it makes the rule's own determinism claim untrue in that case
  basis: "ADR 025 needs the fan-out to be order-stable ('same outcome concurrent or serial', rule lines 69-71).\
    \ With disjoint scopes that holds. A stray write by sub-task A into B's folder races with B's own writes: the\
    \ last writer wins by timing, so the tree depends on scheduling, which is what order-stability forbids. The\
    \ guard cannot see it (ADR 026: the guard detects out-of-scope paths only; the union hides which sibling wrote).\
    \ The rule mitigates by 'every node's content is still checked downstream (linter, judges, checkpoint)': those\
    \ check a doc's shape and grounding, not who wrote it, so a plausible doc about the wrong capability can pass.\
    \ Mitigated enough NOT to be P1/P2: the tree is on a feature branch, nothing is committed before review (condition\
    \ 5), the effect is a content defect and not data loss, and the old serial run had the same union blind spot.\
    \ But a cheap mechanical check exists and the rule does not use it. \u2014 main:docs/adr/025-level-3-redefined-skeleton-and-loop.md\
    \ (determinism rule, bounded/joined); main:docs/adr/026-direct-to-model-writes.md (Decision 4 containment is\
    \ detect-after-the-fact; Why this is the wrong shape point 1 'a language model can write outside its lane');\
    \ main:core/components/memory/standards/rules/direct-model-write.md ('The shared scoped-write guard')"
