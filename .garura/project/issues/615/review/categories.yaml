      - core/components/memory/standards/rules/concurrent-fanout.md
      - core/components/memory/standards/rules/_index.md
      - core/components/memory/standards/rules/pipeline-position.md
    notes: "The concurrent-fanout.md change is the weightiest: it relaxes a safety rule that ADR 025 (single deterministic node) and ADR 026 (direct-model-write, writes by keyed persist) bound, so Layer 2 must test it against both as they stand on main and against the base-ref concurrent-fanout.md and direct-model-write.md. Check the claim that scoped_write_guard.py exists on main and behaves as described, and that the rule's declared lint wording matches check_fanout_declaration. pipeline-position.md: check 'understand is wired with the shared check_drive_contract.py' is true of the branch. Layer 1: _index row matches the rule, cross-references resolve."
