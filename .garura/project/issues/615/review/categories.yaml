    design_bearing: true
    path_count: 3
    summary: "Standards rules edited. concurrent-fanout.md gains a second kind of allowed concurrency, the scoped-write fan-out (five conditions: own declared write scope, no shared file, distinct output paths, no sibling dependency, guarded after the join and committed only after review), loosening the earlier read-only-only rule. _index.md row for it is updated. pipeline-position.md lists /understand (#615) as wired for drive runs."
