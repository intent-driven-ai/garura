      - core/components/plays/play-editor/references/workflow-structures.md
    notes: "Intent change (ice.md plus compiled SKILL.md): check each SKILL.md change traces to ice.md and every constraint, failure and scenario stays covered by an eval (lint_play.py, lint-components). Layer 2 applies: ground only in committed base-ref sources (docs/philosophy, ADR 025 determinism, ADR 026 direct-model-write, ADR 029 and 030, standards rules such as concurrent-fanout, direct-model-write, drive-contract, play-close, no-unbacked-recommendation, pipeline-position, as they stand on main via git show main:path, the base-ref understand ice.md and SKILL.md, and the merged /vision change from #614 as precedent), never the branch's own ice.md, plan.md or work description. The two workflow-structures.md files are byte-identical to each other (verified); they are play-builder guidance, judged as harness."
