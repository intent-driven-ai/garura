    answer_rules.apply_writes_only_approved; tiers.phoenix line 10; errors.changed); core/tools/memory/README.md (the apply
    row and 'When no tier answers')
  line: null
  basis: null
  finding: 'v2 keeps apply as a command that "Write[s] an approved memory update to its tier: the issue''s short-term memory,
    Garura memory, or Phoenix memory as a commit", with applied_version the Phoenix commit. That matches ADR 036 parts 3 and
    4 on main, so it is not a departure from the record. It disagrees with two newer things. (1) The owner''s decision of
    2026-10-18, as recorded on this branch only: memory updates land in short-term memory only, a learn play moves them to
    Garura memory, a promote play sends a version to Phoenix memory for an approval that sits outside Garura, so this tool
