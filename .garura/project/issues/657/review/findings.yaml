  line: null
  basis: null
  finding: 'The saving rule gives the read command a write into another tier, and the contract defines it in one prose sentence
    at the end of the file, away from read. Three things are left open. (1) It is invisible in the answer: read''s response
    shape has no field that says the file was saved or where, and the check accepts a plain Phoenix read with no sign of saving
    (observed with a hand-made sample); the only proof is a later call to pulled. A rule nobody can observe in the answer
    cannot be checked by any caller or any engine. (2) No rule for a path Garura memory already holds. Observed in a throwaway
    folder: a Garura file with different content at the same path was silently replaced by a read of that path in Phoenix
    memory. ADR 035 part 1 says Garura memory also holds what the project makes itself, and lookup order means a same-path
    Garura file normally answers first, so this fires only on an explicit tier phoenix read, but the contract does not say
    replace, keep or refuse. (3) No rule for a failed save. The tool answers the read with the pull''s error even though the
    text was read (a read of Phoenix memory then needs Garura memory set up and writable); the contract''s text allows either,
    while ADR 035 part 3 says a lookup never blocks a play and ADR 009 Rule 4 says failure is loud.

    '
