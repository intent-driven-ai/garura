- id: TIC657-6
  severity: P3
  layer: design-grounding (tool-interface-contract)
  category: tool-interface-contract
  file: core/tools/memory/contract/v2.json (tiers.phoenix line 10; settings line 45; commands.health, find, read, pull and
    pulled version fields)
  line: null
  basis: null
  finding: '"Phoenix memory is read only at its approved version" has no committed definition. ADR 035 part 2 says each update
    is a commit with history, review and versions; ADR 036 part 3 says a promotion is approved by a person outside the work;
    neither names a ref, a branch or a way to tell an approved commit. v2 writes in a mechanism: a setting called phoenix_ref
    names the commit; a branch or an edit on disk is not read. That is the 657 plan''s own reading, which it marks "for the
    owner to correct". Gaps in how it is written: phoenix_ref appears only inside the tier''s prose, not in the settings clause
    (which lists only where each tier lives), and no default is stated (the tool defaults to origin/main, which the contract
    does not say); a git term is written into a contract meant to be engine-neutral (ADR 035 part 4: Griffin later); "a person
    approves it outside Garura" is a claim about a process the tool cannot see (the contract can only expose which commit
    was read, and it does through version); and the version fields do not say they are the approved ref''s commit, so pulled''s
    "moved on" and behind are ambiguous.

    '
