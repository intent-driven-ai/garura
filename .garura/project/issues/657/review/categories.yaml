      writes approved updates to their tier), which the plan and the PR body say was changed.
      All of these are branch content: history to read, never grounding. No design-grounding.
design_bearing_categories: [tool-interface-contract]   # the one category that needs a Layer 2 grounding dispatch. Not design-bearing: executable-code, tests, documentation (Layer 1 only) and the two STM categories (no playbook, no design content of their own).
absent_seeded_categories: [decision-records, harness, memory, config-maps]   # no docs/adr/** path; nothing under core/components/**; nothing under core/components/memory/**; the one config file with a change (.garura/core/config.yaml) is an uncommitted working-copy edit, not in the diff
