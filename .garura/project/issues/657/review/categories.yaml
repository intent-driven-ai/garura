      of them is in an ADR on main, and the 657 plan's 'After this story' says an amendment to ADR 035 and 036 is
      owed through /adr, with ADR 035 section 2's amendment already owed from #656. (4) the 606
      plan's item 1 text names Story #673 (the merge-play plan check) and its added log line names
      #621; whether those issues say so is not checked here (a read of the tracker is the play's
      job). Plans say what and in what order, never how; the 657 plan states 'a
      plan, not a design'.

