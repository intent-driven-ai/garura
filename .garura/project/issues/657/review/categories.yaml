playbook_sharpening:
  - id: review/tests
    note: "its signals are test folders and runners under the validate play; it does not say where an acceptance runner and its recorded output belong when they sit in an issue's evidence folder. It also says 'run the suite' without saying what to do when a runner needs an input the review does not have by default (here a clone of Phoenix memory)."
  - id: review/docs
    note: "it says a README that is not an ADR, harness or memory file is documentation with Layer 1 only; it does not say what to do when the README carries design statements that first appear in it (here, two rules of the folder engine). The categories file routes them to the design-bearing neighbour as claims to test."
  - id: review/code
    note: "it says to read data-safety paths hard; it does not say how to treat a command whose read has a write side effect (here a read of Phoenix memory that saves into Garura memory)."
