pr: 674
issue: 657
base: main
round: 1
head_assessed: b398fb5f   # the branch head this assessment was made at
changed_path_count: 73   # 18 added + 55 modified (git diff main...HEAD --name-status); equals the 73 changed_paths in context.yaml and the 73 file headers in pr.diff (checked: same set). The review folder .garura/project/issues/657/review/ is not in the diff (untracked, written by this run).
scope_warning: >
  The working copy of .garura/core/config.yaml differs from the committed one by one line
  (gates.plays.review-change set from off to on, uncommitted, for this run only; context.yaml
  gate_this_run). That file is not in the PR diff, so no config-map category is listed.
categories:
  - name: tool-interface-contract
    playbook: null
    playbook_missing: true   # not on the shelf; the same category was named in the issue 655 review (design-findings-tool-interface-contract.yaml); a playbook is still missing
    design_bearing: true   # the contract IS the written design of the memory tool's interface. Whether version 2 conforms to the decisions committed on main (ADR 034, 035, 036) cannot be settled by a linter. The play should dispatch one grounding for this category.
    layers: [linters, runnable-checks, design-grounding]   # Layer 1 = the contract check below; Layer 2 = grounding against main's ADRs
    evidence:
      - core/tools/memory/contract/v2.json   # new, 1154 lines: version 2.0.0 of the contract, a copy of v1 (kept unchanged on main) with the version 2 changes; the JSON-Schema-subset contract, eleven commands, three tiers, lookup order, request rules, answer rules, error codes
      # 20 sample answers moved from contract_version "1" to "2" (one version line each, 1 added + 1 removed)
      - core/tools/memory/contract/samples/apply-not-approved.json
      - core/tools/memory/contract/samples/apply-promotion.json
      - core/tools/memory/contract/samples/apply.json
      - core/tools/memory/contract/samples/cite.json
      - core/tools/memory/contract/samples/decide-not-waiting.json
      - core/tools/memory/contract/samples/decide.json
