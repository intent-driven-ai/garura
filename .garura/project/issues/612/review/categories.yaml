pr: 631
base: main
categories:
  - id: harness
    playbook: review/harness
    design_bearing: true
    summary: "New /intent play (compiled SKILL.md plus its ICE source and stop-condition), new author-business-intent skill, new build-product-ontology skill, new business-intent-keeper agent, and a small wording change to the install-garura play."
    evidence:
      - core/components/plays/intent/SKILL.md
      - core/components/plays/intent/reference/ice.md
      - core/components/plays/intent/stop-condition.yaml
      - core/components/skills/author-business-intent/SKILL.md
      - core/components/skills/build-product-ontology/SKILL.md
      - core/components/agents/business-intent-keeper.md
      - core/components/plays/install-garura/SKILL.md
    notes: "Intent change for a new play, so the ICE-to-SKILL trace, agent-first delegation, play orchestrates / skills produce / scripts do mechanical work, and the Standard Play Close are the main design checks. install-garura SKILL.md edit is a wording change that states the meta-utility scope; check it against its own ICE source only if the install guarantees changed."
  - id: memory
    playbook: review/memory
    design_bearing: true
    summary: "Standards that agents read: a new product ontology schema, a new ontology template, an ICE schema change, a template index entry, and one new line in the pipeline-next successor map."
    evidence:
      - core/components/memory/standards/schemas/product-os/ontology.md
      - core/components/memory/standards/schemas/product-os/ice.yaml
      - core/components/memory/standards/schemas/product-os/_index.md
      - core/components/memory/standards/templates/product-ontology.md
      - core/components/memory/standards/templates/_index.md
      - core/components/memory/standards/rules/pipeline-next.md
    notes: "Standards, schemas and templates under memory/standards, not a knowledge shelf. The playbook covers standards. Ground ontology and ICE changes against the base-ref product-os schemas, glossary, philosophy docs and ADRs, not against the new ontology text itself."
  - id: executable-code
    playbook: review/code
    design_bearing: false
    summary: "Python scripts: the intent play's mechanical helpers (capture, checks, persist, preflight, write guard, session stamp), the ontology checker, and the install script change."
    evidence:
      - core/components/plays/intent/scripts/capture_source.py
      - core/components/plays/intent/scripts/check_intent.py
      - core/components/plays/intent/scripts/check_stop_condition.py
      - core/components/plays/intent/scripts/persist_intent.py
      - core/components/plays/intent/scripts/preflight.py
      - core/components/plays/intent/scripts/scoped_write_guard.py
      - core/components/plays/intent/scripts/session_stamp.py
      - core/components/skills/build-product-ontology/scripts/check_ontology.py
      - core/components/plays/install-garura/scripts/install.py
  - id: tests
    playbook: review/tests
    design_bearing: false
    summary: "Unit tests for the intent play scripts and for the ontology checker."
    evidence:
      - core/components/plays/intent/scripts/test_intent_scripts.py
      - core/components/skills/build-product-ontology/scripts/test_check_ontology.py
  - id: docs
    playbook: review/docs
    design_bearing: false
    summary: "Component reference pages updated to list the new intent play, skills and agent."
    evidence:
      - docs/components/agents.md
      - docs/components/plays.md
      - docs/components/skills.md
  - id: config-maps
    playbook: review/config-maps
    design_bearing: false
    summary: "Install manifest is a file that lists installed components by path; it gains the build-product-ontology skill and the skill count moves from 10 to 11."
    evidence:
      - .garura/install-manifest.json
    notes: "Generated by install-garura. Check that the listed paths exist and the counts match."
  - id: stm-run-records
    playbook: null
    playbook_missing: true
    design_bearing: false
    note: "Playbook missing. These are work-tracking and run artifacts under .garura/project/issues (plans, decisions, ontology run notes, trial run drafts and checks, guard reports, context and PR scratch files). They are not KB memory, docs or ADRs. Needs its own playbook, or an explicit decision that they are out of review scope. Plan and decisions files may be used as the stated intent the change is checked against, but they are branch-added, so never as design grounding. Plans for issues 606 and 616 were edited here as small changes."
