questions:
- intent: all
  ask: Is there an intent you hold that these sources do not show, or one here that is not deep enough?
  examples:
  - Collect these numbers from many people, not just one.
  - Show whether AI work follows a set method or is done ad hoc.
  - None, these cover it.
  answer: when i read these, they dont sound liek intent. foe example kapil knows how much AI work happens...
    this isnt intent. intent will be deeper. / intents — 1) token economics aka how ar tokens spent and
    are they bringing in value. 2) When we build harness, are they bring useful, driving agent autonomy?
    3) drive adotion across teams, who is adopting frameworks or are they using it like vibe coding. and
    4) collect this data across team(2) -> this one isnt in dashboard as this was created as concept..
    this is the intent that i want to run with
- intent: token-economics
  ask: Why does it matter to the business to know how AI tokens are spent and whether they bring in value?
  examples:
  - AI spend is growing, and we need to show it pays back.
  - We need to know which work is worth handing to AI, and which is not.
  - We pick models and plans by habit today, not by cost and value.
  answer: AI spend is growing and we need to show it pays back
  picked: true
- intent: token-economics
  ask: How will we know this intent is met?
  examples:
  - Cost per piece of finished work goes down month on month.
  - Each team can show what its AI spend delivered.
  - We can name the workflows where AI does not pay back, and stop or change them.
  answer: each team can show what its AI spend is and what they are delivering
- intent: harness-autonomy
  ask: Why does it matter to the business whether the harnesses we build are useful and drive autonomy?
  examples:
  - We put real effort into building harnesses, and we need to know which ones earn it.
  - More agent autonomy means people spend less time steering, so they can do more.
  - We want to keep the harnesses that work and stop building ones that do not.
  answer: building harness are real time investment, and they are supposed to prvide value. we need to
    see which one works, by seeign the ones that are driving autonomy and delivering quality and consistent
    results
- intent: harness-autonomy
  ask: How will we know this intent is met?
  examples:
  - Each harness shows how often agents finish without a person stepping in, the quality of what they
    deliver, and how alike the results are from run to run.
  - Harnesses that do not improve autonomy or quality within a set time are reworked or retired.
  - Fewer steering messages per finished task, release after release.
  answer: harness usage will have autonomy scope. consistent and quality comes from another part of control
    tower later.
- intent: framework-adoption
  ask: Why does it matter to the business that teams adopt the frameworks?
  examples:
  - Work done through the frameworks is repeatable and can be checked; vibe-coded work is not.
  - The frameworks are where we put our investment and our learning; if teams skip them, the investment
    is lost.
  - Clients and leaders need to see that AI work follows a method, not luck.
  answer: Clients and leaders need to see that AI work follows a method, not luck.
  picked: true
- intent: framework-adoption
  ask: How will we know this intent is met?
  examples:
  - For each team, we see what share of its AI work runs through the frameworks, and that share goes up
    over time.
  - Every team has at least one person who uses the frameworks each week.
  - Leaders can see, for any team, how much of its AI work followed a method.
  answer: people on team are using harness  consitently and also we see autonmy score rise
- intent: collect-across-teams
  ask: Why does it matter to the business to collect this data across teams?
  examples:
  - One person's numbers prove nothing; the first three intents only work if every team's data is in.
  - Leaders need one view of AI spend, harness use and adoption across the whole organisation.
  - Teams can compare themselves and learn from the ones that do it well.
  answer: teams work together to deliver results.. roll-ups will be critial. rollups are - individual,
    team, account, unit
- intent: collect-across-teams
  ask: How will we know this intent is met?
  examples:
  - Every person on the pilot teams sends their data each day, and it rolls up to team, account, and unit
    with no manual work.
  - One account sees its full roll-up, from each person up to the account, every week.
  - Each unit's leader can see the roll-up for every team and account in their unit.
  answer: data is collected thru autoated script every day from the peple who are signed up on this tool
    and each leader can see it - intividual's lead is self. and team, account and unit can see cumulative
    and roll-downs
- intent: collect-across-teams
  ask: 'Today''s written rules keep each person''s numbers private: no client or project names, no prompts,
    no file locations, and nothing sent anywhere without the owner''s go-ahead. A roll-up from each person
    to team, account and unit needs to know who each person is and where they belong, and the workflow
    view already names projects. What may the collected numbers carry?'
  examples:
  - Person, team, account and unit names, but never prompts, file locations or raw records.
  - Team, account and unit names only; a person's own numbers show by name only to that person and their
    lead.
  - All of that plus project names, so leaders can see which work the spend went to.
  answer: ''
