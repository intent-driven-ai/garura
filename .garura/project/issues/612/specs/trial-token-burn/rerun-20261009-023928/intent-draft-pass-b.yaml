intents:
- id: token-economics
  title: Know how AI tokens are spent, and whether they bring in value
  outcome: For every team, it is clear what its AI spend is, what that spend goes to, and what it delivers
    in return, so the spend can be shown to pay back.
  why: AI spend is growing, and we need to show it pays back.
  asked_by: Kapil Viren Ahuja
  proof: Each team can show what its AI spend is and what it is delivering.
  must_not: Never present an estimate as an exact count, and never change how usage is counted without
    saying so.
  provenance:
    title: person
    outcome: person
    why: person
    asked_by: person
    proof: person
    must_not: source
- id: harness-autonomy
  title: Know whether the harnesses we build are useful and drive agent autonomy
  outcome: For every harness we build, we can see whether it is useful and how far it lets agents work
    on their own, so we keep the ones that earn the time put into them.
  why: Building harnesses is a real investment of time, and they are meant to give value back. We need
    to see which ones work, by seeing the ones that drive autonomy and deliver quality, consistent results.
  asked_by: Kapil Viren Ahuja
  proof: How each harness is used shows how much autonomy it gives the agents.
  must_not: Do not judge harnesses on the quality or consistency of their results here; that comes later,
    from another part of the control tower.
  provenance:
    title: person
    outcome: person
    why: person
    asked_by: person
    proof: person
    must_not: person
- id: framework-adoption
  title: Drive adoption of the frameworks across teams, instead of ad hoc vibe coding
  outcome: Across teams, it is clear who works through the frameworks and who uses AI ad hoc, without
    a method, and more of the work moves onto the frameworks.
  why: Clients and leaders need to see that AI work follows a method, not luck.
  asked_by: Kapil Viren Ahuja
  proof: People on each team use the harnesses consistently, and their autonomy score rises.
  must_not: ''
  provenance:
    title: person
    outcome: person
    why: person
    asked_by: person
    proof: person
    must_not: ''
- id: collect-across-teams
  title: Collect this data across teams, rolled up from each person to team, account and unit
  outcome: The AI numbers are gathered every day from everyone signed up, and add up from each person
    to their team, account and unit, so every leader sees the picture for the people they lead.
  why: 'Teams work together to deliver results, so roll-ups are critical: from each individual, to the
    team, the account and the unit.'
  asked_by: Kapil Viren Ahuja
  proof: An automatic job collects the data every day from everyone signed up to the tool. Each person
    sees their own numbers, and the leaders of a team, an account or a unit see the totals for their group
    and can drill down into the parts below it.
  must_not: Never let prompts, file locations or raw records into the numbers that leave a person's machine,
    and never send them anywhere without their owner's clear go-ahead.
  provenance:
    title: person
    outcome: person
    why: person
    asked_by: person
    proof: person
    must_not: source
ice:
- id: ai-spend-in-money
  title: What AI work costs in money, and where the bill is heading
  built_from: token-economics
  goals:
  - See what AI work has cost in total, over the last month and per working day, and judge whether the
    spend is in line with what was expected.
  - See the cost of each day and of each model, and tell which days and which models push the bill up.
- id: what-drives-the-bill
  title: Which kind of AI usage drives the bill
  built_from: token-economics
  goals:
  - See how much of the usage and how much of the cost comes from each kind of usage (new instructions,
    context saved for reuse, saved context read back, and the answers the AI writes), and decide where
    a change in how work is run would cut the bill most.
  - Tell when a large share of usage costs very little, so sheer volume is never mistaken for spend.
- id: kinds-of-work
  title: Which kinds of work AI is spent on
  built_from: token-economics
  goals:
  - See what share of AI usage each kind of work takes, such as building, client work, writing, tooling,
    leadership and personal work, and judge whether AI effort goes to the work that matters most.
  - For the heaviest days, see which kind of work caused them, and decide whether those spikes were worth
    it.
  - Correct the kind of work a day is filed under when it is wrong, and have that correction hold from
    then on.
- id: ai-use-over-time
  title: How much AI work there is, and how that changes
  built_from: token-economics
  goals:
  - See the total amount of AI work, the busiest day, and the weekly and monthly averages, and judge whether
    the amount spent on AI is growing, holding or falling.
  - See every day and every week side by side, and spot quiet stretches and sudden spikes that are worth
    a closer look.
- id: tool-split
  title: Which AI tool carries the work
  built_from: token-economics
  goals:
  - See how much of the AI work, and how many working sessions, run through each AI tool, and judge how
    heavily the work leans on one tool.
- id: model-mix-moves
  title: Moving work onto newer models
  built_from: token-economics
  goals:
  - See each model's share of AI usage and, day by day, which models were in use, and tell whether moves
    to newer models happen fully and consistently or older models linger.
- id: model-per-workflow
  title: The right model for each repeated workflow
  built_from: token-economics
  goals:
  - For each repeated workflow, see what a typical run costs on each model and which model is suggested,
    and decide which model to run it on.
  - Tell how much weight a suggestion carries from how many runs it rests on.
  - Compare models across all workflows by the typical cost of a run, and see when a few heavy runs distort
    the average.
- id: workflow-cost
  title: What each repeated workflow and each project costs
  built_from: token-economics
  goals:
  - See the total usage of each repeated workflow, grouped by project, and judge which workflows and which
    projects take the most AI spend.
- id: trust-the-numbers
  title: How far the numbers can be trusted
  built_from: token-economics
  goals:
  - Tell for any figure whether it is an exact count, and which days were counted the old way and are
    likely about three times too high.
  - Know how up to date the numbers and the prices behind them are, which days have no cost breakdown,
    and which work is left out of the count, so no judgement rests on missing or stale figures.
  - Rely on past days staying on record even after the records they came from are cleared away.
- id: workflow-steering
  title: How much a person has to steer each workflow and model
  built_from: harness-autonomy
  goals:
  - For each repeated workflow, see how many messages a person sends per run, and tell which ones let
    the agent finish with little steering and which still need a lot.
  - Across all workflows, see how much steering each model needs per run, and tell which models work most
    on their own.
  - Decide which workflows to rework or stop because people have to steer them far more than the rest.
- id: framework-use
  title: Which frameworks' workflows are really used
  built_from: framework-adoption
  goals:
  - For each project, see which of its repeated workflows are run and how often, and tell which frameworks
    are in real use and which are barely touched.
- id: steady-daily-use
  title: Whether AI is used every day or in bursts
  built_from: framework-adoption
  goals:
  - See the current and the longest run of days with AI work, and the share of all days that had any,
    and judge whether AI has become a daily way of working or is used only in bursts.
- id: safe-to-share
  title: Sharing the numbers without exposing private work
  built_from: collect-across-teams
  goals:
  - Know that the numbers prepared for sharing hold only figures and general labels, with no client or
    project names, prompts, file locations or raw records, and decide when it is safe to share them.
  - Keep each person's numbers on their own machine until they agree to share them.
sources:
- snapshot_dir: .garura/product/_evidence/intent/20261009-023928/source-app
  shows: A running dashboard of one person's AI usage, read from that person's own records, in four views.
    The first shows how much AI work happened over time, how steady it was, which AI tool and which kind
    of work it went to, and the last month day by day. The second shows which AI models were used and
    how use moved to newer ones; the third shows what each repeated workflow costs on each model, how
    much steering it needed, and which model to pick; the fourth shows the cost in money and what drives
    it.
- snapshot_dir: .garura/product/_evidence/intent/20261009-023928/source-project
  shows: 'The written notes behind the same dashboard: its purpose, how it counts AI usage and files each
    day under a kind of work, and how it refreshes itself every night. They set firm rules: count only
    exact usage, never estimates; keep history even when old records are cleared; and keep the shareable
    numbers free of names, prompts and file locations, sending nothing anywhere without the owner''s go-ahead.
    They also note the dashboard grew from a starter kit that tracked more tools, some only by estimate.'
