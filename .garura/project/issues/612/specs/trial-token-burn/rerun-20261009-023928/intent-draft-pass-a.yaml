questions:
- intent: know-where-ai-spend-goes
  ask: Why does it matter to the business to know where AI spend goes?
  examples:
  - AI costs about 68 dollars per working day, and we need to show it is worth it.
  - We need to decide which work is worth handing to AI, and which is not.
  - Budgets for AI tools need real numbers behind them.
  answer: ''
- intent: know-where-ai-spend-goes
  ask: How will we know this intent is met?
  examples:
  - Each month we can say what AI cost and which kinds of work it went to.
  - We can name the work where AI spend does not pay back, and stop or change it.
  - No decision rests on a figure we cannot trust.
  answer: ''
- intent: hand-more-work-to-ai
  ask: Why does it matter to the business to hand more of the work to AI?
  examples:
  - Work handed to AI frees people for work only they can do.
  - We keep asking what the computer should do next, and want the answer to grow.
  - We want AI to be part of daily work, not an occasional tool.
  answer: ''
- intent: hand-more-work-to-ai
  ask: How will we know this intent is met?
  examples:
  - The weekly amount of AI work grows, quarter on quarter.
  - AI is used on most working days.
  - More kinds of work show up as done with AI.
  answer: ''
- intent: right-model-for-the-work
  ask: Why does it matter to the business which model runs each piece of work?
  examples:
  - One model alone cost about 887 dollars, so the choice of model moves the bill.
  - New models arrive often, and we should move to them only when they help.
  - Picking models by habit wastes money.
  answer: ''
- intent: right-model-for-the-work
  ask: How will we know this intent is met?
  examples:
  - Every repeated workflow has a chosen model backed by enough runs.
  - The cost of a run of each workflow goes down after a model change.
  - Older models stop being used within a set time once a newer one proves better.
  answer: ''
- intent: less-steering-from-people
  ask: Why does it matter to the business that people steer AI less?
  examples:
  - Every message spent steering AI is time not spent on other work.
  - A workflow that needs heavy steering has not really been handed over.
  - We build workflows for AI, and need to know which ones earn that effort.
  answer: ''
- intent: less-steering-from-people
  ask: How will we know this intent is met?
  examples:
  - Messages per run fall, workflow by workflow, over time.
  - No workflow needs more than a set number of messages per run.
  - Workflows that still need heavy steering are reworked or retired.
  answer: ''
- intent: share-numbers-safely
  ask: Why does it matter to the business that others can see these numbers?
  examples:
  - A team, its leaders or clients need to see the numbers, not just one person.
  - Numbers only one person can see cannot support a decision beyond that person.
  - Showing the numbers proves how AI work is really done.
  answer: ''
- intent: share-numbers-safely
  ask: How will we know this intent is met?
  examples:
  - The shared numbers are checked and hold no names, prompts or file locations.
  - The people who need the numbers can see them, privately.
  - Nothing leaves Kapil's machine without Kapil's go-ahead.
  answer: ''
- intent: share-numbers-safely
  ask: The workflow view names projects, while the written rules say shared numbers never carry project
    names. Should project names stay out of anything shared?
  examples:
  - Yes, keep project names out of anything shared.
  - Project names are fine to share within the team, not outside it.
  - Show project names to the owner only, and general labels to everyone else.
  answer: ''
- intent: all
  ask: Whose AI work should these intents cover?
  examples:
  - Kapil's own work only.
  - A team's work, added up from each person in it.
  - Every team across the organisation.
  answer: ''
- intent: all
  ask: Is there an intent you hold that these sources do not show, or one here that is not deep enough?
  examples:
  - Collect these numbers from many people, not just one.
  - Show whether AI work follows a set method or is done ad hoc.
  - None, these cover it.
  answer: ''
