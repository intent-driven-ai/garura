intents:
  - id: token-economics
    title: "Know how AI tokens are spent and whether they bring in value"
    outcome: "Kapil can see where the AI tokens, and the money they cost, are being spent: on which kind of work, through which tool and model, in which repeated workflow, and how that changes over time. From that, Kapil can judge whether the spend is bringing in value."
    why: "AI spend is growing, and we need to show that it pays back."
    asked_by: "Kapil"
    proof: "Each team can show what its AI spend is and what it is delivering for that spend."
    must_not: "Count any use from a guess instead of an exact record, lose a day that was already counted, or need anyone to keep the numbers up to date by hand."
    provenance: { title: person, outcome: person, why: person, asked_by: person, proof: person, must_not: source }
  - id: harness-autonomy
    title: "Know whether the harnesses we build are useful and drive agent autonomy"
    outcome: "For each harness we build, meaning the repeatable workflows and guardrails set up around AI agents, Kapil can tell whether it is useful and whether it lets the agent work on its own, needing less direction from a person."
    why: "Building a harness is a real investment of time, and each one is meant to give value back. We need to see which harnesses work, by seeing the ones that drive agent autonomy and deliver good, consistent results."
    asked_by: "Kapil"
    proof: "Each harness carries an autonomy score, worked out from how it is actually used."
    must_not: "Judge a harness from guessed figures rather than exact records of real runs."
    provenance: { title: person, outcome: person, why: person, asked_by: person, proof: person, must_not: source }
  - id: framework-adoption
    title: "Drive adoption across teams by seeing who works through the frameworks and who vibe codes"
    outcome: "Across the teams, Kapil can see who has taken up the frameworks and who is using AI like vibe coding, prompting freely with no framework, so that adoption of the frameworks can be pushed where it is lagging."
    why: "Clients and leaders need to see that AI work follows a method, not luck."
    asked_by: "Kapil"
    proof: "People on each team use the harnesses consistently, and their autonomy score rises over time."
    must_not: "Share or publish anything beyond figures and plain labels for the kind of work: never client names, project names, file locations or prompts, and nothing sent anywhere without the owner's say-so."
    provenance: { title: person, outcome: person, why: person, asked_by: person, proof: person, must_not: source }
  - id: collect-across-teams
    title: "Collect this usage data across the teams"
    outcome: "The data behind the first three intents, how tokens are spent, how useful the harnesses are and who uses the frameworks, is gathered from everyone across the teams, not only from Kapil's own work."
    why: "Teams work together to deliver results, so seeing the data rolled up is critical. It rolls up at four levels: the individual, the team, the account and the unit."
    asked_by: "Kapil"
    proof: "Every day, an automated script collects the data from the people who have signed up to the tool, and each leader can see the level they lead. For an individual, the lead is that same person. Leaders of a team, an account or a unit see the combined total for their level and can drill down into the levels beneath it."
    provenance: { title: person, outcome: person, why: person, asked_by: person, proof: person }
sources:
  - snapshot_dir: ".garura/product/_evidence/intent/20261008-143446/source-app"
    shows: "A dashboard of one person's AI use, in four views. The first gives the overall picture: totals, the busiest day, recent averages, runs of active days, a calendar of quiet and busy days, the weekly direction, the split between two coding tools, the kinds of work driving use, and the last thirty days in detail. The second shows which AI models were used and how that changed day by day, and the third shows, for each repeated workflow grouped by project, its use per run and how much direction each model needed, with a suggested model. The fourth shows what the use cost in money, by kind of use, by model and by day."
  - snapshot_dir: ".garura/product/_evidence/intent/20261008-143446/source-project"
    shows: "The written notes behind the same dashboard: what it is for, where its numbers come from, and the rules it keeps. They say the numbers come only from exact records on Kapil's own machine and never from estimates, that each day is labelled by the kind of work that drove it and a wrong label can be fixed for good, that the record refreshes itself every night and never loses history, and that nothing leaves the machine without Kapil's say-so. It also keeps the notes of the starter kit it grew from, which aimed to show every AI tool side by side with exact and estimated use kept apart."
