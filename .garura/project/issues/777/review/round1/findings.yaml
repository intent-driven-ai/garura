    2
  path: core/components/agents/product-os-keeper.md (not in the diff) vs core/components/plays/edit-ontology/SKILL.md
  message: 'The new play makes product-os-keeper the only runner of author-product-ontology,
    and author-product-ontology is no longer user-invocable, so the agent is now the
    only door to it. On the base ref the agent file has no row for author-product-ontology
    in its skill table and its description does not list /edit-ontology (the only
    ''ontology'' mention is a version note, line 182). The agent file is unchanged
    by this PR. A reader of the agent cannot see it owns this skill, and the agent''s
    ''pool'' is the contract the play relies on.

    '
  fix: null
- category: harness
  severity: P3
  basis: 'origin/plan/756/base:core/components/memory/standards/rules/pipeline-next.md
    (header and meta_exempt note: ''Meta / bootstrap plays - not part of the product
    pipeline; no Next required''); lint_play ''next-command'' check'
  path: core/components/plays/edit-ontology/SKILL.md (Step C2) and core/components/memory/standards/rules/pipeline-next.md
  message: 'The play is added to meta_exempt (so lint passes), yet Step C2 tells the
    run to resolve the play in $next_map and render a Next line, which the map will
    never hold for it. The instruction cannot be followed as written. The Next Steps
    text (''plays that write the changed kinds may now need edit-play'') is hand-written
    in the play instead of coming from the map.

    '
  fix: null
- category: harness
  severity: P3
  basis: 'origin/plan/756/base:core/components/memory/standards/rules/pipeline-position.md
    (''As compiled today: both - ...''; Enforced: ''strategic, model-building, and
    meta plays are none'')'
  path: 'core/components/memory/standards/rules/pipeline-position.md (not updated)
    vs edit-ontology position: both'
  message: 'edit-ontology is a meta (harness) play (META_PLAYS, meta_exempt) but declares
    position: both. The rule states meta plays are ''none'' and lists the compiled
    ''both'' plays; edit-ontology is in neither the list nor an exception. The play
    records its own ''position_exception'' in Compilation Metadata, but the source
    rule does not carry it, so the rule and the play now disagree. Precedent exists
    (record-decision and discover-capabilities are ''both'' and commit their own work),
    so the position itself is defensible; the gap is the rule text.

    '
  fix: null
