  path: core/components/skills/author-product-ontology/SKILL.md
  message: 'The new Stages section says each stage ''reads the drafts of the stages
    before it'' and may carry `change` and `problems`, but the Input table is unchanged:
    no `stage`, no draft-path inputs, no `change`, no `problems`, and no Output row
