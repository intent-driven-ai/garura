  - id: DG-2
    severity: P3
    file: core/components/plays/edit-ontology/SKILL.md (Step C2)
    principle: "G5 - a meta_exempt play gets no Next line."
    source: "origin/plan/756/base:core/components/plays/_shared/play-close.md Step C2 ('Next (always, unless the play is meta_exempt)'); pipeline-next.md meta_exempt"
    basis: >
      The PR adds edit-ontology to meta_exempt, yet Step C2 still tells the run to resolve the play
      in $next_map and render a Next line. A meta_exempt play has no entry in the map, so the step
      cannot be followed as written, and it contradicts the shared close the play points to.
      Carried over unchanged from round 1; commit dc00dd95 did not touch it.
    suggestion: "Change C2 to say no Next line (edit-ontology is meta_exempt); emit only the /next pointer. This is a non-intent edit to the compiled SKILL.md."
