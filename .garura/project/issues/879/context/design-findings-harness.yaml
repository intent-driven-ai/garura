principles:
  - id: PR-1
    principle: "An Epic stands for one slice and holds its Stories (one per feature of the slice); a Spike, Chore or Bug is a child of one Story and so sits in that Story's Epic. A Chore or Bug has its Story as a required parent."
    sources:
      - "plan/788/base:docs/adr/048-the-product-model-and-the-work-are-two-layers.md, Decision section 3 (Accepted): 'An Epic represents one slice. It holds stories ... A Spike, Chore or Bug is a child of one story'"
      - "plan/788/base:core/components/memory/standards/schemas/product-os/ontology.md, Epic (Relationships: Epic -> Story; Rules: 'Its stories are one for each feature of its slice'), Chore and Bug (Parent: its one story, required)"
      - "plan/788/base:docs/standards/harness-standard.md, principle 7 ('Bugs always sit under a feature')"
      - "plan/788/base:.garura/user-provided/managing-work.md, 'Where does it hang?' ('every Bug, Spike and Chore under a Story')"
  - id: PR-2
    principle: "A slice is a group of features that gives a vertical a person can test end to end; the plan play makes one Epic for each slice a plan holds, plus one Story for each feature. A thing with no screen or surface a person can test is not a slice. No committed play places a Bug or a Chore."
    sources:
      - "plan/788/base:docs/adr/049-a-slice-is-shaped-then-planned-then-given-its-eval.md, Decision list item 1 ('A thing with no screen or surface that a person can test end to end is not a slice, and /shape-slice does not shape it') and item 2 (the plan play makes the plan, the epic for the slice, one story for each feature of the slice, and the hidden file)"
      - "plan/788/base:core/grounding/glossary.md, rows 'Slice' and 'Epic (ProductOS)'"
      - "plan/788/base:core/components/plays/shape-plan/reference/ice.md and SKILL.md: no step makes, finds or places a Bug or Chore (grep finds none)"
  - id: PR-3
    principle: "A change to what a part guarantees is made in its ICE and the part is compiled again; the compiled part carries the fingerprint of its ICE."
    sources:
      - "plan/788/base:docs/standards/harness-standard.md, principle 4 (ADR 027)"
      - "plan/788/base:CLAUDE.md, Play Pipeline Rules (an intent change goes through reference/ice.md)"
  - id: PR-4
    principle: "Build the eval first: every guarantee has a check that can fail on it. A routing line sends each failure to its recovery."
    sources:
      - "plan/788/base:docs/standards/harness-standard.md, principle 5"
      - "plan/788/base:core/components/plays/shape-plan/SKILL.md Step 8 (base wording: each exit-1 cause of check_tracker.py names its recovery)"
  - id: PR-5
    principle: "A person sees, in plain words, what each item is before the one typed yes; a human-facing message leads with the product's words and names an item with its title, not a bare identifier."
    sources:
      - "plan/788/base:core/components/plays/shape-plan/reference/ice.md, C11 and C8"
      - "Phoenix memory (memory tool, --tier phoenix): standards/rules/user-facing-voice.md, fingerprint sha256:8ead1cfefb30b7efa09d46f72574bded3f9e511029dfdf8ad6480db0faca8443 (copy in memory_dir)"
  - id: PR-6
    principle: "Branches follow the plan: each issue is cut as a sub-branch of plan/<id>/base and lands back on it. A plan holds one epic for each slice that serves its business intent."
    sources:
      - "plan/788/base:docs/standards/harness-standard.md, principle 8"
      - "plan/788/base:CLAUDE.md, Work Tracking"
      - "plan/788/base:docs/adr/049-...md ('A business intent has one plan ... holds every slice that serves its intent')"
  - id: REQ-1
    principle: "What the product owner asked for in #879 (read only, from the tracker): an epic stands for one slice; /shape-plan names any work under an epic that is not its slice's, with its title, and stops before any tracker write; the tracker check names it the same way."
    sources:
      - "GitHub issue #879 body, section 'Decided on 2026-10-26' and 'Done when' (gh issue view 879, read only)"
    note: "A requirement, not a model principle. Used only to test that the play does what was asked, never to say the model allows it."

round_1_resolution:
  - id: H-1
    status: resolved
    how: "Round 1 flagged C13/S3 letting an epic hold other children, against PR-1. Round 2 removes that: C13 now says an epic's sub-issues are the stories of its slice and the work under a story hangs from that story; anything else is misplaced work and the play stops. That agrees with ADR 048 Decision 3 and the ontology Epic rules (PR-1). S3 is back to base wording. The shape the model calls drift is no longer accepted as correct. Nothing in ADR 048, the ontology or the glossary needs to change for the epic rule itself. A residual gap about where misplaced work goes is raised as H-5 (P3), a much smaller question than H-1."
  - id: H-2
    status: resolved
    how: "Round 1: Step 8 did not route the new F11/REC11 causes. Round 2 drops those causes (F11/REC11 are unchanged from base; SKILL.md Step 8 line is unchanged). Round 2 adds one new check_tracker.py exit-1 cause, misplaced work, that Step 8 does not route either; raised as H-7 (P4)."
  - id: H-3
    status: resolved
    how: "Round 1: C13/F11 promised 'never adds, removes or changes the other children' with a check that proved only removal. Round 2 removes that promise. The new promise is 'writes nothing until a person files it'; SE-19 and SCE-8 can fail on it (misplaced non-empty with ok true, a tracker-record.json present, or the plan file's shasum differing from plan-before.txt)."
  - id: H-4
    status: resolved
    how: "Round 1: the brief listed other children as bare numbers. Round 2 drops the brief line (render_brief.py is not in the diff). The stop happens at Step 2, before any brief; SKILL.md says each misplaced item is shown with its title, and the script message carries it ('#n \"title\"'). PR-5 holds."

