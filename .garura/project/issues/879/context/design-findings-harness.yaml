findings:
  - id: H-5
    severity: P3
    file: core/components/plays/shape-plan/reference/ice.md
    lines_hint: "C13 ('its own story, bug or chore, which /shape-slice and /shape-plan place when they run'), REC12; same words in SKILL.md Step 2 and the F12 row"
    principle_violated: [PR-1, PR-2]
    committed_source: "plan/788/base:ontology.md Chore and Bug (Parent: its one story, required); docs/standards/harness-standard.md p7; docs/adr/049-...md Decision items 1-2; base shape-plan and shape-slice ICE/SKILL.md (no step places a Bug or Chore)"
    severity_basis: "pr.md bucket P3 (minor: a promise the other plays and the model do not back, no behaviour break; the play itself only stops and names)"
    finding: >-
      The recovery tells the person to file a misplaced item 'in its own place (its own story, bug or chore)'
      and says /shape-slice and /shape-plan 'place' it when they run. The accepted model has no
      parentless Bug or Chore: both need a Story as their parent (PR-1). And no committed play
      places one: /shape-slice shapes a slice of features and the plan play makes an epic and one
      story per feature (PR-2). So for a Bug or Chore the recovery points to a place the model does
      not hold and to a placement no play does. The part that is right: the play stops, names each
      item with its title, and writes nothing, which is what #879 asks (REQ-1), and a misplaced
      Story is placed by the plan play when its slice gains the feature. The product owner's
      wider rule (file it on its own, record it later) is in the tracker issue only; no ADR,
      ontology line or glossary row records it, so a reader of the model cannot find where a
      parentless Bug or Chore lives in between.
    suggested_fix: >-
      Either narrow the recovery to what the play and the model can back (file it under the Story it
      serves, or as a Story that /shape-slice then places), or have the product owner record the
      interim place of a Bug or Chore in an ADR and the ontology (via /edit-ontology), and name
      which play places it. The owner decides; the reviewer shows the gap.

  - id: H-6
    severity: P3
    file: .garura/user-provided/managing-work.md
    lines_hint: "the added bullet 'An Epic stands for one slice ...': 'Work that blocks the plan gets its own Epic (its own slice), is delivered there, and merges back into the plan branch it spawned from'"
    category_note: "documentation category owns the file; raised here because categories.yaml says to raise a divergence from ADR 049 under harness. The play files (SKILL.md, ice.md) do not carry the blocker rule."
    principle_violated: [PR-2, PR-6]
    committed_source: "plan/788/base:docs/adr/049-...md Decision item 1; glossary row 'Slice'; docs/standards/harness-standard.md p8"
    severity_basis: "pr.md bucket P3 (minor: a rule in a guide agents read that does not fit the accepted definition of a slice, no behaviour break)"
    finding: >-
      The guide says blocker work gets its own Epic 'as its own slice'. ADR 049 says a thing with no
      screen or surface a person can test end to end is not a slice, and /shape-slice does not shape it;
      the plan play makes an epic only for a slice. Most blocker work (a chore, a bug fix, a tooling
      change) has no such vertical, so it cannot have an epic by this route. 'Merges back into the
      plan branch it spawned from' also does not match principle 8, where each issue (not an epic)
      is cut from plan/<id>/base and lands back on it. The guide is read by agents as a rule, so
      the mismatch will reach them.
    suggested_fix: >-
      Say what a blocker is in the model's words: a Story in an existing epic when it delivers a
      feature, a Chore or Bug under the Story it serves, or an epic only when it is a real slice.
      If the owner wants blockers to have their own epic whatever they are, record that as a change
      to ADR 049's slice definition.

  - id: H-7
    severity: P4
    file: core/components/plays/shape-plan/SKILL.md
    lines_hint: "Step 8, line 363: 'check_tracker.py exit 1: a label or a wrong type is REC11, a deleted or closed moved-out story is REC6'"
    principle_violated: PR-4
    committed_source: "plan/788/base:docs/standards/harness-standard.md principle 5; base SKILL.md Step 8 (each exit-1 cause names its recovery)"
    severity_basis: "pr.md bucket P4 (nit: the case is nearly unreachable, because Step 2 already stops on misplaced work)"
    finding: >-
      check_tracker.py now also exits 1 for misplaced work ('epic #n holds #m "title", which is not a story of
      its slice') and for a story that is not a sub-issue of its epic. Step 8's routing line names
      neither, so a run that meets one after the writes has no line telling it which recovery
      applies. REC12 says 'stop before any tracker write', which no longer fits a hit after the writes.
      (The sub-issue mismatch was unrouted at base too.)
    suggested_fix: "Add one clause to the Step 8 routing line: misplaced work found at this step is shown to the person as at Step 2 (REC12), and the run closes HALTED."

checked_and_no_finding:
  - "Harness principle 6 (nothing is blocked): the new stop could look like a block. Principle 6 is about gaps in the product model; the play already stops on a duplicate or a missing marked issue (REC2 at base), and #879 (REQ-1) asks for this stop. Noted, not raised."
  - "C13 now carries two guarantees (marked by type; an epic stands for its slice) with F11 and F12 each mapped to it. Traceability still works (lint-play clean per layer1-findings.yaml); not raised."
  - "Issue references such as '#879' in ice.md: base-ref files carry the same kind of reference (ice.md '#875', '#796'). harness-standard p11 deletes notes of origin that point to source paths, not issue numbers."
  - "Misplaced work is computed from the epic's direct sub-issues only (find_work_items.py); the children of its stories are not walked. This matches PR-1 (the work under a story hangs from that story)."
  - "Layer 1 linters (lint-components, lint-play) and the data-safety review of the scripts are run by the play and the executable-code category, not here."
