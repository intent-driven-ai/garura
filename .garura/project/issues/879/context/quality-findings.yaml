    changed_paths_count: 26
    result: "P1=0 P2=0 P3=0 P4=0, CODE-20 catch-all=11, errors=0, scan_coverage 1.0"
    blind_spot: >-
      The taxonomy classifies every path under core/components/** as artifact type garura-prose
      (first match wins). That swallows the 8 Python files (4 scripts, 4 tests) of this PR, so the
      grep rules are ineligible on them and the authoritative scan returns zero. The zero is a
      statement about the taxonomy's scoping, not proof the code is clean. Advisory re-run below.
