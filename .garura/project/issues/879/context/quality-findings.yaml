      Scratch copy of pr.md with core/components/** taken out of garura-prose, run on the 8 .py
      paths only (not authoritative, nothing written to the repo). Every grep rule: 0 hits.
      Path-only rules fired as checklist rows (ARCH-02/03/08, CODE-03/04/09-15/17/19, FE-16);
      their evidence was gathered by hand below.
  tests_run:
    - {file: test_check_tracker.py, passed: 11, failed: 0, exit: 0}
    - {file: test_find_work_items.py, passed: 12, failed: 0, exit: 0}
    - {file: test_render_brief.py, passed: 12, failed: 0, exit: 0}
    - {file: test_write_work_items.py, passed: 22, failed: 0, exit: 0}
