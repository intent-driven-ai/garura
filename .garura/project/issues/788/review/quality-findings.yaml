findings:
  - id: QF-1
    category: documentation
    file: .garura/user-provided/managing-work.md
    line: 138
    severity: P3
    basis: >
      by-hand check "completeness / consistency against ADR 049" (categories.yaml, documentation);
      ADR 049 section 4, docs/adr/049-a-slice-is-shaped-then-planned-then-given-its-eval.md line 53;
      severity by taxonomy bucket P3 (wrong documentation)
    defect: >
      Line 138 (new section "How is a change checked?", item 2) says "The agents that build never
      read the issue's folder." The issue's folder is .garura/project/issues/<issue>/. ADR 049
      section 4 says the build play's context sub-agent collects the context into that same folder
      ("the issue's short-term memory, .garura/project/issues/<issue>/") and "the builder reads the
      story and that collected context". So as written the rule forbids what ADR 049 requires, and
      it also bars the builder from the folder where its own context is put. A reader cannot tell
      which is meant, and the isolation rule that matters (keep the acceptance check away from the
      builder) is stated too widely to follow. Fix: narrow it to the check, for example "The agents
      that build never read the issue's evidence/eval/ folder", matching the path named on line 134.
    evidence: 'managing-work.md:138 "2. The agents that build never read the issue''s folder."'
  - id: QF-2
    category: documentation
    file: .garura/user-provided/managing-work.md
    line: 12
    severity: P3
    basis: >
      by-hand check "terminology consistency / completeness" (categories.yaml, documentation);
      severity by taxonomy bucket P3 (wrong documentation)
    defect: >
      Line 12 says Garura's work follows "the product model Garura offers (ontology v7". The
      ontology at HEAD is version 12 (core/components/memory/standards/schemas/product-os/ontology.md,
      front matter "version: 12"), and ADR 049 says the Slice, Plan and Epic wording this page now
      uses landed in v9 and v10. A reader following the pointer to check a term finds a different
      version than the page names, and v7 predates the model the page now describes. Fix: name the
      current version (v12), or drop the number and point at the file, so it stops going stale.
    evidence: 'managing-work.md:12 "(ontology v7,"; ontology.md line 3 "version: 12"'

