ice_impact: >
  The product ICE does not change (v9, v10). What changes is how its parts are routed so that the
  routing table in docs/philosophy/idd-principles.md holds word for word: the plan play reads all
  of both ICE once; the Story gets goal, limits, expectations and Context guidance; the hidden file
  gets the failure conditions and one recovery condition each; the build play's context sub-agent
  and the builder never read an ICE page or the evals folder; the eval play reads the epic, the
  stories and the hidden file; the running eval reads the eval, the guide, the Context guidance in
  the eval and only the recovery parts. The ICE of /shape-slice and /build-epic change in meaning
  when they are rebuilt; the plan play and the eval play get their ICE when they are built.
business_intent_check: kind
business_intent_check_why: >
  The Business Intent kind changes: "a slice serves it" (the link kept on the slice's side only),
  it is a destination, and it has exactly one plan. No person's business intent text changes: the
  v9 and v10 commits (86c78ff9, 7d73c947, 573deea6, 8bf0160b, cfc2a2b7, f5762b1a) touch no file in
  .garura/product/product-os/intents/.
related: [ADR 017, ADR 022, ADR 027, ADR 031, ADR 047, ADR 048, "#788", "#816", "PR #823", "#822", "#826", "PR #827", "#828"]
held_true: docs/philosophy/idd-principles.md "The Routing Table" (lines 122-141) — not changed by this ADR
alternatives_from_record:
