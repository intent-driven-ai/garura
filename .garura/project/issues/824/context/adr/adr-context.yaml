decided_in: "#824 (records ontology v9, #816 / PR #823, and v10, #826 / PR #827, both with the product owner, plan #788)"
supersedes:
  - id: "048"
    part: >
      in part — Decision §2, first paragraph: "A Plan is given one business intent. It picks the
      slice or slices that best serve it, by two tests ... It creates one Epic for each slice it
      picks"; and, in its "What this changes in older ADRs" list, the ADR 022 line "the Plan's
      first test refuses a slice with none". The slice definition in §2 stands. §1, §3, §4, §5 stand.
amends:
  - id: "017"
    part: >
      §1 "Strict .garura/ folder whitelist" — under .garura/project/ the whitelist gains plans/:
      one file <id>.yaml for each plan and its folder <id>/ with evals/<slug>/ (the eval and the
      hidden file failure-and-recovery.md) and guides/<slug>.md. The rest of §1 stands.
not_affected:
  - id: "047"
    why: >
      The ICE keeps its three parts and its place (v9 and v10 both say "The ICE does not change").
      §2's Intent "what counts as failing" and Context "rules for the sub-agent that gathers
      context" are what this ADR routes; nothing in 047 is replaced.
  - id: "048 §3"
    why: >
      "When a story is made, it writes its own scope of work from its feature's ICE and its
      capability's ICE" and "No work item carries an ICE" still hold. This ADR adds to it: the
      plan play writes the story, the story also holds Context guidance, and never a failure or
      recovery condition. Not a contradiction, so not amended; stated in the Decision.
  - id: "022, 028, 019, 024"
    why: already amended or superseded in part by ADR 048 on the same points; this ADR changes 048's own line on 022 only.
