    - core/components/memory/standards/rules/naming.md     # prose half: `remove` joins the skill-verb list
    - core/components/memory/standards/rules/naming.yaml   # machine half: skill.verbs gains `remove` with a meaning
    - core/components/memory/standards/rules/direct-model-write.md   # NEW in round 2 (commit c1648337): names two more writers of the spine
  change_in_one_line: >
    The naming standard gains one skill verb, `remove`, in both halves (unchanged since round 1: both naming diffs
    are byte-identical to round 1). The direct-model-write contract gains an "Outside a play" paragraph that names
    `link-model-part`'s script (link_part.py) and `remove-model-part`'s script (remove_part.py) as writers of the spine,
    and drops the sentence "Outside a loop, the play's keyed script is still the only writer of shared files".
