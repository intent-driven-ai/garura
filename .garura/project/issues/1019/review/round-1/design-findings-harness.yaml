  principle: Plays orchestrate, agents gather context and call skills, skills do the work; a skill is model-invocable
    only, through an agent; hand-offs are file paths in a JSON contract.
  sources:
  - path: docs/standards/harness-standard.md
    ref: main
    lines: 33-41 (principle 2)
    kind: base ref
  - path: docs/adr/005-skills-as-capabilities.md
    ref: main
    lines: Invocability Rules 1-3
    kind: base ref
  - path: docs/adr/016-agent-json-contract.md
    ref: main
    lines: 'Decision: Input and Output Contract'
    kind: base ref
- id: H2
  principle: Mechanical work is a script; a model is used only where judgment is needed.
  sources:
  - path: docs/standards/harness-standard.md
    ref: main
    lines: 42-49 (principle 3)
    kind: base ref
- id: H3
  principle: Build the eval first and run it first against today's code, where it must fail.
  sources:
  - path: docs/standards/harness-standard.md
    ref: main
    lines: 60-67 (principle 5)
    kind: base ref
- id: H4
  principle: Agents work only from memory; a skill reads only what its agent puts in short-term memory.
  sources:
  - path: docs/standards/harness-standard.md
    ref: main
    lines: 98-106 (principle 9)
    kind: base ref
- id: H5
  principle: Installed parts name only installed files, never Garura's source or docs.
  sources:
  - path: docs/standards/harness-standard.md
    ref: main
    lines: 116-137 (principle 11)
    kind: base ref
  - path: CLAUDE.md
    ref: main
    lines: Behavioral Rules 1, Source of Truth
    kind: base ref
- id: H6
  principle: 'One name, one meaning: verb first, then the object in the model''s words, each verb with one meaning.'
  sources:
  - path: .garura/project/issues/1019/context/memory/grounding-harness/standards/rules/naming.md
    ref: phoenix c14f515d910f
    lines: 19-25 (rules 2 and 3)
