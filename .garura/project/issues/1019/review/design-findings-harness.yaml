severity_basis: Class by the bucket definitions of the taxonomy copy .garura/project/issues/1019/context/memory/standards/rules/pr.md
  (lines 7-11). No row of its Severity Table maps a design-conformance finding, and its F3 rule (reject a finding
  with no Standard ID) governs check-pr-quality's scan, not this layer. P1 = blocker (security, secrets, data loss,
  breaking contract); P2 = major (structural violation, lint error, missing tests); P3 = minor (missing docs, naming);
  P4 = nit (tech debt, style).
