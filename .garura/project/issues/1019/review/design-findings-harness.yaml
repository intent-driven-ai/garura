- id: F3
  severity: P3
  file: core/components/skills/author-intent-page/SKILL.md
  lines: SKILL.md 33 and 54; scripts/write_page.py 181-182
  principle: H8. An intent page holds the parts of the Business Intent kind; the acceptance criterion is 'in the
    shape of the ontology's Business Intent'.
  basis:
  - path: .garura/project/issues/1019/context/memory/grounding-harness/standards/schemas/product-os/ontology.md
    ref: phoenix c14f515d910f
    lines: '181-196 (the eleven properties: Title, Outcome, Why, Asked by, Proof it is met, Must not, Rules, Stage,
      Confirmed by and when, Touches, What was done); relationships 199-210 name no Serves line from an intent'
    kind: memory tool copy
  - path: git grep '**Serves:**' main
    ref: main
    lines: no intent page and no template on main has a Serves line; the only 'serves' on a page is the plan template's
      own field (standards/templates/work-plan.md:19)
    kind: base ref check
  what: 'The skill writes a **Serves:** line (for example #539) between Rules and Identified by. The Business Intent
    kind has no Serves property or relation. Slices and capabilities serve an intent; an intent does not serve another.
    Grounding for what the line means is unavailable from committed sources, and no reader (find-model-gaps, the
    model linter, the review tool) is known to read it.'
  why_not_higher: The line is optional and is written only when the caller gives it, so a page that does not use
    it is in the ontology's shape. P3 (a page part with no definition), not P2.
  fix: Drop serves from the skill, or define the line in the ontology first (through /edit-ontology; this story
    may not change it) and then write it.
  status: open, unchanged; the product owner kept the Serves line as plain text for now (their decision, not a defect).
    Recorded, non-blocking.
