tests_seen: 'python3 -m unittest discover -s core/components/skills/remove-model-part/scripts -p test_remove_part.py:
  63 tests, OK (run at the new head).'
checks_passed:
- principle: H1
  result: pass
  how: 'All three SKILL.md carry user-invocable: false, model: sonnet, allowed-tools: Read, Bash, the Input / Process
    / Output / Rules sections and a script path run as ''python3 scripts/<script>'', the same shape as the sibling
    link-model-part, link-model-gaps and enrich-grounding. Both agent files list the skills in their skill table
    and their intent-to-skill table (project-orchestrator also in its memory-needs table; product-os-keeper also
    in its never-rules). The hand-offs are request, report and output file paths, not data.'
- principle: H2
  result: pass
  how: Each skill is a thin wrapper over one deterministic script (write_page.py, remove_part.py, remove_plans.py).
    No judgment is asked of the model; the agent rows say the words come from a person-approved draft or request.
- principle: H3
  result: pass
  how: .garura/project/issues/1019/evidence/eval/eval-before.json records 16 passed and 68 failed against the code
    before the build ('no script ... remove_part.py'); eval-after.json records 87 passed, 0 failed. The eval was
    committed first (939bced7). The review re-runs the eval; these are recorded numbers.
- principle: H4
  result: pass
  how: 'No skill reads memory. project-orchestrator''s memory table says ''remove-plan: nothing from memory''; product-os-keeper''s
    last row (''any other skill: the memory files its inputs name'') covers the other two.'
- principle: H5
  result: pass
  how: grep of the three SKILL.md and their scripts finds no core/components, core/tools, docs/ or .claude/ path
    (the one '#539' is an issue number in an example). lint-components (layout source) reports no violation whose
    file is in changed_paths; its 36 errors are in other files ('there before').
- principle: H6
  result: pass for the skill names
  how: remove-plan, remove-model-part and author-intent-page are verb-first; their objects are model words or follow
    the base precedents link-model-part and author-knowledge-page. Whether the new verb's meaning in naming.yaml
    is one meaning is the memory dispatch's check.
- principle: H10
  result: pass
  how: remove-plan is not a builder, a build skill or a context sub-agent. Its script counts names under a plan's
    folder with os.scandir and chmod, and opens no file there (open() appears only for the plan YAML, the report
    and the request). The read rule of ADR 049 section 4 holds.
- principle: H13
  result: pass
  how: 'ICE-source rule: no compiled play SKILL.md is in changed_paths. install.py (install-garura, which has no
    reference/ice.md on main) gains three names in the harness skill allow-list; the harness scope already lists
    product-os-keeper and project-orchestrator, so the agents that carry the skills are installed with them. The
    deployed .claude/ copies are untouched.'
- principle: H7
  result: pass on the product owner's rule, with a gap in the record (see F1)
  how: The base keeper rule says the model changes only through a skill and 'the missing skill is built, never worked
    around'. The new writer is a deterministic script, the LLM only passes a request, and it writes only inside
    product-os with an all-or-nothing undo.
- principle: Never-remove exception
  result: pass
  how: The new exception in product-os-keeper's 'Remove a node' rule (line 186) is consistent with ADR 033 section
    2 ('A dropped piece leaves the model') and with ontology line 223 only if a person decides; the skill refuses
    a request with no approved_by.
- principle: H8/H9 (round 2)
  result: pass
  how: remove-model-part writes no metadata.merged_from. grep of core/ and docs/ finds merged_from only in the tests
    that assert it is absent. SKILL.md, the script header and the keeper row all drop the claim that the issue number
    stays on record, so the three agree with the code. The 'removed id stays nowhere' rule is now one rule with
    no exception, and places() has no special case.
- principle: H7 (round 2)
  result: pass on what the paragraph says about the two scripts, with two flaws (F1, F8)
  how: direct-model-write.md now names link-model-part and remove-model-part as writers outside a play. 'Keyed by
    its request', 'writes only inside product-os', 'refuses any path outside' and 'lists every file it changed'
    are true of both scripts (link-report.json, remove-report.json). The remove-model-part list (repoint, merge,
    remove an intent page, a capability page, a slice and its record) and 'its request must name the person who
    approved it' match the code.
