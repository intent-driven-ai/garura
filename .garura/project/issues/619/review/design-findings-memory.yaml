# review-change Step 3, Layer 2 (round 2) - design-grounding for category: memory (PR #629, base: main)
# Grounding rule: every source was read from the base ref (git show main:<path>) or the resolved
# memory standards (~/.garura/core/memory/standards/rules/pr.md). Nothing is grounded in ADR 030,
# the branch's edits to idsd.md / ADR 029, or the new work-plan template / rules themselves.
category: memory
round: 2
playbook: review/memory
severity_basis: >
  standards/rules/pr.md bucket definitions (P3 = missing docs / naming; P4 = nit). No Severity
  Table row targets templates/, rules/ or tools/ prose, so buckets come from the prose
  definitions and are flagged "no-row".
changed_files:
  - core/components/memory/standards/rules/work-plan.md
  - core/components/memory/standards/rules/_index.md
  - core/components/memory/standards/templates/work-plan.md
  - core/components/memory/standards/templates/_index.md
  - core/components/memory/tools/github/adapter.md
  - core/components/memory/tools/gitlab/adapter.md

grounding:
  - id: G1
    principle: "A template defines the SHAPE of an output artifact; it must not define which artifacts get produced or rules for artifact content (those are play/skill contract and rules/)."
    source: "main:core/components/memory/standards/templates/_index.md, section 'When to Add Here'"
  - id: G2
    principle: "rules/ = how an artifact must be structured and enforced; a rules file must be enforced by at least one skill and be the single source of truth for its domain."
    source: "main:core/components/memory/standards/_index.md (Layout principle); main:core/components/memory/standards/rules/_index.md, section 'When to Add Here'"
  - id: G3
    principle: "Index rows name the concrete skills/agents that consume the file."
    source: "main:core/components/memory/standards/templates/_index.md (Consumers column of every row)"
  - id: G4
    principle: "'plan' on main means the build-plan DAG (specs/implement/plan.yaml); rules/_index reserves plan.md for it; 'checkpoint' means the human approval gate with its own template."
    source: "main:core/components/plays/implement/SKILL.md; main:core/components/memory/standards/rules/_index.md (Deferred follow-ups); main:core/components/memory/standards/templates/checkpoint.md"
  - id: G5
    principle: "Paired platform tool docs (tools/github, tools/gitlab) mirror each platform difference for a verb."
    source: "main:core/components/memory/tools/github/adapter.md (attach-sub-issue); main:core/components/memory/tools/gitlab/adapter.md (view-issue closed_at note)"
  - id: G6
    principle: "Templates are timeless canonical shapes with no work-in-progress notes."
    source: "main:core/components/memory/standards/templates/{pr-body,commit-message,checkpoint,github-issue,knowledge-file}.md"
  - id: G7
    principle: "Work-kind vocabulary: Business Intent, Feature, Story, Bug, Spike, Chore."
    source: "main:.garura/user-provided/managing-work.md"
  - id: G8
    principle: "A rules file may name consumers that are not yet wired only when it says so (precedent: no-unbacked-recommendation.md row says 'caught-not-yet-wired in /next')."
    source: "main:core/components/memory/standards/rules/_index.md (no-unbacked-recommendation.md row)"

