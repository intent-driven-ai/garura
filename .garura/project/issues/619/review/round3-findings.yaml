findings:
- id: QF-12
  severity: P4
  category: executable-code
  basis: 'review/code rubric: deterministic where it claims to be; ADR 030 section 7 says the check confirms the parent plan names the issue (round 2 QF-12, narrowed)'
  summary: 'Partly fixed. A serves_item that names no open item now fails unless the parent''s Done list names the issue (commit cf8b8965; test ''has no open item 1'' passes). But the Done list lines carry
    no item number (templates/work-plan.md, ''### Done''), so a wrong number for a finished item still passes. Reproduced on copies of the real plans: serves_item set to 99 in the 619 plan, check_plan.py
    returns valid=true, problems=[], because the 606 Done list names #619. Accept and say so in the check_plan.py docstring or manage-plan SKILL.md, or add the item number to Done lines.'
- id: QF-13
  severity: P4
  category: tests
  basis: 'review/tests rubric: changed behavior should be asserted (round 2 QF-13, narrowed)'
  summary: 'Mostly fixed. test_view_issue_version_probe (commit 8fd55372) covers the GitHub wiring: probe runs first, tree fields follow the version, tree_available is returned (35 passed; removing the
    tree_available key makes the test fail). Still open: the GitLab path of dispatch() is not tested. Mutation check on a scratch copy: dropping the ''platform == GITHUB'' guard so GitLab also runs ''gh
    --version'' still gives 35 passed, 0 failed. This is the regression QF-13 named. The file header (lines 4-7) also still says dispatch() is not exercised. Add one GitLab dispatch case (no ''gh --version''
    call, tree_available false) and update the header.'
- id: R3-01
  severity: P4
  category: docs
  basis: 'pr.md P4 nit (wording); round 2 memory N1 asked that unwired parts be marked as not yet present; glossary.md and manage-plan/SKILL.md now say ''planned, #622'''
  summary: 'rules/work-plan.md rule 14 is annotated ''(built in #622)'' and the banner says the plays ''are built in #622''. With no ''not yet'' beside it, this reads as already built, while the glossary
    and manage-plan say ''planned, #622''. Use the same word everywhere (''planned in #622'').'
- id: R3-02
  severity: P4
  category: docs
  basis: pr.md P4 nit; round 2 harness N3 fix changed create step 1, leaving the Constraints line behind
  summary: manage-plan/SKILL.md line 111 still says 'Create refuses when a plan exists', but create step 1 (line 48) now writes nothing, runs the check and returns the existing plan's paths. Refusal and
    return-the-plan are different results to a caller. Change line 111 to match step 1.
- id: R3-03
  severity: P4
  category: docs
  basis: CLAUDE.md Rule 3 (cite or do not claim); same class as the GitLab wording fixed in b15a1b63; pre-existing on main, in files this PR edits (optional to fix here)
  summary: gitlab/adapter.md lines 111-113 and platform-adapter/reference/gitlab/verbs.md lines 154-156 still state flatly that GitLab has no parent/child sub-issue hierarchy, with no source. The reworded
    view-issue text two sections above says GitLab's work-item hierarchy 'has not been mapped or tested', so the two now disagree. Reword the same way.
