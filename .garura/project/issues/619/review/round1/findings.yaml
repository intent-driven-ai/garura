- id: H1
  severity: P2
  file: core/components/agents/project-orchestrator.md (Plan Context, step 1) and
    core/components/skills/manage-plan/SKILL.md (Input, plan context file)
  principle: 'G5 -- the wiring must hold. The agent is told ''manage-issue (action:
    read) ... returns issueType, parent, and subIssues'' and the skill needs the issue
    body, but manage-issue was not changed.'
  basis: 'main:manage-issue/templates/issue-output.md defines the read output as number,
    title, labels, state, body_summary (first 200 chars), url, created, closed, parent_issue
    (only the parent attached on create). It has no issueType, no parent object, no
    subIssues, and no full body. manage-issue/SKILL.md ''read'' says only ''Parse
    and return structured output''. diff main...HEAD touches platform-adapter (view-issue
    fields) but not manage-issue. So the data reaches platform-adapter output but
    the next link in the chain drops it.

    '
  effect: Plan Context steps 1-3 (type, parent, children) and the plan's 'issue.body'
    input cannot be built as described.
  suggested_fix: Extend manage-issue read and templates/issue-output.md to pass issueType,
    parent, subIssues (and the full body), or have the agent read view-issue output
    directly through platform-adapter.
  category: harness
- id: H2
  severity: P3
  file: core/components/agents/project-orchestrator.md (Handling Ambiguity; Plan Context)
  principle: G1 -- the agent is autonomous per intent, 'one intent, one skill', and
    does not follow multi-step workflows.
  basis: 'main:project-orchestrator.md Core Principle (''You do NOT follow step-by-step
    workflows. Plays define workflows''), Boundaries NEVER (''Follow multi-step workflows
    -- that''s play responsibility'') and ALWAYS (''one intent, one skill''). The
    branch adds a six-step numbered procedure that issues 2+N manage-issue reads then
    one manage-plan call, and patches only the ''Don''t chain'' bullet. The NEVER/ALWAYS
    lines stay unchanged and now contradict the new section. Context gathering is
    a legitimate agent role (main:CLAUDE.md rule 4), so the intent is defensible;
    the drift is the unreconciled contradiction inside the same file.

    '
  suggested_fix: Reconcile Boundaries (and the Decision Framework steps, which still
    read 'invoke skill -> enrich type_hint -> write output') with the Plan Context
    exception, or move the gather steps into the play that dispatches plan intents.
  category: harness
- id: H3
  severity: P3
  file: core/components/agents/project-orchestrator.md (Plan Context)
  principle: G4 -- every dispatch to an agent is the Agent JSON Contract with named
    stm.input / stm.output keys.
  basis: 'main:ADR 016 and main:project-orchestrator.md Contract Mode. The new section
    defines the output key (stm.output.context) but says nothing of how the caller
    passes action (create/update/check), issue, and change; the agent''s intent table
    matches on free text (''plan this issue''). Also ''Intent Recognition'' and ''Intent
    to Skill Mapping'' on main list only the issue and mapping examples, with no plan
    examples.

    '
  suggested_fix: Name the stm.input keys (action, issue, change) for plan intents
    and add plan lines to Intent to Skill Mapping.
  category: harness
- id: H4
  severity: P3
  file: core/components/skills/manage-plan/SKILL.md (Process, first paragraph)
  principle: G2 -- skills reference LTM through an explicit stable path, or are handed
    the path by the agent; they do not search LTM.
  basis: 'main:ADR 009 Rule 3 and Skill Reference Pattern; main:docs/components/skills.md
    ''LTM Template Pattern''. manage-plan says ''standards/templates/plan.md (resolve
    it from LTM)'': no explicit path, and no template_path in its Input table. manage-issue
    on main writes the full path ~/.garura/core/memory/standards/templates/github-issue.md.

    '
  suggested_fix: Write the explicit LTM path (as manage-issue does) or add template_path
    to Input, set by the agent.
  category: harness
- id: H5
  severity: P3
  file: core/components/skills/manage-plan/SKILL.md (Output)
  principle: G3 -- skills validate silently and return an output contract of artifact
    paths.
  basis: 'main:docs/components/skills.md ''Silent Validation'' (''do NOT output validation
    results ... to their caller'') and ''Output Contract Pattern''. For create and
    update the skill returns ''the check report'' to the caller, and for check returns
    an inline JSON report unless report_path is given. The check action as a reported
    result is reasonable; returning the report on create/update is the departure.

    '
  suggested_fix: For create/update return plan_path and status only; keep the report
    for action check (or write it to report_path and return the path).
  category: harness
