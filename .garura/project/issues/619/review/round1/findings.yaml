- id: M1
  severity: P3
  file: core/components/memory/standards/templates/plan.md
  lines: intro paragraph; '## Rules' items 5, 6, 8
  principle: G1, G2 - a template carries shape, not contract or lifecycle policy.
  basis: 'The template opens with "Every drive and every play writes one before it
    works, keeps it up to date while it works, and is done only when its plan is done",
    and Rules 5 (kept current), 6 (every plan names what it serves) and 8 ("done means
    the plan is done") decide WHICH work must produce the artifact and WHEN it is
    done. templates/_index ''When to Add Here'' says a file does NOT belong in templates/
    if it "defines WHICH artifacts to produce (that''s play / skill contract territory)"
    or "defines rules for artifact content (that''s rules/)", and rules/_index already
    reserves `plan.md` there as a deferred follow-up. Rules 1-4 and 7 are legitimate
    field rules (cf. pr-body ''Field Rules''); 5, 6, 8 are not.

    '
  suggested_fix: Keep the shape + field rules in templates/plan.md; move the lifecycle
    rules (kept current, serves-chain, done-means-plan-done) to rules/plan.md or the
    manage-plan / play contract, and link from the template under a '## Related' section
    as base templates do.
  taxonomy_row: none (bucket definition)
  category: memory
- id: M2
  severity: P3
  file: core/components/memory/standards/templates/plan.md
  lines: title, whole file; '### Checkpoint:' block
  principle: G4 - naming clarity; overloaded terms.
  basis: 'On main, ''plan'' means the build-plan DAG of file-level pieces (specs/implement/plan.yaml,
    rules/_index ''plan.md - DAG, file-level changes, tests'') - i.e. HOW. The new
    template defines ''plan'' as strictly never-how, in the same specs/ directory,
    and the glossary on main has no ''plan'' entry to disambiguate. It also reuses
    ''Checkpoint'' for a "nothing below starts before this point" barrier, while ''checkpoint''
    on main is the human-approval gate with its own template. Two readers (or two
    agents) loading ''the plan'' / ''a checkpoint'' can pick the wrong artifact.

    '
  suggested_fix: Add a glossary entry that separates plan (what/order/why) from build-plan
    (plan.yaml) and rename the barrier heading (e.g. 'Gate' / 'Hold point'), or state
    the difference in the template's opening lines.
  taxonomy_row: none (bucket definition)
  category: memory
- id: M3
  severity: P3
  file: core/components/memory/standards/templates/_index.md
  lines: new `plan.md` row (Consumers column)
  principle: G3 - Consumers name the concrete skills/agents that instantiate the template.
  basis: 'The new row lists consumers as "every drive and play (plan mode, being designed
    in #619)". Every other row on main names real skills/agents (e.g. `submit-pr`,
    `analyze-pr`; `knowledge-extractor`, `capture-learning`). The one skill that instantiates
    the template (`manage-plan`) is not named, and "being designed" is live status
    prose in a lookup index agents query for ''what does the output artifact look
    like?''. An agent filtering the index by consumer will not find manage-plan.

    '
  suggested_fix: 'Consumers: `manage-plan`, `project-orchestrator`. Drop the ''(being
    designed in #619)'' note.'
  taxonomy_row: none (bucket definition)
  category: memory
- id: M4
  severity: P4
  file: core/components/memory/standards/templates/plan.md
  lines: 'second paragraph (''Starting point: locked by Kapil on 2026-10-08 ... still
    being decided in #619; this file will be updated as those land.'')'
  principle: G6 - templates are timeless shapes, not work-in-progress notes.
  basis: 'None of the base templates carry a design-status or ''will be updated''
    note; provenance, where kept, is stated as a work context. This paragraph is change-history
    for #619 and points an LTM artifact at an STM file (.garura/project/issues/606/specs/plan.md).
    It will be wrong the moment #619 closes, and the same status is already recorded
    in the issue and commit messages (CLAUDE.md: direct-edit history belongs in commit
    + issue, not in the artifact). A weak precedent for an STM example path exists
    (approval-prompt.md lists 214/specs paths), hence P4, not P3.

    '
  suggested_fix: 'Delete the paragraph, or reduce it to a one-line provenance (''Provenance:
    #619'') in the knowledge-file style.'
  taxonomy_row: none (bucket definition)
  category: memory
- id: M5
  severity: P3
  file: 'core/components/memory/tools/github/adapter.md (paired file not changed:
    core/components/memory/tools/gitlab/adapter.md)'
  lines: view-issue section
  principle: G5 - GitHub and GitLab tool docs mirror platform differences for each
    verb.
  basis: 'The branch adds issueType/parent/subIssues/subIssuesSummary (gh >= 2.94.0)
    to the GitHub tool doc and adds a ''Gap: GitLab carries no equivalent'' note to
    platform-adapter/reference/ gitlab/verbs.md, but main:tools/gitlab/adapter.md
    § view-issue (which documents the closed_at difference) is left untouched. Callers
    reading the KB narrative for GitLab get no warning that the issue tree is GitHub-only,
    unlike attach-sub-issue where the GitHub doc cross-references the GitLab fallback.

    '
  suggested_fix: 'Add one sentence to tools/gitlab/adapter.md view-issue: no type/parent/sub-issue
    fields; issue-tree callers are GitHub-only.'
  taxonomy_row: none (bucket definition)
  category: memory
- id: M6
  severity: P3
  file: core/components/memory/tools/github/adapter.md
  lines: 'view-issue: ''they need gh 2.94.0 or newer'''
  principle: G5 (tool docs state verb semantics and caveats) + no prior minimum-version
    contract on main.
  basis: '`git grep` on main finds no stated minimum gh version anywhere in core/
    or docs/ (checked patterns for ''gh version'', ''gh >='', ''minimum ... gh'').
    The doc now introduces a first hard prerequisite, but only inside one verb''s
    prose, and the paired verbs.md says an older gh "rejects these fields" - meaning
    the whole view-issue call fails (it is one --json list), not just the tree fields,
    for every play that reads issues (archive bucketing uses closedAt). The memory
    doc does not say where the prerequisite is declared (install/doctor check) or
    what a caller should do on an older gh. The runtime breakage itself belongs to
    the harness/code reviewers (potentially P2 as a breaking verb contract); this
    finding covers only the missing documentation of the prerequisite.

    '
  suggested_fix: Say where the gh minimum is enforced (install-garura / preflight)
    and the expected failure mode, or make the tree fields a separate verb/opt-in
    so existing view-issue callers keep working on older gh.
  taxonomy_row: none (bucket definition)
  cross_category_note: 'Hand to executable-code / harness review: four platform_adapter.py
    copies now request the new fields unconditionally.'
  category: memory
- id: M7
  severity: P4
  file: core/components/memory/standards/templates/plan.md
  lines: 'front matter `now:`; Rule 4 (''"Now" is always set''); Rule 8; `status:
    {active | done | dropped}`'
  principle: 'Template internal precision (field rules must say what a field holds
    in every allowed state) - cf. main:templates/checkpoint.md, which marks nullable
    fields (`decision: null | ...`).'
  basis: '`status: done|dropped` is allowed but Rule 4 says `now` is always set, and
    no item can be ''now'' in a finished plan; Rule 8 defines done for the issue but
    not what a `dropped` plan means or how `now` reads then. The base checkpoint template
    states null-able fields explicitly.

    '
  suggested_fix: 'Write `now: {item number | null when status is done or dropped}`
    and adjust Rule 4 to ''while active''.'
  taxonomy_row: none (bucket definition)
  category: memory
