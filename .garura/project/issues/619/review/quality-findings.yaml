- id: QF-07
  category: executable-code
  severity: P4
  file: core/components/plays/merge-change/scripts/platform_adapter.py
  line: 119
  source: manual
  basis: 'review/code rubric: safe handling of external-service calls; core/components/memory/tools/github/adapter.md states gh >= 2.94.0'
  evidence: 'view-issue now asks gh for fields that need gh 2.94.0+ (installed here: 2.102.0). The requirement is documented only in adapter.md; no version guard, so on an older gh view-issue fails in merge-change,
    propose-change and review-change. GitLab view-issue was not extended (gap noted in gitlab/verbs.md).'
  standard_id: null
  round2_status: FIXED
  round2_evidence: dispatch() now probes gh --version and asks for tree fields only when gh >= 2.94.0 (GH_ISSUE_TREE_MIN), otherwise falls back to base fields and returns tree_available. GitLab gap is documented
    in gitlab/adapter.md line 74 and handled by manage-issue and project-orchestrator.
