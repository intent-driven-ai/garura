# categories derived from the diff (base plan/788/base), PR #858, anchor issue #841
categories:
  - name: harness
    design_bearing: true
    playbook: harness
    evidence:
      - core/components/agents/*.md (9 agents: environment-operator, evals-engineer, product-os-keeper, quality-auditor, scriber, tech-architect, tech-designer, test-engineer, test-runner)
      - core/components/skills/*/SKILL.md (about 60 skills: author-*, check-*, infer-*, scan-*, enrich-*, deploy-*, etc.)
      - core/components/skills/_shared/asking-a-person.md
      - core/components/plays/*/SKILL.md (build-epic, check-change, create-play, discover-*, edit-*, learn-outcomes, refactor-code, release-*, shape-*, validate-epic)
      - core/components/plays/_shared/play-close.md
      - core/components/loops/_shared/loop-run.md
      - core/components/plays/shape-slice/reference/ice.md
      - core/components/plays/create-play/references/workflow-structures.md
      - core/components/plays/edit-play/references/workflow-structures.md
      - core/components/skills/platform-adapter/reference/github/verbs.md
  - name: memory
    design_bearing: true
    playbook: memory
    evidence:
      - core/components/memory/standards/rules/* (naming, pr, evidence-recording, user-questions, pipeline-*, direct-model-write, rename-map.yaml)
      - core/components/memory/standards/schemas/** (expectation, product-os/*)
      - core/components/memory/standards/templates/*
      - core/components/memory/knowledge/review/harness.md
      - core/components/memory/knowledge/review/memory.md
      - core/grounding/glossary.md
  - name: decision-records
    design_bearing: true
    playbook: adrs
    evidence:
      - docs/adr/053-shape-scope-and-shape-roadmap-are-dropped.md
  - name: documentation
    design_bearing: false
    playbook: docs
    evidence:
      - CLAUDE.md
      - docs/components/agents.md
      - docs/components/plays.md
      - docs/components/skills.md
      - docs/philosophy/garura-reference-implementation.md
      - docs/standards/harness-standard.md
      - docs/agentic-methodology/tools/lint-components.md
      - docs/usage/skills/check-components.md
  - name: executable-code
    design_bearing: false
    playbook: code
    evidence:
      - core/components/plays/*/scripts/platform_adapter.py (copies)
      - core/components/plays/check-change/scripts/fetch_pr_context.py
      - core/components/plays/create-play/references/{fetch_pr_context,gate_eval,platform_adapter}.py
      - core/components/plays/install-garura/scripts/{install.py,adapters/*.py}
      - core/components/plays/shape-slice/scripts/render_brief.py
      - core/components/skills/check-pr-quality/scripts/scan_taxonomy.py
      - core/tools/lint-components/lib/rules/asking-a-person.js
      - installer/install.sh
  - name: tests
    design_bearing: false
    playbook: tests
    evidence:
      - core/components/plays/create-play/references/test_*.py
      - core/components/plays/create-loop/references/test_lint_loop.py
      - core/components/plays/install-garura/scripts/test_install.py
      - core/components/plays/shape-slice/scripts/test_render_brief.py
      - core/components/skills/check-pr-quality/scripts/test_scan_taxonomy.py
      - core/tools/lint-components/test/*.test.js
      - core/tools/naming/test_naming_tools.py
  - name: config-maps
    design_bearing: false
    playbook: config-maps
    note: "install manifest wires installed files by path"
    evidence:
      - .garura/install-manifest.json
  - name: run-records
    design_bearing: false
    playbook: null
    note: "playbook missing - short-term memory records of the change and review runs; records, not a standard"
    evidence:
      - .garura/project/issues/841/context/**
