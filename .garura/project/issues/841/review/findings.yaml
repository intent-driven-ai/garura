- id: M7
  severity: P4
  file: core/components/memory/standards/rules/pr.md
  where: BE-19 row (regex `(?-i:...)`)
  finding: 'Checked against the real scanner (re.IGNORECASE, with the scoped case-sensitive
    group). Still catches: SELECT ... FROM inside one quoted string (double, single,
    backtick; execute("SELECT count(*) FROM t")); JOIN x [AS] y ON. 25/25 tests pass.
    It misses: lowercase ''join a on b''; a quote inside the select list (''SELECT
    "id" FROM t''); mixed case ''Select a From t''; unquoted SQL (.sql files, a SELECT
    split across lines in the line scan). The row text states ''SQL-shaped code only'',
    which is true, but a reader may take it to mean all SQL. This is the trade the
    narrowing chose (fewer false hits on the words from/join); no row-level wording
    says what is missed.'
  principle: The taxonomy is mechanical and a row claims only what its match rule
    does.
  basis: plan/788/base pr.md head ('Mechanical rule ... If no Match Rule fires ...
    no finding')
  fix: Optional. Add 'quoted, upper-case SQL only' to the row text. SQL files are
    already covered by BE-20 (migrations path).
  category: memory
