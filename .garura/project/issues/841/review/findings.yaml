    9 (shared block lives once, parts point to it)
  fix: Keep a one-line pointer to _shared/asking-a-person.md in the template (a pointer
    to an installed file is not memory) and keep the tiebreak sentence.
  category: memory
  status: settled by the product owner's decision (the template stands alone)
