  file: core/components/memory/standards/templates/approval-prompt.md
  where: removed lines 'The rule for how to ask is rules/asking-a-person.md ... When
    the two do not agree, the rule is correct' and the Related pointer
  finding: The template now repeats the question format (opening, four parts, plain
