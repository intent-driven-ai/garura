findings:
  - id: M7
    severity: P4
    file: core/components/memory/standards/rules/pr.md
    where: "BE-19 row (regex `(?-i:...)`)"
    finding: "Checked against the real scanner (re.IGNORECASE, with the scoped case-sensitive group). Still catches: SELECT ... FROM inside one quoted string (double, single, backtick; execute(\"SELECT count(*) FROM t\")); JOIN x [AS] y ON. 25/25 tests pass. It misses: lowercase 'join a on b'; a quote inside the select list ('SELECT \"id\" FROM t'); mixed case 'Select a From t'; unquoted SQL (.sql files, a SELECT split across lines in the line scan). The row text states 'SQL-shaped code only', which is true, but a reader may take it to mean all SQL. This is the trade the narrowing chose (fewer false hits on the words from/join); no row-level wording says what is missed."
    principle: "The taxonomy is mechanical and a row claims only what its match rule does."
    basis: "plan/788/base pr.md head ('Mechanical rule ... If no Match Rule fires ... no finding')"
    fix: "Optional. Add 'quoted, upper-case SQL only' to the row text. SQL files are already covered by BE-20 (migrations path)."
  - id: M8
    severity: P4
    file: docs/adr/053-shape-scope-and-shape-roadmap-are-dropped.md
    where: "section 5, ADR 033 bullet"
    finding: "The body of an accepted ADR was edited (current names `/discover-intent` and `/record-decision` swapped back to the quoted `/intent` and `/adr`). The old-name check now exempts ADR 053 (QUOTING_ADRS) on the ground that 'an accepted ADR is not edited (only a forward pointer)'. The edit is a restoring of a quote, not a new decision, so it is low risk, but it is a body edit the tool's own comment says is not done."
    principle: "An accepted ADR changes only by a forward pointer; a quote of an older record stays word for word."
    basis: "plan/788/base:core/tools/naming/check_old_names.py (past-record rule for ADRs 046, 048 and numbers below 46); ADR 053 on base"
    fix: "None needed; the restore matches the base ADR 033 wording. Mention it in the commit message so the edit is traceable."
conforming:
  - "pr.md ARCH-23/DOC-04/DOC-05 wording matches the scan's docs/adr skip."
  - "SEC-18 narrowed regex still catches isAdmin, hasRole(, hasPermission(, .can(, role == and role === (permission code); the plain word role, 'role = x', 'permissions: []' and 'can(user)' give no finding. Tests pass."
  - "ADR 054 reasoning fits ADR 035 and ADR 039: the asking rule is not memory, so no memory-tool read is bypassed; readers use the installed path _shared/asking-a-person.md."
