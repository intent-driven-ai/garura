# check-change Step 3, Layer 2 -- category: memory -- PR #827
# Grounded only in plan/788/base (committed) sources. Severity per rules/pr.md P1-P4.
category: memory
base: plan/788/base
principles:
  - id: G1
    principle: "IDD routing table: failure conditions go to eval author only (builder never); goal, constraints, all Context, success scenarios go to the builder; recovery reaches the builder only as the resulting handoff plan; validator checks via evals plus Context plus recovery conditions."
    source: "plan/788/base:docs/philosophy/idd-principles.md  'The Routing Table' (lines 122-141)"
  - id: G2
    principle: "Constraint vs failure rule: would knowing it change how the builder writes code? yes = constraint, no = failure condition. Validator reports symptoms, never condition ids."
    source: "plan/788/base:docs/philosophy/idd-principles.md  'Constraint-Failure Classification Rule' and 'Symptom-Based Feedback Protocol'"
  - id: G3
    principle: "The ICE stays in one place; a Story writes its own scope from two ICE rather than carrying a copy that can drift. No work item carries an ICE."
    source: "plan/788/base:docs/adr/048-the-product-model-and-the-work-are-two-layers.md  Decision 3 and Consequences (lines 45, 83)"
  - id: G4
    principle: "An ICE has three parts: Intent (Goal, Limit, Fails if), Context (Read, Never read, Persona, Scope), Expectation (Scenario, Done means, Quality need). It has no recovery lines. Recovery generation (one entry per failure condition) is defined for a play's Expectation."
    source: "plan/788/base:core/components/memory/standards/schemas/product-os/ice.yaml; docs/adr/047-the-ice-is-its-own-node.md; core/components/memory/standards/rules/expectation-generation.md (lines 3, 33-48)"
  - id: G5
    principle: "A change of a decided design needs a decision record that amends it."
    source: "plan/788/base:docs/adr/048-...md ('What this changes in older ADRs'); same basis as 816 finding M1"
routing_table_check:
  - row: "Goal (Intent): builder yes, eval author yes"
    result: holds
    note: "Story scope of work carries goals; eval play reads stories."
  - row: "Constraints: builder yes, eval author yes"
    result: holds
    note: "Story carries constraints (Limit lines); examples moved to true constraints."
  - row: "Failure conditions: builder never, eval author yes, validator via evals"
    result: holds_with_note
    note: "Off the Story; in hidden file only; Plan play writes, eval play reads, builder and the build context sub-agent barred. See M3 (file is plaintext, barrier by rule) and M5 (running eval reads the file that holds them)."
  - row: "Context: builder all, eval author yes, validator yes"
    result: holds
    note: "Context guidance on Story; context sub-agent collects it for the builder; eval carries it at run time."
  - row: "Success scenarios: builder yes, eval author yes, validator via evals"
    result: holds
    note: "Expectations stay on the Story."
  - row: "Recovery: builder only the handoff plan; validator builds it"
    result: holds
    note: "Q35: handoff plan from the recovery condition, never names condition, id or check; goes to builder or person."
  - row: "Encrypted evals: builder never; implementation: builder produces"
    result: holds
    note: "Builder never reads the eval or the evals folder."
unchanged_kinds_check:
  ICE: "Kind text unchanged. Line 473 'Only a Story reads it' is now incomplete: the Plan play also reads the ICE to write the hidden file (see M2). No other contradiction; ICE keeps its three parts and no recovery lines."
  Epic: "Unchanged and consistent: no ICE, title says what a person sees, read by the slice eval with its stories. No contradiction."
findings:
  - category: memory
    id: M1
    severity: P3
    path: core/components/memory/standards/schemas/product-os/ontology.md
    basis: "G5; ADR 048 Decision 3 (base). v10 adds a new artifact (slice hidden file), a new Story property (Context guidance), and narrows what a Story says, but adds no ADR or amendment. Same pattern as 816 M1 (rated P2 there because it reversed an accepted decision; here ADR 048 only says a Story writes its scope from two ICE, which still holds, so P3)."
    message: "Hidden file and Context guidance are new design decisions with no decision record."
    status: open
  - category: memory
    id: M2
    severity: P3
    path: core/components/memory/standards/schemas/product-os/ontology.md
    basis: "G3 and G4. ICE kind (line 444 and rule at line 473) still says 'a Story reads its ICE ... writes its own scope of work' and 'only a Story reads it'. v10 makes the Plan play also read both ICE to write the hidden file, and has the Story hold a copy of the Context lines (the ICE's rules for the context sub-agent)."
    message: "ICE kind not updated for the new reader (hidden file) and the second copy of its Context lines; two derived copies per ICE raise the drift ADR 048 wanted to avoid. The drift rule (rewrite together) mitigates it."
    status: open
  - category: memory
    id: M3
    severity: P3
    path: core/components/memory/standards/schemas/product-os/ontology.md
    basis: "G1. Routing table and IDD text say the barrier holds because evals are encrypted and failure conditions stay hidden from the builder. v10 keeps failure conditions in a plaintext file in the repo, protected only by the rule 'a builder never reads it'."
    message: "Barrier for the hidden file is by rule, not by encryption; state the enforcement (who checks it) or say it is deferred."
    status: open
  - category: memory
    id: M4
    severity: P3
    path: core/components/memory/standards/schemas/product-os/ontology.md
    basis: "G4. expectation-generation.md defines 'one recovery per failure condition' for a play's Expectation; an ICE has no recovery lines. v10 cites it for the Plan play writing story recovery conditions."
    message: "Rule is cited outside its stated scope (plays, not product ICE); the base rule does not yet cover this use."
    status: open
  - category: memory
    id: M5
    severity: P4
    path: core/components/memory/standards/schemas/product-os/ontology.md
    basis: "G1 (validator gets failure conditions 'via evals', not raw)."
    message: "The running eval reads 'the recovery conditions in the hidden file', but each entry sits beside its failure condition in the same file; say it reads recovery entries only."
    status: open
  - category: memory
    id: M6
    severity: P4
    path: core/components/memory/standards/schemas/product-os/ontology.md
    basis: "G4 (ICE words: Goal, Limit, Fails if) against Story words (goals, constraints)."
    message: "Story says 'constraints' where the ICE says 'limits'; one term would read clearer."
    status: open
