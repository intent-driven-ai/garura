findings:
- id: H2
  severity: P4
  file: core/components/plays/show-plan/scripts/test_check_tree.py
  line: 66-85
  summary: 'The check''s tests cover the all-finished case and one hiding failure,
    but not the two limits the rule names: a parent with an open child still hides
    its finished children, and nothing prints below the finished children (one level
    only). Only the plan tool''s tests cover them. The play''s eval SCE-6 covers the
    all-finished case only, so those limits depend on unit tests that are not part
    of the play.'
  basis: shared copy knowledge/review/harness.md rubric (evals cover the intent);
    the check re-derives the tree independently of the tool, so it needs its own cases
  category: harness
